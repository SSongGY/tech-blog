# 주제 백로그
# status: todo | writing | done
# ratio: DB/백엔드 60% + IT 전반 40% (blog.py pick이 이 비율을 맞춰 하루 2편을 고른다)
# angle: 일반론과 구별되는 이 글만의 각도. 이게 비면 글이 뻔해진다.

meta:
  target_ratio:
    core: 0.6      # Database, Backend, Performance
    general: 0.4   # Language, Infra, Architecture, Security, Tooling
  low_watermark: 10   # 트랙별 todo가 이 아래로 떨어지면 주제를 보충한다
  # 하루 편수는 blog.py의 daily_plan()이 정한다.
  # basics = DB 기본 문법 / product = DB 제품 기능(Tibero 7)
  # pe     = 정보관리기술사 시험 과목 기술 / general = 그 외 IT 기술
  # 하루 3편. 편성은 blog.py의 daily_plan()이 정한다.
  #   고정   : basics 1 (DB 기본 문법) + pe 1 (정보관리기술사)
  #   세 번째: product / linux / general 중 지금까지 가장 적게 쓴 트랙 1
  # 한 트랙이 소진돼도 나머지가 메우므로 편수는 줄지 않는다.
  posts_per_day:
    fixed: {basics: 1, pe: 1}
    rotating: [product, linux, general]
    total: 3
  # 제품 트랙은 한 제품을 끝내면 다음 제품으로 넘어간다. 그래야 소진되지 않고,
  # 같은 feature 키로 제품 간 비교 글이 이어진다.
  product_rotation: [Tibero 7, Oracle 19c, MySQL 8.0, PostgreSQL 16]

