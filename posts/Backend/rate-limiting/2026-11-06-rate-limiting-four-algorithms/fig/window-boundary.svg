<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="380" fill="#fbfaf7"/>

  <text x="40" y="32" font-size="18" font-weight="bold" fill="#1b1b1b">한도 "10초에 10건" — 경계 앞뒤 1초에 20건이 몰릴 때</text>
  <text x="40" y="54" font-size="13" fill="#444">9.5~9.95초에 10건, 10.0~10.45초에 10건. 초록은 허용, 빨강은 거절.</text>

  <!-- 행 이름 -->
  <g font-size="14" font-weight="bold" fill="#1b1b1b">
    <text x="40" y="76">고정 창</text>
    <text x="40" y="166">슬라이딩 로그</text>
    <text x="40" y="256">토큰 버킷</text>
  </g>

  <!-- 고정 창: 창 두 개 -->
  <rect x="80" y="86" width="380" height="46" fill="#f1efe9" stroke="#b9b4a8" stroke-width="1.2"/>
  <rect x="460" y="86" width="380" height="46" fill="#f1efe9" stroke="#b9b4a8" stroke-width="1.2"/>
  <text x="100" y="114" font-size="13" fill="#555">창 [0, 10) — 개수 10</text>
  <text x="600" y="114" font-size="13" fill="#555">창 [10, 20) — 개수 0에서 다시</text>
  <rect x="441" y="94" width="17" height="30" fill="#2d6a4f"/>
  <rect x="461" y="94" width="17" height="30" fill="#2d6a4f"/>
  <text x="490" y="150" font-size="13" fill="#9d0208">20건 모두 통과 — 1초 안에 한도의 두 배</text>

  <!-- 슬라이딩 로그 -->
  <rect x="97" y="176" width="380" height="46" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="110" y="204" font-size="13" fill="#1d4733">10.45초에서 본 직전 10초 — 이미 10건</text>
  <rect x="441" y="184" width="17" height="30" fill="#2d6a4f"/>
  <rect x="461" y="184" width="17" height="30" fill="#9d0208"/>
  <text x="490" y="240" font-size="13" fill="#1d4733">10건 통과 · 경계 뒤 10건 거절</text>

  <!-- 토큰 버킷 -->
  <rect x="441" y="274" width="17" height="30" fill="#2d6a4f"/>
  <rect x="461" y="274" width="3" height="30" fill="#2d6a4f"/>
  <rect x="464" y="274" width="14" height="30" fill="#9d0208"/>
  <text x="100" y="294" font-size="13" fill="#555">0초부터 가득 찬 10개 → 첫 묶음이 다 쓴다</text>
  <text x="490" y="294" font-size="13" fill="#b45309">10.0초에 1개 충전 → 11건 통과</text>

  <!-- 시간 축 -->
  <line x1="80" y1="330" x2="840" y2="330" stroke="#555" stroke-width="1.4"/>
  <g stroke="#555" stroke-width="1.2">
    <line x1="80" y1="325" x2="80" y2="335"/>
    <line x1="270" y1="325" x2="270" y2="335"/>
    <line x1="460" y1="325" x2="460" y2="335"/>
    <line x1="650" y1="325" x2="650" y2="335"/>
    <line x1="840" y1="325" x2="840" y2="335"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="80" y="352">0초</text>
    <text x="270" y="352">5초</text>
    <text x="460" y="352">10초</text>
    <text x="650" y="352">15초</text>
    <text x="840" y="352">20초</text>
  </g>
  <line x1="460" y1="80" x2="460" y2="325" stroke="#b45309" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="40" y="374" font-size="13" fill="#555">막대 폭은 0.45초. 결과는 code/rate_limiters.py 1번 실험의 출력이다.</text>
</svg>
