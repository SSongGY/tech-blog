<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="540" fill="#fbfbf8"/>
  <defs>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b3b3b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9d0208"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2d6a4f"/>
    </marker>
  </defs>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">요청 N개를 보낼 때 TCP 연결이 맺어지고 닫히는 횟수</text>
  <text x="30" y="56" font-size="13" fill="#555">실선 화살표 = 패킷 방향 · 실습 1·2번에서 N=200일 때 서버가 accept 한 연결 200개 / 1개</text>

  <!-- 왼쪽: 매번 새 연결 -->
  <rect x="30" y="70" width="400" height="360" rx="6" fill="#ffffff" stroke="#9d0208" stroke-width="1.5"/>
  <text x="46" y="94" font-size="14" font-weight="bold" fill="#9d0208">요청마다 새 연결 — HTTP/1.0 서버</text>
  <text x="96" y="118" font-size="13" fill="#1b1b1b" text-anchor="middle">클라이언트</text>
  <text x="364" y="118" font-size="13" fill="#1b1b1b" text-anchor="middle">서버</text>
  <line x1="96" y1="126" x2="96" y2="380" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="364" y1="126" x2="364" y2="380" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>

  <g stroke="#9d0208" stroke-width="1.5" marker-end="url(#arrowRed)">
    <line x1="96" y1="140" x2="362" y2="148"/>
    <line x1="364" y1="160" x2="98" y2="168"/>
    <line x1="96" y1="180" x2="362" y2="188"/>
  </g>
  <text x="230" y="140" font-size="13" fill="#9d0208" text-anchor="middle">SYN · SYN-ACK · ACK</text>

  <g stroke="#3b3b3b" stroke-width="1.5" marker-end="url(#arrowDark)">
    <line x1="96" y1="212" x2="362" y2="220"/>
    <line x1="364" y1="236" x2="98" y2="244"/>
  </g>
  <text x="230" y="210" font-size="13" fill="#1b1b1b" text-anchor="middle">GET /</text>
  <text x="230" y="262" font-size="13" fill="#1b1b1b" text-anchor="middle">200 OK (Content-Length)</text>

  <g stroke="#9d0208" stroke-width="1.5" marker-end="url(#arrowRed)">
    <line x1="96" y1="286" x2="362" y2="294"/>
    <line x1="364" y1="306" x2="98" y2="314"/>
  </g>
  <text x="230" y="284" font-size="13" fill="#9d0208" text-anchor="middle">FIN · ACK (양쪽에서 한 번씩)</text>
  <text x="230" y="340" font-size="13" fill="#b45309" text-anchor="middle">먼저 닫은 쪽에 TIME_WAIT 소켓이 남는다</text>
  <text x="230" y="370" font-size="14" font-weight="bold" fill="#9d0208" text-anchor="middle">× N번 반복</text>
  <text x="46" y="410" font-size="13" fill="#9d0208">연결 N개 · 임시 포트 N개 · TIME_WAIT 약 N개</text>

  <!-- 오른쪽: keep-alive -->
  <rect x="450" y="70" width="400" height="360" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="466" y="94" font-size="14" font-weight="bold" fill="#2d6a4f">연결 재사용 — HTTP/1.1 서버, 영속 연결</text>
  <text x="516" y="118" font-size="13" fill="#1b1b1b" text-anchor="middle">클라이언트</text>
  <text x="784" y="118" font-size="13" fill="#1b1b1b" text-anchor="middle">서버</text>
  <line x1="516" y1="126" x2="516" y2="380" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="784" y1="126" x2="784" y2="380" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>

  <g stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#arrowGreen)">
    <line x1="516" y1="140" x2="782" y2="148"/>
    <line x1="784" y1="160" x2="518" y2="168"/>
    <line x1="516" y1="180" x2="782" y2="188"/>
  </g>
  <text x="650" y="140" font-size="13" fill="#2d6a4f" text-anchor="middle">SYN · SYN-ACK · ACK (한 번)</text>

  <g stroke="#3b3b3b" stroke-width="1.5" marker-end="url(#arrowDark)">
    <line x1="516" y1="206" x2="782" y2="212"/>
    <line x1="784" y1="222" x2="518" y2="228"/>
    <line x1="516" y1="244" x2="782" y2="250"/>
    <line x1="784" y1="260" x2="518" y2="266"/>
  </g>
  <text x="650" y="204" font-size="13" fill="#1b1b1b" text-anchor="middle">GET / → 200 OK</text>
  <text x="650" y="290" font-size="13" fill="#1b1b1b" text-anchor="middle">… 같은 연결에서 N번</text>

  <g stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#arrowGreen)">
    <line x1="516" y1="310" x2="782" y2="318"/>
    <line x1="784" y1="330" x2="518" y2="338"/>
  </g>
  <text x="650" y="308" font-size="13" fill="#2d6a4f" text-anchor="middle">FIN · ACK (한 번)</text>
  <text x="650" y="370" font-size="13" fill="#555" text-anchor="middle">응답 끝은 Content-Length 로 안다</text>
  <text x="466" y="410" font-size="13" fill="#2d6a4f">연결 1개 · 임시 포트 1개 · TIME_WAIT 1개</text>

  <!-- 아래 조건 -->
  <rect x="30" y="448" width="820" height="78" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="46" y="472" font-size="14" font-weight="bold" fill="#b45309">오른쪽이 되려면 세 가지가 다 맞아야 한다</text>
  <text x="46" y="496" font-size="13" fill="#b45309">① 서버가 HTTP/1.1로 응답 (http.server 기본값은 HTTP/1.0)  ② 요청에 Connection: close 없음</text>
  <text x="46" y="516" font-size="13" fill="#b45309">③ 응답에 Content-Length — 없으면 응답 끝을 알 수 없어 클라이언트가 기다리다 시간 초과 (실습 5번)</text>
</svg>
