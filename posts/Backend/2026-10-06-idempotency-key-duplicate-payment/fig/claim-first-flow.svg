<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14">
  <rect x="0" y="0" width="880" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 왼쪽: 처음 온 요청의 경로 -->
  <rect x="40" y="30" width="280" height="44" rx="6" fill="#f3f4f6" stroke="#4b5563"/>
  <text x="180" y="57" text-anchor="middle">POST /payments + Idempotency-Key</text>

  <rect x="40" y="114" width="280" height="56" rx="6" fill="#eef2ff" stroke="#4b5563"/>
  <text x="180" y="138" text-anchor="middle" font-weight="bold">① 키 선점</text>
  <text x="180" y="158" text-anchor="middle" font-size="13" fill="#374151">INSERT 키 · 지문 · status=processing</text>

  <rect x="40" y="250" width="280" height="56" rx="6" fill="#eef2ff" stroke="#4b5563"/>
  <text x="180" y="274" text-anchor="middle" font-weight="bold">② 결제사 호출</text>
  <text x="180" y="294" text-anchor="middle" font-size="13" fill="#374151">같은 키를 결제사에도 넘긴다</text>

  <rect x="40" y="370" width="280" height="56" rx="6" fill="#eef2ff" stroke="#4b5563"/>
  <text x="180" y="394" text-anchor="middle" font-weight="bold">③ 응답 저장</text>
  <text x="180" y="414" text-anchor="middle" font-size="13" fill="#374151">status=done · 응답 본문</text>

  <rect x="40" y="460" width="280" height="40" rx="6" fill="#e8f5ee" stroke="#2d6a4f"/>
  <text x="180" y="485" text-anchor="middle" fill="#2d6a4f" font-weight="bold">201 — 결제 결과</text>

  <line x1="180" y1="74" x2="180" y2="110" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="170" x2="180" y2="246" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="190" y="214" font-size="13" fill="#2d6a4f">선점 성공</text>
  <line x1="180" y1="306" x2="180" y2="366" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="426" x2="180" y2="456" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 죽는 지점 -->
  <line x1="40" y1="336" x2="320" y2="336" stroke="#9d0208" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="196" y="354" font-size="13" fill="#9d0208">죽으면 processing 으로 남음</text>

  <!-- 오른쪽: 이미 키가 있을 때 -->
  <line x1="320" y1="142" x2="476" y2="142" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="398" y="134" text-anchor="middle" font-size="13" fill="#b45309">UNIQUE 충돌</text>

  <rect x="480" y="114" width="360" height="56" rx="6" fill="#eef2ff" stroke="#4b5563"/>
  <text x="660" y="138" text-anchor="middle" font-weight="bold">저장된 행을 읽는다</text>
  <text x="660" y="158" text-anchor="middle" font-size="13" fill="#374151">지문 · status · 선점 시각</text>

  <line x1="500" y1="170" x2="500" y2="410" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="500" y1="212" x2="526" y2="212" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="270" x2="526" y2="270" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="328" x2="526" y2="328" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="386" x2="526" y2="386" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="530" y="192" width="310" height="40" rx="6" fill="#fff7ed" stroke="#b45309"/>
  <text x="685" y="217" text-anchor="middle" fill="#b45309">지문이 다르다 → 422</text>

  <rect x="530" y="250" width="310" height="40" rx="6" fill="#e8f5ee" stroke="#2d6a4f"/>
  <text x="685" y="275" text-anchor="middle" fill="#2d6a4f">done → 저장된 응답을 그대로 재생</text>

  <rect x="530" y="308" width="310" height="40" rx="6" fill="#fff7ed" stroke="#b45309"/>
  <text x="685" y="333" text-anchor="middle" fill="#b45309">processing · 선점 유효 → 409</text>

  <rect x="530" y="366" width="310" height="40" rx="6" fill="#fff7ed" stroke="#b45309"/>
  <text x="685" y="391" text-anchor="middle" fill="#b45309">processing · 선점 만료 → 넘겨받기</text>

  <path d="M530,394 L420,394 L420,278 L324,278" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="412" y="236" text-anchor="end" font-size="13" fill="#4b5563">같은 키로 ② 다시</text>
</svg>
