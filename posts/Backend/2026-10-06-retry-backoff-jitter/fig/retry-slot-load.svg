<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="500" fill="#fbfbf8"/>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">지터가 없으면 재시도가 같은 칸에 몰린다 — 10ms 칸별 요청 수 (0~320ms)</text>
  <text x="30" y="56" font-size="13" fill="#555">클라이언트 100 · 처리 한도 5건/칸 · base 10ms · 시드 고정 · 실습 2번 출력을 막대로 옮겼다 (막대 높이 = 요청 수)</text>

  <!-- 1행: 지수 백오프 -->
  <text x="30" y="110" font-size="14" font-weight="bold" fill="#9d0208">지수</text>
  <text x="30" y="130" font-size="13" fill="#555">지터 없음</text>
  <line x1="120" y1="230" x2="826" y2="230" stroke="#3b3b3b" stroke-width="1"/>
  <line x1="120" y1="227" x2="826" y2="227" stroke="#2d6a4f" stroke-width="1" stroke-dasharray="4 3"/>
  <g fill="#9d0208">
    <rect x="120" y="170" width="18" height="60"/>
    <rect x="164" y="173" width="18" height="57"/>
    <rect x="252" y="176" width="18" height="54"/>
    <rect x="428" y="179" width="18" height="51"/>
    <rect x="780" y="182" width="18" height="48"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#1b1b1b">
    <text x="129" y="164">100</text>
    <text x="173" y="167">95</text>
    <text x="261" y="170">90</text>
    <text x="437" y="173">85</text>
    <text x="789" y="176">80</text>
  </g>
  <text x="500" y="120" font-size="13" fill="#9d0208">재시도 시각이 모두 같아 한 칸에 몰리고</text>
  <text x="500" y="140" font-size="13" fill="#9d0208">매번 5건만 통과한다</text>
  <text x="500" y="160" font-size="13" fill="#9d0208">→ 완료 26,540ms · 총 호출 1,050</text>

  <!-- 2행: 전체 지터 -->
  <text x="30" y="300" font-size="14" font-weight="bold" fill="#2d6a4f">전체 지터</text>
  <text x="30" y="320" font-size="13" fill="#555">0~상한</text>
  <text x="30" y="338" font-size="13" fill="#555">균등 난수</text>
  <line x1="120" y1="400" x2="826" y2="400" stroke="#3b3b3b" stroke-width="1"/>
  <line x1="120" y1="397" x2="826" y2="397" stroke="#2d6a4f" stroke-width="1" stroke-dasharray="4 3"/>
  <g fill="#b45309">
    <rect x="120" y="302.2" width="18" height="97.8"/>
    <rect x="142" y="362.8" width="18" height="37.2"/>
    <rect x="164" y="382.6" width="18" height="17.4"/>
    <rect x="186" y="384.4" width="18" height="15.6"/>
    <rect x="208" y="384.4" width="18" height="15.6"/>
    <rect x="230" y="391" width="18" height="9"/>
    <rect x="252" y="394.6" width="18" height="5.4"/>
    <rect x="274" y="392.2" width="18" height="7.8"/>
    <rect x="296" y="394" width="18" height="6"/>
    <rect x="318" y="394" width="18" height="6"/>
    <rect x="340" y="395.8" width="18" height="4.2"/>
    <rect x="406" y="396.4" width="18" height="3.6"/>
    <rect x="472" y="396.4" width="18" height="3.6"/>
  </g>
  <g fill="#2d6a4f">
    <rect x="362" y="397.6" width="18" height="2.4"/>
    <rect x="384" y="397.6" width="18" height="2.4"/>
    <rect x="450" y="397.6" width="18" height="2.4"/>
    <rect x="494" y="397.6" width="18" height="2.4"/>
    <rect x="516" y="398.2" width="18" height="1.8"/>
    <rect x="538" y="398.2" width="18" height="1.8"/>
    <rect x="560" y="399.4" width="18" height="0.6"/>
    <rect x="582" y="397" width="18" height="3"/>
    <rect x="604" y="399.4" width="18" height="0.6"/>
    <rect x="626" y="398.8" width="18" height="1.2"/>
    <rect x="648" y="398.8" width="18" height="1.2"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#1b1b1b">
    <text x="129" y="296">163</text>
    <text x="151" y="356">62</text>
    <text x="173" y="376">29</text>
  </g>
  <text x="500" y="300" font-size="13" fill="#2d6a4f">재시도가 흩어져 한도(5) 근처로 내려온다</text>
  <text x="500" y="320" font-size="13" fill="#2d6a4f">→ 완료 394ms · 총 호출 417</text>
  <text x="500" y="344" font-size="13" fill="#b45309">첫 칸 163 = 처음 100 + 대기가 10ms</text>
  <text x="500" y="362" font-size="13" fill="#b45309">미만으로 뽑혀 같은 칸에 다시 온 63</text>

  <!-- 축 눈금 -->
  <g font-size="13" fill="#555" text-anchor="middle">
    <text x="120" y="420">0</text>
    <text x="340" y="420">100ms</text>
    <text x="560" y="420">200ms</text>
    <text x="780" y="420">300ms</text>
  </g>

  <rect x="30" y="440" width="820" height="44" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1"/>
  <line x1="46" y1="462" x2="86" y2="462" stroke="#2d6a4f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="96" y="467" font-size="13" fill="#1b1b1b">처리 한도 5건/칸 · 막대가 이 선을 넘은 만큼 거절된다 · 빨강·주황 = 한도 초과 칸, 초록 = 한도 이내 칸</text>
</svg>
