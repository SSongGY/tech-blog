<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="450" fill="#f8fafc"/>

  <text x="40" y="36" font-size="17" font-weight="bold" fill="#1e293b">write · flush · fsync 가 각각 어디까지 옮기는가</text>
  <text x="40" y="58" font-size="13" fill="#475569">한 줄을 쓰면 세 칸 중 첫 칸에만 들어간다. 나머지 두 칸은 따로 불러야 넘어간다.</text>

  <!-- 호출 지점 -->
  <text x="60" y="94" font-size="13" fill="#64748b">애플리케이션 코드</text>

  <!-- 1층 -->
  <rect x="60" y="104" width="380" height="64" rx="8" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="80" y="131" font-size="14" font-weight="bold" fill="#2d6a4f">① 파이썬 파일 객체 버퍼</text>
  <text x="80" y="153" font-size="13" fill="#475569">io.DEFAULT_BUFFER_SIZE = 8,192 바이트</text>

  <!-- 2층 -->
  <rect x="60" y="222" width="380" height="64" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="80" y="249" font-size="14" font-weight="bold" fill="#b45309">② 운영체제 캐시</text>
  <text x="80" y="271" font-size="13" fill="#475569">다른 프로세스가 읽으면 여기까지 보인다</text>

  <!-- 3층 -->
  <rect x="60" y="340" width="380" height="64" rx="8" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="80" y="367" font-size="14" font-weight="bold" fill="#1e3a8a">③ 저장 장치</text>
  <text x="80" y="389" font-size="13" fill="#475569">여기 닿아야 전원이 끊겨도 남는다</text>

  <!-- 화살표 -->
  <line x1="250" y1="76" x2="250" y2="100" stroke="#2d6a4f" stroke-width="2" marker-end="url(#a1)"/>
  <text x="264" y="94" font-size="13" fill="#2d6a4f">write()</text>

  <line x1="250" y1="172" x2="250" y2="218" stroke="#b45309" stroke-width="2" marker-end="url(#a2)"/>
  <text x="264" y="194" font-size="13" fill="#b45309">flush()</text>
  <text x="264" y="212" font-size="13" fill="#64748b">버퍼가 차면 저절로도 넘어간다</text>

  <line x1="250" y1="290" x2="250" y2="336" stroke="#1e3a8a" stroke-width="2" marker-end="url(#a3)"/>
  <text x="264" y="318" font-size="13" fill="#1e3a8a">os.fsync(fd)</text>

  <!-- 무엇까지 살아남나 -->
  <rect x="500" y="104" width="340" height="300" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="520" y="134" font-size="14" font-weight="bold" fill="#1e293b">어디까지 갔느냐가 무엇을 보장하나</text>

  <text x="520" y="170" font-size="13" font-weight="bold" fill="#9d0208">프로세스가 즉사하면</text>
  <text x="536" y="194" font-size="13" fill="#1e293b">① 에만 있던 내용</text>
  <text x="824" y="194" font-size="13" text-anchor="end" fill="#9d0208">사라진다</text>
  <text x="536" y="218" font-size="13" fill="#1e293b">② 까지 간 내용</text>
  <text x="824" y="218" font-size="13" text-anchor="end" fill="#2d6a4f">남는다</text>

  <text x="520" y="256" font-size="13" font-weight="bold" fill="#9d0208">전원이 끊기면</text>
  <text x="536" y="280" font-size="13" fill="#1e293b">② 까지 간 내용</text>
  <text x="824" y="280" font-size="13" text-anchor="end" fill="#9d0208">보장하지 않는다</text>
  <text x="536" y="304" font-size="13" fill="#1e293b">③ 까지 간 내용</text>
  <text x="824" y="304" font-size="13" text-anchor="end" fill="#2d6a4f">남는다</text>

  <line x1="520" y1="326" x2="824" y2="326" stroke="#cbd5e1" stroke-width="1"/>
  <text x="520" y="352" font-size="13" fill="#475569">fsync 는 장치가 다 옮겼다고 할 때까지</text>
  <text x="520" y="372" font-size="13" fill="#475569">돌아오지 않는다. 그래서 비싸다.</text>
  <text x="520" y="392" font-size="13" fill="#64748b">POSIX.1-2024 fsync() DESCRIPTION</text>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6a4f"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e3a8a"/>
    </marker>
  </defs>
</svg>
