<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="380" fill="#fbfbf8"/>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">real · user · sys — 한 프로세스의 수명을 벽시계로 본 것과 CPU 로 본 것</text>
  <text x="30" y="56" font-size="13" fill="#555">real 은 시작부터 끝까지의 벽시계 시간, user·sys 는 그 가운데 CPU 가 이 프로세스를 실행한 시간만 더한 값</text>

  <!-- 벽시계 축 -->
  <line x1="60" y1="150" x2="840" y2="150" stroke="#3b3b3b" stroke-width="1.5"/>
  <polygon points="840,145 850,150 840,155" fill="#3b3b3b"/>
  <text x="60" y="172" font-size="13" fill="#555">시작 (fork)</text>
  <text x="790" y="172" font-size="13" fill="#555">종료 (wait)</text>

  <!-- 구간 -->
  <g font-size="13" text-anchor="middle">
    <rect x="60" y="96" width="150" height="48" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
    <text x="135" y="125" fill="#1b1b1b">user 모드 실행</text>

    <rect x="210" y="96" width="60" height="48" fill="#fff4e5" stroke="#b45309" stroke-width="1.5"/>
    <text x="240" y="125" fill="#1b1b1b">sys</text>

    <rect x="270" y="96" width="130" height="48" fill="#ffffff" stroke="#9a9a9a" stroke-dasharray="5 3"/>
    <text x="335" y="114" fill="#555">대기</text>
    <text x="335" y="136" fill="#555" font-size="13">I/O · sleep</text>

    <rect x="400" y="96" width="160" height="48" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
    <text x="480" y="125" fill="#1b1b1b">user 모드 실행</text>

    <rect x="560" y="96" width="50" height="48" fill="#fff4e5" stroke="#b45309" stroke-width="1.5"/>
    <text x="585" y="125" fill="#1b1b1b">sys</text>

    <rect x="610" y="96" width="110" height="48" fill="#ffffff" stroke="#9a9a9a" stroke-dasharray="5 3"/>
    <text x="665" y="114" fill="#555">대기</text>
    <text x="665" y="136" fill="#555" font-size="13">CPU 양보</text>

    <rect x="720" y="96" width="110" height="48" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
    <text x="775" y="125" fill="#1b1b1b">user 모드</text>
  </g>

  <!-- real 괄호 -->
  <line x1="60" y1="196" x2="830" y2="196" stroke="#3b3b3b" stroke-width="1.5"/>
  <line x1="60" y1="188" x2="60" y2="204" stroke="#3b3b3b" stroke-width="1.5"/>
  <line x1="830" y1="188" x2="830" y2="204" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="445" y="218" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b1b1b">real = 종료 시각 − 시작 시각 (대기까지 전부 포함)</text>

  <!-- 합산 설명 -->
  <rect x="60" y="240" width="370" height="54" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="245" y="262" font-size="13" font-weight="bold" text-anchor="middle" fill="#2d6a4f">user = 초록 구간의 합</text>
  <text x="245" y="282" font-size="13" text-anchor="middle" fill="#1b1b1b">프로그램 자신의 코드가 CPU 를 쓴 시간</text>

  <rect x="460" y="240" width="370" height="54" rx="6" fill="#fff4e5" stroke="#b45309" stroke-width="1.5"/>
  <text x="645" y="262" font-size="13" font-weight="bold" text-anchor="middle" fill="#b45309">sys = 주황 구간의 합</text>
  <text x="645" y="282" font-size="13" text-anchor="middle" fill="#1b1b1b">커널이 이 프로세스를 대신해 쓴 시간 (시스템 콜)</text>

  <text x="60" y="326" font-size="13" fill="#1b1b1b">· 대기 구간은 user 에도 sys 에도 들어가지 않는다 → real 이 user+sys 보다 크면 그 차이가 기다린 시간이다</text>
  <text x="60" y="348" font-size="13" fill="#1b1b1b">· 병렬로 돈 자식이 여럿이면 user+sys 가 real 보다 커진다 → 쓸 수 있는 CPU 를 겹쳐 썼다는 뜻</text>
  <text x="60" y="370" font-size="13" fill="#1b1b1b">· 셸의 time 은 wait 로 거둔 자식의 user·sys 만 더한다 (RUSAGE_CHILDREN) → 기다리지 않은 백그라운드 자식은 0</text>
</svg>
