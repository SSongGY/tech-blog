<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0.5 L7,4 L0,7.5 Z" fill="#1b1b1b"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0.5 L7,4 L0,7.5 Z" fill="#2d6a4f"/>
    </marker>
  </defs>

  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">TLS 핸드셰이크 메시지 순서 — 1.2와 1.3</text>

  <!-- ================= TLS 1.2 ================= -->
  <rect x="30" y="48" width="400" height="296" fill="#fbfbfc" stroke="#c8d0d8" stroke-width="1" rx="6"/>
  <text x="230" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#9d0208">TLS 1.2 — 앱 데이터까지 2-RTT</text>
  <text x="80" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b1b1b">클라이언트</text>
  <text x="380" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b1b1b">서버</text>
  <line x1="80" y1="100" x2="80" y2="334" stroke="#9aa5b1" stroke-width="1.5"/>
  <line x1="380" y1="100" x2="380" y2="334" stroke="#9aa5b1" stroke-width="1.5"/>

  <text x="230" y="112" text-anchor="middle" font-size="13" fill="#1b1b1b">ClientHello</text>
  <line x1="80" y1="118" x2="380" y2="118" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="230" y="142" text-anchor="middle" font-size="13" fill="#1b1b1b">ServerHello</text>
  <line x1="380" y1="148" x2="80" y2="148" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="230" y="167" text-anchor="middle" font-size="13" fill="#9d0208">Certificate (평문)</text>
  <line x1="380" y1="173" x2="80" y2="173" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="230" y="192" text-anchor="middle" font-size="13" fill="#1b1b1b">ServerKeyExchange</text>
  <line x1="380" y1="198" x2="80" y2="198" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="230" y="217" text-anchor="middle" font-size="13" fill="#1b1b1b">ServerHelloDone</text>
  <line x1="380" y1="223" x2="80" y2="223" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="230" y="245" text-anchor="middle" font-size="13" fill="#1b1b1b">ClientKeyExchange</text>
  <line x1="80" y1="251" x2="380" y2="251" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="230" y="270" text-anchor="middle" font-size="13" fill="#1b1b1b">ChangeCipherSpec · Finished</text>
  <line x1="80" y1="276" x2="380" y2="276" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="230" y="297" text-anchor="middle" font-size="13" fill="#1b1b1b">NewSessionTicket</text>
  <line x1="380" y1="303" x2="80" y2="303" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="230" y="322" text-anchor="middle" font-size="13" fill="#1b1b1b">ChangeCipherSpec · Finished</text>
  <line x1="380" y1="328" x2="80" y2="328" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#ar)"/>

  <!-- ================= TLS 1.3 ================= -->
  <rect x="450" y="48" width="400" height="296" fill="#fbfbfc" stroke="#c8d0d8" stroke-width="1" rx="6"/>
  <text x="650" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d6a4f">TLS 1.3 — 앱 데이터까지 1-RTT</text>
  <text x="500" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b1b1b">클라이언트</text>
  <text x="800" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b1b1b">서버</text>

  <rect x="470" y="160" width="360" height="106" fill="#fdf0d5" stroke="#b45309" stroke-width="1" stroke-dasharray="4 3" rx="4"/>
  <line x1="500" y1="100" x2="500" y2="334" stroke="#9aa5b1" stroke-width="1.5"/>
  <line x1="800" y1="100" x2="800" y2="334" stroke="#9aa5b1" stroke-width="1.5"/>

  <text x="650" y="112" text-anchor="middle" font-size="13" fill="#1b1b1b">ClientHello + key_share</text>
  <line x1="500" y1="118" x2="800" y2="118" stroke="#2d6a4f" stroke-width="1.3" marker-end="url(#arg)"/>
  <text x="650" y="146" text-anchor="middle" font-size="13" fill="#1b1b1b">ServerHello + key_share</text>
  <line x1="800" y1="152" x2="500" y2="152" stroke="#2d6a4f" stroke-width="1.3" marker-end="url(#arg)"/>
  <text x="650" y="176" text-anchor="middle" font-size="13" fill="#b45309">{EncryptedExtensions}</text>
  <line x1="800" y1="182" x2="500" y2="182" stroke="#2d6a4f" stroke-width="1.3" marker-end="url(#arg)"/>
  <text x="650" y="201" text-anchor="middle" font-size="13" fill="#b45309">{Certificate} — 암호화된다</text>
  <line x1="800" y1="207" x2="500" y2="207" stroke="#2d6a4f" stroke-width="1.3" marker-end="url(#arg)"/>
  <text x="650" y="226" text-anchor="middle" font-size="13" fill="#b45309">{CertificateVerify}</text>
  <line x1="800" y1="232" x2="500" y2="232" stroke="#2d6a4f" stroke-width="1.3" marker-end="url(#arg)"/>
  <text x="650" y="251" text-anchor="middle" font-size="13" fill="#b45309">{Finished}</text>
  <line x1="800" y1="257" x2="500" y2="257" stroke="#2d6a4f" stroke-width="1.3" marker-end="url(#arg)"/>
  <text x="650" y="279" text-anchor="middle" font-size="13" fill="#1b1b1b">{Finished}</text>
  <line x1="500" y1="285" x2="800" y2="285" stroke="#2d6a4f" stroke-width="1.3" marker-end="url(#arg)"/>
  <text x="650" y="312" text-anchor="middle" font-size="13" fill="#1b1b1b">NewSessionTicket — 핸드셰이크 이후</text>
  <line x1="800" y1="318" x2="500" y2="318" stroke="#2d6a4f" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arg)"/>

  <!-- 범례와 실측값 -->
  <rect x="30" y="354" width="820" height="72" fill="#f5f7f9" stroke="#c8d0d8" stroke-width="1" rx="6"/>
  <text x="440" y="378" text-anchor="middle" font-size="13" fill="#1b1b1b">{ } 는 핸드셰이크 키로 암호화되어 오가는 메시지 — TLS 1.3은 서버 인증서까지 암호화한다</text>
  <text x="440" y="404" text-anchor="middle" font-size="13" fill="#2d6a4f">실측(OpenSSL 3.5.6): 신규 read 3,859 / written 1,632 바이트 · 재사용 read 1,307 / written 1,887 바이트</text>
</svg>
