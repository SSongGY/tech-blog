<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
    <marker id="arr-water" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1d4e89"/>
    </marker>
    <marker id="arr-heat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b45309"/>
    </marker>
  </defs>
  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">PUE · WUE 측정 경계 — 어디서 재는가</text>

  <!-- 데이터센터 경계 -->
  <rect x="150" y="50" width="520" height="440" rx="10" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="160" y="70" font-size="13" fill="#555">데이터센터 경계 (E_DC 를 재는 곳)</text>

  <!-- 인입 -->
  <rect x="20" y="100" width="110" height="56" rx="6" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="75" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">전력 인입</text>
  <text x="75" y="144" text-anchor="middle" font-size="13" fill="#333">유틸리티·발전</text>
  <path d="M130 128 L178 128" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="150" cy="128" r="9" fill="#111"/>
  <text x="150" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">E_DC</text>

  <rect x="20" y="380" width="110" height="56" rx="6" fill="#ffffff" stroke="#1d4e89" stroke-width="2"/>
  <text x="75" y="404" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4e89">용수 인입</text>
  <text x="75" y="424" text-anchor="middle" font-size="13" fill="#333">연간 사용량 (L)</text>
  <circle cx="150" cy="408" r="9" fill="#1d4e89"/>
  <text x="150" y="376" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4e89">W</text>

  <!-- 전력 경로 -->
  <rect x="180" y="100" width="120" height="56" rx="6" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="240" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">변압·배전</text>
  <text x="240" y="144" text-anchor="middle" font-size="13" fill="#333">손실 → 분자</text>

  <rect x="330" y="100" width="100" height="56" rx="6" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="380" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">UPS</text>
  <text x="380" y="144" text-anchor="middle" font-size="13" fill="#333">손실 → 분자</text>

  <rect x="460" y="100" width="90" height="56" rx="6" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="505" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">PDU</text>
  <text x="505" y="144" text-anchor="middle" font-size="13" fill="#333">손실</text>

  <path d="M300 128 L328 128" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M430 128 L458 128" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M550 128 L578 128" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 계측점 L1 L2 L3 -->
  <circle cx="444" cy="128" r="11" fill="#2d6a4f"/>
  <text x="444" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
  <circle cx="564" cy="128" r="11" fill="#2d6a4f"/>
  <text x="564" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>

  <!-- IT 장비 -->
  <rect x="580" y="90" width="80" height="200" rx="6" fill="#eef4f0" stroke="#2d6a4f" stroke-width="2"/>
  <text x="620" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">IT 장비</text>
  <text x="620" y="140" text-anchor="middle" font-size="13" fill="#333">CPU·GPU</text>
  <text x="620" y="160" text-anchor="middle" font-size="13" fill="#333">메모리</text>
  <text x="620" y="180" text-anchor="middle" font-size="13" fill="#333">스토리지</text>
  <text x="620" y="200" text-anchor="middle" font-size="13" fill="#333">네트워크</text>
  <text x="620" y="228" text-anchor="middle" font-size="13" fill="#9d0208">서버 팬</text>
  <text x="620" y="248" text-anchor="middle" font-size="13" fill="#9d0208">PSU 손실</text>
  <text x="620" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d6a4f">= E_IT</text>
  <circle cx="580" cy="168" r="11" fill="#2d6a4f"/>
  <text x="580" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>

  <!-- 냉각 등 -->
  <rect x="180" y="200" width="250" height="90" rx="6" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="305" y="224" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">냉각 설비</text>
  <text x="305" y="246" text-anchor="middle" font-size="13" fill="#333">냉동기·냉각탑·펌프·CRAH·CDU</text>
  <text x="305" y="268" text-anchor="middle" font-size="13" fill="#333">에너지 → 분자, 증발 용수 → W</text>
  <path d="M240 156 L240 198" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="460" y="200" width="100" height="90" rx="6" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="510" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">조명·보안</text>
  <text x="510" y="254" text-anchor="middle" font-size="13" fill="#333">→ 분자</text>

  <path d="M130 408 L300 408 L300 292" fill="none" stroke="#1d4e89" stroke-width="1.5" marker-end="url(#arr-water)"/>
  <text x="310" y="330" font-size="13" fill="#1d4e89">가습 · 냉각탑 증발 · 블로다운</text>

  <!-- 열 재사용 -->
  <rect x="460" y="360" width="200" height="76" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="2"/>
  <text x="560" y="384" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">열 재사용 (경계 밖으로)</text>
  <text x="560" y="406" text-anchor="middle" font-size="13" fill="#333">지역난방 · 건물 난방</text>
  <text x="560" y="426" text-anchor="middle" font-size="13" fill="#9d0208">PUE 에서 빼지 않는다</text>
  <path d="M620 292 L620 358" stroke="#b45309" stroke-width="1.5" marker-end="url(#arr-heat)"/>
  <path d="M660 398 L700 398" stroke="#b45309" stroke-width="1.5" marker-end="url(#arr-heat)"/>

  <!-- 오른쪽 식 -->
  <text x="776" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">계산식 (연간)</text>
  <text x="776" y="130" text-anchor="middle" font-size="13" fill="#111">PUE = E_DC / E_IT</text>
  <text x="776" y="152" text-anchor="middle" font-size="13" fill="#555">이상값 1.0, 단위 없음</text>
  <text x="776" y="190" text-anchor="middle" font-size="13" fill="#1d4e89">WUE = W / E_IT</text>
  <text x="776" y="212" text-anchor="middle" font-size="13" fill="#555">이상값 0, L/kWh</text>
  <text x="776" y="250" text-anchor="middle" font-size="13" fill="#b45309">ERF = 재사용 / E_DC</text>
  <text x="776" y="272" text-anchor="middle" font-size="13" fill="#b45309">ERE = (1−ERF)×PUE</text>
  <text x="776" y="420" text-anchor="middle" font-size="13" fill="#b45309">재사용 열</text>

  <!-- 범례 -->
  <text x="160" y="520" font-size="13" fill="#2d6a4f">● 1·2·3 = E_IT 계측점: 1 UPS 출력(기본) · 2 PDU 출력(중간) · 3 IT 장비 입력(고급)</text>
  <text x="160" y="542" font-size="13" fill="#555">경계 안의 IT 외 에너지(배전 손실·냉각·조명)는 전부 분자에만 들어간다</text>
</svg>
