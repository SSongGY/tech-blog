<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="480" fill="#fbfbf8"/>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b3b3b"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6a4f"/>
    </marker>
  </defs>

  <text x="30" y="32" font-size="17" font-weight="bold" fill="#1b1b1b">Lustre — 메타데이터 경로와 데이터 경로의 분리</text>

  <!-- MGS -->
  <rect x="300" y="56" width="180" height="58" rx="4" fill="#eef1f7" stroke="#6b7280"/>
  <text x="390" y="80" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">MGS</text>
  <text x="390" y="100" font-size="13" fill="#555" text-anchor="middle">구성 정보 제공</text>

  <!-- MDS / MDT -->
  <rect x="540" y="56" width="310" height="58" rx="4" fill="#eef1f7" stroke="#6b7280"/>
  <text x="695" y="80" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">MDS ─ MDT</text>
  <text x="695" y="100" font-size="13" fill="#555" text-anchor="middle">이름·디렉터리·권한·레이아웃 EA</text>

  <!-- 클라이언트 -->
  <rect x="30" y="170" width="170" height="90" rx="4" fill="#e9f5ee" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="115" y="200" font-size="15" font-weight="bold" fill="#1b1b1b" text-anchor="middle">클라이언트</text>
  <text x="115" y="222" font-size="13" fill="#555" text-anchor="middle">MGC · MDC</text>
  <text x="115" y="241" font-size="13" fill="#555" text-anchor="middle">OSC × OST 수 (LOV)</text>

  <!-- 메타데이터 경로 -->
  <polyline points="115,170 115,150 695,150 695,116" fill="none" stroke="#3b3b3b" stroke-width="1.8" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="225" y="142" font-size="13" fill="#1b1b1b">① 열기 요청 → ② 레이아웃 EA 수신 (OST 객체 목록 · stripe_size)</text>

  <!-- OSS 1 -->
  <rect x="300" y="200" width="260" height="110" rx="4" fill="#f3efe6" stroke="#6b7280"/>
  <text x="430" y="222" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">OSS 1</text>
  <rect x="315" y="240" width="110" height="55" rx="3" fill="#fbfbf8" stroke="#6b7280"/>
  <text x="370" y="273" font-size="14" fill="#1b1b1b" text-anchor="middle">OST0</text>
  <rect x="435" y="240" width="110" height="55" rx="3" fill="#fbfbf8" stroke="#6b7280"/>
  <text x="490" y="273" font-size="14" fill="#1b1b1b" text-anchor="middle">OST1</text>

  <!-- OSS 2 -->
  <rect x="590" y="200" width="260" height="110" rx="4" fill="#f3efe6" stroke="#6b7280"/>
  <text x="720" y="222" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">OSS 2</text>
  <rect x="605" y="240" width="110" height="55" rx="3" fill="#fbfbf8" stroke="#6b7280"/>
  <text x="660" y="273" font-size="14" fill="#1b1b1b" text-anchor="middle">OST2</text>
  <rect x="725" y="240" width="110" height="55" rx="3" fill="#fbfbf8" stroke="#6b7280"/>
  <text x="780" y="273" font-size="14" fill="#1b1b1b" text-anchor="middle">OST3</text>

  <!-- 데이터 경로 -->
  <line x1="200" y1="235" x2="298" y2="255" stroke="#2d6a4f" stroke-width="2.6" marker-end="url(#arg)"/>
  <polyline points="160,260 160,338 720,338 720,312" fill="none" stroke="#2d6a4f" stroke-width="2.6" marker-end="url(#arg)"/>
  <text x="230" y="358" font-size="13" font-weight="bold" fill="#2d6a4f">③ 데이터 I/O — 여러 OSS와 직접·동시에 (MDS를 거치지 않음)</text>

  <!-- 스트라이핑 -->
  <text x="30" y="398" font-size="14" font-weight="bold" fill="#1b1b1b">파일 A — stripe_count 3 · stripe_size 1 MB · RAID 0 (라운드 로빈)</text>
  <rect x="30" y="414" width="50" height="34" fill="#fbfbf8" stroke="#6b7280"/>
  <text x="55" y="436" font-size="13" fill="#1b1b1b" text-anchor="middle">1</text>
  <rect x="80" y="414" width="50" height="34" fill="#fbfbf8" stroke="#6b7280"/>
  <text x="105" y="436" font-size="13" fill="#1b1b1b" text-anchor="middle">2</text>
  <rect x="130" y="414" width="50" height="34" fill="#fbfbf8" stroke="#6b7280"/>
  <text x="155" y="436" font-size="13" fill="#1b1b1b" text-anchor="middle">3</text>
  <rect x="180" y="414" width="50" height="34" fill="#fbfbf8" stroke="#6b7280"/>
  <text x="205" y="436" font-size="13" fill="#1b1b1b" text-anchor="middle">4</text>
  <rect x="230" y="414" width="50" height="34" fill="#fbfbf8" stroke="#6b7280"/>
  <text x="255" y="436" font-size="13" fill="#1b1b1b" text-anchor="middle">5</text>
  <rect x="280" y="414" width="50" height="34" fill="#fbfbf8" stroke="#6b7280"/>
  <text x="305" y="436" font-size="13" fill="#1b1b1b" text-anchor="middle">6</text>
  <text x="180" y="468" font-size="13" fill="#555" text-anchor="middle">1 MB 조각</text>

  <line x1="345" y1="431" x2="395" y2="431" stroke="#3b3b3b" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="405" y="414" width="140" height="34" rx="3" fill="#f3efe6" stroke="#6b7280"/>
  <text x="475" y="436" font-size="13" fill="#1b1b1b" text-anchor="middle">OST0 객체: 1 · 4</text>
  <rect x="555" y="414" width="140" height="34" rx="3" fill="#f3efe6" stroke="#6b7280"/>
  <text x="625" y="436" font-size="13" fill="#1b1b1b" text-anchor="middle">OST1 객체: 2 · 5</text>
  <rect x="705" y="414" width="140" height="34" rx="3" fill="#f3efe6" stroke="#6b7280"/>
  <text x="775" y="436" font-size="13" fill="#1b1b1b" text-anchor="middle">OST2 객체: 3 · 6</text>
</svg>
