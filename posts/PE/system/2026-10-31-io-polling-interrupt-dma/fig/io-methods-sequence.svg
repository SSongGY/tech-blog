<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500"
     font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="880" height="500" fill="#f8f9fa"/>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#495057"/>
    </marker>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b45309"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2d6a4f"/>
    </marker>
    <marker id="args" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 z" fill="#2d6a4f"/>
    </marker>
  </defs>

  <text x="24" y="28" font-size="16" font-weight="bold" fill="#212529">세 가지 입출력 방식 — 누가 옮기고 누가 알리는가</text>
  <text x="24" y="50" font-size="13" fill="#495057">가로축은 주체, 세로축은 시간. CPU 가 데이터를 직접 옮기는 구간이 ①②에는 있고 ③에는 없다.</text>

  <rect x="140" y="66" width="190" height="34" rx="4" fill="#e9ecef" stroke="#495057" stroke-width="1.2"/>
  <text x="235" y="89" font-size="14" font-weight="bold" fill="#212529" text-anchor="middle">입출력 장치</text>
  <rect x="400" y="66" width="190" height="34" rx="4" fill="#e9ecef" stroke="#495057" stroke-width="1.2"/>
  <text x="495" y="89" font-size="14" font-weight="bold" fill="#212529" text-anchor="middle">CPU</text>
  <rect x="660" y="66" width="190" height="34" rx="4" fill="#e9ecef" stroke="#495057" stroke-width="1.2"/>
  <text x="755" y="89" font-size="14" font-weight="bold" fill="#212529" text-anchor="middle">주기억장치</text>

  <line x1="235" y1="100" x2="235" y2="468" stroke="#adb5bd" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="495" y1="100" x2="495" y2="468" stroke="#adb5bd" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="755" y1="100" x2="755" y2="468" stroke="#adb5bd" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 밴드 1: 폴링 -->
  <text x="24" y="130" font-size="14" font-weight="bold" fill="#b45309">① 폴링</text>
  <text x="24" y="150" font-size="13" fill="#495057">CPU 가 기다리고</text>
  <text x="24" y="168" font-size="13" fill="#495057">CPU 가 옮긴다</text>

  <text x="365" y="129" font-size="13" fill="#b45309" text-anchor="middle">상태 레지스터를 읽는다</text>
  <line x1="495" y1="137" x2="243" y2="137" stroke="#b45309" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="365" y="159" font-size="13" fill="#b45309" text-anchor="middle">아직 준비 안 됨 — 처음으로 되돌아간다</text>
  <line x1="235" y1="167" x2="487" y2="167" stroke="#b45309" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="625" y="189" font-size="13" fill="#b45309" text-anchor="middle">CPU 가 워드 단위로 옮긴다</text>
  <line x1="495" y1="197" x2="747" y2="197" stroke="#b45309" stroke-width="1.6" marker-end="url(#arw)"/>

  <line x1="24" y1="213" x2="856" y2="213" stroke="#dee2e6" stroke-width="1"/>

  <!-- 밴드 2: 인터럽트 구동 -->
  <text x="24" y="243" font-size="14" font-weight="bold" fill="#212529">② 인터럽트</text>
  <text x="24" y="263" font-size="13" fill="#495057">장치가 알리고</text>
  <text x="24" y="281" font-size="13" fill="#495057">CPU 가 옮긴다</text>

  <text x="365" y="242" font-size="13" fill="#212529" text-anchor="middle">전송을 지시하고 다른 일을 한다</text>
  <line x1="495" y1="250" x2="243" y2="250" stroke="#495057" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="365" y="272" font-size="13" font-weight="bold" fill="#212529" text-anchor="middle">인터럽트 — 준비됐다</text>
  <line x1="235" y1="280" x2="487" y2="280" stroke="#495057" stroke-width="2" marker-end="url(#ar)"/>
  <text x="625" y="302" font-size="13" fill="#212529" text-anchor="middle">핸들러 안에서 CPU 가 옮긴다</text>
  <line x1="495" y1="310" x2="747" y2="310" stroke="#495057" stroke-width="1.6" marker-end="url(#ar)"/>

  <line x1="24" y1="326" x2="856" y2="326" stroke="#dee2e6" stroke-width="1"/>

  <!-- 밴드 3: DMA -->
  <text x="24" y="356" font-size="14" font-weight="bold" fill="#2d6a4f">③ DMA</text>
  <text x="24" y="376" font-size="13" fill="#495057">장치가 알리고</text>
  <text x="24" y="394" font-size="13" fill="#495057">장치가 옮긴다</text>

  <text x="365" y="355" font-size="13" fill="#2d6a4f" text-anchor="middle">DMA 주소·길이·방향을 넘긴다</text>
  <line x1="495" y1="363" x2="243" y2="363" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#arg)"/>

  <rect x="330" y="378" width="330" height="20" fill="#f8f9fa"/>
  <text x="495" y="394" font-size="13" font-weight="bold" fill="#2d6a4f" text-anchor="middle">DMA 컨트롤러가 버스를 쥐고 직접 옮긴다</text>
  <line x1="243" y1="406" x2="747" y2="406" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arg)" marker-start="url(#args)"/>
  <text x="365" y="430" font-size="13" font-weight="bold" fill="#2d6a4f" text-anchor="middle">완료 인터럽트 — 전송당 한 번</text>
  <line x1="235" y1="438" x2="487" y2="438" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arg)"/>

  <text x="660" y="438" font-size="13" fill="#495057">전송 중 CPU 는 다른 일을 한다</text>

  <line x1="24" y1="456" x2="856" y2="456" stroke="#dee2e6" stroke-width="1"/>
  <text x="24" y="478" font-size="13" fill="#495057">③ 의 가운데 선은 CPU 수직선을 지나가지만 CPU 를 거치지 않는다. 데이터가 CPU 레지스터를 통과하지 않는 것이 DMA 의 정의다.</text>
</svg>
