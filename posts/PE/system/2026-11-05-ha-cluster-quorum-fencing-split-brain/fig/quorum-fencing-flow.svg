<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420"
     font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="880" height="420" fill="#f8f9fa"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#212529">네트워크가 갈라지면 쿼럼이 이어갈 쪽을 정하고, 펜싱이 진 쪽의 정지를 확정한다</text>
  <text x="20" y="50" font-size="13" fill="#495057">예: 5노드 클러스터(노드당 1표, 과반 3표)가 3노드와 2노드로 갈라진 경우</text>

  <rect x="290" y="70" width="300" height="50" rx="4" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <text x="440" y="92" font-size="13" text-anchor="middle" fill="#212529">① 네트워크 분단 감지</text>
  <text x="440" y="110" font-size="13" text-anchor="middle" fill="#495057">서로 상대가 죽었는지 알 수 없다</text>

  <line x1="400" y1="120" x2="220" y2="170" stroke="#495057" stroke-width="1.5"/>
  <line x1="480" y1="120" x2="660" y2="170" stroke="#495057" stroke-width="1.5"/>

  <rect x="40" y="170" width="360" height="64" rx="4" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="220" y="194" font-size="13" text-anchor="middle" fill="#212529">② A 쪽: 3노드 = 3표 ≥ 과반 3</text>
  <text x="220" y="214" font-size="13" text-anchor="middle" fill="#2d6a4f" font-weight="bold">쿼럼 있음 — 이어갈 자격을 얻는다</text>

  <rect x="480" y="170" width="360" height="64" rx="4" fill="#fde2e4" stroke="#9d0208" stroke-width="1.5"/>
  <text x="660" y="194" font-size="13" text-anchor="middle" fill="#212529">② B 쪽: 2노드 = 2표 &lt; 과반 3</text>
  <text x="660" y="214" font-size="13" text-anchor="middle" fill="#9d0208" font-weight="bold">쿼럼 없음 — 자격이 없다</text>

  <line x1="220" y1="234" x2="220" y2="274" stroke="#2d6a4f" stroke-width="1.5"/>
  <line x1="660" y1="234" x2="660" y2="274" stroke="#9d0208" stroke-width="1.5"/>

  <rect x="40" y="274" width="360" height="64" rx="4" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="220" y="298" font-size="13" text-anchor="middle" fill="#212529">③ 자원을 계속 운영한다</text>
  <text x="220" y="318" font-size="13" text-anchor="middle" fill="#495057">B 의 노드를 펜싱(STONITH)한다</text>

  <rect x="480" y="274" width="360" height="64" rx="4" fill="#ffffff" stroke="#9d0208" stroke-width="1.5"/>
  <text x="660" y="298" font-size="13" text-anchor="middle" fill="#212529">③ no-quorum-policy 에 따라 동작한다</text>
  <text x="660" y="318" font-size="13" text-anchor="middle" fill="#495057">기본값 stop: 자원을 전부 정지한다</text>

  <line x1="400" y1="306" x2="480" y2="306" stroke="#b45309" stroke-width="2"/>
  <polygon points="480,306 470,301 470,311" fill="#b45309"/>

  <rect x="140" y="364" width="600" height="40" rx="4" fill="#fff3cd" stroke="#b45309" stroke-width="1.5"/>
  <text x="440" y="389" font-size="13" text-anchor="middle" fill="#212529">쿼럼은 누가 이어갈지를 정하고, 펜싱은 B 가 실제로 멈췄음을 확정한다</text>
</svg>
