<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- 가상 주소 -->
  <rect x="24" y="150" width="150" height="64" rx="6" fill="#f7f7f7" stroke="#555555"/>
  <text x="99" y="176" font-size="14" text-anchor="middle" fill="#222222">가상 주소</text>
  <text x="99" y="198" font-size="13" text-anchor="middle" fill="#555555">VPN | offset</text>

  <!-- TLB 조회 -->
  <rect x="220" y="150" width="150" height="64" rx="6" fill="#ffffff" stroke="#333333"/>
  <text x="295" y="176" font-size="14" text-anchor="middle" fill="#222222">TLB 조회</text>
  <text x="295" y="198" font-size="13" text-anchor="middle" fill="#555555">ε (VPN 으로 검색)</text>
  <line x1="174" y1="182" x2="216" y2="182" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 적중 경로 -->
  <text x="420" y="44" font-size="15" font-weight="bold" fill="#2d6a4f">적중 (확률 α) — ε + m</text>
  <rect x="420" y="58" width="190" height="64" rx="6" fill="#f0f7f3" stroke="#2d6a4f"/>
  <text x="515" y="84" font-size="14" text-anchor="middle" fill="#222222">물리 주소 생성</text>
  <text x="515" y="106" font-size="13" text-anchor="middle" fill="#555555">PFN | offset</text>
  <rect x="660" y="58" width="196" height="64" rx="6" fill="#f0f7f3" stroke="#2d6a4f"/>
  <text x="758" y="84" font-size="14" text-anchor="middle" fill="#222222">데이터 접근</text>
  <text x="758" y="106" font-size="13" text-anchor="middle" fill="#555555">메모리 1회 (m)</text>
  <path d="M370,170 L395,170 L395,90 L416,90" fill="none" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="610" y1="90" x2="656" y2="90" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 실패 경로 -->
  <text x="420" y="262" font-size="15" font-weight="bold" fill="#9d0208">실패 (확률 1−α) — ε + k·m + m</text>
  <rect x="420" y="276" width="190" height="64" rx="6" fill="#fff5f5" stroke="#9d0208"/>
  <text x="515" y="302" font-size="14" text-anchor="middle" fill="#222222">페이지 테이블 탐색</text>
  <text x="515" y="324" font-size="13" text-anchor="middle" fill="#555555">k 단계 = 메모리 k회</text>
  <rect x="660" y="276" width="196" height="64" rx="6" fill="#fff5f5" stroke="#9d0208"/>
  <text x="758" y="302" font-size="14" text-anchor="middle" fill="#222222">TLB 갱신 후 재시도</text>
  <text x="758" y="324" font-size="13" text-anchor="middle" fill="#555555">이번엔 적중 → 데이터 m</text>
  <path d="M370,194 L395,194 L395,308 L416,308" fill="none" stroke="#9d0208" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="610" y1="308" x2="656" y2="308" stroke="#9d0208" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 공식 -->
  <text x="24" y="376" font-size="14" fill="#222222">EAT = α(ε + m) + (1 − α)(ε + (k + 1)·m)</text>
  <text x="24" y="250" font-size="13" fill="#555555">ε: TLB 조회 시간</text>
  <text x="24" y="270" font-size="13" fill="#555555">m: 메모리 1회 접근 시간</text>
  <text x="24" y="290" font-size="13" fill="#555555">k: 페이지 테이블 단계 수</text>
  <text x="24" y="310" font-size="13" fill="#555555">α: TLB 적중률</text>
</svg>
