<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="500" fill="#fbfbf8"/>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">RAID 5 작은 쓰기 — 블록 하나를 고치는 데 I/O 4번</text>
  <text x="30" y="56" font-size="13" fill="#555">데이터 디스크 4개 + 패리티 1개, 한 스트라이프 · 감산(read-modify-write) 방식</text>

  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2d6a4f"/>
    </marker>
  </defs>

  <!-- 디스크 5개 -->
  <g font-size="14" fill="#1b1b1b">
    <rect x="40" y="80" width="130" height="90" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="74" y="104" font-size="13" fill="#555">디스크 0</text>
    <text x="92" y="140" font-weight="bold" fill="#777">D0</text>

    <rect x="200" y="80" width="130" height="90" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="2"/>
    <text x="234" y="104" font-size="13" fill="#555">디스크 1</text>
    <text x="252" y="136" font-weight="bold" fill="#b45309">D1</text>
    <text x="234" y="158" font-size="13" fill="#b45309">고칠 블록</text>

    <rect x="360" y="80" width="130" height="90" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="394" y="104" font-size="13" fill="#555">디스크 2</text>
    <text x="412" y="140" font-weight="bold" fill="#777">D2</text>

    <rect x="520" y="80" width="130" height="90" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="554" y="104" font-size="13" fill="#555">디스크 3</text>
    <text x="572" y="140" font-weight="bold" fill="#777">D3</text>

    <rect x="680" y="80" width="130" height="90" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="2"/>
    <text x="714" y="104" font-size="13" fill="#555">디스크 4</text>
    <text x="738" y="136" font-weight="bold" fill="#b45309">P</text>
    <text x="722" y="158" font-size="13" fill="#b45309">패리티</text>
  </g>
  <text x="40" y="192" font-size="13" fill="#777">D0·D2·D3은 읽지도 쓰지도 않는다</text>

  <!-- 계산 상자 -->
  <rect x="250" y="270" width="380" height="64" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="270" y="296" font-size="14" font-weight="bold" fill="#1b1b1b">새 P = (옛 D1 XOR 새 D1) XOR 옛 P</text>
  <text x="270" y="320" font-size="13" fill="#555">바뀐 비트만 패리티에서 뒤집는다</text>

  <!-- 읽기: 점선 -->
  <g stroke="#555" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowGray)">
    <path d="M240 172 L300 266"/>
    <path d="M720 172 L600 266"/>
  </g>
  <text x="160" y="232" font-size="13" fill="#1b1b1b">① 옛 D1 읽기</text>
  <text x="680" y="232" font-size="13" fill="#1b1b1b">② 옛 P 읽기</text>

  <!-- 쓰기: 실선 -->
  <g stroke="#2d6a4f" stroke-width="1.6" fill="none" marker-end="url(#arrowGreen)">
    <path d="M330 266 L285 174"/>
    <path d="M570 266 L760 174"/>
  </g>
  <text x="318" y="214" font-size="13" fill="#2d6a4f">③ 새 D1 쓰기</text>
  <text x="560" y="214" font-size="13" fill="#2d6a4f">④ 새 P 쓰기</text>

  <!-- 레벨별 비교 -->
  <rect x="40" y="370" width="770" height="112" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.2"/>
  <text x="56" y="394" font-size="14" font-weight="bold" fill="#1b1b1b">작은 쓰기 1회에 드는 디스크 I/O</text>
  <g font-size="13" fill="#1b1b1b">
    <text x="56" y="420">RAID 0: 쓰기 1</text>
    <text x="236" y="420">RAID 1·10: 쓰기 2 (거울 두 쪽)</text>
    <text x="506" y="420" fill="#b45309">RAID 5: 읽기 2 + 쓰기 2 = 4</text>
    <text x="56" y="446" fill="#9d0208">RAID 6: 읽기 3 + 쓰기 3 = 6 (D·P·Q를 각각 읽고 쓴다)</text>
    <text x="56" y="470" fill="#555">전체 스트라이프를 한꺼번에 쓰면 읽기가 없다 — RAID 5 쓰기 5회, RAID 6 쓰기 6회</text>
  </g>
</svg>
