<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <rect x="0" y="0" width="880" height="440" fill="#ffffff"/>
  <text x="440" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">eBPF 프로그램의 수명 — 적재 → 검증 → JIT → 부착</text>

  <!-- 사용자 공간 -->
  <rect x="20" y="52" width="840" height="100" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-dasharray="6 4"/>
  <text x="36" y="74" font-size="14" font-weight="bold" fill="#4b5563">사용자 공간</text>
  <rect x="60" y="86" width="220" height="52" rx="6" fill="#ffffff" stroke="#4338ca" stroke-width="2"/>
  <text x="170" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">로더 프로그램</text>
  <text x="170" y="129" font-size="13" text-anchor="middle" fill="#4b5563">바이트코드 + bpf() 호출</text>
  <rect x="600" y="86" width="220" height="52" rx="6" fill="#ffffff" stroke="#4338ca" stroke-width="2"/>
  <text x="710" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">관측·제어 도구</text>
  <text x="710" y="129" font-size="13" text-anchor="middle" fill="#4b5563">bpf()로 맵 읽기·쓰기</text>

  <!-- 커널 -->
  <rect x="20" y="170" width="840" height="252" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-dasharray="6 4"/>
  <text x="36" y="192" font-size="14" font-weight="bold" fill="#4338ca">커널</text>

  <rect x="60" y="210" width="200" height="66" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="160" y="236" font-size="14" font-weight="bold" text-anchor="middle" fill="#b45309">① 검증기</text>
  <text x="160" y="258" font-size="13" text-anchor="middle" fill="#b45309">CFG 검사 + 경로 모의 실행</text>

  <rect x="320" y="210" width="200" height="66" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="420" y="236" font-size="14" font-weight="bold" text-anchor="middle" fill="#2d6a4f">② JIT 컴파일러</text>
  <text x="420" y="258" font-size="13" text-anchor="middle" fill="#2d6a4f">기계어로 번역</text>

  <rect x="580" y="210" width="240" height="66" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="700" y="236" font-size="14" font-weight="bold" text-anchor="middle" fill="#2d6a4f">③ 훅에 부착·실행</text>
  <text x="700" y="258" font-size="13" text-anchor="middle" fill="#2d6a4f">시스템 콜·트레이스포인트·네트워크</text>

  <rect x="320" y="320" width="200" height="66" rx="6" fill="#ffffff" stroke="#4338ca" stroke-width="2"/>
  <text x="420" y="346" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">맵 (Map)</text>
  <text x="420" y="368" font-size="13" text-anchor="middle" fill="#4b5563">커널·사용자 공유 저장소</text>

  <rect x="580" y="320" width="240" height="66" rx="6" fill="#ffffff" stroke="#4338ca" stroke-width="2"/>
  <text x="700" y="346" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">헬퍼 함수</text>
  <text x="700" y="368" font-size="13" text-anchor="middle" fill="#4b5563">허용된 커널 기능만 호출</text>

  <!-- 화살표 -->
  <line x1="160" y1="138" x2="160" y2="202" stroke="#1f2937" stroke-width="2"/>
  <polygon points="154,200 160,210 166,200" fill="#1f2937"/>
  <text x="168" y="203" font-size="13" fill="#1f2937">적재</text>
  <line x1="260" y1="243" x2="312" y2="243" stroke="#2d6a4f" stroke-width="2"/>
  <polygon points="310,237 320,243 310,249" fill="#2d6a4f"/>
  <line x1="520" y1="243" x2="572" y2="243" stroke="#2d6a4f" stroke-width="2"/>
  <polygon points="570,237 580,243 570,249" fill="#2d6a4f"/>
  <line x1="160" y1="276" x2="160" y2="320" stroke="#9d0208" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="160" y="340" font-size="13" text-anchor="middle" fill="#9d0208">통과 못 하면 적재 거부</text>
  <line x1="700" y1="276" x2="700" y2="312" stroke="#1f2937" stroke-width="2"/>
  <polygon points="694,310 700,320 706,310" fill="#1f2937"/>
  <line x1="640" y1="276" x2="528" y2="330" stroke="#1f2937" stroke-width="2"/>
  <polygon points="532,322 520,334 536,334" fill="#1f2937"/>
  <polyline points="420,386 420,396 845,396 845,112 828,112" fill="none" stroke="#4338ca" stroke-width="2" stroke-dasharray="5 3"/>
  <polygon points="830,106 820,112 830,118" fill="#4338ca"/>
  <text x="560" y="415"font-size="13" text-anchor="middle" fill="#4338ca">맵을 통해 결과 공유</text>
</svg>
