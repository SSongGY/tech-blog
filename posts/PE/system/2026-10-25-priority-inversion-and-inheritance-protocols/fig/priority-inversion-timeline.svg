<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="430" fill="#fbfbfa"/>

  <!-- ===== 패널 A : 상속 없음 ===== -->
  <text x="30" y="34" font-size="15" font-weight="bold" fill="#9d0208">상속이 없을 때 — J1 의 차단 시간에 상한이 없다</text>

  <text x="24" y="66" font-size="13" fill="#333333">J1 (최고)</text>
  <text x="24" y="96" font-size="13" fill="#333333">J2 (중간)</text>
  <text x="24" y="126" font-size="13" fill="#333333">J3 (최저)</text>

  <!-- J1 -->
  <rect x="250" y="52" width="20" height="20" fill="#cfe3d7" stroke="#2d6a4f"/>
  <rect x="270" y="52" width="380" height="20" fill="#f7d6d6" stroke="#9d0208" stroke-dasharray="4 3"/>
  <text x="460" y="67" font-size="13" fill="#9d0208" text-anchor="middle">S 에서 차단</text>
  <rect x="650" y="52" width="100" height="20" fill="#cfe3d7" stroke="#2d6a4f"/>

  <!-- J2 -->
  <rect x="310" y="82" width="300" height="20" fill="#cfe3d7" stroke="#2d6a4f"/>
  <text x="460" y="97" font-size="13" fill="#1b1b1b" text-anchor="middle">J2 실행 — 길이에 제한이 없다</text>

  <!-- J3 -->
  <rect x="150" y="112" width="100" height="20" fill="#2d6a4f"/>
  <rect x="270" y="112" width="40" height="20" fill="#2d6a4f"/>
  <rect x="610" y="112" width="40" height="20" fill="#2d6a4f"/>
  <text x="200" y="127" font-size="13" fill="#ffffff" text-anchor="middle">S 임계구역</text>

  <line x1="130" y1="146" x2="830" y2="146" stroke="#888888"/>
  <line x1="150" y1="142" x2="150" y2="150" stroke="#888888"/>
  <line x1="270" y1="142" x2="270" y2="150" stroke="#888888"/>
  <line x1="310" y1="142" x2="310" y2="150" stroke="#888888"/>
  <line x1="650" y1="142" x2="650" y2="150" stroke="#888888"/>
  <text x="150" y="166" font-size="13" fill="#555555" text-anchor="middle">J3 이 S 잠금</text>
  <text x="270" y="166" font-size="13" fill="#555555" text-anchor="middle">J1 차단</text>
  <text x="340" y="184" font-size="13" fill="#555555" text-anchor="middle">J2 도착·선점</text>
  <text x="650" y="166" font-size="13" fill="#555555" text-anchor="middle">S 해제</text>

  <line x1="130" y1="206" x2="830" y2="206" stroke="#e0e0e0"/>

  <!-- ===== 패널 B : 기본 우선순위 상속 ===== -->
  <text x="30" y="240" font-size="15" font-weight="bold" fill="#2d6a4f">기본 우선순위 상속 — 차단이 임계구역 하나로 끝난다</text>

  <text x="24" y="272" font-size="13" fill="#333333">J1 (최고)</text>
  <text x="24" y="302" font-size="13" fill="#333333">J2 (중간)</text>
  <text x="24" y="332" font-size="13" fill="#333333">J3 (최저)</text>

  <!-- J1 -->
  <rect x="250" y="258" width="20" height="20" fill="#cfe3d7" stroke="#2d6a4f"/>
  <rect x="270" y="258" width="120" height="20" fill="#f7d6d6" stroke="#9d0208" stroke-dasharray="4 3"/>
  <text x="330" y="273" font-size="13" fill="#9d0208" text-anchor="middle">차단</text>
  <rect x="390" y="258" width="100" height="20" fill="#cfe3d7" stroke="#2d6a4f"/>

  <!-- J2 -->
  <rect x="490" y="288" width="120" height="20" fill="#cfe3d7" stroke="#2d6a4f"/>
  <text x="550" y="303" font-size="13" fill="#1b1b1b" text-anchor="middle">J2 실행</text>
  <text x="400" y="303" font-size="13" fill="#b45309" text-anchor="middle">도착했지만 선점하지 못한다</text>

  <!-- J3 -->
  <rect x="150" y="318" width="100" height="20" fill="#2d6a4f"/>
  <rect x="270" y="318" width="120" height="20" fill="#2d6a4f"/>
  <text x="200" y="333" font-size="13" fill="#ffffff" text-anchor="middle">S 임계구역</text>
  <text x="330" y="333" font-size="13" fill="#ffffff" text-anchor="middle">J1 의 우선순위로</text>

  <line x1="130" y1="352" x2="830" y2="352" stroke="#888888"/>
  <line x1="150" y1="348" x2="150" y2="356" stroke="#888888"/>
  <line x1="270" y1="348" x2="270" y2="356" stroke="#888888"/>
  <line x1="310" y1="348" x2="310" y2="356" stroke="#888888"/>
  <line x1="390" y1="348" x2="390" y2="356" stroke="#888888"/>
  <text x="150" y="372" font-size="13" fill="#555555" text-anchor="middle">J3 이 S 잠금</text>
  <text x="272" y="372" font-size="13" fill="#555555" text-anchor="middle">J1 차단 · J3 이 상속</text>
  <text x="390" y="390" font-size="13" fill="#555555" text-anchor="middle">S 해제</text>

  <!-- 범례 -->
  <rect x="560" y="396" width="14" height="14" fill="#2d6a4f"/>
  <text x="580" y="408" font-size="13" fill="#1b1b1b">임계구역</text>
  <rect x="650" y="396" width="14" height="14" fill="#cfe3d7" stroke="#2d6a4f"/>
  <text x="670" y="408" font-size="13" fill="#1b1b1b">실행</text>
  <rect x="716" y="396" width="14" height="14" fill="#f7d6d6" stroke="#9d0208" stroke-dasharray="4 3"/>
  <text x="736" y="408" font-size="13" fill="#1b1b1b">차단·대기</text>
</svg>
