<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Segoe UI',sans-serif">
  <rect x="0" y="0" width="880" height="500" fill="#fbfbf8"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
  </defs>

  <text x="14" y="26" font-size="16" font-weight="bold" fill="#1b1b1b">ELF 파일의 두 가지 보기 — 같은 바이트를 링커는 섹션으로, 로더는 세그먼트로 본다</text>
  <text x="14" y="46" font-size="13" fill="#555">가운데가 파일 안의 실제 배치. 왼쪽 표가 섹션으로 자르고, 오른쪽 표가 세그먼트로 묶는다.</text>

  <!-- 가운데: 파일 배치 -->
  <text x="440" y="78" font-size="13" font-weight="bold" fill="#555" text-anchor="middle">파일 (오프셋 0부터)</text>

  <rect x="330" y="88" width="220" height="40" rx="3" fill="#eceae4" stroke="#777" stroke-width="2"/>
  <text x="440" y="113" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">ELF 헤더</text>

  <rect x="330" y="132" width="220" height="40" rx="3" fill="#e8eef5" stroke="#38618c" stroke-width="2"/>
  <text x="440" y="157" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">프로그램 헤더 테이블</text>

  <rect x="330" y="180" width="220" height="40" rx="3" fill="#d7e8dd" stroke="#2d6a4f" stroke-width="2"/>
  <text x="440" y="205" font-size="14" fill="#1b1b1b" text-anchor="middle">.text</text>

  <rect x="330" y="224" width="220" height="40" rx="3" fill="#d7e8dd" stroke="#2d6a4f" stroke-width="2"/>
  <text x="440" y="249" font-size="14" fill="#1b1b1b" text-anchor="middle">.rodata</text>

  <rect x="330" y="276" width="220" height="40" rx="3" fill="#fdf1e3" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="301" font-size="14" fill="#1b1b1b" text-anchor="middle">.data</text>

  <rect x="330" y="320" width="220" height="40" rx="3" fill="#fdf1e3" stroke="#b45309" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="440" y="345" font-size="14" fill="#1b1b1b" text-anchor="middle">.bss (SHT_NOBITS, 0바이트)</text>

  <rect x="330" y="372" width="220" height="40" rx="3" fill="#eceae4" stroke="#777" stroke-width="2"/>
  <text x="440" y="397" font-size="14" fill="#1b1b1b" text-anchor="middle">.symtab · .strtab · 디버그</text>

  <rect x="330" y="420" width="220" height="40" rx="3" fill="#e8eef5" stroke="#38618c" stroke-width="2"/>
  <text x="440" y="445" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">섹션 헤더 테이블</text>

  <!-- 왼쪽: 링크 보기 -->
  <text x="160" y="78" font-size="13" font-weight="bold" fill="#38618c" text-anchor="middle">링크 보기 — 섹션 헤더 테이블이 가리킨다</text>
  <rect x="40" y="180" width="240" height="180" rx="4" fill="none" stroke="#38618c" stroke-width="2"/>
  <text x="160" y="206" font-size="13" fill="#1b1b1b" text-anchor="middle">섹션마다 sh_type · sh_flags</text>
  <text x="160" y="230" font-size="13" fill="#444" text-anchor="middle">.text    ALLOC + EXECINSTR</text>
  <text x="160" y="252" font-size="13" fill="#444" text-anchor="middle">.rodata  ALLOC</text>
  <text x="160" y="274" font-size="13" fill="#444" text-anchor="middle">.data    ALLOC + WRITE</text>
  <text x="160" y="296" font-size="13" fill="#444" text-anchor="middle">.bss     ALLOC + WRITE</text>
  <text x="160" y="326" font-size="13" fill="#9d0208" text-anchor="middle">ALLOC 없는 섹션은</text>
  <text x="160" y="346" font-size="13" fill="#9d0208" text-anchor="middle">메모리에 올라가지 않는다</text>
  <polyline points="330,440 160,440 160,362" fill="none" stroke="#38618c" stroke-width="2" marker-end="url(#arrg)"/>

  <!-- 오른쪽: 실행 보기 -->
  <text x="720" y="78" font-size="13" font-weight="bold" fill="#2d6a4f" text-anchor="middle">실행 보기 — 프로그램 헤더 테이블이 가리킨다</text>

  <rect x="600" y="180" width="250" height="84" rx="4" fill="#d7e8dd" stroke="#2d6a4f" stroke-width="2"/>
  <text x="725" y="204" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">PT_LOAD ① 텍스트 세그먼트</text>
  <text x="725" y="226" font-size="13" fill="#444" text-anchor="middle">p_flags = PF_R + PF_X (r-x)</text>
  <text x="725" y="248" font-size="13" fill="#444" text-anchor="middle">p_filesz = p_memsz</text>

  <rect x="600" y="276" width="250" height="106" rx="4" fill="#fdf1e3" stroke="#b45309" stroke-width="2"/>
  <text x="725" y="300" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">PT_LOAD ② 데이터 세그먼트</text>
  <text x="725" y="322" font-size="13" fill="#444" text-anchor="middle">p_flags = PF_R + PF_W (rw-)</text>
  <text x="725" y="344" font-size="13" fill="#b45309" text-anchor="middle">p_memsz − p_filesz = .bss 크기</text>
  <text x="725" y="366" font-size="13" fill="#b45309" text-anchor="middle">남는 바이트는 0으로 채운다</text>

  <polyline points="550,152 725,152 725,178" fill="none" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="552" y1="222" x2="598" y2="222" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="552" y1="318" x2="598" y2="318" stroke="#b45309" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 아래 설명 -->
  <text x="14" y="482" font-size="13" fill="#555">묶는 기준은 권한이다. 쓰기가 필요 없는 .text · .rodata 가 한 세그먼트로, 쓰기가 필요한 .data · .bss 가 다른 세그먼트로 간다.</text>
</svg>
