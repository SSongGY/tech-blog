<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#ffffff"/>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">3가지 병렬화의 배치 — n = p · t · d (예: p=2, t=4, d=2 → GPU 16개)</text>

  <!-- 열 제목 -->
  <text x="250" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">파이프라인 단계 1 (앞쪽 층)</text>
  <text x="620" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">파이프라인 단계 2 (뒤쪽 층)</text>

  <!-- 행 제목 -->
  <text x="46" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">복제본 1</text>
  <text x="46" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">복제본 2</text>

  <!-- 노드 A1 -->
  <rect x="100" y="82" width="300" height="130" rx="6" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="250" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">서버 1 — 텐서 병렬 그룹 (t=4)</text>
  <rect x="112" y="116" width="64" height="40" rx="4" fill="#ffffff" stroke="#2d6a4f"/><text x="144" y="141" text-anchor="middle" font-size="13" fill="#1b1b1b">GPU</text>
  <rect x="184" y="116" width="64" height="40" rx="4" fill="#ffffff" stroke="#2d6a4f"/><text x="216" y="141" text-anchor="middle" font-size="13" fill="#1b1b1b">GPU</text>
  <rect x="256" y="116" width="64" height="40" rx="4" fill="#ffffff" stroke="#2d6a4f"/><text x="288" y="141" text-anchor="middle" font-size="13" fill="#1b1b1b">GPU</text>
  <rect x="328" y="116" width="64" height="40" rx="4" fill="#ffffff" stroke="#2d6a4f"/><text x="360" y="141" text-anchor="middle" font-size="13" fill="#1b1b1b">GPU</text>
  <text x="250" y="180" text-anchor="middle" font-size="13" fill="#1b1b1b">한 층의 행렬을 1/t씩 나눠 계산</text>
  <text x="250" y="200" text-anchor="middle" font-size="13" fill="#2d6a4f">층마다 all-reduce (정방향 2 · 역방향 2)</text>

  <!-- 노드 B1 -->
  <rect x="470" y="82" width="300" height="130" rx="6" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="620" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">서버 2 — 텐서 병렬 그룹 (t=4)</text>
  <rect x="482" y="116" width="64" height="40" rx="4" fill="#ffffff" stroke="#2d6a4f"/><text x="514" y="141" text-anchor="middle" font-size="13" fill="#1b1b1b">GPU</text>
  <rect x="554" y="116" width="64" height="40" rx="4" fill="#ffffff" stroke="#2d6a4f"/><text x="586" y="141" text-anchor="middle" font-size="13" fill="#1b1b1b">GPU</text>
  <rect x="626" y="116" width="64" height="40" rx="4" fill="#ffffff" stroke="#2d6a4f"/><text x="658" y="141" text-anchor="middle" font-size="13" fill="#1b1b1b">GPU</text>
  <rect x="698" y="116" width="64" height="40" rx="4" fill="#ffffff" stroke="#2d6a4f"/><text x="730" y="141" text-anchor="middle" font-size="13" fill="#1b1b1b">GPU</text>
  <text x="620" y="180" text-anchor="middle" font-size="13" fill="#1b1b1b">한 층의 행렬을 1/t씩 나눠 계산</text>
  <text x="620" y="200" text-anchor="middle" font-size="13" fill="#2d6a4f">층마다 all-reduce (정방향 2 · 역방향 2)</text>

  <!-- 노드 A2 -->
  <rect x="100" y="262" width="300" height="130" rx="6" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="250" y="284" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">서버 3 — 텐서 병렬 그룹 (t=4)</text>
  <rect x="112" y="296" width="64" height="40" rx="4" fill="#ffffff" stroke="#2d6a4f"/><text x="144" y="321" text-anchor="middle" font-size="13" fill="#1b1b1b">GPU</text>
  <rect x="184" y="296" width="64" height="40" rx="4" fill="#ffffff" stroke="#2d6a4f"/><text x="216" y="321" text-anchor="middle" font-size="13" fill="#1b1b1b">GPU</text>
  <rect x="256" y="296" width="64" height="40" rx="4" fill="#ffffff" stroke="#2d6a4f"/><text x="288" y="321" text-anchor="middle" font-size="13" fill="#1b1b1b">GPU</text>
  <rect x="328" y="296" width="64" height="40" rx="4" fill="#ffffff" stroke="#2d6a4f"/><text x="360" y="321" text-anchor="middle" font-size="13" fill="#1b1b1b">GPU</text>
  <text x="250" y="366" text-anchor="middle" font-size="13" fill="#1b1b1b">복제본 1의 서버 1과 같은 층을 가진다</text>

  <!-- 노드 B2 -->
  <rect x="470" y="262" width="300" height="130" rx="6" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="620" y="284" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">서버 4 — 텐서 병렬 그룹 (t=4)</text>
  <rect x="482" y="296" width="64" height="40" rx="4" fill="#ffffff" stroke="#2d6a4f"/><text x="514" y="321" text-anchor="middle" font-size="13" fill="#1b1b1b">GPU</text>
  <rect x="554" y="296" width="64" height="40" rx="4" fill="#ffffff" stroke="#2d6a4f"/><text x="586" y="321" text-anchor="middle" font-size="13" fill="#1b1b1b">GPU</text>
  <rect x="626" y="296" width="64" height="40" rx="4" fill="#ffffff" stroke="#2d6a4f"/><text x="658" y="321" text-anchor="middle" font-size="13" fill="#1b1b1b">GPU</text>
  <rect x="698" y="296" width="64" height="40" rx="4" fill="#ffffff" stroke="#2d6a4f"/><text x="730" y="321" text-anchor="middle" font-size="13" fill="#1b1b1b">GPU</text>
  <text x="620" y="366" text-anchor="middle" font-size="13" fill="#1b1b1b">복제본 1의 서버 2와 같은 층을 가진다</text>

  <!-- 파이프라인 화살표 (서버 간, 점대점) -->
  <line x1="400" y1="147" x2="462" y2="147" stroke="#b45309" stroke-width="2.2"/>
  <polygon points="456,141 468,147 456,153" fill="#b45309"/>
  <line x1="400" y1="327" x2="462" y2="327" stroke="#b45309" stroke-width="2.2"/>
  <polygon points="456,321 468,327 456,333" fill="#b45309"/>

  <!-- 데이터 병렬 화살표 (복제본 간) -->
  <line x1="250" y1="216" x2="250" y2="256" stroke="#1c4f82" stroke-width="2.2" stroke-dasharray="6,4"/>
  <line x1="620" y1="216" x2="620" y2="256" stroke="#1c4f82" stroke-width="2.2" stroke-dasharray="6,4"/>
  <text x="262" y="241" font-size="13" fill="#1c4f82">기울기 all-reduce</text>
  <text x="632" y="241" font-size="13" fill="#1c4f82">기울기 all-reduce</text>

  <!-- 범례 -->
  <line x1="100" y1="424" x2="140" y2="424" stroke="#2d6a4f" stroke-width="6"/>
  <text x="150" y="429" font-size="13" fill="#1b1b1b">텐서 병렬 (t) — 서버 안 고대역 연결. 층마다, 마이크로배치마다 통신한다</text>
  <line x1="100" y1="452" x2="140" y2="452" stroke="#b45309" stroke-width="2.2"/>
  <text x="150" y="457" font-size="13" fill="#1b1b1b">파이프라인 병렬 (p) — 서버 사이. 단계 경계에서 활성값·기울기를 점대점으로 넘긴다</text>
  <line x1="100" y1="480" x2="140" y2="480" stroke="#1c4f82" stroke-width="2.2" stroke-dasharray="6,4"/>
  <text x="150" y="485" font-size="13" fill="#1b1b1b">데이터 병렬 (d) — 같은 층을 가진 GPU끼리. 배치마다 한 번 기울기를 모은다</text>
</svg>
