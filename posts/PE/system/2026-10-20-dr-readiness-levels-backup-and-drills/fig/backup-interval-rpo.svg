<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="300" fill="#fbfaf7"/>

  <text x="32" y="36" font-size="17" font-weight="bold" fill="#1f2933">백업 주기 T 가 RPO 의 바닥이 된다</text>
  <text x="32" y="58" font-size="13" fill="#52606d">RPO 는 가장 최근 백업본을 기준으로 하므로, 잃는 양의 상한은 주기 T 다</text>

  <!-- 잃는 구간 음영 -->
  <rect x="620" y="122" width="115" height="52" fill="#fde8e8" stroke="#9d0208" stroke-width="1.5"/>
  <text x="677" y="153" font-size="14" font-weight="bold" fill="#9d0208" text-anchor="middle">잃는 구간</text>

  <!-- 시간축 -->
  <line x1="60" y1="174" x2="830" y2="174" stroke="#3e4c59" stroke-width="2"/>
  <polygon points="830,174 818,169 818,179" fill="#3e4c59"/>
  <text x="836" y="193" font-size="13" fill="#52606d">시간</text>

  <!-- 백업 시점 -->
  <line x1="160" y1="160" x2="160" y2="188" stroke="#2d6a4f" stroke-width="3"/>
  <line x1="320" y1="160" x2="320" y2="188" stroke="#2d6a4f" stroke-width="3"/>
  <line x1="480" y1="160" x2="480" y2="188" stroke="#2d6a4f" stroke-width="3"/>
  <line x1="620" y1="160" x2="620" y2="188" stroke="#2d6a4f" stroke-width="3"/>
  <text x="160" y="210" font-size="13" fill="#2d6a4f" text-anchor="middle">백업</text>
  <text x="320" y="210" font-size="13" fill="#2d6a4f" text-anchor="middle">백업</text>
  <text x="480" y="210" font-size="13" fill="#2d6a4f" text-anchor="middle">백업</text>
  <text x="620" y="210" font-size="13" fill="#2d6a4f" text-anchor="middle">마지막 백업</text>

  <!-- 다음 백업 예정 -->
  <line x1="780" y1="160" x2="780" y2="188" stroke="#9aa5b1" stroke-width="3" stroke-dasharray="5 4"/>
  <text x="783" y="232" font-size="13" fill="#7b8794" text-anchor="middle">다음 백업 예정</text>

  <!-- 재해 -->
  <line x1="735" y1="96" x2="735" y2="200" stroke="#9d0208" stroke-width="2.5"/>
  <text x="735" y="88" font-size="14" font-weight="bold" fill="#9d0208" text-anchor="middle">재해</text>

  <!-- 주기 T 괄호 -->
  <line x1="480" y1="246" x2="620" y2="246" stroke="#3e4c59" stroke-width="1.5"/>
  <line x1="480" y1="238" x2="480" y2="254" stroke="#3e4c59" stroke-width="1.5"/>
  <line x1="620" y1="238" x2="620" y2="254" stroke="#3e4c59" stroke-width="1.5"/>
  <text x="550" y="270" font-size="14" font-weight="bold" fill="#3e4c59" text-anchor="middle">백업 주기 T</text>

  <!-- 복구 지점 -->
  <text x="620" y="118" font-size="13" fill="#2d6a4f" text-anchor="middle">복구 가능한 시점</text>

  <text x="32" y="270" font-size="13" fill="#52606d">재해가 다음 백업 직전에 오면 잃는 구간은 T 에 가까워진다</text>
</svg>
