<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="540" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
    <marker id="arr-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9d0208"/>
    </marker>
  </defs>
  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">데이터센터 액체 냉각 — 열이 지나는 길과 ASHRAE 시설수 온도 등급</text>

  <!-- 왼쪽: 열 경로 (위에서 아래) -->
  <text x="250" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">열 경로 (칩 → 외기)</text>

  <rect x="40" y="76" width="420" height="62" rx="6" fill="#fff5f5" stroke="#9d0208" stroke-width="2"/>
  <text x="250" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d0208">① 칩 (GPU · CPU · 메모리)</text>
  <text x="250" y="122" text-anchor="middle" font-size="13" fill="#333">소켓 전력 ↑ · 케이스 온도 한계 ↓ → 공기로는 열저항을 못 맞춘다</text>

  <path d="M250 138 L250 160" stroke="#9d0208" stroke-width="1.5" marker-end="url(#arr-hot)"/>

  <!-- 열 포집: 두 갈래 -->
  <rect x="40" y="160" width="200" height="78" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="140" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">② 콜드플레이트</text>
  <text x="140" y="205" text-anchor="middle" font-size="13" fill="#333">칩 위에 직접 (direct-to-chip)</text>
  <text x="140" y="225" text-anchor="middle" font-size="13" fill="#333">나머지 부품은 공랭 (하이브리드)</text>

  <rect x="260" y="160" width="200" height="78" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="360" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">② 액침 탱크</text>
  <text x="360" y="205" text-anchor="middle" font-size="13" fill="#333">단상: 액체 상태로 순환</text>
  <text x="360" y="225" text-anchor="middle" font-size="13" fill="#333">2상: 끓어 증기 → 상부 응축</text>

  <path d="M140 238 L140 262 L250 262 L250 278" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M360 238 L360 262 L250 262" fill="none" stroke="#555" stroke-width="1.5"/>

  <!-- CDU -->
  <rect x="40" y="278" width="420" height="116" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="2"/>
  <text x="250" y="302" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">③ CDU (냉각수 분배 장치) — 두 회로의 경계</text>
  <text x="250" y="324" text-anchor="middle" font-size="13" fill="#333">펌프 + 열교환기 · 2차(IT 냉각수)와 1차(시설수) 회로 분리</text>
  <text x="250" y="344" text-anchor="middle" font-size="13" fill="#333">액체-액체 교환 → 시설수로 배출</text>
  <text x="250" y="364" text-anchor="middle" font-size="13" fill="#333">액체-공기 교환 → 전산실 공기로 (과도기)</text>
  <text x="250" y="384" text-anchor="middle" font-size="13" fill="#333">예: 750 kW급 CDU 1대가 랙 8개</text>

  <path d="M250 394 L250 416" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="40" y="416" width="420" height="62" rx="6" fill="#eef4f0" stroke="#2d6a4f" stroke-width="2"/>
  <text x="250" y="440" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">④ 시설수 회로 → 열 배출</text>
  <text x="250" y="462" text-anchor="middle" font-size="13" fill="#333">냉각탑·드라이쿨러 / 냉동기 / 열 재사용(난방·흡착식 냉동기)</text>

  <text x="250" y="502" text-anchor="middle" font-size="13" fill="#555">시설수 온도가 높을수록 냉동기 없이 외기로 버리는 시간이 길다</text>
  <text x="250" y="522" text-anchor="middle" font-size="13" fill="#555">칩 전력이 오르면 요구 온도가 내려가 그 시간이 줄어든다</text>

  <!-- 오른쪽: W 등급 막대 -->
  <text x="690" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">시설수 공급 온도 등급 (5판, 2021)</text>
  <text x="690" y="82" text-anchor="middle" font-size="13" fill="#555">이름 = 상한 온도 · 하한은 모두 2°C</text>

  <!-- 축 -->
  <line x1="560" y1="100" x2="560" y2="460" stroke="#555" stroke-width="1.5"/>
  <line x1="560" y1="460" x2="820" y2="460" stroke="#555" stroke-width="1.5"/>

  <!-- 막대: 높이는 상한 온도에 비례 (1°C = 6px, 기준선 y=460, W+는 45 초과를 점선으로) -->
  <rect x="580" y="358" width="30" height="102" fill="#9d0208" opacity="0.85"/>
  <text x="595" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">W17</text>
  <text x="595" y="478" text-anchor="middle" font-size="13" fill="#333">17°C</text>

  <rect x="620" y="298" width="30" height="162" fill="#b45309" opacity="0.85"/>
  <text x="635" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">W27</text>
  <text x="635" y="478" text-anchor="middle" font-size="13" fill="#333">27°C</text>

  <rect x="660" y="268" width="30" height="192" fill="#b45309" opacity="0.85"/>
  <text x="675" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">W32</text>
  <text x="675" y="478" text-anchor="middle" font-size="13" fill="#333">32°C</text>

  <rect x="700" y="220" width="30" height="240" fill="#2d6a4f" opacity="0.85"/>
  <text x="715" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">W40</text>
  <text x="715" y="478" text-anchor="middle" font-size="13" fill="#333">40°C</text>

  <rect x="740" y="190" width="30" height="270" fill="#2d6a4f" opacity="0.85"/>
  <text x="755" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">W45</text>
  <text x="755" y="478" text-anchor="middle" font-size="13" fill="#333">45°C</text>

  <rect x="780" y="190" width="30" height="270" fill="none" stroke="#2d6a4f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="795" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">W+</text>
  <text x="795" y="478" text-anchor="middle" font-size="13" fill="#333">&gt;45°C</text>

  <text x="690" y="500" text-anchor="middle" font-size="13" fill="#9d0208">◀ 냉동기 필요</text>
  <text x="690" y="520" text-anchor="middle" font-size="13" fill="#2d6a4f">외기 냉각 · 열 재사용 ▶</text>
</svg>
