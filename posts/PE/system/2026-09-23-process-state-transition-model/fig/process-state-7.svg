<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="500" fill="#ffffff"/>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#4a5568" stroke-width="1.6"/>
    </marker>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#b45309" stroke-width="1.6"/>
    </marker>
  </defs>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">프로세스 상태 전이 — 5상태와 보류 상태 2개</text>
  <text x="440" y="52" text-anchor="middle" font-size="13" fill="#4a5568">실선 테두리 = 5상태 · 점선 테두리 = 7상태로 확장할 때 더하는 상태</text>

  <!-- 5상태 -->
  <rect x="30" y="100" width="130" height="50" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.6" rx="4"/>
  <text x="95" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">생성</text>
  <text x="95" y="141" text-anchor="middle" font-size="13" fill="#4a5568">New</text>

  <text x="295" y="92" text-anchor="middle" font-size="13" fill="#2d6a4f">준비 큐 (프로세서마다)</text>
  <rect x="230" y="100" width="130" height="50" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.6" rx="4"/>
  <text x="295" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">준비</text>
  <text x="295" y="141" text-anchor="middle" font-size="13" fill="#4a5568">Ready</text>

  <rect x="470" y="100" width="130" height="50" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.8" rx="4"/>
  <text x="535" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">실행</text>
  <text x="535" y="141" text-anchor="middle" font-size="13" fill="#4a5568">Running</text>

  <rect x="710" y="100" width="130" height="50" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.6" rx="4"/>
  <text x="775" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">종료</text>
  <text x="775" y="141" text-anchor="middle" font-size="13" fill="#4a5568">Terminated</text>
  <text x="775" y="172" text-anchor="middle" font-size="13" fill="#4a5568">부모가 wait()로 거둘</text>
  <text x="775" y="190" text-anchor="middle" font-size="13" fill="#4a5568">때까지 PID 보존</text>

  <rect x="470" y="240" width="130" height="50" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.6" rx="4"/>
  <text x="535" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">대기</text>
  <text x="535" y="281" text-anchor="middle" font-size="13" fill="#4a5568">Waiting / Blocked</text>
  <text x="612" y="262" font-size="13" fill="#2d6a4f">대기 큐</text>
  <text x="612" y="280" font-size="13" fill="#2d6a4f">(장치·사건마다)</text>

  <!-- 5상태 전이 6가지 -->
  <line x1="160" y1="125" x2="226" y2="125" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="193" y="116" text-anchor="middle" font-size="13" fill="#1b1b1b">승인</text>

  <line x1="360" y1="112" x2="466" y2="112" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="413" y="104" text-anchor="middle" font-size="13" fill="#1b1b1b">디스패치</text>
  <line x1="470" y1="138" x2="364" y2="138" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="413" y="160" text-anchor="middle" font-size="13" fill="#1b1b1b">인터럽트</text>

  <line x1="600" y1="125" x2="706" y2="125" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="653" y="116" text-anchor="middle" font-size="13" fill="#1b1b1b">종료</text>

  <line x1="520" y1="150" x2="520" y2="236" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="530" y="200" font-size="13" fill="#1b1b1b">입출력·사건 대기</text>

  <line x1="470" y1="258" x2="330" y2="154" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="395" y="262" text-anchor="middle" font-size="13" fill="#1b1b1b">입출력·사건 완료</text>

  <!-- 메모리 경계 -->
  <line x1="20" y1="335" x2="860" y2="335" stroke="#b45309" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="850" y="327" text-anchor="end" font-size="13" fill="#4a5568">주기억장치</text>
  <text x="850" y="352" text-anchor="end" font-size="13" fill="#4a5568">보조기억장치 (스왑 영역)</text>
  <text x="30" y="327" font-size="13" font-weight="bold" fill="#b45309">중기 스케줄러가 오가는 경계</text>

  <!-- 보류 상태 2개 -->
  <rect x="230" y="390" width="130" height="50" fill="#fffaf0" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5,3" rx="4"/>
  <text x="295" y="413" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">준비·보류</text>
  <text x="295" y="431" text-anchor="middle" font-size="13" fill="#4a5568">Ready/Suspend</text>

  <rect x="470" y="390" width="130" height="50" fill="#fffaf0" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5,3" rx="4"/>
  <text x="535" y="413" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">대기·보류</text>
  <text x="535" y="431" text-anchor="middle" font-size="13" fill="#4a5568">Blocked/Suspend</text>

  <!-- 보류·활성화 -->
  <line x1="280" y1="150" x2="280" y2="386" stroke="#b45309" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="272" y="270" text-anchor="end" font-size="13" fill="#b45309">보류</text>
  <line x1="310" y1="390" x2="310" y2="154" stroke="#b45309" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="318" y="300" font-size="13" fill="#b45309">활성화</text>

  <line x1="520" y1="290" x2="520" y2="386" stroke="#b45309" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="512" y="372" text-anchor="end" font-size="13" fill="#b45309">보류</text>
  <line x1="550" y1="390" x2="550" y2="294" stroke="#b45309" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="558" y="372" font-size="13" fill="#b45309">활성화</text>

  <line x1="470" y1="415" x2="364" y2="415" stroke="#b45309" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="417" y="407" text-anchor="middle" font-size="13" fill="#b45309">사건 완료</text>

  <text x="440" y="478" text-anchor="middle" font-size="13" fill="#4a5568">대기 → 실행으로 가는 화살표는 없다. 사건이 끝나면 준비로 돌아가 디스패치를 기다린다.</text>
</svg>
