<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="430" fill="#ffffff"/>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">매체가 빈 뒤 누가 먼저 잡는가 — 기다리는 시간의 길이가 우선순위다</text>
  <text x="440" y="52" text-anchor="middle" font-size="13" fill="#4a5568">5 GHz 값: SIFS 16 µs, 슬롯 9 µs · 가로 1 µs = 3 px</text>

  <!-- 행 라벨 -->
  <g font-size="13" fill="#1b1b1b">
    <text x="20" y="96">매체</text>
    <text x="20" y="146">수신 국 (ACK)</text>
    <text x="20" y="196">DCF · AC_VO</text>
    <text x="20" y="246">AC_BE</text>
    <text x="20" y="296">AC_BK</text>
  </g>

  <!-- 매체 사용: DATA, SIFS, ACK -->
  <rect x="130" y="76" width="110" height="30" fill="#e2e8f0" stroke="#4a5568"/>
  <text x="185" y="96" text-anchor="middle" font-size="13" fill="#1b1b1b">DATA</text>
  <rect x="288" y="76" width="70" height="30" fill="#e2e8f0" stroke="#4a5568"/>
  <text x="323" y="96" text-anchor="middle" font-size="13" fill="#1b1b1b">ACK</text>

  <!-- 수신 국: SIFS -->
  <rect x="240" y="126" width="48" height="30" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="264" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d6a4f">SIFS</text>
  <text x="300" y="146" font-size="13" fill="#2d6a4f">16 µs 뒤 바로 ACK — 아무도 끼어들지 못한다</text>

  <!-- 기준선: ACK 끝 -->
  <line x1="358" y1="164" x2="358" y2="330" stroke="#4a5568" stroke-dasharray="4,3"/>
  <text x="358" y="346" text-anchor="middle" font-size="13" fill="#4a5568">ACK 끝 = 매체 빔</text>

  <!-- DCF / AC_VO : AIFS 34 us = 102 px, 백오프 슬롯 27 px -->
  <rect x="358" y="176" width="102" height="30" fill="#f3f4f6" stroke="#4a5568"/>
  <text x="409" y="196" text-anchor="middle" font-size="13" fill="#1b1b1b">DIFS=AIFS 34</text>
  <g fill="#eef5f0" stroke="#2d6a4f">
    <rect x="460" y="176" width="27" height="30"/>
    <rect x="487" y="176" width="27" height="30"/>
  </g>
  <text x="525" y="196" font-size="13" fill="#2d6a4f">백오프 0~3 슬롯 → 송신</text>

  <!-- AC_BE : AIFS 43 us = 129 px -->
  <rect x="358" y="226" width="129" height="30" fill="#f3f4f6" stroke="#4a5568"/>
  <text x="422" y="246" text-anchor="middle" font-size="13" fill="#1b1b1b">AIFS 43</text>
  <g fill="#fdf3e7" stroke="#b45309">
    <rect x="487" y="226" width="27" height="30"/>
    <rect x="514" y="226" width="27" height="30"/>
    <rect x="541" y="226" width="27" height="30"/>
  </g>
  <text x="578" y="246" font-size="13" fill="#b45309">백오프 0~15 슬롯</text>

  <!-- AC_BK : AIFS 79 us = 237 px -->
  <rect x="358" y="276" width="237" height="30" fill="#f3f4f6" stroke="#4a5568"/>
  <text x="476" y="296" text-anchor="middle" font-size="13" fill="#1b1b1b">AIFS 79</text>
  <g fill="#fdf3e7" stroke="#b45309">
    <rect x="595" y="276" width="27" height="30"/>
    <rect x="622" y="276" width="27" height="30"/>
  </g>
  <text x="660" y="296" font-size="13" fill="#b45309">백오프 0~15 슬롯</text>

  <!-- 하단 규칙 -->
  <line x1="20" y1="362" x2="860" y2="362" stroke="#cbd5e0" stroke-width="1.2"/>
  <g font-size="13" fill="#1b1b1b">
    <text x="20" y="386">SIFS &lt; DIFS(AIFS): 진행 중인 교환(ACK·CTS)이 새 경쟁보다 먼저다 · AIFS = SIFS + AIFSN × 슬롯</text>
    <text x="20" y="410" fill="#b45309">백오프 중 매체가 바빠지면 카운터를 그 값에서 멈추고, 다시 DIFS(AIFS) 동안 비면 이어서 줄인다</text>
  </g>
</svg>
