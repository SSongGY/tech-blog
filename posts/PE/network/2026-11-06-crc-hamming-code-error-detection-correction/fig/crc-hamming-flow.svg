<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360"
     font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="880" height="360" fill="#f8f9fa"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#212529">CRC 송수신 절차와 해밍(7,4) 신드롬 계산</text>

  <text x="20" y="58" font-size="13" font-weight="bold" fill="#212529">가. CRC (G = 10011)</text>
  <rect x="20" y="70" width="190" height="60" rx="6" fill="#ffffff" stroke="#212529" stroke-width="1.5"/>
  <text x="115" y="94" font-size="13" fill="#212529" text-anchor="middle">데이터 1101011011</text>
  <text x="115" y="114" font-size="13" fill="#212529" text-anchor="middle">+ 0000 (r개)</text>
  <rect x="250" y="70" width="190" height="60" rx="6" fill="#ffffff" stroke="#212529" stroke-width="1.5"/>
  <text x="345" y="94" font-size="13" fill="#212529" text-anchor="middle">G로 XOR 나눗셈</text>
  <text x="345" y="114" font-size="13" fill="#212529" text-anchor="middle">나머지 1110</text>
  <rect x="480" y="70" width="190" height="60" rx="6" fill="#ffffff" stroke="#212529" stroke-width="1.5"/>
  <text x="575" y="94" font-size="13" fill="#212529" text-anchor="middle">전송 11010110111110</text>
  <text x="575" y="114" font-size="13" fill="#212529" text-anchor="middle">(나머지를 덧붙임)</text>
  <rect x="710" y="70" width="150" height="60" rx="6" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="785" y="94" font-size="13" fill="#212529" text-anchor="middle">수신: G로 나눔</text>
  <text x="785" y="114" font-size="13" fill="#212529" text-anchor="middle">나머지 0 = 정상</text>
  <line x1="210" y1="100" x2="248" y2="100" stroke="#212529" stroke-width="1.5"/>
  <line x1="440" y1="100" x2="478" y2="100" stroke="#212529" stroke-width="1.5"/>
  <line x1="670" y1="100" x2="708" y2="100" stroke="#212529" stroke-width="1.5"/>

  <text x="20" y="170" font-size="13" font-weight="bold" fill="#212529">나. 해밍(7,4) — 위치 5가 바뀐 0110111 수신</text>
  <g font-size="13" fill="#212529" text-anchor="middle">
    <rect x="20"  y="184" width="80" height="44" fill="#ffffff" stroke="#212529"/><text x="60"  y="204">위치 1</text><text x="60"  y="222">p1 = 0</text>
    <rect x="100" y="184" width="80" height="44" fill="#ffffff" stroke="#212529"/><text x="140" y="204">위치 2</text><text x="140" y="222">p2 = 1</text>
    <rect x="180" y="184" width="80" height="44" fill="#ffffff" stroke="#212529"/><text x="220" y="204">위치 3</text><text x="220" y="222">d = 1</text>
    <rect x="260" y="184" width="80" height="44" fill="#ffffff" stroke="#212529"/><text x="300" y="204">위치 4</text><text x="300" y="222">p4 = 0</text>
    <rect x="340" y="184" width="80" height="44" fill="#ffe3e3" stroke="#9d0208" stroke-width="2"/><text x="380" y="204">위치 5</text><text x="380" y="222">1 (원래 0)</text>
    <rect x="420" y="184" width="80" height="44" fill="#ffffff" stroke="#212529"/><text x="460" y="204">위치 6</text><text x="460" y="222">d = 1</text>
    <rect x="500" y="184" width="80" height="44" fill="#ffffff" stroke="#212529"/><text x="540" y="204">위치 7</text><text x="540" y="222">d = 1</text>
  </g>
  <text x="20" y="262" font-size="13" fill="#212529">검사 1 (1,3,5,7) 위반 → 1 · 검사 2 (2,3,6,7) 정상 → 0 · 검사 4 (4,5,6,7) 위반 → 1</text>
  <rect x="20" y="276" width="560" height="50" rx="6" fill="#fff3e0" stroke="#b45309" stroke-width="1.5"/>
  <text x="300" y="298" font-size="13" fill="#212529" text-anchor="middle">신드롬 = 1·1 + 0·2 + 1·4 = 5 → 위치 5의 비트를 뒤집어 정정</text>
  <text x="300" y="316" font-size="13" fill="#212529" text-anchor="middle">해밍 거리 d = 3 : 검출 2비트 · 정정 1비트</text>
</svg>
