<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="560" fill="#fbfbf8"/>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">BGP 결정 절차 3단계와 RIB의 관계</text>
  <text x="30" y="58" font-size="13" fill="#555">왼쪽 기둥은 경로가 지나가는 순서, 오른쪽은 2단계가 후보를 걸러내는 조건이다.</text>

  <!-- 중심 흐름 -->
  <rect x="50" y="86" width="360" height="54" rx="6" fill="#f1f1ec" stroke="#8a8a84" stroke-width="1.4"/>
  <text x="230" y="108" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">Adj-RIBs-In</text>
  <text x="230" y="129" font-size="13" fill="#555" text-anchor="middle">피어에게서 받은 경로를 그대로 담아 둔다</text>

  <rect x="50" y="170" width="360" height="54" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.6"/>
  <text x="230" y="192" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">1단계 — 선호도 계산 (§9.1.1)</text>
  <text x="230" y="213" font-size="13" fill="#555" text-anchor="middle">경로마다 선호도를 매긴다</text>

  <rect x="50" y="254" width="360" height="54" rx="6" fill="#eaf3ee" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="230" y="276" font-size="13" font-weight="bold" fill="#2d6a4f" text-anchor="middle">2단계 — 최적 경로 선택 (§9.1.2)</text>
  <text x="230" y="297" font-size="13" fill="#333" text-anchor="middle">목적지마다 하나를 골라 설치한다</text>

  <rect x="50" y="338" width="360" height="54" rx="6" fill="#f1f1ec" stroke="#8a8a84" stroke-width="1.4"/>
  <text x="230" y="360" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">Loc-RIB</text>
  <text x="230" y="381" font-size="13" fill="#555" text-anchor="middle">이 라우터가 쓰기로 한 경로</text>

  <rect x="50" y="422" width="360" height="54" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.6"/>
  <text x="230" y="444" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">3단계 — 전파 (§9.1.3)</text>
  <text x="230" y="465" font-size="13" fill="#555" text-anchor="middle">정책에 따라 피어별로 내보낼 것을 정한다</text>

  <rect x="50" y="490" width="360" height="40" rx="6" fill="#f1f1ec" stroke="#8a8a84" stroke-width="1.4"/>
  <text x="230" y="516" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">Adj-RIBs-Out</text>

  <line x1="230" y1="140" x2="230" y2="166" stroke="#8a8a84" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="230" y1="224" x2="230" y2="250" stroke="#8a8a84" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="230" y1="308" x2="230" y2="334" stroke="#8a8a84" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="230" y1="392" x2="230" y2="418" stroke="#8a8a84" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="230" y1="476" x2="230" y2="486" stroke="#8a8a84" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 오른쪽 조건 -->
  <rect x="470" y="160" width="380" height="110" rx="6" fill="#fdecec" stroke="#9d0208" stroke-width="1.5"/>
  <text x="490" y="186" font-size="13" font-weight="bold" fill="#9d0208">후보에서 빼는 조건 2가지</text>
  <text x="490" y="210" font-size="13" fill="#333">① NEXT_HOP 을 풀 수 없다 → 제외 (MUST)</text>
  <text x="490" y="232" font-size="13" fill="#333">② AS_PATH 에 자기 AS 번호 → 제외 (SHOULD)</text>
  <text x="490" y="256" font-size="13" fill="#555">같은 단계 안에서도 강제 수준이 다르다</text>

  <rect x="470" y="290" width="380" height="92" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="490" y="316" font-size="13" font-weight="bold" fill="#b45309">그래도 남으면 동점 처리 (§9.1.2.2)</text>
  <text x="490" y="340" font-size="13" fill="#333">a AS 개수 → b ORIGIN → c MED → d eBGP</text>
  <text x="490" y="362" font-size="13" fill="#333">→ e 내부 비용 → f BGP 식별자 → g 피어 주소</text>

  <line x1="466" y1="215" x2="416" y2="268" stroke="#9d0208" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="466" y1="336" x2="416" y2="294" stroke="#b45309" stroke-width="1.6" marker-end="url(#arb)"/>

  <text x="50" y="552" font-size="13" fill="#555">동점 처리의 기준은 명시된 순서대로 적용해야 한다(MUST). 순서 자체가 규격이다.</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a84"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9d0208"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
