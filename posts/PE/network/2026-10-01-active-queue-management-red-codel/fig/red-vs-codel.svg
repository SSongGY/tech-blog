<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="560" fill="#fbfbf8"/>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">능동 큐 관리 — 판단하는 시점과 기준이 다른 두 방식</text>

  <!-- RED -->
  <text x="30" y="70" font-size="14" font-weight="bold" fill="#b45309">가. RED — 들어올 때, 평균 큐 길이로 판단</text>

  <rect x="30" y="86" width="200" height="66" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="130" y="112" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">① 평균 큐 길이</text>
  <text x="130" y="134" font-size="13" fill="#555" text-anchor="middle">avg ← (1−w_q)·avg + w_q·q</text>

  <line x1="230" y1="119" x2="256" y2="119" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="260" y="86" width="200" height="66" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="360" y="112" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">② 표시 확률</text>
  <text x="360" y="134" font-size="13" fill="#555" text-anchor="middle">두 임계치 사이 0 → max_p</text>

  <line x1="460" y1="119" x2="486" y2="119" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="490" y="86" width="200" height="66" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="590" y="112" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">③ 도착 패킷 폐기</text>
  <text x="590" y="134" font-size="13" fill="#555" text-anchor="middle">또는 ECN 표시</text>

  <!-- p_b 그래프 -->
  <line x1="722" y1="160" x2="862" y2="160" stroke="#3b3b3b" stroke-width="1.2"/>
  <line x1="722" y1="160" x2="722" y2="80" stroke="#3b3b3b" stroke-width="1.2"/>
  <polyline points="722,158 768,158 818,140" fill="none" stroke="#b45309" stroke-width="2"/>
  <line x1="818" y1="140" x2="818" y2="90" stroke="#b45309" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="818" y1="90" x2="858" y2="90" stroke="#9d0208" stroke-width="2"/>
  <text x="768" y="177" font-size="13" fill="#333" text-anchor="middle">min</text>
  <text x="818" y="177" font-size="13" fill="#333" text-anchor="middle">max</text>
  <text x="726" y="94" font-size="13" fill="#333">1</text>
  <text x="824" y="140" font-size="13" fill="#b45309">max_p</text>
  <text x="836" y="80" font-size="13" fill="#9d0208" text-anchor="middle">전부</text>

  <!-- 공통 큐 -->
  <text x="30" y="262" font-size="13" fill="#333">도착</text>
  <line x1="66" y1="257" x2="196" y2="257" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="200" y="232" width="440" height="50" rx="4" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <rect x="210" y="242" width="40" height="30" fill="#e9ecef" stroke="#8a8a84"/>
  <rect x="256" y="242" width="40" height="30" fill="#e9ecef" stroke="#8a8a84"/>
  <rect x="302" y="242" width="40" height="30" fill="#e9ecef" stroke="#8a8a84"/>
  <rect x="348" y="242" width="40" height="30" fill="#e9ecef" stroke="#8a8a84"/>
  <text x="530" y="262" font-size="13" fill="#555" text-anchor="middle">꼬리 ← 큐 → 머리</text>

  <line x1="640" y1="257" x2="756" y2="257" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="762" y="262" font-size="13" fill="#333">출력 링크</text>

  <!-- 판단 지점 표시 -->
  <line x1="590" y1="152" x2="206" y2="228" stroke="#b45309" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arO)"/>
  <text x="110" y="214" font-size="13" fill="#b45309">입큐 시점</text>
  <line x1="700" y1="330" x2="700" y2="264" stroke="#2d6a4f" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arG)"/>
  <text x="710" y="304" font-size="13" fill="#2d6a4f">출큐 시점</text>

  <!-- CoDel -->
  <text x="30" y="322" font-size="14" font-weight="bold" fill="#2d6a4f">나. CoDel — 나갈 때, 체류 시간으로 판단</text>

  <rect x="30" y="340" width="190" height="78" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="125" y="368" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">① 입큐 시각 기록</text>
  <text x="125" y="392" font-size="13" fill="#555" text-anchor="middle">패킷마다 tstamp</text>

  <line x1="220" y1="379" x2="240" y2="379" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="244" y="340" width="190" height="78" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="339" y="368" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">② 체류 시간</text>
  <text x="339" y="392" font-size="13" fill="#555" text-anchor="middle">출큐 시각 − tstamp</text>

  <line x1="434" y1="379" x2="454" y2="379" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="458" y="340" width="190" height="78" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="553" y="364" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">③ 나쁜 큐 판정</text>
  <text x="553" y="386" font-size="13" fill="#555" text-anchor="middle">TARGET 5 ms 초과가</text>
  <text x="553" y="406" font-size="13" fill="#555" text-anchor="middle">INTERVAL 100 ms 지속</text>

  <line x1="648" y1="379" x2="668" y2="379" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="672" y="340" width="190" height="78" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="767" y="364" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">④ 머리 패킷 폐기</text>
  <text x="767" y="386" font-size="13" fill="#555" text-anchor="middle">다음 드롭 =</text>
  <text x="767" y="406" font-size="13" fill="#555" text-anchor="middle">+ INTERVAL / √count</text>

  <line x1="553" y1="418" x2="553" y2="446" stroke="#8a8a84" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="553" y="464" font-size="13" fill="#555" text-anchor="middle">TARGET 아래로 내려가면 드롭 상태를 빠져나온다</text>

  <!-- 범례 -->
  <text x="30" y="506" font-size="13" fill="#333">RED 설정값: w_q · min_th · max_th · max_p (큐 길이 단위 — 링크 속도가 바뀌면 다시 맞춰야 한다)</text>
  <text x="30" y="530" font-size="13" fill="#333">CoDel 설정값: TARGET · INTERVAL (시간 단위 — 링크 속도와 무관하게 기본값으로 동작)</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a84"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6a4f"/>
    </marker>
  </defs>
</svg>
