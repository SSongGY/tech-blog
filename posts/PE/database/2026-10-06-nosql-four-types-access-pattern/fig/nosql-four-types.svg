<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fbfbf8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b3b3b"/>
    </marker>
  </defs>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">NoSQL 4가지 유형 — 질의가 무엇을 찾는지가 모델을 정한다</text>
  <text x="30" y="56" font-size="13" fill="#555">각 유형의 데이터 모양, 한 번에 원자적으로 바뀌는 단위, 잘 맞는 접근 패턴</text>

  <!-- 접근 패턴 -->
  <rect x="290" y="74" width="300" height="56" rx="6" fill="#f3f1ea" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="440" y="99" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">접근 패턴</text>
  <text x="440" y="119" font-size="13" fill="#555" text-anchor="middle">무엇으로 찾고, 무엇을 함께 읽는가</text>

  <line x1="330" y1="130" x2="125" y2="172" stroke="#3b3b3b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="130" x2="330" y2="172" stroke="#3b3b3b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="130" x2="550" y2="172" stroke="#3b3b3b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="130" x2="755" y2="172" stroke="#3b3b3b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 키-값 -->
  <rect x="30" y="176" width="190" height="200" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="125" y="202" font-size="15" font-weight="bold" fill="#1b1b1b" text-anchor="middle">키-값</text>
  <text x="46" y="232" font-size="13" fill="#1b1b1b">key → 불투명한 값</text>
  <text x="46" y="262" font-size="13" fill="#555">원자 단위: 키 하나</text>
  <text x="46" y="292" font-size="13" fill="#555">연산: get / put</text>
  <text x="46" y="322" font-size="13" fill="#2d6a4f">키로 한 건 찾기</text>
  <text x="46" y="352" font-size="13" fill="#9d0208">값 안의 필드로 찾기</text>

  <!-- 문서 -->
  <rect x="240" y="176" width="190" height="200" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="335" y="202" font-size="15" font-weight="bold" fill="#1b1b1b" text-anchor="middle">문서</text>
  <text x="256" y="232" font-size="13" fill="#1b1b1b">중첩된 필드 묶음</text>
  <text x="256" y="262" font-size="13" fill="#555">원자 단위: 문서 하나</text>
  <text x="256" y="292" font-size="13" fill="#555">연산: 필드 질의·색인</text>
  <text x="256" y="322" font-size="13" fill="#2d6a4f">한 개체를 통째로 읽기</text>
  <text x="256" y="352" font-size="13" fill="#9d0208">문서 사이를 잇는 조인</text>

  <!-- 넓은 컬럼 -->
  <rect x="450" y="176" width="190" height="200" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="545" y="202" font-size="15" font-weight="bold" fill="#1b1b1b" text-anchor="middle">넓은 컬럼</text>
  <text x="466" y="232" font-size="13" fill="#1b1b1b">행 키 + 컬럼 패밀리</text>
  <text x="466" y="262" font-size="13" fill="#555">원자 단위: 행 하나</text>
  <text x="466" y="292" font-size="13" fill="#555">연산: 행 키 범위 스캔</text>
  <text x="466" y="322" font-size="13" fill="#2d6a4f">희소·대량 쓰기</text>
  <text x="466" y="352" font-size="13" fill="#9d0208">행 키 밖의 임의 조건</text>

  <!-- 그래프 -->
  <rect x="660" y="176" width="190" height="200" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="755" y="202" font-size="15" font-weight="bold" fill="#1b1b1b" text-anchor="middle">그래프</text>
  <text x="676" y="232" font-size="13" fill="#1b1b1b">노드 + 간선 + 속성</text>
  <text x="676" y="262" font-size="13" fill="#555">원자 단위: 트랜잭션</text>
  <text x="676" y="292" font-size="13" fill="#555">연산: 패턴 매칭·탐색</text>
  <text x="676" y="322" font-size="13" fill="#2d6a4f">여러 단계 관계 따라가기</text>
  <text x="676" y="352" font-size="13" fill="#9d0208">전체 대량 집계 스캔</text>

  <rect x="30" y="396" width="820" height="56" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="46" y="420" font-size="13" fill="#2d6a4f">초록 = 잘 맞는 접근 패턴</text>
  <text x="250" y="420" font-size="13" fill="#9d0208">빨강 = 비용이 큰 접근 패턴</text>
  <text x="46" y="440" font-size="13" fill="#555">공통: 관계 대수를 따르지 않는 논리 데이터 모델, 노드 여러 대에 데이터를 나눠 둔다 (NIST SP 1500-1r2)</text>
</svg>
