<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="420" fill="#fdfdfb"/>

  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2d6a4f"/>
    </marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b45309"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9d0208"/>
    </marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#444444"/>
    </marker>
  </defs>

  <text x="30" y="28" font-size="15" font-weight="bold" fill="#333333">커밋 응답을 언제 돌려주는가 — 복제 시점 3가지</text>

  <!-- 레인 -->
  <text x="30" y="90" font-size="14" fill="#333333">응용</text>
  <line x1="110" y1="84" x2="856" y2="84" stroke="#aaaaaa" stroke-width="1.2"/>
  <text x="30" y="196" font-size="14" fill="#333333">주 서버</text>
  <line x1="110" y1="190" x2="856" y2="190" stroke="#aaaaaa" stroke-width="1.2"/>
  <text x="30" y="302" font-size="14" fill="#333333">대기 서버</text>
  <line x1="110" y1="296" x2="856" y2="296" stroke="#aaaaaa" stroke-width="1.2"/>

  <!-- 커밋 요청 -->
  <line x1="160" y1="88" x2="160" y2="184" stroke="#444444" stroke-width="1.6" marker-end="url(#k)"/>
  <text x="168" y="140" font-size="13" fill="#444444">커밋 요청</text>

  <!-- 주 서버 로컬 기록 -->
  <rect x="200" y="176" width="130" height="28" rx="3" fill="#ffffff" stroke="#444444" stroke-width="1.4"/>
  <text x="265" y="195" font-size="13" text-anchor="middle" fill="#333333">로컬 로그 기록</text>

  <!-- 비동기 응답 -->
  <line x1="344" y1="184" x2="344" y2="90" stroke="#2d6a4f" stroke-width="1.8" marker-end="url(#g)"/>
  <text x="352" y="118" font-size="13" font-weight="bold" fill="#2d6a4f">① 비동기</text>

  <!-- 로그 전송 -->
  <line x1="340" y1="196" x2="430" y2="290" stroke="#444444" stroke-width="1.4" marker-end="url(#k)"/>
  <text x="330" y="256" font-size="13" fill="#444444">로그 전송</text>

  <!-- 대기 서버 수신 ACK -->
  <line x1="440" y1="290" x2="500" y2="196" stroke="#b45309" stroke-width="1.4" marker-end="url(#w)"/>
  <text x="452" y="256" font-size="13" fill="#b45309">수신 응답</text>

  <!-- 반동기 응답 -->
  <line x1="514" y1="184" x2="514" y2="90" stroke="#b45309" stroke-width="1.8" marker-end="url(#w)"/>
  <text x="522" y="118" font-size="13" font-weight="bold" fill="#b45309">② 반동기</text>

  <!-- 대기 서버 기록 -->
  <rect x="440" y="282" width="150" height="28" rx="3" fill="#ffffff" stroke="#444444" stroke-width="1.4"/>
  <text x="515" y="301" font-size="13" text-anchor="middle" fill="#333333">대기 서버 로그 기록</text>

  <!-- 기록 ACK -->
  <line x1="600" y1="290" x2="660" y2="196" stroke="#9d0208" stroke-width="1.4" marker-end="url(#r)"/>
  <text x="612" y="256" font-size="13" fill="#9d0208">기록 응답</text>

  <!-- 동기 응답 -->
  <line x1="674" y1="184" x2="674" y2="90" stroke="#9d0208" stroke-width="1.8" marker-end="url(#r)"/>
  <text x="682" y="118" font-size="13" font-weight="bold" fill="#9d0208">③ 동기</text>

  <!-- 시간축 -->
  <line x1="110" y1="348" x2="810" y2="348" stroke="#666666" stroke-width="1.4" marker-end="url(#k)"/>
  <text x="820" y="352" font-size="13" fill="#666666">시간</text>

  <text x="30" y="384" font-size="13" fill="#2d6a4f">① RPO &gt; 0 · 응답 가장 빠름</text>
  <text x="300" y="384" font-size="13" fill="#b45309">② 수신까지 보장 · 디스크 기록은 미보장</text>
  <text x="640" y="384" font-size="13" fill="#9d0208">③ RPO = 0 · 응답 가장 느림</text>
</svg>
