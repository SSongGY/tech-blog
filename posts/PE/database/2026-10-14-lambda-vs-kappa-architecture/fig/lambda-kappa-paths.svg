<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="480" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <text x="30" y="28" font-size="16" font-weight="bold" fill="#222222">람다 — 두 경로가 상시로 함께 돈다</text>

  <rect x="30" y="86" width="160" height="70" rx="6" fill="#eef2f7" stroke="#334e68" stroke-width="1.5"/>
  <text x="110" y="114" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">불변 마스터</text>
  <text x="110" y="136" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">데이터셋</text>

  <rect x="236" y="46" width="184" height="62" rx="6" fill="#eef2f7" stroke="#334e68" stroke-width="1.5"/>
  <text x="328" y="72" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">① 배치 계층</text>
  <text x="328" y="94" font-size="13" text-anchor="middle" fill="#334e68">전체를 다시 계산</text>

  <rect x="236" y="136" width="184" height="62" rx="6" fill="#fff4e5" stroke="#b45309" stroke-width="1.5"/>
  <text x="328" y="162" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">③ 속도 계층</text>
  <text x="328" y="184" font-size="13" text-anchor="middle" fill="#b45309">최근 구간만 증분</text>

  <rect x="476" y="86" width="194" height="70" rx="6" fill="#eef2f7" stroke="#334e68" stroke-width="1.5"/>
  <text x="573" y="114" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">② 서빙 계층</text>
  <text x="573" y="136" font-size="13" text-anchor="middle" fill="#334e68">배치 뷰 + 실시간 뷰</text>

  <rect x="718" y="91" width="132" height="60" rx="6" fill="#e9f5ee" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="784" y="116" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">질의</text>
  <text x="784" y="138" font-size="13" text-anchor="middle" fill="#2d6a4f">두 뷰를 병합</text>

  <path d="M190,105 L214,105 L214,77 L234,77" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M190,137 L214,137 L214,167 L234,167" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrA)"/>
  <path d="M420,77 L450,77 L450,105 L474,105" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M420,167 L450,167 L450,137 L474,137" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrA)"/>
  <line x1="670" y1="121" x2="716" y2="121" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="440" y="212" font-size="13" fill="#b45309">속도 계층의 오류는 배치가 같은 구간을 덮어쓰면서 사라진다</text>

  <line x1="30" y1="232" x2="850" y2="232" stroke="#cccccc" stroke-width="1"/>

  <text x="30" y="262" font-size="16" font-weight="bold" fill="#222222">카파 — 재처리할 때만 잠시 두 벌이 된다</text>

  <rect x="30" y="310" width="160" height="70" rx="6" fill="#eef2f7" stroke="#334e68" stroke-width="1.5"/>
  <text x="110" y="338" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">보관되는 로그</text>
  <text x="110" y="360" font-size="13" text-anchor="middle" fill="#334e68">다중 구독 가능</text>

  <rect x="236" y="290" width="184" height="62" rx="6" fill="#e9f5ee" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="328" y="316" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">스트림 작업 (운영)</text>
  <text x="328" y="338" font-size="13" text-anchor="middle" fill="#2d6a4f">출력 테이블 A</text>

  <rect x="236" y="380" width="184" height="62" rx="6" fill="#fff4e5" stroke="#b45309" stroke-width="1.5"/>
  <text x="328" y="406" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">스트림 작업 (재처리)</text>
  <text x="328" y="428" font-size="13" text-anchor="middle" fill="#b45309">맨 앞부터 → 테이블 B</text>

  <rect x="476" y="330" width="194" height="70" rx="6" fill="#eef2f7" stroke="#334e68" stroke-width="1.5"/>
  <text x="573" y="358" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">전환 후 옛 것 폐기</text>
  <text x="573" y="380" font-size="13" text-anchor="middle" fill="#334e68">A 를 B 로 교체</text>

  <rect x="718" y="335" width="132" height="60" rx="6" fill="#e9f5ee" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="784" y="360" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">질의</text>
  <text x="784" y="382" font-size="13" text-anchor="middle" fill="#2d6a4f">테이블 하나</text>

  <path d="M190,330 L214,330 L214,321 L234,321" fill="none" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrG)"/>
  <path d="M190,360 L214,360 L214,411 L234,411" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrA)"/>
  <path d="M420,321 L450,321 L450,350 L474,350" fill="none" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrG)"/>
  <path d="M420,411 L450,411 L450,380 L474,380" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrA)"/>
  <line x1="670" y1="365" x2="716" y2="365" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="30" y="462" font-size="13" fill="#555555">점선은 재처리 기간에만 존재하는 경로다. 전환이 끝나면 윗줄 하나만 남는다.</text>
</svg>
