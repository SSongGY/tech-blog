<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360"
     font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="880" height="360" fill="#f8f9fa"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#495057"/>
    </marker>
  </defs>
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#212529">반결합 (R ⋉ S) ⋈ S 의 네 단계 — 사이트 1 의 R, 사이트 2 의 S</text>

  <rect x="40" y="60" width="240" height="70" rx="6" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <text x="60" y="90" font-size="14" font-weight="bold" fill="#212529">사이트 1</text>
  <text x="60" y="114" font-size="13" fill="#212529">릴레이션 R</text>

  <rect x="600" y="60" width="240" height="70" rx="6" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <text x="620" y="90" font-size="14" font-weight="bold" fill="#212529">사이트 2</text>
  <text x="620" y="114" font-size="13" fill="#212529">릴레이션 S</text>

  <line x1="600" y1="160" x2="282" y2="160" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="150" font-size="13" fill="#2d6a4f">① S' = π_A(S) 를 보낸다 (작음)</text>

  <rect x="40" y="185" width="240" height="44" rx="6" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="56" y="212" font-size="13" fill="#212529">② R' = R ⋉ S' 계산</text>

  <line x1="282" y1="250" x2="600" y2="250" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="322" y="240" font-size="13" fill="#2d6a4f">③ R' 만 보낸다 (R 전체가 아님)</text>

  <rect x="600" y="185" width="240" height="44" rx="6" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="616" y="212" font-size="13" fill="#212529">④ R' ⋈ S 계산</text>

  <text x="20" y="300" font-size="13" fill="#212529">이득 조건 (전송량만 볼 때): size(π_A(S)) + size(R ⋉ S) &lt; size(R)</text>
  <text x="20" y="322" font-size="13" fill="#b45309">손해 조건: R 의 대부분이 S 와 짝이 있으면 ①이 더해진 만큼 오히려 늘어난다.</text>
  <text x="20" y="344" font-size="13" fill="#495057">반결합은 조인 결과를 바꾸지 않고 R 의 행만 미리 줄인다.</text>
</svg>
