<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#fbfbf8"/>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">2단계 커밋 — 기다리는 곳 3군데와 불확실 구간</text>
  <text x="30" y="56" font-size="13" fill="#555">시간은 왼쪽에서 오른쪽으로 흐른다. 굵은 글자는 DT 로그에 쓰는 기록</text>

  <!-- 단계 구분 -->
  <rect x="150" y="72" width="330" height="26" fill="#eef0f4"/>
  <text x="315" y="90" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">1단계 — 투표</text>
  <rect x="480" y="72" width="370" height="26" fill="#e9f1ec"/>
  <text x="665" y="90" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">2단계 — 결정</text>

  <!-- 생명선 -->
  <text x="30" y="144" font-size="14" font-weight="bold" fill="#1b1b1b">조정자</text>
  <line x1="150" y1="140" x2="850" y2="140" stroke="#3b3b3b" stroke-width="2"/>
  <text x="30" y="304" font-size="14" font-weight="bold" fill="#1b1b1b">참여자</text>
  <line x1="150" y1="300" x2="850" y2="300" stroke="#3b3b3b" stroke-width="2"/>

  <!-- 불확실 구간 -->
  <rect x="340" y="284" width="330" height="32" rx="4" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="505" y="305" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">불확실 구간 — 혼자서는 커밋도 철회도 못 한다</text>

  <!-- 기록 표시 -->
  <circle cx="190" cy="140" r="5" fill="#1b1b1b"/>
  <text x="190" y="126" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">start-2PC</text>
  <circle cx="330" cy="300" r="5" fill="#1b1b1b"/>
  <text x="330" y="336" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">yes</text>
  <circle cx="540" cy="140" r="5" fill="#1b1b1b"/>
  <text x="540" y="126" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">commit / abort</text>
  <circle cx="690" cy="300" r="5" fill="#1b1b1b"/>
  <text x="730" y="276" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">commit / abort</text>

  <!-- 메시지 -->
  <line x1="200" y1="142" x2="280" y2="296" stroke="#3b3b3b" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="226" y="210" font-size="13" fill="#1b1b1b">VOTE-REQ</text>
  <line x1="340" y1="296" x2="430" y2="144" stroke="#3b3b3b" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="396" y="210" font-size="13" fill="#1b1b1b">YES / NO</text>
  <line x1="555" y1="142" x2="664" y2="296" stroke="#3b3b3b" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="616" y="210" font-size="13" fill="#1b1b1b">COMMIT / ABORT</text>

  <!-- 기다리는 곳 3군데 -->
  <rect x="150" y="352" width="220" height="74" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="162" y="374" font-size="13" font-weight="bold" fill="#2d6a4f">① 참여자가 VOTE-REQ 대기</text>
  <text x="162" y="394" font-size="13" fill="#1b1b1b">시간 초과 → 혼자 철회</text>
  <text x="162" y="414" font-size="13" fill="#555">아직 투표 전이다</text>

  <rect x="390" y="352" width="220" height="74" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="402" y="374" font-size="13" font-weight="bold" fill="#2d6a4f">② 조정자가 투표 대기</text>
  <text x="402" y="394" font-size="13" fill="#1b1b1b">시간 초과 → 철회 결정</text>
  <text x="402" y="414" font-size="13" fill="#555">YES 보낸 쪽에 ABORT</text>

  <rect x="630" y="352" width="220" height="74" rx="6" fill="#fbeaea" stroke="#9d0208" stroke-width="1.5"/>
  <text x="642" y="374" font-size="13" font-weight="bold" fill="#9d0208">③ 참여자가 결정 대기</text>
  <text x="642" y="394" font-size="13" fill="#1b1b1b">시간 초과 → 종료 프로토콜</text>
  <text x="642" y="414" font-size="13" fill="#9d0208">모두 불확실하면 막힘</text>

  <!-- 기다리는 지점 표시 -->
  <text x="236" y="324" font-size="16" font-weight="bold" fill="#2d6a4f" text-anchor="middle">①</text>
  <text x="310" y="166" font-size="16" font-weight="bold" fill="#2d6a4f" text-anchor="middle">②</text>
  <text x="620" y="336" font-size="16" font-weight="bold" fill="#9d0208" text-anchor="middle">③</text>

  <line x1="30" y1="452" x2="850" y2="452" stroke="#d0d0c8" stroke-width="1"/>
  <text x="30" y="478" font-size="13" fill="#333">조정자는 commit 기록을 쓴 뒤에 COMMIT을 보낸다. 그래서 복구한 조정자는 기록이 없으면 철회로 정해도 된다.</text>
  <text x="30" y="500" font-size="13" fill="#333">참여자는 yes 기록을 쓴 뒤에 YES를 보낸다. 이 기록이 있으면 복구 뒤에도 불확실 상태로 돌아온다.</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b3b3b"/>
    </marker>
  </defs>
</svg>
