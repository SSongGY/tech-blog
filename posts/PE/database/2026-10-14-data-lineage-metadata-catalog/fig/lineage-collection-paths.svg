<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <text x="30" y="30" font-size="15" font-weight="bold" fill="#222222">원천</text>
  <text x="250" y="30" font-size="15" font-weight="bold" fill="#222222">수집 방식 3가지</text>
  <text x="500" y="30" font-size="15" font-weight="bold" fill="#222222">저장</text>
  <text x="712" y="30" font-size="15" font-weight="bold" fill="#222222">활용</text>

  <!-- 원천 -->
  <rect x="30" y="50" width="180" height="62" rx="6" fill="#eef2f7" stroke="#334e68" stroke-width="1.5"/>
  <text x="120" y="76" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">변환 코드 저장소</text>
  <text x="120" y="98" font-size="13" text-anchor="middle" fill="#334e68">SQL · 모델 정의</text>

  <rect x="30" y="150" width="180" height="62" rx="6" fill="#eef2f7" stroke="#334e68" stroke-width="1.5"/>
  <text x="120" y="176" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">질의 실행 엔진</text>
  <text x="120" y="198" font-size="13" text-anchor="middle" fill="#334e68">Hive · Spark 등</text>

  <rect x="30" y="250" width="180" height="62" rx="6" fill="#eef2f7" stroke="#334e68" stroke-width="1.5"/>
  <text x="120" y="276" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">시스템 카탈로그</text>
  <text x="120" y="298" font-size="13" text-anchor="middle" fill="#334e68">질의 로그 · 딕셔너리</text>

  <!-- 수집 -->
  <rect x="250" y="50" width="210" height="62" rx="6" fill="#eef2f7" stroke="#334e68" stroke-width="1.5"/>
  <text x="355" y="76" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">① 정적 파싱</text>
  <text x="355" y="98" font-size="13" text-anchor="middle" fill="#334e68">실행 전에 코드를 읽는다</text>

  <rect x="250" y="150" width="210" height="62" rx="6" fill="#e9f5ee" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="355" y="176" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">② 실행 훅 (push)</text>
  <text x="355" y="198" font-size="13" text-anchor="middle" fill="#2d6a4f">실행 시점에 바로 보낸다</text>

  <rect x="250" y="250" width="210" height="62" rx="6" fill="#fff4e5" stroke="#b45309" stroke-width="1.5"/>
  <text x="355" y="276" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">③ 수집기 (pull)</text>
  <text x="355" y="298" font-size="13" text-anchor="middle" fill="#b45309">주기마다 끌어온다</text>

  <line x1="210" y1="81" x2="248" y2="81" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="210" y1="181" x2="248" y2="181" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="210" y1="281" x2="248" y2="281" stroke="#b45309" stroke-width="2" marker-end="url(#arrA)"/>

  <!-- 저장 -->
  <rect x="500" y="110" width="180" height="142" rx="6" fill="#eef2f7" stroke="#334e68" stroke-width="2"/>
  <text x="590" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">메타데이터 카탈로그</text>
  <text x="590" y="168" font-size="13" text-anchor="middle" fill="#334e68">엔터티 · 활동 · 행위자</text>
  <text x="590" y="190" font-size="13" text-anchor="middle" fill="#334e68">그래프</text>
  <text x="590" y="218" font-size="13" text-anchor="middle" fill="#334e68">생성 · 사용 · 파생</text>
  <text x="590" y="240" font-size="13" text-anchor="middle" fill="#334e68">관계를 간선으로</text>

  <path d="M460,81 L480,81 L480,150" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="460" y1="181" x2="498" y2="181" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrG)"/>
  <path d="M460,281 L480,281 L480,212" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrA)"/>

  <!-- 활용 -->
  <rect x="712" y="50" width="148" height="62" rx="6" fill="#eef2f7" stroke="#334e68" stroke-width="1.5"/>
  <text x="786" y="76" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">영향도 분석</text>
  <text x="786" y="98" font-size="13" text-anchor="middle" fill="#334e68">하류 방향</text>

  <rect x="712" y="150" width="148" height="62" rx="6" fill="#eef2f7" stroke="#334e68" stroke-width="1.5"/>
  <text x="786" y="176" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">원인 추적</text>
  <text x="786" y="198" font-size="13" text-anchor="middle" fill="#334e68">상류 방향</text>

  <rect x="712" y="250" width="148" height="62" rx="6" fill="#eef2f7" stroke="#334e68" stroke-width="1.5"/>
  <text x="786" y="276" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">규제 대응</text>
  <text x="786" y="298" font-size="13" text-anchor="middle" fill="#334e68">원천 대사의 기준</text>

  <path d="M680,150 L696,150 L696,81 L710,81" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="680" y1="181" x2="710" y2="181" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M680,212 L696,212 L696,281 L710,281" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>

  <text x="30" y="362" font-size="13" fill="#555555">세 경로는 끊기는 지점이 서로 다르다. ①은 실행 시점에 결정되는 경로를, ②는 훅이 없는 엔진을,</text>
  <text x="30" y="384" font-size="13" fill="#555555">③은 로그를 남기지 않는 작업을 놓친다. 그래서 하나만으로는 그래프가 메워지지 않는다.</text>
</svg>
