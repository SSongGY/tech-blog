<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="16" font-weight="bold" fill="#222222">거버넌스 — 누가 정하고 책임지는가</text>
  <text x="500" y="34" font-size="16" font-weight="bold" fill="#222222">품질 관리 — 무엇을 재고 고치는가</text>

  <!-- 왼쪽: 역할 4계층 -->
  <rect x="40" y="56" width="360" height="62" rx="6" fill="#eef2f7" stroke="#334e68" stroke-width="1.5"/>
  <text x="220" y="82" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b1b1b">① 데이터 거버넌스 기구</text>
  <text x="220" y="104" font-size="13" text-anchor="middle" fill="#334e68">의장 CDO · 정책·표준·우선순위 결정</text>

  <rect x="40" y="152" width="360" height="62" rx="6" fill="#eef2f7" stroke="#334e68" stroke-width="1.5"/>
  <text x="220" y="178" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b1b1b">② 데이터 오너</text>
  <text x="220" y="200" font-size="13" text-anchor="middle" fill="#334e68">특정 데이터에 대한 권한 · 통제 수립</text>

  <rect x="40" y="248" width="360" height="62" rx="6" fill="#eef2f7" stroke="#334e68" stroke-width="1.5"/>
  <text x="220" y="274" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b1b1b">③ 데이터 스튜어드</text>
  <text x="220" y="296" font-size="13" text-anchor="middle" fill="#334e68">정의·무결성 규칙 유지 · 품질 분석</text>

  <rect x="40" y="344" width="360" height="62" rx="6" fill="#eef2f7" stroke="#334e68" stroke-width="1.5"/>
  <text x="220" y="370" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b1b1b">④ 시스템 소유자(관리자)</text>
  <text x="220" y="392" font-size="13" text-anchor="middle" fill="#334e68">저장·처리 시스템 운영 · 통제 구현</text>

  <line x1="220" y1="118" x2="220" y2="150" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="220" y1="214" x2="220" y2="246" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="220" y1="310" x2="220" y2="342" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="232" y="138" font-size="13" fill="#555555">정책 위임</text>
  <text x="232" y="234" font-size="13" fill="#555555">규칙 집행</text>
  <text x="232" y="330" font-size="13" fill="#555555">통제 구현</text>

  <!-- 오른쪽: 품질 순환 -->
  <rect x="500" y="56" width="340" height="96" rx="6" fill="#e9f5ee" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="670" y="82" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b1b1b">⑴ 측정 — 품질 차원 6가지</text>
  <text x="670" y="108" font-size="13" text-anchor="middle" fill="#2d6a4f">완전성 · 유일성 · 적시성</text>
  <text x="670" y="130" font-size="13" text-anchor="middle" fill="#2d6a4f">유효성 · 정확성 · 일관성</text>

  <rect x="500" y="186" width="160" height="56" rx="6" fill="#e9f5ee" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="580" y="219" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b1b1b">⑵ 보고</text>

  <rect x="680" y="186" width="160" height="56" rx="6" fill="#fff4e5" stroke="#b45309" stroke-width="1.5"/>
  <text x="760" y="219" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b1b1b">⑶ 이슈 관리</text>

  <rect x="500" y="276" width="340" height="56" rx="6" fill="#e9f5ee" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="670" y="309" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b1b1b">⑷ 개선 — 원천·규칙·시스템 수정</text>

  <line x1="580" y1="152" x2="580" y2="184" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="660" y1="214" x2="678" y2="214" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="760" y1="242" x2="760" y2="274" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrG)"/>
  <path d="M840,304 C875,304 875,104 842,104" fill="none" stroke="#2d6a4f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrG)"/>

  <!-- 좌우 연결 -->
  <line x1="400" y1="279" x2="498" y2="104" stroke="#555555" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="410" y="300" font-size="13" fill="#555555">기준·규칙</text>
  <line x1="498" y1="214" x2="402" y2="88" stroke="#555555" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="410" y="70" font-size="13" fill="#555555">결과 보고</text>

  <text x="40" y="446" font-size="13" fill="#555555">역할 이름은 출처마다 다르다. 칸 안의 설명은 각 역할 정의의 핵심만 옮겼다.</text>
</svg>
