<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="14">
  <rect width="880" height="460" fill="#fafafa"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 5단계 흐름 -->
  <rect x="15" y="20" width="150" height="86" rx="6" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="90" y="42" text-anchor="middle" font-weight="bold" fill="#1b1b1b">① 사용 행렬</text>
  <text x="90" y="64" text-anchor="middle" font-size="13" fill="#333">질의 × 속성</text>
  <text x="90" y="84" text-anchor="middle" font-size="13" fill="#333">use(q, A) = 0/1</text>

  <rect x="185" y="20" width="150" height="86" rx="6" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="260" y="42" text-anchor="middle" font-weight="bold" fill="#1b1b1b">② 친화도 행렬</text>
  <text x="260" y="64" text-anchor="middle" font-size="13" fill="#333">두 속성을 함께</text>
  <text x="260" y="84" text-anchor="middle" font-size="13" fill="#333">쓴 빈도의 합</text>

  <rect x="355" y="20" width="150" height="86" rx="6" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="430" y="42" text-anchor="middle" font-weight="bold" fill="#1b1b1b">③ BEA 재배열</text>
  <text x="430" y="64" text-anchor="middle" font-size="13" fill="#333">cont 가 최대인</text>
  <text x="430" y="84" text-anchor="middle" font-size="13" fill="#333">자리에 삽입</text>

  <rect x="525" y="20" width="150" height="86" rx="6" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="600" y="42" text-anchor="middle" font-weight="bold" fill="#1b1b1b">④ 군집 행렬</text>
  <text x="600" y="64" text-anchor="middle" font-size="13" fill="#333">큰 값이 대각선</text>
  <text x="600" y="84" text-anchor="middle" font-size="13" fill="#333">쪽에 모인다</text>

  <rect x="695" y="20" width="170" height="86" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="780" y="42" text-anchor="middle" font-weight="bold" fill="#1b1b1b">⑤ 분할 지점</text>
  <text x="780" y="64" text-anchor="middle" font-size="13" fill="#333">두 블록으로 나눠</text>
  <text x="780" y="84" text-anchor="middle" font-size="13" fill="#333">z 가 최대인 곳</text>

  <line x1="165" y1="63" x2="185" y2="63" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="335" y1="63" x2="355" y2="63" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="505" y1="63" x2="525" y2="63" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="675" y1="63" x2="695" y2="63" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 군집 행렬 -->
  <text x="40" y="150" font-weight="bold" fill="#1b1b1b">군집 행렬 CA (본문 예제, 열·행 순서 A3 A1 A4 A5 A2)</text>

  <!-- 열 머리 -->
  <text x="125" y="182" text-anchor="middle" font-size="13" fill="#333">A3</text>
  <text x="175" y="182" text-anchor="middle" font-size="13" fill="#333">A1</text>
  <text x="225" y="182" text-anchor="middle" font-size="13" fill="#333">A4</text>
  <text x="275" y="182" text-anchor="middle" font-size="13" fill="#333">A5</text>
  <text x="325" y="182" text-anchor="middle" font-size="13" fill="#333">A2</text>

  <!-- 행 머리 -->
  <text x="75" y="215" text-anchor="middle" font-size="13" fill="#333">A3</text>
  <text x="75" y="265" text-anchor="middle" font-size="13" fill="#333">A1</text>
  <text x="75" y="315" text-anchor="middle" font-size="13" fill="#333">A4</text>
  <text x="75" y="365" text-anchor="middle" font-size="13" fill="#333">A5</text>
  <text x="75" y="415" text-anchor="middle" font-size="13" fill="#333">A2</text>

  <!-- 위쪽 블록 (A3 A1 | 2x2) -->
  <rect x="100" y="190" width="100" height="100" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="2"/>
  <!-- 아래쪽 블록 (A4 A5 A2 | 3x3) -->
  <rect x="200" y="290" width="150" height="150" fill="#fde2e2" stroke="#9d0208" stroke-width="2"/>

  <!-- 값 칸 -->
  <g font-size="13" text-anchor="middle" fill="#1b1b1b">
    <text x="125" y="220">30</text><text x="175" y="220">30</text><text x="225" y="220">5</text><text x="275" y="220">0</text><text x="325" y="220">0</text>
    <text x="125" y="270">30</text><text x="175" y="270">30</text><text x="225" y="270">5</text><text x="275" y="270">0</text><text x="325" y="270">0</text>
    <text x="125" y="320">5</text><text x="175" y="320">5</text><text x="225" y="320">45</text><text x="275" y="320">40</text><text x="325" y="320">40</text>
    <text x="125" y="370">0</text><text x="175" y="370">0</text><text x="225" y="370">40</text><text x="275" y="370">60</text><text x="325" y="370">60</text>
    <text x="125" y="420">0</text><text x="175" y="420">0</text><text x="225" y="420">40</text><text x="275" y="420">60</text><text x="325" y="420">60</text>
  </g>

  <!-- 설명 -->
  <text x="400" y="200" font-size="14" font-weight="bold" fill="#2d6a4f">위쪽 블록 {A1, A3}</text>
  <text x="400" y="222" font-size="13" fill="#333">질의 q1 만 이 블록 안에서 끝난다 (빈도 25)</text>
  <text x="400" y="262" font-size="14" font-weight="bold" fill="#9d0208">아래쪽 블록 {A2, A4, A5}</text>
  <text x="400" y="284" font-size="13" fill="#333">질의 q2·q3 가 이 블록 안에서 끝난다 (빈도 60)</text>
  <text x="400" y="324" font-size="14" font-weight="bold" fill="#b45309">양쪽에 걸치는 질의</text>
  <text x="400" y="346" font-size="13" fill="#333">q4 는 A1·A3·A4 를 읽어 두 단편을 결합해야 한다 (빈도 5)</text>
  <text x="400" y="386" font-size="13" fill="#555">각 단편에는 기본키를 함께 둔다 (재구성용 결합 키)</text>
</svg>
