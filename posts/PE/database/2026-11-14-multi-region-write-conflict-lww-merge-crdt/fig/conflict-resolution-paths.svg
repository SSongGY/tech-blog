<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#ffffff"/>
  <defs>
    <marker id="ak" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#4a5568" stroke-width="1.6"/>
    </marker>
  </defs>

  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">같은 항목을 두 리전이 동시에 고쳤을 때 — 해결 방식 3가지</text>

  <!-- concurrent writes -->
  <rect x="110" y="50" width="280" height="58" fill="#fafbfc" stroke="#4a5568" stroke-width="1.4" rx="4"/>
  <text x="250" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">리전 A: 장바구니에 [책] 추가</text>
  <text x="250" y="95" text-anchor="middle" font-size="13" fill="#4a5568">타임스탬프 t1</text>

  <rect x="490" y="50" width="280" height="58" fill="#fafbfc" stroke="#4a5568" stroke-width="1.4" rx="4"/>
  <text x="630" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">리전 B: 장바구니에 [펜] 추가</text>
  <text x="630" y="95" text-anchor="middle" font-size="13" fill="#4a5568">타임스탬프 t2 (t1 &lt; t2)</text>

  <text x="440" y="84" text-anchor="middle" font-size="13" fill="#b45309">서로 모른다</text>

  <line x1="250" y1="108" x2="390" y2="138" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ak)"/>
  <line x1="630" y1="108" x2="490" y2="138" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ak)"/>

  <!-- detection -->
  <rect x="250" y="140" width="380" height="54" fill="#fdf6ec" stroke="#b45309" stroke-width="1.6" rx="4"/>
  <text x="440" y="163" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">복제가 도착하면 충돌을 감지한다</text>
  <text x="440" y="183" text-anchor="middle" font-size="13" fill="#4a5568">어느 쪽도 다른 쪽보다 먼저 일어나지 않았다 (동시 갱신)</text>

  <line x1="330" y1="194" x2="150" y2="238" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ak)"/>
  <line x1="440" y1="194" x2="440" y2="238" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ak)"/>
  <line x1="550" y1="194" x2="730" y2="238" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ak)"/>

  <!-- three methods -->
  <rect x="20" y="240" width="260" height="110" fill="#ffffff" stroke="#9d0208" stroke-width="1.6" rx="4"/>
  <text x="150" y="264" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">① 마지막 쓰기 우선 (LWW)</text>
  <text x="150" y="288" text-anchor="middle" font-size="13" fill="#4a5568">타임스탬프가 큰 쓰기 하나만 남긴다</text>
  <text x="150" y="308" text-anchor="middle" font-size="13" fill="#4a5568">데이터 저장소가 자동으로 처리</text>
  <text x="150" y="332" text-anchor="middle" font-size="13" fill="#9d0208">진 쓰기는 알림 없이 사라진다</text>

  <rect x="310" y="240" width="260" height="110" fill="#ffffff" stroke="#b45309" stroke-width="1.6" rx="4"/>
  <text x="440" y="264" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">② 사용자 정의 병합</text>
  <text x="440" y="288" text-anchor="middle" font-size="13" fill="#4a5568">업무 규칙으로 두 값을 합친다</text>
  <text x="440" y="308" text-anchor="middle" font-size="13" fill="#4a5568">애플리케이션이 병합 함수를 제공</text>
  <text x="440" y="332" text-anchor="middle" font-size="13" fill="#b45309">실패하면 충돌 목록으로 간다</text>

  <rect x="600" y="240" width="260" height="110" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.6" rx="4"/>
  <text x="730" y="264" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">③ CRDT</text>
  <text x="730" y="288" text-anchor="middle" font-size="13" fill="#4a5568">자료형 자체가 병합 규칙을 갖는다</text>
  <text x="730" y="308" text-anchor="middle" font-size="13" fill="#4a5568">병합 = 최소 상한 / 연산 교환 가능</text>
  <text x="730" y="332" text-anchor="middle" font-size="13" fill="#2d6a4f">같은 갱신을 받으면 같은 상태</text>

  <line x1="150" y1="350" x2="150" y2="388" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ak)"/>
  <line x1="440" y1="350" x2="440" y2="388" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ak)"/>
  <line x1="730" y1="350" x2="730" y2="388" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ak)"/>

  <!-- results -->
  <rect x="20" y="390" width="260" height="58" fill="#fbeaea" stroke="#9d0208" stroke-width="1.4" rx="4"/>
  <text x="150" y="414" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">결과: [펜]</text>
  <text x="150" y="435" text-anchor="middle" font-size="13" fill="#9d0208">[책] 추가가 유실</text>

  <rect x="310" y="390" width="260" height="58" fill="#fdf6ec" stroke="#b45309" stroke-width="1.4" rx="4"/>
  <text x="440" y="414" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">결과: [책, 펜]</text>
  <text x="440" y="435" text-anchor="middle" font-size="13" fill="#b45309">삭제한 항목이 되살아날 수 있다</text>

  <rect x="600" y="390" width="260" height="58" fill="#eef4f1" stroke="#2d6a4f" stroke-width="1.4" rx="4"/>
  <text x="730" y="414" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">결과: [책, 펜]</text>
  <text x="730" y="435" text-anchor="middle" font-size="13" fill="#2d6a4f">추가·삭제 경합 규칙도 내장</text>

  <text x="440" y="482" text-anchor="middle" font-size="13" fill="#4a5568">①은 수렴하지만 쓰기를 잃는다 · ②는 업무 의미를 지키지만 병합 코드가 정확해야 한다</text>
  <text x="440" y="504" text-anchor="middle" font-size="13" fill="#4a5568">③은 수렴을 증명으로 보장하지만 표현할 수 있는 자료형이 제한된다</text>
</svg>
