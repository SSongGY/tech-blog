<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="350" fill="#fafaf7"/>

  <text x="40" y="30" font-size="16" font-weight="bold" fill="#1b1b1b">터크만 5단계 — 정해진 단계를 차례로 지난다</text>
  <line x1="40" y1="50" x2="660" y2="50" stroke="#555555" stroke-width="1.2"/>
  <text x="350" y="45" font-size="13" text-anchor="middle" fill="#1b1b1b">1965년 · 문헌 50편 검토</text>
  <line x1="680" y1="50" x2="820" y2="50" stroke="#b45309" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="750" y="45" font-size="13" text-anchor="middle" fill="#b45309">1977년 추가 · 22편</text>

  <rect x="40" y="62" width="140" height="78" fill="#ffffff" stroke="#555555" stroke-width="1.4"/>
  <text x="110" y="85" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b1b1b">① 형성기</text>
  <text x="110" y="105" font-size="13" text-anchor="middle" fill="#555555">Forming</text>
  <text x="110" y="127" font-size="13" text-anchor="middle" fill="#1b1b1b">탐색·시험·의존</text>

  <rect x="200" y="62" width="140" height="78" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
  <text x="270" y="85" font-size="15" font-weight="bold" text-anchor="middle" fill="#b45309">② 혼돈기</text>
  <text x="270" y="105" font-size="13" text-anchor="middle" fill="#555555">Storming</text>
  <text x="270" y="127" font-size="13" text-anchor="middle" fill="#1b1b1b">갈등</text>

  <rect x="360" y="62" width="140" height="78" fill="#ffffff" stroke="#555555" stroke-width="1.4"/>
  <text x="430" y="85" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b1b1b">③ 규범기</text>
  <text x="430" y="105" font-size="13" text-anchor="middle" fill="#555555">Norming</text>
  <text x="430" y="127" font-size="13" text-anchor="middle" fill="#1b1b1b">집단 응집</text>

  <rect x="520" y="62" width="140" height="78" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="590" y="85" font-size="15" font-weight="bold" text-anchor="middle" fill="#2d6a4f">④ 성취기</text>
  <text x="590" y="105" font-size="13" text-anchor="middle" fill="#555555">Performing</text>
  <text x="590" y="127" font-size="13" text-anchor="middle" fill="#1b1b1b">기능적 역할 관계</text>

  <rect x="680" y="62" width="140" height="78" fill="#ffffff" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="750" y="85" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b1b1b">⑤ 해산기</text>
  <text x="750" y="105" font-size="13" text-anchor="middle" fill="#555555">Adjourning</text>
  <text x="750" y="127" font-size="13" text-anchor="middle" fill="#1b1b1b">해산</text>

  <line x1="182" y1="101" x2="198" y2="101" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="342" y1="101" x2="358" y2="101" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="502" y1="101" x2="518" y2="101" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="662" y1="101" x2="678" y2="101" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="40" y="196" font-size="16" font-weight="bold" fill="#1b1b1b">거식의 단속 평형 — 관성과 급변이 번갈아 온다</text>
  <text x="820" y="196" font-size="13" text-anchor="end" fill="#1b1b1b">1988년 · 프로젝트 팀 8개 관찰</text>

  <rect x="40" y="212" width="350" height="54" fill="#ffffff" stroke="#555555" stroke-width="1.4"/>
  <text x="215" y="244" font-size="15" text-anchor="middle" fill="#1b1b1b">관성 구간 — 처음 잡은 방식 유지</text>
  <rect x="400" y="212" width="100" height="54" fill="#fdf1e3" stroke="#b45309" stroke-width="1.8"/>
  <text x="450" y="244" font-size="15" font-weight="bold" text-anchor="middle" fill="#b45309">전환</text>
  <rect x="510" y="212" width="310" height="54" fill="#ffffff" stroke="#555555" stroke-width="1.4"/>
  <text x="665" y="244" font-size="15" text-anchor="middle" fill="#1b1b1b">관성 구간 — 바꾼 방식 유지</text>

  <line x1="40" y1="292" x2="820" y2="292" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="40" y1="286" x2="40" y2="298" stroke="#555555" stroke-width="1.5"/>
  <line x1="450" y1="286" x2="450" y2="298" stroke="#b45309" stroke-width="2"/>
  <text x="40" y="318" font-size="13" fill="#1b1b1b">시작</text>
  <text x="450" y="318" font-size="13" text-anchor="middle" fill="#b45309">주어진 시간의 중간 지점</text>
  <text x="820" y="318" font-size="13" text-anchor="end" fill="#1b1b1b">마감</text>
  <text x="440" y="340" font-size="13" text-anchor="middle" fill="#555555">전환을 일으키는 것은 끝낸 일의 양이 아니라 시간과 마감에 대한 인식이다</text>
</svg>
