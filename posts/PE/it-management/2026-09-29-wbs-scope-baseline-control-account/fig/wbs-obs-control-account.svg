<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f"/>
    </marker>
  </defs>
  <text x="440" y="30" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">WBS와 OBS가 만나는 자리가 통제 계정이다</text>

  <!-- 축 라벨 -->
  <text x="30" y="62" font-size="13" fill="#4b5563">WBS (산출물)</text>
  <text x="585" y="62" font-size="13" text-anchor="middle" fill="#4b5563">OBS (조직)</text>

  <!-- WBS 트리 -->
  <rect x="30" y="72" width="220" height="40" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="140" y="97" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">1 정보시스템 구축</text>
  <rect x="60" y="150" width="190" height="48" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="155" y="179" font-size="14" text-anchor="middle" fill="#111827">1.1 응용 시스템</text>
  <rect x="60" y="212" width="190" height="48" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="155" y="241" font-size="14" text-anchor="middle" fill="#111827">1.2 데이터 이관</text>
  <path d="M45,112 V236 M45,174 H60 M45,236 H60" fill="none" stroke="#374151" stroke-width="1.5"/>

  <!-- OBS -->
  <rect x="420" y="72" width="150" height="40" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="495" y="97" font-size="14" text-anchor="middle" fill="#111827">개발팀</text>
  <rect x="600" y="72" width="150" height="40" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="675" y="97" font-size="14" text-anchor="middle" fill="#111827">품질팀</text>

  <!-- 교차 안내선 -->
  <g stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4" fill="none">
    <line x1="250" y1="174" x2="420" y2="174"/>
    <line x1="250" y1="236" x2="420" y2="236"/>
    <line x1="495" y1="112" x2="495" y2="150"/>
    <line x1="675" y1="112" x2="675" y2="150"/>
  </g>

  <!-- 교차 칸 -->
  <rect x="420" y="150" width="150" height="48" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="4 4"/>
  <rect x="600" y="150" width="150" height="48" rx="4" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="675" y="179" font-size="13" text-anchor="middle" fill="#111827">통제 계정</text>
  <rect x="420" y="212" width="150" height="48" rx="4" fill="#ffffff" stroke="#2d6a4f" stroke-width="2.4"/>
  <text x="495" y="232" font-size="14" font-weight="bold" text-anchor="middle" fill="#2d6a4f">통제 계정</text>
  <text x="495" y="251" font-size="13" text-anchor="middle" fill="#2d6a4f">WBS × OBS 교차점</text>
  <rect x="600" y="212" width="150" height="48" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="4 4"/>

  <!-- 패키지 -->
  <path d="M495,260 V280 H385 V298 M495,280 H585 V298" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="300" y="300" width="170" height="56" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="385" y="323" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">작업 패키지</text>
  <text x="385" y="343" font-size="13" text-anchor="middle" fill="#4b5563">가까운 작업 · 상세 예산</text>
  <rect x="500" y="300" width="170" height="56" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="585" y="323" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">기획 패키지</text>
  <text x="585" y="343" font-size="13" text-anchor="middle" fill="#4b5563">먼 작업 · 요약 예산</text>

  <!-- PMB -->
  <rect x="720" y="300" width="140" height="56" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="790" y="323" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">성과 측정 기준선</text>
  <text x="790" y="343" font-size="13" text-anchor="middle" fill="#4b5563">PMB</text>
  <line x1="670" y1="328" x2="718" y2="328" stroke="#2d6a4f" stroke-width="1.8" marker-end="url(#arrg)"/>
  <path d="M385,356 V376 H790 V358" fill="none" stroke="#2d6a4f" stroke-width="1.8" marker-end="url(#arrg)"/>
  <text x="585" y="394" font-size="13" text-anchor="middle" fill="#2d6a4f">두 패키지 예산의 합 = 통제 계정 예산</text>

  <!-- 범위 기준선 -->
  <rect x="30" y="410" width="820" height="46" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="440" y="438" font-size="14" text-anchor="middle" fill="#111827">범위 기준선 = 범위 기술서 + WBS + WBS 사전 — 공식 변경 통제로만 바꾼다</text>
</svg>
