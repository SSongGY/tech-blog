<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#f7f8fa"/>

  <text x="185" y="34" font-size="15" font-weight="bold" fill="#1b2430" text-anchor="middle">ISO 31000:2018 — 일반 위험관리</text>
  <text x="650" y="34" font-size="15" font-weight="bold" fill="#1b2430" text-anchor="middle">ISO/IEC 23894:2023 — AI 위험관리</text>

  <rect x="60" y="54" width="250" height="60" rx="6" fill="#ffffff" stroke="#5a6472" stroke-width="1.5"/>
  <text x="185" y="80" font-size="14" fill="#1b2430" text-anchor="middle">원칙 (4절)</text>
  <text x="185" y="100" font-size="13" fill="#5a6472" text-anchor="middle">좋은 위험관리의 기준</text>

  <rect x="60" y="144" width="250" height="60" rx="6" fill="#ffffff" stroke="#5a6472" stroke-width="1.5"/>
  <text x="185" y="170" font-size="14" fill="#1b2430" text-anchor="middle">프레임워크 (5절)</text>
  <text x="185" y="190" font-size="13" fill="#5a6472" text-anchor="middle">조직에 심는 6요소</text>

  <rect x="60" y="234" width="250" height="60" rx="6" fill="#ffffff" stroke="#5a6472" stroke-width="1.5"/>
  <text x="185" y="260" font-size="14" fill="#1b2430" text-anchor="middle">프로세스 (6절)</text>
  <text x="185" y="280" font-size="13" fill="#5a6472" text-anchor="middle">개별 위험을 다루는 6단계</text>

  <rect x="520" y="54" width="300" height="60" rx="6" fill="#e7f0ea" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="670" y="80" font-size="14" fill="#1b2430" text-anchor="middle">원칙 (4절) + AI 특화 설명</text>
  <text x="670" y="100" font-size="13" fill="#2d6a4f" text-anchor="middle">AI가 새 위험·발현 위험을 만든다</text>

  <rect x="520" y="144" width="300" height="60" rx="6" fill="#e7f0ea" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="670" y="170" font-size="14" fill="#1b2430" text-anchor="middle">프레임워크 (5절) + AI 특화 지침</text>
  <text x="670" y="190" font-size="13" fill="#2d6a4f" text-anchor="middle">설계 5.4.1~5.4.5로 세분</text>

  <rect x="520" y="234" width="300" height="60" rx="6" fill="#e7f0ea" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="670" y="260" font-size="14" fill="#1b2430" text-anchor="middle">프로세스 (6절) + AI 특화 지침</text>
  <text x="670" y="280" font-size="13" fill="#2d6a4f" text-anchor="middle">위험식별 6.4.2.2~6.4.2.6로 세분</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#5a6472"/>
    </marker>
  </defs>
  <line x1="312" y1="84" x2="516" y2="84" stroke="#5a6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="312" y1="174" x2="516" y2="174" stroke="#5a6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="312" y1="264" x2="516" y2="264" stroke="#5a6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="414" y="76" font-size="13" fill="#5a6472" text-anchor="middle">절 구조를</text>
  <text x="414" y="166" font-size="13" fill="#5a6472" text-anchor="middle">그대로 쓰고</text>
  <text x="414" y="256" font-size="13" fill="#5a6472" text-anchor="middle">필요한 곳만 덧붙인다</text>

  <text x="440" y="344" font-size="15" font-weight="bold" fill="#1b2430" text-anchor="middle">부속서 3개 (모두 정보 제공용)</text>

  <rect x="40" y="360" width="256" height="76" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="168" y="385" font-size="14" fill="#1b2430" text-anchor="middle">부속서 A — 목표</text>
  <text x="168" y="407" font-size="13" fill="#b45309" text-anchor="middle">위험기준·위험식별의</text>
  <text x="168" y="425" font-size="13" fill="#b45309" text-anchor="middle">판단 축으로 쓴다</text>

  <rect x="312" y="360" width="256" height="76" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="440" y="385" font-size="14" fill="#1b2430" text-anchor="middle">부속서 B — 위험원</text>
  <text x="440" y="407" font-size="13" fill="#b45309" text-anchor="middle">위험원 식별(6.4.2.3)의</text>
  <text x="440" y="425" font-size="13" fill="#b45309" text-anchor="middle">점검 목록으로 쓴다</text>

  <rect x="584" y="360" width="256" height="76" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="712" y="385" font-size="14" fill="#1b2430" text-anchor="middle">부속서 C — 생애주기 매핑</text>
  <text x="712" y="407" font-size="13" fill="#b45309" text-anchor="middle">6절 프로세스를 AI</text>
  <text x="712" y="425" font-size="13" fill="#b45309" text-anchor="middle">생애주기 단계에 건다</text>

  <line x1="670" y1="296" x2="670" y2="330" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="168" y1="330" x2="712" y2="330" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="168" y1="330" x2="168" y2="358" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="440" y1="330" x2="440" y2="358" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="712" y1="330" x2="712" y2="358" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5,4"/>
</svg>
