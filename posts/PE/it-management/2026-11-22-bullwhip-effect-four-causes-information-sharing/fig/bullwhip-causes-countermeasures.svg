<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">채찍 효과의 4가지 원인과 대응 — 이상적 조건 하나씩 깨짐</text>

  <text x="40" y="66" font-size="14" font-weight="bold" fill="#555">깨지는 이상적 조건</text>
  <text x="300" y="66" font-size="14" font-weight="bold" fill="#9d0208">원인</text>
  <text x="600" y="66" font-size="14" font-weight="bold" fill="#2d6a4f">대응</text>

  <!-- row 1 -->
  <text x="40" y="112" font-size="13" fill="#333">(i) 과거 수요로 예측하지 않음</text>
  <rect x="290" y="86" width="220" height="44" rx="6" fill="#fdecea" stroke="#9d0208" stroke-width="1.5"/>
  <text x="400" y="113" text-anchor="middle" font-size="14" fill="#222">수요 신호 처리</text>
  <rect x="590" y="86" width="260" height="44" rx="6" fill="#e6f2ec" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="720" y="106" text-anchor="middle" font-size="13" fill="#222">POS·판매 데이터 공유, VMI</text>
  <text x="720" y="123" text-anchor="middle" font-size="13" fill="#222">리드타임 단축</text>
  <line x1="510" y1="108" x2="584" y2="108" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- row 2 -->
  <text x="40" y="192" font-size="13" fill="#333">(ii) 공급 무한, 리드타임 고정</text>
  <rect x="290" y="166" width="220" height="44" rx="6" fill="#fdecea" stroke="#9d0208" stroke-width="1.5"/>
  <text x="400" y="193" text-anchor="middle" font-size="14" fill="#222">배급 게임(부족 게임)</text>
  <rect x="590" y="166" width="260" height="44" rx="6" fill="#e6f2ec" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="720" y="186" text-anchor="middle" font-size="13" fill="#222">과거 판매 기준 할당</text>
  <text x="720" y="203" text-anchor="middle" font-size="13" fill="#222">생산·재고 정보 공유, 주문 변경 제한</text>
  <line x1="510" y1="188" x2="584" y2="188" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- row 3 -->
  <text x="40" y="272" font-size="13" fill="#333">(iii) 고정 주문비 없음</text>
  <rect x="290" y="246" width="220" height="44" rx="6" fill="#fdecea" stroke="#9d0208" stroke-width="1.5"/>
  <text x="400" y="273" text-anchor="middle" font-size="14" fill="#222">주문 일괄 처리</text>
  <rect x="590" y="246" width="260" height="44" rx="6" fill="#e6f2ec" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="720" y="266" text-anchor="middle" font-size="13" fill="#222">EDI·CAO 로 주문비 절감</text>
  <text x="720" y="283" text-anchor="middle" font-size="13" fill="#222">혼적 할인, 납품 일정 분산</text>
  <line x1="510" y1="268" x2="584" y2="268" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- row 4 -->
  <text x="40" y="352" font-size="13" fill="#333">(iv) 구매 가격 일정</text>
  <rect x="290" y="326" width="220" height="44" rx="6" fill="#fdecea" stroke="#9d0208" stroke-width="1.5"/>
  <text x="400" y="353" text-anchor="middle" font-size="14" fill="#222">가격 변동(판촉)</text>
  <rect x="590" y="326" width="260" height="44" rx="6" fill="#e6f2ec" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="720" y="346" text-anchor="middle" font-size="13" fill="#222">EDLP(상시 저가)</text>
  <text x="720" y="363" text-anchor="middle" font-size="13" fill="#222">구매·납품 분리 계약</text>
  <line x1="510" y1="348" x2="584" y2="348" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="250" y1="108" x2="284" y2="108" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="250" y1="188" x2="284" y2="188" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="250" y1="268" x2="284" y2="268" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="250" y1="348" x2="284" y2="348" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>

  <text x="40" y="408" font-size="13" fill="#b45309">네 조건이 모두 성립하면 주문 = 직전 기간 수요 → 주문 분산 = 수요 분산</text>
  <text x="40" y="432" font-size="13" fill="#555">위 두 원인은 내부 재고 최적화에서, 아래 두 원인은 시장 상황에 대한 반응에서 나온다</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#444"/>
    </marker>
  </defs>
</svg>
