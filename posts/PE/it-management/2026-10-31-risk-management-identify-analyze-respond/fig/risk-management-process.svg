<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="'Malgun Gothic','Segoe UI',sans-serif">
  <rect x="0" y="0" width="880" height="360" fill="#fdfdfb"/>

  <text x="40" y="28" font-size="17" font-weight="bold" fill="#1b1b1b">위험 관리 4요소와, 그 안의 위험 평가 4단계</text>

  <path d="M755 92 L755 56 L125 56 L125 92" fill="none" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#amber)"/>
  <text x="440" y="50" font-size="13" fill="#b45309" text-anchor="middle">되먹임 — 모니터링 결과가 전제와 허용 수준을 다시 정한다</text>

  <rect x="40" y="92" width="170" height="58" rx="6" fill="#eef6f1" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="125" y="117" font-size="15" font-weight="bold" fill="#2d6a4f" text-anchor="middle">① 프레이밍</text>
  <text x="125" y="138" font-size="13" fill="#333" text-anchor="middle">가정·제약·허용 수준</text>

  <rect x="250" y="92" width="170" height="58" rx="6" fill="#eef6f1" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="335" y="117" font-size="15" font-weight="bold" fill="#2d6a4f" text-anchor="middle">② 평가</text>
  <text x="335" y="138" font-size="13" fill="#333" text-anchor="middle">식별 · 분석 · 우선순위</text>

  <rect x="460" y="92" width="170" height="58" rx="6" fill="#eef6f1" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="545" y="117" font-size="15" font-weight="bold" fill="#2d6a4f" text-anchor="middle">③ 대응</text>
  <text x="545" y="138" font-size="13" fill="#333" text-anchor="middle">수용·회피·완화·공유·전가</text>

  <rect x="670" y="92" width="170" height="58" rx="6" fill="#eef6f1" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="755" y="117" font-size="15" font-weight="bold" fill="#2d6a4f" text-anchor="middle">④ 모니터링</text>
  <text x="755" y="138" font-size="13" fill="#333" text-anchor="middle">잔여 위험·변화 추적</text>

  <path d="M210 121 L246 121" stroke="#2d6a4f" stroke-width="1.8" marker-end="url(#green)"/>
  <path d="M420 121 L456 121" stroke="#2d6a4f" stroke-width="1.8" marker-end="url(#green)"/>
  <path d="M630 121 L666 121" stroke="#2d6a4f" stroke-width="1.8" marker-end="url(#green)"/>

  <path d="M335 150 L335 196" stroke="#999" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#grey)"/>

  <rect x="40" y="200" width="800" height="138" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  <text x="60" y="224" font-size="13" font-weight="bold" fill="#555">② 평가를 펼치면 — 위험 평가 4단계</text>

  <rect x="60" y="238" width="175" height="78" rx="5" fill="#f6f8f7" stroke="#777" stroke-width="1.2"/>
  <text x="147" y="262" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">1. 준비</text>
  <text x="147" y="283" font-size="13" fill="#444" text-anchor="middle">목적·범위·가정</text>
  <text x="147" y="302" font-size="13" fill="#444" text-anchor="middle">분석 방식 결정</text>

  <rect x="255" y="238" width="175" height="78" rx="5" fill="#f6f8f7" stroke="#777" stroke-width="1.2"/>
  <text x="342" y="262" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">2. 수행</text>
  <text x="342" y="283" font-size="13" fill="#444" text-anchor="middle">위협원·위협사건·취약점</text>
  <text x="342" y="302" font-size="13" fill="#444" text-anchor="middle">가능성·영향·위험 결정</text>

  <rect x="450" y="238" width="175" height="78" rx="5" fill="#f6f8f7" stroke="#777" stroke-width="1.2"/>
  <text x="537" y="262" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">3. 공유</text>
  <text x="537" y="283" font-size="13" fill="#444" text-anchor="middle">결과를 의사결정자에게</text>
  <text x="537" y="302" font-size="13" fill="#444" text-anchor="middle">전달·공유</text>

  <rect x="645" y="238" width="175" height="78" rx="5" fill="#f6f8f7" stroke="#777" stroke-width="1.2"/>
  <text x="732" y="262" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">4. 유지</text>
  <text x="732" y="283" font-size="13" fill="#444" text-anchor="middle">변화 감시·재평가</text>
  <text x="732" y="302" font-size="13" fill="#444" text-anchor="middle">결과 최신화</text>

  <path d="M235 277 L251 277" stroke="#777" stroke-width="1.4" marker-end="url(#grey)"/>
  <path d="M430 277 L446 277" stroke="#777" stroke-width="1.4" marker-end="url(#grey)"/>
  <path d="M625 277 L641 277" stroke="#777" stroke-width="1.4" marker-end="url(#grey)"/>

  <defs>
    <marker id="green" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0 0 L7 3.2 L0 6.4 z" fill="#2d6a4f"/>
    </marker>
    <marker id="grey" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0 0 L7 3.2 L0 6.4 z" fill="#777"/>
    </marker>
    <marker id="amber" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0 0 L7 3.2 L0 6.4 z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
