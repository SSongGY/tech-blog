<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">전자정부사업관리 위탁(PMO) — 관계 4주체와 위탁 3단계</text>

  <!-- 발주기관 -->
  <rect x="300" y="56" width="280" height="56" rx="6" fill="#eef3fb" stroke="#33507a" stroke-width="1.5"/>
  <text x="440" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">발주기관 (행정기관등의 장)</text>
  <text x="440" y="100" text-anchor="middle" font-size="13" fill="#555">의사결정·보고체계 정립, 역할 조정</text>

  <!-- PMO -->
  <rect x="300" y="172" width="280" height="56" rx="6" fill="#e6f2ec" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="440" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">전자정부사업관리자 (PMO)</text>
  <text x="440" y="216" text-anchor="middle" font-size="13" fill="#555">수행책임자·관리지원·기술지원 인력</text>

  <!-- 감리법인 -->
  <rect x="660" y="172" width="190" height="56" rx="6" fill="#fff7e8" stroke="#b45309" stroke-width="1.5"/>
  <text x="755" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">감리법인</text>
  <text x="755" y="216" text-anchor="middle" font-size="13" fill="#555">독립된 제3자 점검</text>

  <!-- 수행자 -->
  <rect x="300" y="288" width="280" height="56" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="440" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">위탁대상사업 수행자</text>
  <text x="440" y="332" text-anchor="middle" font-size="13" fill="#555">정보시스템 구축·고도화 사업자</text>

  <!-- 화살표 -->
  <line x1="440" y1="112" x2="440" y2="168" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="452" y="146" font-size="13" fill="#444">관리·감독 업무 위탁</text>
  <line x1="440" y1="228" x2="440" y2="284" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="452" y="262" font-size="13" fill="#2d6a4f">지시·이행 점검</text>
  <line x1="755" y1="228" x2="584" y2="306" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="690" y="282" font-size="13" fill="#b45309">점검·개선 권고</text>
  <line x1="580" y1="200" x2="656" y2="200" stroke="#9d0208" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="618" y="166" text-anchor="middle" font-size="13" fill="#9d0208">특수관계 금지</text>
  <line x1="618" y1="170" x2="618" y2="196" stroke="#9d0208" stroke-width="1"/>
  <text x="40" y="196" font-size="13" fill="#9d0208">자기·계열회사</text>
  <text x="40" y="214" font-size="13" fill="#9d0208">도급 조언 금지</text>
  <line x1="150" y1="204" x2="296" y2="204" stroke="#9d0208" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- 위탁 3단계 -->
  <text x="40" y="384" font-size="14" font-weight="bold" fill="#555">위탁 3단계 (원칙: 전부 위탁, 기획·사후관리는 제외 가능)</text>
  <rect x="40" y="398" width="240" height="52" rx="6" fill="#ffffff" stroke="#33507a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="160" y="420" text-anchor="middle" font-size="14" fill="#222">기획단계 — 업무 2가지</text>
  <text x="160" y="440" text-anchor="middle" font-size="13" fill="#555">사업기획·성과관리 지원</text>
  <rect x="320" y="398" width="240" height="52" rx="6" fill="#e6f2ec" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="440" y="420" text-anchor="middle" font-size="14" fill="#222">집행단계 — 업무 5가지</text>
  <text x="440" y="440" text-anchor="middle" font-size="13" fill="#555">관리·감독, 계획 검토, 위험 보고 등</text>
  <rect x="600" y="398" width="240" height="52" rx="6" fill="#ffffff" stroke="#33507a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="720" y="420" text-anchor="middle" font-size="14" fill="#222">사후관리단계 — 업무 2가지</text>
  <text x="720" y="440" text-anchor="middle" font-size="13" fill="#555">안정화·이용활성화 지원</text>
  <line x1="280" y1="424" x2="316" y2="424" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="424" x2="596" y2="424" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
