<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#fbfaf7"/>

  <text x="40" y="36" font-size="18" font-weight="bold" fill="#1b1b1b">생애주기 4단계 × 예산서 안팎 — TCO가 세는 범위</text>
  <text x="40" y="60" font-size="13" fill="#444">GAO는 생애주기 비용 추정을 개발·생산·운영유지·폐기 4단계로 나눈다. 아래 칸이 비면 그만큼 TCO가 작게 잡힌다.</text>

  <text x="230" y="100" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">① 개발</text>
  <text x="413" y="100" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">② 생산·구축</text>
  <text x="596" y="100" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">③ 운영·유지</text>
  <text x="779" y="100" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">④ 폐기</text>

  <!-- 1행 : 예산서에 잡히는 비용 -->
  <text x="40" y="150" font-size="13" font-weight="bold" fill="#1d4733">예산서에</text>
  <text x="40" y="168" font-size="13" font-weight="bold" fill="#1d4733">잡히는 비용</text>

  <rect x="150" y="112" width="160" height="84" rx="5" fill="#e4f0e8" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="162" y="140" font-size="13" fill="#1d4733">설계·개발 인건비</text>
  <text x="162" y="162" font-size="13" fill="#1d4733">외주 용역비</text>

  <rect x="333" y="112" width="160" height="84" rx="5" fill="#e4f0e8" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="345" y="140" font-size="13" fill="#1d4733">하드웨어</text>
  <text x="345" y="162" font-size="13" fill="#1d4733">소프트웨어 라이선스</text>

  <rect x="516" y="112" width="160" height="84" rx="5" fill="#e4f0e8" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="528" y="140" font-size="13" fill="#1d4733">유지보수료</text>
  <text x="528" y="162" font-size="13" fill="#1d4733">운영 인건비</text>

  <rect x="699" y="112" width="160" height="84" rx="5" fill="#e4f0e8" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="711" y="140" font-size="13" fill="#1d4733">철거·반납 비용</text>
  <text x="711" y="162" font-size="13" fill="#1d4733">잔존가치 차감</text>

  <!-- 2행 : 예산서 밖에 있는 비용 -->
  <text x="40" y="256" font-size="13" font-weight="bold" fill="#7c3d06">예산서 밖</text>
  <text x="40" y="274" font-size="13" font-weight="bold" fill="#7c3d06">숨은 비용</text>

  <rect x="150" y="218" width="160" height="84" rx="5" fill="#fdf0d9" stroke="#b45309" stroke-width="1.8"/>
  <text x="162" y="246" font-size="13" fill="#7c3d06">현업 요건 협의에</text>
  <text x="162" y="268" font-size="13" fill="#7c3d06">쓰는 업무 시간</text>

  <rect x="333" y="218" width="160" height="84" rx="5" fill="#fdf0d9" stroke="#b45309" stroke-width="1.8"/>
  <text x="345" y="246" font-size="13" fill="#7c3d06">전환 교육</text>
  <text x="345" y="268" font-size="13" fill="#7c3d06">병행 운영 부담</text>

  <rect x="516" y="218" width="160" height="84" rx="5" fill="#fdf0d9" stroke="#b45309" stroke-width="1.8"/>
  <text x="528" y="246" font-size="13" fill="#7c3d06">비계획 중단 손실</text>
  <text x="528" y="268" font-size="13" fill="#7c3d06">사용자 자가 학습</text>

  <rect x="699" y="218" width="160" height="84" rx="5" fill="#fdf0d9" stroke="#b45309" stroke-width="1.8"/>
  <text x="711" y="246" font-size="13" fill="#7c3d06">데이터 이관·반출</text>
  <text x="711" y="268" font-size="13" fill="#7c3d06">잔여 계약 정리</text>

  <!-- 합산과 할인 -->
  <path d="M504 302 L504 318" stroke="#6b7280" stroke-width="1.6"/>
  <path d="M500 314 L504 321 L508 314 Z" fill="#6b7280"/>

  <rect x="150" y="324" width="709" height="52" rx="5" fill="#eef1f4" stroke="#6b7280" stroke-width="1.6"/>
  <text x="166" y="346" font-size="13" fill="#1b1b1b">연차별 비용 흐름  →  할인계수 1/(1+r)^t 를 곱한다  →  TCO의 현재가치</text>
  <text x="166" y="366" font-size="13" fill="#555">여기에 편익의 현재가치를 맞대면 할인 순편익과 편익비용비가 나온다.</text>
</svg>
