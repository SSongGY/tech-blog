<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="460" fill="#fdfdfb"/>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9d0208"/>
    </marker>
  </defs>

  <text x="40" y="30" font-size="17" font-weight="bold" fill="#222">역외 사본이 지나는 두 관문과 보관지 법의 역효력</text>

  <!-- 밴드 1 -->
  <text x="40" y="68" font-size="14" font-weight="bold" fill="#7a3c06">나가는 쪽 — 내 데이터를 국외로 보낼 수 있는가</text>

  <rect x="40" y="86" width="150" height="64" rx="4" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="115" y="112" font-size="14" fill="#222" text-anchor="middle">원본</text>
  <text x="115" y="134" font-size="13" fill="#444" text-anchor="middle">개인정보처리자</text>
  <text x="115" y="168" font-size="13" fill="#666" text-anchor="middle">국내</text>

  <line x1="190" y1="118" x2="210" y2="118" stroke="#444" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="212" y="80" width="142" height="76" rx="4" fill="#fdf5e9" stroke="#b45309" stroke-width="2"/>
  <text x="283" y="104" font-size="14" font-weight="bold" fill="#7a3c06" text-anchor="middle">제28조의8</text>
  <text x="283" y="126" font-size="13" fill="#333" text-anchor="middle">원칙은 금지</text>
  <text x="283" y="146" font-size="13" fill="#333" text-anchor="middle">예외 5가지</text>

  <line x1="354" y1="118" x2="374" y2="118" stroke="#444" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="376" y="86" width="150" height="64" rx="4" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="451" y="112" font-size="14" fill="#222" text-anchor="middle">사본</text>
  <text x="451" y="134" font-size="13" fill="#444" text-anchor="middle">해외 리전·보관소</text>
  <text x="451" y="168" font-size="13" fill="#666" text-anchor="middle">국외</text>

  <line x1="526" y1="118" x2="546" y2="118" stroke="#444" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="548" y="80" width="140" height="76" rx="4" fill="#fdf5e9" stroke="#b45309" stroke-width="2"/>
  <text x="618" y="104" font-size="14" font-weight="bold" fill="#7a3c06" text-anchor="middle">제28조의11</text>
  <text x="618" y="126" font-size="13" fill="#333" text-anchor="middle">재이전에</text>
  <text x="618" y="146" font-size="13" fill="#333" text-anchor="middle">같은 조건 준용</text>

  <line x1="688" y1="118" x2="708" y2="118" stroke="#444" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="710" y="86" width="140" height="64" rx="4" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="780" y="112" font-size="14" fill="#222" text-anchor="middle">재이전 사본</text>
  <text x="780" y="134" font-size="13" fill="#444" text-anchor="middle">제공자가 또 복제</text>
  <text x="780" y="168" font-size="13" fill="#666" text-anchor="middle">제3국</text>

  <line x1="40" y1="192" x2="850" y2="192" stroke="#ddd" stroke-width="1"/>

  <!-- 밴드 2 -->
  <text x="40" y="222" font-size="14" font-weight="bold" fill="#9d0208">들어오는 쪽 — 그 사본에 어느 나라 법이 닿는가</text>

  <rect x="300" y="246" width="330" height="82" rx="4" fill="#fbeaea" stroke="#9d0208" stroke-width="2"/>
  <text x="465" y="270" font-size="14" font-weight="bold" fill="#9d0208" text-anchor="middle">보관지·제공자 본국의 법</text>
  <text x="465" y="292" font-size="13" fill="#333" text-anchor="middle">18 U.S.C. §2713 (CLOUD Act)</text>
  <text x="465" y="314" font-size="13" fill="#333" text-anchor="middle">미국 안에 있든 밖에 있든 같은 의무</text>

  <line x1="465" y1="246" x2="465" y2="154" stroke="#9d0208" stroke-width="1.5" marker-end="url(#a2)"/>

  <line x1="380" y1="328" x2="262" y2="356" stroke="#9d0208" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="40" y="360" width="330" height="80" rx="4" fill="#ffffff" stroke="#9d0208" stroke-width="1.5"/>
  <text x="205" y="384" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">국내 리전에 둔 사본</text>
  <text x="205" y="406" font-size="13" fill="#333" text-anchor="middle">제공자가 외국 법의 적용을 받으면</text>
  <text x="205" y="428" font-size="13" fill="#333" text-anchor="middle">위치가 국내여도 그 법이 닿는다</text>

  <rect x="660" y="246" width="190" height="82" rx="4" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="674" y="270" font-size="13" font-weight="bold" fill="#222">두 축은 서로 독립이다</text>
  <text x="674" y="292" font-size="13" fill="#333">나가는 쪽을 통과해도</text>
  <text x="674" y="314" font-size="13" fill="#333">들어오는 쪽은 남는다</text>
</svg>
