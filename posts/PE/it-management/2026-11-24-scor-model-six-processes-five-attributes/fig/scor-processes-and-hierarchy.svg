<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">SCOR — 1수준 프로세스 6가지와 계층·지표 분해</text>

  <!-- 왼쪽: 프로세스 6가지 -->
  <text x="40" y="66" font-size="14" font-weight="bold" fill="#555">1수준 관리 프로세스 6가지</text>
  <rect x="40" y="80" width="380" height="44" rx="6" fill="#eef3fb" stroke="#33507a" stroke-width="1.5"/>
  <text x="230" y="107" text-anchor="middle" font-size="14" fill="#222">계획 Plan (sP) — 요구량·시정 조치 결정</text>

  <rect x="40" y="150" width="116" height="48" rx="6" fill="#ffffff" stroke="#33507a" stroke-width="1.5"/>
  <text x="98" y="172" text-anchor="middle" font-size="14" fill="#222">조달 Source</text>
  <text x="98" y="190" text-anchor="middle" font-size="13" fill="#555">sS</text>
  <rect x="172" y="150" width="116" height="48" rx="6" fill="#ffffff" stroke="#33507a" stroke-width="1.5"/>
  <text x="230" y="172" text-anchor="middle" font-size="14" fill="#222">생산 Make</text>
  <text x="230" y="190" text-anchor="middle" font-size="13" fill="#555">sM</text>
  <rect x="304" y="150" width="116" height="48" rx="6" fill="#ffffff" stroke="#33507a" stroke-width="1.5"/>
  <text x="362" y="172" text-anchor="middle" font-size="14" fill="#222">배송 Deliver</text>
  <text x="362" y="190" text-anchor="middle" font-size="13" fill="#555">sD</text>
  <line x1="156" y1="174" x2="168" y2="174" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="288" y1="174" x2="300" y2="174" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="224" width="380" height="44" rx="6" fill="#fff7e8" stroke="#b45309" stroke-width="1.5"/>
  <text x="230" y="251" text-anchor="middle" font-size="14" fill="#222">반품 Return (sSR·sDR) — 고객에서 거슬러 올라감</text>

  <rect x="40" y="294" width="380" height="44" rx="6" fill="#f1f1f1" stroke="#555" stroke-width="1.5"/>
  <text x="230" y="321" text-anchor="middle" font-size="14" fill="#222">지원 Enable (sE) — 규칙·성과·데이터·자산·계약</text>

  <text x="40" y="366" font-size="13" fill="#555">공급자의 공급자 → 고객의 고객까지, 주문 접수부터 대금 수령까지</text>
  <text x="40" y="386" font-size="13" fill="#555">영업·마케팅, 제품 개발, 연구개발은 범위 밖</text>

  <!-- 오른쪽: 계층과 지표 분해 -->
  <text x="490" y="66" font-size="14" font-weight="bold" fill="#555">프로세스 계층과 지표 분해</text>
  <rect x="490" y="80" width="300" height="56" rx="6" fill="#e6f2ec" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="640" y="102" text-anchor="middle" font-size="14" fill="#222">1수준 — 범위: sD 배송</text>
  <text x="640" y="124" text-anchor="middle" font-size="13" fill="#2d6a4f">지표 RL.1.1 완전 주문 충족률</text>

  <rect x="490" y="166" width="300" height="56" rx="6" fill="#e6f2ec" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="640" y="188" text-anchor="middle" font-size="14" fill="#222">2수준 — 구성: sD1 재고품 배송</text>
  <text x="640" y="210" text-anchor="middle" font-size="13" fill="#2d6a4f">지표 RL.2.4 완전 상태(Perfect Condition)</text>

  <rect x="490" y="252" width="300" height="56" rx="6" fill="#e6f2ec" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="640" y="274" text-anchor="middle" font-size="14" fill="#222">3수준 — 단계: sD1.2 주문 접수·입력·검증</text>
  <text x="640" y="296" text-anchor="middle" font-size="13" fill="#2d6a4f">3수준 지표</text>

  <rect x="490" y="338" width="300" height="50" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="640" y="360" text-anchor="middle" font-size="14" fill="#222">4수준 — 기업별 구현(SCOR 범위 밖)</text>
  <text x="640" y="379" text-anchor="middle" font-size="13" fill="#555">전화·전자·대면 접수 절차 등</text>

  <line x1="560" y1="140" x2="560" y2="162" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="226" x2="560" y2="248" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="312" x2="560" y2="334" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="572" y="156" font-size="13" fill="#444">세분화</text>

  <line x1="808" y1="304" x2="808" y2="86" stroke="#9d0208" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="490" y="412" font-size="13" fill="#9d0208">오른쪽 화살표: 하위 지표가 상위 지표를 진단(root-causing)</text>
  <text x="490" y="434" font-size="13" fill="#555">1~3수준은 업종 중립 — ASCM이 정의한다</text>
  <text x="490" y="456" font-size="13" fill="#555">지표 코드의 숫자 = 수준 (RL.1.1은 신뢰성 1수준)</text>
</svg>
