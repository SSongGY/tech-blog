<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="330" fill="#fbfaf7"/>

  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L9,3.2 L0,6.4 z" fill="#2d6a4f"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="18" font-weight="bold" fill="#1b1b1b">서비스 가치 사슬의 활동 6개 — 고정된 순서가 아니다</text>

  <!-- 계획 (위에서 전체를 덮는다) -->
  <rect x="188" y="58" width="520" height="42" rx="5" fill="#e4f0e8" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="448" y="85" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d4733">계획 — 비전과 방향을 모든 활동에 공유한다</text>

  <!-- 수요 -->
  <rect x="28" y="140" width="106" height="66" rx="6" fill="#ffffff" stroke="#444" stroke-width="1.6"/>
  <text x="81" y="168" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b1b1b">기회 · 수요</text>
  <text x="81" y="190" font-size="13" text-anchor="middle" fill="#555">이해관계자</text>
  <line x1="138" y1="173" x2="158" y2="173" stroke="#2d6a4f" stroke-width="2.2" marker-end="url(#a2)"/>

  <!-- 참여 -->
  <rect x="164" y="134" width="130" height="78" rx="5" fill="#fdf0d9" stroke="#b45309" stroke-width="1.8"/>
  <text x="229" y="166" font-size="14" font-weight="bold" text-anchor="middle" fill="#7c3d06">참여</text>
  <text x="229" y="188" font-size="13" text-anchor="middle" fill="#8a4a0c">요구를 받고</text>
  <text x="229" y="205" font-size="13" text-anchor="middle" fill="#8a4a0c">결과를 돌려준다</text>
  <line x1="300" y1="173" x2="320" y2="173" stroke="#2d6a4f" stroke-width="2.2" marker-end="url(#a2)"/>

  <!-- 중간 세 활동 -->
  <rect x="326" y="128" width="148" height="44" rx="5" fill="#e4f0e8" stroke="#2d6a4f" stroke-width="1.4"/>
  <text x="400" y="156" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d4733">설계 및 전환</text>

  <rect x="326" y="180" width="148" height="44" rx="5" fill="#e4f0e8" stroke="#2d6a4f" stroke-width="1.4"/>
  <text x="400" y="208" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d4733">확보 · 구축</text>

  <line x1="480" y1="173" x2="500" y2="173" stroke="#2d6a4f" stroke-width="2.2" marker-end="url(#a2)"/>

  <rect x="506" y="134" width="152" height="78" rx="5" fill="#e4f0e8" stroke="#2d6a4f" stroke-width="1.4"/>
  <text x="582" y="166" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d4733">제공 및 지원</text>
  <text x="582" y="188" font-size="13" text-anchor="middle" fill="#2d6a4f">합의한 수준으로</text>
  <text x="582" y="205" font-size="13" text-anchor="middle" fill="#2d6a4f">운영한다</text>

  <line x1="664" y1="173" x2="684" y2="173" stroke="#2d6a4f" stroke-width="2.2" marker-end="url(#a2)"/>

  <!-- 가치 -->
  <rect x="690" y="140" width="106" height="66" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="743" y="168" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d4733">제품 · 서비스</text>
  <text x="743" y="190" font-size="13" text-anchor="middle" fill="#555">가치</text>

  <!-- 개선 -->
  <rect x="188" y="244" width="520" height="42" rx="5" fill="#e4f0e8" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="448" y="271" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d4733">개선 — 모든 활동의 결과를 되먹여 고친다</text>

  <text x="40" y="312" font-size="13" fill="#666">계획과 개선은 특정 단계가 아니라 나머지 네 활동 전체에 걸친다. 한 요구가 활동들을 어떤 차례로 지나갈지는 그때그때 달라진다.</text>
</svg>
