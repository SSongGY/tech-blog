<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="440" fill="#ffffff"/>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">PMBOK 6판의 5개 프로세스 그룹과 판마다 달라진 구조</text>

  <text x="20" y="64" font-size="14" font-weight="bold" fill="#495057">프로세스 그룹 5개 — 괄호는 그 그룹에 속한 6판 프로세스 수 (합계 49)</text>

  <!-- 착수 -->
  <rect x="20" y="84" width="130" height="64" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="85" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">착수</text>
  <text x="85" y="132" text-anchor="middle" font-size="13" fill="#1b1b1b">(2)</text>

  <!-- 기획 -->
  <rect x="190" y="84" width="150" height="64" rx="6" fill="#fff3cd" stroke="#b45309" stroke-width="1.5"/>
  <text x="265" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">기획</text>
  <text x="265" y="132" text-anchor="middle" font-size="13" fill="#1b1b1b">(24) — 가장 많다</text>

  <!-- 실행 -->
  <rect x="380" y="84" width="150" height="64" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="455" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">실행</text>
  <text x="455" y="132" text-anchor="middle" font-size="13" fill="#1b1b1b">(10)</text>

  <!-- 종료 -->
  <rect x="730" y="84" width="130" height="64" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="795" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">종료</text>
  <text x="795" y="132" text-anchor="middle" font-size="13" fill="#1b1b1b">(1)</text>

  <!-- 감시·통제: 아래에 걸쳐 -->
  <rect x="190" y="190" width="540" height="56" rx="6" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="460" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">감시 및 통제 (12)</text>
  <text x="460" y="234" text-anchor="middle" font-size="13" fill="#1b1b1b">기획·실행 전 구간에 걸쳐 계획 대비 실적을 비교하고 변경을 통제한다</text>

  <!-- 화살표 -->
  <line x1="150" y1="116" x2="182" y2="116" stroke="#495057" stroke-width="1.5"/>
  <polygon points="182,111 190,116 182,121" fill="#495057"/>
  <line x1="340" y1="116" x2="372" y2="116" stroke="#495057" stroke-width="1.5"/>
  <polygon points="372,111 380,116 372,121" fill="#495057"/>
  <line x1="530" y1="116" x2="722" y2="116" stroke="#495057" stroke-width="1.5"/>
  <polygon points="722,111 730,116 722,121" fill="#495057"/>

  <line x1="455" y1="148" x2="455" y2="182" stroke="#2d6a4f" stroke-width="1.5"/>
  <polygon points="450,182 455,190 460,182" fill="#2d6a4f"/>
  <line x1="265" y1="190" x2="265" y2="156" stroke="#2d6a4f" stroke-width="1.5"/>
  <polygon points="260,156 265,148 270,156" fill="#2d6a4f"/>
  <text x="275" y="176" font-size="13" fill="#2d6a4f">재기획</text>
  <text x="465" y="176" font-size="13" fill="#2d6a4f">실적</text>

  <text x="20" y="272" font-size="13" fill="#495057">가로축(그룹 5) × 세로축(지식 영역 10)의 교차 칸에 49개 프로세스가 한 번씩 들어간다.</text>
  <text x="20" y="292" font-size="13" fill="#495057">그룹은 단계(phase)가 아니라 프로세스의 묶음이며, 한 단계 안에서도 되풀이된다.</text>

  <!-- 판별 변화 -->
  <text x="20" y="318" font-size="14" font-weight="bold" fill="#495057">판마다 달라진 구조</text>

  <rect x="20" y="332" width="250" height="72" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="145" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">6판 (2017)</text>
  <text x="145" y="378" text-anchor="middle" font-size="13" fill="#1b1b1b">지식 영역 10 × 그룹 5</text>
  <text x="145" y="396" text-anchor="middle" font-size="13" fill="#1b1b1b">프로세스 49</text>

  <rect x="315" y="332" width="250" height="72" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="440" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">7판 (2021)</text>
  <text x="440" y="378" text-anchor="middle" font-size="13" fill="#1b1b1b">원칙 12 · 성과 영역 8</text>
  <text x="440" y="396" text-anchor="middle" font-size="13" fill="#b45309">프로세스는 별도 실무 지침(2022)으로</text>

  <rect x="610" y="332" width="250" height="72" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="735" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">8판 (2025-11)</text>
  <text x="735" y="378" text-anchor="middle" font-size="13" fill="#1b1b1b">원칙 6 · 성과 영역 7</text>
  <text x="735" y="396" text-anchor="middle" font-size="13" fill="#1b1b1b">초점 영역 5 · 프로세스 40</text>

  <line x1="270" y1="368" x2="307" y2="368" stroke="#495057" stroke-width="1.5"/>
  <polygon points="307,363 315,368 307,373" fill="#495057"/>
  <line x1="565" y1="368" x2="602" y2="368" stroke="#495057" stroke-width="1.5"/>
  <polygon points="602,363 610,368 602,373" fill="#495057"/>

  <text x="20" y="428" font-size="13" fill="#495057">8판의 초점 영역 5개는 6판 프로세스 그룹과 이름이 같다(착수·기획·실행·감시 및 통제·종료).</text>
</svg>
