<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="880" height="360" fill="#fbfaf7"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1f2937">3단계감리 — 점검 시점 3개와 각 시점이 되풀이하는 4스텝</text>

  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 단계 -->
  <rect x="40" y="60" width="230" height="56" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7 4"/>
  <text x="155" y="84" font-size="15" font-weight="bold" text-anchor="middle" fill="#7c2d12">요구정의단계</text>
  <text x="155" y="105" font-size="12" text-anchor="middle" fill="#7c2d12">요구사항정의서를 점검</text>

  <rect x="320" y="60" width="230" height="56" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="435" y="84" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">설계단계</text>
  <text x="435" y="105" font-size="12" text-anchor="middle" fill="#374151">설계 산출물을 점검</text>

  <rect x="600" y="60" width="230" height="56" rx="6" fill="#eef5f1" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="715" y="84" font-size="15" font-weight="bold" text-anchor="middle" fill="#14532d">종료단계</text>
  <text x="715" y="105" font-size="12" text-anchor="middle" fill="#14532d">검사 전 적합·부적합 판정</text>

  <g stroke="#374151" stroke-width="1.6" marker-end="url(#a2)" fill="none">
    <line x1="272" y1="88" x2="316" y2="88"/>
    <line x1="552" y1="88" x2="596" y2="88"/>
  </g>

  <!-- 각 단계가 되풀이하는 4스텝 -->
  <text x="40" y="160" font-size="13" fill="#4b5563">세 단계가 저마다 되풀이하는 4스텝</text>

  <rect x="40" y="175" width="188" height="62" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="134" y="199" font-size="13" text-anchor="middle" fill="#111827">① 사업자가 대비표</text>
  <text x="134" y="219" font-size="13" text-anchor="middle" fill="#111827">작성 · 발주자 확인</text>

  <rect x="244" y="175" width="188" height="62" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="338" y="199" font-size="13" text-anchor="middle" fill="#111827">② 감리법인 점검 ·</text>
  <text x="338" y="219" font-size="13" text-anchor="middle" fill="#111827">감리수행결과보고서</text>

  <rect x="448" y="175" width="188" height="62" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="542" y="199" font-size="13" text-anchor="middle" fill="#111827">③ 사업자가 시정조치</text>
  <text x="542" y="219" font-size="13" text-anchor="middle" fill="#111827">후 결과 제출</text>

  <rect x="652" y="175" width="188" height="62" rx="5" fill="#eef5f1" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="746" y="199" font-size="13" text-anchor="middle" fill="#14532d">④ 감리법인 확인 ·</text>
  <text x="746" y="219" font-size="13" text-anchor="middle" fill="#14532d">시정조치확인보고서</text>

  <g stroke="#6b7280" stroke-width="1.4" marker-end="url(#a2)" fill="none">
    <line x1="230" y1="206" x2="240" y2="206"/>
    <line x1="434" y1="206" x2="444" y2="206"/>
    <line x1="638" y1="206" x2="648" y2="206"/>
  </g>

  <line x1="40" y1="265" x2="840" y2="265" stroke="#d1d5db" stroke-width="1"/>
  <text x="40" y="290" font-size="13" fill="#7c2d12">사업비 20억원 미만이거나 사업기간 6개월 미만이면 요구정의단계를 뺀 2단계감리를 할 수 있다.</text>
  <text x="40" y="312" font-size="13" fill="#7c2d12">이때 요구사항정의서 점검은 발주자가 직접 한다. 없어지는 것이 아니라 발주자에게 넘어간다.</text>
  <text x="40" y="336" font-size="12" fill="#6b7280">감리보고서는 ②의 감리수행결과보고서와 ④의 시정조치확인보고서 두 가지를 함께 가리킨다.</text>
</svg>
