<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="360" fill="#fbfaf7"/>

  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2933">ISP와 ISMP가 놓이는 자리 — 대상 범위와 상세 수준이 갈린다</text>
  <text x="440" y="52" text-anchor="middle" font-size="13" fill="#52606d">둘 중 하나를 예산 요구 전에 수립한다. 같은 자리에 놓이지만 다루는 범위가 다르다.</text>

  <!-- ISP 경로 -->
  <text x="30" y="98" font-size="13" font-weight="bold" fill="#52606d">조직 전체 · 중장기</text>
  <rect x="30" y="108" width="260" height="76" rx="4" fill="#e6f1ea" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="160" y="134" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b4332">ISP 정보화전략계획</text>
  <text x="160" y="156" text-anchor="middle" font-size="13" fill="#1b4332">과제 도출 · 이행 로드맵</text>
  <text x="160" y="176" text-anchor="middle" font-size="13" fill="#1b4332">목표시스템 개념 설계까지</text>

  <!-- ISMP 경로 -->
  <text x="30" y="226" font-size="13" font-weight="bold" fill="#52606d">사업 하나 · 발주 직전</text>
  <rect x="30" y="236" width="260" height="76" rx="4" fill="#fdf3e3" stroke="#b45309" stroke-width="1.5"/>
  <text x="160" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c3d09">ISMP 정보시스템 마스터플랜</text>
  <text x="160" y="284" text-anchor="middle" font-size="13" fill="#7c3d09">기능 · 기술 · 비기능 요건</text>
  <text x="160" y="304" text-anchor="middle" font-size="13" fill="#7c3d09">기능점수 산정이 되는 수준까지</text>

  <path d="M290 146 L350 192" fill="none" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#ag)"/>
  <path d="M290 274 L350 228" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#ao)"/>

  <!-- 공통 경로 -->
  <rect x="356" y="186" width="170" height="48" rx="4" fill="#eef2f6" stroke="#52606d" stroke-width="1.5"/>
  <text x="441" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">예산 요구</text>
  <text x="441" y="226" text-anchor="middle" font-size="13" fill="#3e4c59">최종산출물 검토</text>

  <path d="M526 210 L584 210" stroke="#52606d" stroke-width="1.6" marker-end="url(#ad)"/>

  <rect x="590" y="186" width="130" height="48" rx="4" fill="#eef2f6" stroke="#52606d" stroke-width="1.5"/>
  <text x="655" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">RFP 작성</text>
  <text x="655" y="226" text-anchor="middle" font-size="13" fill="#3e4c59">발주 · 계약</text>

  <path d="M720 210 L778 210" stroke="#52606d" stroke-width="1.6" marker-end="url(#ad)"/>

  <rect x="784" y="186" width="66" height="48" rx="4" fill="#eef2f6" stroke="#52606d" stroke-width="1.5"/>
  <text x="817" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">구축</text>

  <text x="440" y="340" text-anchor="middle" font-size="13" fill="#7a0206">ISP만 거친 사업은 RFP 요건이 성기므로 과업 변경이 구축 단계에서 터진다</text>

  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#2d6a4f"/>
    </marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b45309"/>
    </marker>
    <marker id="ad" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#52606d"/>
    </marker>
  </defs>
</svg>
