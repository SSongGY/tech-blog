<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 444" width="880" height="444" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="444" fill="#fdfdfb"/>

  <text x="24" y="30" font-size="17" font-weight="bold" fill="#1a202c">몬테카를로 S-커브 — 상관을 넣으면 꼬리만 벌어진다</text>
  <text x="24" y="52" font-size="13" fill="#4a5568">가로축 프로젝트 기간(일) · 세로축 그 날짜 안에 끝날 누적 확률 · 10,000회 시행</text>

  <!-- 축 -->
  <line x1="90" y1="70" x2="90" y2="350" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="90" y1="350" x2="710" y2="350" stroke="#4a5568" stroke-width="1.5"/>

  <line x1="90" y1="280" x2="700" y2="280" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="90" y1="210" x2="700" y2="210" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="90" y1="140" x2="700" y2="140" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="90" y1="70" x2="700" y2="70" stroke="#e2e8f0" stroke-width="1"/>

  <text x="80" y="355" font-size="13" fill="#4a5568" text-anchor="end">0%</text>
  <text x="80" y="285" font-size="13" fill="#4a5568" text-anchor="end">25%</text>
  <text x="80" y="215" font-size="13" fill="#4a5568" text-anchor="end">50%</text>
  <text x="80" y="145" font-size="13" fill="#4a5568" text-anchor="end">75%</text>
  <text x="80" y="75" font-size="13" fill="#4a5568" text-anchor="end">100%</text>

  <text x="90" y="370" font-size="13" fill="#4a5568" text-anchor="middle">110</text>
  <text x="212" y="370" font-size="13" fill="#4a5568" text-anchor="middle">130</text>
  <text x="334" y="370" font-size="13" fill="#4a5568" text-anchor="middle">150</text>
  <text x="456" y="370" font-size="13" fill="#4a5568" text-anchor="middle">170</text>
  <text x="578" y="370" font-size="13" fill="#4a5568" text-anchor="middle">190</text>
  <text x="700" y="370" font-size="13" fill="#4a5568" text-anchor="middle">210</text>
  <text x="400" y="392" font-size="13" fill="#4a5568" text-anchor="middle">프로젝트 기간 (일)</text>

  <!-- 최빈값 합계 123일 -->
  <line x1="169" y1="70" x2="169" y2="350" stroke="#9d0208" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="174" y="86" font-size="13" fill="#9d0208">최빈값 합계 123일</text>
  <text x="174" y="104" font-size="13" fill="#9d0208">— 달성 확률 7.4%</text>

  <!-- PERT 평균 합계 134.5일 -->
  <line x1="240" y1="150" x2="240" y2="350" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="246" y="168" font-size="13" fill="#b45309">PERT 평균 134.5일</text>

  <!-- 독립 가정 곡선 -->
  <polyline points="183,322 242,280 304,210 375,140 393,126 438,98 473,84 545,73"
            fill="none" stroke="#2d6a4f" stroke-width="2.6"/>
  <circle cx="393" cy="126" r="4.5" fill="#2d6a4f"/>

  <!-- 상관 가정 곡선 -->
  <polyline points="120,322 197,280 296,210 411,140 438,126 512,98 573,84 665,73"
            fill="none" stroke="#9d0208" stroke-width="2.6" stroke-dasharray="7 4"/>
  <circle cx="438" cy="126" r="4.5" fill="#9d0208"/>

  <!-- P80 표시 -->
  <line x1="90" y1="126" x2="438" y2="126" stroke="#1a202c" stroke-width="1.1" stroke-dasharray="3 3"/>
  <text x="96" y="121" font-size="13" fill="#1a202c">P80</text>
  <line x1="393" y1="126" x2="438" y2="126" stroke="#1a202c" stroke-width="3"/>
  <text x="388" y="118" font-size="13" font-weight="bold" fill="#1a202c" text-anchor="end">+7.5일</text>

  <!-- 범례 -->
  <rect x="724" y="70" width="136" height="96" fill="#ffffff" stroke="#4a5568" stroke-width="1.2" rx="5"/>
  <line x1="736" y1="94" x2="770" y2="94" stroke="#2d6a4f" stroke-width="2.6"/>
  <text x="778" y="98" font-size="13" fill="#1a202c">작업 간 독립</text>
  <text x="736" y="116" font-size="13" fill="#4a5568">P80 = 159.6일</text>
  <line x1="736" y1="134" x2="770" y2="134" stroke="#9d0208" stroke-width="2.6" stroke-dasharray="7 4"/>
  <text x="778" y="138" font-size="13" fill="#1a202c">상관 ρ=0.5</text>
  <text x="736" y="156" font-size="13" fill="#4a5568">P80 = 167.1일</text>

  <!-- 해설 -->
  <rect x="90" y="400" width="770" height="22" fill="none"/>
  <text x="90" y="410" font-size="13" fill="#4a5568">두 곡선의 P50 은 145.1일과 143.7일로 거의 같다. 평균만 보면 같은 프로젝트다.</text>
  <text x="90" y="426" font-size="13" fill="#4a5568">그러나 P95 는 172.8일과 189.1일로 갈린다 — 상관은 평균이 아니라 꼬리를 바꾼다.</text>

  <rect x="724" y="180" width="136" height="150" fill="#fff4e3" stroke="#b45309" stroke-width="1.2" rx="5"/>
  <text x="736" y="202" font-size="13" font-weight="bold" fill="#b45309">읽는 법</text>
  <text x="736" y="224" font-size="13" fill="#1a202c">곡선이 세로축을</text>
  <text x="736" y="241" font-size="13" fill="#1a202c">자르는 높이가</text>
  <text x="736" y="258" font-size="13" fill="#1a202c">약속한 날짜의</text>
  <text x="736" y="275" font-size="13" fill="#1a202c">달성 확률이다.</text>
  <text x="736" y="298" font-size="13" fill="#1a202c">완만할수록 추정</text>
  <text x="736" y="315" font-size="13" fill="#1a202c">폭이 넓다는 뜻.</text>
</svg>
