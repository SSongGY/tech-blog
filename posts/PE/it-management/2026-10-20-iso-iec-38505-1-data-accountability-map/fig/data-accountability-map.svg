<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 512" width="880" height="512" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="512" fill="#f7f7f4"/>

  <text x="24" y="32" font-size="17" font-weight="bold" fill="#1b1b1b">데이터 책임 지도 — 여섯 단계 × 세 관점</text>

  <!-- 머리행 -->
  <rect x="24" y="50" width="146" height="40" fill="#e9e9e4" stroke="#444444" stroke-width="1.5"/>
  <text x="97" y="76" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">책임 단계 (§6)</text>

  <rect x="170" y="50" width="226" height="40" fill="#e8f0ec" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="283" y="76" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">가치 Value (§9.2)</text>

  <rect x="396" y="50" width="226" height="40" fill="#f6e7e7" stroke="#9d0208" stroke-width="1.5"/>
  <text x="509" y="76" font-size="14" font-weight="bold" fill="#9d0208" text-anchor="middle">위험 Risk (§9.3)</text>

  <rect x="622" y="50" width="226" height="40" fill="#f8efe0" stroke="#b45309" stroke-width="1.5"/>
  <text x="735" y="76" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">제약 Constraints (§9.4)</text>

  <!-- 1행 수집 -->
  <rect x="24" y="90" width="146" height="62" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
  <text x="97" y="117" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">① 수집</text>
  <text x="97" y="137" font-size="13" fill="#666666" text-anchor="middle">Collect §6.2</text>
  <rect x="170" y="90" width="226" height="62" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="283" y="127" font-size="13" fill="#333333" text-anchor="middle">무엇을 왜 모으는가</text>
  <rect x="396" y="90" width="226" height="62" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="509" y="127" font-size="13" fill="#333333" text-anchor="middle">출처·동의가 있는가</text>
  <rect x="622" y="90" width="226" height="62" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="735" y="127" font-size="13" fill="#333333" text-anchor="middle">수집 근거 법령</text>

  <!-- 2행 저장 -->
  <rect x="24" y="152" width="146" height="62" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
  <text x="97" y="179" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">② 저장</text>
  <text x="97" y="199" font-size="13" fill="#666666" text-anchor="middle">Store §6.3</text>
  <rect x="170" y="152" width="226" height="62" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="283" y="189" font-size="13" fill="#333333" text-anchor="middle">보관 비용 대비 효용</text>
  <rect x="396" y="152" width="226" height="62" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="509" y="189" font-size="13" fill="#333333" text-anchor="middle">분류 등급과 암호화</text>
  <rect x="622" y="152" width="226" height="62" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="735" y="189" font-size="13" fill="#333333" text-anchor="middle">보관 기간 규정</text>

  <!-- 3행 보고 -->
  <rect x="24" y="214" width="146" height="62" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
  <text x="97" y="241" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">③ 보고</text>
  <text x="97" y="261" font-size="13" fill="#666666" text-anchor="middle">Report §6.4</text>
  <rect x="170" y="214" width="226" height="62" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="283" y="251" font-size="13" fill="#333333" text-anchor="middle">누구에게 무엇을</text>
  <rect x="396" y="214" width="226" height="62" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="509" y="251" font-size="13" fill="#333333" text-anchor="middle">왜곡·오보고</text>
  <rect x="622" y="214" width="226" height="62" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="735" y="251" font-size="13" fill="#333333" text-anchor="middle">공시·보고 의무</text>

  <!-- 4행 결정 -->
  <rect x="24" y="276" width="146" height="62" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
  <text x="97" y="303" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">④ 결정</text>
  <text x="97" y="323" font-size="13" fill="#666666" text-anchor="middle">Decide §6.5</text>
  <rect x="170" y="276" width="226" height="62" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="283" y="313" font-size="13" fill="#333333" text-anchor="middle">결정에 쓸 품질인가</text>
  <rect x="396" y="276" width="226" height="62" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="509" y="313" font-size="13" fill="#333333" text-anchor="middle">오결정의 책임 귀속</text>
  <rect x="622" y="276" width="226" height="62" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="735" y="313" font-size="13" fill="#333333" text-anchor="middle">설명·이의 제기</text>

  <!-- 5행 배포 -->
  <rect x="24" y="338" width="146" height="62" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
  <text x="97" y="365" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">⑤ 배포</text>
  <text x="97" y="385" font-size="13" fill="#666666" text-anchor="middle">Distribute §6.6</text>
  <rect x="170" y="338" width="226" height="62" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="283" y="375" font-size="13" fill="#333333" text-anchor="middle">공유로 느는 가치</text>
  <rect x="396" y="338" width="226" height="62" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="509" y="375" font-size="13" fill="#333333" text-anchor="middle">유출·재식별</text>
  <rect x="622" y="338" width="226" height="62" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="735" y="375" font-size="13" fill="#333333" text-anchor="middle">제3자 제공 제한</text>

  <!-- 6행 폐기 -->
  <rect x="24" y="400" width="146" height="62" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
  <text x="97" y="427" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">⑥ 폐기</text>
  <text x="97" y="447" font-size="13" fill="#666666" text-anchor="middle">Dispose §6.7</text>
  <rect x="170" y="400" width="226" height="62" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="283" y="437" font-size="13" fill="#333333" text-anchor="middle">버려서 잃는 가치</text>
  <rect x="396" y="400" width="226" height="62" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="509" y="437" font-size="13" fill="#333333" text-anchor="middle">불완전 삭제</text>
  <rect x="622" y="400" width="226" height="62" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="735" y="437" font-size="13" fill="#333333" text-anchor="middle">파기 의무와 보존 의무</text>

  <text x="24" y="486" font-size="13" fill="#555555">단계 6 × 관점 3 = 18칸. 거버넌스체는 칸마다 평가(Evaluate)·지시(Direct)·감시(Monitor)를 수행한다.</text>
  <text x="24" y="504" font-size="13" fill="#555555">축과 칸 이름은 표준의 절 구성이고, 각 칸의 질문 문구는 두 축을 교차해 정리한 것이다.</text>
</svg>
