<svg xmlns="http://www.w3.org/2000/svg" width="880" height="536" viewBox="0 0 880 536" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="536" fill="#fbfbf8"/>

  <text x="30" y="32" font-size="17" font-weight="bold" fill="#1b1b1b">AI 시스템 영향평가 — 출시 전 평가와 운영 중 측정이 하나의 고리를 이룬다</text>

  <!-- ① 준비 -->
  <rect x="30" y="70" width="190" height="78" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="125" y="96" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">① 준비</text>
  <text x="125" y="118" font-size="13" fill="#555" text-anchor="middle">시점·범위·책임 배정</text>
  <text x="125" y="138" font-size="13" fill="#555" text-anchor="middle">임계치·영향 척도 설정</text>

  <line x1="220" y1="109" x2="246" y2="109" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- ② 수행 -->
  <rect x="250" y="70" width="190" height="78" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="345" y="96" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">② 수행</text>
  <text x="345" y="118" font-size="13" fill="#555" text-anchor="middle">시스템·데이터·모델 정보</text>
  <text x="345" y="138" font-size="13" fill="#555" text-anchor="middle">영향받는 사람·이익·위해</text>

  <line x1="440" y1="109" x2="466" y2="109" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- ③ 분석 판정 -->
  <polygon points="550,66 630,109 550,152 470,109" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="550" y="105" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">③ 임계치</text>
  <text x="550" y="123" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">초과?</text>

  <line x1="630" y1="109" x2="672" y2="109" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#arG)"/>
  <text x="652" y="98" font-size="13" fill="#2d6a4f" text-anchor="middle">아니오</text>

  <!-- ④ 기록·승인 -->
  <rect x="676" y="70" width="180" height="78" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="766" y="96" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">④ 기록·보고·승인</text>
  <text x="766" y="118" font-size="13" fill="#555" text-anchor="middle">평가 문서 보관</text>
  <text x="766" y="138" font-size="13" fill="#555" text-anchor="middle">승인 후 배포</text>

  <!-- 초과 시 조치 -->
  <line x1="550" y1="152" x2="550" y2="196" stroke="#9d0208" stroke-width="1.5" marker-end="url(#arR)"/>
  <text x="560" y="180" font-size="13" fill="#9d0208">예</text>
  <rect x="440" y="200" width="220" height="62" rx="6" fill="#fbeaea" stroke="#9d0208" stroke-width="1.5"/>
  <text x="550" y="226" font-size="14" font-weight="bold" fill="#9d0208" text-anchor="middle">위해 완화 조치</text>
  <text x="550" y="248" font-size="13" fill="#555" text-anchor="middle">설계 변경 · 감독 강화 · 용도 제한</text>
  <path d="M 440 231 L 345 231 L 345 152" fill="none" stroke="#9d0208" stroke-width="1.4" marker-end="url(#arR)"/>
  <text x="392" y="224" font-size="13" fill="#9d0208" text-anchor="middle">재평가</text>

  <!-- ⑤ 운영 측정 -->
  <line x1="766" y1="148" x2="766" y2="296" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="560" y="300" width="290" height="96" rx="6" fill="#eef1f7" stroke="#3b3b3b" stroke-width="1.8"/>
  <text x="705" y="326" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">⑤ 운영 중 모니터링</text>
  <text x="705" y="348" font-size="13" fill="#555" text-anchor="middle">결정 로그 → 주기 집계</text>
  <text x="705" y="368" font-size="13" fill="#555" text-anchor="middle">집단별 결과 비율 등 공정성 지표</text>
  <text x="705" y="388" font-size="13" fill="#555" text-anchor="middle">①에서 정한 임계치와 비교</text>

  <!-- 재평가 트리거 -->
  <path d="M 560 348 L 125 348 L 125 152" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arO)"/>
  <text x="340" y="340" font-size="13" fill="#b45309" text-anchor="middle">재평가 계기: 지표 이탈 · 모델·데이터·용도 변경 · 정기 주기</text>

  <!-- 하단: 세 문서의 위치 -->
  <line x1="30" y1="420" x2="850" y2="420" stroke="#cfcfc8" stroke-width="1"/>
  <text x="30" y="446" font-size="14" font-weight="bold" fill="#333">세 문서가 다루는 범위</text>
  <text x="30" y="470" font-size="13" fill="#333">ISO/IEC 42005: ①~⑤ 전체 절차와 문서 항목 (지침)</text>
  <text x="30" y="492" font-size="13" fill="#333">인공지능 기본법 시행령: ② ③의 포함 사항 7가지 (고영향 AI, 노력 의무)</text>
  <text x="30" y="514" font-size="13" fill="#333">EU AI법 제27조: 첫 사용 전 ② ③ 6가지 + 요소 변경 시 갱신 + 당국 통지 (일부 배포자 의무)</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a84"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6a4f"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9d0208"/>
    </marker>
  </defs>
</svg>
