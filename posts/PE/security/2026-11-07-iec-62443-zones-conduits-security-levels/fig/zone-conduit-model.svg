<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="440" y="30" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">영역(Zone)과 도관(Conduit) — 영역마다·도관마다 SL-T를 따로 정한다</text>

  <!-- 상단 영역 3개 -->
  <rect x="40" y="60" width="230" height="90" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="155" y="92" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">업무 영역</text>
  <text x="155" y="114" font-size="13" text-anchor="middle" fill="#374151">기업망 · 업무 시스템</text>
  <text x="155" y="136" font-size="13" text-anchor="middle" fill="#374151">SL-T 결정</text>

  <rect x="325" y="60" width="230" height="90" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="440" y="92" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">DMZ 영역</text>
  <text x="440" y="114" font-size="13" text-anchor="middle" fill="#374151">IT·OT 사이 중계 서버</text>
  <text x="440" y="136" font-size="13" text-anchor="middle" fill="#374151">SL-T 결정</text>

  <rect x="610" y="60" width="230" height="90" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="725" y="92" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">외부망 연결 영역</text>
  <text x="725" y="114" font-size="13" text-anchor="middle" fill="#374151">원격 유지보수 · 무선 기기</text>
  <text x="725" y="136" font-size="13" text-anchor="middle" fill="#374151">SL-T 결정</text>

  <!-- 하단 영역 2개 -->
  <rect x="110" y="270" width="380" height="130" rx="8" fill="#ecfdf5" stroke="#2d6a4f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="300" y="296" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">제어 영역</text>
  <rect x="130" y="312" width="160" height="70" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="210" y="342" font-size="14" text-anchor="middle" fill="#111827">SCADA · HMI</text>
  <text x="210" y="364" font-size="13" text-anchor="middle" fill="#374151">운전원 감시·조작</text>
  <rect x="310" y="312" width="160" height="70" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="390" y="342" font-size="14" text-anchor="middle" fill="#111827">PLC · 필드 기기</text>
  <text x="390" y="364" font-size="13" text-anchor="middle" fill="#374151">MODBUS (인증 없음)</text>
  <line x1="290" y1="347" x2="310" y2="347" stroke="#2d6a4f" stroke-width="2"/>

  <rect x="590" y="270" width="250" height="130" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="715" y="304" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">안전 영역</text>
  <text x="715" y="330" font-size="13" text-anchor="middle" fill="#374151">안전계장시스템(SIS)</text>
  <text x="715" y="352" font-size="13" text-anchor="middle" fill="#374151">별도 영역으로 분할</text>
  <text x="715" y="376" font-size="13" text-anchor="middle" fill="#374151">SL-T 결정</text>

  <!-- 도관 -->
  <line x1="270" y1="105" x2="325" y2="105" stroke="#2d6a4f" stroke-width="3"/>
  <text x="297" y="96" font-size="13" text-anchor="middle" fill="#2d6a4f">도관 C1</text>

  <line x1="610" y1="105" x2="555" y2="105" stroke="#2d6a4f" stroke-width="3"/>
  <text x="582" y="96" font-size="13" text-anchor="middle" fill="#2d6a4f">도관 C2</text>

  <line x1="440" y1="150" x2="440" y2="270" stroke="#2d6a4f" stroke-width="3"/>
  <text x="450" y="205" font-size="13" fill="#2d6a4f">도관 C3</text>
  <text x="450" y="223" font-size="13" fill="#2d6a4f">방화벽 · 단방향 게이트웨이</text>

  <line x1="490" y1="335" x2="590" y2="335" stroke="#b45309" stroke-width="3"/>
  <text x="540" y="326" font-size="13" text-anchor="middle" fill="#b45309">도관 C4</text>

  <!-- 금지 경로 -->
  <line x1="155" y1="150" x2="200" y2="270" stroke="#9d0208" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="40" y="214" font-size="13" fill="#9d0208">직접 경로 없음</text>
  <text x="40" y="232" font-size="13" fill="#9d0208">(인접 영역끼리만)</text>

  <text x="40" y="436" font-size="13" fill="#374151">점선 상자 = 영역: 위험·중요도·기능·위치·접근·책임 조직이 같은 자산 묶음</text>
  <text x="40" y="456" font-size="13" fill="#374151">굵은 선 = 도관: 보안 요구가 같은 통신 채널 묶음. 영역의 배치는 예시이며 실제 구획은 위험 평가로 정한다</text>
</svg>
