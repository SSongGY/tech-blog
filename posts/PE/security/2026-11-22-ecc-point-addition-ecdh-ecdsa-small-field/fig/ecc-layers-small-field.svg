<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9d0208"/>
    </marker>
  </defs>

  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222222">타원곡선 암호의 4층 구조와 실습 값 (E: y² = x³ + 2x + 2 mod 17)</text>

  <!-- 1층: 도메인 파라미터 -->
  <text x="24" y="70" font-size="14" font-weight="bold" fill="#555555">① 도메인 파라미터</text>
  <rect x="190" y="48" width="200" height="38" rx="6" fill="#eef2f7" stroke="#4a5568"/>
  <text x="290" y="72" text-anchor="middle" font-size="14" fill="#222222">유한체 GF(p)  p = 17</text>
  <rect x="410" y="48" width="220" height="38" rx="6" fill="#eef2f7" stroke="#4a5568"/>
  <text x="520" y="72" text-anchor="middle" font-size="14" fill="#222222">곡선 a = 2, b = 2  #E = 19</text>
  <rect x="650" y="48" width="210" height="38" rx="6" fill="#eef2f7" stroke="#4a5568"/>
  <text x="755" y="72" text-anchor="middle" font-size="14" fill="#222222">기점 G = (5, 1)  n = 19, h = 1</text>

  <!-- 2층: 군 연산 -->
  <text x="24" y="146" font-size="14" font-weight="bold" fill="#555555">② 군 연산</text>
  <rect x="190" y="118" width="320" height="50" rx="6" fill="#ffffff" stroke="#4a5568"/>
  <text x="350" y="139" text-anchor="middle" font-size="14" fill="#222222">점 덧셈 (현) P ≠ Q</text>
  <text x="350" y="158" text-anchor="middle" font-size="13" fill="#444444">λ = (y₂−y₁)/(x₂−x₁)   2G + G = (10, 6)</text>
  <rect x="540" y="118" width="320" height="50" rx="6" fill="#ffffff" stroke="#4a5568"/>
  <text x="700" y="139" text-anchor="middle" font-size="14" fill="#222222">점 배가 (접선) P = Q</text>
  <text x="700" y="158" text-anchor="middle" font-size="13" fill="#444444">λ = (3x₁² + a)/(2y₁)   G + G = (6, 3)</text>
  <text x="525" y="190" text-anchor="middle" font-size="13" fill="#444444">공통: x₃ = λ² − x₁ − x₂,  y₃ = λ(x₁ − x₃) − y₁,  항등원 = 무한원점 O</text>

  <!-- 3층: 스칼라 곱 -->
  <text x="24" y="250" font-size="14" font-weight="bold" fill="#555555">③ 스칼라 곱</text>
  <rect x="190" y="222" width="150" height="44" rx="6" fill="#eef2f7" stroke="#4a5568"/>
  <text x="265" y="249" text-anchor="middle" font-size="14" fill="#222222">개인키 d = 7</text>
  <rect x="690" y="222" width="170" height="44" rx="6" fill="#eef2f7" stroke="#4a5568"/>
  <text x="775" y="249" text-anchor="middle" font-size="14" fill="#222222">공개키 Q = (0, 6)</text>
  <line x1="345" y1="236" x2="684" y2="236" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrg)"/>
  <text x="515" y="229" text-anchor="middle" font-size="13" fill="#2d6a4f">Q = dG — double-and-add로 쉽다</text>
  <line x1="684" y1="256" x2="345" y2="256" stroke="#9d0208" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrr)"/>
  <text x="515" y="279" text-anchor="middle" font-size="13" fill="#9d0208">Q, G로 d 찾기 — ECDLP, 큰 n에서 어렵다</text>

  <!-- 4층: 응용 -->
  <text x="24" y="356" font-size="14" font-weight="bold" fill="#555555">④ 응용</text>
  <rect x="190" y="318" width="320" height="76" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="350" y="341" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">ECDH 키 합의</text>
  <text x="350" y="362" text-anchor="middle" font-size="13" fill="#222222">d_A·Q_B = d_B·Q_A = (6, 3)</text>
  <text x="350" y="382" text-anchor="middle" font-size="13" fill="#444444">공유 비밀 Z = x좌표 6 → 키 유도</text>
  <rect x="540" y="318" width="320" height="76" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="700" y="341" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">ECDSA 서명·검증</text>
  <text x="700" y="362" text-anchor="middle" font-size="13" fill="#222222">r = x(kG) mod n, s = k⁻¹(e + rd) mod n</text>
  <text x="700" y="382" text-anchor="middle" font-size="13" fill="#444444">k = 10, e = 30 → (r, s) = (7, 6)</text>

  <line x1="290" y1="88" x2="290" y2="114" stroke="#333333" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="700" y1="88" x2="700" y2="114" stroke="#333333" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="265" y1="198" x2="265" y2="218" stroke="#333333" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="350" y1="288" x2="350" y2="314" stroke="#333333" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="700" y1="288" x2="700" y2="314" stroke="#333333" stroke-width="1.3" marker-end="url(#arr)"/>

  <rect x="190" y="410" width="670" height="40" rx="6" fill="#fff7ed" stroke="#b45309"/>
  <text x="525" y="435" text-anchor="middle" font-size="13" fill="#b45309">주의: 서명마다 k를 새로 만든다. 같은 k로 두 번 서명하면 k = (e₁−e₂)/(s₁−s₂), d = (s₁k − e₁)/r 로 풀린다</text>
</svg>
