<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" width="880" height="392" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="392" fill="#fbfaf7"/>

  <text x="440" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2328">복제본·시점 사본·불변 에어갭 사본이 각각 끊는 지점</text>

  <rect x="340" y="48" width="200" height="44" rx="5" fill="#eef1f5" stroke="#4a5568" stroke-width="1.4"/>
  <text x="440" y="76" text-anchor="middle" font-size="13.5" fill="#1f2328">운영 데이터</text>

  <path d="M 440 92 V 120 H 150 V 143" fill="none" stroke="#8a8578" stroke-width="1.3"/>
  <path d="M 145 143 L 155 143 L 150 150 Z" fill="#8a8578"/>
  <path d="M 440 92 V 143" fill="none" stroke="#8a8578" stroke-width="1.3"/>
  <path d="M 435 143 L 445 143 L 440 150 Z" fill="#8a8578"/>
  <path d="M 440 92 V 120 H 730 V 143" fill="none" stroke="#8a8578" stroke-width="1.3"/>
  <path d="M 725 143 L 735 143 L 730 150 Z" fill="#8a8578"/>

  <rect x="16" y="150" width="268" height="48" rx="5" fill="#ffffff" stroke="#8a8578" stroke-width="1.2"/>
  <text x="30" y="179" font-size="13.5" fill="#1f2328">① 복제본 — 동기·비동기</text>
  <path d="M 145 207 L 155 207 L 150 214 Z" fill="#9d0208"/>
  <rect x="16" y="214" width="268" height="76" rx="5" fill="#fdeeee" stroke="#9d0208" stroke-width="1.5"/>
  <text x="30" y="238" font-size="13.5" fill="#7a0206">삭제·암호화·훼손이</text>
  <text x="30" y="257" font-size="13.5" fill="#7a0206">복제본에 그대로 전파된다</text>
  <text x="30" y="276" font-size="13.5" fill="#7a0206">— 비악의적 복구용</text>

  <rect x="306" y="150" width="268" height="48" rx="5" fill="#ffffff" stroke="#8a8578" stroke-width="1.2"/>
  <text x="320" y="179" font-size="13.5" fill="#1f2328">② 시점 사본 — 스냅숏·백업</text>
  <path d="M 435 207 L 445 207 L 440 214 Z" fill="#b45309"/>
  <rect x="306" y="214" width="268" height="76" rx="5" fill="#fdf4e6" stroke="#b45309" stroke-width="1.5"/>
  <text x="320" y="238" font-size="13.5" fill="#7c3a06">훼손 이전 시점으로 되돌린다</text>
  <text x="320" y="257" font-size="13.5" fill="#7c3a06">다만 운영 권한으로</text>
  <text x="320" y="276" font-size="13.5" fill="#7c3a06">지워질 수 있다</text>

  <rect x="596" y="150" width="268" height="48" rx="5" fill="#ffffff" stroke="#8a8578" stroke-width="1.2"/>
  <text x="610" y="179" font-size="13.5" fill="#1f2328">③ 불변 사본 + 에어갭</text>
  <path d="M 725 207 L 735 207 L 730 214 Z" fill="#2d6a4f"/>
  <rect x="596" y="214" width="268" height="76" rx="5" fill="#eaf3ec" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="610" y="238" font-size="13.5" fill="#1d4b36">보존 기간 안에는 삭제·</text>
  <text x="610" y="257" font-size="13.5" fill="#1d4b36">덮어쓰기가 거부되고</text>
  <text x="610" y="276" font-size="13.5" fill="#1d4b36">경로가 끊겨 닿지 않는다</text>

  <rect x="16" y="316" width="848" height="48" rx="5" fill="#ffffff" stroke="#8a8578" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="440" y="346" text-anchor="middle" font-size="13.5" fill="#1f2328">세 가지는 대체재가 아니라 겹쳐 쓰는 층이다 — 장비·사이트 장애는 ①②가, 악의적 삭제·암호화는 ③이 맡는다</text>
</svg>
