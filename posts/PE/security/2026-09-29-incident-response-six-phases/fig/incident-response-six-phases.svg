<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="420" fill="#ffffff"/>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">침해사고 대응 6단계와 NIST 4단계의 대응</text>

  <text x="20" y="92" font-size="13" font-weight="bold" fill="#495057">SANS 6단계</text>

  <!-- 6단계 -->
  <g text-anchor="middle">
    <rect x="110" y="62" width="112" height="56" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
    <text x="166" y="86" font-size="14" font-weight="bold" fill="#1b1b1b">① 준비</text>
    <text x="166" y="106" font-size="13" fill="#495057">Preparation</text>

    <rect x="236" y="62" width="112" height="56" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
    <text x="292" y="86" font-size="14" font-weight="bold" fill="#1b1b1b">② 식별</text>
    <text x="292" y="106" font-size="13" fill="#495057">Identification</text>

    <rect x="362" y="62" width="112" height="56" rx="6" fill="#fff3cd" stroke="#b45309" stroke-width="1.5"/>
    <text x="418" y="86" font-size="14" font-weight="bold" fill="#1b1b1b">③ 봉쇄</text>
    <text x="418" y="106" font-size="13" fill="#495057">Containment</text>

    <rect x="488" y="62" width="112" height="56" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
    <text x="544" y="86" font-size="14" font-weight="bold" fill="#1b1b1b">④ 제거</text>
    <text x="544" y="106" font-size="13" fill="#495057">Eradication</text>

    <rect x="614" y="62" width="112" height="56" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
    <text x="670" y="86" font-size="14" font-weight="bold" fill="#1b1b1b">⑤ 복구</text>
    <text x="670" y="106" font-size="13" fill="#495057">Recovery</text>

    <rect x="740" y="62" width="120" height="56" rx="6" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
    <text x="800" y="86" font-size="14" font-weight="bold" fill="#1b1b1b">⑥ 교훈</text>
    <text x="800" y="106" font-size="13" fill="#495057">Lessons</text>
  </g>

  <!-- 화살표 -->
  <g stroke="#495057" stroke-width="1.5">
    <line x1="222" y1="90" x2="232" y2="90"/>
    <line x1="348" y1="90" x2="358" y2="90"/>
    <line x1="474" y1="90" x2="484" y2="90"/>
    <line x1="600" y1="90" x2="610" y2="90"/>
    <line x1="726" y1="90" x2="736" y2="90"/>
  </g>

  <!-- 증거 보전 표시 -->
  <text x="418" y="140" text-anchor="middle" font-size="13" fill="#b45309">단기 봉쇄 → 포렌식 이미지 → 장기 봉쇄</text>

  <!-- NIST 4단계 -->
  <text x="20" y="210" font-size="13" font-weight="bold" fill="#495057">NIST 4단계</text>
  <text x="20" y="228" font-size="13" fill="#495057">(SP 800-61r2)</text>
  <g text-anchor="middle">
    <rect x="110" y="180" width="112" height="60" rx="6" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
    <text x="166" y="206" font-size="14" font-weight="bold" fill="#1b1b1b">준비</text>
    <text x="166" y="226" font-size="13" fill="#495057">§3.1</text>

    <rect x="236" y="180" width="112" height="60" rx="6" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
    <text x="292" y="206" font-size="14" font-weight="bold" fill="#1b1b1b">탐지·분석</text>
    <text x="292" y="226" font-size="13" fill="#495057">§3.2</text>

    <rect x="362" y="180" width="364" height="60" rx="6" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
    <text x="544" y="206" font-size="14" font-weight="bold" fill="#1b1b1b">봉쇄·제거·복구 (한 단계)</text>
    <text x="544" y="226" font-size="13" fill="#495057">§3.3</text>

    <rect x="740" y="180" width="120" height="60" rx="6" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
    <text x="800" y="206" font-size="14" font-weight="bold" fill="#1b1b1b">사후 활동</text>
    <text x="800" y="226" font-size="13" fill="#495057">§3.4</text>
  </g>

  <!-- 되먹임 -->
  <path d="M 800 240 L 800 280 L 166 280 L 166 246" fill="none" stroke="#2d6a4f" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="161,248 166,238 171,248" fill="#2d6a4f"/>
  <text x="483" y="300" text-anchor="middle" font-size="13" fill="#2d6a4f">교훈이 다음 준비로 들어간다 (Rev.2 순환 모델)</text>

  <!-- 봉쇄·제거·복구 → 탐지·분석 되돌아감 -->
  <line x1="362" y1="226" x2="352" y2="226" stroke="#b45309" stroke-width="1.5"/>
  <polygon points="354,221 346,226 354,231" fill="#b45309"/>
  <line x1="348" y1="194" x2="358" y2="194" stroke="#495057" stroke-width="1.5"/>
  <polygon points="356,189 364,194 356,199" fill="#495057"/>

  <text x="20" y="352" font-size="13" fill="#495057">NIST: 봉쇄·제거·복구 중에 탐지·분석으로 자주 되돌아간다(추가 감염 호스트 확인). SANS: 제거 전에 봉쇄 안에서 증거 사본을 뜬다.</text>
  <text x="20" y="376" font-size="13" fill="#495057">NIST SP 800-61r3(2025)은 이 순환 모델을 CSF 2.0 의 6개 기능(GV·ID·PR·DE·RS·RC)으로 바꿨다.</text>
</svg>
