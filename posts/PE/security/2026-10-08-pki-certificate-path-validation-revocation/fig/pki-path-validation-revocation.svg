<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14">
  <rect x="0" y="0" width="880" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="30" y="34" font-size="16" font-weight="bold" fill="#1f2937">검증 경로 — 말단에서 신뢰 앵커까지 서명을 따라 올라간다</text>

  <!-- 체인: 위에서 아래로 발급 -->
  <rect x="40" y="60" width="250" height="70" rx="6" fill="#e8f5ee" stroke="#2d6a4f" stroke-width="2"/>
  <text x="165" y="88" text-anchor="middle" font-weight="bold" fill="#2d6a4f">루트 CA (신뢰 앵커)</text>
  <text x="165" y="110" text-anchor="middle" font-size="13" fill="#1f2937">검증자가 미리 가진 공개키</text>

  <rect x="40" y="190" width="250" height="70" rx="6" fill="#eef2ff" stroke="#4b5563"/>
  <text x="165" y="218" text-anchor="middle" font-weight="bold" fill="#1f2937">중간 CA 인증서</text>
  <text x="165" y="240" text-anchor="middle" font-size="13" fill="#1f2937">루트가 서명, CA:TRUE</text>

  <rect x="40" y="320" width="250" height="70" rx="6" fill="#eef2ff" stroke="#4b5563"/>
  <text x="165" y="348" text-anchor="middle" font-weight="bold" fill="#1f2937">서버 인증서 (말단)</text>
  <text x="165" y="370" text-anchor="middle" font-size="13" fill="#1f2937">중간 CA가 서명, CA:FALSE</text>

  <line x1="165" y1="190" x2="165" y2="136" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="165" y1="320" x2="165" y2="266" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <text x="178" y="168" font-size="13" fill="#4b5563">발급자 서명 확인</text>
  <text x="178" y="298" font-size="13" fill="#4b5563">발급자 서명 확인</text>

  <!-- 폐기 정보원 -->
  <rect x="560" y="120" width="280" height="80" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="700" y="148" text-anchor="middle" font-weight="bold" fill="#b45309">CRL (저장소에서 내려받음)</text>
  <text x="700" y="170" text-anchor="middle" font-size="13" fill="#1f2937">CA 서명 목록: 폐기 일련번호·사유</text>
  <text x="700" y="190" text-anchor="middle" font-size="13" fill="#1f2937">thisUpdate ~ nextUpdate 동안 유효</text>

  <rect x="560" y="290" width="280" height="80" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="700" y="318" text-anchor="middle" font-weight="bold" fill="#b45309">OCSP 응답기</text>
  <text x="700" y="340" text-anchor="middle" font-size="13" fill="#1f2937">인증서 하나를 물으면 good·revoked·</text>
  <text x="700" y="360" text-anchor="middle" font-size="13" fill="#1f2937">unknown 중 하나를 서명해 답한다</text>

  <line x1="296" y1="345" x2="554" y2="185" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <line x1="296" y1="360" x2="554" y2="335" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <line x1="296" y1="225" x2="554" y2="160" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="425" y="232" text-anchor="middle" font-size="13" fill="#b45309">폐기 여부 조회</text>

  <!-- 깨지는 자리 -->
  <line x1="30" y1="420" x2="850" y2="420" stroke="#d1d5db"/>
  <text x="30" y="450" font-size="15" font-weight="bold" fill="#9d0208">실습에서 실패한 자리</text>
  <text x="30" y="476" font-size="13" fill="#1f2937">① 중간 CA를 안 받으면 경로가 끊긴다 → error 20 (1-2)</text>
  <text x="30" y="498" font-size="13" fill="#1f2937">② CRL을 못 구하면 → error 3 (2-3), nextUpdate가 지나면 → error 12 (2-6)</text>
  <text x="30" y="520" font-size="13" fill="#1f2937">③ 말단만 확인하면 폐기된 중간 CA를 놓친다 → 경로 전체 확인에서만 error 23 (3-1·3-2)</text>
  <text x="30" y="542" font-size="13" fill="#1f2937">④ OCSP 응답 서명자에게 OCSPSigning 용도가 없으면 응답 검증 실패 (4-3)</text>
</svg>
