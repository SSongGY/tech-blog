<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#f7f8fa"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#5a6472"/>
    </marker>
    <marker id="aro" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b45309"/>
    </marker>
  </defs>

  <text x="30" y="44" font-size="15" font-weight="bold" fill="#1b2430">등록 (enrolment)</text>

  <rect x="40" y="60" width="150" height="58" rx="6" fill="#ffffff" stroke="#5a6472" stroke-width="1.5"/>
  <text x="115" y="84" font-size="14" fill="#1b2430" text-anchor="middle">생체 데이터 M</text>
  <text x="115" y="104" font-size="13" fill="#5a6472" text-anchor="middle">얼굴·지문·홍채</text>

  <rect x="250" y="60" width="210" height="58" rx="6" fill="#e7f0ea" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="355" y="84" font-size="14" font-weight="bold" fill="#1b2430" text-anchor="middle">PIE</text>
  <text x="355" y="104" font-size="13" fill="#2d6a4f" text-anchor="middle">의사익명 식별자 생성기</text>

  <rect x="520" y="60" width="230" height="58" rx="6" fill="#ffffff" stroke="#5a6472" stroke-width="1.5"/>
  <text x="635" y="84" font-size="14" fill="#1b2430" text-anchor="middle">보호 템플릿 저장</text>
  <text x="635" y="104" font-size="13" fill="#5a6472" text-anchor="middle">PI (식별자) + AD (보조 데이터)</text>

  <rect x="40" y="150" width="150" height="48" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="115" y="170" font-size="13" fill="#1b2430" text-anchor="middle">난수 비밀 k</text>
  <text x="115" y="188" font-size="13" fill="#2d6a4f" text-anchor="middle">가입자·응용별</text>

  <line x1="192" y1="89" x2="246" y2="89" stroke="#5a6472" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="192" y1="166" x2="272" y2="122" stroke="#5a6472" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="462" y1="89" x2="516" y2="89" stroke="#5a6472" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="115" y="136" font-size="13" fill="#9d0208" text-anchor="middle">원본 M 은 등록 후 폐기</text>

  <text x="30" y="249" font-size="15" font-weight="bold" fill="#1b2430">검증 (verification)</text>

  <rect x="40" y="265" width="150" height="58" rx="6" fill="#ffffff" stroke="#5a6472" stroke-width="1.5"/>
  <text x="115" y="289" font-size="14" fill="#1b2430" text-anchor="middle">생체 데이터 M*</text>
  <text x="115" y="309" font-size="13" fill="#5a6472" text-anchor="middle">제시된 샘플</text>

  <rect x="250" y="265" width="210" height="58" rx="6" fill="#e7f0ea" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="355" y="289" font-size="14" font-weight="bold" fill="#1b2430" text-anchor="middle">PIR</text>
  <text x="355" y="309" font-size="13" fill="#2d6a4f" text-anchor="middle">의사익명 식별자 재생성기</text>

  <rect x="520" y="265" width="90" height="58" rx="6" fill="#ffffff" stroke="#5a6472" stroke-width="1.5"/>
  <text x="565" y="299" font-size="14" fill="#1b2430" text-anchor="middle">PI*</text>

  <rect x="650" y="265" width="150" height="58" rx="6" fill="#e7f0ea" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="725" y="289" font-size="14" font-weight="bold" fill="#1b2430" text-anchor="middle">PIC</text>
  <text x="725" y="309" font-size="13" fill="#2d6a4f" text-anchor="middle">보호 영역에서 비교</text>

  <line x1="192" y1="294" x2="246" y2="294" stroke="#5a6472" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="462" y1="294" x2="516" y2="294" stroke="#5a6472" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="612" y1="294" x2="646" y2="294" stroke="#5a6472" stroke-width="1.5" marker-end="url(#ar)"/>

  <polyline points="600,120 600,215 355,215 355,261" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#aro)"/>
  <text x="480" y="208" font-size="13" fill="#b45309" text-anchor="middle">AD 를 내려보낸다</text>
  <polyline points="700,120 700,235 790,235 790,261" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#aro)"/>
  <text x="762" y="228" font-size="13" fill="#b45309" text-anchor="middle">PI</text>

  <text x="815" y="299" font-size="13" fill="#1b2430">판정</text>

  <rect x="40" y="368" width="760" height="76" rx="6" fill="#ffffff" stroke="#5a6472" stroke-width="1.5"/>
  <text x="420" y="392" font-size="14" font-weight="bold" fill="#1b2430" text-anchor="middle">보호 템플릿이 만족해야 하는 4가지</text>
  <text x="130" y="416" font-size="13" fill="#2d6a4f" text-anchor="middle">비가역성</text>
  <text x="320" y="416" font-size="13" fill="#2d6a4f" text-anchor="middle">비연결성</text>
  <text x="520" y="416" font-size="13" fill="#2d6a4f" text-anchor="middle">갱신성</text>
  <text x="710" y="416" font-size="13" fill="#2d6a4f" text-anchor="middle">성능 보존</text>
  <text x="130" y="434" font-size="13" fill="#5a6472" text-anchor="middle">PI·AD 로 M 복원 불가</text>
  <text x="320" y="434" font-size="13" fill="#5a6472" text-anchor="middle">두 PI 의 동일인 판별 불가</text>
  <text x="520" y="434" font-size="13" fill="#5a6472" text-anchor="middle">재등록 없이 재발급</text>
  <text x="710" y="434" font-size="13" fill="#5a6472" text-anchor="middle">인식 성능 저하 없음</text>
</svg>
