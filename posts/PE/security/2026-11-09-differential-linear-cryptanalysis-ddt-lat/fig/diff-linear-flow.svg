<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="k" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#1b1b1b" stroke-width="1.6"/>
    </marker>
  </defs>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">차분 암호분석과 선형 암호분석 — 같은 뼈대, 다른 통계</text>

  <!-- 열 머리 -->
  <text x="225" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#9d0208">차분 암호분석 (Biham·Shamir)</text>
  <text x="655" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d6a4f">선형 암호분석 (Matsui)</text>

  <!-- 1단: 데이터 -->
  <rect x="40" y="76" width="370" height="58" fill="#fdf2f2" stroke="#9d0208" stroke-width="1.4" rx="4"/>
  <text x="225" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">① 선택 평문 쌍 (P, P ⊕ ΔP)</text>
  <text x="225" y="121" text-anchor="middle" font-size="13" fill="#4a5568">공격 모델: 선택 평문 — 입력 차분을 고른다</text>

  <rect x="470" y="76" width="370" height="58" fill="#eef6f1" stroke="#2d6a4f" stroke-width="1.4" rx="4"/>
  <text x="655" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">① 기지 평문 쌍 (P, C)</text>
  <text x="655" y="121" text-anchor="middle" font-size="13" fill="#4a5568">공격 모델: 기지 평문 — 고를 수 없다</text>

  <line x1="225" y1="134" x2="225" y2="162" stroke="#1b1b1b" stroke-width="1.4" marker-end="url(#k)"/>
  <line x1="655" y1="134" x2="655" y2="162" stroke="#1b1b1b" stroke-width="1.4" marker-end="url(#k)"/>

  <!-- 2단: R-1 라운드 경로 -->
  <rect x="40" y="164" width="370" height="76" fill="#ffffff" stroke="#4a5568" stroke-width="1.4" rx="4"/>
  <text x="225" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">② R−1 라운드 차분 특성</text>
  <text x="225" y="208" text-anchor="middle" font-size="13" fill="#1b1b1b">활성 S-box마다 DDT 칸 확률 β를 곱한다</text>
  <text x="225" y="228" text-anchor="middle" font-size="13" fill="#4a5568">p_D = Π β</text>

  <rect x="470" y="164" width="370" height="76" fill="#ffffff" stroke="#4a5568" stroke-width="1.4" rx="4"/>
  <text x="655" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">② R−1 라운드 선형 근사식</text>
  <text x="655" y="208" text-anchor="middle" font-size="13" fill="#1b1b1b">활성 S-box의 LAT 편향을 적층 보조정리로 합친다</text>
  <text x="655" y="228" text-anchor="middle" font-size="13" fill="#4a5568">ε = 2^(n−1) × Π ε_i</text>

  <line x1="225" y1="240" x2="225" y2="268" stroke="#1b1b1b" stroke-width="1.4" marker-end="url(#k)"/>
  <line x1="655" y1="240" x2="655" y2="268" stroke="#1b1b1b" stroke-width="1.4" marker-end="url(#k)"/>

  <!-- 3단: 부분 복호와 계수 -->
  <rect x="40" y="270" width="370" height="58" fill="#ffffff" stroke="#4a5568" stroke-width="1.4" rx="4"/>
  <text x="225" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">③ 마지막 라운드 부분 복호</text>
  <text x="225" y="315" text-anchor="middle" font-size="13" fill="#1b1b1b">차분이 특성과 같으면 그 키 후보에 +1</text>

  <rect x="470" y="270" width="370" height="58" fill="#ffffff" stroke="#4a5568" stroke-width="1.4" rx="4"/>
  <text x="655" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">③ 마지막 라운드 부분 복호</text>
  <text x="655" y="315" text-anchor="middle" font-size="13" fill="#1b1b1b">근사식이 성립하면 그 키 후보에 +1</text>

  <line x1="225" y1="328" x2="380" y2="366" stroke="#1b1b1b" stroke-width="1.4" marker-end="url(#k)"/>
  <line x1="655" y1="328" x2="500" y2="366" stroke="#1b1b1b" stroke-width="1.4" marker-end="url(#k)"/>

  <!-- 4단: 결론 -->
  <rect x="190" y="368" width="500" height="76" fill="#fff7ed" stroke="#b45309" stroke-width="1.4" rx="4"/>
  <text x="440" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">④ 계수가 가장 치우친 후보 = 마지막 라운드 부분키</text>
  <text x="440" y="413" text-anchor="middle" font-size="13" fill="#1b1b1b">필요 데이터: N_D ≈ c / p_D 쌍 · N_L ≈ 1 / ε²</text>
  <text x="440" y="433" text-anchor="middle" font-size="13" fill="#b45309">설계 대응: S-box 최댓값을 낮추고 활성 S-box 수를 늘린다</text>
</svg>
