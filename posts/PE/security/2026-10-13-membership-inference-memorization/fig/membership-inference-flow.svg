<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">멤버십 추론 — 질의 접근만으로 학습 포함 여부를 판정</text>

  <!-- defender side -->
  <rect x="20" y="50" width="400" height="190" fill="#f3f6f4" stroke="none"/>
  <text x="34" y="72" font-size="14" font-weight="bold" fill="#2d6a4f">모델 소유자 쪽 (공격자가 못 보는 곳)</text>

  <rect x="40" y="95" width="160" height="60" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="120" y="121" text-anchor="middle" font-size="15" fill="#222">학습 데이터</text>
  <text x="120" y="143" text-anchor="middle" font-size="13" fill="#555">구성원(member)</text>

  <rect x="240" y="95" width="160" height="60" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="320" y="121" text-anchor="middle" font-size="15" fill="#222">대상 모델</text>
  <text x="320" y="143" text-anchor="middle" font-size="13" fill="#555">학습 손실을 최소화</text>
  <line x1="200" y1="125" x2="238" y2="125" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="219" y="115" text-anchor="middle" font-size="13" fill="#555">학습</text>

  <text x="220" y="200" text-anchor="middle" font-size="13" fill="#555">구성원 레코드는 손실이 낮고 신뢰도가 높게 나오는 경향</text>
  <text x="220" y="220" text-anchor="middle" font-size="13" fill="#555">(과적합이 클수록 차이가 커진다)</text>

  <!-- API boundary -->
  <line x1="440" y1="50" x2="440" y2="440" stroke="#b45309" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="440" y="460" text-anchor="middle" font-size="13" fill="#b45309">질의 API 경계</text>

  <!-- attacker side -->
  <rect x="460" y="50" width="400" height="390" fill="#f8f1f1" stroke="none"/>
  <text x="474" y="72" font-size="14" font-weight="bold" fill="#9d0208">공격자 쪽 (블랙박스)</text>

  <rect x="660" y="95" width="180" height="60" rx="6" fill="#ffffff" stroke="#9d0208" stroke-width="1.5"/>
  <text x="750" y="121" text-anchor="middle" font-size="15" fill="#222">표적 레코드 x</text>
  <text x="750" y="143" text-anchor="middle" font-size="13" fill="#555">특정인의 데이터</text>

  <!-- query arrow: from x to model -->
  <line x1="658" y1="115" x2="402" y2="115" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="530" y="108" text-anchor="middle" font-size="13" fill="#444">① x로 질의</text>
  <!-- response arrow -->
  <line x1="402" y1="140" x2="478" y2="140" stroke="#444" stroke-width="1.5"/>
  <line x1="478" y1="140" x2="478" y2="248" stroke="#444" stroke-width="1.5"/>
  <line x1="478" y1="248" x2="498" y2="248" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="500" y="215" width="200" height="66" rx="6" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="600" y="242" text-anchor="middle" font-size="15" fill="#222">② 출력 받기</text>
  <text x="600" y="265" text-anchor="middle" font-size="13" fill="#555">레이블·신뢰도 → 손실</text>

  <rect x="500" y="325" width="200" height="66" rx="6" fill="#ffffff" stroke="#9d0208" stroke-width="1.5"/>
  <text x="600" y="352" text-anchor="middle" font-size="15" fill="#222">③ 판정</text>
  <text x="600" y="375" text-anchor="middle" font-size="13" fill="#555">손실 &lt; 임계값 → 구성원</text>
  <line x1="600" y1="281" x2="600" y2="323" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="720" y="325" width="130" height="66" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="785" y="352" text-anchor="middle" font-size="14" fill="#222">섀도 모델</text>
  <text x="785" y="375" text-anchor="middle" font-size="13" fill="#555">임계값 학습</text>
  <line x1="720" y1="358" x2="702" y2="358" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="660" y="425" text-anchor="middle" font-size="13" fill="#555">점선 상자는 선택 사항 — 손실 임계값만으로도 공격이 된다</text>
</svg>
