<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fbfbf8"/>

  <text x="30" y="32" font-size="17" font-weight="bold" fill="#1b1b1b">신뢰 감시 + 대체 — 의심 점수로 세 갈래를 나눈다</text>

  <!-- 작업 -->
  <rect x="30" y="80" width="120" height="60" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="90" y="106" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">작업</text>
  <text x="90" y="126" font-size="13" fill="#555" text-anchor="middle">문제 하나</text>

  <line x1="150" y1="110" x2="186" y2="110" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- U -->
  <rect x="190" y="74" width="170" height="72" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="275" y="102" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">비신뢰 모델 U</text>
  <text x="275" y="124" font-size="13" fill="#555" text-anchor="middle">속일 수 있다고 가정</text>

  <line x1="360" y1="110" x2="396" y2="110" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="378" y="100" font-size="13" fill="#555" text-anchor="middle">출력</text>

  <!-- T 점수 -->
  <rect x="400" y="74" width="170" height="72" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="485" y="102" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">신뢰 모델 T</text>
  <text x="485" y="124" font-size="13" fill="#555" text-anchor="middle">출력마다 의심 점수</text>

  <line x1="570" y1="110" x2="616" y2="110" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 판정 -->
  <polygon points="700,62 780,110 700,158 620,110" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="700" y="106" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">점수</text>
  <text x="700" y="124" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">구간?</text>

  <!-- 세 갈래 -->
  <line x1="680" y1="150" x2="150" y2="236" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#arG)"/>
  <line x1="700" y1="158" x2="460" y2="236" stroke="#b45309" stroke-width="1.5" marker-end="url(#arO)"/>
  <line x1="720" y1="150" x2="760" y2="236" stroke="#9d0208" stroke-width="1.5" marker-end="url(#arR)"/>

  <text x="300" y="196" font-size="13" fill="#2d6a4f">낮음</text>
  <text x="582" y="216" font-size="13" fill="#b45309">중간 (대체 기준 이상)</text>
  <text x="752" y="196" font-size="13" fill="#9d0208">상위 2%</text>

  <!-- 제출 U -->
  <rect x="40" y="240" width="220" height="70" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="150" y="268" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">U의 출력을 제출</text>
  <text x="150" y="290" font-size="13" fill="#555" text-anchor="middle">성능을 그대로 쓴다</text>

  <!-- 대체 -->
  <rect x="340" y="240" width="240" height="70" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="460" y="268" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">T가 만든 답으로 대체</text>
  <text x="460" y="290" font-size="13" fill="#555" text-anchor="middle">안전성을 얻고 유용성을 조금 잃는다</text>

  <!-- H 감사 -->
  <rect x="660" y="240" width="190" height="70" rx="6" fill="#ffffff" stroke="#9d0208" stroke-width="1.5"/>
  <text x="755" y="268" font-size="14" font-weight="bold" fill="#9d0208" text-anchor="middle">신뢰 인력 H 감사</text>
  <text x="755" y="290" font-size="13" fill="#555" text-anchor="middle">예산이 제한된 검토</text>

  <line x1="755" y1="310" x2="755" y2="356" stroke="#9d0208" stroke-width="1.5" marker-end="url(#arR)"/>
  <text x="765" y="338" font-size="13" fill="#9d0208">고의 백도어 발견</text>

  <!-- 중단 -->
  <rect x="640" y="360" width="210" height="62" rx="6" fill="#fbeaea" stroke="#9d0208" stroke-width="1.8"/>
  <text x="745" y="386" font-size="14" font-weight="bold" fill="#9d0208" text-anchor="middle">중단 · 이후 T만 사용</text>
  <text x="745" y="408" font-size="13" fill="#555" text-anchor="middle">고의가 드러났으므로</text>

  <path d="M 660 296 L 620 296 L 620 340 L 260 340 L 260 312" fill="none" stroke="#8a8a84" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="440" y="358" font-size="13" fill="#555" text-anchor="middle">문제없으면 제출</text>

  <text x="30" y="450" font-size="13" fill="#333">자원 3가지: U(비신뢰 고성능) · T(신뢰 저성능) · H(정확하지만 전체의 2%만 감사)</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a84"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6a4f"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9d0208"/>
    </marker>
  </defs>
</svg>
