<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">접근통제 모델 4가지 — 무엇으로 판단하고, 누가 권한을 정하는가</text>

  <text x="250" y="64" text-anchor="middle" font-size="13" fill="#495057">판단에 쓰는 값</text>
  <text x="660" y="64" text-anchor="middle" font-size="13" fill="#495057">권한을 정하는 쪽</text>

  <!-- DAC -->
  <rect x="30" y="78" width="120" height="70" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="90" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b1b1b">DAC</text>
  <text x="90" y="130" text-anchor="middle" font-size="13" fill="#1b1b1b">임의적</text>
  <text x="170" y="106" font-size="14" fill="#1b1b1b">주체의 신원(또는 그룹) ↔ 객체의 접근 목록(ACL)</text>
  <text x="170" y="130" font-size="13" fill="#b45309">권한을 가진 주체가 다른 주체에게 넘길 수 있다</text>
  <text x="600" y="118" font-size="14" fill="#1b1b1b">객체 소유자</text>

  <!-- MAC -->
  <rect x="30" y="168" width="120" height="70" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="90" y="198" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b1b1b">MAC</text>
  <text x="90" y="220" text-anchor="middle" font-size="13" fill="#1b1b1b">강제적</text>
  <text x="170" y="196" font-size="14" fill="#1b1b1b">주체의 인가 등급 ↔ 객체의 보안 레이블(등급+범주)</text>
  <text x="170" y="220" font-size="13" fill="#b45309">읽기: 주체 ≥ 객체 · 쓰기: 주체 ≤ 객체</text>
  <text x="600" y="208" font-size="14" fill="#1b1b1b">중앙 권한자 (사용자는 못 바꾼다)</text>

  <!-- RBAC -->
  <rect x="30" y="258" width="120" height="70" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="90" y="288" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b1b1b">RBAC</text>
  <text x="90" y="310" text-anchor="middle" font-size="13" fill="#1b1b1b">역할 기반</text>
  <text x="170" y="286" font-size="14" fill="#1b1b1b">사용자 → 역할 → 권한(연산 + 객체)</text>
  <text x="170" y="310" font-size="13" fill="#b45309">세션에서 활성화한 역할의 권한만 쓴다</text>
  <text x="600" y="298" font-size="14" fill="#1b1b1b">역할과 할당을 관리하는 관리자</text>

  <!-- ABAC -->
  <rect x="30" y="348" width="120" height="70" rx="6" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="90" y="378" text-anchor="middle" font-size="16" font-weight="bold" fill="#2d6a4f">ABAC</text>
  <text x="90" y="400" text-anchor="middle" font-size="13" fill="#1b1b1b">속성 기반</text>
  <text x="170" y="376" font-size="14" fill="#1b1b1b">주체 속성 + 객체 속성 + 환경 조건 → 정책 규칙</text>
  <text x="170" y="400" font-size="13" fill="#b45309">요청이 올 때마다 규칙을 평가해 결정한다</text>
  <text x="600" y="388" font-size="14" fill="#1b1b1b">정책 관리자 (속성은 각 권한 기관)</text>

  <line x1="580" y1="78" x2="580" y2="418" stroke="#ced4da" stroke-width="1"/>

  <text x="30" y="452" font-size="13" fill="#495057">SP 800-162: ACL 은 "신원", RBAC 은 "역할"이라는 속성 하나로 판단하는 ABAC 의 특수한 경우로 볼 수 있다.</text>
</svg>
