<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#fbfbf8"/>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">ISMS-P 인증기준 3영역 101개 — 어디까지가 ISMS이고 어디부터가 ISMS-P인가</text>
  <text x="30" y="56" font-size="13" fill="#555">개인정보보호위원회·과학기술정보통신부, ISMS-P 인증기준 안내서(2023.11) 기준</text>

  <!-- 영역 1 -->
  <rect x="150" y="84" width="520" height="92" rx="6" fill="#eef4f0" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="170" y="110" font-size="15" font-weight="bold" fill="#2d6a4f">1. 관리체계 수립 및 운영 — 4분야 16개</text>
  <text x="170" y="134" font-size="13" fill="#1b1b1b">1.1 관리체계 기반 마련(6) · 1.2 위험 관리(4)</text>
  <text x="170" y="156" font-size="13" fill="#1b1b1b">1.3 관리체계 운영(3) · 1.4 관리체계 점검 및 개선(3)</text>
  <text x="684" y="134" font-size="13" fill="#b45309">반복 순환</text>

  <!-- 순환 화살표 -->
  <path d="M676 150 A 30 30 0 1 1 676 112" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrowAmber)"/>

  <!-- 영역 2 -->
  <rect x="150" y="196" width="520" height="92" rx="6" fill="#eef4f0" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="170" y="222" font-size="15" font-weight="bold" fill="#2d6a4f">2. 보호대책 요구사항 — 12분야 64개</text>
  <text x="170" y="246" font-size="13" fill="#1b1b1b">정책·조직·자산(3) 인적(6) 외부자(4) 물리(7) 인증·권한(6) 접근통제(7)</text>
  <text x="170" y="268" font-size="13" fill="#1b1b1b">암호화(2) 도입·개발(6) 운영관리(7) 보안관리(9) 사고 대응(5) 재해복구(2)</text>

  <!-- 영역 3 -->
  <rect x="150" y="308" width="520" height="92" rx="6" fill="#f3f0f8" stroke="#5b3b8c" stroke-width="1.8"/>
  <text x="170" y="334" font-size="15" font-weight="bold" fill="#5b3b8c">3. 개인정보 처리 단계별 요구사항 — 5분야 21개</text>
  <text x="170" y="358" font-size="13" fill="#1b1b1b">3.1 수집(7) · 3.2 보유·이용(5) · 3.3 제공(4)</text>
  <text x="170" y="380" font-size="13" fill="#1b1b1b">3.4 파기(2) · 3.5 정보주체 권리보호(3)</text>

  <!-- 인증 범위 묶음 -->
  <path d="M130 84 L112 84 L112 288 L130 288" fill="none" stroke="#2d6a4f" stroke-width="2"/>
  <text x="34" y="180" font-size="14" font-weight="bold" fill="#2d6a4f">ISMS</text>
  <text x="34" y="200" font-size="13" fill="#1b1b1b">80개</text>

  <path d="M690 84 L708 84 L708 400 L690 400" fill="none" stroke="#5b3b8c" stroke-width="2"/>
  <text x="722" y="236" font-size="14" font-weight="bold" fill="#5b3b8c">ISMS-P</text>
  <text x="722" y="256" font-size="13" fill="#1b1b1b">101개</text>

  <defs>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 왜 나눴는가 -->
  <rect x="30" y="424" width="820" height="90" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="46" y="448" font-size="14" font-weight="bold" fill="#b45309">1영역은 "어떻게 돌리는가", 2·3영역은 "무엇을 갖추는가"</text>
  <text x="46" y="472" font-size="13" fill="#1b1b1b">1영역은 위험 평가 결과에 따라 2·3영역에서 적용할 통제를 고르게 하는 절차다</text>
  <text x="46" y="494" font-size="13" fill="#1b1b1b">통제 목록만 채우고 1영역이 비면 인증이 나오지 않는다</text>
</svg>
