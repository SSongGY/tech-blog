<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="420" fill="#fbfbf8"/>

  <!-- LEFT: STIX -->
  <text x="24" y="34" font-size="16" font-weight="bold" fill="#1b1b1b">STIX — 무엇을 공유하는가</text>
  <text x="24" y="56" font-size="13" fill="#555">객체가 꼭짓점, 관계가 간선인 그래프</text>

  <rect x="24" y="72" width="380" height="296" rx="8" fill="#ffffff" stroke="#2d6a4f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="40" y="94" font-size="13" font-weight="bold" fill="#2d6a4f">번들 (Bundle)</text>

  <g font-size="13">
    <rect x="44" y="108" width="160" height="56" rx="5" fill="#eef4f0" stroke="#2d6a4f" stroke-width="1.5"/>
    <text x="124" y="130" text-anchor="middle" fill="#1b1b1b">도메인 객체 SDO</text>
    <text x="124" y="150" text-anchor="middle" fill="#555" font-size="13">19종</text>

    <rect x="224" y="108" width="160" height="56" rx="5" fill="#eef4f0" stroke="#2d6a4f" stroke-width="1.5"/>
    <text x="304" y="130" text-anchor="middle" fill="#1b1b1b">관측 객체 SCO</text>
    <text x="304" y="150" text-anchor="middle" fill="#555" font-size="13">파일·IP·도메인</text>

    <rect x="44" y="196" width="160" height="56" rx="5" fill="#fdf1e7" stroke="#b45309" stroke-width="1.5"/>
    <text x="124" y="218" text-anchor="middle" fill="#1b1b1b">관계 객체 SRO</text>
    <text x="124" y="238" text-anchor="middle" fill="#555" font-size="13">관계 · 관측</text>

    <rect x="224" y="196" width="160" height="56" rx="5" fill="#f2f2ee" stroke="#777" stroke-width="1.5"/>
    <text x="304" y="218" text-anchor="middle" fill="#1b1b1b">메타 객체 SMO</text>
    <text x="304" y="238" text-anchor="middle" fill="#555" font-size="13">마킹 · 확장</text>
  </g>

  <g stroke="#b45309" stroke-width="1.5" fill="none">
    <path d="M124 196 L124 170"/>
    <path d="M204 224 L304 224 L304 170"/>
  </g>
  <text x="212" y="190" font-size="13" fill="#b45309">간선</text>

  <rect x="44" y="284" width="340" height="66" rx="5" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  <text x="58" y="306" font-size="13" fill="#1b1b1b">지표 SDO의 필수 속성</text>
  <text x="58" y="328" font-size="13" fill="#555">pattern · pattern_type · valid_from</text>
  <text x="58" y="344" font-size="13" fill="#555">어휘 6가지: stix pcre sigma snort suricata yara</text>

  <!-- divider -->
  <line x1="432" y1="24" x2="432" y2="396" stroke="#ccc" stroke-width="1"/>

  <!-- RIGHT: TAXII -->
  <text x="460" y="34" font-size="16" font-weight="bold" fill="#1b1b1b">TAXII — 어떻게 주고받는가</text>
  <text x="460" y="56" font-size="13" fill="#555">HTTPS 위의 응용계층 프로토콜</text>

  <g font-size="13">
    <rect x="460" y="72" width="396" height="140" rx="8" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
    <text x="476" y="94" font-size="13" font-weight="bold" fill="#2d6a4f">TAXII 서버</text>

    <rect x="476" y="106" width="176" height="44" rx="5" fill="#eef4f0" stroke="#2d6a4f" stroke-width="1.5"/>
    <text x="564" y="133" text-anchor="middle" fill="#1b1b1b">API 루트 A</text>

    <rect x="664" y="106" width="176" height="44" rx="5" fill="#eef4f0" stroke="#2d6a4f" stroke-width="1.5"/>
    <text x="752" y="133" text-anchor="middle" fill="#1b1b1b">API 루트 B</text>

    <rect x="476" y="158" width="176" height="42" rx="5" fill="#f2f2ee" stroke="#777" stroke-width="1.2"/>
    <text x="564" y="184" text-anchor="middle" fill="#555">컬렉션 1 · 컬렉션 2</text>

    <rect x="664" y="158" width="176" height="42" rx="5" fill="#f2f2ee" stroke="#777" stroke-width="1.2"/>
    <text x="752" y="184" text-anchor="middle" fill="#555">컬렉션 3</text>
  </g>

  <!-- request/response -->
  <g font-size="13">
    <rect x="460" y="262" width="176" height="48" rx="5" fill="#eef4f0" stroke="#2d6a4f" stroke-width="1.5"/>
    <text x="548" y="291" text-anchor="middle" fill="#1b1b1b">클라이언트</text>

    <rect x="680" y="262" width="176" height="48" rx="5" fill="#fdf1e7" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="768" y="283" text-anchor="middle" fill="#1b1b1b">채널 (발행–구독)</text>
    <text x="768" y="302" text-anchor="middle" fill="#b45309" font-size="13">2.1 미명세</text>
  </g>

  <g stroke="#2d6a4f" stroke-width="1.6" fill="none">
    <path d="M548 262 L548 216"/>
    <polygon points="548,210 543,222 553,222" fill="#2d6a4f"/>
  </g>
  <text x="560" y="242" font-size="13" fill="#2d6a4f">요청–응답 (컬렉션)</text>

  <text x="460" y="340" font-size="13" fill="#555">GET /taxii2/ · GET /{api-root}/collections/{id}/objects/</text>
  <text x="460" y="362" font-size="13" fill="#555">미디어 타입: application/taxii+json;version=2.1</text>

  <line x1="24" y1="384" x2="856" y2="384" stroke="#ccc" stroke-width="1"/>
  <text x="24" y="408" font-size="13" fill="#555">STIX 번들이 TAXII 컬렉션 안의 객체로 실려 간다. 한쪽을 바꿔도 다른 쪽은 그대로다.</text>
</svg>
