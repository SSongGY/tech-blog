<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="440" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">CDS 유형 3가지 — 무엇이 도메인 경계를 넘는가</text>

  <!-- 1. 접근형 -->
  <text x="150" y="62" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">① 접근형 (Access)</text>
  <rect x="30" y="78" width="240" height="80" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="150" y="108" font-size="14" font-weight="bold" text-anchor="middle" fill="#4338ca">높은 등급 도메인</text>
  <text x="150" y="132" font-size="13" text-anchor="middle" fill="#1f2937">사용자 단말 1대</text>
  <rect x="60" y="200" width="180" height="56" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="150" y="226" font-size="14" font-weight="bold" text-anchor="middle" fill="#b45309">접근 CDS</text>
  <text x="150" y="246" font-size="13" text-anchor="middle" fill="#b45309">화면·입력만 중계</text>
  <rect x="30" y="298" width="240" height="80" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="150" y="328" font-size="14" font-weight="bold" text-anchor="middle" fill="#4b5563">낮은 등급 도메인</text>
  <text x="150" y="352" font-size="13" text-anchor="middle" fill="#1f2937">응용·데이터는 여기 남음</text>
  <line x1="110" y1="158" x2="110" y2="290" stroke="#2d6a4f" stroke-width="2"/>
  <polygon points="104,288 110,298 116,288" fill="#2d6a4f"/>
  <text x="104" y="180" font-size="13" text-anchor="end" fill="#2d6a4f">입력↓</text>
  <line x1="190" y1="298" x2="190" y2="168" stroke="#2d6a4f" stroke-width="2"/>
  <polygon points="184,170 190,160 196,170" fill="#2d6a4f"/>
  <text x="196" y="180" font-size="13" fill="#2d6a4f">↑화면</text>
  <text x="150" y="404" font-size="13" text-anchor="middle" fill="#1f2937">사용자 데이터는 넘지 않는다</text>

  <!-- 2. 전송형 -->
  <text x="440" y="62" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">② 전송형 (Transfer)</text>
  <rect x="320" y="78" width="240" height="80" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="440" y="108" font-size="14" font-weight="bold" text-anchor="middle" fill="#4338ca">도메인 A</text>
  <text x="440" y="132" font-size="13" text-anchor="middle" fill="#1f2937">정보시스템</text>
  <rect x="350" y="200" width="180" height="56" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="226" font-size="14" font-weight="bold" text-anchor="middle" fill="#b45309">가드 (Guard)</text>
  <text x="440" y="246" font-size="13" text-anchor="middle" fill="#b45309">검증·필터링·무해화</text>
  <rect x="320" y="298" width="240" height="80" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="440" y="328" font-size="14" font-weight="bold" text-anchor="middle" fill="#4b5563">도메인 B</text>
  <text x="440" y="352" font-size="13" text-anchor="middle" fill="#1f2937">정보시스템</text>
  <line x1="440" y1="158" x2="440" y2="192" stroke="#2d6a4f" stroke-width="2"/>
  <polygon points="434,190 440,200 446,190" fill="#2d6a4f"/>
  <line x1="440" y1="256" x2="440" y2="290" stroke="#2d6a4f" stroke-width="2"/>
  <polygon points="434,288 440,298 446,288" fill="#2d6a4f"/>
  <line x1="530" y1="228" x2="580" y2="228" stroke="#9d0208" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="560" y="218" font-size="13" text-anchor="middle" fill="#9d0208">차단·보류</text>
  <text x="440" y="404" font-size="13" text-anchor="middle" fill="#1f2937">데이터 자체가 넘는다</text>

  <!-- 3. 다중등급형 -->
  <text x="730" y="62" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">③ 다중등급형 (Multi-level)</text>
  <rect x="610" y="78" width="240" height="300" rx="6" fill="#fafafa" stroke="#4338ca" stroke-width="2"/>
  <text x="730" y="106" font-size="14" font-weight="bold" text-anchor="middle" fill="#4338ca">하나의 신뢰 시스템</text>
  <rect x="640" y="124" width="180" height="34" rx="4" fill="#ffffff" stroke="#9d0208"/>
  <text x="730" y="146" font-size="13" text-anchor="middle" fill="#1f2937">레이블 C 객체</text>
  <rect x="640" y="168" width="180" height="34" rx="4" fill="#ffffff" stroke="#b45309"/>
  <text x="730" y="190" font-size="13" text-anchor="middle" fill="#1f2937">레이블 S 객체</text>
  <rect x="640" y="212" width="180" height="34" rx="4" fill="#ffffff" stroke="#2d6a4f"/>
  <text x="730" y="234" font-size="13" text-anchor="middle" fill="#1f2937">레이블 O 객체</text>
  <text x="730" y="280" font-size="13" text-anchor="middle" fill="#1f2937">강제적 접근통제</text>
  <text x="730" y="302" font-size="13" text-anchor="middle" fill="#1f2937">주체의 도메인·인가 속성</text>
  <text x="730" y="324" font-size="13" text-anchor="middle" fill="#1f2937">↔ 객체의 레이블 비교</text>
  <text x="730" y="404" font-size="13" text-anchor="middle" fill="#1f2937">한곳에 저장, 접근을 가른다</text>

  <rect x="30" y="422" width="820" height="36" rx="6" fill="#fafafa" stroke="#9ca3af"/>
  <text x="440" y="445" font-size="13" text-anchor="middle" fill="#1f2937">공통: 서로 다른 보안 도메인 사이에서 정책에 맞는 정보만 접근·전송되도록 하는 통제된 인터페이스</text>
</svg>
