<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="420" fill="#f7f7f4"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6a4f"/>
    </marker>
  </defs>

  <text x="24" y="32" font-size="17" font-weight="bold" fill="#1b1b1b">슬롭스쿼팅 공격 절차 4단계와 끊는 지점</text>

  <text x="24" y="62" font-size="13" font-weight="bold" fill="#9d0208">공격 절차</text>

  <!-- 공격자 쪽 -->
  <rect x="24" y="74" width="190" height="104" rx="6" fill="#ffffff" stroke="#9d0208" stroke-width="1.5"/>
  <text x="119" y="100" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">① 수집</text>
  <text x="119" y="126" font-size="13" fill="#444444" text-anchor="middle">같은 LLM에 반복 질의</text>
  <text x="119" y="148" font-size="13" fill="#444444" text-anchor="middle">반복되는 환각 이름 선별</text>
  <text x="119" y="168" font-size="13" fill="#9d0208" text-anchor="middle">공격자</text>
  <line x1="214" y1="126" x2="236" y2="126" stroke="#444444" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="240" y="74" width="190" height="104" rx="6" fill="#ffffff" stroke="#9d0208" stroke-width="1.5"/>
  <text x="335" y="100" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">② 선점 등록</text>
  <text x="335" y="126" font-size="13" fill="#444444" text-anchor="middle">그 이름으로 악성 패키지를</text>
  <text x="335" y="148" font-size="13" fill="#444444" text-anchor="middle">PyPI·npm에 업로드</text>
  <text x="335" y="168" font-size="13" fill="#9d0208" text-anchor="middle">공격자</text>
  <line x1="430" y1="126" x2="452" y2="126" stroke="#444444" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 피해자 쪽 -->
  <rect x="456" y="74" width="190" height="104" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="551" y="100" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">③ 추천</text>
  <text x="551" y="126" font-size="13" fill="#444444" text-anchor="middle">개발자가 코드를 요청</text>
  <text x="551" y="148" font-size="13" fill="#444444" text-anchor="middle">모델이 같은 이름을 추천</text>
  <text x="551" y="168" font-size="13" fill="#b45309" text-anchor="middle">LLM · 개발자</text>
  <line x1="646" y1="126" x2="668" y2="126" stroke="#444444" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="672" y="74" width="184" height="104" rx="6" fill="#ffffff" stroke="#9d0208" stroke-width="1.5"/>
  <text x="764" y="100" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">④ 설치·전파</text>
  <text x="764" y="126" font-size="13" fill="#444444" text-anchor="middle">확인 없이 설치</text>
  <text x="764" y="148" font-size="13" fill="#444444" text-anchor="middle">의존성 사슬로 확산</text>
  <text x="764" y="168" font-size="13" fill="#9d0208" text-anchor="middle">개발 PC · 빌드 서버</text>

  <text x="24" y="238" font-size="13" font-weight="bold" fill="#2d6a4f">끊는 지점</text>

  <!-- 대응 -->
  <rect x="404" y="252" width="212" height="128" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="510" y="278" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">모델 단계 완화</text>
  <text x="510" y="304" font-size="13" fill="#444444" text-anchor="middle">RAG · 자기 정제 · 미세조정</text>
  <text x="510" y="326" font-size="13" fill="#444444" text-anchor="middle">온도 낮추기</text>
  <text x="510" y="352" font-size="13" fill="#b45309" text-anchor="middle">줄일 뿐 없애지 못함</text>
  <line x1="530" y1="252" x2="540" y2="184" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arg)"/>

  <rect x="636" y="252" width="220" height="128" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="746" y="278" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">설치 단계 통제</text>
  <text x="746" y="304" font-size="13" fill="#444444" text-anchor="middle">등록일·유지 이력 확인</text>
  <text x="746" y="326" font-size="13" fill="#444444" text-anchor="middle">내부 저장소 · 허용 목록</text>
  <text x="746" y="348" font-size="13" fill="#444444" text-anchor="middle">버전·해시 고정, 설치 승인</text>
  <text x="746" y="370" font-size="13" fill="#2d6a4f" text-anchor="middle">MITRE M1013 · M1033</text>
  <line x1="746" y1="252" x2="756" y2="184" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arg)"/>

  <text x="24" y="276" font-size="13" fill="#444444">실재 목록 대조만으로는</text>
  <text x="24" y="298" font-size="13" fill="#444444">②를 거친 이름을 걸러내지 못한다</text>
  <text x="24" y="320" font-size="13" fill="#9d0208">(Spracklen 외 6.1절)</text>
</svg>
