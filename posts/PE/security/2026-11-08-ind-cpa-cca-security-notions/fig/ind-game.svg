<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="500" fill="#ffffff"/>
  <defs>
    <marker id="k" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#1b1b1b" stroke-width="1.6"/>
    </marker>
    <marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#b45309" stroke-width="1.6"/>
    </marker>
  </defs>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">IND 게임 — 두 평문 중 어느 쪽의 암호문인지 맞히는가</text>

  <!-- 열 머리 -->
  <rect x="40" y="50" width="220" height="40" fill="#f5f7fa" stroke="#4a5568" stroke-width="1.4" rx="4"/>
  <text x="150" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">도전자 (키 보유)</text>
  <rect x="620" y="50" width="220" height="40" fill="#f5f7fa" stroke="#4a5568" stroke-width="1.4" rx="4"/>
  <text x="730" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">공격자 A = (A₁, A₂)</text>
  <line x1="150" y1="90" x2="150" y2="380" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="730" y1="90" x2="730" y2="380" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 1 키 생성 -->
  <text x="160" y="118" font-size="13" fill="#1b1b1b">① (pk, sk) ← 키 생성</text>
  <line x1="150" y1="132" x2="726" y2="132" stroke="#1b1b1b" stroke-width="1.4" marker-end="url(#k)"/>
  <text x="440" y="126" text-anchor="middle" font-size="13" fill="#1b1b1b">pk</text>

  <!-- 2 1단계 오라클 -->
  <rect x="540" y="146" width="180" height="44" fill="#fff7ed" stroke="#b45309" stroke-width="1.4" rx="4"/>
  <text x="630" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">② A₁ 단계: 복호 질의</text>
  <text x="630" y="182" text-anchor="middle" font-size="13" fill="#1b1b1b">CCA1 · CCA2 만</text>
  <line x1="540" y1="168" x2="154" y2="168" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#o)"/>

  <!-- 3 두 평문 -->
  <line x1="730" y1="218" x2="154" y2="218" stroke="#1b1b1b" stroke-width="1.4" marker-end="url(#k)"/>
  <text x="440" y="211" text-anchor="middle" font-size="13" fill="#1b1b1b">③ m₀, m₁ (길이가 같아야 함)</text>

  <!-- 4 도전 암호문 -->
  <text x="160" y="246" font-size="13" fill="#1b1b1b">④ b ← {0, 1} 무작위</text>
  <line x1="150" y1="266" x2="726" y2="266" stroke="#1b1b1b" stroke-width="1.4" marker-end="url(#k)"/>
  <text x="440" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b1b1b">y = E(pk, m_b)  — 도전 암호문</text>

  <!-- 5 2단계 오라클 -->
  <rect x="540" y="280" width="180" height="44" fill="#fff7ed" stroke="#b45309" stroke-width="1.4" rx="4"/>
  <text x="630" y="299" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">⑤ A₂ 단계: 복호 질의</text>
  <text x="630" y="316" text-anchor="middle" font-size="13" fill="#1b1b1b">CCA2 만 · y 자체는 금지</text>
  <line x1="540" y1="302" x2="154" y2="302" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#o)"/>

  <!-- 6 추측 -->
  <line x1="730" y1="352" x2="154" y2="352" stroke="#1b1b1b" stroke-width="1.4" marker-end="url(#k)"/>
  <text x="440" y="345" text-anchor="middle" font-size="13" fill="#1b1b1b">⑥ 추측 b′</text>

  <!-- 판정 -->
  <rect x="40" y="395" width="800" height="90" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.4" rx="4"/>
  <text x="440" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">판정: 이점 Adv = Pr[b′=1 | b=1] − Pr[b′=1 | b=0]</text>
  <text x="440" y="446" text-anchor="middle" font-size="13" fill="#1b1b1b">다항 시간 공격자 누구에게나 이점이 무시할 만큼 작으면 IND-공격 안전</text>
  <text x="440" y="470" text-anchor="middle" font-size="13" fill="#4a5568">CPA: ② ✕ ⑤ ✕  ·  CCA1: ② ○ ⑤ ✕  ·  CCA2: ② ○ ⑤ ○   (CPA 는 pk 만으로 이미 성립)</text>
</svg>
