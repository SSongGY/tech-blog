<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="460" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f"/>
    </marker>
  </defs>
  <text x="440" y="32" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">워크로드 신원 — 비밀 없이 받고, 짧게 쓰고, 자동으로 바꾼다</text>

  <!-- 신뢰 도메인 테두리 -->
  <rect x="20" y="52" width="840" height="340" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="36" y="76" font-size="13" fill="#4b5563">신뢰 도메인 (trust domain) — 예: spiffe://example.org</text>

  <!-- 발급 기관 -->
  <rect x="330" y="92" width="220" height="64" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="440" y="118" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">발급 기관 (CA)</text>
  <text x="440" y="140" font-size="13" text-anchor="middle" fill="#4b5563">SVID 서명 · 신뢰 번들 배포</text>

  <!-- 워크로드 API -->
  <rect x="330" y="214" width="220" height="64" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="440" y="240" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">워크로드 API</text>
  <text x="440" y="262" font-size="13" text-anchor="middle" fill="#4b5563">호출자를 대역 외로 확인</text>

  <!-- 워크로드 A -->
  <rect x="36" y="214" width="170" height="64" rx="8" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="121" y="240" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">워크로드 A</text>
  <text x="121" y="262" font-size="13" text-anchor="middle" fill="#4b5563">미리 가진 비밀 없음</text>

  <!-- 워크로드 B -->
  <rect x="636" y="214" width="200" height="64" rx="8" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="736" y="240" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">워크로드 B</text>
  <text x="736" y="262" font-size="13" text-anchor="middle" fill="#4b5563">번들로 서명 검증</text>

  <!-- 증명 -->
  <rect x="330" y="316" width="220" height="56" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="440" y="340" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">증명 (attestation)</text>
  <text x="440" y="360" font-size="13" text-anchor="middle" fill="#4b5563">플랫폼이 호출자 정체를 보증</text>

  <!-- 화살표 -->
  <g stroke="#374151" stroke-width="1.8" fill="none">
    <line x1="206" y1="236" x2="328" y2="236" marker-end="url(#arr)"/>
    <line x1="328" y1="258" x2="208" y2="258" marker-end="url(#arr)"/>
    <line x1="440" y1="278" x2="440" y2="314" marker-end="url(#arr)"/>
    <line x1="440" y1="158" x2="440" y2="212" marker-end="url(#arr)"/>
    <path d="M550,124 H736 V212" marker-end="url(#arr)"/>
  </g>
  <path d="M121,280 V410 H736 V280" fill="none" stroke="#2d6a4f" stroke-width="2.2" marker-start="url(#arrg)" marker-end="url(#arrg)"/>

  <!-- 번호 라벨 -->
  <g font-size="13" fill="#111827">
    <text x="214" y="228">① 요청</text>
    <text x="214" y="276">③ SVID·키·번들</text>
    <text x="450" y="302">② 확인</text>
    <text x="450" y="190">서명</text>
    <text x="566" y="116">신뢰 번들</text>
  </g>
  <text x="440" y="432" font-size="14" font-weight="bold" text-anchor="middle" fill="#2d6a4f">④ 상호 TLS — 서로의 SVID를 제시하고 개인 키 소유를 증명</text>
  <text x="440" y="452" font-size="13" text-anchor="middle" fill="#4b5563">⑤ 만료 전 새 SVID가 같은 연결(스트림)로 자동 전달된다</text>
</svg>
