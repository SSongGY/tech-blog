<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="640" fill="#ffffff"/>
  <text x="440" y="28" font-size="17" text-anchor="middle" font-weight="bold" fill="#222">MCP 인가 7단계 — 찾고, 묶고, 확인한다</text>

  <!-- actors -->
  <rect x="70" y="48" width="170" height="44" fill="#f1f5f9" stroke="#475569"/>
  <text x="155" y="68" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">MCP 클라이언트</text>
  <text x="155" y="85" font-size="13" text-anchor="middle" fill="#475569">OAuth 클라이언트</text>
  <rect x="355" y="48" width="170" height="44" fill="#f1f5f9" stroke="#475569"/>
  <text x="440" y="68" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">MCP 서버</text>
  <text x="440" y="85" font-size="13" text-anchor="middle" fill="#475569">자원 서버</text>
  <rect x="640" y="48" width="170" height="44" fill="#f1f5f9" stroke="#475569"/>
  <text x="725" y="68" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">인가 서버</text>
  <text x="725" y="85" font-size="13" text-anchor="middle" fill="#475569">토큰 발급</text>

  <!-- lifelines -->
  <line x1="155" y1="92" x2="155" y2="560" stroke="#94a3b8" stroke-dasharray="5,4"/>
  <!-- ③~⑥ 은 MCP 서버를 거치지 않으므로 그 구간의 생명선을 끊는다 -->
  <line x1="440" y1="92" x2="440" y2="230" stroke="#94a3b8" stroke-dasharray="5,4"/>
  <line x1="440" y1="492" x2="440" y2="560" stroke="#94a3b8" stroke-dasharray="5,4"/>
  <line x1="725" y1="92" x2="725" y2="560" stroke="#94a3b8" stroke-dasharray="5,4"/>

  <g font-size="13" fill="#222">
    <!-- 1 -->
    <line x1="155" y1="125" x2="430" y2="125" stroke="#475569" stroke-width="2"/>
    <polygon points="430,119 440,125 430,131" fill="#475569"/>
    <text x="170" y="118">① 토큰 없이 요청</text>
    <line x1="440" y1="155" x2="165" y2="155" stroke="#475569" stroke-width="2"/>
    <polygon points="165,149 155,155 165,161" fill="#475569"/>
    <text x="170" y="148">401 + resource_metadata</text>

    <!-- 2 -->
    <line x1="155" y1="200" x2="430" y2="200" stroke="#475569" stroke-width="2"/>
    <polygon points="430,194 440,200 430,206" fill="#475569"/>
    <text x="170" y="193">② 보호 자원 메타데이터 조회</text>
    <text x="170" y="222" fill="#475569">응답의 resource 일치 확인</text>

    <!-- 3 -->
    <line x1="155" y1="262" x2="715" y2="262" stroke="#475569" stroke-width="2"/>
    <polygon points="715,256 725,262 715,268" fill="#475569"/>
    <text x="170" y="255">③ 인가 서버 메타데이터 조회 — issuer 값을 기록해 둔다</text>

    <!-- 4 -->
    <line x1="155" y1="310" x2="715" y2="310" stroke="#475569" stroke-width="2"/>
    <polygon points="715,304 725,310 715,316" fill="#475569"/>
    <text x="170" y="303">④ 클라이언트 등록 — 메타데이터 문서 · 사전 등록 · 동적 등록</text>

    <!-- 5 -->
    <line x1="155" y1="358" x2="715" y2="358" stroke="#2d6a4f" stroke-width="2"/>
    <polygon points="715,352 725,358 715,364" fill="#2d6a4f"/>
    <text x="170" y="351">⑤ 인가 요청 — code_challenge(S256) + resource</text>
    <line x1="725" y1="388" x2="165" y2="388" stroke="#2d6a4f" stroke-width="2"/>
    <polygon points="165,382 155,388 165,394" fill="#2d6a4f"/>
    <text x="170" y="381">인가 코드 + iss</text>

    <!-- 6 -->
    <line x1="155" y1="438" x2="715" y2="438" stroke="#2d6a4f" stroke-width="2"/>
    <polygon points="715,432 725,438 715,444" fill="#2d6a4f"/>
    <text x="170" y="431">⑥ 토큰 요청 — code_verifier + resource</text>
    <line x1="725" y1="468" x2="165" y2="468" stroke="#2d6a4f" stroke-width="2"/>
    <polygon points="165,462 155,468 165,474" fill="#2d6a4f"/>
    <text x="170" y="461">MCP 서버를 대상으로 묶인 액세스 토큰</text>

    <!-- 7 -->
    <line x1="155" y1="518" x2="430" y2="518" stroke="#2d6a4f" stroke-width="2"/>
    <polygon points="430,512 440,518 430,524" fill="#2d6a4f"/>
    <text x="170" y="511">⑦ Authorization: Bearer</text>
  </g>

  <!-- checks -->
  <rect x="455" y="496" width="250" height="48" fill="#ecfdf5" stroke="#2d6a4f"/>
  <text x="470" y="516" font-size="13" fill="#222">대상 검증 — 내 앞 토큰만 받는다</text>
  <text x="470" y="535" font-size="13" fill="#222">받은 토큰을 하위 API로 넘기지 않는다</text>

  <rect x="6" y="404" width="144" height="26" fill="#fff7ed" stroke="#b45309"/>
  <text x="78" y="422" font-size="13" text-anchor="middle" fill="#222">iss = 기록한 issuer?</text>

  <rect x="40" y="580" width="800" height="44" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="600" font-size="13" fill="#222">찾는다 ①~③ (RFC 9728 · RFC 8414)   묶는다 ⑤⑥ (RFC 8707 resource · PKCE)</text>
  <text x="60" y="617" font-size="13" fill="#222">확인한다 — 클라이언트는 iss (RFC 9207), 서버는 토큰 대상</text>
</svg>
