<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- 열 제목 -->
  <text x="150" y="32" font-size="16" font-weight="bold" text-anchor="middle" fill="#222222">Encrypt-and-MAC</text>
  <text x="150" y="52" font-size="13" text-anchor="middle" fill="#555555">SSH (RFC 4253)</text>
  <text x="440" y="32" font-size="16" font-weight="bold" text-anchor="middle" fill="#222222">MAC-then-Encrypt</text>
  <text x="440" y="52" font-size="13" text-anchor="middle" fill="#555555">TLS 1.2 이하 CBC·스트림</text>
  <text x="730" y="32" font-size="16" font-weight="bold" text-anchor="middle" fill="#222222">Encrypt-then-MAC</text>
  <text x="730" y="52" font-size="13" text-anchor="middle" fill="#555555">IPsec ESP · RFC 7366</text>

  <line x1="295" y1="20" x2="295" y2="300" stroke="#cccccc" stroke-dasharray="6 5"/>
  <line x1="585" y1="20" x2="585" y2="300" stroke="#cccccc" stroke-dasharray="6 5"/>

  <!-- 송신: 무엇에 태그를 붙이는가 -->
  <text x="20" y="84" font-size="13" fill="#555555">송신</text>
  <rect x="40" y="96" width="220" height="56" rx="6" fill="#f1f3f5" stroke="#555555"/>
  <text x="150" y="119" font-size="14" text-anchor="middle" fill="#222222">C = Enc(P)</text>
  <text x="150" y="141" font-size="14" text-anchor="middle" fill="#222222">T = MAC(P) — 평문에 태그</text>

  <rect x="330" y="96" width="220" height="56" rx="6" fill="#f1f3f5" stroke="#555555"/>
  <text x="440" y="119" font-size="14" text-anchor="middle" fill="#222222">T = MAC(P)</text>
  <text x="440" y="141" font-size="14" text-anchor="middle" fill="#222222">C = Enc(P ‖ T ‖ 패딩)</text>

  <rect x="620" y="96" width="220" height="56" rx="6" fill="#f1f3f5" stroke="#555555"/>
  <text x="730" y="119" font-size="14" text-anchor="middle" fill="#222222">C = Enc(P)</text>
  <text x="730" y="141" font-size="14" text-anchor="middle" fill="#222222">T = MAC(C) — 암호문에 태그</text>

  <!-- 수신: 무엇을 먼저 하는가 -->
  <text x="20" y="184" font-size="13" fill="#555555">수신</text>
  <line x1="150" y1="154" x2="150" y2="192" stroke="#333333" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="440" y1="154" x2="440" y2="192" stroke="#333333" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="730" y1="154" x2="730" y2="192" stroke="#333333" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="40" y="196" width="220" height="72" rx="6" fill="#fff7ed" stroke="#b45309"/>
  <text x="150" y="222" font-size="14" text-anchor="middle" fill="#b45309">복호화한 뒤 평문의 태그 검사</text>
  <text x="150" y="246" font-size="13.5" text-anchor="middle" fill="#b45309">태그가 암호문을 덮지 않는다</text>

  <rect x="330" y="196" width="220" height="72" rx="6" fill="#fdecec" stroke="#9d0208" stroke-width="1.6"/>
  <text x="440" y="222" font-size="14" text-anchor="middle" fill="#9d0208">복호화 → 패딩 검사 → 태그 검사</text>
  <text x="440" y="246" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#9d0208">오류·시간 차 = 패딩 오라클</text>

  <rect x="620" y="196" width="220" height="72" rx="6" fill="#e8f5ee" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="730" y="222" font-size="14" text-anchor="middle" fill="#2d6a4f">태그 검사 먼저, 틀리면 폐기</text>
  <text x="730" y="246" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#2d6a4f">변조 암호문은 복호화 안 함</text>

  <!-- AEAD -->
  <line x1="440" y1="300" x2="440" y2="330" stroke="#333333" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="456" y="320" font-size="13" fill="#555555">두 기본 요소를 사람이 엮지 않고 한 알고리즘으로</text>

  <rect x="90" y="336" width="700" height="120" rx="8" fill="#e8f5ee" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="440" y="362" font-size="16" font-weight="bold" text-anchor="middle" fill="#2d6a4f">AEAD (RFC 5116) — 예: AES-GCM, ChaCha20-Poly1305</text>
  <text x="440" y="390" font-size="14" text-anchor="middle" fill="#222222">암호화: (K, N, P, A) → C   ·   C 안에 태그가 들어 있다</text>
  <text x="440" y="414" font-size="14" text-anchor="middle" fill="#222222">복호화: (K, N, A, C) → P 또는 FAIL   ·   실패 이유를 구분하지 않는다</text>
  <text x="440" y="438" font-size="14" text-anchor="middle" fill="#b45309">조건: 같은 키에서 논스 N은 한 번만 (재사용 시 GCM은 인증이 무너진다)</text>

  <text x="440" y="484" font-size="13" text-anchor="middle" fill="#555555">P: 평문, C: 암호문, T: 인증 태그, K: 키, N: 논스, A: 연관 데이터(암호화하지 않고 무결성만 보호)</text>
</svg>
