<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="460" fill="#fbfbf8"/>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">소프트웨어 공급망 4단계와 SBOM · 출처 증명 · VEX 의 자리</text>
  <text x="30" y="56" font-size="13" fill="#555">단계와 위협 기호 A~I 는 SLSA v1.2 위협 개요를 따른다 · SBOM 은 목록, 출처 증명은 과정, VEX 는 영향 여부를 기록한다</text>

  <!-- 의존성 -->
  <rect x="230" y="74" width="215" height="46" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="337" y="94" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b1b1b">의존성</text>
  <text x="337" y="112" font-size="13" text-anchor="middle" fill="#555">A~H 위협이 재귀로 적용</text>
  <line x1="337" y1="120" x2="337" y2="142" stroke="#3b3b3b" stroke-width="1.5"/>
  <polygon points="332,142 337,150 342,142" fill="#3b3b3b"/>

  <!-- 4단계 -->
  <rect x="30" y="150" width="190" height="86" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="125" y="174" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b1b1b">① 생산자 · 작성</text>
  <text x="125" y="196" font-size="13" text-anchor="middle" fill="#1b1b1b">A 생산자</text>
  <text x="125" y="216" font-size="13" text-anchor="middle" fill="#1b1b1b">B 작성 · 리뷰</text>
  <line x1="220" y1="193" x2="222" y2="193" stroke="#3b3b3b" stroke-width="1.5"/>
  <polygon points="222,188 230,193 222,198" fill="#3b3b3b"/>

  <rect x="230" y="150" width="215" height="86" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="337" y="174" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b1b1b">② 소스 · 빌드</text>
  <text x="337" y="196" font-size="13" text-anchor="middle" fill="#1b1b1b">C 소스 관리 · D 빌드 인자</text>
  <text x="337" y="216" font-size="13" text-anchor="middle" fill="#9d0208">E 빌드 과정</text>
  <line x1="445" y1="193" x2="447" y2="193" stroke="#3b3b3b" stroke-width="1.5"/>
  <polygon points="447,188 455,193 447,198" fill="#3b3b3b"/>

  <rect x="455" y="150" width="215" height="86" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="562" y="174" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b1b1b">③ 배포</text>
  <text x="562" y="196" font-size="13" text-anchor="middle" fill="#1b1b1b">F 산출물 게시</text>
  <text x="562" y="216" font-size="13" text-anchor="middle" fill="#1b1b1b">G 배포 채널</text>
  <line x1="670" y1="193" x2="672" y2="193" stroke="#3b3b3b" stroke-width="1.5"/>
  <polygon points="672,188 680,193 672,198" fill="#3b3b3b"/>

  <rect x="680" y="150" width="180" height="86" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="770" y="174" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b1b1b">④ 선택 · 사용</text>
  <text x="770" y="196" font-size="13" text-anchor="middle" fill="#1b1b1b">H 패키지 선택</text>
  <text x="770" y="216" font-size="13" text-anchor="middle" fill="#1b1b1b">I 사용</text>

  <!-- 산출물 -->
  <line x1="337" y1="236" x2="337" y2="268" stroke="#2d6a4f" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="230" y="268" width="215" height="80" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="337" y="292" font-size="13" font-weight="bold" text-anchor="middle" fill="#2d6a4f">SBOM</text>
  <text x="337" y="314" font-size="13" text-anchor="middle" fill="#1b1b1b">무엇이 들어 있나</text>
  <text x="337" y="334" font-size="13" text-anchor="middle" fill="#555">빌드 시점 생성 권장</text>

  <line x1="490" y1="236" x2="490" y2="268" stroke="#2d6a4f" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="455" y="268" width="215" height="80" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="562" y="292" font-size="13" font-weight="bold" text-anchor="middle" fill="#2d6a4f">출처 증명 (SLSA)</text>
  <text x="562" y="314" font-size="13" text-anchor="middle" fill="#1b1b1b">어떻게 만들어졌나</text>
  <text x="562" y="334" font-size="13" text-anchor="middle" fill="#555">빌드 출력의 생성 과정</text>

  <line x1="770" y1="236" x2="770" y2="268" stroke="#2d6a4f" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="680" y="268" width="180" height="80" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="770" y="292" font-size="13" font-weight="bold" text-anchor="middle" fill="#2d6a4f">VEX</text>
  <text x="770" y="314" font-size="13" text-anchor="middle" fill="#1b1b1b">그 취약점이 해당되나</text>
  <text x="770" y="334" font-size="13" text-anchor="middle" fill="#555">상태 4가지</text>

  <!-- 한계 -->
  <rect x="30" y="372" width="830" height="70" rx="6" fill="#fdecec" stroke="#9d0208" stroke-width="1.5"/>
  <text x="46" y="398" font-size="13" font-weight="bold" fill="#9d0208">SBOM 만으로 못 막는 것</text>
  <text x="46" y="422" font-size="13" fill="#1b1b1b">E 빌드 과정 변조 · A 정상으로 위장한 생산자 · 정상 이름·버전으로 들어온 악성 의존성 · 새로 공개된 취약점 · SBOM 문서의 위변조</text>
</svg>
