<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#f7f7f4"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="17" font-weight="bold" fill="#1b1b1b">CI/CD 파이프라인에 넣는 공급망 보안 통제 — CI 4 · CD 2</text>

  <!-- CI 줄 -->
  <text x="24" y="56" font-size="13" font-weight="bold" fill="#2d6a4f">CI 파이프라인 — 워크플로 4가지</text>

  <rect x="24" y="64" width="194" height="150" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="121" y="88" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">① 코드 커밋</text>
  <text x="36" y="116" font-size="13" fill="#444444">· SAST·DAST 실행</text>
  <text x="36" y="139" font-size="13" fill="#444444">· 커버리지 보고 공유</text>
  <text x="36" y="162" font-size="13" fill="#444444">· SCA로 의존성 열거</text>
  <text x="36" y="185" font-size="13" fill="#444444">· 전이 의존성까지</text>
  <line x1="218" y1="139" x2="236" y2="139" stroke="#444444" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="240" y="64" width="194" height="150" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="337" y="88" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">② 저장소 PULL·PUSH</text>
  <text x="252" y="116" font-size="13" fill="#444444">· 역할에 맞는 인증</text>
  <text x="252" y="139" font-size="13" fill="#444444">· 자기 병합 승인 금지</text>
  <text x="252" y="162" font-size="13" fill="#444444">· 저장소 코드 무결성</text>
  <line x1="434" y1="139" x2="452" y2="139" stroke="#444444" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="456" y="64" width="194" height="150" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="553" y="88" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">③ 빌드</text>
  <text x="468" y="116" font-size="13" fill="#444444">· 격리·강화된 빌드 환경</text>
  <text x="468" y="139" font-size="13" fill="#444444">· 빌드 정책 정의·강제</text>
  <text x="468" y="162" font-size="13" fill="#444444">· 증거를 빌드와 동시 생성</text>
  <text x="468" y="185" font-size="13" fill="#444444">· 증명 4종에 서명</text>
  <line x1="650" y1="139" x2="668" y2="139" stroke="#444444" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="672" y="64" width="186" height="150" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="765" y="88" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">④ 업데이트·서명</text>
  <text x="684" y="116" font-size="13" fill="#444444">· 서명 전 정책 충족</text>
  <text x="684" y="139" font-size="13" fill="#444444">· 다중 키·임계 서명</text>
  <text x="684" y="162" font-size="13" fill="#444444">· 온라인 키 역할 제한</text>
  <text x="684" y="185" font-size="13" fill="#444444">· 온라인 키는 HSM</text>

  <!-- CI → CD -->
  <path d="M 765 214 L 765 236 L 121 236 L 121 270" fill="none" stroke="#444444" stroke-width="2" marker-end="url(#ar)"/>
  <text x="300" y="230" font-size="13" fill="#555555">서명된 산출물과 증명이 넘어간다</text>

  <!-- CD 줄 -->
  <text x="858" y="264" font-size="13" font-weight="bold" fill="#35618f" text-anchor="end">CD 파이프라인 — 배포 요건 5 · GitOps 요건 4</text>

  <rect x="24" y="274" width="270" height="150" rx="6" fill="#ffffff" stroke="#35618f" stroke-width="1.5"/>
  <text x="159" y="298" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">⑤ 배포 검증 (DEPLOY-REQ)</text>
  <text x="36" y="324" font-size="13" fill="#444444">1 저장소 비밀 정보 탐지</text>
  <text x="36" y="344" font-size="13" fill="#444444">2 병합 전 의존성 검토</text>
  <text x="36" y="364" font-size="13" fill="#444444">3 보안 빌드가 만든 산출물만</text>
  <text x="36" y="384" font-size="13" fill="#444444">4 이미지 스캔 결과 증명</text>
  <text x="36" y="404" font-size="13" fill="#444444">5 레지스트리 전 스캔·스크립트 점검</text>
  <line x1="294" y1="349" x2="312" y2="349" stroke="#444444" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="316" y="274" width="250" height="150" rx="6" fill="#ffffff" stroke="#35618f" stroke-width="1.5"/>
  <text x="441" y="298" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">⑥ GitOps (GitOps-REQ)</text>
  <text x="328" y="324" font-size="13" fill="#444444">1 수동 대신 자동화</text>
  <text x="328" y="344" font-size="13" fill="#444444">2 릴리스 정보 전부 보존</text>
  <text x="328" y="364" font-size="13" fill="#444444">3 런타임 수동 변경 금지</text>
  <text x="328" y="384" font-size="13" fill="#444444">4 드리프트 감시·재동기화</text>

  <!-- 증명과 정책 -->
  <rect x="592" y="274" width="266" height="150" rx="6" fill="#f8efe0" stroke="#b45309" stroke-width="1.5"/>
  <text x="725" y="298" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">증명 → 정책 평가</text>
  <text x="604" y="324" font-size="13" fill="#444444">증명 4종: 환경·과정·재료·산출물</text>
  <text x="604" y="348" font-size="13" fill="#444444">보안 키로 서명, 변조 불가 저장</text>
  <text x="604" y="372" font-size="13" fill="#444444">정책 = 서명된 검증 조건 문서</text>
  <text x="604" y="396" font-size="13" fill="#9d0208">충족 못 하면 배포 차단</text>
  <line x1="592" y1="349" x2="570" y2="349" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4"/>

  <text x="24" y="452" font-size="13" fill="#555555">보안 목표 2가지: 파이프라인과 빌드 과정을 적극 방어하고, 상류 원천과 산출물의 무결성을 보장한다.</text>
</svg>
