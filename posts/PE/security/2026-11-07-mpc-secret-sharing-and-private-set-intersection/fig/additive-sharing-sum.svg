<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#fbfbf8"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#555"/></marker>
  </defs>

  <text x="24" y="30" font-size="16" font-weight="bold" fill="#1b1b1b">가산 비밀 분산 — 각 서버는 자기 열(조각)만 보고 더한다 (모듈러 1000)</text>

  <!-- 머리글 -->
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#1b1b1b">
    <text x="124" y="66">입력 (병원의 비밀 값)</text>
    <text x="315" y="66">서버 1</text>
    <text x="465" y="66">서버 2</text>
    <text x="615" y="66">서버 3</text>
    <text x="778" y="66" text-anchor="middle">조각 합 = 원래 값</text>
  </g>

  <!-- 서버 열 배경 -->
  <rect x="250" y="76" width="130" height="200" rx="5" fill="#eef4f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <rect x="400" y="76" width="130" height="200" rx="5" fill="#eef4f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <rect x="550" y="76" width="130" height="200" rx="5" fill="#eef4f0" stroke="#2d6a4f" stroke-width="1.5"/>

  <g font-size="14" text-anchor="middle" fill="#1b1b1b">
    <rect x="24" y="86" width="200" height="40" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
    <text x="124" y="111">병원 A = 120</text>
    <text x="315" y="111">512</text><text x="465" y="111">803</text><text x="615" y="111">805</text>
    <text x="778" y="111" fill="#555">2120 → 120</text>

    <rect x="24" y="136" width="200" height="40" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
    <text x="124" y="161">병원 B = 75</text>
    <text x="315" y="161">240</text><text x="465" y="161">116</text><text x="615" y="161">719</text>
    <text x="778" y="161" fill="#555">1075 → 75</text>

    <rect x="24" y="186" width="200" height="40" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
    <text x="124" y="211">병원 C = 40</text>
    <text x="315" y="211">901</text><text x="465" y="211">77</text><text x="615" y="211">62</text>
    <text x="778" y="211" fill="#555">1040 → 40</text>

    <line x1="258" y1="234" x2="672" y2="234" stroke="#2d6a4f" stroke-width="1"/>
    <text x="124" y="261" font-size="13" fill="#2d6a4f">서버가 혼자 더한 값</text>
    <text x="315" y="261" font-weight="bold" fill="#2d6a4f">653</text>
    <text x="465" y="261" font-weight="bold" fill="#2d6a4f">996</text>
    <text x="615" y="261" font-weight="bold" fill="#2d6a4f">586</text>
  </g>

  <!-- 결과 -->
  <line x1="465" y1="280" x2="465" y2="318" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="150" y="322" width="630" height="54" rx="5" fill="#2d6a4f"/>
  <text x="465" y="346" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">세 서버 합만 모은다: 653 + 996 + 586 = 2235 → 235</text>
  <text x="465" y="366" font-size="13" text-anchor="middle" fill="#ffffff">= 120 + 75 + 40 · 어느 서버도 한 병원의 값을 보지 않았다</text>
</svg>
