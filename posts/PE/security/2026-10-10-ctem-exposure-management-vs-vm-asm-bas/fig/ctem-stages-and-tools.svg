<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fbfbf8"/>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">CTEM 5단계와 각 단계를 받치는 기존 활동</text>
  <text x="30" y="56" font-size="13" fill="#555">초록 테두리: 기존 취약점 관리에 없던 단계 · 회색: 기존 취약점 관리와 겹치는 단계</text>

  <!-- diagnosis / action brackets -->
  <path d="M 30 92 L 30 84 L 678 84 L 678 92" stroke="#555" fill="none" stroke-width="1.2"/>
  <text x="354" y="78" font-size="13" text-anchor="middle" fill="#555">진단 — 무엇이 실제로 위험한가</text>
  <path d="M 694 92 L 694 84 L 844 84 L 844 92" stroke="#555" fill="none" stroke-width="1.2"/>
  <text x="769" y="78" font-size="13" text-anchor="middle" fill="#555">조치</text>

  <!-- stage boxes -->
  <rect x="30" y="100" width="150" height="78" rx="8" fill="#eef5f0" stroke="#2d6a4f" stroke-width="2"/>
  <text x="105" y="126" font-size="14" font-weight="bold" text-anchor="middle" fill="#2d6a4f">① 범위 설정</text>
  <text x="105" y="146" font-size="13" text-anchor="middle" fill="#1b1b1b">지킬 업무와</text>
  <text x="105" y="164" font-size="13" text-anchor="middle" fill="#1b1b1b">공격 표면을 정한다</text>

  <rect x="196" y="100" width="150" height="78" rx="8" fill="#f3f3ef" stroke="#3b3b3b" stroke-width="1.3"/>
  <text x="271" y="126" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">② 발견</text>
  <text x="271" y="146" font-size="13" text-anchor="middle" fill="#1b1b1b">자산·취약점·</text>
  <text x="271" y="164" font-size="13" text-anchor="middle" fill="#1b1b1b">잘못된 설정을 찾는다</text>

  <rect x="362" y="100" width="150" height="78" rx="8" fill="#f3f3ef" stroke="#3b3b3b" stroke-width="1.3"/>
  <text x="437" y="126" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">③ 우선순위</text>
  <text x="437" y="146" font-size="13" text-anchor="middle" fill="#1b1b1b">악용 가능성·</text>
  <text x="437" y="164" font-size="13" text-anchor="middle" fill="#1b1b1b">업무 영향으로 정렬</text>

  <rect x="528" y="100" width="150" height="78" rx="8" fill="#eef5f0" stroke="#2d6a4f" stroke-width="2"/>
  <text x="603" y="126" font-size="14" font-weight="bold" text-anchor="middle" fill="#2d6a4f">④ 검증</text>
  <text x="603" y="146" font-size="13" text-anchor="middle" fill="#1b1b1b">공격 경로가 실제로</text>
  <text x="603" y="164" font-size="13" text-anchor="middle" fill="#1b1b1b">성립하는지 시험</text>

  <rect x="694" y="100" width="150" height="78" rx="8" fill="#eef5f0" stroke="#2d6a4f" stroke-width="2"/>
  <text x="769" y="126" font-size="14" font-weight="bold" text-anchor="middle" fill="#2d6a4f">⑤ 동원</text>
  <text x="769" y="146" font-size="13" text-anchor="middle" fill="#1b1b1b">책임 조직을 정하고</text>
  <text x="769" y="164" font-size="13" text-anchor="middle" fill="#1b1b1b">조치를 실행시킨다</text>

  <!-- forward arrows -->
  <line x1="180" y1="139" x2="194" y2="139" stroke="#3b3b3b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="346" y1="139" x2="360" y2="139" stroke="#3b3b3b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="512" y1="139" x2="526" y2="139" stroke="#3b3b3b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="678" y1="139" x2="692" y2="139" stroke="#3b3b3b" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- loop back -->
  <path d="M 769 178 L 769 204 L 105 204 L 105 182" stroke="#b45309" stroke-width="1.5" fill="none" marker-end="url(#ar2)"/>
  <text x="437" y="222" font-size="13" text-anchor="middle" fill="#b45309">조치 결과를 다음 순환의 발견에서 다시 확인한다 (반복)</text>

  <!-- tools -->
  <rect x="30" y="262" width="150" height="50" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="105" y="284" font-size="13" text-anchor="middle" fill="#1b1b1b">업무 부서와</text>
  <text x="105" y="302" font-size="13" text-anchor="middle" fill="#1b1b1b">범위 합의</text>
  <rect x="196" y="262" width="150" height="50" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="271" y="284" font-size="13" text-anchor="middle" fill="#1b1b1b">공격 표면 관리(ASM)</text>
  <text x="271" y="302" font-size="13" text-anchor="middle" fill="#1b1b1b">취약점 스캐너</text>
  <rect x="362" y="262" width="150" height="50" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="437" y="284" font-size="13" text-anchor="middle" fill="#1b1b1b">CVSS · EPSS</text>
  <text x="437" y="302" font-size="13" text-anchor="middle" fill="#1b1b1b">KEV 목록</text>
  <rect x="528" y="262" width="150" height="50" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="603" y="284" font-size="13" text-anchor="middle" fill="#1b1b1b">침해·공격 시뮬레이션</text>
  <text x="603" y="302" font-size="13" text-anchor="middle" fill="#1b1b1b">(BAS) · 모의해킹</text>
  <rect x="694" y="262" width="150" height="50" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="769" y="284" font-size="13" text-anchor="middle" fill="#1b1b1b">ITSM 티켓</text>
  <text x="769" y="302" font-size="13" text-anchor="middle" fill="#1b1b1b">개발 작업 목록</text>

  <g stroke="#9a9a92" stroke-width="1" stroke-dasharray="2 3">
    <line x1="105" y1="230" x2="105" y2="260"/>
    <line x1="271" y1="230" x2="271" y2="260"/>
    <line x1="437" y1="230" x2="437" y2="260"/>
    <line x1="603" y1="230" x2="603" y2="260"/>
    <line x1="769" y1="230" x2="769" y2="260"/>
  </g>
  <text x="30" y="334" font-size="13" fill="#555">점선 상자: 이미 있는 도구·활동. CTEM은 이것들을 새로 만드는 것이 아니라 한 순환으로 잇는다</text>

  <!-- bottom: two meanings of verification -->
  <line x1="30" y1="354" x2="850" y2="354" stroke="#d8d8d2" stroke-width="1"/>
  <text x="30" y="380" font-size="14" font-weight="bold" fill="#1b1b1b">같은 "검증"이라는 말, 다른 시점</text>
  <text x="30" y="404" font-size="13" fill="#9d0208">취약점 관리(NIST SP 800-40r4)의 검증 — 조치 후: 패치가 설치되고 효과를 내는지 확인</text>
  <text x="30" y="426" font-size="13" fill="#2d6a4f">CTEM의 검증 — 조치 전: 공격자가 이 노출로 실제로 들어올 수 있는지, 방어가 막는지 확인</text>
  <text x="30" y="452" font-size="13" fill="#555">앞의 것은 "고쳤는가"를, 뒤의 것은 "고칠 가치가 있는가"를 묻는다</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b3b3b"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
