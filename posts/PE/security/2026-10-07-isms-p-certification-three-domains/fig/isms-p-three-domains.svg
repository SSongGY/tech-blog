<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="500" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">ISMS-P 인증기준 — 3개 영역 101개 항목</text>

  <!-- 법적 근거 -->
  <rect x="40" y="52" width="370" height="58" rx="6" fill="#eef4f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="225" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">정보통신망법 제47조</text>
  <text x="225" y="98" text-anchor="middle" font-size="13" fill="#333">정보보호 관리체계 인증 · 대상자는 의무</text>
  <rect x="470" y="52" width="370" height="58" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="655" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">개인정보 보호법 제32조의2</text>
  <text x="655" y="98" text-anchor="middle" font-size="13" fill="#333">개인정보 보호 인증 · 신청은 자율</text>

  <!-- 공동 고시 -->
  <path d="M225 110 L225 128 L440 128 L440 140" fill="none" stroke="#555" stroke-width="1.5"/>
  <path d="M655 110 L655 128 L440 128" fill="none" stroke="#555" stroke-width="1.5"/>
  <rect x="250" y="140" width="380" height="36" rx="6" fill="#f4f4f4" stroke="#555"/>
  <text x="440" y="163" text-anchor="middle" font-size="13" fill="#111">과기정통부·개인정보위 공동 고시 — 별표 7 인증기준</text>
  <path d="M440 176 L440 196" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- 영역 1 -->
  <rect x="40" y="200" width="250" height="190" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="165" y="226" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d6a4f">1. 관리체계 수립 및 운영</text>
  <text x="165" y="246" text-anchor="middle" font-size="13" fill="#333">4개 분야 · 16개</text>
  <g font-size="13" fill="#111">
    <text x="60" y="280">1.1 관리체계 기반 마련 (6)</text>
    <text x="60" y="304">1.2 위험 관리 (4)</text>
    <text x="60" y="328">1.3 관리체계 운영 (3)</text>
    <text x="60" y="352">1.4 관리체계 점검 및 개선 (3)</text>
  </g>
  <text x="165" y="378" text-anchor="middle" font-size="13" fill="#2d6a4f">1.1 → 1.4 반복 수행</text>

  <!-- 영역 2 -->
  <rect x="315" y="200" width="250" height="190" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="440" y="226" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d6a4f">2. 보호대책 요구사항</text>
  <text x="440" y="246" text-anchor="middle" font-size="13" fill="#333">12개 분야 · 64개</text>
  <g font-size="13" fill="#111">
    <text x="330" y="276">관리적 — 정책·조직·자산, 인적,</text>
    <text x="330" y="294">　외부자 보안</text>
    <text x="330" y="318">물리적 — 물리 보안</text>
    <text x="330" y="342">기술적 — 인증·권한, 접근통제, 암호화,</text>
    <text x="330" y="360">　개발 보안, 운영·보안관리,</text>
    <text x="330" y="378">　사고 대응, 재해 복구</text>
  </g>

  <!-- 영역 3 -->
  <rect x="590" y="200" width="250" height="190" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="715" y="226" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">3. 개인정보 처리 단계별</text>
  <text x="715" y="246" text-anchor="middle" font-size="13" fill="#333">5개 분야 · 21개</text>
  <g font-size="13" fill="#111">
    <text x="610" y="280">3.1 수집 시 (7)</text>
    <text x="610" y="304">3.2 보유·이용 시 (5)</text>
    <text x="610" y="328">3.3 제공 시 (4)</text>
    <text x="610" y="352">3.4 파기 시 (2)</text>
    <text x="610" y="376">3.5 정보주체 권리보호 (3)</text>
  </g>

  <!-- 인증 범위 괄호 -->
  <path d="M40 410 L40 422 L565 422 L565 410" fill="none" stroke="#2d6a4f" stroke-width="2"/>
  <text x="302" y="444" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">ISMS 인증 = 1 + 2 → 80개</text>
  <path d="M40 456 L40 468 L840 468 L840 456" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="490" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">ISMS-P 인증 = 1 + 2 + 3 → 101개</text>
</svg>
