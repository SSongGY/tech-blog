<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>

  <!-- 주소 분할 -->
  <text x="24" y="32" font-size="16" font-weight="bold" fill="#222222">주소 = 태그 T | 세트 인덱스 S | 오프셋 O</text>
  <rect x="24" y="46" width="420" height="38" fill="#f7f7f7" stroke="#555555"/>
  <rect x="444" y="46" width="220" height="38" fill="#f0f7f3" stroke="#2d6a4f"/>
  <rect x="664" y="46" width="192" height="38" fill="#fff7ed" stroke="#b45309"/>
  <text x="234" y="70" font-size="14" text-anchor="middle" fill="#222222">태그 T — 같은 세트 안에서 비교</text>
  <text x="554" y="70" font-size="14" text-anchor="middle" fill="#2d6a4f">세트 S — 어느 세트인가</text>
  <text x="760" y="70" font-size="14" text-anchor="middle" fill="#b45309">오프셋 O — 라인 안</text>
  <text x="24" y="106" font-size="13" fill="#555555">O = log2(라인 크기), S = log2(세트 수), T = 주소 비트 − S − O · 캐시 크기 = 라인 크기 × 연관도 × 세트 수</text>

  <line x1="24" y1="122" x2="856" y2="122" stroke="#dddddd"/>
  <text x="24" y="148" font-size="14" fill="#222222">라인 8개짜리 캐시에 블록 12 를 넣을 수 있는 자리 (진한 칸)</text>

  <!-- 직접 사상 -->
  <text x="140" y="182" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">직접 사상 (1-way)</text>
  <text x="140" y="202" font-size="13" text-anchor="middle" fill="#555555">세트 8개 · 12 mod 8 = 4</text>
  <g font-size="13" fill="#555555">
    <rect x="90" y="214" width="100" height="22" fill="#f7f7f7" stroke="#999999"/>
    <rect x="90" y="236" width="100" height="22" fill="#f7f7f7" stroke="#999999"/>
    <rect x="90" y="258" width="100" height="22" fill="#f7f7f7" stroke="#999999"/>
    <rect x="90" y="280" width="100" height="22" fill="#f7f7f7" stroke="#999999"/>
    <rect x="90" y="302" width="100" height="22" fill="#d8eee2" stroke="#2d6a4f" stroke-width="2"/>
    <rect x="90" y="324" width="100" height="22" fill="#f7f7f7" stroke="#999999"/>
    <rect x="90" y="346" width="100" height="22" fill="#f7f7f7" stroke="#999999"/>
    <rect x="90" y="368" width="100" height="22" fill="#f7f7f7" stroke="#999999"/>
    <text x="80" y="230" text-anchor="end">0</text>
    <text x="80" y="318" text-anchor="end">4</text>
    <text x="80" y="384" text-anchor="end">7</text>
  </g>
  <text x="140" y="414" font-size="13" text-anchor="middle" fill="#222222">비교기 1개 · S = 3</text>
  <text x="140" y="434" font-size="13" text-anchor="middle" fill="#9d0208">같은 세트 블록끼리 서로 밀어낸다</text>

  <!-- 2-way 집합 연관 -->
  <text x="440" y="182" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">2-way 집합 연관</text>
  <text x="440" y="202" font-size="13" text-anchor="middle" fill="#555555">세트 4개 × 2칸 · 12 mod 4 = 0</text>
  <g font-size="13" fill="#555555">
    <rect x="370" y="214" width="70" height="22" fill="#d8eee2" stroke="#2d6a4f" stroke-width="2"/>
    <rect x="440" y="214" width="70" height="22" fill="#d8eee2" stroke="#2d6a4f" stroke-width="2"/>
    <rect x="370" y="236" width="70" height="22" fill="#f7f7f7" stroke="#999999"/>
    <rect x="440" y="236" width="70" height="22" fill="#f7f7f7" stroke="#999999"/>
    <rect x="370" y="258" width="70" height="22" fill="#f7f7f7" stroke="#999999"/>
    <rect x="440" y="258" width="70" height="22" fill="#f7f7f7" stroke="#999999"/>
    <rect x="370" y="280" width="70" height="22" fill="#f7f7f7" stroke="#999999"/>
    <rect x="440" y="280" width="70" height="22" fill="#f7f7f7" stroke="#999999"/>
    <text x="360" y="230" text-anchor="end">세트 0</text>
    <text x="360" y="296" text-anchor="end">세트 3</text>
  </g>
  <text x="440" y="414" font-size="13" text-anchor="middle" fill="#222222">비교기 2개 · S = 2</text>
  <text x="440" y="434" font-size="13" text-anchor="middle" fill="#2d6a4f">세트는 직접 사상처럼, 세트 안은 병렬 비교</text>

  <!-- 완전 연관 -->
  <text x="740" y="182" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">완전 연관</text>
  <text x="740" y="202" font-size="13" text-anchor="middle" fill="#555555">세트 1개 × 8칸 · 어디든</text>
  <g>
    <rect x="636" y="214" width="26" height="22" fill="#d8eee2" stroke="#2d6a4f" stroke-width="2"/>
    <rect x="662" y="214" width="26" height="22" fill="#d8eee2" stroke="#2d6a4f" stroke-width="2"/>
    <rect x="688" y="214" width="26" height="22" fill="#d8eee2" stroke="#2d6a4f" stroke-width="2"/>
    <rect x="714" y="214" width="26" height="22" fill="#d8eee2" stroke="#2d6a4f" stroke-width="2"/>
    <rect x="740" y="214" width="26" height="22" fill="#d8eee2" stroke="#2d6a4f" stroke-width="2"/>
    <rect x="766" y="214" width="26" height="22" fill="#d8eee2" stroke="#2d6a4f" stroke-width="2"/>
    <rect x="792" y="214" width="26" height="22" fill="#d8eee2" stroke="#2d6a4f" stroke-width="2"/>
    <rect x="818" y="214" width="26" height="22" fill="#d8eee2" stroke="#2d6a4f" stroke-width="2"/>
  </g>
  <text x="740" y="414" font-size="13" text-anchor="middle" fill="#222222">비교기 8개 · S = 0</text>
  <text x="740" y="434" font-size="13" text-anchor="middle" fill="#b45309">충돌 없음, 비교기가 라인 수만큼</text>
</svg>
