<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>

  <text x="440" y="30" font-size="17" font-weight="bold" text-anchor="middle" fill="#222222">무엇을 고정하느냐 — 문제 크기(암달) 대 실행 시간(구스타프슨)</text>

  <!-- 가. 크기 고정 -->
  <text x="40" y="72" font-size="15" font-weight="bold" fill="#9d0208">가. 문제 크기 고정 — 암달</text>
  <text x="40" y="104" font-size="13" fill="#333333">직렬 프로세서</text>
  <rect x="170" y="88" width="120" height="26" fill="#fde2e1" stroke="#9d0208"/>
  <text x="230" y="106" font-size="13" text-anchor="middle" fill="#222222">s</text>
  <rect x="290" y="88" width="480" height="26" fill="#e2e8f0" stroke="#475569"/>
  <text x="530" y="106" font-size="13" text-anchor="middle" fill="#222222">p  (시간 1 = s + p)</text>

  <text x="40" y="146" font-size="13" fill="#333333">병렬 N 대</text>
  <rect x="170" y="130" width="120" height="26" fill="#fde2e1" stroke="#9d0208"/>
  <text x="230" y="148" font-size="13" text-anchor="middle" fill="#222222">s</text>
  <rect x="290" y="130" width="60" height="26" fill="#e2e8f0" stroke="#475569"/>
  <text x="320" y="148" font-size="13" text-anchor="middle" fill="#222222">p/N</text>
  <text x="370" y="148" font-size="13" fill="#333333">시간 = s + p/N</text>

  <text x="40" y="186" font-size="14" fill="#222222">속도 향상 = 1 / (s + p/N)  →  N 이 커져도 1/s 를 넘지 못한다</text>

  <line x1="30" y1="212" x2="850" y2="212" stroke="#cbd5e1" stroke-dasharray="4 4"/>

  <!-- 나. 시간 고정 -->
  <text x="40" y="248" font-size="15" font-weight="bold" fill="#2d6a4f">나. 실행 시간 고정 — 구스타프슨</text>
  <text x="40" y="280" font-size="13" fill="#333333">병렬 N 대</text>
  <rect x="170" y="264" width="60" height="26" fill="#fde2e1" stroke="#9d0208"/>
  <text x="200" y="282" font-size="13" text-anchor="middle" fill="#222222">s′</text>
  <rect x="230" y="264" width="60" height="26" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="260" y="282" font-size="13" text-anchor="middle" fill="#222222">p′</text>
  <text x="310" y="282" font-size="13" fill="#333333">시간 1 = s′ + p′ (N 대가 각자 p′ 만큼)</text>

  <text x="40" y="322" font-size="13" fill="#333333">직렬로 한다면</text>
  <rect x="170" y="306" width="60" height="26" fill="#fde2e1" stroke="#9d0208"/>
  <text x="200" y="324" font-size="13" text-anchor="middle" fill="#222222">s′</text>
  <rect x="230" y="306" width="600" height="26" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="530" y="324" font-size="13" text-anchor="middle" fill="#222222">N × p′  (가상의 시간 = s′ + N·p′)</text>

  <text x="40" y="362" font-size="14" fill="#222222">속도 향상 = s′ + N·p′ = N + (1 − N)·s′  →  N 에 비례해 늘어나는 직선</text>

  <text x="440" y="412" font-size="13" text-anchor="middle" fill="#333333">s 는 직렬 실행 시간 기준, s′ 는 병렬 실행 시간 기준의 순차 비율이다 — 같은 기호지만 분모가 다르다</text>
  <text x="440" y="440" font-size="13" text-anchor="middle" fill="#b45309">s′ 를 s = s′ / (s′ + N·p′) 로 바꿔 암달 식에 넣으면 두 식은 같은 값을 준다</text>
</svg>
