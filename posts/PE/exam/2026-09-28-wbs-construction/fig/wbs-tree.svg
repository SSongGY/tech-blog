<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="460" fill="#ffffff"/>
  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#b45309" stroke-width="1.6"/>
    </marker>
  </defs>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">정보시스템 구축사업 WBS — 산출물 중심 하향식 분해</text>

  <!-- 레벨 표시 -->
  <text x="20" y="84" font-size="13" fill="#4a5568">레벨 1</text>
  <text x="20" y="174" font-size="13" fill="#4a5568">레벨 2</text>
  <text x="20" y="284" font-size="13" fill="#4a5568">레벨 3</text>

  <!-- 레벨 1 -->
  <rect x="330" y="56" width="220" height="48" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.6" rx="4"/>
  <text x="440" y="77" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">1 정보시스템 구축</text>
  <text x="440" y="95" text-anchor="middle" font-size="13" fill="#4a5568">사업 범위 100%</text>

  <!-- 레벨 1 → 2 연결 -->
  <line x1="440" y1="104" x2="440" y2="124" stroke="#4a5568" stroke-width="1.4"/>
  <line x1="185" y1="124" x2="695" y2="124" stroke="#4a5568" stroke-width="1.4"/>
  <line x1="185" y1="124" x2="185" y2="146" stroke="#4a5568" stroke-width="1.4"/>
  <line x1="440" y1="124" x2="440" y2="146" stroke="#4a5568" stroke-width="1.4"/>
  <line x1="695" y1="124" x2="695" y2="146" stroke="#4a5568" stroke-width="1.4"/>

  <!-- 레벨 2 -->
  <rect x="85" y="146" width="200" height="48" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4" rx="4"/>
  <text x="185" y="167" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">1.1 사업관리</text>
  <text x="185" y="185" text-anchor="middle" font-size="13" fill="#4a5568">관리 작업도 범위에 넣는다</text>

  <rect x="340" y="146" width="200" height="48" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.6" rx="4"/>
  <text x="440" y="167" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">1.2 회원 서브시스템</text>
  <text x="440" y="185" text-anchor="middle" font-size="13" fill="#4a5568">고위험 → 더 깊게 분해</text>

  <rect x="595" y="146" width="200" height="48" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4" rx="4"/>
  <text x="695" y="167" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">1.3 데이터 이관</text>
  <text x="695" y="185" text-anchor="middle" font-size="13" fill="#4a5568">먼 미래 작업 → 기획 패키지</text>

  <!-- 레벨 2 → 3 연결 -->
  <line x1="440" y1="194" x2="440" y2="214" stroke="#4a5568" stroke-width="1.4"/>
  <line x1="215" y1="214" x2="665" y2="214" stroke="#4a5568" stroke-width="1.4"/>
  <line x1="215" y1="214" x2="215" y2="256" stroke="#4a5568" stroke-width="1.4"/>
  <line x1="440" y1="214" x2="440" y2="256" stroke="#4a5568" stroke-width="1.4"/>
  <line x1="665" y1="214" x2="665" y2="256" stroke="#4a5568" stroke-width="1.4"/>

  <!-- 레벨 3: 작업 패키지 -->
  <rect x="115" y="256" width="200" height="48" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.6" rx="4"/>
  <text x="215" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">1.2.1 요구사항 정의서</text>
  <text x="215" y="295" text-anchor="middle" font-size="13" fill="#2d6a4f">작업 패키지</text>

  <rect x="340" y="256" width="200" height="48" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.6" rx="4"/>
  <text x="440" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">1.2.2 설계서</text>
  <text x="440" y="295" text-anchor="middle" font-size="13" fill="#2d6a4f">작업 패키지</text>

  <rect x="565" y="256" width="200" height="48" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.6" rx="4"/>
  <text x="665" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">1.2.3 프로그램 · 단위시험</text>
  <text x="665" y="295" text-anchor="middle" font-size="13" fill="#2d6a4f">작업 패키지</text>

  <!-- 100% 규칙 -->
  <text x="440" y="236" text-anchor="middle" font-size="13" fill="#b45309" style="paint-order:stroke" stroke="#ffffff" stroke-width="4">1.2.1 + 1.2.2 + 1.2.3 = 1.2의 100%</text>

  <!-- WBS 사전 -->
  <rect x="115" y="340" width="650" height="44" fill="#fdf6ec" stroke="#b45309" stroke-width="1.2" rx="4"/>
  <text x="440" y="367" text-anchor="middle" font-size="14" fill="#1b1b1b"><tspan font-weight="bold">WBS 사전</tspan> — 요소마다 작업 내용 · 책임자 · 일정 · 예산 · 인수 기준</text>
  <line x1="440" y1="304" x2="440" y2="336" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#a3)"/>

  <!-- 하단 -->
  <text x="20" y="416" font-size="13" fill="#1b1b1b">요소 이름은 산출물(명사)로 쓴다 — "설계한다"가 아니라 "설계서". 작업 순서는 일정의 몫이다</text>
  <text x="20" y="440" font-size="13" fill="#4a5568">작업 패키지 아래에서 일정 활동이 정의되고, WBS 코드가 일정 · 원가 · 조직(OBS)을 잇는 키가 된다</text>
</svg>
