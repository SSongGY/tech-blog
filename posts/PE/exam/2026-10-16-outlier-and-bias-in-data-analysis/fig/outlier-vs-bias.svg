<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-label="이상치는 개별 관측값이 멀리 떨어진 것이고 편향은 분포 전체가 치우친 것이다">
  <rect x="0" y="0" width="880" height="340" fill="#fbfaf7"/>

  <text x="40" y="30" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1b2a24">이상치 — 한 점이 멀다</text>
  <text x="470" y="30" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1b2a24">편향 — 분포 전체가 치우친다</text>

  <!-- 왼쪽: 산점도 -->
  <g>
    <text x="74" y="52" font-family="sans-serif" font-size="13" fill="#44584f">↑ 반응변수</text>
    <line x1="70" y1="290" x2="420" y2="290" stroke="#44584f" stroke-width="1.5"/>
    <line x1="70" y1="60" x2="70" y2="290" stroke="#44584f" stroke-width="1.5"/>
    <text x="245" y="314" font-family="sans-serif" font-size="13" fill="#44584f" text-anchor="middle">설명변수 →</text>

    <g fill="#2d6a4f">
      <circle cx="105" cy="268" r="5"/><circle cx="130" cy="262" r="5"/>
      <circle cx="152" cy="255" r="5"/><circle cx="178" cy="252" r="5"/>
      <circle cx="200" cy="244" r="5"/><circle cx="226" cy="240" r="5"/>
      <circle cx="250" cy="233" r="5"/><circle cx="275" cy="229" r="5"/>
      <circle cx="300" cy="222" r="5"/><circle cx="325" cy="218" r="5"/>
      <circle cx="350" cy="211" r="5"/>
    </g>
    <circle cx="378" cy="92" r="7" fill="#9d0208"/>
    <text x="366" y="80" font-family="sans-serif" font-size="13" fill="#9d0208" text-anchor="end">이상치 1점</text>

    <line x1="95" y1="272" x2="400" y2="202" stroke="#2d6a4f" stroke-width="2.5"/>
    <text x="298" y="258" font-family="sans-serif" font-size="13" fill="#2d6a4f">제외하고 적합</text>

    <line x1="95" y1="276" x2="400" y2="140" stroke="#9d0208" stroke-width="2.5" stroke-dasharray="7 4"/>
    <text x="140" y="128" font-family="sans-serif" font-size="13" fill="#9d0208">포함하고 적합</text>
  </g>

  <!-- 오른쪽: 분포 평행이동 -->
  <g>
    <text x="470" y="52" font-family="sans-serif" font-size="13" fill="#5c3a06">측정을 되풀이해도 줄지 않는 성분이다</text>

    <line x1="490" y1="290" x2="845" y2="290" stroke="#44584f" stroke-width="1.5"/>
    <text x="845" y="314" font-family="sans-serif" font-size="13" fill="#44584f" text-anchor="end">측정값 →</text>

    <path d="M510,290 C560,290 575,150 615,150 C655,150 670,290 720,290" fill="none" stroke="#2d6a4f" stroke-width="2.5"/>
    <line x1="615" y1="110" x2="615" y2="290" stroke="#2d6a4f" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="605" y="258" font-family="sans-serif" font-size="13" fill="#2d6a4f" text-anchor="end">참값</text>

    <path d="M620,290 C670,290 685,170 725,170 C765,170 780,290 830,290" fill="none" stroke="#9d0208" stroke-width="2.5" stroke-dasharray="7 4"/>
    <line x1="725" y1="110" x2="725" y2="290" stroke="#9d0208" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="731" y="275" font-family="sans-serif" font-size="13" fill="#9d0208">측정 평균</text>

    <line x1="615" y1="110" x2="725" y2="110" stroke="#b45309" stroke-width="2"/>
    <path d="M719,105 L727,110 L719,115" fill="#b45309"/>
    <path d="M621,105 L613,110 L621,115" fill="#b45309"/>
    <text x="670" y="100" font-family="sans-serif" font-size="13" fill="#b45309" text-anchor="middle">b = 편향</text>
  </g>
</svg>
