<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <text x="440" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#222222">화이트 레이블 SaaS — 유통 관계와 플랫폼 구현</text>

  <!-- provider -->
  <rect x="40" y="52" width="200" height="64" rx="6" fill="#eef3f8" stroke="#355070" stroke-width="1.5"/>
  <text x="140" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#222222">원 제공사</text>
  <text x="140" y="100" text-anchor="middle" font-size="13" fill="#333333">개발·운영·기술 지원</text>

  <!-- resellers -->
  <rect x="640" y="52" width="200" height="56" rx="6" fill="#ffffff" stroke="#355070" stroke-width="1.5"/>
  <text x="740" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#222222">재판매사 A</text>
  <text x="740" y="97" text-anchor="middle" font-size="13" fill="#333333">자기 브랜드로 판매</text>
  <rect x="640" y="124" width="200" height="56" rx="6" fill="#ffffff" stroke="#355070" stroke-width="1.5"/>
  <text x="740" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#222222">재판매사 B</text>
  <text x="740" y="169" text-anchor="middle" font-size="13" fill="#333333">자기 브랜드로 판매</text>

  <line x1="240" y1="80" x2="638" y2="80" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <polyline points="440,80 440,152 638,152" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="340" y="70" text-anchor="middle" font-size="13" fill="#333333">라이선스·도매가 공급</text>
  <text x="540" y="70" text-anchor="middle" font-size="13" fill="#b45309">원 제공사 브랜드 비노출</text>

  <!-- platform -->
  <rect x="270" y="206" width="330" height="214" rx="8" fill="#f7f7f7" stroke="#355070" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="435" y="228" text-anchor="middle" font-size="13" fill="#355070">멀티테넌트 플랫폼 (원 제공사가 운영, 코드 1벌)</text>

  <rect x="290" y="244" width="290" height="64" rx="6" fill="#ecf6f0" stroke="#2d6a4f" stroke-width="2"/>
  <text x="435" y="270" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d6a4f">요청 라우팅·테넌트 매핑</text>
  <text x="435" y="292" text-anchor="middle" font-size="13" fill="#333333">Host 헤더(도메인) → 테넌트 식별</text>

  <rect x="290" y="336" width="290" height="64" rx="6" fill="#ffffff" stroke="#355070" stroke-width="1.5"/>
  <text x="435" y="362" text-anchor="middle" font-size="15" font-weight="bold" fill="#222222">테넌트별 설정</text>
  <text x="435" y="384" text-anchor="middle" font-size="13" fill="#333333">도메인·TLS 인증서·브랜드 표시 요소</text>

  <line x1="435" y1="308" x2="435" y2="334" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>

  <polyline points="140,116 140,312 268,312" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="150" y="220" font-size="13" fill="#333333">운영</text>

  <!-- customers -->
  <rect x="640" y="244" width="200" height="56" rx="6" fill="#ffffff" stroke="#355070" stroke-width="1.5"/>
  <text x="740" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#222222">A의 고객</text>
  <text x="740" y="289" text-anchor="middle" font-size="13" fill="#333333">app.a-brand.example</text>
  <rect x="640" y="336" width="200" height="56" rx="6" fill="#ffffff" stroke="#355070" stroke-width="1.5"/>
  <text x="740" y="360" text-anchor="middle" font-size="15" font-weight="bold" fill="#222222">B의 고객</text>
  <text x="740" y="381" text-anchor="middle" font-size="13" fill="#333333">portal.b-brand.example</text>

  <line x1="640" y1="272" x2="582" y2="272" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <polyline points="640,364 610,364 610,290 582,290" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="440" y="448" text-anchor="middle" font-size="13" fill="#555555">고객은 재판매사 브랜드·도메인만 본다. 고객 도메인은 CNAME으로 원 제공사의 테넌트 주소를 가리킨다</text>
</svg>
