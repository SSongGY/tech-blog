<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#f8f9fa"/>

  <text x="40" y="38" font-size="17" font-weight="bold" fill="#1b1b1b">인공지능 윤리기준의 구조 — 최고가치 1 · 기본원칙 3 · 핵심요건 10</text>
  <text x="40" y="60" font-size="13" fill="#555">요건은 특정 원칙 하나에 묶이지 않고, 세 원칙 전체를 실천하는 세부 요건으로 제시된다.</text>

  <!-- 최고가치 -->
  <rect x="290" y="80" width="300" height="56" rx="6" fill="#ffffff" stroke="#3d5a80" stroke-width="2"/>
  <text x="440" y="104" font-size="15" font-weight="bold" fill="#1b1b1b" text-anchor="middle">최고가치: 인간성</text>
  <text x="440" y="124" font-size="13" fill="#333" text-anchor="middle">AI for Humanity</text>

  <g stroke="#3d5a80" stroke-width="2" fill="none">
    <path d="M 440 136 L 440 152 L 165 152 L 165 168"/>
    <path d="M 440 152 L 440 168"/>
    <path d="M 440 152 L 715 152 L 715 168"/>
  </g>
  <g fill="#3d5a80">
    <polygon points="165,174 160,164 170,164"/>
    <polygon points="440,174 435,164 445,164"/>
    <polygon points="715,174 710,164 720,164"/>
  </g>

  <!-- 3대 기본원칙 -->
  <rect x="40" y="174" width="250" height="78" rx="6" fill="#eef6f1" stroke="#2d6a4f" stroke-width="2"/>
  <text x="165" y="200" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">① 인간 존엄성 원칙</text>
  <text x="165" y="222" font-size="13" fill="#333" text-anchor="middle">생명 · 정신 · 신체에 해가 없게</text>
  <text x="165" y="240" font-size="13" fill="#333" text-anchor="middle">안전성 · 견고성 확보</text>

  <rect x="315" y="174" width="250" height="78" rx="6" fill="#eef6f1" stroke="#2d6a4f" stroke-width="2"/>
  <text x="440" y="200" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">② 사회의 공공선 원칙</text>
  <text x="440" y="222" font-size="13" fill="#333" text-anchor="middle">사회적 약자 접근성 보장</text>
  <text x="440" y="240" font-size="13" fill="#333" text-anchor="middle">인류 보편 복지 향상</text>

  <rect x="590" y="174" width="250" height="78" rx="6" fill="#eef6f1" stroke="#2d6a4f" stroke-width="2"/>
  <text x="715" y="200" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">③ 기술의 합목적성 원칙</text>
  <text x="715" y="222" font-size="13" fill="#333" text-anchor="middle">도구라는 목적에 부합</text>
  <text x="715" y="240" font-size="13" fill="#333" text-anchor="middle">과정도 윤리적일 것</text>

  <!-- 3원칙 전체 → 10요건 -->
  <path d="M 40 266 L 840 266" stroke="#2d6a4f" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <path d="M 440 266 L 440 288" stroke="#2d6a4f" stroke-width="2" fill="none"/>
  <polygon points="440,294 435,284 445,284" fill="#2d6a4f"/>
  <text x="456" y="284" font-size="13" fill="#2d6a4f">세 원칙을 실천 · 이행하는 요건 (AI 전체 생명주기)</text>

  <!-- 10대 핵심요건 -->
  <rect x="40" y="298" width="800" height="128" rx="6" fill="#ffffff" stroke="#3d5a80" stroke-width="2"/>
  <text x="60" y="320" font-size="14" font-weight="bold" fill="#1b1b1b">10대 핵심요건</text>
  <g font-size="13" fill="#1b1b1b" text-anchor="middle">
    <rect x="60" y="332" width="144" height="34" rx="4" fill="#f1f4f8" stroke="#9aa9bd"/>
    <text x="132" y="354">① 인권 보장</text>
    <rect x="215" y="332" width="144" height="34" rx="4" fill="#f1f4f8" stroke="#9aa9bd"/>
    <text x="287" y="354">② 프라이버시 보호</text>
    <rect x="370" y="332" width="144" height="34" rx="4" fill="#f1f4f8" stroke="#9aa9bd"/>
    <text x="442" y="354">③ 다양성 존중</text>
    <rect x="525" y="332" width="144" height="34" rx="4" fill="#f1f4f8" stroke="#9aa9bd"/>
    <text x="597" y="354">④ 침해금지</text>
    <rect x="680" y="332" width="144" height="34" rx="4" fill="#f1f4f8" stroke="#9aa9bd"/>
    <text x="752" y="354">⑤ 공공성</text>

    <rect x="60" y="378" width="144" height="34" rx="4" fill="#f1f4f8" stroke="#9aa9bd"/>
    <text x="132" y="400">⑥ 연대성</text>
    <rect x="215" y="378" width="144" height="34" rx="4" fill="#f1f4f8" stroke="#9aa9bd"/>
    <text x="287" y="400">⑦ 데이터 관리</text>
    <rect x="370" y="378" width="144" height="34" rx="4" fill="#f1f4f8" stroke="#9aa9bd"/>
    <text x="442" y="400">⑧ 책임성</text>
    <rect x="525" y="378" width="144" height="34" rx="4" fill="#f1f4f8" stroke="#9aa9bd"/>
    <text x="597" y="400">⑨ 안전성</text>
    <rect x="680" y="378" width="144" height="34" rx="4" fill="#f1f4f8" stroke="#9aa9bd"/>
    <text x="752" y="400">⑩ 투명성</text>
  </g>

  <text x="40" y="452" font-size="13" fill="#b45309">원칙 · 요건 사이에 고정된 우선순위는 두지 않는다 — 상충하면 이해관계자 숙의로 절충한다.</text>
</svg>
