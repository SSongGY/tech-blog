<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#fbfaf7"/>

  <!-- 자율 시스템 A -->
  <rect x="40" y="60" width="340" height="245" rx="18" fill="#ffffff" stroke="#374151" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="210" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">자율 시스템 A (AS 64496)</text>

  <line x1="108" y1="146" x2="108" y2="222" stroke="#2d6a4f" stroke-width="1.6"/>
  <line x1="146" y1="124" x2="265" y2="177" stroke="#2d6a4f" stroke-width="1.6"/>
  <line x1="146" y1="222" x2="265" y2="185" stroke="#2d6a4f" stroke-width="1.6"/>

  <rect x="70" y="102" width="76" height="44" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="108" y="130" text-anchor="middle" font-size="14" fill="#111827">R1</text>
  <rect x="70" y="200" width="76" height="44" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="108" y="228" text-anchor="middle" font-size="14" fill="#111827">R2</text>
  <rect x="265" y="155" width="76" height="44" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2.2"/>
  <text x="303" y="183" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">R3</text>

  <text x="196" y="167" text-anchor="middle" font-size="13" fill="#2d6a4f">IGP</text>
  <text x="210" y="268" text-anchor="middle" font-size="13" fill="#374151">AS 내부 경로 분배 — 메트릭 최소화</text>
  <text x="210" y="290" text-anchor="middle" font-size="13" fill="#374151">OSPF · IS-IS · RIP</text>

  <!-- 자율 시스템 B -->
  <rect x="500" y="60" width="340" height="245" rx="18" fill="#ffffff" stroke="#374151" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="670" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">자율 시스템 B (AS 64510)</text>

  <line x1="615" y1="177" x2="734" y2="124" stroke="#2d6a4f" stroke-width="1.6"/>
  <line x1="615" y1="185" x2="734" y2="222" stroke="#2d6a4f" stroke-width="1.6"/>
  <line x1="772" y1="146" x2="772" y2="222" stroke="#2d6a4f" stroke-width="1.6"/>

  <rect x="539" y="155" width="76" height="44" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2.2"/>
  <text x="577" y="183" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">R4</text>
  <rect x="734" y="102" width="76" height="44" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="772" y="130" text-anchor="middle" font-size="14" fill="#111827">R5</text>
  <rect x="734" y="200" width="76" height="44" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="772" y="228" text-anchor="middle" font-size="14" fill="#111827">R6</text>

  <text x="684" y="167" text-anchor="middle" font-size="13" fill="#2d6a4f">IGP</text>
  <text x="670" y="268" text-anchor="middle" font-size="13" fill="#374151">AS 내부 경로 분배 — 메트릭 최소화</text>
  <text x="670" y="290" text-anchor="middle" font-size="13" fill="#374151">OSPF · IS-IS · RIP</text>

  <!-- AS 간 연결 -->
  <line x1="341" y1="177" x2="539" y2="177" stroke="#111827" stroke-width="3"/>
  <text x="440" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">외부 게이트웨이 프로토콜</text>
  <text x="440" y="203" text-anchor="middle" font-size="13" fill="#374151">AS 간 도달 가능성 교환 — 정책 우선 (eBGP)</text>

  <!-- 하단 설명 -->
  <rect x="40" y="326" width="800" height="58" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.3"/>
  <text x="56" y="350" font-size="13.5" fill="#374151">경계 라우터 R3·R4는 두 프로토콜을 함께 돌린다. 같은 AS 안의 BGP 스피커끼리 맺는 연결은 iBGP로,</text>
  <text x="56" y="374" font-size="13.5" fill="#374151">AS 내부에 외부 경로를 일관되게 퍼뜨리는 데 쓴다 — BGP는 AS 안에서도 돈다.</text>
</svg>
