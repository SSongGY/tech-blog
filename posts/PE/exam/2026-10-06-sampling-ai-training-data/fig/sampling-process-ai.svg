<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="430" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#4a5568" stroke-width="1.6"/>
    </marker>
  </defs>

  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">표본추출 5단계와 단계별 오차 — AI 학습데이터에서의 대응</text>

  <text x="16" y="58" font-size="13" font-weight="bold" fill="#4a5568">① 표본추출 절차</text>

  <!-- 5 steps -->
  <rect x="16" y="68" width="152" height="76" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.6" rx="4"/>
  <text x="92" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">모집단 정의</text>
  <text x="92" y="122" text-anchor="middle" font-size="13" fill="#4a5568">목표 · 조사 단위</text>

  <rect x="190" y="68" width="152" height="76" fill="#f4f5f7" stroke="#b45309" stroke-width="1.6" rx="4"/>
  <text x="266" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">표본프레임 선정</text>
  <text x="266" y="122" text-anchor="middle" font-size="13" fill="#4a5568">단위 목록 · 보조 정보</text>

  <rect x="364" y="68" width="152" height="76" fill="#f4f5f7" stroke="#b45309" stroke-width="1.6" rx="4"/>
  <text x="440" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">추출 방법 결정</text>
  <text x="440" y="122" text-anchor="middle" font-size="13" fill="#4a5568">확률 / 비확률</text>

  <rect x="538" y="68" width="152" height="76" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.6" rx="4"/>
  <text x="614" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">표본 크기 결정</text>
  <text x="614" y="122" text-anchor="middle" font-size="13" fill="#4a5568">정밀도 · 비용 · 배분</text>

  <rect x="712" y="68" width="152" height="76" fill="#f4f5f7" stroke="#2d6a4f" stroke-width="1.6" rx="4"/>
  <text x="788" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">추출 · 기록</text>
  <text x="788" y="122" text-anchor="middle" font-size="13" fill="#4a5568">포함확률 · 가중치</text>

  <line x1="168" y1="106" x2="188" y2="106" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="342" y1="106" x2="362" y2="106" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="516" y1="106" x2="536" y2="106" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="690" y1="106" x2="710" y2="106" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- errors -->
  <text x="266" y="166" text-anchor="middle" font-size="13" fill="#9d0208">프레임 누락 → 포괄 오차</text>
  <text x="440" y="166" text-anchor="middle" font-size="13" fill="#9d0208">주관 선택 → 선택 편향</text>
  <text x="614" y="166" text-anchor="middle" font-size="13" fill="#b45309">표본 크기 → 표본오차</text>

  <!-- AI mapping -->
  <line x1="16" y1="190" x2="864" y2="190" stroke="#cbd5e0" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="16" y="218" font-size="13" font-weight="bold" fill="#4a5568">② AI 학습데이터 구축에서 대응하는 것</text>

  <rect x="16" y="230" width="270" height="150" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.6" rx="4"/>
  <text x="151" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">모집단 = 운영 입력 분포</text>
  <text x="30" y="286" font-size="13" fill="#4a5568">지역 · 맥락 · 행동 환경</text>
  <text x="30" y="310" font-size="13" fill="#4a5568">프레임 = 수집 가능한 원천 목록</text>
  <text x="30" y="334" font-size="13" fill="#4a5568">둘의 차이 = 데이터 공백</text>
  <text x="30" y="358" font-size="13" fill="#4a5568">(수집처 · 기간 · 대상 집단)</text>

  <rect x="305" y="230" width="270" height="150" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.6" rx="4"/>
  <text x="440" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">설계 = 층 · 묶음 · 시간</text>
  <text x="319" y="286" font-size="13" fill="#4a5568">층화: 클래스 · 집단 비율 유지</text>
  <text x="319" y="310" font-size="13" fill="#4a5568">묶음: 같은 사람 · 문서는 한쪽에</text>
  <text x="319" y="334" font-size="13" fill="#4a5568">시간: 과거로 학습, 미래로 평가</text>
  <text x="319" y="358" font-size="13" fill="#4a5568">희소 층은 과다표집 + 가중치</text>

  <rect x="594" y="230" width="270" height="150" fill="#f4f5f7" stroke="#2d6a4f" stroke-width="1.6" rx="4"/>
  <text x="729" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">기록 = 데이터시트</text>
  <text x="608" y="286" font-size="13" fill="#4a5568">프레임 판 · 층 정의 · 시드</text>
  <text x="608" y="310" font-size="13" fill="#4a5568">항목별 포함확률 · 분할 이름</text>
  <text x="608" y="334" font-size="13" fill="#4a5568">대표성 검증 결과</text>
  <text x="608" y="358" font-size="13" fill="#4a5568">→ 재현 · 편향 점검 근거</text>

  <line x1="266" y1="176" x2="266" y2="228" stroke="#4a5568" stroke-width="1.4" stroke-dasharray="4,3"/>
  <line x1="440" y1="176" x2="440" y2="228" stroke="#4a5568" stroke-width="1.4" stroke-dasharray="4,3"/>
  <line x1="788" y1="146" x2="788" y2="228" stroke="#4a5568" stroke-width="1.4" stroke-dasharray="4,3"/>

  <text x="440" y="412" text-anchor="middle" font-size="13" fill="#4a5568">확률표본만 포함확률을 계산할 수 있다 — 가중치 = 1 / 포함확률</text>
</svg>
