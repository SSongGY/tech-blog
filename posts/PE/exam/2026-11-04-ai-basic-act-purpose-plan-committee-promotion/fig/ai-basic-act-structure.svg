<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="14">
  <rect x="0" y="0" width="880" height="440" fill="#fffdf7"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">인공지능기본법 — 목적에서 시책까지의 구조</text>

  <!-- 목적 / 원칙 -->
  <rect x="60" y="50" width="340" height="62" rx="8" fill="#dbe4ff" stroke="#3652a4" stroke-width="1.8"/>
  <text x="230" y="76" text-anchor="middle" font-weight="bold" fill="#1e3a8a">목적 (제1조)</text>
  <text x="230" y="98" text-anchor="middle" font-size="13" fill="#1e3a8a">건전한 발전 + 신뢰 기반 조성</text>

  <rect x="480" y="50" width="340" height="62" rx="8" fill="#dbe4ff" stroke="#3652a4" stroke-width="1.8"/>
  <text x="650" y="76" text-anchor="middle" font-weight="bold" fill="#1e3a8a">기본원칙 (제3조)</text>
  <text x="650" y="98" text-anchor="middle" font-size="13" fill="#1e3a8a">안전성·신뢰성 · 설명 받을 권리 · 국가 책무</text>

  <!-- 기본계획 / 위원회 -->
  <rect x="60" y="160" width="340" height="78" rx="8" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="230" y="186" text-anchor="middle" font-weight="bold" fill="#1b4332">인공지능 기본계획 (제6조)</text>
  <text x="230" y="208" text-anchor="middle" font-size="13" fill="#1b4332">과학기술정보통신부장관이 3년마다 수립</text>
  <text x="230" y="226" text-anchor="middle" font-size="13" fill="#1b4332">진흥 + 신뢰 사항을 함께 담는다</text>

  <rect x="480" y="160" width="340" height="78" rx="8" fill="#fff3e0" stroke="#b45309" stroke-width="1.8"/>
  <text x="650" y="186" text-anchor="middle" font-weight="bold" fill="#7c2d12">국가인공지능전략위원회 (제7·8조)</text>
  <text x="650" y="208" text-anchor="middle" font-size="13" fill="#7c2d12">대통령 소속 · 위원장은 대통령</text>
  <text x="650" y="226" text-anchor="middle" font-size="13" fill="#7c2d12">계획을 심의·의결하고 이행을 점검</text>

  <line x1="480" y1="199" x2="404" y2="199" stroke="#374151" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="442" y="190" text-anchor="middle" font-size="13" fill="#374151">심의·의결</text>
  <line x1="230" y1="112" x2="230" y2="158" stroke="#374151" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="650" y1="112" x2="650" y2="158" stroke="#374151" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- 시책 4가지 -->
  <text x="440" y="278" text-anchor="middle" font-weight="bold" fill="#1f2937">기술 개발·산업 육성 시책 (제13조~제25조)</text>
  <line x1="230" y1="238" x2="230" y2="262" stroke="#374151" stroke-width="1.8"/>
  <line x1="230" y1="262" x2="440" y2="262" stroke="#374151" stroke-width="1.8"/>
  <line x1="440" y1="262" x2="440" y2="266" stroke="#374151" stroke-width="1.8"/>

  <rect x="40" y="298" width="190" height="100" rx="8" fill="#e4dbff" stroke="#6b3fa4" stroke-width="1.8"/>
  <text x="135" y="324" text-anchor="middle" font-weight="bold" fill="#4c1d95">① 기술</text>
  <text x="135" y="348" text-anchor="middle" font-size="13" fill="#4c1d95">연구개발 지원</text>
  <text x="135" y="368" text-anchor="middle" font-size="13" fill="#4c1d95">표준화</text>

  <rect x="250" y="298" width="190" height="100" rx="8" fill="#e4dbff" stroke="#6b3fa4" stroke-width="1.8"/>
  <text x="345" y="324" text-anchor="middle" font-weight="bold" fill="#4c1d95">② 데이터</text>
  <text x="345" y="348" text-anchor="middle" font-size="13" fill="#4c1d95">학습용데이터 구축</text>
  <text x="345" y="368" text-anchor="middle" font-size="13" fill="#4c1d95">통합제공시스템</text>

  <rect x="460" y="298" width="190" height="100" rx="8" fill="#e4dbff" stroke="#6b3fa4" stroke-width="1.8"/>
  <text x="555" y="324" text-anchor="middle" font-weight="bold" fill="#4c1d95">③ 인프라</text>
  <text x="555" y="348" text-anchor="middle" font-size="13" fill="#4c1d95">데이터센터 · 실증기반</text>
  <text x="555" y="368" text-anchor="middle" font-size="13" fill="#4c1d95">집적단지</text>

  <rect x="670" y="298" width="170" height="100" rx="8" fill="#e4dbff" stroke="#6b3fa4" stroke-width="1.8"/>
  <text x="755" y="324" text-anchor="middle" font-weight="bold" fill="#4c1d95">④ 인력·기업</text>
  <text x="755" y="348" text-anchor="middle" font-size="13" fill="#4c1d95">전문인력 · 창업</text>
  <text x="755" y="368" text-anchor="middle" font-size="13" fill="#4c1d95">중소기업 우선 지원</text>

  <line x1="440" y1="282" x2="135" y2="296" stroke="#374151" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="440" y1="284" x2="345" y2="296" stroke="#374151" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="440" y1="284" x2="555" y2="296" stroke="#374151" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="440" y1="282" x2="755" y2="296" stroke="#374151" stroke-width="1.4" marker-end="url(#ar)"/>

  <text x="440" y="424" text-anchor="middle" font-size="13" fill="#6b7280">시책 4가지는 법 조문을 IT 자원(기술·데이터·인프라·인력) 기준으로 묶은 것이다</text>
