<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fdfdfb"/>

  <defs>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6a4f"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 왼쪽: HNSW -->
  <text x="24" y="32" font-size="16" font-weight="bold" fill="#1b2a1f">HNSW — 계층 그래프를 위에서 아래로 내려간다</text>

  <rect x="24" y="56" width="400" height="70" rx="6" fill="#eef4ef" stroke="#c3d6c8"/>
  <text x="40" y="84" font-size="14" font-weight="bold" fill="#1b2a1f">상위 계층 (원소 적음)</text>
  <text x="40" y="106" font-size="13" fill="#4a5a4e">진입점에서 ef = 1 탐욕 탐색</text>
  <circle cx="330" cy="91" r="14" fill="#2d6a4f"/>
  <text x="330" y="96" font-size="13" fill="#ffffff" text-anchor="middle">ep</text>
  <circle cx="395" cy="91" r="12" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <line x1="344" y1="91" x2="381" y2="91" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrow-g)"/>

  <rect x="24" y="160" width="400" height="70" rx="6" fill="#eef4ef" stroke="#c3d6c8"/>
  <text x="40" y="188" font-size="14" font-weight="bold" fill="#1b2a1f">중간 계층</text>
  <text x="40" y="210" font-size="13" fill="#4a5a4e">가장 가까운 원소 1개를 들고 하강</text>

  <rect x="24" y="264" width="400" height="86" rx="6" fill="#eef4ef" stroke="#2d6a4f" stroke-width="2"/>
  <text x="40" y="292" font-size="14" font-weight="bold" fill="#1b2a1f">0층 (모든 원소)</text>
  <text x="40" y="314" font-size="13" fill="#4a5a4e">후보 목록 ef 개를 유지하며 확장</text>
  <text x="40" y="336" font-size="13" fill="#4a5a4e">더 가까운 후보가 없으면 멈춤 → 상위 k개</text>

  <line x1="395" y1="104" x2="395" y2="158" stroke="#2d6a4f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-g)"/>
  <line x1="395" y1="232" x2="395" y2="262" stroke="#2d6a4f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-g)"/>

  <text x="24" y="384" font-size="13" fill="#4a5a4e">계층 배정: l = ⌊−ln(unif(0,1))·mL⌋, mL = 1/ln(M)</text>
  <text x="24" y="406" font-size="13" fill="#4a5a4e">손잡이: M(연결 수) · efConstruction · ef</text>

  <!-- 가운데 구분선 -->
  <line x1="446" y1="50" x2="446" y2="420" stroke="#d6dcd7" stroke-width="1.5"/>

  <!-- 오른쪽: IVF -->
  <text x="466" y="32" font-size="16" font-weight="bold" fill="#1b2a1f">IVF — 군집을 고른 뒤 그 목록만 훑는다</text>

  <rect x="466" y="56" width="390" height="70" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="482" y="84" font-size="14" font-weight="bold" fill="#1b2a1f">조대 양자화기 (중심 nlist개)</text>
  <text x="482" y="106" font-size="13" fill="#4a5a4e">질의와 모든 중심의 거리 → 가까운 nprobe개</text>

  <rect x="466" y="160" width="390" height="120" rx="6" fill="#eef4ef" stroke="#c3d6c8"/>
  <text x="482" y="186" font-size="14" font-weight="bold" fill="#1b2a1f">역리스트 (중심마다 1개)</text>
  <rect x="482" y="200" width="358" height="20" rx="3" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="492" y="215" font-size="13" fill="#1b2a1f">목록 3: (id, 벡터 또는 잔차 코드) …</text>
  <rect x="482" y="226" width="358" height="20" rx="3" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="492" y="241" font-size="13" fill="#1b2a1f">목록 7: (id, 벡터 또는 잔차 코드) …</text>
  <rect x="482" y="252" width="358" height="20" rx="3" fill="#f3f3f1" stroke="#c9cfca"/>
  <text x="492" y="267" font-size="13" fill="#8a948c">나머지 목록은 읽지 않는다</text>

  <rect x="466" y="314" width="390" height="56" rx="6" fill="#eef4ef" stroke="#2d6a4f" stroke-width="2"/>
  <text x="482" y="340" font-size="14" font-weight="bold" fill="#1b2a1f">고른 목록 전수 거리 계산 → 상위 k개</text>
  <text x="482" y="360" font-size="13" fill="#4a5a4e">거리 계산 ≈ nlist + nprobe × N / nlist</text>

  <line x1="661" y1="128" x2="661" y2="158" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-a)"/>
  <line x1="661" y1="282" x2="661" y2="312" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrow-g)"/>

  <text x="466" y="406" font-size="13" fill="#4a5a4e">학습: k-평균으로 중심을 먼저 구한다 (데이터 필요)</text>

  <!-- 하단 공통 -->
  <text x="24" y="446" font-size="13" fill="#9d0208">둘 다 후보 밖의 진짜 최근접은 돌려주지 못한다 — 재현율은 ef · nprobe 로 조절한다</text>
</svg>
