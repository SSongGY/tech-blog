<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#333333" stroke-width="1"/>
    </marker>
  </defs>
  <text x="440" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#222222">프록시 패턴의 구조 — 같은 인터페이스, 한 단계 간접</text>

  <!-- Client -->
  <rect x="40" y="70" width="150" height="60" rx="4" fill="#f4f4f4" stroke="#333333" stroke-width="1.5"/>
  <text x="115" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">Client</text>
  <text x="115" y="118" text-anchor="middle" font-size="13" fill="#333333">클라이언트</text>

  <!-- Subject -->
  <rect x="340" y="60" width="200" height="80" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="440" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">Subject</text>
  <text x="440" y="106" text-anchor="middle" font-size="13" fill="#333333">공통 인터페이스</text>
  <text x="440" y="126" text-anchor="middle" font-size="13" fill="#333333">request()</text>

  <line x1="190" y1="100" x2="338" y2="100" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="264" y="90" text-anchor="middle" font-size="13" fill="#333333">이것만 안다</text>

  <!-- Proxy -->
  <rect x="200" y="230" width="220" height="90" rx="4" fill="#fdf4e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="310" y="256" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">Proxy</text>
  <text x="310" y="278" text-anchor="middle" font-size="13" fill="#333333">request(): 접근 제어 후</text>
  <text x="310" y="298" text-anchor="middle" font-size="13" fill="#333333">realSubject.request()</text>

  <!-- RealSubject -->
  <rect x="520" y="230" width="220" height="90" rx="4" fill="#ecf6f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="630" y="256" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">RealSubject</text>
  <text x="630" y="278" text-anchor="middle" font-size="13" fill="#333333">실제 작업 수행</text>
  <text x="630" y="298" text-anchor="middle" font-size="13" fill="#333333">request()</text>

  <!-- realization -->
  <line x1="310" y1="230" x2="410" y2="142" stroke="#333333" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#tri)"/>
  <line x1="630" y1="230" x2="470" y2="142" stroke="#333333" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#tri)"/>
  <text x="440" y="190" text-anchor="middle" font-size="13" fill="#555555">구현</text>

  <!-- delegation -->
  <line x1="420" y1="275" x2="518" y2="275" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="470" y="265" text-anchor="middle" font-size="13" fill="#333333">참조·위임</text>

  <text x="790" y="262" text-anchor="middle" font-size="13" fill="#555555">원격 주소 공간,</text>
  <text x="790" y="282" text-anchor="middle" font-size="13" fill="#555555">생성 비용 큼,</text>
  <text x="790" y="302" text-anchor="middle" font-size="13" fill="#555555">권한 필요</text>

  <text x="440" y="358" text-anchor="middle" font-size="13" fill="#555555">클라이언트는 Subject만 보므로 Proxy와 RealSubject를 구분하지 못한다. Proxy가 언제·누구에게 넘길지 정한다</text>
</svg>
