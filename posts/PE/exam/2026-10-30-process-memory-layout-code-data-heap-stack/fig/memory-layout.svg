<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="600" fill="#fdfdfb"/>

  <text x="440" y="30" font-size="17" font-weight="bold" fill="#1b2430" text-anchor="middle">프로세스 가상 주소 공간의 영역 배치</text>

  <!-- 축 -->
  <line x1="300" y1="48" x2="300" y2="560" stroke="#8a93a0" stroke-width="1"/>
  <text x="292" y="60" font-size="13" fill="#4a5261" text-anchor="end">높은 주소</text>
  <text x="292" y="556" font-size="13" fill="#4a5261" text-anchor="end">낮은 주소</text>

  <!-- 영역 묶음 라벨 -->
  <text x="150" y="97" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">스택 영역</text>
  <line x1="208" y1="70" x2="208" y2="122" stroke="#2d6a4f" stroke-width="2"/>

  <text x="150" y="212" font-size="14" fill="#4a5261" text-anchor="middle">메모리 매핑 영역</text>
  <line x1="208" y1="188" x2="208" y2="232" stroke="#8a93a0" stroke-width="2"/>

  <text x="150" y="327" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">힙 영역</text>
  <line x1="208" y1="303" x2="208" y2="347" stroke="#2d6a4f" stroke-width="2"/>

  <text x="150" y="412" font-size="14" font-weight="bold" fill="#2f4b6e" text-anchor="middle">데이터 영역</text>
  <line x1="208" y1="365" x2="208" y2="455" stroke="#2f4b6e" stroke-width="2"/>

  <text x="150" y="520" font-size="14" font-weight="bold" fill="#2f4b6e" text-anchor="middle">코드 영역</text>
  <line x1="208" y1="473" x2="208" y2="563" stroke="#2f4b6e" stroke-width="2"/>

  <!-- 스택 -->
  <rect x="310" y="70" width="330" height="52" fill="#eaf3ec" stroke="#2d6a4f" stroke-width="1.6" rx="3"/>
  <text x="330" y="92" font-size="14" font-weight="bold" fill="#1b2430">스택(Stack)</text>
  <text x="330" y="112" font-size="13" fill="#3c4858">지역 변수 · 복귀 주소 · 저장 레지스터</text>
  <text x="660" y="99" font-size="13" fill="#3c4858">rw-</text>

  <!-- 스택 성장 화살표 -->
  <line x1="770" y1="78" x2="770" y2="150" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="784" y="118" font-size="13" fill="#2d6a4f">아래로 자람</text>

  <!-- 빈 공간 -->
  <rect x="310" y="130" width="330" height="48" fill="none" stroke="#b9c0ca" stroke-width="1.4" stroke-dasharray="6 4" rx="3"/>
  <text x="475" y="159" font-size="13" fill="#6b7483" text-anchor="middle">아직 매핑되지 않은 빈 공간</text>

  <!-- 매핑 영역 -->
  <rect x="310" y="188" width="330" height="52" fill="#f1f3f6" stroke="#6b7483" stroke-width="1.6" rx="3"/>
  <text x="330" y="210" font-size="14" font-weight="bold" fill="#1b2430">메모리 매핑 영역</text>
  <text x="330" y="230" font-size="13" fill="#3c4858">공유 라이브러리 · 큰 덩어리 익명 매핑</text>
  <text x="660" y="217" font-size="13" fill="#3c4858">r-x / rw-</text>

  <!-- 빈 공간 2 -->
  <rect x="310" y="248" width="330" height="46" fill="none" stroke="#b9c0ca" stroke-width="1.4" stroke-dasharray="6 4" rx="3"/>
  <text x="475" y="276" font-size="13" fill="#6b7483" text-anchor="middle">아직 매핑되지 않은 빈 공간</text>

  <!-- 힙 -->
  <rect x="310" y="303" width="330" height="52" fill="#eaf3ec" stroke="#2d6a4f" stroke-width="1.6" rx="3"/>
  <text x="330" y="325" font-size="14" font-weight="bold" fill="#1b2430">힙(Heap)</text>
  <text x="330" y="345" font-size="13" fill="#3c4858">실행 중 요청으로 잡는 영역 · 끝은 program break</text>
  <text x="660" y="332" font-size="13" fill="#3c4858">rw-</text>

  <line x1="770" y1="345" x2="770" y2="273" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="784" y="313" font-size="13" fill="#2d6a4f">위로 자람</text>

  <!-- .bss -->
  <rect x="310" y="365" width="330" height="44" fill="#e8eef5" stroke="#2f4b6e" stroke-width="1.6" rx="3"/>
  <text x="330" y="383" font-size="14" font-weight="bold" fill="#1b2430">.bss</text>
  <text x="330" y="401" font-size="13" fill="#3c4858">초기값 없는 데이터 — 파일 공간 0, 적재 시 0으로 채움</text>
  <text x="660" y="391" font-size="13" fill="#3c4858">rw-</text>

  <!-- .data -->
  <rect x="310" y="411" width="330" height="44" fill="#e8eef5" stroke="#2f4b6e" stroke-width="1.6" rx="3"/>
  <text x="330" y="429" font-size="14" font-weight="bold" fill="#1b2430">.data</text>
  <text x="330" y="447" font-size="13" fill="#3c4858">초기값 있는 데이터 — 파일에서 그대로 읽어 옴</text>
  <text x="660" y="437" font-size="13" fill="#3c4858">rw-</text>

  <!-- .rodata -->
  <rect x="310" y="473" width="330" height="44" fill="#e8eef5" stroke="#2f4b6e" stroke-width="1.6" rx="3"/>
  <text x="330" y="491" font-size="14" font-weight="bold" fill="#1b2430">.rodata</text>
  <text x="330" y="509" font-size="13" fill="#3c4858">문자열 리터럴 · const 상수</text>
  <text x="660" y="499" font-size="13" fill="#3c4858">r--</text>

  <!-- .text -->
  <rect x="310" y="519" width="330" height="44" fill="#e8eef5" stroke="#2f4b6e" stroke-width="1.6" rx="3"/>
  <text x="330" y="537" font-size="14" font-weight="bold" fill="#1b2430">.text</text>
  <text x="330" y="555" font-size="13" fill="#3c4858">실행할 기계 명령</text>
  <text x="660" y="545" font-size="13" fill="#3c4858">r-x</text>

  <!-- 범례 -->
  <rect x="310" y="575" width="16" height="14" fill="#e8eef5" stroke="#2f4b6e" stroke-width="1.4"/>
  <text x="333" y="587" font-size="13" fill="#3c4858">적재 시 크기 확정</text>
  <rect x="470" y="575" width="16" height="14" fill="#eaf3ec" stroke="#2d6a4f" stroke-width="1.4"/>
  <text x="493" y="587" font-size="13" fill="#3c4858">실행 중 크기 변동</text>

  <defs>
    <marker id="arrowG" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#2d6a4f"/>
    </marker>
  </defs>
</svg>
