<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <rect x="0" y="0" width="880" height="560" fill="#ffffff"/>

  <!-- 루트 -->
  <rect x="370" y="20" width="140" height="40" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="440" y="46" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">입력값</text>
  <line x1="440" y1="60" x2="440" y2="85" stroke="#374151" stroke-width="1.5"/>

  <!-- 분류 1 -->
  <rect x="370" y="85" width="140" height="40" rx="2" fill="#eef2ff" stroke="#374151" stroke-width="1.5"/>
  <text x="440" y="111" font-size="14" fill="#111827" text-anchor="middle">[분류] 입력 형태</text>
  <line x1="440" y1="125" x2="440" y2="142" stroke="#374151" stroke-width="1.5"/>
  <line x1="230" y1="142" x2="650" y2="142" stroke="#374151" stroke-width="1.5"/>
  <line x1="230" y1="142" x2="230" y2="152" stroke="#374151" stroke-width="1.5"/>
  <line x1="650" y1="142" x2="650" y2="152" stroke="#374151" stroke-width="1.5"/>
  <text x="230" y="170" font-size="14" fill="#111827" text-anchor="middle">정수</text>
  <text x="650" y="170" font-size="14" fill="#111827" text-anchor="middle">정수 아님</text>
  <line x1="230" y1="177" x2="230" y2="195" stroke="#374151" stroke-width="1.5"/>
  <line x1="650" y1="177" x2="650" y2="195" stroke="#374151" stroke-width="1.5"/>

  <!-- 분류 2, 3 -->
  <rect x="160" y="195" width="140" height="40" rx="2" fill="#eef2ff" stroke="#374151" stroke-width="1.5"/>
  <text x="230" y="221" font-size="14" fill="#111827" text-anchor="middle">[분류] 값 범위</text>
  <rect x="570" y="195" width="160" height="40" rx="2" fill="#eef2ff" stroke="#374151" stroke-width="1.5"/>
  <text x="650" y="221" font-size="14" fill="#111827" text-anchor="middle">[분류] 비정수 유형</text>

  <line x1="230" y1="235" x2="230" y2="252" stroke="#374151" stroke-width="1.5"/>
  <line x1="90" y1="252" x2="370" y2="252" stroke="#374151" stroke-width="1.5"/>
  <line x1="650" y1="235" x2="650" y2="252" stroke="#374151" stroke-width="1.5"/>
  <line x1="510" y1="252" x2="790" y2="252" stroke="#374151" stroke-width="1.5"/>

  <!-- 잎 클래스 6개 -->
  <g font-size="14" fill="#111827" text-anchor="middle">
    <line x1="90" y1="252" x2="90" y2="262" stroke="#374151" stroke-width="1.5"/>
    <line x1="230" y1="252" x2="230" y2="262" stroke="#374151" stroke-width="1.5"/>
    <line x1="370" y1="252" x2="370" y2="262" stroke="#374151" stroke-width="1.5"/>
    <line x1="510" y1="252" x2="510" y2="262" stroke="#374151" stroke-width="1.5"/>
    <line x1="650" y1="252" x2="650" y2="262" stroke="#374151" stroke-width="1.5"/>
    <line x1="790" y1="252" x2="790" y2="262" stroke="#374151" stroke-width="1.5"/>
    <text x="90" y="280">10 미만</text>
    <text x="230" y="280">10 ~ 100</text>
    <text x="370" y="280">100 초과</text>
    <text x="510" y="280">소수</text>
    <text x="650" y="280">문자</text>
    <text x="790" y="280">빈 입력</text>
  </g>
  <g font-size="13" fill="#b45309" text-anchor="middle">
    <text x="90" y="303">경계 9</text>
    <text x="230" y="303">경계 10 · 100</text>
    <text x="370" y="303">경계 101</text>
  </g>

  <!-- 조합표 -->
  <g stroke="#9ca3af" stroke-dasharray="3,3">
    <line x1="90" y1="310" x2="90" y2="500"/>
    <line x1="230" y1="310" x2="230" y2="500"/>
    <line x1="370" y1="310" x2="370" y2="500"/>
    <line x1="510" y1="310" x2="510" y2="500"/>
    <line x1="650" y1="310" x2="650" y2="500"/>
    <line x1="790" y1="310" x2="790" y2="500"/>
  </g>
  <g stroke="#d1d5db">
    <line x1="20" y1="320" x2="860" y2="320"/>
    <line x1="20" y1="350" x2="860" y2="350"/>
    <line x1="20" y1="380" x2="860" y2="380"/>
    <line x1="20" y1="410" x2="860" y2="410"/>
    <line x1="20" y1="440" x2="860" y2="440"/>
    <line x1="20" y1="470" x2="860" y2="470"/>
    <line x1="20" y1="500" x2="860" y2="500"/>
  </g>
  <g font-size="13" fill="#374151">
    <text x="24" y="340">CT-1</text>
    <text x="24" y="370">CT-2</text>
    <text x="24" y="400">CT-3</text>
    <text x="24" y="430">CT-4</text>
    <text x="24" y="460">CT-5</text>
    <text x="24" y="490">CT-6</text>
  </g>
  <g fill="#2d6a4f">
    <circle cx="90" cy="335" r="7"/>
    <circle cx="230" cy="365" r="7"/>
    <circle cx="370" cy="395" r="7"/>
    <circle cx="510" cy="425" r="7"/>
    <circle cx="650" cy="455" r="7"/>
    <circle cx="790" cy="485" r="7"/>
  </g>

  <text x="440" y="535" font-size="13" fill="#374151" text-anchor="middle">● 그 케이스가 고른 잎 클래스 — 잎 클래스마다 한 번씩 고르면 최소 클래스 커버리지(6건)</text>
</svg>
