<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="360" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#1b1b1b" stroke-width="1.6"/>
    </marker>
    <marker id="arg" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#2d6a4f" stroke-width="1.6"/>
    </marker>
    <marker id="ary" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#b45309" stroke-width="1.6"/>
    </marker>
  </defs>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">소프트웨어 형상관리 절차 — 6개 활동</text>

  <!-- activity boxes -->
  <rect x="20" y="90" width="120" height="62" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.6" rx="4"/>
  <text x="80" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">① 계획</text>
  <text x="80" y="138" text-anchor="middle" font-size="13" fill="#4a5568">SCMP</text>

  <rect x="165" y="90" width="120" height="62" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.6" rx="4"/>
  <text x="225" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">② 식별</text>
  <text x="225" y="138" text-anchor="middle" font-size="13" fill="#4a5568">형상 항목·기준선</text>

  <rect x="310" y="90" width="120" height="62" fill="#fff4e5" stroke="#b45309" stroke-width="1.6" rx="4"/>
  <text x="370" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">③ 통제</text>
  <text x="370" y="138" text-anchor="middle" font-size="13" fill="#4a5568">SCR · CCB</text>

  <rect x="455" y="90" width="120" height="62" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.6" rx="4"/>
  <text x="515" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">④ 상태 기록</text>
  <text x="515" y="138" text-anchor="middle" font-size="13" fill="#4a5568">상태 보고서</text>

  <rect x="600" y="90" width="120" height="62" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.6" rx="4"/>
  <text x="660" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">⑤ 감사</text>
  <text x="660" y="138" text-anchor="middle" font-size="13" fill="#4a5568">FCA · PCA</text>

  <rect x="745" y="90" width="120" height="62" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.6" rx="4"/>
  <text x="805" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">⑥ 릴리스·인도</text>
  <text x="805" y="138" text-anchor="middle" font-size="13" fill="#4a5568">빌드 · VDD</text>

  <!-- forward arrows -->
  <line x1="140" y1="121" x2="163" y2="121" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="285" y1="121" x2="308" y2="121" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="430" y1="121" x2="453" y2="121" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="575" y1="121" x2="598" y2="121" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="720" y1="121" x2="743" y2="121" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- change loop: control back to identification -->
  <path d="M370,90 L370,62 L225,62 L225,88" fill="none" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#arg)"/>
  <text x="298" y="54" text-anchor="middle" font-size="13" fill="#2d6a4f">승인된 변경만 기준선에 반영</text>

  <!-- surveillance loop back to plan -->
  <path d="M660,152 L660,196 L80,196 L80,154" fill="none" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#ary)"/>
  <text x="370" y="216" text-anchor="middle" font-size="13" fill="#b45309">감시·측정 결과로 SCMP 갱신 (SCMP는 계속 고쳐 쓰는 문서)</text>

  <!-- library foundation -->
  <rect x="20" y="248" width="845" height="44" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.4" rx="4"/>
  <text x="442" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">소프트웨어 라이브러리 · 형상관리 도구</text>
  <text x="442" y="285" text-anchor="middle" font-size="13" fill="#4a5568">작업 라이브러리 → 프로젝트 지원 라이브러리 → 마스터 라이브러리 (성숙도가 올라갈수록 접근 통제 강화)</text>

  <text x="442" y="326" text-anchor="middle" font-size="13" fill="#4a5568">②~⑤가 정의문의 4대 활동(식별·통제·기록·감사), ①과 ⑥을 더하면 SWEBOK V3.0의 6개 활동</text>
  <text x="442" y="346" text-anchor="middle" font-size="13" fill="#4a5568">SCR: 소프트웨어 변경 요청 · CCB: 형상통제위원회 · VDD: 버전 기술 문서</text>
</svg>
