<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <rect width="880" height="500" fill="#f8fafc"/>
  <text x="440" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">캐시 일관성 문제 — 같은 블록 X의 사본이 갈라지는 경로와 해결 3갈래</text>

  <!-- 프로세서 0 -->
  <rect x="40" y="62" width="240" height="116" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="160" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">프로세서 0 · 캐시 0</text>
  <text x="160" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">X = 7 (수정됨)</text>
  <text x="160" y="144" text-anchor="middle" font-size="13" fill="#374151">① X에 7을 쓴다</text>
  <text x="160" y="166" text-anchor="middle" font-size="13" fill="#374151">WB라 캐시에만 반영</text>

  <!-- 프로세서 1 -->
  <rect x="320" y="62" width="240" height="116" rx="6" fill="#ffffff" stroke="#9d0208" stroke-width="2"/>
  <text x="440" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">프로세서 1 · 캐시 1</text>
  <text x="440" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d0208">X = 5 (낡은 사본)</text>
  <text x="440" y="144" text-anchor="middle" font-size="13" fill="#374151">② X를 읽는다</text>
  <text x="440" y="166" text-anchor="middle" font-size="13" fill="#374151">자기 사본에서 적중</text>

  <!-- DMA -->
  <rect x="600" y="62" width="240" height="116" rx="6" fill="#ffffff" stroke="#9d0208" stroke-width="2"/>
  <text x="720" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">DMA 장치 (I/O)</text>
  <text x="720" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d0208">X = 5를 가져감</text>
  <text x="720" y="144" text-anchor="middle" font-size="13" fill="#374151">③ 메모리를 직접 읽는다</text>
  <text x="720" y="166" text-anchor="middle" font-size="13" fill="#374151">캐시 0을 보지 않으면 틀림</text>

  <!-- 버스 -->
  <line x1="40" y1="232" x2="840" y2="232" stroke="#374151" stroke-width="4"/>
  <text x="850" y="226" text-anchor="end" font-size="13" fill="#374151">공유 버스</text>
  <line x1="160" y1="178" x2="160" y2="232" stroke="#374151" stroke-width="2"/>
  <line x1="440" y1="178" x2="440" y2="232" stroke="#374151" stroke-width="2"/>
  <line x1="720" y1="178" x2="720" y2="232" stroke="#374151" stroke-width="2"/>
  <line x1="440" y1="232" x2="440" y2="262" stroke="#374151" stroke-width="2"/>

  <!-- 메모리 -->
  <rect x="320" y="262" width="240" height="76" rx="6" fill="#ffffff" stroke="#9d0208" stroke-width="2"/>
  <text x="440" y="292" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">주기억장치</text>
  <text x="440" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d0208">X = 5 (갱신 전)</text>

  <text x="40" y="276" font-size="13" fill="#6b7280">원인: 쓰기 가능한 블록의 사본이</text>
  <text x="40" y="298" font-size="13" fill="#6b7280">여러 곳에 있고, 한 곳만 고쳐졌다</text>
  <text x="600" y="276" font-size="13" fill="#6b7280">WB에서는 캐시와 메모리가</text>
  <text x="600" y="298" font-size="13" fill="#6b7280">어긋난 상태가 정상이다</text>

  <!-- 해결 3갈래 -->
  <text x="440" y="372" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">해결 3갈래</text>

  <rect x="40" y="386" width="250" height="90" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="165" y="412" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d6a4f">소프트웨어</text>
  <text x="165" y="438" text-anchor="middle" font-size="13" fill="#374151">캐시 안 함(UC)·WT 지정</text>
  <text x="165" y="460" text-anchor="middle" font-size="13" fill="#374151">명시적 flush · DMA 동기화</text>

  <rect x="315" y="386" width="250" height="90" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="440" y="412" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d6a4f">하드웨어 스누핑</text>
  <text x="440" y="438" text-anchor="middle" font-size="13" fill="#374151">무효화형 (MESI)</text>
  <text x="440" y="460" text-anchor="middle" font-size="13" fill="#374151">갱신형 (Dragon)</text>

  <rect x="590" y="386" width="250" height="90" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="715" y="412" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d6a4f">하드웨어 디렉터리</text>
  <text x="715" y="438" text-anchor="middle" font-size="13" fill="#374151">메모리 블록마다 상태 비트</text>
  <text x="715" y="460" text-anchor="middle" font-size="13" fill="#374151">사본 가진 곳에만 무효화</text>
</svg>
