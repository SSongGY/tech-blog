<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="540" fill="#f8fafc"/>
  <text x="440" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">쓰기 미스 처리 — 질문 3개로 갈리는 4가지 조합</text>

  <!-- D1 -->
  <rect x="270" y="58" width="340" height="60" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="440" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">① 미스 난 줄을 먼저 읽어 오는가?</text>
  <text x="440" y="106" text-anchor="middle" font-size="13" fill="#374151">fetch-on-write</text>

  <polyline points="270,88 160,88 160,166" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="215" y="80" text-anchor="middle" font-size="13" fill="#374151">예</text>
  <polyline points="610,88 700,88 700,166" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="655" y="80" text-anchor="middle" font-size="13" fill="#374151">아니오</text>

  <!-- Leaf A: fetch-on-write -->
  <rect x="40" y="170" width="240" height="104" rx="6" fill="#ffffff" stroke="#9d0208" stroke-width="2"/>
  <text x="160" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#9d0208">Fetch-on-write</text>
  <text x="160" y="220" text-anchor="middle" font-size="13" fill="#374151">줄 전체를 읽어 온 뒤 쓴다</text>
  <text x="160" y="242" text-anchor="middle" font-size="13" fill="#374151">WT · WB 모두 사용</text>
  <text x="160" y="264" text-anchor="middle" font-size="13" fill="#9d0208">인출 트래픽 가장 많음</text>

  <!-- D2 -->
  <rect x="540" y="170" width="320" height="60" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="700" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">② 캐시에 자리를 잡는가?</text>
  <text x="700" y="218" text-anchor="middle" font-size="13" fill="#374151">write-allocate</text>

  <polyline points="540,200 450,200 450,296" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="495" y="192" text-anchor="middle" font-size="13" fill="#374151">예</text>
  <line x1="760" y1="230" x2="760" y2="296" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="770" y="268" text-anchor="start" font-size="13" fill="#374151">아니오</text>

  <!-- Leaf B: write-validate -->
  <rect x="330" y="300" width="240" height="104" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="450" y="326" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d6a4f">Write-validate</text>
  <text x="450" y="350" text-anchor="middle" font-size="13" fill="#374151">쓴 부분만 유효 비트를 켠다</text>
  <text x="450" y="372" text-anchor="middle" font-size="13" fill="#374151">WT · WB 모두 사용</text>
  <text x="450" y="394" text-anchor="middle" font-size="13" fill="#2d6a4f">줄 안 유효 비트가 필요</text>

  <!-- D3 -->
  <rect x="610" y="300" width="250" height="60" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="735" y="326" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">③ 그 줄을 무효로 만드는가?</text>
  <text x="735" y="348" text-anchor="middle" font-size="13" fill="#374151">write-invalidate</text>

  <polyline points="660,360 660,392 620,392 620,416" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="648" y="386" text-anchor="end" font-size="13" fill="#374151">예</text>
  <polyline points="810,360 810,392 790,392 790,416" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="822" y="386" text-anchor="start" font-size="13" fill="#374151">아니오</text>

  <!-- Leaf C: write-invalidate -->
  <rect x="540" y="420" width="160" height="96" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="620" y="446" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">Write-invalidate</text>
  <text x="620" y="470" text-anchor="middle" font-size="13" fill="#374151">줄을 무효 처리,</text>
  <text x="620" y="490" text-anchor="middle" font-size="13" fill="#374151">하위로만 쓴다</text>
  <text x="620" y="510" text-anchor="middle" font-size="13" fill="#b45309">WT 전용</text>

  <!-- Leaf D: write-around -->
  <rect x="715" y="420" width="150" height="96" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="790" y="446" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">Write-around</text>
  <text x="790" y="470" text-anchor="middle" font-size="13" fill="#374151">캐시는 그대로,</text>
  <text x="790" y="490" text-anchor="middle" font-size="13" fill="#374151">하위로만 쓴다</text>
  <text x="790" y="510" text-anchor="middle" font-size="13" fill="#b45309">WT 전용</text>

  <!-- 적중 정책 메모 -->
  <text x="40" y="320" font-size="14" font-weight="bold" fill="#1f2937">적중(hit) 정책 2가지</text>
  <text x="40" y="346" font-size="13" fill="#374151">· WT: 캐시와 하위에 함께 쓴다</text>
  <text x="40" y="370" font-size="13" fill="#374151">· WB: 캐시에만 쓰고 교체 때</text>
  <text x="40" y="390" font-size="13" fill="#374151">  dirty 줄을 내린다</text>
  <text x="40" y="440" font-size="14" font-weight="bold" fill="#1f2937">인출 트래픽 순서</text>
  <text x="40" y="466" font-size="13" fill="#374151">fetch-on-write  &gt;  write-invalidate</text>
  <text x="40" y="490" font-size="13" fill="#374151">  &gt;  write-around · write-validate</text>
  <text x="40" y="514" font-size="13" fill="#6b7280">(뒤의 둘은 프로그램에 따라 순서가 바뀐다)</text>
</svg>
