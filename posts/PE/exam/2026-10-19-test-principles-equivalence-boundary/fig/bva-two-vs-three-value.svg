<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-label="경계 하나에서 2-value 경계값 분석과 3-value 경계값 분석이 요구하는 값 비교">
  <rect x="0" y="0" width="880" height="280" fill="#fbfbf8"/>

  <text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b">B 와 A 사이 경계 한 곳에서 두 방식이 요구하는 값</text>
  <text x="40" y="58" font-family="sans-serif" font-size="13" fill="#555555">진한 칸이 그 방식의 커버리지 아이템이다. 옅은 칸은 요구하지 않는 값이다.</text>

  <!-- 파티션 머리 -->
  <rect x="300" y="76" width="210" height="26" fill="#eaf4ee" stroke="#2d6a4f" stroke-width="1.4"/>
  <text x="405" y="94" font-family="sans-serif" font-size="13" fill="#2d6a4f" text-anchor="middle">P5 · 80 ~ 89 → B</text>
  <rect x="520" y="76" width="210" height="26" fill="#eaf4ee" stroke="#2d6a4f" stroke-width="1.4"/>
  <text x="625" y="94" font-family="sans-serif" font-size="13" fill="#2d6a4f" text-anchor="middle">P6 · 90 ~ 100 → A</text>

  <!-- 2-value -->
  <text x="285" y="142" font-family="sans-serif" font-size="14" fill="#1b1b1b" text-anchor="end">2-value</text>
  <rect x="300" y="118" width="100" height="40" fill="#f2f2ef" stroke="#b9b9b2" stroke-width="1.4"/>
  <text x="350" y="144" font-family="sans-serif" font-size="15" fill="#8d8d86" text-anchor="middle">88</text>
  <rect x="410" y="118" width="100" height="40" fill="#b45309" stroke="#b45309" stroke-width="1.4"/>
  <text x="460" y="144" font-family="sans-serif" font-size="15" fill="#ffffff" text-anchor="middle">89</text>
  <rect x="520" y="118" width="100" height="40" fill="#b45309" stroke="#b45309" stroke-width="1.4"/>
  <text x="570" y="144" font-family="sans-serif" font-size="15" fill="#ffffff" text-anchor="middle">90</text>
  <rect x="630" y="118" width="100" height="40" fill="#f2f2ef" stroke="#b9b9b2" stroke-width="1.4"/>
  <text x="680" y="144" font-family="sans-serif" font-size="15" fill="#8d8d86" text-anchor="middle">91</text>
  <text x="748" y="144" font-family="sans-serif" font-size="13" fill="#555555">2개</text>

  <!-- 3-value -->
  <text x="285" y="202" font-family="sans-serif" font-size="14" fill="#1b1b1b" text-anchor="end">3-value</text>
  <rect x="300" y="178" width="100" height="40" fill="#b45309" stroke="#b45309" stroke-width="1.4"/>
  <text x="350" y="204" font-family="sans-serif" font-size="15" fill="#ffffff" text-anchor="middle">88</text>
  <rect x="410" y="178" width="100" height="40" fill="#b45309" stroke="#b45309" stroke-width="1.4"/>
  <text x="460" y="204" font-family="sans-serif" font-size="15" fill="#ffffff" text-anchor="middle">89</text>
  <rect x="520" y="178" width="100" height="40" fill="#b45309" stroke="#b45309" stroke-width="1.4"/>
  <text x="570" y="204" font-family="sans-serif" font-size="15" fill="#ffffff" text-anchor="middle">90</text>
  <rect x="630" y="178" width="100" height="40" fill="#b45309" stroke="#b45309" stroke-width="1.4"/>
  <text x="680" y="204" font-family="sans-serif" font-size="15" fill="#ffffff" text-anchor="middle">91</text>
  <text x="748" y="204" font-family="sans-serif" font-size="13" fill="#555555">4개</text>

  <text x="40" y="250" font-family="sans-serif" font-size="13" fill="#555555">2-value 는 경계값과 인접 파티션 쪽 이웃만, 3-value 는 경계값과 양쪽 이웃을 모두 요구한다.</text>
  <text x="40" y="270" font-family="sans-serif" font-size="13" fill="#555555">경계 12개를 모두 모으면 2-value 는 12건, 3-value 는 24건이 된다.</text>
</svg>
