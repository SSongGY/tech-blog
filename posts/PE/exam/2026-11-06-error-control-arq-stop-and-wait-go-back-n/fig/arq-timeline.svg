  <line x1="510" y1="75" x2="510" y2="410" stroke="#333"/>
  <line x1="770" y1="75" x2="770" y2="410" stroke="#333"/>

  <text x="520" y="102" fill="#222">F0</text>
  <line x1="510" y1="108" x2="770" y2="132" stroke="#2d6a4f" stroke-width="2" marker-end="url(#ag)"/>
  <text x="520" y="132" fill="#222">F1</text>
  <line x1="510" y1="138" x2="640" y2="150" stroke="#9d0208" stroke-width="2"/>
  <text x="640" y="166" text-anchor="middle" font-weight="bold" fill="#9d0208">✕ 유실</text>
  <text x="520" y="190" fill="#222">F2</text>
  <line x1="510" y1="196" x2="770" y2="220" stroke="#b45309" stroke-width="2" marker-end="url(#ak)"/>
  <text x="776" y="238" fill="#b45309">F2 폐기</text>
  <text x="520" y="274" fill="#b45309">F1 타이머 만료</text>
  <text x="520" y="300" fill="#222">F1부터 다시</text>
  <line x1="510" y1="306" x2="770" y2="326" stroke="#2d6a4f" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="510" y1="326" x2="770" y2="346" stroke="#2d6a4f" stroke-width="2" marker-end="url(#ag)"/>
  <text x="520" y="326" fill="#222">F2</text>
  <line x1="510" y1="346" x2="770" y2="366" stroke="#2d6a4f" stroke-width="2" marker-end="url(#ag)"/>
  <text x="520" y="346" fill="#222">F3</text>
  <text x="600" y="400" fill="#222">ACK 누적 확인</text>
  <line x1="770" y1="380" x2="510" y2="404" stroke="#2d6a4f" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#ag)"/>
