<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#2d6a4f" stroke-width="1.6"/>
    </marker>
  </defs>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">비인간 신원(NHI) 수명주기와 취약점 10가지</text>
  <text x="440" y="52" text-anchor="middle" font-size="13" fill="#4a5568">OWASP NHI Top 10 (2025) 항목을 수명주기 단계에 배치</text>

  <!-- 수명주기 5단계 -->
  <rect x="20" y="80" width="152" height="56" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.4" rx="4"/>
  <text x="96" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">① 발급</text>
  <text x="96" y="124" text-anchor="middle" font-size="13" fill="#4a5568">계정 · 키 · 인증서 생성</text>

  <rect x="193" y="80" width="152" height="56" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.4" rx="4"/>
  <text x="269" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">② 저장 · 배포</text>
  <text x="269" y="124" text-anchor="middle" font-size="13" fill="#4a5568">코드 · CI/CD · 설정</text>

  <rect x="366" y="80" width="152" height="56" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.4" rx="4"/>
  <text x="442" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">③ 인증</text>
  <text x="442" y="124" text-anchor="middle" font-size="13" fill="#4a5568">토큰 · 인증서 제시</text>

  <rect x="539" y="80" width="152" height="56" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.4" rx="4"/>
  <text x="615" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">④ 권한 · 사용</text>
  <text x="615" y="124" text-anchor="middle" font-size="13" fill="#4a5568">자원 접근</text>

  <rect x="712" y="80" width="148" height="56" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.4" rx="4"/>
  <text x="786" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">⑤ 폐기</text>
  <text x="786" y="124" text-anchor="middle" font-size="13" fill="#4a5568">비활성 · 삭제</text>

  <line x1="172" y1="108" x2="189" y2="108" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="345" y1="108" x2="362" y2="108" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="518" y1="108" x2="535" y2="108" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="691" y1="108" x2="708" y2="108" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#a1)"/>

  <!-- 취약점 -->
  <text x="20" y="170" font-size="14" font-weight="bold" fill="#9d0208">취약점</text>

  <text x="96" y="196" text-anchor="middle" font-size="13" fill="#9d0208">NHI8 환경 미분리</text>
  <text x="96" y="218" text-anchor="middle" font-size="13" fill="#9d0208">NHI9 신원 재사용</text>

  <text x="269" y="196" text-anchor="middle" font-size="13" fill="#9d0208">NHI2 시크릿 유출</text>
  <text x="269" y="218" text-anchor="middle" font-size="13" fill="#9d0208">NHI6 클라우드 배포</text>
  <text x="269" y="236" text-anchor="middle" font-size="13" fill="#9d0208">설정 미흡</text>

  <text x="442" y="196" text-anchor="middle" font-size="13" fill="#9d0208">NHI4 취약한 인증</text>
  <text x="442" y="218" text-anchor="middle" font-size="13" fill="#9d0208">NHI7 장기 시크릿</text>

  <text x="615" y="196" text-anchor="middle" font-size="13" fill="#9d0208">NHI5 과다 권한</text>
  <text x="615" y="218" text-anchor="middle" font-size="13" fill="#9d0208">NHI3 서드파티 NHI</text>
  <text x="615" y="240" text-anchor="middle" font-size="13" fill="#9d0208">NHI10 사람의 NHI 사용</text>

  <text x="786" y="196" text-anchor="middle" font-size="13" fill="#9d0208">NHI1 부적절한 폐기</text>

  <!-- 대응 -->
  <line x1="20" y1="266" x2="860" y2="266" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="20" y="294" font-size="14" font-weight="bold" fill="#2d6a4f">대응</text>

  <text x="96" y="320" text-anchor="middle" font-size="13" fill="#2d6a4f">용도 · 환경별</text>
  <text x="96" y="338" text-anchor="middle" font-size="13" fill="#2d6a4f">개별 발급, 소유자 지정</text>

  <text x="269" y="320" text-anchor="middle" font-size="13" fill="#2d6a4f">시크릿 저장소</text>
  <text x="269" y="338" text-anchor="middle" font-size="13" fill="#2d6a4f">코드 · 저장소 스캔</text>

  <text x="442" y="320" text-anchor="middle" font-size="13" fill="#2d6a4f">단기 자격증명 자동 갱신</text>
  <text x="442" y="338" text-anchor="middle" font-size="13" fill="#2d6a4f">키 소유 증명 결합</text>

  <text x="615" y="320" text-anchor="middle" font-size="13" fill="#2d6a4f">최소 권한</text>
  <text x="615" y="338" text-anchor="middle" font-size="13" fill="#2d6a4f">신원 기반 접근 정책</text>

  <text x="786" y="320" text-anchor="middle" font-size="13" fill="#2d6a4f">인벤토리 · 미사용 탐지</text>
  <text x="786" y="338" text-anchor="middle" font-size="13" fill="#2d6a4f">즉시 회수</text>

  <text x="440" y="380" text-anchor="middle" font-size="13" fill="#b45309">사람 계정처럼 입사 · 퇴사 절차에 묶여 있지 않으므로 수명주기 각 단계를 시스템이 통제해야 한다</text>
</svg>
