<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="440" fill="#fdfdfb"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="200" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">제어 흐름 그래프 (if-else 뒤에 while)</text>

  <!-- 간선 -->
  <path d="M 186 72 L 124 132" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 214 72 L 276 132" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 124 168 L 186 228" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 276 168 L 214 228" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 220 238 C 260 220, 300 230, 322 244" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 322 262 C 300 278, 260 282, 222 256" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 200 266 L 200 326" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- 노드 -->
  <circle cx="200" cy="58" r="20" fill="#fdf3e7" stroke="#b45309" stroke-width="1.8"/>
  <text x="200" y="63" text-anchor="middle" font-size="14" fill="#0f172a">1</text>
  <circle cx="110" cy="150" r="20" fill="#eef2f7" stroke="#334155" stroke-width="1.6"/>
  <text x="110" y="155" text-anchor="middle" font-size="14" fill="#0f172a">2</text>
  <circle cx="290" cy="150" r="20" fill="#eef2f7" stroke="#334155" stroke-width="1.6"/>
  <text x="290" y="155" text-anchor="middle" font-size="14" fill="#0f172a">3</text>
  <circle cx="200" cy="246" r="20" fill="#fdf3e7" stroke="#b45309" stroke-width="1.8"/>
  <text x="200" y="251" text-anchor="middle" font-size="14" fill="#0f172a">4</text>
  <circle cx="340" cy="254" r="20" fill="#eef2f7" stroke="#334155" stroke-width="1.6"/>
  <text x="340" y="259" text-anchor="middle" font-size="14" fill="#0f172a">5</text>
  <circle cx="200" cy="346" r="20" fill="#eef2f7" stroke="#334155" stroke-width="1.6"/>
  <text x="200" y="351" text-anchor="middle" font-size="14" fill="#0f172a">6</text>

  <!-- 노드 설명 -->
  <text x="228" y="50" font-size="13" fill="#7c2d12">if (판단)</text>
  <text x="56" y="128" font-size="13" fill="#334155">then</text>
  <text x="316" y="138" font-size="13" fill="#334155">else</text>
  <text x="172" y="251" text-anchor="end" font-size="13" fill="#7c2d12">while (판단)</text>
  <text x="366" y="259" font-size="13" fill="#334155">루프 본문</text>
  <text x="228" y="351" font-size="13" fill="#334155">종료</text>

  <!-- 영역 -->
  <text x="200" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">R1</text>
  <text x="272" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d6a4f">R2</text>
  <text x="60" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">R3 (바깥)</text>

  <!-- 계산 세 가지 -->
  <rect x="470" y="44" width="390" height="250" rx="6" fill="#e7f2ec" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="665" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d6a4f">계산 3가지 — 모두 3</text>
  <text x="486" y="108" font-size="15" font-weight="bold" fill="#0f172a">① 그래프 공식 V(G) = E − N + 2P</text>
  <text x="506" y="134" font-size="14" fill="#334155">간선 7 − 노드 6 + 2×1 = 3</text>
  <text x="486" y="176" font-size="15" font-weight="bold" fill="#0f172a">② 판단 노드 V(G) = p + 1</text>
  <text x="506" y="202" font-size="14" fill="#334155">이진 판단 노드 1·4 → 2 + 1 = 3</text>
  <text x="486" y="244" font-size="15" font-weight="bold" fill="#0f172a">③ 영역 수 V(G) = R (평면 그래프)</text>
  <text x="506" y="270" font-size="14" fill="#334155">R1 + R2 + 바깥 R3 = 3</text>

  <rect x="470" y="314" width="390" height="100" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.6"/>
  <text x="486" y="342" font-size="15" font-weight="bold" fill="#7c2d12">의미와 기준</text>
  <text x="486" y="368" font-size="14" fill="#0f172a">V(G) = 기본 경로 수 = 구조적 테스트 경로 수</text>
  <text x="486" y="394" font-size="14" fill="#0f172a">모듈당 10 이하 (조건을 갖추면 15까지)</text>
</svg>
