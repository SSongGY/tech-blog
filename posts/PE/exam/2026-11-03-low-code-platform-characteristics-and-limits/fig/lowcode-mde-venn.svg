<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="490" fill="#fdfdfb"/>

  <text x="440" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b1b1b">모델 기반 공학과 로우코드가 겹치는 자리</text>

  <circle cx="400" cy="205" r="130" fill="#edf4ef" fill-opacity="0.55" stroke="#2d6a4f" stroke-width="2.5"/>
  <circle cx="600" cy="205" r="150" fill="#eef1f6" fill-opacity="0.55" stroke="#4a4a4a" stroke-width="2.5"/>
  <circle cx="545" cy="220" r="78" fill="#fff6e8" fill-opacity="0.75" stroke="#b45309" stroke-width="2.5"/>

  <text x="380" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">모델 기반 공학</text>
  <text x="658" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a4a4a">로우코드 개발</text>
  <text x="545" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">로우코드 플랫폼</text>

  <circle cx="330" cy="150" r="15" fill="#fff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="330" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">1</text>

  <circle cx="490" cy="125" r="15" fill="#fff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="490" y="131" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">2</text>

  <circle cx="505" cy="215" r="15" fill="#fff" stroke="#b45309" stroke-width="2"/>
  <text x="505" y="221" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">3</text>

  <circle cx="585" cy="230" r="15" fill="#fff" stroke="#b45309" stroke-width="2"/>
  <text x="585" y="236" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">4</text>

  <circle cx="690" cy="140" r="15" fill="#fff" stroke="#4a4a4a" stroke-width="2"/>
  <text x="690" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a4a4a">5</text>

  <text x="60" y="390" font-size="13" fill="#1b1b1b">① 모델을 쓰지만 코드량 감축이 목표가 아니다 — 시뮬레이션 · 정형 검증 · 역공학</text>
  <text x="60" y="412" font-size="13" fill="#1b1b1b">② 모델로 코드를 줄이지만 배포 · 생애주기 관리는 제공하지 않는다</text>
  <text x="60" y="434" font-size="13" fill="#1b1b1b">③ 모델 기반이면서 배포 · 생애주기 관리까지 제공한다 — 두 갈래가 겹치는 자리</text>
  <text x="60" y="456" font-size="13" fill="#1b1b1b">④ 배포 · 생애주기는 제공하나 명시적 메타모델을 쓰지 않는다</text>
  <text x="60" y="478" font-size="13" fill="#1b1b1b">⑤ 코드만 줄인다 — 메타모델도, 배포 · 생애주기 관리도 없다</text>
</svg>
