<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#fbfbf8"/>

  <text x="440" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2430">데이터 레이크 하이브리드 아키텍처 — 기능과 데이터 성숙도를 함께 쓴 구성</text>
  <text x="440" y="56" text-anchor="middle" font-size="13" fill="#53606e">존은 데이터의 정제 수준으로 나뉘고, 존 안은 저장과 처리라는 기능으로 나뉜다</text>

  <!-- 데이터 원천 -->
  <rect x="20" y="100" width="112" height="112" rx="6" fill="#eef1f4" stroke="#53606e" stroke-width="1.5"/>
  <text x="76" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2430">데이터 원천</text>
  <text x="76" y="170" text-anchor="middle" font-size="13" fill="#53606e">업무 DB · 로그</text>
  <text x="76" y="190" text-anchor="middle" font-size="13" fill="#53606e">IoT · 외부 데이터</text>

  <!-- 원시 데이터 존 -->
  <rect x="166" y="100" width="162" height="112" rx="6" fill="#eaf2ec" stroke="#2d6a4f" stroke-width="2"/>
  <text x="247" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b4332">원시 데이터 존</text>
  <line x1="182" y1="140" x2="312" y2="140" stroke="#9db5a7" stroke-width="1"/>
  <text x="247" y="162" text-anchor="middle" font-size="13" fill="#1b2430">원시 데이터 수집</text>
  <text x="247" y="184" text-anchor="middle" font-size="13" fill="#1b2430">원본 보존 저장</text>
  <text x="247" y="204" text-anchor="middle" font-size="13" fill="#2d6a4f">읽기 전용 보존</text>

  <!-- 처리 존 -->
  <rect x="362" y="100" width="162" height="112" rx="6" fill="#eaf2ec" stroke="#2d6a4f" stroke-width="2"/>
  <text x="443" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b4332">처리 존</text>
  <line x1="378" y1="140" x2="508" y2="140" stroke="#9db5a7" stroke-width="1"/>
  <text x="443" y="162" text-anchor="middle" font-size="13" fill="#1b2430">정제 · 표준화 처리</text>
  <text x="443" y="184" text-anchor="middle" font-size="13" fill="#1b2430">중간 데이터 저장</text>
  <text x="443" y="204" text-anchor="middle" font-size="13" fill="#2d6a4f">처리 이력 기록</text>

  <!-- 접근 존 -->
  <rect x="558" y="100" width="162" height="112" rx="6" fill="#eaf2ec" stroke="#2d6a4f" stroke-width="2"/>
  <text x="639" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b4332">접근 존</text>
  <line x1="574" y1="140" x2="704" y2="140" stroke="#9db5a7" stroke-width="1"/>
  <text x="639" y="162" text-anchor="middle" font-size="13" fill="#1b2430">데이터 질의</text>
  <text x="639" y="184" text-anchor="middle" font-size="13" fill="#1b2430">가용 데이터 저장</text>
  <text x="639" y="204" text-anchor="middle" font-size="13" fill="#2d6a4f">분석 샌드박스</text>

  <!-- 소비자 -->
  <rect x="754" y="100" width="112" height="112" rx="6" fill="#eef1f4" stroke="#53606e" stroke-width="1.5"/>
  <text x="810" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2430">데이터 소비</text>
  <text x="810" y="170" text-anchor="middle" font-size="13" fill="#53606e">데이터 과학자</text>
  <text x="810" y="190" text-anchor="middle" font-size="13" fill="#53606e">AI 학습 · 분석</text>

  <!-- 화살표 -->
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#53606e"/>
    </marker>
  </defs>
  <line x1="132" y1="156" x2="162" y2="156" stroke="#53606e" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="328" y1="156" x2="358" y2="156" stroke="#53606e" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="524" y1="156" x2="554" y2="156" stroke="#53606e" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="720" y1="156" x2="750" y2="156" stroke="#53606e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 거버넌스 존 -->
  <rect x="166" y="248" width="554" height="78" rx="6" fill="#f3f7f4" stroke="#2d6a4f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="443" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b4332">거버넌스 존 — 모든 존을 가로지른다</text>
  <text x="443" y="302" text-anchor="middle" font-size="13" fill="#1b2430">메타데이터 카탈로그 · 데이터 품질 · 계보 추적 · 수명주기 · 접근 통제</text>

  <line x1="247" y1="212" x2="247" y2="244" stroke="#2d6a4f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="443" y1="212" x2="443" y2="244" stroke="#2d6a4f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="639" y1="212" x2="639" y2="244" stroke="#2d6a4f" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text x="440" y="358" text-anchor="middle" font-size="13" fill="#9d0208">거버넌스 존이 빠지면 데이터는 들어가지만 찾아 쓸 수 없는 상태가 된다</text>
  <text x="440" y="380" text-anchor="middle" font-size="13" fill="#53606e">가로축 = 데이터 성숙도(정제 수준), 세로축 = 기능(수집 · 저장 · 처리 · 접근)</text>
</svg>
