<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="arrowEnd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/>
    </marker>
  </defs>

  <rect width="880" height="400" fill="#f8f9fa"/>

  <!-- (1) degree of fragmentation -->
  <text x="30" y="40" font-size="15" font-weight="600" fill="#343a40">① 분할 정도 — 단위를 고르는 축</text>

  <rect x="30" y="56" width="200" height="60" rx="6" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <text x="130" y="82" font-size="15" font-weight="600" fill="#212529" text-anchor="middle">릴레이션 전체</text>
  <text x="130" y="103" font-size="13" fill="#6c757d" text-anchor="middle">분할하지 않음</text>

  <rect x="650" y="56" width="200" height="60" rx="6" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <text x="750" y="82" font-size="15" font-weight="600" fill="#212529" text-anchor="middle">튜플 하나 · 속성 하나</text>
  <text x="750" y="103" font-size="13" fill="#6c757d" text-anchor="middle">더 쪼갤 수 없음</text>

  <line x1="242" y1="86" x2="638" y2="86" stroke="#495057" stroke-width="2"
        marker-start="url(#arrowEnd)" marker-end="url(#arrowEnd)"/>
  <text x="440" y="73" font-size="13" fill="#343a40" text-anchor="middle">응용이 실제로 읽는 범위를 보고 이 사이에서 고른다</text>
  <text x="440" y="109" font-size="13" fill="#b45309" text-anchor="middle">크면 지역성을 잃고, 작으면 재구성 비용이 늘어난다</text>

  <!-- (2) fragmentation alternatives -->
  <text x="30" y="160" font-size="15" font-weight="600" fill="#343a40">② 분할 방식 — 무엇을 가르는가</text>

  <rect x="120" y="176" width="180" height="64" rx="6" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <text x="210" y="203" font-size="15" font-weight="600" fill="#212529" text-anchor="middle">수평분할</text>
  <text x="210" y="225" font-size="13" fill="#6c757d" text-anchor="middle">튜플 집합으로 가른다</text>

  <rect x="350" y="176" width="180" height="64" rx="6" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <text x="440" y="203" font-size="15" font-weight="600" fill="#212529" text-anchor="middle">수직분할</text>
  <text x="440" y="225" font-size="13" fill="#6c757d" text-anchor="middle">속성 집합으로 가른다</text>

  <rect x="580" y="176" width="180" height="64" rx="6" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <text x="670" y="203" font-size="15" font-weight="600" fill="#212529" text-anchor="middle">혼합분할</text>
  <text x="670" y="225" font-size="13" fill="#6c757d" text-anchor="middle">둘을 겹쳐 적용한다</text>

  <!-- (3) correctness rules -->
  <text x="30" y="274" font-size="15" font-weight="600" fill="#343a40">③ 어느 방식이든 만족해야 하는 조건 — 올바른 분할 3규칙</text>

  <rect x="90" y="290" width="210" height="78" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="195" y="315" font-size="15" font-weight="600" fill="#2d6a4f" text-anchor="middle">완전성</text>
  <text x="195" y="337" font-size="13" fill="#495057" text-anchor="middle">R의 모든 데이터 항목이</text>
  <text x="195" y="356" font-size="13" fill="#495057" text-anchor="middle">어느 단편엔가 들어간다</text>

  <rect x="335" y="290" width="210" height="78" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="440" y="315" font-size="15" font-weight="600" fill="#2d6a4f" text-anchor="middle">재구성</text>
  <text x="440" y="337" font-size="13" fill="#495057" text-anchor="middle">어떤 관계 연산자로</text>
  <text x="440" y="356" font-size="13" fill="#495057" text-anchor="middle">R을 되살릴 수 있다</text>

  <rect x="580" y="290" width="210" height="78" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="685" y="315" font-size="15" font-weight="600" fill="#2d6a4f" text-anchor="middle">상호배타성</text>
  <text x="685" y="337" font-size="13" fill="#495057" text-anchor="middle">한 항목이 두 단편에</text>
  <text x="685" y="356" font-size="13" fill="#495057" text-anchor="middle">동시에 있지 않다</text>

  <text x="440" y="390" font-size="13" fill="#6c757d" text-anchor="middle">세 규칙을 모두 만족해야 분할 스키마가 원본과 같은 정보를 담는다</text>
</svg>
