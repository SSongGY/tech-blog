<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400">
  <rect x="0" y="0" width="880" height="400" fill="#f8fafc"/>

  <text x="25" y="36" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">재난·무력충돌 대비 데이터센터 배치 — 거리 축과 관할권 축</text>

  <rect x="25" y="70" width="615" height="245" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="7 5" rx="8"/>
  <text x="37" y="90" font-family="sans-serif" font-size="13" fill="#4b5563">동일 관할권 (국내 법·통신 사업자)</text>

  <rect x="45" y="103" width="340" height="183" fill="none" stroke="#9d0208" stroke-width="1.5" stroke-dasharray="5 4" rx="8"/>
  <text x="57" y="123" font-family="sans-serif" font-size="13" fill="#9d0208">동일 재해 영향권</text>

  <rect x="70" y="143" width="135" height="75" fill="#e8f5ee" stroke="#2d6a4f" stroke-width="2" rx="6"/>
  <text x="137" y="173" font-family="sans-serif" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">주센터</text>
  <text x="137" y="196" font-family="sans-serif" font-size="13" fill="#166534" text-anchor="middle">운영</text>

  <rect x="250" y="143" width="135" height="75" fill="#e8f5ee" stroke="#2d6a4f" stroke-width="2" rx="6"/>
  <text x="317" y="173" font-family="sans-serif" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">근거리 대체센터</text>
  <text x="317" y="196" font-family="sans-serif" font-size="13" fill="#166534" text-anchor="middle">즉시 전환</text>

  <rect x="465" y="143" width="150" height="75" fill="#fff4e6" stroke="#b45309" stroke-width="2" rx="6"/>
  <text x="540" y="173" font-family="sans-serif" font-size="15" font-weight="bold" fill="#7c2d12" text-anchor="middle">원거리 대체센터</text>
  <text x="540" y="196" font-family="sans-serif" font-size="13" fill="#92400e" text-anchor="middle">광역 재해 대비</text>

  <rect x="690" y="143" width="165" height="75" fill="#fdecea" stroke="#9d0208" stroke-width="2" rx="6"/>
  <text x="772" y="173" font-family="sans-serif" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">역외 보관 사본</text>
  <text x="772" y="196" font-family="sans-serif" font-size="13" fill="#991b1b" text-anchor="middle">관할권 상실 대비</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#374151"/>
    </marker>
  </defs>

  <line x1="207" y1="181" x2="246" y2="181" stroke="#2d6a4f" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="387" y1="181" x2="461" y2="181" stroke="#b45309" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="617" y1="181" x2="686" y2="181" stroke="#9d0208" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ar)"/>

  <text x="227" y="246" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">동기 복제</text>
  <text x="227" y="266" font-family="sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">RPO 0</text>
  <text x="424" y="246" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7c2d12" text-anchor="middle">비동기 복제</text>
  <text x="424" y="266" font-family="sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">RPO &gt; 0</text>
  <text x="651" y="246" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7f1d1d" text-anchor="middle">주기 반출</text>
  <text x="651" y="266" font-family="sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">쓰기 금지 보관</text>

  <text x="25" y="348" font-family="sans-serif" font-size="13" fill="#374151">거리를 벌리면 자연재해·광역 정전은 갈라지지만, 적대적 공격은 갈라지지 않는다.</text>
  <text x="25" y="370" font-family="sans-serif" font-size="13" fill="#374151">그래서 거리 축과 별개로 관할권·복제 경로·권한을 끊는 축을 함께 둔다.</text>
</svg>
