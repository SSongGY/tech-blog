<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="14">
  <rect width="880" height="330" fill="#fafafa"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#444"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#9d0208"/>
    </marker>
  </defs>

  <text x="440" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b1b1b">락스텝 이중 모듈 중복(DMR) — 결함 허용 서버의 구조</text>

  <!-- 입력 -->
  <rect x="30" y="130" width="150" height="70" rx="6" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="105" y="158" text-anchor="middle" font-weight="bold" fill="#1b1b1b">동일한 명령 흐름</text>
  <text x="105" y="180" text-anchor="middle" font-size="13" fill="#333">OS·애플리케이션은 1벌</text>

  <!-- 모듈 A -->
  <rect x="250" y="70" width="190" height="70" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="345" y="98" text-anchor="middle" font-weight="bold" fill="#1b1b1b">CPU·메모리 모듈 A</text>
  <text x="345" y="120" text-anchor="middle" font-size="13" fill="#2d6a4f">같은 명령을 같은 시각에 수행</text>

  <!-- 모듈 B -->
  <rect x="250" y="190" width="190" height="70" rx="6" fill="#ffffff" stroke="#9d0208" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="345" y="218" text-anchor="middle" font-weight="bold" fill="#1b1b1b">CPU·메모리 모듈 B</text>
  <text x="345" y="240" text-anchor="middle" font-size="13" fill="#9d0208">고장 → 격리, A가 단독으로 계속</text>

  <!-- 칩셋 -->
  <rect x="510" y="130" width="170" height="70" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="595" y="153" text-anchor="middle" font-weight="bold" fill="#1b1b1b">비교·검출 논리(칩셋)</text>
  <text x="595" y="173" text-anchor="middle" font-size="13" fill="#333">두 출력 불일치를 검출하고</text>
  <text x="595" y="191" text-anchor="middle" font-size="13" fill="#333">고장 쪽을 떼어 낸다</text>

  <!-- I/O -->
  <rect x="740" y="130" width="120" height="70" rx="6" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="800" y="158" text-anchor="middle" font-weight="bold" fill="#1b1b1b">I/O</text>
  <text x="800" y="180" text-anchor="middle" font-size="13" fill="#333">분리된 PCI 경로</text>

  <!-- 화살표 -->
  <line x1="180" y1="150" x2="250" y2="105" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="180" x2="250" y2="225" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="105" x2="510" y2="150" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="225" x2="510" y2="180" stroke="#9d0208" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <line x1="680" y1="165" x2="740" y2="165" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 결과 -->
  <rect x="80" y="285" width="720" height="34" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="440" y="307" text-anchor="middle" font-size="13" fill="#2d6a4f">장애 전환이 없다 — 처리가 멈추지 않고 메모리 상태도 그대로다. 교체 모듈은 재동기화 후 복귀한다</text>
</svg>
