<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9d0208"/>
    </marker>
  </defs>
  <rect width="880" height="480" fill="#f8fafc"/>
  <text x="440" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">가상메모리 관리 — 메커니즘(주소 변환)과 정책(언제·어디에·무엇을)</text>

  <!-- 가상 주소 공간 -->
  <rect x="30" y="70" width="200" height="110" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="130" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">가상 주소 공간</text>
  <text x="130" y="128" text-anchor="middle" font-size="13" fill="#374151">프로세스마다 0번지부터</text>
  <text x="130" y="152" text-anchor="middle" font-size="13" fill="#374151">페이지 / 세그먼트 단위</text>

  <line x1="230" y1="125" x2="318" y2="125" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="274" y="115" text-anchor="middle" font-size="13" fill="#374151">가상 주소</text>

  <!-- 주소 변환 -->
  <rect x="320" y="70" width="230" height="110" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="435" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">주소 변환 (MMU)</text>
  <text x="435" y="128" text-anchor="middle" font-size="13" fill="#374151">페이지·세그먼트 테이블</text>
  <text x="435" y="152" text-anchor="middle" font-size="13" fill="#374151">TLB = 변환 결과 캐시</text>

  <line x1="550" y1="110" x2="648" y2="110" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="599" y="100" text-anchor="middle" font-size="13" fill="#2d6a4f">물리 주소</text>

  <!-- 주기억장치 -->
  <rect x="650" y="60" width="200" height="120" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="750" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d6a4f">주기억장치</text>
  <text x="750" y="120" text-anchor="middle" font-size="13" fill="#374151">페이지 프레임</text>
  <text x="750" y="144" text-anchor="middle" font-size="13" fill="#374151">참조될 부분만 상주</text>

  <!-- 보조기억장치 -->
  <rect x="650" y="240" width="200" height="80" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="750" y="272" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">보조기억장치</text>
  <text x="750" y="298" text-anchor="middle" font-size="13" fill="#374151">스왑 영역 · 파일</text>

  <!-- 교체 / 반입 -->
  <line x1="715" y1="182" x2="715" y2="238" stroke="#9d0208" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="705" y="215" text-anchor="end" font-size="13" fill="#9d0208">교체 (내보냄)</text>
  <line x1="785" y1="238" x2="785" y2="182" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="795" y="215" text-anchor="start" font-size="13" fill="#2d6a4f">반입</text>

  <!-- 페이지 부재 -->
  <polyline points="435,180 435,280 648,280" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="447" y="232" text-anchor="start" font-size="13" fill="#b45309">테이블에 없음 = 페이지 부재</text>
  <text x="447" y="252" text-anchor="start" font-size="13" fill="#b45309">→ 보조기억에서 반입</text>

  <!-- 정책 3가지 -->
  <text x="440" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">관리 정책 3가지</text>

  <rect x="30" y="370" width="260" height="78" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="160" y="397" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">반입 정책 — 언제</text>
  <text x="160" y="424" text-anchor="middle" font-size="13" fill="#374151">요구 반입 / 선반입</text>

  <rect x="310" y="370" width="260" height="78" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="440" y="397" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">배치 정책 — 어디에</text>
  <text x="440" y="424" text-anchor="middle" font-size="13" fill="#374151">최초 적합 · 최적 적합 · 버디</text>

  <rect x="590" y="370" width="260" height="78" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="720" y="397" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">교체 정책 — 무엇을</text>
  <text x="720" y="424" text-anchor="middle" font-size="13" fill="#374151">FIFO · LRU · 워킹셋</text>

  <text x="440" y="470" text-anchor="middle" font-size="13" fill="#6b7280">페이징에서는 배치가 단순하고(빈 프레임 아무 곳), 세그먼테이션에서는 배치가 단편화를 좌우한다</text>
</svg>
