<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="880" height="420" fill="#fbfaf7"/>

  <!-- 왼쪽: 이진 탐색 트리 -->
  <rect x="20" y="160" width="210" height="100" rx="6" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="125" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">이진 탐색 트리</text>
  <text x="125" y="214" text-anchor="middle" font-size="13" fill="#333333">대소 비교로 분기</text>
  <text x="125" y="234" text-anchor="middle" font-size="13" fill="#333333">점(point) 키 · 정확 일치</text>
  <text x="125" y="252" text-anchor="middle" font-size="13" fill="#2d6a4f">균형 시 O(log N)</text>

  <!-- 가운데 세 갈래 -->
  <rect x="290" y="20" width="330" height="96" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="305" y="46" font-size="14" font-weight="bold" fill="#2d6a4f">① 분기 기준을 바꾼다 — 비트 검사</text>
  <text x="305" y="70" font-size="13" fill="#333333">이진 트라이 · PATRICIA · LC-트라이</text>
  <text x="305" y="90" font-size="13" fill="#333333">트리 모양이 주소 공간의 이진 분할로 고정</text>
  <text x="305" y="108" font-size="13" fill="#2d6a4f">최악 O(W) · 삽입 순서 무관</text>

  <rect x="290" y="162" width="330" height="96" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="305" y="188" font-size="14" font-weight="bold" fill="#2d6a4f">② 키를 바꾼다 — 접두사를 구간 끝점으로</text>
  <text x="305" y="212" font-size="13" fill="#333333">N개 접두사 → 정렬된 2N개 점 키</text>
  <text x="305" y="232" font-size="13" fill="#333333">전처리된 =, &gt; 포인터가 최장 일치를 답함</text>
  <text x="305" y="250" font-size="13" fill="#2d6a4f">O(log N) · 이진 탐색을 그대로 사용</text>

  <rect x="290" y="304" width="330" height="96" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="305" y="330" font-size="14" font-weight="bold" fill="#2d6a4f">③ 탐색 축을 바꾼다 — 접두사 길이</text>
  <text x="305" y="354" font-size="13" fill="#333333">길이 1..W 를 이진 탐색, 각 길이는 해시</text>
  <text x="305" y="374" font-size="13" fill="#333333">마커가 더 긴 일치의 방향을 알려 줌</text>
  <text x="305" y="392" font-size="13" fill="#2d6a4f">O(log W) · 주소 길이에만 의존</text>

  <!-- 오른쪽: LPM -->
  <rect x="680" y="162" width="180" height="96" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="770" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">최장 접두사 일치</text>
  <text x="770" y="214" text-anchor="middle" font-size="13" fill="#333333">맞는 항목 여럿 중</text>
  <text x="770" y="234" text-anchor="middle" font-size="13" fill="#333333">가장 긴 것 하나</text>
  <text x="770" y="252" text-anchor="middle" font-size="13" fill="#333333">기본 경로는 길이 0</text>

  <!-- 화살표 -->
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#555555"/>
    </marker>
  </defs>
  <path d="M230,195 L262,195 L262,68 L286,68" fill="none" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M230,210 L286,210" fill="none" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M230,225 L262,225 L262,352 L286,352" fill="none" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/>

  <path d="M620,68 L650,68 L650,186 L676,186" fill="none" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M620,210 L676,210" fill="none" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M620,352 L650,352 L650,234 L676,234" fill="none" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/>

  <text x="20" y="300" font-size="13" fill="#666666">W = 주소 비트 수</text>
  <text x="20" y="320" font-size="13" fill="#666666">(IPv4 32, IPv6 128)</text>
  <text x="20" y="344" font-size="13" fill="#666666">N = 라우팅 테이블</text>
  <text x="20" y="364" font-size="13" fill="#666666">항목 수</text>
</svg>
