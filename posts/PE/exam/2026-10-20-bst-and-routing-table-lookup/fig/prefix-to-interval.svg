<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="880" height="380" fill="#fbfaf7"/>

  <text x="40" y="34" font-size="15" font-weight="bold" fill="#1a1a1a">접두사는 구간이다 — 6비트 주소 공간에 겹쳐 그린 세 접두사</text>

  <!-- 주소 축 -->
  <line x1="60" y1="190" x2="820" y2="190" stroke="#333333" stroke-width="1.6"/>
  <text x="60" y="214" font-size="13" fill="#555555">000000</text>
  <text x="820" y="214" text-anchor="end" font-size="13" fill="#555555">111111</text>

  <!-- 접두사 막대: 0* 는 전체의 왼쪽 절반 -->
  <rect x="60" y="62" width="380" height="24" rx="3" fill="#d8e6de" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="250" y="79" text-anchor="middle" font-size="13" fill="#1a1a1a">0*  →  000000 ~ 011111</text>

  <!-- 10* 는 오른쪽 절반의 왼쪽 절반 -->
  <rect x="440" y="100" width="190" height="24" rx="3" fill="#d8e6de" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="535" y="117" text-anchor="middle" font-size="13" fill="#1a1a1a">10*  →  100000 ~ 101111</text>

  <!-- 1010* 은 10* 안에 포함 -->
  <rect x="535" y="138" width="48" height="24" rx="3" fill="#f3dfc2" stroke="#b45309" stroke-width="1.6"/>
  <text x="180" y="155" font-size="13" fill="#1a1a1a">1010*  →  101000 ~ 101011  (10* 안에 포함)</text>
  <line x1="470" y1="150" x2="531" y2="150" stroke="#b45309" stroke-width="1.4"/>

  <!-- 눈금 -->
  <line x1="440" y1="182" x2="440" y2="198" stroke="#555555" stroke-width="1.4"/>
  <line x1="535" y1="182" x2="535" y2="198" stroke="#555555" stroke-width="1.4"/>
  <line x1="583" y1="182" x2="583" y2="198" stroke="#555555" stroke-width="1.4"/>
  <line x1="630" y1="182" x2="630" y2="198" stroke="#555555" stroke-width="1.4"/>

  <!-- 정렬된 끝점 배열 -->
  <text x="40" y="252" font-size="14" font-weight="bold" fill="#1a1a1a">끝점을 모아 정렬하면 접두사 3개 → 점 키 6개 (2N)</text>

  <g font-size="12.5" fill="#1a1a1a">
    <rect x="60" y="268" width="120" height="34" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
    <text x="120" y="290" text-anchor="middle">000000</text>
    <rect x="180" y="268" width="120" height="34" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
    <text x="240" y="290" text-anchor="middle">011111</text>
    <rect x="300" y="268" width="120" height="34" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
    <text x="360" y="290" text-anchor="middle">100000</text>
    <rect x="420" y="268" width="120" height="34" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
    <text x="480" y="290" text-anchor="middle">101000</text>
    <rect x="540" y="268" width="120" height="34" fill="#f3dfc2" stroke="#b45309" stroke-width="2"/>
    <text x="600" y="290" text-anchor="middle">101011</text>
    <rect x="660" y="268" width="120" height="34" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
    <text x="720" y="290" text-anchor="middle">101111</text>
  </g>

  <path d="M600,306 L600,326" fill="none" stroke="#b45309" stroke-width="1.6"/>
  <text x="40" y="344" font-size="13" fill="#b45309">칸마다 두 포인터를 미리 계산해 둔다 —</text>
  <text x="300" y="344" font-size="13" fill="#1a1a1a">= 는 정확히 맞았을 때의 답(1010*),</text>
  <text x="560" y="344" font-size="13" fill="#1a1a1a">&gt; 는 빗나갔을 때의 답(10*)</text>
  <text x="40" y="366" font-size="13" fill="#666666">전처리는 정렬된 끝점을 스택으로 한 번 훑으면 끝나고, 탐색은 보통 이진 탐색과 같다</text>
</svg>
