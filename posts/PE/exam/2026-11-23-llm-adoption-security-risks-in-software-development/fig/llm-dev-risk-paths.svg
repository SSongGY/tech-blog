<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9d0208"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="460" fill="#ffffff"/>
  <text x="440" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">LLM 도입 개발 흐름에서 보안 위험이 들어오는 자리</text>

  <!-- 1행 -->
  <rect x="40" y="80" width="160" height="60" rx="8" fill="#f1f3f5" stroke="#555"/>
  <text x="120" y="115" text-anchor="middle" font-size="15" fill="#222">개발자</text>

  <rect x="330" y="80" width="220" height="60" rx="8" fill="#e7f0ff" stroke="#3b5b92"/>
  <text x="440" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">코딩 어시스턴트</text>
  <text x="440" y="126" text-anchor="middle" font-size="13" fill="#444">(IDE 플러그인·에이전트)</text>

  <rect x="680" y="80" width="160" height="60" rx="8" fill="#f1f3f5" stroke="#555"/>
  <text x="760" y="106" text-anchor="middle" font-size="15" fill="#222">LLM 서비스</text>
  <text x="760" y="126" text-anchor="middle" font-size="13" fill="#444">(외부 API·사내 모델)</text>

  <!-- 2행 -->
  <rect x="40" y="220" width="160" height="60" rx="8" fill="#fff4e6" stroke="#b45309"/>
  <text x="120" y="246" text-anchor="middle" font-size="15" fill="#222">외부 콘텐츠</text>
  <text x="120" y="266" text-anchor="middle" font-size="13" fill="#444">(README·이슈·웹 문서)</text>

  <rect x="330" y="220" width="220" height="60" rx="8" fill="#e7f0ff" stroke="#3b5b92"/>
  <text x="440" y="255" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">생성 코드·명령</text>

  <rect x="680" y="220" width="160" height="60" rx="8" fill="#fff4e6" stroke="#b45309"/>
  <text x="760" y="246" text-anchor="middle" font-size="15" fill="#222">패키지 레지스트리</text>
  <text x="760" y="266" text-anchor="middle" font-size="13" fill="#444">(PyPI·npm)</text>

  <!-- 3행 -->
  <rect x="40" y="360" width="160" height="60" rx="8" fill="#f1f3f5" stroke="#555"/>
  <text x="120" y="386" text-anchor="middle" font-size="15" fill="#222">실행 환경</text>
  <text x="120" y="406" text-anchor="middle" font-size="13" fill="#444">(셸·DB·빌드)</text>

  <rect x="330" y="360" width="220" height="60" rx="8" fill="#e9f5ee" stroke="#2d6a4f"/>
  <text x="440" y="386" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">CI 보안 게이트</text>
  <text x="440" y="406" text-anchor="middle" font-size="13" fill="#444">(리뷰·SAST·SCA)</text>

  <!-- 화살표 -->
  <line x1="200" y1="110" x2="328" y2="110" stroke="#555" stroke-width="2" marker-end="url(#arrGray)"/>
  <text x="265" y="100" text-anchor="middle" font-size="13" fill="#444">요청</text>

  <line x1="550" y1="110" x2="678" y2="110" stroke="#9d0208" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="615" y="100" text-anchor="middle" font-size="13" fill="#9d0208">③ 코드·비밀 전송</text>

  <line x1="200" y1="236" x2="330" y2="142" stroke="#9d0208" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="282" y="206" text-anchor="start" font-size="13" fill="#9d0208">④ 숨은 지시문</text>

  <line x1="440" y1="140" x2="440" y2="218" stroke="#9d0208" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="450" y="184" text-anchor="start" font-size="13" fill="#9d0208">① 취약한 코드</text>

  <line x1="550" y1="250" x2="678" y2="250" stroke="#9d0208" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="615" y="240" text-anchor="middle" font-size="13" fill="#9d0208">② 환각 패키지</text>

  <line x1="330" y1="268" x2="202" y2="370" stroke="#9d0208" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="248" y="330" text-anchor="end" font-size="13" fill="#9d0208">⑤ 검증 없이 실행</text>

  <line x1="440" y1="280" x2="440" y2="358" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="450" y="324" text-anchor="start" font-size="13" fill="#2d6a4f">검증 통과분만 반영</text>

  <!-- 범례 -->
  <rect x="610" y="350" width="240" height="80" rx="6" fill="#fafafa" stroke="#bbb"/>
  <line x1="625" y1="375" x2="660" y2="375" stroke="#9d0208" stroke-width="2"/>
  <text x="668" y="380" font-size="13" fill="#222">위험이 들어오는 경로</text>
  <line x1="625" y1="405" x2="660" y2="405" stroke="#2d6a4f" stroke-width="2"/>
  <text x="668" y="410" font-size="13" fill="#222">통제 경로</text>
</svg>
