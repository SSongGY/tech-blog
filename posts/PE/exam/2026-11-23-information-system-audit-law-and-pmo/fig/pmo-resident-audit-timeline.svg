<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="880" height="400" fill="#fbfaf7"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#1f2937">사업 단계 위에 놓은 PMO · 상주감리 · 단계별 감리</text>

  <!-- 사업 단계 축 -->
  <g font-size="13" fill="#374151" text-anchor="middle">
    <text x="244" y="66">기획</text>
    <text x="375" y="66">요구정의</text>
    <text x="530" y="66">설계</text>
    <text x="685" y="66">구현·종료</text>
    <text x="811" y="66">사후관리</text>
  </g>
  <line x1="190" y1="78" x2="860" y2="78" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- 행 라벨 -->
  <g font-size="14" font-weight="bold" fill="#111827">
    <text x="20" y="120">PMO</text>
    <text x="20" y="192">상주감리</text>
    <text x="20" y="276">단계별 감리</text>
  </g>
  <g font-size="13" fill="#6b7280">
    <text x="20" y="138">발주기관 업무 위탁</text>
    <text x="20" y="210">제3자, 상시 점검</text>
    <text x="20" y="294">제3자, 시점 판정</text>
  </g>

  <!-- PMO: 위탁 3단계 -->
  <g stroke="#374151" stroke-width="1.5" fill="#e5e7eb">
    <rect x="190" y="100" width="108" height="40" rx="5"/>
    <rect x="302" y="100" width="456" height="40" rx="5"/>
    <rect x="762" y="100" width="98" height="40" rx="5"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#111827">
    <text x="244" y="125">기획</text>
    <text x="530" y="125">집행단계 — 관리·감독, 위험 보고, 결정 지원</text>
    <text x="811" y="125">사후관리</text>
  </g>

  <!-- 상주감리 -->
  <rect x="302" y="172" width="456" height="40" rx="5" fill="#eef5f1" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="530" y="197" font-size="13" text-anchor="middle" fill="#14532d">사업 수행 기간 상주 — 업무 8가지, 정기적으로 발주자에게 보고</text>

  <!-- 겸직 금지 -->
  <path d="M600 216 V252" stroke="#9d0208" stroke-width="1.6" stroke-dasharray="5 4"/>
  <rect x="608" y="224" width="236" height="20" fill="#fbfaf7"/>
  <text x="612" y="239" font-size="13" fill="#9d0208">상주감리원은 단계별 감리에 참여 불가</text>

  <!-- 단계별 감리 -->
  <rect x="320" y="256" width="110" height="40" rx="5" fill="#fff7ed" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="375" y="281" font-size="13" text-anchor="middle" fill="#b45309">요구정의 생략</text>
  <g fill="#ffffff" stroke="#2d6a4f" stroke-width="1.8">
    <rect x="470" y="256" width="120" height="40" rx="5"/>
    <rect x="625" y="256" width="120" height="40" rx="5"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#14532d">
    <text x="530" y="281">설계단계 감리</text>
    <text x="685" y="281">종료단계 감리</text>
  </g>

  <line x1="20" y1="322" x2="860" y2="322" stroke="#d1d5db" stroke-width="1"/>
  <text x="20" y="346" font-size="13" fill="#374151">PMO는 발주기관의 관리·감독 업무를 위탁받은 쪽이고, 두 감리는 이해관계에서 독립된 제3자다.</text>
  <text x="20" y="370" font-size="13" fill="#6b7280">상주감리를 추가하면 요구정의단계 감리를 생략하고, 그 점검(요구사항정의서 반영 여부)은 상주감리원이 직접 한다.</text>
</svg>
