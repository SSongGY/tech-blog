<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#fbfbf9"/>

  <text x="440" y="30" font-size="17" font-weight="bold" fill="#1b3a2f" text-anchor="middle">루프라인 — 연산강도가 낮으면 연산기를 채우지 못한다</text>

  <!-- axes -->
  <line x1="130" y1="320" x2="820" y2="320" stroke="#333" stroke-width="2"/>
  <line x1="130" y1="320" x2="130" y2="60" stroke="#333" stroke-width="2"/>

  <text x="475" y="372" font-size="14" fill="#333" text-anchor="middle">연산강도 — 가중치 1바이트를 읽을 때 수행하는 연산 수 (로그)</text>
  <text x="34" y="190" font-size="14" fill="#333" text-anchor="middle" transform="rotate(-90 34 190)">달성 성능 (연산/초, 로그)</text>

  <!-- x ticks -->
  <line x1="190" y1="320" x2="190" y2="326" stroke="#333" stroke-width="1.5"/>
  <text x="190" y="344" font-size="13" fill="#555" text-anchor="middle">1</text>
  <line x1="340" y1="320" x2="340" y2="326" stroke="#333" stroke-width="1.5"/>
  <text x="340" y="344" font-size="13" fill="#555" text-anchor="middle">10</text>
  <line x1="490" y1="320" x2="490" y2="326" stroke="#333" stroke-width="1.5"/>
  <text x="490" y="344" font-size="13" fill="#555" text-anchor="middle">100</text>
  <line x1="640" y1="320" x2="640" y2="326" stroke="#333" stroke-width="1.5"/>
  <text x="640" y="344" font-size="13" fill="#555" text-anchor="middle">1,000</text>
  <line x1="790" y1="320" x2="790" y2="326" stroke="#333" stroke-width="1.5"/>
  <text x="790" y="344" font-size="13" fill="#555" text-anchor="middle">10,000</text>

  <!-- roofline -->
  <line x1="150" y1="302" x2="660" y2="92" stroke="#9d0208" stroke-width="3"/>
  <line x1="660" y1="92" x2="818" y2="92" stroke="#2d6a4f" stroke-width="3"/>

  <!-- ridge point -->
  <circle cx="660" cy="92" r="6" fill="#1b3a2f"/>
  <line x1="660" y1="92" x2="660" y2="320" stroke="#777" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="660" y="74" font-size="14" font-weight="bold" fill="#1b3a2f" text-anchor="middle">능선점 ≈ 1,350 연산/바이트</text>

  <text x="300" y="232" font-size="14" font-weight="bold" fill="#9d0208" transform="rotate(-22 300 232)">메모리 대역폭이 상한</text>
  <text x="740" y="80" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">연산 성능이 상한</text>

  <!-- workload markers -->
  <circle cx="300" cy="264" r="5" fill="#9d0208"/>
  <text x="300" y="288" font-size="13" fill="#7a1a1a" text-anchor="middle">완전연결·순환 계층</text>
  <circle cx="460" cy="216" r="5" fill="#9d0208"/>
  <text x="462" y="206" font-size="13" fill="#7a1a1a" text-anchor="middle">가중치를 매번 다시 읽는 계층</text>
  <circle cx="745" cy="120" r="5" fill="#2d6a4f"/>
  <text x="745" y="142" font-size="13" fill="#1b3a2f" text-anchor="middle">가중치를 재사용하는 합성곱 계층</text>

  <text x="440" y="392" font-size="13" fill="#444" text-anchor="middle">연산강도가 능선점 왼쪽이면 연산기를 늘려도 성능이 오르지 않는다 — 대역폭과 온칩 메모리를 늘려야 한다</text>
</svg>
