<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="440" fill="#fdfdfb"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- 왼쪽: Advanced RAG -->
  <text x="200" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Advanced RAG — 고정된 직선 흐름</text>

  <rect x="40" y="52" width="320" height="58" rx="6" fill="#eef2f7" stroke="#334155" stroke-width="1.6"/>
  <text x="200" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">검색 전 최적화</text>
  <text x="200" y="98" text-anchor="middle" font-size="13" fill="#334155">청크 분할·메타데이터 / 질의 재작성·확장</text>

  <path d="M 200 110 L 200 136" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <rect x="40" y="138" width="320" height="58" rx="6" fill="#eef2f7" stroke="#334155" stroke-width="1.6"/>
  <text x="200" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">검색</text>
  <text x="200" y="184" text-anchor="middle" font-size="13" fill="#334155">임베딩 유사도 top-K (하이브리드 가능)</text>

  <path d="M 200 196 L 200 222" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <rect x="40" y="224" width="320" height="58" rx="6" fill="#eef2f7" stroke="#334155" stroke-width="1.6"/>
  <text x="200" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">검색 후 최적화</text>
  <text x="200" y="270" text-anchor="middle" font-size="13" fill="#334155">재순위화 / 컨텍스트 압축</text>

  <path d="M 200 282 L 200 308" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <rect x="40" y="310" width="320" height="58" rx="6" fill="#eef2f7" stroke="#334155" stroke-width="1.6"/>
  <text x="200" y="334" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">생성</text>
  <text x="200" y="356" text-anchor="middle" font-size="13" fill="#334155">질의 + 문서를 프롬프트로 LLM 호출</text>

  <text x="200" y="398" text-anchor="middle" font-size="13" fill="#9d0208">모든 질의가 같은 순서를 한 번 지난다</text>

  <!-- 구분선 -->
  <path d="M 440 40 L 440 420" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 5" fill="none"/>

  <!-- 오른쪽: Modular RAG -->
  <text x="660" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Modular RAG — 모듈 + 오케스트레이션</text>

  <rect x="480" y="52" width="360" height="82" rx="6" fill="#e7f2ec" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="660" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">오케스트레이션 모듈</text>
  <text x="660" y="100" text-anchor="middle" font-size="13" fill="#0f172a">라우팅: 어느 흐름으로 보낼지</text>
  <text x="660" y="121" text-anchor="middle" font-size="13" fill="#0f172a">스케줄링: 재검색·종료 시점 / 융합: 갈래 합치기</text>

  <path d="M 660 136 L 660 160" stroke="#334155" stroke-width="1.6" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <rect x="480" y="162" width="360" height="120" rx="6" fill="#eef2f7" stroke="#334155" stroke-width="1.6"/>
  <text x="660" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">교체 가능한 모듈 5종</text>
  <text x="660" y="210" text-anchor="middle" font-size="13" fill="#334155">인덱싱 · 검색 전 · 검색 · 검색 후 · 생성</text>
  <text x="660" y="234" text-anchor="middle" font-size="13" fill="#334155">각 모듈 = 하위 모듈 → 연산자 (3계층)</text>
  <text x="660" y="258" text-anchor="middle" font-size="13" fill="#334155">예: 검색 = 희소·밀집·하이브리드 중 선택</text>

  <path d="M 660 282 L 660 308" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <rect x="480" y="310" width="360" height="58" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.6"/>
  <text x="660" y="334" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c2d12">흐름 패턴 4가지</text>
  <text x="660" y="356" text-anchor="middle" font-size="13" fill="#7c2d12">선형 · 조건 · 분기 · 반복</text>

  <text x="660" y="398" text-anchor="middle" font-size="13" fill="#2d6a4f">질의마다 다른 경로를 계산 그래프로 짠다</text>
</svg>
