<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="430" fill="#ffffff"/>

  <text x="440" y="34" font-size="17" font-weight="bold" fill="#1b2430" text-anchor="middle">클라우드 네이티브 전환에서 TA·AA 책임 경계</text>

  <!-- AA band -->
  <rect x="40" y="55" width="800" height="95" rx="6" fill="#f0f7f2" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="58" y="80" font-size="15" font-weight="bold" fill="#2d6a4f">AA 책임</text>
  <text x="58" y="100" font-size="13" fill="#2d6a4f">업무 기능</text>

  <rect x="180" y="80" width="300" height="52" rx="4" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="330" y="103" font-size="15" font-weight="bold" fill="#1b2430" text-anchor="middle">마이크로서비스</text>
  <text x="330" y="122" font-size="13" fill="#44525f" text-anchor="middle">업무 로직 · 세밀한 인가</text>

  <rect x="505" y="80" width="300" height="52" rx="4" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="655" y="103" font-size="15" font-weight="bold" fill="#1b2430" text-anchor="middle">서비스 간 계약</text>
  <text x="655" y="122" font-size="13" fill="#44525f" text-anchor="middle">API · 이벤트 · 데이터 소유</text>

  <!-- joint band -->
  <rect x="40" y="178" width="800" height="82" rx="6" fill="#fdf6ec" stroke="#b45309" stroke-width="1.5"/>
  <text x="58" y="203" font-size="15" font-weight="bold" fill="#b45309">공동 결정</text>
  <text x="58" y="223" font-size="13" fill="#b45309">합의 지점</text>

  <rect x="180" y="196" width="625" height="48" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="492" y="226" font-size="15" font-weight="bold" fill="#1b2430" text-anchor="middle">분해 단위 · 비기능 목표 · 보안 기능 분담</text>

  <!-- TA band -->
  <rect x="40" y="288" width="800" height="112" rx="6" fill="#f2f5fa" stroke="#1d3557" stroke-width="1.5"/>
  <text x="58" y="315" font-size="15" font-weight="bold" fill="#1d3557">TA 책임</text>
  <text x="58" y="335" font-size="13" fill="#1d3557">실행 기반</text>

  <rect x="180" y="315" width="196" height="62" rx="4" fill="#ffffff" stroke="#1d3557" stroke-width="1.5"/>
  <text x="278" y="341" font-size="15" font-weight="bold" fill="#1b2430" text-anchor="middle">사이드카 프록시</text>
  <text x="278" y="362" font-size="13" fill="#44525f" text-anchor="middle">데이터 플레인</text>

  <rect x="394" y="315" width="196" height="62" rx="4" fill="#ffffff" stroke="#1d3557" stroke-width="1.5"/>
  <text x="492" y="341" font-size="15" font-weight="bold" fill="#1b2430" text-anchor="middle">컨트롤 플레인</text>
  <text x="492" y="362" font-size="13" fill="#44525f" text-anchor="middle">정책 주입 · 관측</text>

  <rect x="608" y="315" width="197" height="62" rx="4" fill="#ffffff" stroke="#1d3557" stroke-width="1.5"/>
  <text x="706" y="341" font-size="15" font-weight="bold" fill="#1b2430" text-anchor="middle">컨테이너 런타임</text>
  <text x="706" y="362" font-size="13" fill="#44525f" text-anchor="middle">오케스트레이션</text>

  <!-- connectors -->
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>
  <line x1="492" y1="150" x2="492" y2="178" stroke="#b45309" stroke-width="2" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <line x1="492" y1="260" x2="492" y2="288" stroke="#b45309" stroke-width="2" marker-start="url(#arw)" marker-end="url(#arw)"/>
</svg>
