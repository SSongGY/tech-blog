<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <text x="440" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#222222">CXL의 구조 — 하나의 링크 위 3개 프로토콜, 조합에 따른 장치 3유형</text>

  <!-- Host -->
  <rect x="40" y="55" width="800" height="70" rx="4" fill="#f4f4f4" stroke="#333333" stroke-width="1.5"/>
  <text x="440" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">호스트 프로세서 (CPU + 캐시 + 호스트 메모리)</text>
  <text x="440" y="106" text-anchor="middle" font-size="13" fill="#333333">Root Port → (Switch) → Endpoint 순으로 연결</text>

  <!-- Link: three protocols -->
  <rect x="40" y="150" width="800" height="100" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2" stroke-dasharray="6 3"/>
  <text x="56" y="172" font-size="13" fill="#555555">CXL 링크 — 프로토콜을 동적으로 다중화</text>
  <rect x="70" y="182" width="220" height="56" rx="4" fill="#eef2f8" stroke="#333333" stroke-width="1.2"/>
  <text x="180" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">CXL.io</text>
  <text x="180" y="226" text-anchor="middle" font-size="13" fill="#333333">초기화·설정·I/O (PCIe 기반)</text>
  <rect x="330" y="182" width="220" height="56" rx="4" fill="#ecf6f0" stroke="#2d6a4f" stroke-width="1.2"/>
  <text x="440" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">CXL.cache</text>
  <text x="440" y="226" text-anchor="middle" font-size="13" fill="#333333">장치 → 호스트 메모리 캐싱</text>
  <rect x="590" y="182" width="220" height="56" rx="4" fill="#fdf4e7" stroke="#b45309" stroke-width="1.2"/>
  <text x="700" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">CXL.mem</text>
  <text x="700" y="226" text-anchor="middle" font-size="13" fill="#333333">CPU → 장치 메모리 접근</text>

  <text x="440" y="270" text-anchor="middle" font-size="13" fill="#555555">물리 계층: PCIe 5.0 PHY(1.x·2.0, 32GT/s) → PCIe 6.0(3.x, 64GT/s) → 128GT/s(4.0)</text>

  <!-- Device types -->
  <rect x="40" y="300" width="240" height="100" rx="4" fill="#f4f4f4" stroke="#333333" stroke-width="1.5"/>
  <text x="160" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">Type 1</text>
  <text x="160" y="348" text-anchor="middle" font-size="13" fill="#333333">io + cache</text>
  <text x="160" y="370" text-anchor="middle" font-size="13" fill="#333333">장치 메모리(HDM) 없음</text>
  <text x="160" y="390" text-anchor="middle" font-size="13" fill="#555555">예: 스마트 NIC</text>

  <rect x="320" y="300" width="240" height="100" rx="4" fill="#f4f4f4" stroke="#333333" stroke-width="1.5"/>
  <text x="440" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">Type 2</text>
  <text x="440" y="348" text-anchor="middle" font-size="13" fill="#333333">io + cache + mem</text>
  <text x="440" y="370" text-anchor="middle" font-size="13" fill="#333333">캐시와 HDM을 함께 가짐</text>
  <text x="440" y="390" text-anchor="middle" font-size="13" fill="#555555">예: 메모리 달린 가속기</text>

  <rect x="600" y="300" width="240" height="100" rx="4" fill="#f4f4f4" stroke="#333333" stroke-width="1.5"/>
  <text x="720" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">Type 3</text>
  <text x="720" y="348" text-anchor="middle" font-size="13" fill="#333333">io + mem</text>
  <text x="720" y="370" text-anchor="middle" font-size="13" fill="#333333">HDM 제공(휘발·영구)</text>
  <text x="720" y="390" text-anchor="middle" font-size="13" fill="#555555">예: 메모리 확장기</text>

  <line x1="440" y1="125" x2="440" y2="148" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <line x1="160" y1="278" x2="160" y2="298" stroke="#333333" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="440" y1="278" x2="440" y2="298" stroke="#333333" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="720" y1="278" x2="720" y2="298" stroke="#333333" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="440" y="428" text-anchor="middle" font-size="13" fill="#555555">HDM: Host-managed Device Memory — 장치에 붙어 있지만 호스트가 주소 공간에 넣어 관리하는 메모리</text>
</svg>
