<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 412" width="880" height="412" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="412" fill="#fbfbfd"/>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="15" font-weight="bold" fill="#2d6a4f">본문 4~10절 — 인증 심사의 대상이 되는 요구사항</text>

  <!-- row 1 -->
  <rect x="24" y="48" width="404" height="54" rx="6" fill="#eef6f1" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="226" y="72" font-size="14" font-weight="bold" fill="#1f3d2c" text-anchor="middle">4. 조직 상황</text>
  <text x="226" y="92" font-size="13" fill="#39533f" text-anchor="middle">내·외부 이슈 · 이해관계자 · AIMS 범위</text>

  <rect x="444" y="48" width="404" height="54" rx="6" fill="#eef6f1" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="646" y="72" font-size="14" font-weight="bold" fill="#1f3d2c" text-anchor="middle">5. 리더십</text>
  <text x="646" y="92" font-size="13" fill="#39533f" text-anchor="middle">AI 정책 · 역할 · 책임 · 권한</text>

  <line x1="428" y1="75" x2="440" y2="75" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="117" y1="102" x2="117" y2="134" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- row 2 : PDCA -->
  <rect x="24" y="140" width="186" height="84" rx="6" fill="#eef6f1" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="117" y="166" font-size="14" font-weight="bold" fill="#1f3d2c" text-anchor="middle">6. 기획 (Plan)</text>
  <text x="117" y="188" font-size="13" fill="#39533f" text-anchor="middle">위험평가 · 위험처리</text>
  <text x="117" y="208" font-size="13" fill="#39533f" text-anchor="middle">AI 영향평가</text>

  <rect x="238" y="140" width="186" height="84" rx="6" fill="#eef6f1" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="331" y="166" font-size="14" font-weight="bold" fill="#1f3d2c" text-anchor="middle">7·8. 지원·운영 (Do)</text>
  <text x="331" y="188" font-size="13" fill="#39533f" text-anchor="middle">자원 · 역량 · 인식</text>
  <text x="331" y="208" font-size="13" fill="#39533f" text-anchor="middle">운영 기획 및 통제</text>

  <rect x="452" y="140" width="186" height="84" rx="6" fill="#eef6f1" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="545" y="166" font-size="14" font-weight="bold" fill="#1f3d2c" text-anchor="middle">9. 성과평가 (Check)</text>
  <text x="545" y="188" font-size="13" fill="#39533f" text-anchor="middle">모니터링 · 내부심사</text>
  <text x="545" y="208" font-size="13" fill="#39533f" text-anchor="middle">경영검토</text>

  <rect x="666" y="140" width="186" height="84" rx="6" fill="#eef6f1" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="759" y="166" font-size="14" font-weight="bold" fill="#1f3d2c" text-anchor="middle">10. 개선 (Act)</text>
  <text x="759" y="188" font-size="13" fill="#39533f" text-anchor="middle">부적합 · 시정조치</text>
  <text x="759" y="208" font-size="13" fill="#39533f" text-anchor="middle">지속적 개선</text>

  <line x1="210" y1="182" x2="234" y2="182" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="424" y1="182" x2="448" y2="182" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="638" y1="182" x2="662" y2="182" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- link to annex -->
  <line x1="117" y1="224" x2="117" y2="306" stroke="#b45309" stroke-width="1.6" marker-end="url(#aro)"/>
  <text x="132" y="262" font-size="13" fill="#b45309">6.1.3 위험처리에서 통제를 고른다</text>

  <text x="420" y="296" font-size="15" font-weight="bold" fill="#b45309">부속서 — 고르고 정당화하는 통제와 지침</text>

  <!-- row 3 : annexes -->
  <rect x="24" y="312" width="270" height="84" rx="6" fill="#fdf3e4" stroke="#b45309" stroke-width="1.6"/>
  <text x="159" y="338" font-size="14" font-weight="bold" fill="#7a3b05" text-anchor="middle">부속서 A — 통제 모음</text>
  <text x="159" y="360" font-size="13" fill="#8a4a0d" text-anchor="middle">A.2~A.10 · 9개 영역</text>
  <text x="159" y="380" font-size="13" fill="#8a4a0d" text-anchor="middle">통제 38개</text>

  <rect x="314" y="312" width="250" height="84" rx="6" fill="#fdf3e4" stroke="#b45309" stroke-width="1.6"/>
  <text x="439" y="338" font-size="14" font-weight="bold" fill="#7a3b05" text-anchor="middle">적용성 선언서 (SoA)</text>
  <text x="439" y="360" font-size="13" fill="#8a4a0d" text-anchor="middle">포함·제외 사유를 적는다</text>
  <text x="439" y="380" font-size="13" fill="#8a4a0d" text-anchor="middle">6.1.3의 산출물</text>

  <rect x="584" y="312" width="264" height="84" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/>
  <text x="716" y="338" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">부속서 B · C · D</text>
  <text x="716" y="360" font-size="13" fill="#4b5563" text-anchor="middle">구현지침 · AI 목표와 위험원</text>
  <text x="716" y="380" font-size="13" fill="#4b5563" text-anchor="middle">분야별 적용 · 타 표준 통합</text>

  <line x1="294" y1="354" x2="310" y2="354" stroke="#b45309" stroke-width="1.6" marker-end="url(#aro)"/>
</svg>
