<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420">
  <rect x="0" y="0" width="880" height="420" fill="#fbfbfa"/>

  <text x="50" y="40" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f2937">테일러링의 입력과 결과, 그리고 선도개발의 되먹임</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#374151"/>
    </marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2d6a4f"/>
    </marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- inputs -->
  <rect x="50" y="78" width="200" height="54" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="150" y="101" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">조직 표준 프로세스</text>
  <text x="150" y="121" font-family="sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">방법론 전체 집합</text>

  <rect x="50" y="146" width="200" height="54" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="150" y="169" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">프로젝트 특성</text>
  <text x="150" y="189" font-family="sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">규모 · 기간 · 보유 기술</text>

  <rect x="50" y="214" width="200" height="54" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="150" y="237" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">외부 제약</text>
  <text x="150" y="257" font-family="sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">법령 · 계약 · 품질 기준</text>

  <!-- tailoring -->
  <rect x="330" y="120" width="190" height="80" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2.5"/>
  <text x="425" y="152" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">테일러링</text>
  <text x="425" y="175" font-family="sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">프로세스 선택 · 조정</text>

  <!-- output -->
  <rect x="600" y="120" width="230" height="80" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="715" y="152" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">테일러링 결과서</text>
  <text x="715" y="175" font-family="sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">수행 활동 · 산출물 목록 확정</text>

  <!-- pilot -->
  <rect x="430" y="280" width="260" height="62" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="560" y="307" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">선도개발</text>
  <text x="560" y="328" font-family="sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">대표 업무 영역을 먼저 한 바퀴</text>

  <!-- arrows -->
  <line x1="252" y1="105" x2="326" y2="144" stroke="#374151" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="252" y1="173" x2="326" y2="160" stroke="#374151" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="252" y1="241" x2="326" y2="178" stroke="#374151" stroke-width="2" marker-end="url(#a1)"/>

  <line x1="522" y1="160" x2="596" y2="160" stroke="#2d6a4f" stroke-width="2" marker-end="url(#a2)"/>

  <line x1="712" y1="202" x2="652" y2="276" stroke="#2d6a4f" stroke-width="2" marker-end="url(#a2)"/>
  <text x="730" y="248" font-family="sans-serif" font-size="13" fill="#2d6a4f">확정안으로 수행</text>

  <line x1="432" y1="300" x2="392" y2="204" stroke="#b45309" stroke-width="2" marker-end="url(#a3)"/>
  <text x="330" y="314" font-family="sans-serif" font-size="13" fill="#b45309" text-anchor="end">실제로 쓴 것만 남겨 다시 조정</text>

  <line x1="50" y1="372" x2="830" y2="372" stroke="#d1d5db" stroke-width="1"/>
  <text x="50" y="396" font-family="sans-serif" font-size="13" fill="#4b5563">되먹임 없이 선도개발만 끝내면 본 개발은 조정되지 않은 방법론으로 간다 — 선도개발이 아니라 1차 개발이 된다</text>
</svg>
