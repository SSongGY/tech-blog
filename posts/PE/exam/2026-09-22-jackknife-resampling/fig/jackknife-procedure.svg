<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="380" fill="#fdfdfb"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- 1. 원 표본 -->
  <rect x="290" y="20" width="300" height="46" rx="6" fill="#eef2f7" stroke="#334155" stroke-width="1.6"/>
  <text x="440" y="49" text-anchor="middle" font-size="15" fill="#0f172a">원 표본  X = {x1, x2, …, xn},  추정값 θ̂ = s(X)</text>

  <!-- 원 표본 → 잭나이프 표본 -->
  <path d="M 440 66 L 440 86" stroke="#334155" stroke-width="1.6" fill="none"/>
  <path d="M 110 86 L 770 86" stroke="#334155" stroke-width="1.6" fill="none"/>
  <path d="M 110 86 L 110 108" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 330 86 L 330 108" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 550 86 L 550 108" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 770 86 L 770 108" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- 2. 관측치 하나씩 뺀 n개의 표본과 복제값 -->
  <rect x="12" y="110" width="196" height="62" rx="6" fill="#eef2f7" stroke="#334155" stroke-width="1.6"/>
  <text x="110" y="133" text-anchor="middle" font-size="14" fill="#0f172a">x1 하나만 뺀다</text>
  <text x="110" y="156" text-anchor="middle" font-size="14" fill="#334155">θ̂(1) = s(X(1))</text>

  <rect x="232" y="110" width="196" height="62" rx="6" fill="#eef2f7" stroke="#334155" stroke-width="1.6"/>
  <text x="330" y="133" text-anchor="middle" font-size="14" fill="#0f172a">x2 하나만 뺀다</text>
  <text x="330" y="156" text-anchor="middle" font-size="14" fill="#334155">θ̂(2) = s(X(2))</text>

  <rect x="452" y="110" width="196" height="62" rx="6" fill="#eef2f7" stroke="#334155" stroke-width="1.6"/>
  <text x="550" y="147" text-anchor="middle" font-size="18" fill="#334155">… 모두 n 번 …</text>

  <rect x="672" y="110" width="196" height="62" rx="6" fill="#eef2f7" stroke="#334155" stroke-width="1.6"/>
  <text x="770" y="133" text-anchor="middle" font-size="14" fill="#0f172a">xn 하나만 뺀다</text>
  <text x="770" y="156" text-anchor="middle" font-size="14" fill="#334155">θ̂(n) = s(X(n))</text>

  <!-- 복제값 → 평균 -->
  <path d="M 110 172 L 110 192" stroke="#334155" stroke-width="1.6" fill="none"/>
  <path d="M 330 172 L 330 192" stroke="#334155" stroke-width="1.6" fill="none"/>
  <path d="M 550 172 L 550 192" stroke="#334155" stroke-width="1.6" fill="none"/>
  <path d="M 770 172 L 770 192" stroke="#334155" stroke-width="1.6" fill="none"/>
  <path d="M 110 192 L 770 192" stroke="#334155" stroke-width="1.6" fill="none"/>
  <path d="M 440 192 L 440 212" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- 3. 복제값 평균 -->
  <rect x="270" y="214" width="340" height="46" rx="6" fill="#eef2f7" stroke="#334155" stroke-width="1.6"/>
  <text x="440" y="243" text-anchor="middle" font-size="15" fill="#0f172a">복제값 평균  θ̂(·) = (1/n) Σ θ̂(i)</text>

  <!-- 평균 → 두 결과 -->
  <path d="M 440 260 L 440 274" stroke="#334155" stroke-width="1.6" fill="none"/>
  <path d="M 220 274 L 660 274" stroke="#334155" stroke-width="1.6" fill="none"/>
  <path d="M 220 274 L 220 294" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 660 274 L 660 294" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- 4. 두 가지 결과 -->
  <rect x="12" y="296" width="416" height="72" rx="6" fill="#e7f2ec" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="220" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">편향 감소</text>
  <text x="220" y="339" text-anchor="middle" font-size="14" fill="#0f172a">편향 추정  (n−1) × (θ̂(·) − θ̂)</text>
  <text x="220" y="359" text-anchor="middle" font-size="14" fill="#0f172a">보정 추정량  n θ̂ − (n−1) θ̂(·)</text>

  <rect x="452" y="296" width="416" height="72" rx="6" fill="#e7f2ec" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="660" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">분산 추정</text>
  <text x="660" y="339" text-anchor="middle" font-size="14" fill="#0f172a">분산  v = ((n−1)/n) × Σ (θ̂(i) − θ̂(·))²</text>
  <text x="660" y="359" text-anchor="middle" font-size="14" fill="#0f172a">표준오차  SE = √v</text>
</svg>
