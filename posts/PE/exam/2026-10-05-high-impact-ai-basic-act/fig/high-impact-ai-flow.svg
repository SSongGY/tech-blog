<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="440" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">고영향 인공지능의 판단 흐름과 사업자 의무 (인공지능 기본법)</text>

  <!-- A 사전 검토 -->
  <rect x="20" y="60" width="200" height="110" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="120" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">사전 검토</text>
  <text x="120" y="122" text-anchor="middle" font-size="13" fill="#1e293b">인공지능사업자</text>
  <text x="120" y="146" text-anchor="middle" font-size="13" fill="#475569">(제33조 제1항)</text>

  <!-- B 요건 ① 영역 -->
  <rect x="260" y="56" width="250" height="52" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="385" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">요건 ① 활용 영역</text>
  <text x="385" y="98" text-anchor="middle" font-size="13" fill="#1e293b">법정 10개 영역 + 대통령령 영역</text>

  <text x="385" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">그리고</text>

  <!-- C 요건 ② 중대한 영향 -->
  <rect x="260" y="134" width="250" height="52" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="385" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">요건 ② 중대한 영향·위험 우려</text>
  <text x="385" y="176" text-anchor="middle" font-size="13" fill="#1e293b">생명 · 신체의 안전 · 기본권</text>

  <!-- D 과기정통부 확인 -->
  <rect x="550" y="60" width="310" height="110" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="705" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">과기정통부 장관 확인 (필요 시)</text>
  <text x="705" y="113" text-anchor="middle" font-size="13" fill="#1e293b">30일 이내 회신, 1회 30일 연장</text>
  <text x="705" y="134" text-anchor="middle" font-size="13" fill="#1e293b">이의 시 재확인 · 전문위원회 자문</text>
  <text x="705" y="156" text-anchor="middle" font-size="13" fill="#475569">(제33조 제2항, 시행령 제25조)</text>

  <!-- 화살표: A → B, C -->
  <line x1="220" y1="90" x2="258" y2="82" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="220" y1="140" x2="258" y2="158" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <!-- B, C → D -->
  <line x1="510" y1="82" x2="548" y2="100" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="510" y1="158" x2="548" y2="140" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 해당 시 의무로 분기하는 버스 -->
  <line x1="705" y1="170" x2="705" y2="210" stroke="#334155" stroke-width="2"/>
  <line x1="117" y1="210" x2="762" y2="210" stroke="#334155" stroke-width="2"/>
  <text x="440" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d6a4f">두 요건을 모두 충족 → 고영향 인공지능 → 제공 시 사업자 의무</text>
  <line x1="117" y1="210" x2="117" y2="244" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="332" y1="210" x2="332" y2="244" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="547" y1="210" x2="547" y2="244" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="762" y1="210" x2="762" y2="244" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <!-- E 투명성 -->
  <rect x="20" y="246" width="195" height="100" rx="6" fill="#ecfdf5" stroke="#2d6a4f" stroke-width="2"/>
  <text x="117" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">투명성</text>
  <text x="117" y="298" text-anchor="middle" font-size="13" fill="#1e293b">AI 기반 운용 사실</text>
  <text x="117" y="317" text-anchor="middle" font-size="13" fill="#1e293b">이용자에게 사전 고지</text>
  <text x="117" y="337" text-anchor="middle" font-size="13" fill="#475569">(제31조 제1항)</text>

  <!-- F 안전성·신뢰성 조치 -->
  <rect x="235" y="246" width="195" height="100" rx="6" fill="#ecfdf5" stroke="#2d6a4f" stroke-width="2"/>
  <text x="332" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">안전성·신뢰성 조치</text>
  <text x="332" y="298" text-anchor="middle" font-size="13" fill="#1e293b">위험관리 · 설명 · 이용자 보호</text>
  <text x="332" y="317" text-anchor="middle" font-size="13" fill="#1e293b">사람 감독 · 문서 · 위원회</text>
  <text x="332" y="337" text-anchor="middle" font-size="13" fill="#475569">(제34조 제1항 6가지)</text>

  <!-- G 영향평가 -->
  <rect x="450" y="246" width="195" height="100" rx="6" fill="#ecfdf5" stroke="#2d6a4f" stroke-width="2"/>
  <text x="547" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">기본권 영향평가</text>
  <text x="547" y="298" text-anchor="middle" font-size="13" fill="#1e293b">사전 실시 노력 의무</text>
  <text x="547" y="317" text-anchor="middle" font-size="13" fill="#1e293b">취약계층 특성 반영</text>
  <text x="547" y="337" text-anchor="middle" font-size="13" fill="#475569">(제35조, 시행령 제28조)</text>

  <!-- H 기록·게시 -->
  <rect x="665" y="246" width="195" height="100" rx="6" fill="#ecfdf5" stroke="#2d6a4f" stroke-width="2"/>
  <text x="762" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">근거 보관 · 게시</text>
  <text x="762" y="298" text-anchor="middle" font-size="13" fill="#1e293b">이행 근거 문서 5년 보관</text>
  <text x="762" y="317" text-anchor="middle" font-size="13" fill="#1e293b">주요 내용 홈페이지 게시</text>
  <text x="762" y="337" text-anchor="middle" font-size="13" fill="#475569">(시행령 제27조)</text>

  <text x="20" y="380" font-size="13" fill="#475569">주황 테두리: 해당 여부를 가르는 두 요건. 녹색: 고영향 인공지능을 제공하는 사업자가 이행할 의무.</text>
  <text x="20" y="402" font-size="13" fill="#475569">영향평가만 노력 의무이고, 국가기관등은 영향평가를 거친 제품·서비스를 우선 고려한다 (제35조 제2항).</text>
</svg>
