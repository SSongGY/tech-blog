<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>

  <text x="440" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#222222">기업 AX 전략적 추진 절차 — 6단계와 전 단계 거버넌스</text>

  <!-- 1행: 1 → 2 → 3 -->
  <g font-size="13" fill="#222222" text-anchor="middle">
    <rect x="60" y="60" width="220" height="92" rx="8" fill="#eef6f1" stroke="#2d6a4f" stroke-width="1.5"/>
    <text x="170" y="86" font-size="15" font-weight="bold">① 전략·사용 사례 도출</text>
    <text x="170" y="110">사업 문제 → 사용 사례 진술</text>
    <text x="170" y="132">생성형·비생성형 AI 판단</text>

    <rect x="330" y="60" width="220" height="92" rx="8" fill="#eef6f1" stroke="#2d6a4f" stroke-width="1.5"/>
    <text x="440" y="86" font-size="15" font-weight="bold">② 준비도 진단</text>
    <text x="440" y="110">데이터·역량·인프라 점검</text>
    <text x="440" y="132">성숙도 수준 평가</text>

    <rect x="600" y="60" width="220" height="92" rx="8" fill="#eef6f1" stroke="#2d6a4f" stroke-width="1.5"/>
    <text x="710" y="86" font-size="15" font-weight="bold">③ 우선순위·로드맵</text>
    <text x="710" y="110" text-anchor="middle">사업 가치·실현 가능성 평가</text>
    <text x="710" y="132">성공 기준 정의</text>

    <!-- 2행: 4 ← 5 ← 6 (오른쪽에서 왼쪽) -->
    <rect x="600" y="212" width="220" height="92" rx="8" fill="#eef6f1" stroke="#2d6a4f" stroke-width="1.5"/>
    <text x="710" y="238" font-size="15" font-weight="bold">④ PoC·파일럿</text>
    <text x="710" y="262">저위험 사례로 검증</text>
    <text x="710" y="284">결과를 로드맵에 반영</text>

    <rect x="330" y="212" width="220" height="92" rx="8" fill="#eef6f1" stroke="#2d6a4f" stroke-width="1.5"/>
    <text x="440" y="238" font-size="15" font-weight="bold">⑤ 기반 구축·확산</text>
    <text x="440" y="262">데이터 플랫폼·시스템 연계</text>
    <text x="440" y="284">MLOps·LLMOps 체계</text>

    <rect x="60" y="212" width="220" height="92" rx="8" fill="#eef6f1" stroke="#2d6a4f" stroke-width="1.5"/>
    <text x="170" y="238" font-size="15" font-weight="bold">⑥ 운영·성과 관리</text>
    <text x="170" y="262">성능 감시·재학습</text>
    <text x="170" y="284">사업 성과 지표 측정</text>
  </g>

  <!-- 흐름 화살표 -->
  <line x1="282" y1="106" x2="326" y2="106" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="552" y1="106" x2="596" y2="106" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="154" x2="710" y2="208" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="598" y1="258" x2="554" y2="258" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="328" y1="258" x2="284" y2="258" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 환류: ⑥ → ① -->
  <path d="M60,258 L32,258 L32,106 L56,106" fill="none" stroke="#555555" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>
  <text x="46" y="186" font-size="13" fill="#555555" text-anchor="middle" transform="rotate(-90 46 186)">성과 환류</text>

  <!-- 거버넌스 띠 -->
  <rect x="32" y="340" width="788" height="96" rx="8" fill="#f4f4f4" stroke="#555555" stroke-width="1.5"/>
  <text x="426" y="368" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">AI 거버넌스 — ①~⑥ 전 단계에 걸쳐 작동</text>
  <text x="426" y="394" font-size="13" fill="#222222" text-anchor="middle">ISO/IEC 42001 경영시스템: 정책·역할·위험평가·AI 시스템 영향평가·내부 심사</text>
  <text x="426" y="418" font-size="13" fill="#222222" text-anchor="middle">NIST AI RMF 통제·식별·측정·관리 4기능 · 인공지능 기본법 사업자 의무</text>
</svg>
