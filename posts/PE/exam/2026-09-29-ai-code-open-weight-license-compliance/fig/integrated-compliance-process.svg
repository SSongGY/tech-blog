<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="440" fill="#ffffff"/>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#2d6a4f" stroke-width="1.6"/>
    </marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#4a5568" stroke-width="1.6"/>
    </marker>
  </defs>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">AI 생성 코드 · 오픈웨이트 모델의 통합 컴플라이언스 5단계</text>

  <!-- governance band -->
  <rect x="20" y="50" width="840" height="54" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.6" rx="4"/>
  <text x="440" y="73" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">AI 거버넌스 — ISO/IEC 42001 · NIST AI RMF</text>
  <text x="440" y="94" text-anchor="middle" font-size="13" fill="#4a5568">GOVERN(정책·역할) · MAP(사용처 식별) · MEASURE(검증) · MANAGE(차단·대체)</text>

  <!-- ① -->
  <rect x="20" y="136" width="148" height="116" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.6" rx="4"/>
  <text x="94" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">① 도입 승인</text>
  <text x="94" y="188" text-anchor="middle" font-size="13" fill="#4a5568">AI 도구·모델 등록</text>
  <text x="94" y="208" text-anchor="middle" font-size="13" fill="#4a5568">모델 라이선스 판정</text>
  <text x="94" y="228" text-anchor="middle" font-size="13" fill="#4a5568">허용 목록 관리</text>

  <!-- ② -->
  <rect x="193" y="136" width="148" height="116" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.6" rx="4"/>
  <text x="267" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">② 생성·수집</text>
  <text x="267" y="188" text-anchor="middle" font-size="13" fill="#4a5568">생성 이력 기록</text>
  <text x="267" y="208" text-anchor="middle" font-size="13" fill="#4a5568">(도구·모델·일시)</text>
  <text x="267" y="228" text-anchor="middle" font-size="13" fill="#4a5568">공개 코드 매칭 차단</text>

  <!-- ③ -->
  <rect x="366" y="136" width="148" height="116" fill="#fdf6ec" stroke="#b45309" stroke-width="1.6" rx="4"/>
  <text x="440" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">③ 검증</text>
  <text x="440" y="188" text-anchor="middle" font-size="13" fill="#4a5568">스니펫 매칭</text>
  <text x="440" y="208" text-anchor="middle" font-size="13" fill="#4a5568">라이선스·고지 검출</text>
  <text x="440" y="228" text-anchor="middle" font-size="13" fill="#9d0208">위반 시 차단·대체</text>

  <!-- ④ -->
  <rect x="539" y="136" width="148" height="116" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.6" rx="4"/>
  <text x="613" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">④ 승인·배포</text>
  <text x="613" y="188" text-anchor="middle" font-size="13" fill="#4a5568">SBOM · AI-BOM</text>
  <text x="613" y="208" text-anchor="middle" font-size="13" fill="#4a5568">고지문·소스 제공</text>
  <text x="613" y="228" text-anchor="middle" font-size="13" fill="#4a5568">산출물 보관</text>

  <!-- ⑤ -->
  <rect x="712" y="136" width="148" height="116" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.6" rx="4"/>
  <text x="786" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">⑤ 감시·재평가</text>
  <text x="786" y="188" text-anchor="middle" font-size="13" fill="#4a5568">라이선스 변경 추적</text>
  <text x="786" y="208" text-anchor="middle" font-size="13" fill="#4a5568">정기 감사</text>
  <text x="786" y="228" text-anchor="middle" font-size="13" fill="#4a5568">사고 대응</text>

  <!-- step arrows -->
  <line x1="168" y1="194" x2="189" y2="194" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="341" y1="194" x2="362" y2="194" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="514" y1="194" x2="535" y2="194" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="687" y1="194" x2="708" y2="194" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#a1)"/>

  <!-- feedback -->
  <path d="M786,252 L786,282 L94,282 L94,256" fill="none" stroke="#4a5568" stroke-width="1.4" marker-end="url(#a2)"/>
  <text x="440" y="276" text-anchor="middle" font-size="13" fill="#4a5568">재평가 결과로 허용 목록·정책 갱신</text>

  <!-- OSS compliance band -->
  <rect x="20" y="304" width="840" height="54" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.6" rx="4"/>
  <text x="440" y="327" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">오픈소스 컴플라이언스 — ISO/IEC 5230 (OpenChain)</text>
  <text x="440" y="348" text-anchor="middle" font-size="13" fill="#4a5568">정책·역할 · BOM 관리 · 라이선스 검토·승인 · 컴플라이언스 산출물 제공</text>

  <text x="440" y="392" text-anchor="middle" font-size="13" fill="#4a5568">위 띠는 AI 사용을 통제하는 체계, 아래 띠는 오픈소스 의무를 관리하는 체계</text>
  <text x="440" y="414" text-anchor="middle" font-size="13" fill="#4a5568">두 체계를 따로 돌리지 않고 같은 5단계에 얹는다</text>
</svg>
