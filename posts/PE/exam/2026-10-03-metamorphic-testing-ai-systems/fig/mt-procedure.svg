<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="430" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#1b1b1b" stroke-width="1.6"/>
    </marker>
  </defs>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">메타모픽 테스트 수행 절차 — 개별 정답 대신 출력 사이의 관계를 검사한다</text>

  <!-- source input -->
  <rect x="40" y="62" width="180" height="56" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.6" rx="4"/>
  <text x="130" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">원천 테스트 케이스</text>
  <text x="130" y="106" text-anchor="middle" font-size="13" fill="#4a5568">입력 x₁</text>

  <!-- MR -->
  <rect x="40" y="158" width="180" height="64" fill="#fdf3e7" stroke="#b45309" stroke-width="1.6" rx="4"/>
  <text x="130" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">① 메타모픽 관계 (MR)</text>
  <text x="130" y="206" text-anchor="middle" font-size="13" fill="#4a5568">입력 관계 + 출력 관계</text>

  <!-- follow-up input -->
  <rect x="40" y="262" width="180" height="56" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.6" rx="4"/>
  <text x="130" y="286" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">후속 테스트 케이스</text>
  <text x="130" y="306" text-anchor="middle" font-size="13" fill="#4a5568">입력 x₂ (x₁을 변환)</text>

  <line x1="130" y1="118" x2="130" y2="156" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="130" y1="222" x2="130" y2="260" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="142" y="246" font-size="13" fill="#4a5568">③ 생성</text>

  <!-- program -->
  <rect x="290" y="62" width="160" height="256" fill="#eef2f8" stroke="#1d3557" stroke-width="1.6" rx="4"/>
  <text x="370" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">테스트 대상 P</text>
  <text x="370" y="204" text-anchor="middle" font-size="13" fill="#4a5568">(AI 모델 · 시스템)</text>

  <line x1="220" y1="90" x2="288" y2="90" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="254" y="80" text-anchor="middle" font-size="13" fill="#4a5568">② 실행</text>
  <line x1="220" y1="290" x2="288" y2="290" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="254" y="280" text-anchor="middle" font-size="13" fill="#4a5568">④ 실행</text>

  <!-- outputs -->
  <rect x="510" y="62" width="150" height="56" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.6" rx="4"/>
  <text x="585" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">원천 출력</text>
  <text x="585" y="106" text-anchor="middle" font-size="13" fill="#4a5568">P(x₁)</text>

  <rect x="510" y="262" width="150" height="56" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.6" rx="4"/>
  <text x="585" y="286" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">후속 출력</text>
  <text x="585" y="306" text-anchor="middle" font-size="13" fill="#4a5568">P(x₂)</text>

  <line x1="450" y1="90" x2="508" y2="90" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="450" y1="290" x2="508" y2="290" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- check -->
  <rect x="700" y="150" width="150" height="72" fill="#fdf3e7" stroke="#b45309" stroke-width="1.6" rx="4"/>
  <text x="775" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">⑤ 출력 관계 검사</text>
  <text x="775" y="196" text-anchor="middle" font-size="13" fill="#4a5568">P(x₁)과 P(x₂)가</text>
  <text x="775" y="212" text-anchor="middle" font-size="13" fill="#4a5568">MR을 지키는가</text>

  <line x1="660" y1="96" x2="728" y2="148" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="660" y1="284" x2="728" y2="224" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- verdict -->
  <rect x="680" y="292" width="190" height="76" fill="#ffffff" stroke="#4a5568" stroke-width="1.4" rx="4"/>
  <text x="775" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#9d0208">위반 → P에 결함이 있다</text>
  <text x="775" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d6a4f">만족 → 이 MR로는</text>
  <text x="775" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d6a4f">결함을 찾지 못했다</text>
  <line x1="800" y1="222" x2="800" y2="290" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ar)"/>

  <text x="440" y="396" text-anchor="middle" font-size="13" fill="#4a5568">〈x₁, x₂〉의 묶음이 메타모픽 그룹이다. P(x₁) · P(x₂) 각각이 정답인지는 묻지 않는다</text>
  <text x="440" y="414" text-anchor="middle" font-size="13" fill="#4a5568">그래서 기대 결과를 모르는 테스트 대상에도 판정을 내릴 수 있다</text>
</svg>
