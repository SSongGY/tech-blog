<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">격리 수준 4단계와 단계마다 막히는 이상 현상</text>

  <!-- 왼쪽 축 -->
  <line x1="60" y1="400" x2="60" y2="80" stroke="#374151" stroke-width="2"/>
  <polygon points="60,70 54,84 66,84" fill="#374151"/>
  <text x="74" y="78" font-size="13" fill="#374151">고립성 강함 · 동시성 낮음</text>
  <text x="74" y="398" font-size="13" fill="#374151">고립성 약함 · 동시성 높음</text>

  <!-- 수준 박스 4개 (아래에서 위) -->
  <rect x="110" y="320" width="300" height="50" rx="6" fill="#fdecea" stroke="#9d0208" stroke-width="2"/>
  <text x="260" y="342" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">READ UNCOMMITTED</text>
  <text x="260" y="361" text-anchor="middle" font-size="13" fill="#1f2937">P1 · P2 · P3 허용</text>

  <rect x="110" y="235" width="300" height="50" rx="6" fill="#fff4e5" stroke="#b45309" stroke-width="2"/>
  <text x="260" y="257" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">READ COMMITTED</text>
  <text x="260" y="276" text-anchor="middle" font-size="13" fill="#1f2937">P2 · P3 허용</text>

  <rect x="110" y="150" width="300" height="50" rx="6" fill="#fff4e5" stroke="#b45309" stroke-width="2"/>
  <text x="260" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">REPEATABLE READ</text>
  <text x="260" y="191" text-anchor="middle" font-size="13" fill="#1f2937">P3 허용</text>

  <rect x="110" y="65" width="300" height="50" rx="6" fill="#e6f4ea" stroke="#2d6a4f" stroke-width="2"/>
  <text x="260" y="87" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">SERIALIZABLE</text>
  <text x="260" y="106" text-anchor="middle" font-size="13" fill="#1f2937">직렬 실행과 같은 결과</text>

  <!-- 단계 사이 화살표와 막히는 현상 -->
  <line x1="260" y1="318" x2="260" y2="291" stroke="#2d6a4f" stroke-width="2"/>
  <polygon points="260,287 254,298 266,298" fill="#2d6a4f"/>
  <rect x="440" y="282" width="400" height="40" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="456" y="307" font-size="14" fill="#1f2937"><tspan font-weight="bold" fill="#2d6a4f">P1 더티 리드 차단</tspan> — 커밋된 값만 읽는다</text>

  <line x1="260" y1="233" x2="260" y2="206" stroke="#2d6a4f" stroke-width="2"/>
  <polygon points="260,202 254,213 266,213" fill="#2d6a4f"/>
  <rect x="440" y="197" width="400" height="40" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="456" y="222" font-size="14" fill="#1f2937"><tspan font-weight="bold" fill="#2d6a4f">P2 반복 불가능 읽기 차단</tspan> — 읽은 행 고정</text>

  <line x1="260" y1="148" x2="260" y2="121" stroke="#2d6a4f" stroke-width="2"/>
  <polygon points="260,117 254,128 266,128" fill="#2d6a4f"/>
  <rect x="440" y="112" width="400" height="40" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="456" y="137" font-size="14" fill="#1f2937"><tspan font-weight="bold" fill="#2d6a4f">P3 팬텀 차단</tspan> — 조건(술어) 범위까지 고정</text>

  <!-- 바닥: P0 -->
  <rect x="110" y="405" width="730" height="40" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="475" y="430" text-anchor="middle" font-size="14" fill="#1f2937"><tspan font-weight="bold">P0 더티 라이트</tspan>는 모든 수준에서 금지 — 쓰기 잠금을 커밋까지 유지한다</text>
</svg>
