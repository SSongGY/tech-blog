<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <rect x="0" y="0" width="880" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 상단: 리스크 정의 -->
  <rect x="250" y="20" width="380" height="70" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="440" y="50" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">AI 리스크</text>
  <text x="440" y="74" text-anchor="middle" font-size="14" fill="#374151">발생 가능성 × 피해 크기</text>

  <line x1="330" y1="90" x2="150" y2="148" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="90" x2="440" y2="148" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="90" x2="730" y2="148" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 중단: 리스크 영역 3가지 -->
  <rect x="40" y="150" width="220" height="80" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="150" y="182" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">보안 리스크</text>
  <text x="150" y="208" text-anchor="middle" font-size="13" fill="#374151">대응 특성: 보안·회복력</text>

  <rect x="330" y="150" width="220" height="80" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="440" y="182" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">프라이버시 리스크</text>
  <text x="440" y="208" text-anchor="middle" font-size="13" fill="#374151">대응 특성: 프라이버시 강화</text>

  <rect x="620" y="150" width="220" height="80" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="730" y="182" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">사회적 리스크</text>
  <text x="730" y="208" text-anchor="middle" font-size="13" fill="#374151">대응 특성: 공정성·편향 관리</text>

  <!-- 영역 사이 겹침 -->
  <line x1="260" y1="190" x2="330" y2="190" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="550" y1="190" x2="620" y2="190" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="295" y="252" text-anchor="middle" font-size="13" fill="#6b7280">프라이버시 공격</text>
  <text x="585" y="252" text-anchor="middle" font-size="13" fill="#6b7280">프로파일링·감시</text>

  <line x1="150" y1="230" x2="150" y2="298" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="230" x2="440" y2="298" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="230" x2="730" y2="298" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 하단: 피해 대상 -->
  <rect x="40" y="300" width="220" height="90" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>
  <text x="150" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">조직·시스템 피해</text>
  <text x="150" y="352" text-anchor="middle" font-size="13" fill="#374151">운영 중단, 보안 침해</text>
  <text x="150" y="372" text-anchor="middle" font-size="13" fill="#374151">금전 손실, 평판</text>

  <rect x="330" y="300" width="220" height="90" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>
  <text x="440" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">개인 피해</text>
  <text x="440" y="352" text-anchor="middle" font-size="13" fill="#374151">재식별, 민감정보 추론</text>
  <text x="440" y="372" text-anchor="middle" font-size="13" fill="#374151">인격권 침해</text>

  <rect x="620" y="300" width="220" height="90" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>
  <text x="730" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">집단·사회 피해</text>
  <text x="730" y="352" text-anchor="middle" font-size="13" fill="#374151">차별, 정보 생태계 훼손</text>
  <text x="730" y="372" text-anchor="middle" font-size="13" fill="#374151">노동·자율성 변화</text>
</svg>
