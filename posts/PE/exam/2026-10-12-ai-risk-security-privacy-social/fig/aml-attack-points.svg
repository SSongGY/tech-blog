<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="200" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">학습 단계</text>
  <text x="640" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">배포 단계</text>
  <line x1="420" y1="20" x2="420" y2="380" stroke="#9ca3af" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- 학습 단계 -->
  <rect x="30" y="80" width="150" height="60" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="105" y="116" text-anchor="middle" font-size="15" fill="#111827">학습 데이터</text>

  <rect x="230" y="80" width="160" height="60" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="310" y="106" text-anchor="middle" font-size="15" fill="#111827">모델</text>
  <text x="310" y="126" text-anchor="middle" font-size="13" fill="#374151">(가중치·사전학습 모델)</text>

  <line x1="180" y1="110" x2="228" y2="110" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="110" x2="478" y2="110" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 배포 단계 -->
  <rect x="480" y="80" width="170" height="60" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="565" y="106" text-anchor="middle" font-size="15" fill="#111827">추론 서비스</text>
  <text x="565" y="126" text-anchor="middle" font-size="13" fill="#374151">(API·애플리케이션)</text>

  <rect x="710" y="40" width="150" height="56" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="785" y="73" text-anchor="middle" font-size="15" fill="#111827">사용자 입력</text>

  <rect x="710" y="124" width="150" height="56" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="785" y="150" text-anchor="middle" font-size="15" fill="#111827">외부 자원</text>
  <text x="785" y="169" text-anchor="middle" font-size="13" fill="#374151">(웹·문서·RAG)</text>

  <line x1="710" y1="68" x2="652" y2="98" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="710" y1="152" x2="652" y2="124" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 공격 지점 -->
  <text x="105" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d0208">데이터 오염</text>
  <text x="105" y="222" text-anchor="middle" font-size="13" fill="#9d0208">가용성·무결성</text>
  <line x1="105" y1="140" x2="105" y2="182" stroke="#9d0208" stroke-width="1.2" stroke-dasharray="4 3"/>

  <text x="310" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d0208">모델 오염·백도어</text>
  <text x="310" y="222" text-anchor="middle" font-size="13" fill="#9d0208">공급망 경유</text>
  <line x1="310" y1="140" x2="310" y2="182" stroke="#9d0208" stroke-width="1.2" stroke-dasharray="4 3"/>

  <text x="530" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d0208">회피·탈옥</text>
  <text x="530" y="222" text-anchor="middle" font-size="13" fill="#9d0208">무결성·오용</text>
  <line x1="530" y1="140" x2="530" y2="182" stroke="#9d0208" stroke-width="1.2" stroke-dasharray="4 3"/>

  <text x="785" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d0208">간접 프롬프트 인젝션</text>
  <text x="785" y="248" text-anchor="middle" font-size="13" fill="#9d0208">무결성·프라이버시</text>
  <line x1="785" y1="180" x2="785" y2="208" stroke="#9d0208" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- 프라이버시 공격은 질의 접근만으로 -->
  <rect x="430" y="280" width="320" height="90" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="590" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">질의 접근만으로 가능한 프라이버시 공격</text>
  <text x="590" y="330" text-anchor="middle" font-size="13" fill="#374151">데이터 재구성·멤버십 추론</text>
  <text x="590" y="352" text-anchor="middle" font-size="13" fill="#374151">속성 추론·모델 추출</text>
  <line x1="590" y1="280" x2="575" y2="142" stroke="#b45309" stroke-width="1.2" stroke-dasharray="4 3"/>
</svg>
