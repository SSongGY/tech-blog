<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">A/B 테스트 수행 흐름 — 배정에서 결정까지</text>

  <!-- 1. 사용자 유입 -->
  <rect x="20" y="130" width="120" height="60" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="80" y="156" text-anchor="middle" font-size="14" fill="#111827">사용자 유입</text>
  <text x="80" y="176" text-anchor="middle" font-size="13" fill="#4b5563">무작위 단위: user_id</text>

  <!-- 2. 무작위 배정 -->
  <rect x="175" y="130" width="130" height="60" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="240" y="156" text-anchor="middle" font-size="14" fill="#111827">무작위 배정</text>
  <text x="240" y="176" text-anchor="middle" font-size="13" fill="#4b5563">hash(id) → 50:50</text>

  <!-- 3. 대조군 A -->
  <rect x="345" y="70" width="130" height="56" rx="8" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <text x="410" y="94" text-anchor="middle" font-size="14" fill="#111827">대조군 A</text>
  <text x="410" y="113" text-anchor="middle" font-size="13" fill="#4b5563">현행 기능</text>

  <!-- 4. 실험군 B -->
  <rect x="345" y="194" width="130" height="56" rx="8" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <text x="410" y="218" text-anchor="middle" font-size="14" fill="#111827">실험군 B</text>
  <text x="410" y="237" text-anchor="middle" font-size="13" fill="#4b5563">변경 1가지</text>

  <!-- 5. 로그·지표 -->
  <rect x="515" y="122" width="150" height="76" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="590" y="146" text-anchor="middle" font-size="14" fill="#111827">로그 → 지표 계산</text>
  <text x="590" y="166" text-anchor="middle" font-size="13" fill="#4b5563">목표(OEC)·가드레일</text>
  <text x="590" y="184" text-anchor="middle" font-size="13" fill="#4b5563">·디버깅 지표</text>

  <!-- 6. SRM 검사 -->
  <rect x="705" y="70" width="155" height="56" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.8"/>
  <text x="782" y="94" text-anchor="middle" font-size="14" fill="#b45309">① SRM 검사</text>
  <text x="782" y="113" text-anchor="middle" font-size="13" fill="#4b5563">χ², p &lt; 0.0005면 폐기</text>

  <!-- 7. 가설 검정 -->
  <rect x="705" y="194" width="155" height="56" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="782" y="218" text-anchor="middle" font-size="14" fill="#111827">② 가설 검정</text>
  <text x="782" y="237" text-anchor="middle" font-size="13" fill="#4b5563">z 검정, α=0.05</text>

  <!-- 8. 출시 결정 -->
  <rect x="705" y="290" width="155" height="50" rx="8" fill="#ecfdf5" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="782" y="320" text-anchor="middle" font-size="14" fill="#2d6a4f">③ 출시·폐기 결정</text>

  <!-- 화살표 -->
  <line x1="140" y1="160" x2="173" y2="160" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="305" y1="150" x2="343" y2="104" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="305" y1="170" x2="343" y2="216" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="100" x2="513" y2="145" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="220" x2="513" y2="178" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="665" y1="145" x2="703" y2="104" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="782" y1="126" x2="782" y2="192" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="782" y1="250" x2="782" y2="288" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="240" y="300" text-anchor="middle" font-size="13" fill="#4b5563">같은 id는 항상 같은 군 — 해시라 재접속해도 유지</text>
  <text x="240" y="320" text-anchor="middle" font-size="13" fill="#4b5563">트래픽은 1% → 5% → 10%… 단계적으로 늘린다</text>
</svg>
