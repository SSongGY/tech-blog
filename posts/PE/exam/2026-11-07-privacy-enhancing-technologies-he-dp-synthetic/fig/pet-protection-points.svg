<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#1b1b1b" stroke-width="1.6"/>
    </marker>
  </defs>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">세 기술이 보호하는 구간 — 원본이 어디까지 드러나는가</text>

  <!-- pipeline -->
  <rect x="40" y="60" width="220" height="64" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.6" rx="4"/>
  <text x="150" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">데이터 보유자</text>
  <text x="150" y="108" text-anchor="middle" font-size="13" fill="#4a5568">원본 (개인정보 포함)</text>

  <rect x="330" y="60" width="220" height="64" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.6" rx="4"/>
  <text x="440" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">처리자</text>
  <text x="440" y="108" text-anchor="middle" font-size="13" fill="#4a5568">연산 · 분석 · 학습</text>

  <rect x="620" y="60" width="220" height="64" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.6" rx="4"/>
  <text x="730" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">결과 수신자</text>
  <text x="730" y="108" text-anchor="middle" font-size="13" fill="#4a5568">공개 · 제3자 제공</text>

  <line x1="260" y1="92" x2="328" y2="92" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="550" y1="92" x2="618" y2="92" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- HE band -->
  <rect x="150" y="160" width="400" height="44" fill="#eef2f8" stroke="#1d3557" stroke-width="1.6" rx="4"/>
  <text x="350" y="187" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">동형암호 — 암호문 상태로 연산, 키 보유자만 복호</text>
  <text x="350" y="226" text-anchor="middle" font-size="13" fill="#b45309">남는 위험: 복호한 결과 자체가 입력을 드러낼 수 있다 · 연산 비용</text>

  <!-- DP band -->
  <rect x="560" y="250" width="280" height="44" fill="#eef2f8" stroke="#1d3557" stroke-width="1.6" rx="4"/>
  <text x="700" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">차분 프라이버시 — 결과에 잡음</text>
  <text x="560" y="316" font-size="13" fill="#b45309">남는 위험: ε 누적 · 정확도 손실</text>
  <text x="40" y="266" font-size="13" fill="#4a5568">중앙 모델: 처리자가 원본을 보고</text>
  <text x="40" y="286" font-size="13" fill="#4a5568">결과를 내보낼 때 잡음을 더한다</text>

  <!-- synthetic band -->
  <rect x="150" y="345" width="690" height="44" fill="#eef2f8" stroke="#1d3557" stroke-width="1.6" rx="4"/>
  <text x="495" y="372" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">합성데이터 — 원본 대신 원본 분포를 학습해 만든 새 레코드를 넘긴다</text>
  <text x="495" y="411" text-anchor="middle" font-size="13" fill="#b45309">남는 위험: 원본 레코드가 재현되면 재식별 · 속성 노출 · 편향 증폭</text>

  <text x="440" y="452" text-anchor="middle" font-size="13" fill="#4a5568">띠가 덮는 구간에서는 원본 값이 그대로 보이지 않는다. 띠 밖은 다른 통제(접근 통제·계약)로 막아야 한다</text>
</svg>
