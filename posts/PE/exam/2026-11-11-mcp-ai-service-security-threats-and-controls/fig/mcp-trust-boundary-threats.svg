<svg xmlns="http://www.w3.org/2000/svg" width="880" height="530" viewBox="0 0 880 530" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="530" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="440" y="28" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">MCP 구성요소와 신뢰 경계 — 취약점이 생기는 자리 6곳</text>

  <!-- 신뢰 경계 -->
  <line x1="512" y1="50" x2="512" y2="405" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="520" y="62" font-size="13" fill="#b45309">신뢰 경계 (호스트 밖)</text>

  <!-- 사용자 -->
  <rect x="20" y="150" width="120" height="70" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="80" y="181" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">사용자</text>
  <text x="80" y="203" font-size="13" text-anchor="middle" fill="#374151">동의·승인</text>

  <!-- 호스트 -->
  <rect x="165" y="70" width="315" height="270" rx="10" fill="#fafafa" stroke="#374151" stroke-width="1.5"/>
  <text x="322" y="92" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">호스트 (AI 애플리케이션)</text>

  <rect x="185" y="105" width="275" height="62" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="322" y="132" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">LLM</text>
  <text x="322" y="153" font-size="13" text-anchor="middle" fill="#374151">도구 선택·호출 인자 생성</text>

  <rect x="185" y="230" width="275" height="90" rx="8" fill="#e8f3ee" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="322" y="257" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">MCP 클라이언트</text>
  <text x="322" y="279" font-size="13" text-anchor="middle" fill="#374151">호출 전 승인 · 결과 검증</text>
  <text x="322" y="300" font-size="13" text-anchor="middle" fill="#374151">URL 검사 · 토큰 보관</text>

  <!-- 로컬 서버 -->
  <rect x="545" y="75" width="160" height="70" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="625" y="104" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">로컬 MCP 서버</text>
  <text x="625" y="126" font-size="13" text-anchor="middle" fill="#374151">stdio · 사용자 권한</text>

  <!-- 원격 서버 -->
  <rect x="545" y="200" width="160" height="70" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="625" y="229" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">원격 MCP 서버</text>
  <text x="625" y="251" font-size="13" text-anchor="middle" fill="#374151">HTTP · 토큰 대상 검증</text>

  <!-- 하위 API -->
  <rect x="740" y="200" width="125" height="70" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="802" y="229" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">하위 API</text>
  <text x="802" y="251" font-size="13" text-anchor="middle" fill="#374151">업무 데이터</text>

  <!-- 인가 서버 -->
  <rect x="545" y="335" width="160" height="62" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="625" y="361" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">인가 서버</text>
  <text x="625" y="382" font-size="13" text-anchor="middle" fill="#374151">OAuth 2.1</text>

  <!-- 연결선 -->
  <g stroke="#374151" stroke-width="1.5" fill="none">
    <line x1="140" y1="185" x2="163" y2="185" marker-end="url(#arr)"/>
    <line x1="322" y1="167" x2="322" y2="228" marker-end="url(#arr)"/>
    <line x1="460" y1="250" x2="543" y2="118" marker-end="url(#arr)"/>
    <line x1="460" y1="270" x2="543" y2="240" marker-end="url(#arr)"/>
    <line x1="705" y1="235" x2="738" y2="235" marker-end="url(#arr)"/>
    <line x1="420" y1="320" x2="543" y2="362" marker-end="url(#arr)"/>
  </g>

  <!-- 취약점 표지 -->
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <circle cx="488" cy="205" r="11" fill="#9d0208"/><text x="488" y="210">1</text>
    <circle cx="345" cy="198" r="11" fill="#9d0208"/><text x="345" y="203">2</text>
    <circle cx="722" cy="110" r="11" fill="#9d0208"/><text x="722" y="115">3</text>
    <circle cx="722" cy="185" r="11" fill="#9d0208"/><text x="722" y="190">4</text>
    <circle cx="470" cy="352" r="11" fill="#9d0208"/><text x="470" y="357">5</text>
    <circle cx="625" cy="295" r="11" fill="#9d0208"/><text x="625" y="300">6</text>
  </g>

  <!-- 범례 -->
  <rect x="20" y="420" width="840" height="98" rx="8" fill="#fafafa" stroke="#6b7280" stroke-width="1.2"/>
  <g font-size="13" fill="#1f2937">
    <text x="36" y="444"><tspan fill="#9d0208" font-weight="bold">1</tspan>  도구 설명·결과에 숨은 지시 (간접 인젝션)</text>
    <text x="36" y="470"><tspan fill="#9d0208" font-weight="bold">2</tspan>  과도한 기능·권한·자율 (승인 없는 호출)</text>
    <text x="36" y="496"><tspan fill="#9d0208" font-weight="bold">3</tspan>  로컬 서버 임의 코드 실행 · 공급망 변조</text>
    <text x="450" y="444"><tspan fill="#9d0208" font-weight="bold">4</tspan>  토큰 전달 · 혼동된 대리인</text>
    <text x="450" y="470"><tspan fill="#9d0208" font-weight="bold">5</tspan>  서버가 준 URL 악용 (SSRF · 인가 URL)</text>
    <text x="450" y="496"><tspan fill="#9d0208" font-weight="bold">6</tspan>  상태 핸들 탈취 (핸들을 인증으로 취급)</text>
  </g>
</svg>
