<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="330" fill="#f8fafc"/>

  <text x="24" y="30" font-size="16" font-weight="bold" fill="#0f172a">ISP 사업 추진 3단계와 수행단계 5활동</text>

  <!-- 추진 3단계 -->
  <rect x="60" y="48" width="200" height="50" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="160" y="70" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">기획 단계</text>
  <text x="160" y="88" font-size="13" fill="#334155" text-anchor="middle">사업계획서 · RFP · 사업자 선정</text>

  <rect x="330" y="48" width="200" height="50" rx="6" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="2"/>
  <text x="430" y="70" font-size="14" font-weight="bold" fill="#1b4332" text-anchor="middle">수행 단계</text>
  <text x="430" y="88" font-size="13" fill="#1b4332" text-anchor="middle">사업자가 ISP를 수행</text>

  <rect x="600" y="48" width="200" height="50" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="700" y="70" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">종료 단계</text>
  <text x="700" y="88" font-size="13" fill="#334155" text-anchor="middle">과업이행 점검 · 산출물 인수</text>

  <path d="M262 73 L326 73" stroke="#334155" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M532 73 L596 73" stroke="#334155" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 펼침선 -->
  <path d="M330 100 L22 150" stroke="#2d6a4f" stroke-width="1.2" stroke-dasharray="5 4"/>
  <path d="M530 100 L858 150" stroke="#2d6a4f" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="440" y="130" font-size="13" fill="#2d6a4f" text-anchor="middle">수행 단계를 활동 단위로 펼치면</text>

  <!-- 수행단계 5활동 -->
  <rect x="22" y="160" width="158" height="86" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="101" y="184" font-size="14" font-weight="bold" fill="#1b4332" text-anchor="middle">A. 환경분석</text>
  <text x="101" y="206" font-size="13" fill="#334155" text-anchor="middle">경영현황 분석</text>
  <text x="101" y="226" font-size="13" fill="#334155" text-anchor="middle">정보기술 환경분석</text>

  <rect x="195" y="160" width="158" height="86" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="274" y="184" font-size="14" font-weight="bold" fill="#1b4332" text-anchor="middle">B. 현황분석</text>
  <text x="274" y="204" font-size="13" fill="#334155" text-anchor="middle">업무 · 정보시스템</text>
  <text x="274" y="222" font-size="13" fill="#334155" text-anchor="middle">벤치마킹</text>
  <text x="274" y="240" font-size="13" fill="#334155" text-anchor="middle">차이분석</text>

  <rect x="368" y="160" width="158" height="86" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="447" y="184" font-size="14" font-weight="bold" fill="#1b4332" text-anchor="middle">C. 미래모델 설계</text>
  <text x="447" y="204" font-size="13" fill="#334155" text-anchor="middle">정보전략 수립</text>
  <text x="447" y="222" font-size="13" fill="#334155" text-anchor="middle">정보시스템 구조설계</text>
  <text x="447" y="240" font-size="13" fill="#334155" text-anchor="middle">정보관리체계 수립</text>

  <rect x="541" y="160" width="158" height="86" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="620" y="184" font-size="14" font-weight="bold" fill="#1b4332" text-anchor="middle">D. 이행계획 수립</text>
  <text x="620" y="206" font-size="13" fill="#334155" text-anchor="middle">정보시스템 구축계획</text>
  <text x="620" y="226" font-size="13" fill="#334155" text-anchor="middle">투자예산 · 투자효과</text>

  <rect x="714" y="160" width="144" height="86" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="786" y="184" font-size="14" font-weight="bold" fill="#7c2d12" text-anchor="middle">E. 추가활동</text>
  <text x="786" y="206" font-size="13" fill="#7c2d12" text-anchor="middle">사업계획서</text>
  <text x="786" y="226" font-size="13" fill="#7c2d12" text-anchor="middle">제안요청서 작성</text>

  <path d="M182 203 L191 203" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#ah2)"/>
  <path d="M355 203 L364 203" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#ah2)"/>
  <path d="M528 203 L537 203" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#ah2)"/>
  <path d="M701 203 L710 203" stroke="#b45309" stroke-width="1.5" marker-end="url(#ah3)"/>

  <text x="24" y="282" font-size="13" fill="#334155">A~D는 「SW사업 대가산정 가이드」의 ISP/BPR 업무활동을 준용한 것이고, 법으로 정해진 표준 절차가 아니다.</text>
  <text x="24" y="304" font-size="13" fill="#7c2d12">E는 ISP 본래 활동이 아니라 후속 사업 발주를 위해 덧붙인 활동이다.</text>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2d6a4f"/>
    </marker>
    <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
