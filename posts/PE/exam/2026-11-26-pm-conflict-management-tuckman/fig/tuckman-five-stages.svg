<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="880" height="360" fill="#fbfaf7"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#1f2937">터크만 팀 발달 5단계 — 집단 구조와 과업 활동</text>

  <!-- 행 라벨 -->
  <g font-size="13" font-weight="bold" fill="#111827">
    <text x="20" y="98">단계</text>
    <text x="20" y="168">집단 구조</text>
    <text x="20" y="238">과업 활동</text>
  </g>

  <!-- 단계 박스 -->
  <g stroke-width="1.6">
    <rect x="110" y="70" width="140" height="46" rx="6" fill="#e5e7eb" stroke="#374151"/>
    <rect x="262" y="70" width="140" height="46" rx="6" fill="#fff7ed" stroke="#b45309"/>
    <rect x="414" y="70" width="140" height="46" rx="6" fill="#eef5f1" stroke="#2d6a4f"/>
    <rect x="566" y="70" width="140" height="46" rx="6" fill="#eef5f1" stroke="#2d6a4f"/>
    <rect x="718" y="70" width="140" height="46" rx="6" fill="#e5e7eb" stroke="#374151" stroke-dasharray="6 4"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="180" y="92" fill="#111827">① 형성기</text>
    <text x="332" y="92" fill="#b45309">② 혼돈기</text>
    <text x="484" y="92" fill="#14532d">③ 규범기</text>
    <text x="636" y="92" fill="#14532d">④ 성취기</text>
    <text x="788" y="92" fill="#111827">⑤ 해산기</text>
  </g>
  <g font-size="13" text-anchor="middle" fill="#6b7280">
    <text x="180" y="110">Forming</text>
    <text x="332" y="110">Storming</text>
    <text x="484" y="110">Norming</text>
    <text x="636" y="110">Performing</text>
    <text x="788" y="110">Adjourning</text>
  </g>

  <!-- 화살표 -->
  <g stroke="#6b7280" stroke-width="1.5" fill="#6b7280">
    <line x1="250" y1="93" x2="260" y2="93"/>
    <line x1="402" y1="93" x2="412" y2="93"/>
    <line x1="554" y1="93" x2="564" y2="93"/>
    <line x1="706" y1="93" x2="716" y2="93"/>
  </g>

  <!-- 집단 구조 -->
  <g font-size="13" text-anchor="middle" fill="#374151">
    <text x="180" y="160">시험과 의존</text>
    <text x="180" y="178">(리더·규칙 탐색)</text>
    <text x="332" y="160" fill="#b45309">집단 내 갈등</text>
    <text x="332" y="178">(영향력 다툼)</text>
    <text x="484" y="160">응집력 형성</text>
    <text x="484" y="178">(규범·역할 수용)</text>
    <text x="636" y="160">기능적 역할 관계</text>
    <text x="636" y="178">(역할이 유연해짐)</text>
    <text x="788" y="160">관계 종료</text>
    <text x="788" y="178">(분리)</text>
  </g>

  <!-- 과업 활동 -->
  <g font-size="13" text-anchor="middle" fill="#374151">
    <text x="180" y="230">과업 파악</text>
    <text x="180" y="248">(무엇을 할지 확인)</text>
    <text x="332" y="230">과업 요구에 대한</text>
    <text x="332" y="248">감정적 반응</text>
    <text x="484" y="230">의견의 공개 교환</text>
    <text x="484" y="248"> </text>
    <text x="636" y="230">해결책 도출</text>
    <text x="636" y="248"> </text>
    <text x="788" y="230">과업 완료</text>
    <text x="788" y="248"> </text>
  </g>

  <line x1="20" y1="286" x2="860" y2="286" stroke="#d1d5db" stroke-width="1"/>
  <text x="20" y="310" font-size="13" fill="#374151">①~④는 1965년 원 논문의 4단계, ⑤는 1977년 재검토 논문이 덧붙인 단계다(점선).</text>
  <text x="20" y="334" font-size="13" fill="#6b7280">원 논문은 각 단계를 집단 구조(대인 관계)와 과업 활동 두 영역으로 나눠 기술한다.</text>
</svg>
