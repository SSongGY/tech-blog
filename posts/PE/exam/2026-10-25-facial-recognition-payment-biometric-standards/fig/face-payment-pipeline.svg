<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400">
  <rect x="0" y="0" width="880" height="400" fill="#fbfbfa"/>

  <text x="60" y="44" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f2937">안면인식 결제의 처리 흐름과 각 단계에 걸리는 표준</text>
  <text x="60" y="68" font-family="sans-serif" font-size="13" fill="#4b5563">실선 = 결제 시점의 경로, 점선 = 사전 등록 시의 경로</text>

  <!-- row 1 -->
  <rect x="60" y="90" width="170" height="62" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="145" y="117" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">① 얼굴 영상 획득</text>
  <text x="145" y="138" font-family="sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">capture</text>

  <rect x="250" y="90" width="170" height="62" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="335" y="117" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">② 제시공격 탐지</text>
  <text x="335" y="138" font-family="sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">PAD</text>

  <rect x="440" y="90" width="170" height="62" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="525" y="117" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">③ 특징정보 추출</text>
  <text x="525" y="138" font-family="sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">feature extraction</text>

  <rect x="630" y="90" width="170" height="62" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="715" y="117" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">④ 비교 · 판정</text>
  <text x="715" y="138" font-family="sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">1:1 검증 / 1:N 식별</text>

  <!-- row 2 -->
  <rect x="440" y="240" width="170" height="62" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="525" y="267" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">보호 템플릿 저장소</text>
  <text x="525" y="288" font-family="sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">암호화 · 재발급 가능</text>

  <rect x="630" y="240" width="170" height="62" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="715" y="267" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">⑤ 결제 승인</text>
  <text x="715" y="288" font-family="sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">인증 결과 → 결제망</text>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2d6a4f"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#374151"/>
    </marker>
  </defs>

  <line x1="232" y1="121" x2="246" y2="121" stroke="#2d6a4f" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="422" y1="121" x2="436" y2="121" stroke="#2d6a4f" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="612" y1="121" x2="626" y2="121" stroke="#2d6a4f" stroke-width="2" marker-end="url(#ah)"/>

  <line x1="525" y1="154" x2="525" y2="236" stroke="#374151" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <text x="537" y="200" font-family="sans-serif" font-size="13" fill="#374151">등록 시 저장</text>

  <line x1="612" y1="248" x2="668" y2="158" stroke="#374151" stroke-width="2" marker-end="url(#ag)"/>
  <text x="604" y="222" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="end">판정 시 참조</text>

  <line x1="715" y1="154" x2="715" y2="236" stroke="#2d6a4f" stroke-width="2" marker-end="url(#ah)"/>

  <!-- legend -->
  <line x1="60" y1="325" x2="820" y2="325" stroke="#d1d5db" stroke-width="1"/>
  <text x="60" y="348" font-family="sans-serif" font-size="13" fill="#4b5563">① 획득 실패율과 ④ 판정 오류율의 측정·보고 — ISO/IEC 19795-1:2021</text>
  <text x="60" y="370" font-family="sans-serif" font-size="13" fill="#b45309">② 제시공격 탐지 성능의 시험·보고 — ISO/IEC 30107-3:2023</text>
  <text x="60" y="392" font-family="sans-serif" font-size="13" fill="#4b5563">③ 특징정보와 저장소의 보호 — ISO/IEC 24745:2022 · 개인정보 보호법 제23조</text>
</svg>
