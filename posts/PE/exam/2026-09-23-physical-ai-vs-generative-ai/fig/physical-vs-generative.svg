<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="450" fill="#ffffff"/>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#4a5568" stroke-width="1.6"/>
    </marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#2d6a4f" stroke-width="1.6"/>
    </marker>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#b45309" stroke-width="1.6"/>
    </marker>
  </defs>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">생성형 AI와 Physical AI — 출력이 어디에 닿는가</text>

  <!-- 좌: 생성형 AI -->
  <rect x="20" y="52" width="264" height="300" fill="#f5f7f9" stroke="#9aa5b1" stroke-width="1" rx="6"/>
  <text x="152" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">생성형 AI</text>
  <text x="152" y="98" text-anchor="middle" font-size="13" fill="#4a5568">디지털 공간 안에서 끝난다</text>

  <rect x="42" y="116" width="220" height="48" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2" rx="4"/>
  <text x="152" y="137" text-anchor="middle" font-size="14" fill="#1b1b1b">입력 (프롬프트)</text>
  <text x="152" y="155" text-anchor="middle" font-size="13" fill="#4a5568">텍스트 · 이미지</text>

  <rect x="42" y="194" width="220" height="48" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.6" rx="4"/>
  <text x="152" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">생성 모델</text>
  <text x="152" y="233" text-anchor="middle" font-size="13" fill="#4a5568">입력 데이터의 구조를 모사</text>

  <rect x="42" y="272" width="220" height="48" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2" rx="4"/>
  <text x="152" y="293" text-anchor="middle" font-size="14" fill="#1b1b1b">합성 콘텐츠</text>
  <text x="152" y="311" text-anchor="middle" font-size="13" fill="#4a5568">텍스트 · 이미지 · 코드</text>

  <line x1="152" y1="164" x2="152" y2="190" stroke="#4a5568" stroke-width="1.4" marker-end="url(#a1)"/>
  <line x1="152" y1="242" x2="152" y2="268" stroke="#4a5568" stroke-width="1.4" marker-end="url(#a1)"/>

  <!-- 가운데: 확장 관계 -->
  <line x1="264" y1="218" x2="494" y2="218" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#a3)"/>
  <text x="392" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">파운데이션 모델 확장</text>
  <text x="392" y="240" text-anchor="middle" font-size="13" fill="#b45309">+ 공간 · 물리 법칙 이해</text>
  <text x="392" y="258" text-anchor="middle" font-size="13" fill="#b45309">+ 출력에 행동 추가 (VLA)</text>

  <!-- 우: Physical AI 순환 -->
  <rect x="500" y="52" width="360" height="300" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1" rx="6"/>
  <text x="680" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d6a4f">Physical AI</text>
  <text x="680" y="98" text-anchor="middle" font-size="13" fill="#4a5568">물리 세계에 작용하고 결과를 다시 관측한다</text>

  <rect x="516" y="122" width="148" height="54" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.4" rx="4"/>
  <text x="590" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">인지</text>
  <text x="590" y="164" text-anchor="middle" font-size="13" fill="#4a5568">카메라 · LiDAR · 촉각</text>

  <rect x="696" y="122" width="148" height="54" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.6" rx="4"/>
  <text x="770" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">추론 · 계획</text>
  <text x="770" y="164" text-anchor="middle" font-size="13" fill="#4a5568">VLA 등 기반 모델</text>

  <rect x="696" y="262" width="148" height="54" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.4" rx="4"/>
  <text x="770" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">행동</text>
  <text x="770" y="304" text-anchor="middle" font-size="13" fill="#4a5568">액추에이터 · 모터</text>

  <rect x="516" y="262" width="148" height="54" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4" rx="4"/>
  <text x="590" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">물리 환경</text>
  <text x="590" y="304" text-anchor="middle" font-size="13" fill="#4a5568">사물 · 사람 · 공간</text>

  <line x1="664" y1="149" x2="692" y2="149" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#a2)"/>
  <line x1="770" y1="176" x2="770" y2="258" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#a2)"/>
  <line x1="696" y1="289" x2="668" y2="289" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#a2)"/>
  <line x1="590" y1="262" x2="590" y2="180" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="680" y="224" text-anchor="middle" font-size="13" fill="#2d6a4f">실시간 반복</text>

  <!-- 하단: 학습 데이터 -->
  <text x="20" y="386" font-size="14" font-weight="bold" fill="#1b1b1b">학습 데이터</text>
  <text x="120" y="386" font-size="13" fill="#1b1b1b">생성형 AI — 인터넷 규모의 텍스트 · 이미지</text>
  <text x="120" y="410" font-size="13" fill="#1b1b1b">Physical AI — 실세계 궤적 데이터 + 시뮬레이션 · 디지털 트윈에서 만든 합성 데이터 → 강화 · 모방 학습</text>
  <text x="120" y="434" font-size="13" fill="#b45309">실세계 데이터는 모으기 비싸고 위험해서 시뮬레이션 비중이 커진다</text>
</svg>
