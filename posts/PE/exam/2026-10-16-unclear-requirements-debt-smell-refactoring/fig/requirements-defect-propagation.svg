<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <rect width="880" height="470" fill="#fbfbfb"/>
  <defs>
    <marker id="arD" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#9d0208"/>
    </marker>
    <marker id="arG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2d6a4f"/>
    </marker>
  </defs>

  <!-- 예방 경로 -->
  <rect x="30" y="28" width="190" height="66" rx="6" fill="#eef6f1" stroke="#2d6a4f" stroke-width="2"/>
  <text x="125" y="54" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b4332">요구사항 명확화</text>
  <text x="125" y="76" text-anchor="middle" font-size="13" fill="#2d6a4f">29148 품질 기준 적용</text>
  <line x1="220" y1="61" x2="246" y2="61" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arG)"/>
  <text x="233" y="112" text-anchor="middle" font-size="13" fill="#2d6a4f">유입 차단</text>

  <!-- 1. 요구사항 품질 위반 -->
  <rect x="250" y="28" width="300" height="66" rx="6" fill="#fdf1f1" stroke="#9d0208" stroke-width="2"/>
  <text x="400" y="54" text-anchor="middle" font-size="15" font-weight="bold" fill="#6a0003">요구사항 품질 위반</text>
  <text x="400" y="77" text-anchor="middle" font-size="13" fill="#5c2b2b">모호 · 검증 불가 · 미결(TBD)</text>
  <line x1="400" y1="94" x2="400" y2="126" stroke="#9d0208" stroke-width="2" marker-end="url(#arD)"/>

  <!-- 2. 설계·구현 선택 -->
  <rect x="250" y="130" width="300" height="66" rx="6" fill="#fdf6ec" stroke="#b45309" stroke-width="2"/>
  <text x="400" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c3d06">불확실성 하의 설계·구현 선택</text>
  <text x="400" y="179" text-anchor="middle" font-size="13" fill="#6b4318">추측·잠정 구조로 일단 동작시킨다</text>
  <line x1="400" y1="196" x2="400" y2="228" stroke="#9d0208" stroke-width="2" marker-end="url(#arD)"/>

  <!-- 3. 기술부채 -->
  <rect x="250" y="232" width="300" height="66" rx="6" fill="#fdf1f1" stroke="#9d0208" stroke-width="2"/>
  <text x="400" y="256" text-anchor="middle" font-size="15" font-weight="bold" fill="#6a0003">기술부채</text>
  <text x="400" y="275" text-anchor="middle" font-size="13" fill="#5c2b2b">원금 = 바로잡는 데 드는 비용</text>
  <text x="400" y="293" text-anchor="middle" font-size="13" fill="#5c2b2b">이자 = 변경할 때마다 더 드는 비용</text>
  <line x1="400" y1="298" x2="400" y2="330" stroke="#9d0208" stroke-width="2" marker-end="url(#arD)"/>

  <!-- 4. 코드 스멜 -->
  <rect x="250" y="334" width="300" height="66" rx="6" fill="#fdf1f1" stroke="#9d0208" stroke-width="2"/>
  <text x="400" y="360" text-anchor="middle" font-size="15" font-weight="bold" fill="#6a0003">코드 스멜</text>
  <text x="400" y="383" text-anchor="middle" font-size="13" fill="#5c2b2b">부채가 코드 표면에 드러난 징후</text>
  <line x1="550" y1="367" x2="616" y2="367" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arG)"/>
  <text x="583" y="355" text-anchor="middle" font-size="13" fill="#2d6a4f">탐지</text>

  <!-- 5. 리팩토링 -->
  <rect x="620" y="334" width="230" height="66" rx="6" fill="#eef6f1" stroke="#2d6a4f" stroke-width="2"/>
  <text x="735" y="360" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b4332">리팩토링</text>
  <text x="735" y="383" text-anchor="middle" font-size="13" fill="#2d6a4f">행위 보존 구조 개선</text>

  <!-- 상환 경로 -->
  <polyline points="735,334 735,265 554,265" fill="none" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arG)"/>
  <text x="684" y="255" text-anchor="middle" font-size="13" fill="#2d6a4f">원금 상환</text>

  <text x="30" y="438" font-size="13" fill="#444">요구사항 결함은 설계·구현 선택을 거쳐 부채로 쌓이고, 코드 스멜로 표면에 드러난다.</text>
  <text x="30" y="458" font-size="13" fill="#444">리팩토링은 쌓인 원금을 줄이고, 요구사항 명확화는 새 부채의 유입 자체를 막는다.</text>
</svg>
