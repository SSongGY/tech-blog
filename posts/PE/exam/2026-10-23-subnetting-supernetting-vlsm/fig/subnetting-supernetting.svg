<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="Malgun Gothic, Noto Sans KR, sans-serif">
  <rect x="0" y="0" width="880" height="330" fill="#f8fafc"/>

  <defs>
    <marker id="down" markerWidth="12" markerHeight="12" refX="6" refY="10" orient="0">
      <path d="M1,1 L6,10 L11,1" fill="none" stroke="#334155" stroke-width="2"/>
    </marker>
    <marker id="up" markerWidth="12" markerHeight="12" refX="6" refY="2" orient="0">
      <path d="M1,11 L6,2 L11,11" fill="none" stroke="#334155" stroke-width="2"/>
    </marker>
  </defs>

  <text x="440" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">접두어 길이를 늘리면 서브네팅, 줄이면 슈퍼네팅</text>

  <rect x="290" y="46" width="300" height="56" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="440" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">192.168.0.0/22</text>
  <text x="440" y="90" text-anchor="middle" font-size="13" fill="#334155">주소 1024개 · 외부에 광고되는 한 덩어리</text>

  <line x1="110" y1="106" x2="110" y2="222" stroke="#334155" stroke-width="2" marker-end="url(#down)"/>
  <line x1="770" y1="222" x2="770" y2="106" stroke="#334155" stroke-width="2" marker-end="url(#up)"/>

  <text x="440" y="146" text-anchor="middle" font-size="14" fill="#0f172a">↓ 서브네팅 — 접두어를 늘려 /22 안을 더 잘게 나눈다</text>
  <text x="440" y="168" text-anchor="middle" font-size="13" fill="#334155">나눈 사실은 조직 안에서만 보이고, 외부 경로 수는 그대로다</text>
  <text x="440" y="196" text-anchor="middle" font-size="14" fill="#0f172a">↑ 슈퍼네팅 — 접두어를 줄여 연속된 블록을 하나로 묶는다</text>
  <text x="440" y="218" text-anchor="middle" font-size="13" fill="#334155">경로 네 개가 하나로 줄어 라우팅 테이블이 작아진다</text>

  <rect x="75" y="236" width="160" height="56" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="155" y="260" text-anchor="middle" font-size="14" fill="#0f172a">192.168.0.0/24</text>
  <text x="155" y="280" text-anchor="middle" font-size="13" fill="#334155">주소 256개</text>

  <rect x="265" y="236" width="160" height="56" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="345" y="260" text-anchor="middle" font-size="14" fill="#0f172a">192.168.1.0/24</text>
  <text x="345" y="280" text-anchor="middle" font-size="13" fill="#334155">주소 256개</text>

  <rect x="455" y="236" width="160" height="56" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="535" y="260" text-anchor="middle" font-size="14" fill="#0f172a">192.168.2.0/24</text>
  <text x="535" y="280" text-anchor="middle" font-size="13" fill="#334155">주소 256개</text>

  <rect x="645" y="236" width="160" height="56" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="725" y="260" text-anchor="middle" font-size="14" fill="#0f172a">192.168.3.0/24</text>
  <text x="725" y="280" text-anchor="middle" font-size="13" fill="#334155">주소 256개</text>

  <text x="440" y="318" text-anchor="middle" font-size="13" fill="#334155">묶으려면 블록이 연속이고 시작 주소가 그 크기의 배수여야 한다</text>
</svg>
