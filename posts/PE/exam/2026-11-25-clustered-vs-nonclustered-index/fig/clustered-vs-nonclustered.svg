<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9d0208"/>
    </marker>
  </defs>

  <!-- 왼쪽: 클러스터드 인덱스 -->
  <text x="210" y="34" font-size="17" font-weight="bold" text-anchor="middle" fill="#222222">클러스터드 인덱스 (Clustered)</text>
  <rect x="70" y="60" width="280" height="64" rx="6" fill="#eef4f1" stroke="#2d6a4f" stroke-width="2"/>
  <text x="210" y="87" font-size="15" text-anchor="middle" fill="#222222">루트·중간 노드</text>
  <text x="210" y="109" font-size="13" text-anchor="middle" fill="#444444">키 + 하위 페이지 포인터</text>
  <line x1="210" y1="124" x2="210" y2="176" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="40" y="180" width="340" height="96" rx="6" fill="#d8eadf" stroke="#2d6a4f" stroke-width="2"/>
  <text x="210" y="208" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">리프 = 데이터 페이지</text>
  <text x="210" y="232" font-size="13" text-anchor="middle" fill="#444444">행 전체가 키 순서로 저장된다</text>
  <text x="210" y="256" font-size="13" text-anchor="middle" fill="#444444">id=1 … | id=2 … | id=3 …</text>
  <text x="210" y="312" font-size="14" text-anchor="middle" fill="#2d6a4f">리프에 도착하면 행이 바로 있다</text>
  <text x="210" y="334" font-size="14" text-anchor="middle" fill="#2d6a4f">테이블당 1개</text>

  <!-- 구분선 -->
  <line x1="430" y1="20" x2="430" y2="450" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- 오른쪽: 논클러스터드 인덱스 -->
  <text x="655" y="34" font-size="17" font-weight="bold" text-anchor="middle" fill="#222222">논클러스터드 인덱스 (Non-Clustered)</text>
  <rect x="515" y="60" width="280" height="64" rx="6" fill="#f3f3f3" stroke="#555555" stroke-width="2"/>
  <text x="655" y="87" font-size="15" text-anchor="middle" fill="#222222">루트·중간 노드</text>
  <text x="655" y="109" font-size="13" text-anchor="middle" fill="#444444">키 + 하위 페이지 포인터</text>
  <line x1="655" y1="124" x2="655" y2="176" stroke="#555555" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="485" y="180" width="340" height="96" rx="6" fill="#e6e6e6" stroke="#555555" stroke-width="2"/>
  <text x="655" y="208" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">리프 = 인덱스 페이지</text>
  <text x="655" y="232" font-size="13" text-anchor="middle" fill="#444444">인덱스 키 (+ 포함 열)</text>
  <text x="655" y="256" font-size="13" text-anchor="middle" fill="#444444">+ 행 위치자 (row locator)</text>

  <!-- 행 위치자 갈래 -->
  <line x1="580" y1="276" x2="540" y2="350" stroke="#9d0208" stroke-width="2" marker-end="url(#arrRed)"/>
  <line x1="730" y1="276" x2="770" y2="350" stroke="#9d0208" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="520" y="312" font-size="13" text-anchor="middle" fill="#9d0208">RID</text>
  <text x="790" y="312" font-size="13" text-anchor="middle" fill="#9d0208">클러스터드 키</text>

  <rect x="450" y="354" width="190" height="80" rx="6" fill="#fdf1e6" stroke="#b45309" stroke-width="2"/>
  <text x="545" y="382" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">힙 (heap)</text>
  <text x="545" y="404" font-size="13" text-anchor="middle" fill="#444444">파일·페이지·슬롯으로</text>
  <text x="545" y="422" font-size="13" text-anchor="middle" fill="#444444">행을 바로 찾는다</text>

  <rect x="670" y="354" width="196" height="80" rx="6" fill="#eef4f1" stroke="#2d6a4f" stroke-width="2"/>
  <text x="768" y="382" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">클러스터드 인덱스</text>
  <text x="768" y="404" font-size="13" text-anchor="middle" fill="#444444">키로 한 번 더</text>
  <text x="768" y="422" font-size="13" text-anchor="middle" fill="#444444">B+트리를 탐색한다</text>
</svg>
