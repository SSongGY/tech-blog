<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="380" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">TLS 프로토콜 계층 — 레코드 위에 네 하위 프로토콜</text>

  <!-- 상위 4개 -->
  <rect x="40" y="70" width="180" height="70" rx="8" fill="#e7f0ff" stroke="#3b5b92"/>
  <text x="130" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Handshake</text>
  <text x="130" y="122" text-anchor="middle" font-size="13" fill="#444">협상·인증·키 합의 (22)</text>

  <rect x="240" y="70" width="180" height="70" rx="8" fill="#fff4e6" stroke="#b45309"/>
  <text x="330" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">ChangeCipherSpec</text>
  <text x="330" y="122" text-anchor="middle" font-size="13" fill="#444">암호 상태 전환 (20)</text>

  <rect x="440" y="70" width="180" height="70" rx="8" fill="#e7f0ff" stroke="#3b5b92"/>
  <text x="530" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Alert</text>
  <text x="530" y="122" text-anchor="middle" font-size="13" fill="#444">경고·종료 통지 (21)</text>

  <rect x="640" y="70" width="200" height="70" rx="8" fill="#e7f0ff" stroke="#3b5b92"/>
  <text x="740" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Application Data</text>
  <text x="740" y="122" text-anchor="middle" font-size="13" fill="#444">상위 응용 데이터 (23)</text>

  <!-- 레코드 -->
  <rect x="40" y="180" width="800" height="80" rx="8" fill="#e9f5ee" stroke="#2d6a4f"/>
  <text x="440" y="210" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Record Protocol</text>
  <text x="440" y="234" text-anchor="middle" font-size="13" fill="#444">단편화 → (1.2: 압축) → 보호(1.2: MAC·암호화 또는 AEAD / 1.3: AEAD만) → 전송</text>

  <!-- 전송 -->
  <rect x="40" y="290" width="800" height="44" rx="8" fill="#f1f3f5" stroke="#555"/>
  <text x="440" y="318" text-anchor="middle" font-size="14" fill="#222">신뢰성 있는 전송 계층 (TCP)</text>

  <!-- 연결선 -->
  <line x1="130" y1="140" x2="130" y2="180" stroke="#555" stroke-width="2"/>
  <line x1="330" y1="140" x2="330" y2="180" stroke="#555" stroke-width="2"/>
  <line x1="530" y1="140" x2="530" y2="180" stroke="#555" stroke-width="2"/>
  <line x1="740" y1="140" x2="740" y2="180" stroke="#555" stroke-width="2"/>
  <line x1="440" y1="260" x2="440" y2="290" stroke="#555" stroke-width="2"/>

  <text x="440" y="362" text-anchor="middle" font-size="13" fill="#b45309">괄호 안 숫자는 ContentType 값 · TLS 1.3에서 ChangeCipherSpec은 미들박스 호환용으로만 남는다</text>
</svg>
