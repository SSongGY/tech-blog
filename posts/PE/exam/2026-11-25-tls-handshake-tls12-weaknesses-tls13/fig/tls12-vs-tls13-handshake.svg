<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="430" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">전체 핸드셰이크 비교 — TLS 1.2와 TLS 1.3</text>

  <!-- 구분선 -->
  <line x1="440" y1="50" x2="440" y2="410" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ===== TLS 1.2 ===== -->
  <text x="220" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">TLS 1.2 (RFC 5246)</text>
  <rect x="20" y="68" width="100" height="32" rx="6" fill="#f1f3f5" stroke="#555"/>
  <text x="70" y="89" text-anchor="middle" font-size="14" fill="#222">클라이언트</text>
  <rect x="320" y="68" width="100" height="32" rx="6" fill="#f1f3f5" stroke="#555"/>
  <text x="370" y="89" text-anchor="middle" font-size="14" fill="#222">서버</text>
  <line x1="70" y1="100" x2="70" y2="370" stroke="#999" stroke-width="1"/>
  <line x1="370" y1="100" x2="370" y2="370" stroke="#999" stroke-width="1"/>

  <text x="220" y="124" text-anchor="middle" font-size="13" fill="#222">ClientHello</text>
  <line x1="72" y1="132" x2="366" y2="132" stroke="#555" stroke-width="2" marker-end="url(#arrGray)"/>

  <text x="220" y="160" text-anchor="middle" font-size="13" fill="#222">ServerHello, Certificate,</text>
  <text x="220" y="176" text-anchor="middle" font-size="13" fill="#222">ServerKeyExchange, ServerHelloDone</text>
  <line x1="368" y1="186" x2="74" y2="186" stroke="#555" stroke-width="2" marker-end="url(#arrGray)"/>

  <text x="220" y="214" text-anchor="middle" font-size="13" fill="#222">ClientKeyExchange,</text>
  <text x="220" y="230" text-anchor="middle" font-size="13" fill="#222">[ChangeCipherSpec], Finished</text>
  <line x1="72" y1="240" x2="366" y2="240" stroke="#555" stroke-width="2" marker-end="url(#arrGray)"/>

  <text x="220" y="268" text-anchor="middle" font-size="13" fill="#222">[ChangeCipherSpec], Finished</text>
  <line x1="368" y1="278" x2="74" y2="278" stroke="#555" stroke-width="2" marker-end="url(#arrGray)"/>

  <text x="220" y="310" text-anchor="middle" font-size="13" fill="#2d6a4f">애플리케이션 데이터</text>
  <line x1="74" y1="320" x2="366" y2="320" stroke="#2d6a4f" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#arrGreen)" marker-end="url(#arrGreen)"/>

  <text x="220" y="392" text-anchor="middle" font-size="13" fill="#9d0208">왕복 2회 뒤 데이터 · 인증서 평문 노출</text>

  <!-- ===== TLS 1.3 ===== -->
  <text x="660" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">TLS 1.3 (RFC 8446)</text>
  <rect x="460" y="68" width="100" height="32" rx="6" fill="#f1f3f5" stroke="#555"/>
  <text x="510" y="89" text-anchor="middle" font-size="14" fill="#222">클라이언트</text>
  <rect x="760" y="68" width="100" height="32" rx="6" fill="#f1f3f5" stroke="#555"/>
  <text x="810" y="89" text-anchor="middle" font-size="14" fill="#222">서버</text>
  <line x1="510" y1="100" x2="510" y2="370" stroke="#999" stroke-width="1"/>
  <line x1="810" y1="100" x2="810" y2="370" stroke="#999" stroke-width="1"/>

  <text x="660" y="124" text-anchor="middle" font-size="13" fill="#222">ClientHello + key_share</text>
  <line x1="512" y1="132" x2="806" y2="132" stroke="#555" stroke-width="2" marker-end="url(#arrGray)"/>

  <text x="660" y="160" text-anchor="middle" font-size="13" fill="#222">ServerHello + key_share</text>
  <text x="660" y="176" text-anchor="middle" font-size="13" fill="#2d6a4f">{EncryptedExtensions} {Certificate}</text>
  <text x="660" y="192" text-anchor="middle" font-size="13" fill="#2d6a4f">{CertificateVerify} {Finished}</text>
  <line x1="808" y1="202" x2="514" y2="202" stroke="#555" stroke-width="2" marker-end="url(#arrGray)"/>

  <text x="660" y="232" text-anchor="middle" font-size="13" fill="#2d6a4f">{Finished}</text>
  <line x1="512" y1="242" x2="806" y2="242" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrGreen)"/>

  <text x="660" y="272" text-anchor="middle" font-size="13" fill="#2d6a4f">애플리케이션 데이터</text>
  <line x1="514" y1="282" x2="806" y2="282" stroke="#2d6a4f" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#arrGreen)" marker-end="url(#arrGreen)"/>

  <text x="660" y="392" text-anchor="middle" font-size="13" fill="#2d6a4f">왕복 1회 뒤 데이터 · { }는 핸드셰이크 키로 암호화</text>
</svg>
