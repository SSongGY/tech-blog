<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <text x="440" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#222222">다치 종속에 따른 제4정규형 분해</text>

  <!-- before -->
  <text x="190" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d0208">사원역량 (BCNF, 4NF 위반)</text>
  <rect x="40" y="74" width="300" height="222" rx="4" fill="#fdf1f1" stroke="#9d0208" stroke-width="1.5"/>
  <line x1="40" y1="108" x2="340" y2="108" stroke="#9d0208" stroke-width="1.5"/>
  <line x1="110" y1="74" x2="110" y2="296" stroke="#9d0208" stroke-width="1"/>
  <line x1="240" y1="74" x2="240" y2="296" stroke="#9d0208" stroke-width="1"/>
  <text x="75" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">사원</text>
  <text x="175" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">자격증</text>
  <text x="290" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">외국어</text>
  <g font-size="13" fill="#333333" text-anchor="middle">
    <text x="75" y="134">김</text><text x="175" y="134">정보처리기사</text><text x="290" y="134">영어</text>
    <text x="75" y="170">김</text><text x="175" y="170">정보처리기사</text><text x="290" y="170">일본어</text>
    <text x="75" y="206">김</text><text x="175" y="206">SQLD</text><text x="290" y="206">영어</text>
    <text x="75" y="242">김</text><text x="175" y="242">SQLD</text><text x="290" y="242">일본어</text>
    <text x="75" y="278">이</text><text x="175" y="278">정보처리기사</text><text x="290" y="278">영어</text>
  </g>
  <text x="190" y="322" text-anchor="middle" font-size="13" fill="#9d0208">사원 →→ 자격증 | 외국어</text>
  <text x="190" y="344" text-anchor="middle" font-size="13" fill="#333333">김: 자격증 2 × 외국어 2 = 4행</text>

  <!-- arrow -->
  <line x1="356" y1="185" x2="474" y2="185" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="415" y="174" text-anchor="middle" font-size="13" fill="#333333">무손실 분해</text>
  <text x="415" y="206" text-anchor="middle" font-size="13" fill="#333333">(프로젝션)</text>

  <!-- after 1 -->
  <text x="575" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">사원자격증 (4NF)</text>
  <rect x="490" y="74" width="170" height="142" rx="4" fill="#ecf6f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <line x1="490" y1="108" x2="660" y2="108" stroke="#2d6a4f" stroke-width="1.5"/>
  <line x1="540" y1="74" x2="540" y2="216" stroke="#2d6a4f" stroke-width="1"/>
  <text x="515" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">사원</text>
  <text x="600" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">자격증</text>
  <g font-size="13" fill="#333333" text-anchor="middle">
    <text x="515" y="134">김</text><text x="600" y="134">정보처리기사</text>
    <text x="515" y="166">김</text><text x="600" y="166">SQLD</text>
    <text x="515" y="198">이</text><text x="600" y="198">정보처리기사</text>
  </g>

  <!-- after 2 -->
  <text x="765" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">사원외국어 (4NF)</text>
  <rect x="690" y="74" width="150" height="142" rx="4" fill="#ecf6f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <line x1="690" y1="108" x2="840" y2="108" stroke="#2d6a4f" stroke-width="1.5"/>
  <line x1="740" y1="74" x2="740" y2="216" stroke="#2d6a4f" stroke-width="1"/>
  <text x="715" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">사원</text>
  <text x="790" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">외국어</text>
  <g font-size="13" fill="#333333" text-anchor="middle">
    <text x="715" y="134">김</text><text x="790" y="134">영어</text>
    <text x="715" y="166">김</text><text x="790" y="166">일본어</text>
    <text x="715" y="198">이</text><text x="790" y="198">영어</text>
  </g>

  <text x="665" y="246" text-anchor="middle" font-size="13" fill="#333333">두 표를 사원으로 자연 조인하면</text>
  <text x="665" y="268" text-anchor="middle" font-size="13" fill="#333333">원래의 5행이 그대로 나온다</text>
  <text x="665" y="296" text-anchor="middle" font-size="13" fill="#2d6a4f">김: 자격증 2행 + 외국어 2행</text>

  <text x="440" y="382" text-anchor="middle" font-size="13" fill="#555555">서로 무관한 두 다치 속성을 한 표에 두면 조합 수만큼 행이 생긴다. 분해하면 사실 하나가 한 행이 된다</text>
</svg>
