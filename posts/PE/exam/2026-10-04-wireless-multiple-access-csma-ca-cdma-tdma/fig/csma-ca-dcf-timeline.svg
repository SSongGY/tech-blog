<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#1b1b1b" stroke-width="1.6"/>
    </marker>
  </defs>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">CSMA/CA(802.11 DCF) 기본 접근 — 한 번의 전송</text>

  <!-- row labels -->
  <text x="24" y="86" font-size="14" font-weight="bold" fill="#1b1b1b">송신 국 A</text>
  <text x="24" y="156" font-size="14" font-weight="bold" fill="#1b1b1b">수신 국</text>
  <text x="24" y="226" font-size="14" font-weight="bold" fill="#1b1b1b">다른 국 B</text>

  <!-- station A -->
  <rect x="140" y="64" width="64" height="34" fill="#f3f4f6" stroke="#4a5568" stroke-width="1.4"/>
  <text x="172" y="86" text-anchor="middle" font-size="13" fill="#1b1b1b">DIFS</text>
  <rect x="204" y="64" width="96" height="34" fill="#f3f4f6" stroke="#4a5568" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="252" y="86" text-anchor="middle" font-size="13" fill="#1b1b1b">백오프</text>
  <rect x="300" y="64" width="250" height="34" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="425" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">DATA</text>

  <!-- receiver -->
  <rect x="550" y="134" width="44" height="34" fill="#f3f4f6" stroke="#4a5568" stroke-width="1.4"/>
  <text x="572" y="156" text-anchor="middle" font-size="13" fill="#1b1b1b">SIFS</text>
  <rect x="594" y="134" width="90" height="34" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="639" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">ACK</text>

  <!-- station B -->
  <rect x="140" y="204" width="160" height="34" fill="#f3f4f6" stroke="#4a5568" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="220" y="226" text-anchor="middle" font-size="13" fill="#1b1b1b">DIFS 후 백오프 감소</text>
  <rect x="300" y="204" width="384" height="34" fill="#fdf3e7" stroke="#b45309" stroke-width="1.6"/>
  <text x="492" y="226" text-anchor="middle" font-size="13" fill="#b45309">매체 사용 감지 → 카운터 정지 (남은 값 유지)</text>
  <rect x="684" y="204" width="176" height="34" fill="#f3f4f6" stroke="#4a5568" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="772" y="226" text-anchor="middle" font-size="13" fill="#1b1b1b">DIFS 후 남은 값부터</text>

  <!-- time axis -->
  <line x1="140" y1="272" x2="860" y2="272" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="860" y="292" text-anchor="end" font-size="13" fill="#4a5568">시간</text>
  <line x1="550" y1="98" x2="550" y2="272" stroke="#4a5568" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="684" y1="168" x2="684" y2="272" stroke="#4a5568" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- notes -->
  <text x="24" y="322" font-size="13" fill="#1b1b1b">① 백오프 = 0 ~ CW-1 중 무작위 슬롯 수. 전송 실패(ACK 없음)마다 CW를 두 배로, CWmax까지 늘린다</text>
  <text x="24" y="346" font-size="13" fill="#1b1b1b">② SIFS가 DIFS보다 짧으므로 ACK는 다른 국이 DIFS를 다 기다리기 전에 매체를 잡는다</text>
  <text x="24" y="370" font-size="13" fill="#1b1b1b">③ 자기 송신을 들어 충돌을 알 수 없으므로 성공 여부를 ACK로 확인한다 — CSMA/CD와 갈리는 지점</text>
</svg>
