<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="420" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#1b1b1b" stroke-width="1.6"/>
    </marker>
  </defs>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">같은 반송파를 나누는 두 방법 — 시간(TDMA)과 코드(CDMA)</text>
  <line x1="440" y1="50" x2="440" y2="400" stroke="#cbd5e0" stroke-width="1.2"/>

  <!-- TDMA panel -->
  <text x="220" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">TDMA — 타임슬롯으로 나눈다 (GSM)</text>

  <text x="24" y="122" font-size="13" fill="#1b1b1b">하향</text>
  <g font-size="13" text-anchor="middle" fill="#1b1b1b">
    <rect x="64" y="100" width="44" height="34" fill="#f3f4f6" stroke="#4a5568"/><text x="86" y="122">0</text>
    <rect x="108" y="100" width="44" height="34" fill="#f3f4f6" stroke="#4a5568"/><text x="130" y="122">1</text>
    <rect x="152" y="100" width="44" height="34" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.8"/><text x="174" y="122" font-weight="bold" fill="#2d6a4f">2</text>
    <rect x="196" y="100" width="44" height="34" fill="#f3f4f6" stroke="#4a5568"/><text x="218" y="122">3</text>
    <rect x="240" y="100" width="44" height="34" fill="#f3f4f6" stroke="#4a5568"/><text x="262" y="122">4</text>
    <rect x="284" y="100" width="44" height="34" fill="#f3f4f6" stroke="#4a5568"/><text x="306" y="122">5</text>
    <rect x="328" y="100" width="44" height="34" fill="#f3f4f6" stroke="#4a5568"/><text x="350" y="122">6</text>
    <rect x="372" y="100" width="44" height="34" fill="#f3f4f6" stroke="#4a5568"/><text x="394" y="122">7</text>
  </g>

  <text x="24" y="192" font-size="13" fill="#1b1b1b">상향</text>
  <g font-size="13" text-anchor="middle" fill="#1b1b1b">
    <rect x="196" y="170" width="44" height="34" fill="#f3f4f6" stroke="#4a5568"/><text x="218" y="192">0</text>
    <rect x="240" y="170" width="44" height="34" fill="#f3f4f6" stroke="#4a5568"/><text x="262" y="192">1</text>
    <rect x="284" y="170" width="44" height="34" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.8"/><text x="306" y="192" font-weight="bold" fill="#2d6a4f">2</text>
    <rect x="328" y="170" width="44" height="34" fill="#f3f4f6" stroke="#4a5568"/><text x="350" y="192">3</text>
    <rect x="372" y="170" width="44" height="34" fill="#f3f4f6" stroke="#4a5568"/><text x="394" y="192">4</text>
  </g>
  <line x1="64" y1="152" x2="192" y2="152" stroke="#b45309" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="128" y="164" text-anchor="middle" font-size="13" fill="#b45309">3슬롯 지연</text>

  <text x="40" y="244" font-size="13" fill="#1b1b1b">· 슬롯 ≈ 577 µs, 8개가 TDMA 프레임 ≈ 4.62 ms</text>
  <text x="40" y="268" font-size="13" fill="#1b1b1b">· 단말은 같은 번호의 슬롯을 하향·상향에 쓰되</text>
  <text x="52" y="290" font-size="13" fill="#1b1b1b">송신과 수신을 동시에 하지 않는다</text>
  <text x="40" y="314" font-size="13" fill="#1b1b1b">· 슬롯 사이 보호 구간, 전파 지연은 타이밍 어드밴스로 보정</text>
  <text x="40" y="338" font-size="13" fill="#1b1b1b">· 반송파 여러 개를 다시 주파수로 나눈다 (FDMA 결합)</text>

  <!-- CDMA panel -->
  <text x="660" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">CDMA — 직교 코드로 나눈다 (W-CDMA)</text>

  <g font-size="13" text-anchor="middle" fill="#1b1b1b">
    <rect x="470" y="140" width="64" height="34" fill="#f3f4f6" stroke="#4a5568"/><text x="502" y="162">(1)</text>
    <rect x="574" y="106" width="84" height="34" fill="#f3f4f6" stroke="#4a5568"/><text x="616" y="128">(1,1)</text>
    <rect x="574" y="174" width="84" height="34" fill="#f3f4f6" stroke="#4a5568"/><text x="616" y="196">(1,-1)</text>
    <rect x="700" y="84" width="150" height="30" fill="#eef5f0" stroke="#2d6a4f"/><text x="775" y="104">(1,1,1,1)</text>
    <rect x="700" y="120" width="150" height="30" fill="#eef5f0" stroke="#2d6a4f"/><text x="775" y="140">(1,1,-1,-1)</text>
    <rect x="700" y="160" width="150" height="30" fill="#eef5f0" stroke="#2d6a4f"/><text x="775" y="180">(1,-1,1,-1)</text>
    <rect x="700" y="196" width="150" height="30" fill="#eef5f0" stroke="#2d6a4f"/><text x="775" y="216">(1,-1,-1,1)</text>
  </g>
  <g stroke="#4a5568" stroke-width="1.2" fill="none">
    <path d="M534,157 L574,123"/><path d="M534,157 L574,191"/>
    <path d="M658,123 L700,99"/><path d="M658,123 L700,135"/>
    <path d="M658,191 L700,175"/><path d="M658,191 L700,211"/>
  </g>
  <text x="502" y="234" text-anchor="middle" font-size="13" fill="#4a5568">SF=1</text>
  <text x="616" y="234" text-anchor="middle" font-size="13" fill="#4a5568">SF=2</text>
  <text x="775" y="246" text-anchor="middle" font-size="13" fill="#4a5568">SF=4 — 서로 직교</text>

  <text x="470" y="282" font-size="13" fill="#1b1b1b">· 채널화(OVSF): 한 송신원 안의 채널을 구분</text>
  <text x="470" y="306" font-size="13" fill="#1b1b1b">· 스크램블링: 하향은 셀, 상향은 단말을 구분</text>
  <text x="470" y="330" font-size="13" fill="#1b1b1b">· 모두 같은 시간·같은 반송파, 칩 속도 3.84 Mcps</text>
  <text x="470" y="354" font-size="13" fill="#9d0208">· 받는 세기가 달라지면 간섭이 커진다 → 슬롯마다</text>
  <text x="482" y="376" font-size="13" fill="#9d0208">전력 제어 명령(TPC)으로 송신 전력을 맞춘다</text>
</svg>
