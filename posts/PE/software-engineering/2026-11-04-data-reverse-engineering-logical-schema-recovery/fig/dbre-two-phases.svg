<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Segoe UI',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fbfbf8"/>
  <defs>
    <marker id="fwd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
    <marker id="rev" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f"/>
    </marker>
    <marker id="warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <text x="14" y="26" font-size="16" font-weight="bold" fill="#1b1b1b">데이터 역공학의 두 단계 — 순공학을 거꾸로 올라간다</text>
  <text x="14" y="46" font-size="13" fill="#555">왼쪽 회색이 순공학(내려감), 오른쪽 초록이 역공학(올라감). 같은 높이의 상자가 서로 역이다.</text>

  <!-- 열 제목 -->
  <text x="160" y="76" font-size="13" font-weight="bold" fill="#555" text-anchor="middle">순공학</text>
  <text x="720" y="76" font-size="13" font-weight="bold" fill="#2d6a4f" text-anchor="middle">역공학 (DBRE)</text>

  <!-- 가운데 스키마 세 단 -->
  <rect x="330" y="86" width="220" height="46" rx="4" fill="#eceae4" stroke="#777" stroke-width="2"/>
  <text x="440" y="114" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">개념 스키마</text>

  <rect x="330" y="240" width="220" height="46" rx="4" fill="#eceae4" stroke="#777" stroke-width="2"/>
  <text x="440" y="268" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">논리 스키마</text>

  <rect x="330" y="394" width="220" height="60" rx="4" fill="#eceae4" stroke="#777" stroke-width="2"/>
  <text x="440" y="418" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">운영 중인 데이터베이스</text>
  <text x="440" y="440" font-size="13" fill="#444" text-anchor="middle">DDL · 프로그램 · 데이터</text>

  <!-- 왼쪽: 순공학 -->
  <rect x="40" y="150" width="240" height="66" rx="4" fill="#f1f0ec" stroke="#777" stroke-width="2"/>
  <text x="160" y="174" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">논리 설계</text>
  <text x="160" y="196" font-size="13" fill="#444" text-anchor="middle">모델 번역 · 최적화</text>

  <rect x="40" y="304" width="240" height="66" rx="4" fill="#f1f0ec" stroke="#777" stroke-width="2"/>
  <text x="160" y="328" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">물리 설계 · DDL 코딩</text>
  <text x="160" y="350" font-size="13" fill="#9d0208" text-anchor="middle">일부 제약이 여기서 버려진다</text>

  <polyline points="330,109 160,109 160,148" fill="none" stroke="#777" stroke-width="2" marker-end="url(#fwd)"/>
  <polyline points="160,216 160,263 328,263" fill="none" stroke="#777" stroke-width="2" marker-end="url(#fwd)"/>
  <polyline points="330,263 160,263" fill="none" stroke="#777" stroke-width="2"/>
  <polyline points="160,263 160,302" fill="none" stroke="#777" stroke-width="2" marker-end="url(#fwd)"/>
  <polyline points="160,370 160,424 328,424" fill="none" stroke="#777" stroke-width="2" marker-end="url(#fwd)"/>

  <!-- 오른쪽: 역공학 -->
  <rect x="600" y="140" width="250" height="86" rx="4" fill="#d7e8dd" stroke="#2d6a4f" stroke-width="2"/>
  <text x="725" y="164" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">2. 데이터 구조 개념화</text>
  <text x="725" y="186" font-size="13" fill="#444" text-anchor="middle">준비 → 역번역 · 역최적화</text>
  <text x="725" y="206" font-size="13" fill="#444" text-anchor="middle">→ 개념 정규화</text>

  <rect x="600" y="294" width="250" height="86" rx="4" fill="#d7e8dd" stroke="#2d6a4f" stroke-width="2"/>
  <text x="725" y="318" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">1. 데이터 구조 추출</text>
  <text x="725" y="340" font-size="13" fill="#444" text-anchor="middle">DDL 코드 분석 → 스키마 정제</text>
  <text x="725" y="360" font-size="13" fill="#444" text-anchor="middle">→ 스키마 정리</text>

  <polyline points="550,424 725,424 725,382" fill="none" stroke="#2d6a4f" stroke-width="2" marker-end="url(#rev)"/>
  <polyline points="725,294 725,263 552,263" fill="none" stroke="#2d6a4f" stroke-width="2" marker-end="url(#rev)"/>
  <polyline points="550,263 725,263" fill="none" stroke="#2d6a4f" stroke-width="2"/>
  <polyline points="725,263 725,228" fill="none" stroke="#2d6a4f" stroke-width="2" marker-end="url(#rev)"/>
  <polyline points="725,140 725,109 552,109" fill="none" stroke="#2d6a4f" stroke-width="2" marker-end="url(#rev)"/>

  <!-- 버려진 의미의 흔적 -->
  <rect x="600" y="394" width="250" height="60" rx="4" fill="#fdf1e3" stroke="#b45309" stroke-width="2"/>
  <text x="725" y="416" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">버려진 제약의 흔적 E(D)</text>
  <text x="725" y="438" font-size="13" fill="#444" text-anchor="middle">데이터 · 운영 절차 · 사용자 지식</text>
  <line x1="790" y1="394" x2="790" y2="382" stroke="#b45309" stroke-width="2" marker-end="url(#warn)"/>
</svg>
