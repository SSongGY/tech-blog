<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="450" fill="#fdfdfb"/>

  <text x="40" y="32" font-size="15" font-weight="bold" fill="#1b1b1b">독립 영향 쌍 — Z = (A or B) and (C or D) 에서 A 하나만 바꿔 Z 를 뒤집는 두 케이스</text>

  <!-- 게이트 도식 -->
  <rect x="40" y="56" width="120" height="34" rx="4" fill="#ffffff" stroke="#44403c" stroke-width="1.3"/>
  <text x="100" y="78" font-size="14" fill="#1b1b1b" text-anchor="middle">A</text>
  <rect x="40" y="102" width="120" height="34" rx="4" fill="#ffffff" stroke="#44403c" stroke-width="1.3"/>
  <text x="100" y="124" font-size="14" fill="#1b1b1b" text-anchor="middle">B</text>
  <rect x="40" y="172" width="120" height="34" rx="4" fill="#ffffff" stroke="#44403c" stroke-width="1.3"/>
  <text x="100" y="194" font-size="14" fill="#1b1b1b" text-anchor="middle">C</text>
  <rect x="40" y="218" width="120" height="34" rx="4" fill="#ffffff" stroke="#44403c" stroke-width="1.3"/>
  <text x="100" y="240" font-size="14" fill="#1b1b1b" text-anchor="middle">D</text>

  <rect x="210" y="76" width="96" height="44" rx="4" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="258" y="104" font-size="14" fill="#2d6a4f" text-anchor="middle">or1</text>
  <rect x="210" y="192" width="96" height="44" rx="4" fill="#ffffff" stroke="#44403c" stroke-width="1.3"/>
  <text x="258" y="220" font-size="14" fill="#1b1b1b" text-anchor="middle">or2</text>

  <rect x="356" y="134" width="96" height="44" rx="4" fill="#ffffff" stroke="#44403c" stroke-width="1.3"/>
  <text x="404" y="162" font-size="14" fill="#1b1b1b" text-anchor="middle">and</text>

  <rect x="502" y="134" width="96" height="44" rx="4" fill="#eef4f0" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="550" y="162" font-size="14" fill="#2d6a4f" text-anchor="middle">Z</text>

  <line x1="160" y1="73" x2="206" y2="90" stroke="#44403c" stroke-width="1.3"/>
  <line x1="160" y1="119" x2="206" y2="106" stroke="#44403c" stroke-width="1.3"/>
  <line x1="160" y1="189" x2="206" y2="206" stroke="#44403c" stroke-width="1.3"/>
  <line x1="160" y1="235" x2="206" y2="222" stroke="#44403c" stroke-width="1.3"/>
  <line x1="306" y1="98" x2="352" y2="148" stroke="#2d6a4f" stroke-width="1.6"/>
  <line x1="306" y1="214" x2="352" y2="164" stroke="#44403c" stroke-width="1.3"/>
  <line x1="452" y1="156" x2="498" y2="156" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- 두 케이스 -->
  <text x="636" y="74" font-size="14" font-weight="bold" fill="#1b1b1b">독립 영향 쌍 (2, 10)</text>

  <text x="636" y="104" font-size="13" fill="#57534e">케이스 2</text>
  <text x="730" y="104" font-size="14" fill="#9d0208">A=F</text>
  <text x="786" y="104" font-size="13" fill="#57534e">B=F C=F D=T</text>
  <text x="636" y="126" font-size="13" fill="#57534e">결과</text>
  <text x="730" y="126" font-size="14" fill="#9d0208">Z=F</text>

  <text x="636" y="160" font-size="13" fill="#57534e">케이스 10</text>
  <text x="730" y="160" font-size="14" fill="#2d6a4f">A=T</text>
  <text x="786" y="160" font-size="13" fill="#57534e">B=F C=F D=T</text>
  <text x="636" y="182" font-size="13" fill="#57534e">결과</text>
  <text x="730" y="182" font-size="14" fill="#2d6a4f">Z=T</text>

  <line x1="636" y1="198" x2="858" y2="198" stroke="#d6d3d1" stroke-width="1"/>
  <text x="636" y="222" font-size="13" fill="#1b1b1b">A 만 바뀌고 Z 도 바뀐다</text>
  <text x="636" y="240" font-size="13" fill="#1b1b1b">→ A 의 독립 영향</text>
  <text x="636" y="262" font-size="13" fill="#57534e">B=F 라서 or1 이 A 를 안 가리고,</text>
  <text x="636" y="280" font-size="13" fill="#57534e">(C or D)=T 라서 and 가</text>
  <text x="636" y="298" font-size="13" fill="#57534e">or1 을 안 가린다</text>

  <!-- 두 방식 -->
  <rect x="40" y="332" width="390" height="92" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="58" y="358" font-size="14" font-weight="bold" fill="#2d6a4f">유일 원인 (unique-cause)</text>
  <text x="58" y="382" font-size="13" fill="#57534e">그 조건만 바꾸고 나머지는 전부 고정한다.</text>
  <text x="58" y="404" font-size="13" fill="#57534e">식의 논리를 들여다볼 필요가 없다.</text>

  <rect x="452" y="332" width="390" height="92" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
  <text x="470" y="358" font-size="14" font-weight="bold" fill="#b45309">마스킹 (masking)</text>
  <text x="470" y="382" font-size="13" fill="#57534e">나머지가 같이 변해도 영향이 차단됨을 보이면</text>
  <text x="470" y="404" font-size="13" fill="#57534e">된다. 대신 식의 논리를 분석해야 한다.</text>

  <defs>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2d6a4f"/>
    </marker>
  </defs>
</svg>
