<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="430" fill="#fdfdfb"/>

  <text x="40" y="32" font-size="15" font-weight="bold" fill="#1b1b1b">구조 커버리지 여섯 기준 — 무엇을 요구하고, DO-178B가 어느 레벨에서 요구하는가</text>

  <text x="52" y="66" font-size="13" fill="#57534e">기준 (약함 → 강함)</text>
  <text x="372" y="66" font-size="13" fill="#57534e">추가로 요구하는 것</text>
  <text x="664" y="66" font-size="13" fill="#57534e">DO-178B 표 A-7</text>
  <line x1="40" y1="74" x2="840" y2="74" stroke="#44403c" stroke-width="1.2"/>

  <rect x="40" y="86" width="310" height="42" rx="5" fill="#ffffff" stroke="#44403c" stroke-width="1.3"/>
  <text x="56" y="112" font-size="14" fill="#1b1b1b">① 문장 커버리지</text>
  <text x="372" y="112" font-size="13" fill="#57534e">모든 문장을 한 번씩 실행</text>
  <text x="664" y="112" font-size="13" fill="#1b1b1b">목표 7 · 레벨 A~C</text>

  <rect x="40" y="136" width="310" height="42" rx="5" fill="#ffffff" stroke="#44403c" stroke-width="1.3"/>
  <text x="56" y="162" font-size="14" fill="#1b1b1b">② 판단 커버리지</text>
  <text x="372" y="162" font-size="13" fill="#57534e">판단마다 참·거짓 결과를 둘 다</text>
  <text x="664" y="162" font-size="13" fill="#1b1b1b">목표 6 · 레벨 A~B</text>

  <rect x="40" y="186" width="310" height="42" rx="5" fill="#ffffff" stroke="#44403c" stroke-width="1.3"/>
  <text x="56" y="212" font-size="14" fill="#1b1b1b">③ 조건 커버리지</text>
  <text x="372" y="212" font-size="13" fill="#57534e">조건마다 참·거짓을 둘 다</text>
  <text x="664" y="212" font-size="13" fill="#78716c">해당 목표 없음</text>

  <rect x="40" y="236" width="310" height="42" rx="5" fill="#ffffff" stroke="#44403c" stroke-width="1.3"/>
  <text x="56" y="262" font-size="14" fill="#1b1b1b">④ 조건/판단 커버리지</text>
  <text x="372" y="262" font-size="13" fill="#57534e">②와 ③을 함께</text>
  <text x="664" y="262" font-size="13" fill="#78716c">해당 목표 없음</text>

  <rect x="40" y="286" width="310" height="42" rx="5" fill="#eef4f0" stroke="#2d6a4f" stroke-width="2"/>
  <text x="56" y="312" font-size="14" font-weight="bold" fill="#2d6a4f">⑤ MC/DC</text>
  <text x="372" y="306" font-size="13" fill="#2d6a4f">조건마다 그 조건 혼자서 결과를</text>
  <text x="372" y="322" font-size="13" fill="#2d6a4f">바꾼다는 것을 보임 (독립 영향)</text>
  <text x="664" y="312" font-size="13" font-weight="bold" fill="#2d6a4f">목표 5 · 레벨 A</text>

  <rect x="40" y="336" width="310" height="42" rx="5" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/>
  <text x="56" y="362" font-size="14" fill="#b45309">⑥ 다중 조건 커버리지</text>
  <text x="372" y="362" font-size="13" fill="#b45309">조건 조합 2ⁿ가지를 전부</text>
  <text x="664" y="362" font-size="13" fill="#78716c">해당 목표 없음</text>

  <line x1="26" y1="92" x2="26" y2="370" stroke="#44403c" stroke-width="1.4" marker-end="url(#down)"/>
  <text x="18" y="402" font-size="13" fill="#57534e">케이스 수: ①②③④는 판단당 최소 2개 · ⑤는 입력 n개에 최소 n+1개 · ⑥은 2ⁿ개</text>

  <defs>
    <marker id="down" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L8,0 L4,8 z" fill="#44403c"/>
    </marker>
  </defs>
</svg>
