<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <rect x="0" y="0" width="880" height="500" fill="#ffffff"/>

  <!-- 루트 -->
  <rect x="370" y="20" width="140" height="36" rx="4" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <text x="440" y="44" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">결제 요청</text>

  <!-- 루트 → 분류 -->
  <g stroke="#374151" stroke-width="1.3" fill="none">
    <line x1="440" y1="56" x2="246" y2="90"/>
    <line x1="440" y1="56" x2="484" y2="90"/>
    <line x1="440" y1="56" x2="654" y2="90"/>
    <line x1="440" y1="56" x2="790" y2="90"/>
  </g>

  <!-- 분류 4개 -->
  <rect x="114" y="90" width="264" height="34" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
  <text x="246" y="112" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a8a">분류: 결제 수단</text>
  <rect x="386" y="90" width="196" height="34" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
  <text x="484" y="112" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a8a">분류: 금액</text>
  <rect x="590" y="90" width="128" height="34" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
  <text x="654" y="112" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a8a">분류: 할부</text>
  <rect x="726" y="90" width="128" height="34" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
  <text x="790" y="112" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a8a">분류: 회원 등급</text>

  <!-- 결제 수단 → 클래스 -->
  <g stroke="#374151" stroke-width="1.2" fill="none">
    <line x1="246" y1="124" x2="178" y2="146"/>
    <line x1="246" y1="124" x2="280" y2="250"/>
    <line x1="246" y1="124" x2="348" y2="250"/>
  </g>
  <!-- 카드 클래스와 하위 분류 -->
  <text x="178" y="162" font-size="14" text-anchor="middle" fill="#111827">클래스: 카드</text>
  <line x1="178" y1="168" x2="178" y2="186" stroke="#374151" stroke-width="1.2"/>
  <rect x="106" y="186" width="144" height="30" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
  <text x="178" y="206" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">하위 분류: 카드 종류</text>
  <g stroke="#374151" stroke-width="1.2" fill="none">
    <line x1="178" y1="216" x2="144" y2="250"/>
    <line x1="178" y1="216" x2="212" y2="250"/>
    <!-- 금액 -->
    <line x1="484" y1="124" x2="416" y2="250"/>
    <line x1="484" y1="124" x2="484" y2="250"/>
    <line x1="484" y1="124" x2="552" y2="250"/>
    <!-- 할부 -->
    <line x1="654" y1="124" x2="620" y2="250"/>
    <line x1="654" y1="124" x2="688" y2="250"/>
    <!-- 회원 등급 -->
    <line x1="790" y1="124" x2="756" y2="250"/>
    <line x1="790" y1="124" x2="824" y2="250"/>
  </g>

  <!-- 잎 클래스 11칸 -->
  <g font-size="13" text-anchor="middle" fill="#111827">
    <rect x="112" y="250" width="64" height="30" fill="#f9fafb" stroke="#6b7280"/><text x="144" y="270">신용</text>
    <rect x="180" y="250" width="64" height="30" fill="#f9fafb" stroke="#6b7280"/><text x="212" y="270">체크</text>
    <rect x="248" y="250" width="64" height="30" fill="#f9fafb" stroke="#6b7280"/><text x="280" y="270">계좌이체</text>
    <rect x="316" y="250" width="64" height="30" fill="#f9fafb" stroke="#6b7280"/><text x="348" y="270">간편결제</text>
    <rect x="384" y="250" width="64" height="30" fill="#f9fafb" stroke="#6b7280"/><text x="416" y="270">최소 미만</text>
    <rect x="452" y="250" width="64" height="30" fill="#f9fafb" stroke="#6b7280"/><text x="484" y="270">정상</text>
    <rect x="520" y="250" width="64" height="30" fill="#f9fafb" stroke="#6b7280"/><text x="552" y="270">한도 초과</text>
    <rect x="588" y="250" width="64" height="30" fill="#f9fafb" stroke="#6b7280"/><text x="620" y="270">일시불</text>
    <rect x="656" y="250" width="64" height="30" fill="#fef3c7" stroke="#b45309"/><text x="688" y="270">할부</text>
    <rect x="724" y="250" width="64" height="30" fill="#f9fafb" stroke="#6b7280"/><text x="756" y="270">일반</text>
    <rect x="792" y="250" width="64" height="30" fill="#f9fafb" stroke="#6b7280"/><text x="824" y="270">우수</text>
  </g>

  <!-- 조합표 -->
  <line x1="30" y1="296" x2="858" y2="296" stroke="#374151" stroke-width="1.5"/>
  <text x="30" y="318" font-size="13" font-weight="bold" fill="#374151">조합표 · 최소 클래스 커버리지 4건</text>
  <g stroke="#d1d5db" stroke-width="1">
    <line x1="30" y1="352" x2="858" y2="352"/>
    <line x1="30" y1="384" x2="858" y2="384"/>
    <line x1="30" y1="416" x2="858" y2="416"/>
    <line x1="30" y1="448" x2="858" y2="448"/>
  </g>
  <g font-size="14" fill="#111827">
    <text x="40" y="343">TC1</text>
    <text x="40" y="375">TC2</text>
    <text x="40" y="407">TC3</text>
    <text x="40" y="439">TC4</text>
  </g>
  <g fill="#2d6a4f">
    <!-- TC1 신용 최소미만 할부 일반 -->
    <circle cx="144" cy="338" r="7"/><circle cx="416" cy="338" r="7"/><circle cx="688" cy="338" r="7"/><circle cx="756" cy="338" r="7"/>
    <!-- TC2 체크 최소미만 일시불 일반 -->
    <circle cx="212" cy="370" r="7"/><circle cx="416" cy="370" r="7"/><circle cx="620" cy="370" r="7"/><circle cx="756" cy="370" r="7"/>
    <!-- TC3 계좌이체 정상 일시불 일반 -->
    <circle cx="280" cy="402" r="7"/><circle cx="484" cy="402" r="7"/><circle cx="620" cy="402" r="7"/><circle cx="756" cy="402" r="7"/>
    <!-- TC4 간편결제 한도초과 일시불 우수 -->
    <circle cx="348" cy="434" r="7"/><circle cx="552" cy="434" r="7"/><circle cx="620" cy="434" r="7"/><circle cx="824" cy="434" r="7"/>
  </g>
  <line x1="144" y1="338" x2="688" y2="338" stroke="#2d6a4f" stroke-width="1.5"/>
  <line x1="212" y1="370" x2="756" y2="370" stroke="#2d6a4f" stroke-width="1.5"/>
  <line x1="280" y1="402" x2="756" y2="402" stroke="#2d6a4f" stroke-width="1.5"/>
  <line x1="348" y1="434" x2="824" y2="434" stroke="#2d6a4f" stroke-width="1.5"/>

  <text x="30" y="478" font-size="13" fill="#b45309">의존 규칙: 할부 클래스는 신용 클래스와만 조합한다 → 할부를 고를 수 있는 행은 신용 행 하나뿐</text>
</svg>
