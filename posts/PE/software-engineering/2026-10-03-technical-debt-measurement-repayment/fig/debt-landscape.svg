<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#fbfbf8"/>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">기술부채의 범위 — 보이지 않는 개선 항목만 부채로 센다</text>
  <text x="30" y="56" font-size="13" fill="#555">Kruchten·Nord·Ozkaya(2012) Figure 1을 단순화 · 왼쪽은 진화(evolvability), 오른쪽은 품질(maintainability) 문제</text>

  <text x="235" y="90" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">진화 문제</text>
  <text x="645" y="90" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">품질 문제</text>

  <!-- 보이는 것: 왼쪽 -->
  <rect x="30" y="104" width="150" height="230" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.2"/>
  <text x="105" y="134" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">보인다</text>
  <text x="105" y="200" font-size="13" fill="#1b1b1b" text-anchor="middle">새 기능</text>
  <text x="105" y="222" font-size="13" fill="#1b1b1b" text-anchor="middle">추가 기능</text>

  <!-- 보이지 않는 것: 부채 상자 -->
  <rect x="195" y="104" width="490" height="230" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="130" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">대부분 보이지 않는다 = 기술부채</text>

  <rect x="210" y="146" width="220" height="104" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1"/>
  <text x="320" y="170" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">아키텍처 쪽</text>
  <text x="320" y="194" font-size="13" fill="#1b1b1b" text-anchor="middle">아키텍처 부채 · 구조 부채</text>
  <text x="320" y="216" font-size="13" fill="#1b1b1b" text-anchor="middle">기술 격차</text>

  <rect x="450" y="146" width="220" height="104" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1"/>
  <text x="560" y="170" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">코드 쪽</text>
  <text x="560" y="194" font-size="13" fill="#1b1b1b" text-anchor="middle">낮은 내부 품질 · 코드 복잡도</text>
  <text x="560" y="216" font-size="13" fill="#1b1b1b" text-anchor="middle">코드 스멜 · 스타일 위반</text>
  <text x="560" y="238" font-size="13" fill="#2d6a4f" text-anchor="middle">정적 분석이 잡는 곳</text>

  <text x="440" y="282" font-size="13" fill="#1b1b1b" text-anchor="middle">테스트 부채 · 문서 부채</text>
  <text x="440" y="310" font-size="13" fill="#555" text-anchor="middle">(원 그림에서 이 상자 안에 함께 놓인 항목)</text>

  <!-- 보이는 것: 오른쪽 -->
  <rect x="700" y="104" width="150" height="230" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.2"/>
  <text x="775" y="134" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">보인다</text>
  <text x="775" y="200" font-size="13" fill="#1b1b1b" text-anchor="middle">결함</text>
  <text x="775" y="222" font-size="13" fill="#1b1b1b" text-anchor="middle">낮은 외부 품질</text>

  <text x="30" y="364" font-size="13" fill="#333">새 기능과 결함은 개선 대상이지만 부채가 아니다. 부채는 개발자에게만 보이는, 과거 결정의 결과로 한정한다.</text>
  <text x="30" y="386" font-size="13" fill="#333">코드 분석 도구는 오른쪽 '코드 쪽'만 본다. 아키텍처 부채와 기술 격차는 도구가 찾지 못한다.</text>
</svg>
