<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fbfbf8"/>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">두 그림이 같은 규칙을 그린다 — 소스 코드 의존은 안쪽으로만</text>

  <!-- 왼쪽: 헥사고날 -->
  <text x="215" y="70" font-size="15" font-weight="bold" fill="#1b1b1b" text-anchor="middle">헥사고날 (Cockburn, 2005)</text>
  <polygon points="215,110 300,160 300,260 215,310 130,260 130,160" fill="#eef5f0" stroke="#2d6a4f" stroke-width="2"/>
  <text x="215" y="204" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">애플리케이션</text>
  <text x="215" y="224" font-size="13" fill="#333" text-anchor="middle">업무 규칙</text>

  <!-- 포트 -->
  <rect x="120" y="196" width="20" height="30" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <rect x="290" y="196" width="20" height="30" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="215" y="256" font-size="13" fill="#2d6a4f" text-anchor="middle">변 위의 칸 = 포트</text>

  <!-- 어댑터 -->
  <rect x="24" y="150" width="70" height="36" rx="4" fill="#ffffff" stroke="#3b3b3b"/>
  <text x="59" y="173" font-size="13" fill="#1b1b1b" text-anchor="middle">UI</text>
  <rect x="24" y="236" width="70" height="36" rx="4" fill="#ffffff" stroke="#3b3b3b"/>
  <text x="59" y="259" font-size="13" fill="#1b1b1b" text-anchor="middle">테스트</text>
  <rect x="336" y="150" width="70" height="36" rx="4" fill="#ffffff" stroke="#3b3b3b"/>
  <text x="371" y="173" font-size="13" fill="#1b1b1b" text-anchor="middle">DB</text>
  <rect x="336" y="236" width="70" height="36" rx="4" fill="#ffffff" stroke="#3b3b3b"/>
  <text x="371" y="259" font-size="13" fill="#1b1b1b" text-anchor="middle">메일</text>

  <line x1="94" y1="168" x2="118" y2="204" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#ag)"/>
  <line x1="94" y1="254" x2="118" y2="220" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#ag)"/>
  <line x1="336" y1="168" x2="312" y2="204" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#ag)"/>
  <line x1="336" y1="254" x2="312" y2="220" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#ag)"/>

  <text x="59" y="300" font-size="13" fill="#555" text-anchor="middle">주도하는 쪽</text>
  <text x="371" y="300" font-size="13" fill="#555" text-anchor="middle">주도받는 쪽</text>
  <text x="215" y="340" font-size="13" fill="#333" text-anchor="middle">안과 밖 두 구역. 육각형의 변 개수에는 뜻이 없다</text>

  <!-- 오른쪽: 클린 -->
  <text x="655" y="70" font-size="15" font-weight="bold" fill="#1b1b1b" text-anchor="middle">클린 (Martin, 2012)</text>
  <circle cx="655" cy="210" r="135" fill="#f4f4f0" stroke="#3b3b3b" stroke-width="1.2"/>
  <circle cx="655" cy="210" r="100" fill="#fdf3e7" stroke="#b45309" stroke-width="1.2"/>
  <circle cx="655" cy="210" r="65" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.2"/>
  <circle cx="655" cy="210" r="32" fill="#d8ebdf" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="655" y="215" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">엔티티</text>
  <text x="655" y="166" font-size="13" fill="#1b1b1b" text-anchor="middle">유스케이스</text>
  <text x="655" y="130" font-size="13" fill="#1b1b1b" text-anchor="middle">인터페이스 어댑터</text>
  <text x="655" y="95" font-size="13" fill="#1b1b1b" text-anchor="middle">프레임워크·드라이버</text>

  <line x1="790" y1="210" x2="692" y2="210" stroke="#2d6a4f" stroke-width="2" marker-end="url(#ag)"/>
  <text x="655" y="374" font-size="13" fill="#333" text-anchor="middle">안쪽 원은 바깥 원의 이름조차 모른다</text>
  <text x="655" y="394" font-size="13" fill="#333" text-anchor="middle">원은 넷이 아니어도 된다</text>

  <!-- 공통 범례 -->
  <line x1="30" y1="418" x2="850" y2="418" stroke="#d0d0c8" stroke-width="1"/>
  <line x1="30" y1="444" x2="70" y2="444" stroke="#2d6a4f" stroke-width="2" marker-end="url(#ag)"/>
  <text x="80" y="449" font-size="13" fill="#333">소스 코드 의존(import) 방향. 실행 중 호출은 업무 규칙 → DB처럼 반대로도 흐른다</text>

  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6a4f"/>
    </marker>
  </defs>
</svg>
