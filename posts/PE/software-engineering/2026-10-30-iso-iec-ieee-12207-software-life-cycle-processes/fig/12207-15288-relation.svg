<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="880" height="400" fill="#fbfbf7"/>

  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2d6a4f"/>
    </marker>
  </defs>

  <text x="24" y="32" font-size="17" font-weight="bold" fill="#1b1b1b">12207과 15288 — 같은 것과 다른 것</text>

  <!-- shared band -->
  <rect x="80" y="62" width="720" height="78" rx="8" fill="#eaf4ee" stroke="#2d6a4f" stroke-width="2"/>
  <text x="440" y="90" font-size="15" font-weight="bold" text-anchor="middle" fill="#2d6a4f">같다 — 프로세스군 4개 · 프로세스 30개 · 프로세스 목적 · 프로세스 성과</text>
  <text x="440" y="116" font-size="13" text-anchor="middle" fill="#2d6a4f">이름이 같은 프로세스는 같은 목적과 같은 성과를 갖는다</text>
  <text x="440" y="134" font-size="13" text-anchor="middle" fill="#2d6a4f">두 표준의 개정이 같이 진행돼 용어와 구조를 맞춰 둔 결과다</text>

  <line x1="300" y1="140" x2="300" y2="176" stroke="#2d6a4f" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="580" y1="140" x2="580" y2="176" stroke="#2d6a4f" stroke-width="2" marker-end="url(#a2)"/>

  <!-- left column -->
  <rect x="80" y="180" width="340" height="118" rx="8" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="250" y="208" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b1b1b">ISO/IEC/IEEE 12207</text>
  <text x="250" y="232" font-size="13" text-anchor="middle" fill="#333333">소프트웨어 생명주기 프로세스</text>
  <text x="250" y="258" font-size="13" text-anchor="middle" fill="#666666">활동과 태스크가</text>
  <text x="250" y="278" font-size="13" text-anchor="middle" fill="#666666">소프트웨어 공학을 수행하도록 쓰여 있다</text>

  <!-- right column -->
  <rect x="460" y="180" width="340" height="118" rx="8" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="630" y="208" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b1b1b">ISO/IEC/IEEE 15288</text>
  <text x="630" y="232" font-size="13" text-anchor="middle" fill="#333333">시스템 생명주기 프로세스</text>
  <text x="630" y="258" font-size="13" text-anchor="middle" fill="#666666">활동과 태스크가</text>
  <text x="630" y="278" font-size="13" text-anchor="middle" fill="#666666">시스템 공학을 수행하도록 쓰여 있다</text>

  <!-- selector -->
  <rect x="80" y="320" width="720" height="60" rx="8" fill="#fef3e2" stroke="#b45309" stroke-width="1.8"/>
  <text x="440" y="346" font-size="15" font-weight="bold" text-anchor="middle" fill="#b45309">고르는 기준은 관심 시스템(SoI)이 무엇인가 하나뿐이다</text>
  <text x="440" y="368" font-size="13" text-anchor="middle" fill="#b45309">소프트웨어가 주된 관심이면 12207, 시스템 전체가 관심이면 15288. 둘을 함께 쓸 수도 있다</text>
</svg>
