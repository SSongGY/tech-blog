<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="440" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">상호 배제 페트리 넷과 그 도달성 그래프</text>

  <!-- 왼쪽: 넷 구조 -->
  <text x="250" y="62" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">넷 N = (P, T, F, W) 와 M0</text>

  <!-- 프로세스 1 -->
  <circle cx="110" cy="110" r="24" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <circle cx="110" cy="110" r="6" fill="#1f2937"/>
  <text x="142" y="104" font-size="13" fill="#1f2937">idle1</text>
  <rect x="80" y="180" width="60" height="12" fill="#374151"/>
  <text x="74" y="191" font-size="13" text-anchor="end" fill="#1f2937">enter1</text>
  <circle cx="110" cy="250" r="24" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="142" y="246" font-size="13" fill="#1f2937">cs1</text>
  <rect x="80" y="320" width="60" height="12" fill="#374151"/>
  <text x="110" y="350" font-size="13" text-anchor="middle" fill="#1f2937">exit1</text>
  <line x1="110" y1="134" x2="110" y2="177" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="110" y1="192" x2="110" y2="223" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="110" y1="274" x2="110" y2="317" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M80,326 L20,326 L20,110 L83,110" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- mutex -->
  <circle cx="250" cy="256" r="24" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <circle cx="250" cy="256" r="6" fill="#1f2937"/>
  <text x="250" y="298" font-size="13" text-anchor="middle" fill="#b45309">mutex</text>
  <line x1="231" y1="241" x2="143" y2="190" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="143" y1="324" x2="230" y2="272" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="269" y1="241" x2="357" y2="190" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="357" y1="324" x2="270" y2="272" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 프로세스 2 -->
  <circle cx="390" cy="110" r="24" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <circle cx="390" cy="110" r="6" fill="#1f2937"/>
  <text x="358" y="104" font-size="13" text-anchor="end" fill="#1f2937">idle2</text>
  <rect x="360" y="180" width="60" height="12" fill="#374151"/>
  <text x="432" y="191" font-size="13" fill="#1f2937">enter2</text>
  <circle cx="390" cy="250" r="24" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="358" y="246" font-size="13" text-anchor="end" fill="#1f2937">cs2</text>
  <rect x="360" y="320" width="60" height="12" fill="#374151"/>
  <text x="390" y="350" font-size="13" text-anchor="middle" fill="#1f2937">exit2</text>
  <line x1="390" y1="134" x2="390" y2="177" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="390" y1="192" x2="390" y2="223" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="390" y1="274" x2="390" y2="317" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M420,326 L492,326 L492,110 L417,110" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="250" y="372" font-size="13" text-anchor="middle" fill="#4b5563">○ 플레이스(조건)  ▬ 트랜지션(사건)  ● 토큰</text>
  <text x="250" y="394" font-size="13" text-anchor="middle" fill="#4b5563">M0 = (idle1, cs1, idle2, cs2, mutex) = (1 0 1 0 1)</text>

  <line x1="510" y1="60" x2="510" y2="400" stroke="#d1d5db" stroke-dasharray="4 4"/>

  <!-- 오른쪽: 도달성 그래프 -->
  <text x="695" y="62" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">도달성 그래프 R(M0) — 마킹 3개</text>
  <rect x="625" y="92" width="140" height="40" rx="18" fill="#e8f3ee" stroke="#2d6a4f" stroke-width="2"/>
  <text x="695" y="117" font-size="14" text-anchor="middle" fill="#1f2937">M0 (1 0 1 0 1)</text>
  <rect x="535" y="262" width="140" height="40" rx="18" fill="#f3f4f6" stroke="#374151"/>
  <text x="605" y="287" font-size="14" text-anchor="middle" fill="#1f2937">M1 (0 1 1 0 0)</text>
  <rect x="715" y="262" width="140" height="40" rx="18" fill="#f3f4f6" stroke="#374151"/>
  <text x="785" y="287" font-size="14" text-anchor="middle" fill="#1f2937">M2 (1 0 0 1 0)</text>

  <line x1="650" y1="132" x2="590" y2="258" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <text x="590" y="190" font-size="13" text-anchor="end" fill="#2d6a4f">enter1</text>
  <line x1="625" y1="262" x2="680" y2="136" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <text x="662" y="222" font-size="13" fill="#2d6a4f">exit1</text>
  <line x1="740" y1="132" x2="800" y2="258" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <text x="800" y="190" font-size="13" fill="#2d6a4f">enter2</text>
  <line x1="765" y1="262" x2="710" y2="136" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <text x="728" y="222" font-size="13" text-anchor="end" fill="#2d6a4f">exit2</text>

  <text x="695" y="338" font-size="13" text-anchor="middle" fill="#1f2937">모든 칸이 0 또는 1 → 안전(1-유계)</text>
  <text x="695" y="360" font-size="13" text-anchor="middle" fill="#1f2937">죽은 마킹 없음, 네 트랜지션 모두 L4</text>
  <text x="695" y="382" font-size="13" text-anchor="middle" fill="#1f2937">모든 마킹에서 M0 로 돌아감 → 가역</text>

  <text x="440" y="440" font-size="13" text-anchor="middle" fill="#b45309">불변식: cs1 + cs2 + mutex = 1 — 두 프로세스가 동시에 cs 에 있는 마킹은 도달 불가</text>
</svg>
