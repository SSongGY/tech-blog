<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="440" fill="#ffffff"/>
  <text x="440" y="30" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">소프트웨어 리뷰 5가지 — 누가 수행하고 무엇을 보는가</text>

  <!-- 관리 -->
  <rect x="30" y="56" width="230" height="250" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="145" y="82" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">조직·프로젝트 관리자</text>
  <rect x="50" y="100" width="190" height="110" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="145" y="128" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">① 관리 리뷰</text>
  <text x="145" y="154" font-size="13" text-anchor="middle" fill="#374151">진척·계획·일정 상태</text>
  <text x="145" y="176" font-size="13" text-anchor="middle" fill="#374151">관리 프로세스 효과</text>
  <text x="145" y="198" font-size="13" text-anchor="middle" fill="#6b7280">대상: 프로젝트</text>

  <!-- 엔지니어링 -->
  <rect x="280" y="56" width="340" height="250" rx="8" fill="#e8f5ee" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="450" y="82" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">엔지니어링 인력 — 제품을 본다</text>
  <rect x="300" y="100" width="300" height="52" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="450" y="122" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">③ 인스펙션</text>
  <text x="450" y="142" font-size="13" text-anchor="middle" fill="#374151">이상 탐지 · 훈련된 중립 진행자</text>
  <rect x="300" y="166" width="300" height="52" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="450" y="188" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">② 기술 리뷰</text>
  <text x="450" y="208" font-size="13" text-anchor="middle" fill="#374151">명세·표준 적합성 · 의사결정자 있음</text>
  <rect x="300" y="232" width="300" height="52" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="450" y="254" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">④ 워크스루</text>
  <text x="450" y="274" font-size="13" text-anchor="middle" fill="#374151">작성자가 설명 · 교육 목적 포함</text>
  <text x="450" y="300" font-size="13" text-anchor="middle" fill="#2d6a4f">SWEBOK V3는 ③④를 ②의 한 형태로 묶는다</text>

  <!-- 독립 -->
  <rect x="640" y="56" width="210" height="250" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="745" y="82" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">독립된 SQA 인력</text>
  <rect x="660" y="100" width="170" height="110" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="745" y="128" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">⑤ 감사</text>
  <text x="745" y="154" font-size="13" text-anchor="middle" fill="#374151">제품·프로세스의</text>
  <text x="745" y="176" font-size="13" text-anchor="middle" fill="#374151">적합성 독립 평가</text>
  <text x="745" y="198" font-size="13" text-anchor="middle" fill="#6b7280">대상: 제품·프로세스</text>

  <!-- 공식성 축 -->
  <line x1="300" y1="340" x2="600" y2="340" stroke="#374151" stroke-width="1.5" marker-start="url(#arrow)"/>
  <text x="300" y="364" font-size="13" fill="#374151">공식성 높음</text>
  <text x="600" y="364" font-size="13" text-anchor="end" fill="#374151">낮음</text>
  <text x="450" y="390" font-size="13" text-anchor="middle" fill="#374151">인스펙션 → 워크스루 → 짝 리뷰·데스크 체크 (SWEBOK V3 2.3.2)</text>
  <text x="440" y="420" font-size="13" text-anchor="middle" fill="#4b5563">①~⑤ 이름은 IEEE 1028-2008 범위 문장, 수행 주체와 목적은 SWEBOK V3 2.3절</text>
</svg>
