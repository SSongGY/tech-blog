<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="880" height="300" fill="#fbfaf7"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1f2937">품질속성 시나리오의 6가지 구성요소</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 시스템 경계 -->
  <rect x="300" y="72" width="250" height="126" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="425" y="92" font-size="13" text-anchor="middle" fill="#4b5563">시스템</text>

  <g stroke="#374151" stroke-width="1.6" marker-end="url(#ar)" fill="none">
    <line x1="142" y1="145" x2="163" y2="145"/>
    <line x1="277" y1="145" x2="298" y2="145"/>
    <line x1="552" y1="145" x2="573" y2="145"/>
    <line x1="687" y1="145" x2="708" y2="145"/>
  </g>

  <rect x="20" y="120" width="120" height="50" rx="5" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>
  <text x="80" y="150" font-size="14" text-anchor="middle" fill="#111827">① 자극원</text>

  <rect x="165" y="120" width="110" height="50" rx="5" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>
  <text x="220" y="150" font-size="14" text-anchor="middle" fill="#111827">② 자극</text>

  <rect x="316" y="105" width="105" height="50" rx="5" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>
  <text x="368" y="135" font-size="14" text-anchor="middle" fill="#111827">③ 환경</text>

  <rect x="431" y="105" width="105" height="50" rx="5" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>
  <text x="483" y="135" font-size="14" text-anchor="middle" fill="#111827">④ 산출물</text>

  <text x="425" y="182" font-size="12" text-anchor="middle" fill="#4b5563">어떤 상태에서, 무엇이 자극을 받았는가</text>

  <rect x="575" y="120" width="110" height="50" rx="5" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>
  <text x="630" y="150" font-size="14" text-anchor="middle" fill="#111827">⑤ 응답</text>

  <rect x="710" y="120" width="150" height="50" rx="5" fill="#eef5f1" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="785" y="150" font-size="14" font-weight="bold" text-anchor="middle" fill="#14532d">⑥ 응답 측정치</text>

  <line x1="20" y1="215" x2="860" y2="215" stroke="#d1d5db" stroke-width="1"/>
  <text x="20" y="240" font-size="13" fill="#14532d">⑥이 빠지면 시나리오가 아니다. 시간과 돈만 충분하면 어떤 변경이든 가능하기 때문이다.</text>
  <text x="20" y="262" font-size="13" fill="#374151">예: 차고문이 닫히는 중에(③) 문 앞의 물체를(①) 센서가 감지하면(②·④) 문이 멈춘다(⑤) — 1밀리초 이내(⑥).</text>
  <text x="20" y="286" font-size="12" fill="#6b7280">④ 산출물은 아직 설계 전이면 비워 둘 수 있다. 나머지 다섯은 비우지 않는다.</text>
</svg>
