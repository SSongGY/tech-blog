<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="450" fill="#ffffff"/>
  <defs>
    <marker id="down" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0.5,0 L4.5,8 L8.5,0" fill="none" stroke="#9aa5b1" stroke-width="1.6"/>
    </marker>
    <marker id="up" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0.5,0 L4.5,8 L8.5,0" fill="none" stroke="#2d6a4f" stroke-width="1.6"/>
    </marker>
  </defs>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">V모델 위의 테스트 레벨 5개와 테스트 기법 3분류</text>

  <line x1="34" y1="56" x2="34" y2="308" stroke="#9aa5b1" stroke-width="2" marker-end="url(#down)"/>
  <line x1="848" y1="308" x2="848" y2="56" stroke="#2d6a4f" stroke-width="2" marker-end="url(#up)"/>

  <!-- 1행: 요구사항 ↔ 인수 -->
  <line x1="262" y1="72" x2="618" y2="72" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="390" y="61" width="100" height="22" fill="#ffffff"/>
  <text x="440" y="77" text-anchor="middle" font-size="13" fill="#b45309">테스트 베이시스</text>
  <rect x="52" y="52" width="210" height="40" fill="#f5f7f9" stroke="#9aa5b1" stroke-width="1" rx="4"/>
  <text x="157" y="77" text-anchor="middle" font-size="14" fill="#1b1b1b">요구사항 정의</text>
  <rect x="618" y="52" width="212" height="40" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5" rx="4"/>
  <text x="724" y="77" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">인수 테스트</text>

  <!-- 2행 -->
  <line x1="262" y1="128" x2="618" y2="128" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="52" y="108" width="210" height="40" fill="#f5f7f9" stroke="#9aa5b1" stroke-width="1" rx="4"/>
  <text x="157" y="133" text-anchor="middle" font-size="14" fill="#1b1b1b">시스템 · 인터페이스 명세</text>
  <rect x="618" y="108" width="212" height="40" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5" rx="4"/>
  <text x="724" y="133" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">시스템 통합 테스트</text>

  <!-- 3행 -->
  <line x1="262" y1="184" x2="618" y2="184" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="52" y="164" width="210" height="40" fill="#f5f7f9" stroke="#9aa5b1" stroke-width="1" rx="4"/>
  <text x="157" y="189" text-anchor="middle" font-size="14" fill="#1b1b1b">시스템 설계</text>
  <rect x="618" y="164" width="212" height="40" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5" rx="4"/>
  <text x="724" y="189" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">시스템 테스트</text>

  <!-- 4행 -->
  <line x1="262" y1="240" x2="618" y2="240" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="52" y="220" width="210" height="40" fill="#f5f7f9" stroke="#9aa5b1" stroke-width="1" rx="4"/>
  <text x="157" y="245" text-anchor="middle" font-size="14" fill="#1b1b1b">아키텍처 · 상세 설계</text>
  <rect x="618" y="220" width="212" height="40" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5" rx="4"/>
  <text x="724" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">컴포넌트 통합 테스트</text>

  <!-- 5행 -->
  <line x1="262" y1="296" x2="618" y2="296" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="52" y="276" width="210" height="40" fill="#f5f7f9" stroke="#9aa5b1" stroke-width="1" rx="4"/>
  <text x="157" y="301" text-anchor="middle" font-size="14" fill="#1b1b1b">구현 (코드)</text>
  <rect x="618" y="276" width="212" height="40" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5" rx="4"/>
  <text x="724" y="301" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">컴포넌트 테스트</text>

  <!-- 기법 3분류 -->
  <rect x="40" y="330" width="800" height="104" fill="#f5f7f9" stroke="#c8d0d8" stroke-width="1" rx="6"/>
  <text x="440" y="354" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">테스트 기법 3분류 — 어느 레벨에서든 쓸 수 있다</text>

  <rect x="48" y="366" width="248" height="56" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5" rx="4"/>
  <text x="172" y="387" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d6a4f">블랙박스 (명세 기반)</text>
  <text x="172" y="407" text-anchor="middle" font-size="13" fill="#1b1b1b">동등분할·경계값·결정표·상태전이</text>

  <rect x="316" y="366" width="248" height="56" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5" rx="4"/>
  <text x="440" y="387" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d6a4f">화이트박스 (구조 기반)</text>
  <text x="440" y="407" text-anchor="middle" font-size="13" fill="#1b1b1b">문장 테스트 · 분기 테스트</text>

  <rect x="584" y="366" width="248" height="56" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5" rx="4"/>
  <text x="708" y="387" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d6a4f">경험 기반</text>
  <text x="708" y="407" text-anchor="middle" font-size="13" fill="#1b1b1b">오류 추정·탐색적·체크리스트</text>
</svg>
