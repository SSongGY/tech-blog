<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#4a5568" stroke-width="1.6"/>
    </marker>
    <marker id="arg" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#2d6a4f" stroke-width="2"/>
    </marker>
  </defs>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">활동 노드 네트워크(AON)와 전진·후진 계산 결과 — 기간 te(일)</text>

  <!-- edges: non-critical -->
  <line x1="152" y1="240" x2="184" y2="240" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M152,250 L170,250 L170,370 L184,370" fill="none" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="326" y1="226" x2="358" y2="168" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="326" y1="252" x2="358" y2="292" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M326,376 L516,376 L516,262 L532,262" fill="none" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="500" y1="292" x2="532" y2="250" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- edges: critical -->
  <path d="M152,226 L170,226 L170,110 L184,110" fill="none" stroke="#2d6a4f" stroke-width="2.4" marker-end="url(#arg)"/>
  <line x1="326" y1="116" x2="358" y2="150" stroke="#2d6a4f" stroke-width="2.4" marker-end="url(#arg)"/>
  <line x1="500" y1="162" x2="532" y2="222" stroke="#2d6a4f" stroke-width="2.4" marker-end="url(#arg)"/>
  <line x1="674" y1="240" x2="706" y2="240" stroke="#2d6a4f" stroke-width="2.4" marker-end="url(#arg)"/>

  <!-- A -->
  <rect x="12" y="196" width="140" height="88" fill="#eef6f1" stroke="#2d6a4f" stroke-width="2.4" rx="4"/>
  <text x="82" y="217" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">A 요구분석 · 5</text>
  <text x="22" y="238" font-size="13" fill="#4a5568">ES 0  · EF 5</text>
  <text x="22" y="256" font-size="13" fill="#4a5568">LS 0  · LF 5</text>
  <text x="22" y="274" font-size="13" fill="#2d6a4f">TF 0  · FF 0</text>

  <!-- B -->
  <rect x="186" y="66" width="140" height="88" fill="#eef6f1" stroke="#2d6a4f" stroke-width="2.4" rx="4"/>
  <text x="256" y="87" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">B 아키텍처 · 7</text>
  <text x="196" y="108" font-size="13" fill="#4a5568">ES 5  · EF 12</text>
  <text x="196" y="126" font-size="13" fill="#4a5568">LS 5  · LF 12</text>
  <text x="196" y="144" font-size="13" fill="#2d6a4f">TF 0  · FF 0</text>

  <!-- C -->
  <rect x="186" y="196" width="140" height="88" fill="#f4f5f7" stroke="#b45309" stroke-width="1.6" rx="4"/>
  <text x="256" y="217" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">C DB 설계 · 4</text>
  <text x="196" y="238" font-size="13" fill="#4a5568">ES 5  · EF 9</text>
  <text x="196" y="256" font-size="13" fill="#4a5568">LS 8  · LF 12</text>
  <text x="196" y="274" font-size="13" fill="#b45309">TF 3  · FF 0</text>

  <!-- D -->
  <rect x="186" y="326" width="140" height="88" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.6" rx="4"/>
  <text x="256" y="347" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">D 인프라 · 10</text>
  <text x="196" y="368" font-size="13" fill="#4a5568">ES 5  · EF 15</text>
  <text x="196" y="386" font-size="13" fill="#4a5568">LS 15 · LF 25</text>
  <text x="196" y="404" font-size="13" fill="#4a5568">TF 10 · FF 10</text>

  <!-- E -->
  <rect x="360" y="110" width="140" height="88" fill="#eef6f1" stroke="#2d6a4f" stroke-width="2.4" rx="4"/>
  <text x="430" y="131" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">E 앱 개발 · 13</text>
  <text x="370" y="152" font-size="13" fill="#4a5568">ES 12 · EF 25</text>
  <text x="370" y="170" font-size="13" fill="#4a5568">LS 12 · LF 25</text>
  <text x="370" y="188" font-size="13" fill="#2d6a4f">TF 0  · FF 0</text>

  <!-- F -->
  <rect x="360" y="248" width="140" height="88" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.6" rx="4"/>
  <text x="430" y="269" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">F 이관 준비 · 6</text>
  <text x="370" y="290" font-size="13" fill="#4a5568">ES 9  · EF 15</text>
  <text x="370" y="308" font-size="13" fill="#4a5568">LS 19 · LF 25</text>
  <text x="370" y="326" font-size="13" fill="#4a5568">TF 10 · FF 10</text>

  <!-- G -->
  <rect x="534" y="196" width="140" height="88" fill="#eef6f1" stroke="#2d6a4f" stroke-width="2.4" rx="4"/>
  <text x="604" y="217" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">G 통합 테스트 · 6</text>
  <text x="544" y="238" font-size="13" fill="#4a5568">ES 25 · EF 31</text>
  <text x="544" y="256" font-size="13" fill="#4a5568">LS 25 · LF 31</text>
  <text x="544" y="274" font-size="13" fill="#2d6a4f">TF 0  · FF 0</text>

  <!-- H -->
  <rect x="708" y="196" width="140" height="88" fill="#eef6f1" stroke="#2d6a4f" stroke-width="2.4" rx="4"/>
  <text x="778" y="217" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">H 개통 · 2</text>
  <text x="718" y="238" font-size="13" fill="#4a5568">ES 31 · EF 33</text>
  <text x="718" y="256" font-size="13" fill="#4a5568">LS 31 · LF 33</text>
  <text x="718" y="274" font-size="13" fill="#2d6a4f">TF 0  · FF 0</text>

  <!-- legend -->
  <line x1="560" y1="350" x2="600" y2="350" stroke="#2d6a4f" stroke-width="2.4"/>
  <text x="610" y="355" font-size="13" fill="#1b1b1b">주공정 A-B-E-G-H = 33일 (TF 0)</text>
  <text x="560" y="382" font-size="13" fill="#1b1b1b">전진 계산: ES = 선행 EF의 최댓값</text>
  <text x="560" y="404" font-size="13" fill="#1b1b1b">후진 계산: LF = 후행 LS의 최솟값</text>
  <text x="560" y="426" font-size="13" fill="#1b1b1b">TF = LS − ES</text>
  <text x="560" y="448" font-size="13" fill="#b45309">FF = 후행 ES의 최솟값 − EF</text>
</svg>
