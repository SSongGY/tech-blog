<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <rect x="0" y="0" width="880" height="440" fill="#ffffff"/>
  <defs>
    <marker id="fw" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f"/>
    </marker>
    <marker id="rv" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="st" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>

  <text x="440" y="30" font-size="17" font-weight="bold" text-anchor="middle" fill="#222222">추상화 수준 사이를 오가는 네 가지 활동</text>
  <text x="440" y="52" font-size="13" text-anchor="middle" fill="#555555">왼쪽일수록 추상화 수준이 높다 · 구현에 가까울수록 오른쪽</text>

  <!-- 세 단계 -->
  <rect x="40" y="150" width="190" height="70" rx="8" fill="#f1f3f5" stroke="#555555" stroke-width="1.5"/>
  <text x="135" y="191" font-size="16" font-weight="bold" text-anchor="middle" fill="#222222">요구사항</text>
  <rect x="345" y="150" width="190" height="70" rx="8" fill="#f1f3f5" stroke="#555555" stroke-width="1.5"/>
  <text x="440" y="191" font-size="16" font-weight="bold" text-anchor="middle" fill="#222222">설계</text>
  <rect x="650" y="150" width="190" height="70" rx="8" fill="#f1f3f5" stroke="#555555" stroke-width="1.5"/>
  <text x="745" y="191" font-size="16" font-weight="bold" text-anchor="middle" fill="#222222">구현 (기존 시스템)</text>

  <!-- 순공학: 위쪽 오른쪽 방향 -->
  <line x1="232" y1="160" x2="342" y2="160" stroke="#2d6a4f" stroke-width="2.5" marker-end="url(#fw)"/>
  <line x1="537" y1="160" x2="647" y2="160" stroke="#2d6a4f" stroke-width="2.5" marker-end="url(#fw)"/>
  <text x="440" y="96" font-size="15" font-weight="bold" text-anchor="middle" fill="#2d6a4f">① 순공학 →</text>
  <text x="440" y="116" font-size="13" text-anchor="middle" fill="#2d6a4f">높은 추상화에서 물리적 구현으로 내려간다</text>

  <!-- 역공학: 아래쪽 왼쪽 방향 -->
  <line x1="647" y1="210" x2="537" y2="210" stroke="#b45309" stroke-width="2.5" marker-end="url(#rv)"/>
  <line x1="342" y1="210" x2="232" y2="210" stroke="#b45309" stroke-width="2.5" marker-end="url(#rv)"/>
  <text x="60" y="252" font-size="15" font-weight="bold" fill="#b45309">← ② 역공학 (시스템을 바꾸지 않는다)</text>
  <text x="60" y="272" font-size="13" fill="#b45309">하위: 재문서화 · 설계 복구(도메인 지식과 추론을 더한다)</text>

  <!-- 재구조화: 같은 수준 고리 -->
  <path d="M705,222 C690,262 800,262 785,222" fill="none" stroke="#555555" stroke-width="2" marker-end="url(#st)"/>
  <text x="745" y="290" font-size="14" font-weight="bold" text-anchor="middle" fill="#555555">③ 재구조화</text>
  <text x="745" y="308" font-size="13" text-anchor="middle" fill="#555555">같은 수준 안에서 표현만 바꾼다</text>

  <!-- 재공학 -->
  <rect x="480" y="340" width="190" height="60" rx="8" fill="#e9f5ee" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="575" y="376" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">새 형태의 구현</text>
  <path d="M500,222 L570,336" fill="none" stroke="#2d6a4f" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#fw)"/>
  <text x="60" y="360" font-size="15" font-weight="bold" fill="#9d0208">④ 재공학</text>
  <text x="60" y="382" font-size="13" fill="#9d0208">검토(②로 끌어올림) → 새 형태로 재구성 → 구현(①)</text>
</svg>
