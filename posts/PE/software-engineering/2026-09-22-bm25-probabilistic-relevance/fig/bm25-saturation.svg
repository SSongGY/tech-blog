<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500">
  <rect x="0" y="0" width="880" height="500" fill="#f8f9fa"/>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- ===== 왼쪽: 성분 분해 ===== -->
  <text x="45" y="40" font-family="sans-serif" font-size="15" fill="#111827" font-weight="bold">① 항 가중치는 두 성분의 곱이다</text>

  <rect x="45" y="60" width="380" height="54" rx="6" fill="#e8f3ed" stroke="#2d6a4f" stroke-width="2.5"/>
  <text x="235" y="83" font-family="sans-serif" font-size="14" fill="#2d6a4f" text-anchor="middle" font-weight="bold">w_BM25(i)</text>
  <text x="235" y="103" font-family="sans-serif" font-size="13" fill="#2d6a4f" text-anchor="middle">항 하나가 문서 점수에 더하는 값</text>

  <line x1="130" y1="114" x2="130" y2="168" stroke="#374151" stroke-width="2"/>
  <line x1="340" y1="114" x2="340" y2="168" stroke="#374151" stroke-width="2"/>
  <line x1="130" y1="168" x2="340" y2="168" stroke="#374151" stroke-width="2"/>
  <text x="235" y="163" font-family="sans-serif" font-size="18" fill="#374151" text-anchor="middle" font-weight="bold">×</text>

  <rect x="45" y="182" width="175" height="80" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="132" y="205" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">TF 포화 성분</text>
  <text x="132" y="229" font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle">tf / (k1·B + tf)</text>
  <text x="132" y="250" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle">몇 번 나왔는가</text>

  <rect x="250" y="182" width="175" height="80" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="337" y="205" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">RSJ 가중치</text>
  <text x="337" y="229" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle">log((N−n+0.5)/(n+0.5))</text>
  <text x="337" y="250" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle">얼마나 드문가</text>

  <line x1="132" y1="330" x2="132" y2="266" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="337" y1="330" x2="337" y2="266" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="45" y="332" width="175" height="80" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="132" y="355" font-family="sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold">길이 정규화 B</text>
  <text x="132" y="379" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle">(1−b) + b·dl/avdl</text>
  <text x="132" y="400" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle">문서가 얼마나 긴가</text>

  <rect x="250" y="332" width="175" height="80" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="337" y="355" font-family="sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold">관련성 판정이 없으면</text>
  <text x="337" y="379" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle">IDF 형태로 환원된다</text>
  <text x="337" y="400" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle">R = r = 0</text>

  <!-- ===== 오른쪽: 포화 곡선 ===== -->
  <text x="470" y="40" font-family="sans-serif" font-size="15" fill="#111827" font-weight="bold">② TF 포화 — 더 나와도 IDF를 넘지 못한다</text>

  <!-- 축 -->
  <line x1="490" y1="400" x2="852" y2="400" stroke="#374151" stroke-width="2"/>
  <line x1="490" y1="110" x2="490" y2="400" stroke="#374151" stroke-width="2"/>
  <text x="671" y="446" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle">tf — 문서 안에서 그 항이 나온 횟수</text>
  <text x="474" y="255" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle" transform="rotate(-90 474 255)">항 가중치</text>

  <!-- 눈금 -->
  <line x1="490" y1="400" x2="490" y2="406" stroke="#374151" stroke-width="1.5"/>
  <line x1="580" y1="400" x2="580" y2="406" stroke="#374151" stroke-width="1.5"/>
  <line x1="670" y1="400" x2="670" y2="406" stroke="#374151" stroke-width="1.5"/>
  <line x1="760" y1="400" x2="760" y2="406" stroke="#374151" stroke-width="1.5"/>
  <line x1="850" y1="400" x2="850" y2="406" stroke="#374151" stroke-width="1.5"/>
  <text x="490" y="420" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle">0</text>
  <text x="580" y="420" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle">5</text>
  <text x="670" y="420" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle">10</text>
  <text x="760" y="420" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle">15</text>
  <text x="850" y="420" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle">20</text>

  <!-- 포화 한계(점근선) -->
  <line x1="490" y1="142" x2="852" y2="142" stroke="#2d6a4f" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="848" y="134" font-family="sans-serif" font-size="13" fill="#2d6a4f" text-anchor="end">포화 한계 = RSJ 가중치 (2.944)</text>

  <!-- 선형 tf·idf -->
  <line x1="490" y1="400" x2="510" y2="110" stroke="#9d0208" stroke-width="2.5"/>
  <text x="516" y="98" font-family="sans-serif" font-size="13" fill="#9d0208">선형 tf·idf — 한계 없이 올라간다</text>

  <!-- BM25 포화 곡선 (k1=1.2, b=0.75, dl=avdl) -->
  <polyline fill="none" stroke="#2d6a4f" stroke-width="3"
    points="490,400 508,283 526,239 544,216 562,202 580,192 598,185 616,180 634,176 652,170 670,170 706,166 760,162 850,157"/>

  <circle cx="508" cy="283" r="4" fill="#2d6a4f"/>
  <circle cx="580" cy="192" r="4" fill="#2d6a4f"/>
  <circle cx="670" cy="170" r="4" fill="#2d6a4f"/>
  <text x="516" y="300" font-family="sans-serif" font-size="13" fill="#2d6a4f">tf=1 → 1.338</text>
  <text x="590" y="205" font-family="sans-serif" font-size="13" fill="#2d6a4f">tf=5 → 2.375</text>
  <text x="680" y="185" font-family="sans-serif" font-size="13" fill="#2d6a4f">tf=10 → 2.629</text>

  <text x="671" y="474" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle">N=1,000,000 · n=50,000 · k1=1.2 · b=0.75 · dl=avdl</text>
</svg>
