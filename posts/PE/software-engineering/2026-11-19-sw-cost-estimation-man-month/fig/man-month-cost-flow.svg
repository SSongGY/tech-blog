<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <rect x="0" y="0" width="880" height="560" fill="#ffffff"/>
  <text x="440" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">투입공수 방식 — 공수에서 사업대가까지</text>

  <!-- ① 투입공수 -->
  <rect x="40" y="56" width="500" height="62" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="290" y="81" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">① 투입공수 (M/M)</text>
  <text x="290" y="105" font-size="14" text-anchor="middle" fill="#1f2937">직무별 투입인원 × 투입기간(월) × 투입률</text>

  <!-- ② 직접인건비 -->
  <rect x="40" y="148" width="500" height="62" rx="6" fill="#e8f3ee" stroke="#2d6a4f" stroke-width="2"/>
  <text x="290" y="173" font-size="15" font-weight="bold" text-anchor="middle" fill="#2d6a4f">② 직접인건비</text>
  <text x="290" y="197" font-size="14" text-anchor="middle" fill="#1f2937">Σ (직무별 투입공수 × 직무별 월평균임금)</text>

  <!-- ③ 제경비 -->
  <rect x="40" y="240" width="500" height="62" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="290" y="265" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">③ 제경비</text>
  <text x="290" y="289" font-size="14" text-anchor="middle" fill="#1f2937">② × 144% ~ 154%</text>

  <!-- ④ 기술료 -->
  <rect x="40" y="332" width="500" height="62" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="290" y="357" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">④ 기술료 (이윤 포함)</text>
  <text x="290" y="381" font-size="14" text-anchor="middle" fill="#1f2937">(② + ③) × 20% ~ 40%</text>

  <!-- ⑤ 사업대가 -->
  <rect x="40" y="424" width="500" height="62" rx="6" fill="#e8f3ee" stroke="#2d6a4f" stroke-width="2"/>
  <text x="290" y="449" font-size="15" font-weight="bold" text-anchor="middle" fill="#2d6a4f">⑤ 사업대가 (부가세 별도)</text>
  <text x="290" y="473" font-size="14" text-anchor="middle" fill="#1f2937">② + ③ + ④ + 직접경비(인쇄비·출장여비 등)</text>

  <!-- 화살표 -->
  <g stroke="#4b5563" stroke-width="2">
    <line x1="290" y1="118" x2="290" y2="140"/>
    <line x1="290" y1="210" x2="290" y2="232"/>
    <line x1="290" y1="302" x2="290" y2="324"/>
    <line x1="290" y1="394" x2="290" y2="416"/>
  </g>
  <g fill="#4b5563">
    <polygon points="284,138 296,138 290,148"/>
    <polygon points="284,230 296,230 290,240"/>
    <polygon points="284,322 296,322 290,332"/>
    <polygon points="284,414 296,414 290,424"/>
  </g>

  <!-- 오른쪽: 입력 두 가지 -->
  <rect x="590" y="56" width="260" height="78" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="720" y="80" font-size="14" font-weight="bold" text-anchor="middle" fill="#b45309">WBS 로 센 M/D 를 환산</text>
  <text x="720" y="102" font-size="14" text-anchor="middle" fill="#1f2937">1 M/M = 20.8 M/D</text>
  <text x="720" y="123" font-size="13" text-anchor="middle" fill="#4b5563">(가이드 부록 FAQ)</text>
  <line x1="590" y1="90" x2="548" y2="90" stroke="#b45309" stroke-width="2"/>
  <polygon points="550,84 550,96 540,90" fill="#b45309"/>

  <rect x="590" y="150" width="260" height="98" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="720" y="174" font-size="14" font-weight="bold" text-anchor="middle" fill="#b45309">SW기술자 평균임금</text>
  <text x="720" y="196" font-size="14" text-anchor="middle" fill="#1f2937">협회가 매년 직무별로 공표</text>
  <text x="720" y="218" font-size="14" text-anchor="middle" fill="#1f2937">일평균 = 월평균 ÷ 20.5</text>
  <text x="720" y="238" font-size="13" text-anchor="middle" fill="#4b5563">(2026년 적용분)</text>
  <line x1="590" y1="180" x2="548" y2="180" stroke="#b45309" stroke-width="2"/>
  <polygon points="550,174 550,186 540,180" fill="#b45309"/>

  <!-- 오른쪽 아래: 배수 -->
  <text x="720" y="300" font-size="14" text-anchor="middle" fill="#1f2937">② 대비 ③+④ 를 더한 배수</text>
  <text x="720" y="324" font-size="14" text-anchor="middle" fill="#1f2937">최소 2.44 × 1.20 = 2.928</text>
  <text x="720" y="346" font-size="14" text-anchor="middle" fill="#1f2937">최대 2.54 × 1.40 = 3.556</text>

  <text x="440" y="520" font-size="13" text-anchor="middle" fill="#4b5563">SW사업 대가산정 가이드 2025년 개정판 표1-4·표2-7, 2026년 적용 SW기술자 평균임금 공표</text>
  <text x="440" y="542" font-size="13" text-anchor="middle" fill="#4b5563">배수와 환산 일수는 code/output.txt 의 [2]·[3] 에서 계산했다</text>
</svg>
