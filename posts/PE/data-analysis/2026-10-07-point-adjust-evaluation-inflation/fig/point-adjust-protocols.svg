<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">같은 탐지 결과를 네 가지 규칙으로 채점하면</text>

  <!-- 시점 번호 -->
  <g font-size="13" fill="#555" text-anchor="middle">
    <text x="215" y="62">t0</text><text x="255" y="62">t1</text><text x="295" y="62">t2</text>
    <text x="335" y="62">t3</text><text x="375" y="62">t4</text><text x="415" y="62">t5</text>
    <text x="455" y="62">t6</text><text x="495" y="62">t7</text><text x="535" y="62">t8</text>
    <text x="575" y="62">t9</text><text x="615" y="62">t10</text><text x="655" y="62">t11</text>
  </g>
  <!-- 이상 구간 배경 -->
  <rect x="317" y="70" width="316" height="370" fill="#f1f1f1" stroke="#999" stroke-dasharray="5 4"/>
  <text x="475" y="456" text-anchor="middle" font-size="13" fill="#444">정답 이상 구간 (t3~t10, 8점)</text>

  <!-- 행 라벨 -->
  <g font-size="14" fill="#111">
    <text x="20" y="104">① 정답 레이블</text>
    <text x="20" y="174">② 점 단위 탐지</text>
    <text x="20" y="244">③ 점 조정(PA)</text>
    <text x="20" y="314">④ PA%K (K=20)</text>
    <text x="20" y="384">⑤ 지연 제한 (k=2)</text>
  </g>

  <!-- 행1: 정답 -->
  <g stroke="#666" stroke-width="1">
    <rect x="200" y="84" width="30" height="30" fill="#fff"/><rect x="240" y="84" width="30" height="30" fill="#fff"/>
    <rect x="280" y="84" width="30" height="30" fill="#fff"/>
    <rect x="320" y="84" width="30" height="30" fill="#555"/><rect x="360" y="84" width="30" height="30" fill="#555"/>
    <rect x="400" y="84" width="30" height="30" fill="#555"/><rect x="440" y="84" width="30" height="30" fill="#555"/>
    <rect x="480" y="84" width="30" height="30" fill="#555"/><rect x="520" y="84" width="30" height="30" fill="#555"/>
    <rect x="560" y="84" width="30" height="30" fill="#555"/><rect x="600" y="84" width="30" height="30" fill="#555"/>
    <rect x="640" y="84" width="30" height="30" fill="#fff"/>
  </g>

  <!-- 행2: 원 탐지 — t1 오탐, t9 한 점만 맞힘 -->
  <g stroke="#666" stroke-width="1">
    <rect x="200" y="154" width="30" height="30" fill="#fff"/><rect x="240" y="154" width="30" height="30" fill="#9d0208"/>
    <rect x="280" y="154" width="30" height="30" fill="#fff"/>
    <rect x="320" y="154" width="30" height="30" fill="#fff"/><rect x="360" y="154" width="30" height="30" fill="#fff"/>
    <rect x="400" y="154" width="30" height="30" fill="#fff"/><rect x="440" y="154" width="30" height="30" fill="#fff"/>
    <rect x="480" y="154" width="30" height="30" fill="#fff"/><rect x="520" y="154" width="30" height="30" fill="#fff"/>
    <rect x="560" y="154" width="30" height="30" fill="#2d6a4f"/><rect x="600" y="154" width="30" height="30" fill="#fff"/>
    <rect x="640" y="154" width="30" height="30" fill="#fff"/>
  </g>

  <!-- 행3: PA — 구간 전체가 탐지로 바뀜 -->
  <g stroke="#666" stroke-width="1">
    <rect x="200" y="224" width="30" height="30" fill="#fff"/><rect x="240" y="224" width="30" height="30" fill="#9d0208"/>
    <rect x="280" y="224" width="30" height="30" fill="#fff"/>
    <rect x="320" y="224" width="30" height="30" fill="#b45309"/><rect x="360" y="224" width="30" height="30" fill="#b45309"/>
    <rect x="400" y="224" width="30" height="30" fill="#b45309"/><rect x="440" y="224" width="30" height="30" fill="#b45309"/>
    <rect x="480" y="224" width="30" height="30" fill="#b45309"/><rect x="520" y="224" width="30" height="30" fill="#b45309"/>
    <rect x="560" y="224" width="30" height="30" fill="#2d6a4f"/><rect x="600" y="224" width="30" height="30" fill="#b45309"/>
    <rect x="640" y="224" width="30" height="30" fill="#fff"/>
  </g>

  <!-- 행4: PA%K — 1/8=12.5% ≤ 20% 이므로 조정 안 함 -->
  <g stroke="#666" stroke-width="1">
    <rect x="200" y="294" width="30" height="30" fill="#fff"/><rect x="240" y="294" width="30" height="30" fill="#9d0208"/>
    <rect x="280" y="294" width="30" height="30" fill="#fff"/>
    <rect x="320" y="294" width="30" height="30" fill="#fff"/><rect x="360" y="294" width="30" height="30" fill="#fff"/>
    <rect x="400" y="294" width="30" height="30" fill="#fff"/><rect x="440" y="294" width="30" height="30" fill="#fff"/>
    <rect x="480" y="294" width="30" height="30" fill="#fff"/><rect x="520" y="294" width="30" height="30" fill="#fff"/>
    <rect x="560" y="294" width="30" height="30" fill="#2d6a4f"/><rect x="600" y="294" width="30" height="30" fill="#fff"/>
    <rect x="640" y="294" width="30" height="30" fill="#fff"/>
  </g>

  <!-- 행5: 지연 제한 — t3~t5 안에 탐지가 없으므로 구간 전체를 놓친 것으로 -->
  <g stroke="#666" stroke-width="1">
    <rect x="200" y="364" width="30" height="30" fill="#fff"/><rect x="240" y="364" width="30" height="30" fill="#9d0208"/>
    <rect x="280" y="364" width="30" height="30" fill="#fff"/>
    <rect x="320" y="364" width="30" height="30" fill="#fff"/><rect x="360" y="364" width="30" height="30" fill="#fff"/>
    <rect x="400" y="364" width="30" height="30" fill="#fff"/><rect x="440" y="364" width="30" height="30" fill="#fff"/>
    <rect x="480" y="364" width="30" height="30" fill="#fff"/><rect x="520" y="364" width="30" height="30" fill="#fff"/>
    <rect x="560" y="364" width="30" height="30" fill="#fff"/><rect x="600" y="364" width="30" height="30" fill="#fff"/>
    <rect x="640" y="364" width="30" height="30" fill="#fff"/>
  </g>
  <rect x="318" y="398" width="114" height="8" fill="#2d6a4f" opacity="0.5"/>
  <text x="440" y="408" font-size="13" fill="#2d6a4f">허용 지연 k=2 (t3~t5)</text>

  <!-- 오른쪽: 결과 -->
  <g font-size="14" fill="#111">
    <text x="700" y="104">이상 8점</text>
    <text x="700" y="174">P 0.50 · R 0.13</text>
    <text x="700" y="194" font-weight="bold">F1 0.20</text>
    <text x="700" y="244">P 0.89 · R 1.00</text>
    <text x="700" y="264" font-weight="bold" fill="#9d0208">F1 0.94</text>
    <text x="700" y="314">비율 1/8 ≤ 20%</text>
    <text x="700" y="334" font-weight="bold">F1 0.20</text>
    <text x="700" y="384">첫 탐지 지연 6</text>
    <text x="700" y="404" font-weight="bold">F1 0</text>
  </g>

  <!-- 범례 -->
  <g font-size="13" fill="#333" transform="translate(20,420)">
    <rect x="0" y="0" width="14" height="14" fill="#2d6a4f"/><text x="20" y="12">맞힌 탐지</text>
    <rect x="0" y="22" width="14" height="14" fill="#9d0208"/><text x="20" y="34">오탐</text>
  </g>
  <g font-size="13" fill="#333" transform="translate(700,420)">
    <rect x="0" y="0" width="14" height="14" fill="#b45309"/><text x="20" y="12">조정으로 채워진 칸</text>
    <rect x="0" y="22" width="14" height="14" fill="#555"/><text x="20" y="34">정답 이상</text>
  </g>
</svg>
