<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Malgun Gothic','Segoe UI',sans-serif">
  <rect x="0" y="0" width="880" height="440" fill="#fbfaf7"/>

  <text x="40" y="34" font-size="15" font-weight="bold" fill="#1b1b1b">① Eps-이웃과 핵심점·경계점 (Eps=1.5, MinPts=4)</text>
  <text x="500" y="34" font-size="15" font-weight="bold" fill="#1b1b1b">② 여섯 정의가 쌓이는 순서</text>

  <!-- 왼쪽 패널 테두리 -->
  <rect x="40" y="48" width="420" height="368" fill="#ffffff" stroke="#c9c4ba" stroke-width="1"/>

  <!-- Eps 원: 핵심점 q=(3,2) -->
  <circle cx="330" cy="300" r="105" fill="#2d6a4f" fill-opacity="0.10" stroke="#2d6a4f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- Eps 원: 경계점 p=(4,2) -->
  <circle cx="400" cy="300" r="105" fill="#b45309" fill-opacity="0.10" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- 핵심점 7개 -->
  <circle cx="190" cy="370" r="7" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
  <circle cx="190" cy="300" r="7" fill="#2d6a4f"/>
  <circle cx="190" cy="230" r="7" fill="#2d6a4f"/>
  <circle cx="190" cy="160" r="7" fill="#2d6a4f"/>
  <circle cx="260" cy="300" r="7" fill="#2d6a4f"/>
  <circle cx="260" cy="230" r="7" fill="#2d6a4f"/>
  <circle cx="260" cy="160" r="7" fill="#2d6a4f"/>
  <circle cx="330" cy="300" r="7" fill="#2d6a4f"/>
  <circle cx="400" cy="300" r="7" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>

  <text x="330" y="282" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">q</text>
  <text x="400" y="282" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">p</text>
  <text x="190" y="392" font-size="13" fill="#b45309" text-anchor="middle">o′</text>

  <!-- 비대칭 화살표 -->
  <defs>
    <marker id="ok" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2d6a4f"/>
    </marker>
  </defs>
  <path d="M338,300 L392,300" stroke="#2d6a4f" stroke-width="2" marker-end="url(#ok)"/>
  <text x="365" y="326" font-size="13" fill="#2d6a4f" text-anchor="middle">직접 밀도 도달</text>
  <text x="365" y="344" font-size="13" fill="#9d0208" text-anchor="middle">역방향은 성립 안 함</text>

  <!-- 범례 -->
  <circle cx="64" cy="76" r="7" fill="#2d6a4f"/>
  <text x="80" y="81" font-size="13" fill="#1b1b1b">핵심점 (|N| ≥ MinPts)</text>
  <circle cx="254" cy="76" r="7" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
  <text x="270" y="81" font-size="13" fill="#1b1b1b">경계점 (|N| &lt; MinPts)</text>

  <text x="60" y="112" font-size="13" fill="#555047">p와 o′ 는 서로 밀도 도달이 안 되지만,</text>
  <text x="60" y="132" font-size="13" fill="#555047">둘 다 도달하는 핵심점이 있어 같은 군집이다.</text>

  <!-- 오른쪽 사다리 -->
  <g>
    <rect x="500" y="48" width="340" height="52" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
    <text x="516" y="70" font-size="13" font-weight="bold" fill="#2d6a4f">정의 1 · Eps-이웃</text>
    <text x="516" y="90" font-size="13" fill="#1b1b1b">N(p) = { q | dist(p, q) ≤ Eps }</text>

    <rect x="500" y="110" width="340" height="52" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
    <text x="516" y="132" font-size="13" font-weight="bold" fill="#2d6a4f">정의 2 · 직접 밀도 도달</text>
    <text x="516" y="152" font-size="13" fill="#1b1b1b">p ∈ N(q) 이고 |N(q)| ≥ MinPts</text>

    <rect x="500" y="172" width="340" height="52" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
    <text x="516" y="194" font-size="13" font-weight="bold" fill="#2d6a4f">정의 3 · 밀도 도달</text>
    <text x="516" y="214" font-size="13" fill="#1b1b1b">직접 밀도 도달의 사슬. 전이적, 비대칭</text>

    <rect x="500" y="234" width="340" height="52" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
    <text x="516" y="256" font-size="13" font-weight="bold" fill="#2d6a4f">정의 4 · 밀도 연결</text>
    <text x="516" y="276" font-size="13" fill="#1b1b1b">어떤 o 에서 p, q 둘 다 밀도 도달. 대칭</text>

    <rect x="500" y="296" width="340" height="52" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
    <text x="516" y="318" font-size="13" font-weight="bold" fill="#2d6a4f">정의 5 · 군집</text>
    <text x="516" y="338" font-size="13" fill="#1b1b1b">최대성 + 연결성을 만족하는 부분집합</text>

    <rect x="500" y="358" width="340" height="52" fill="#ffffff" stroke="#9d0208" stroke-width="1.5"/>
    <text x="516" y="380" font-size="13" font-weight="bold" fill="#9d0208">정의 6 · 잡음</text>
    <text x="516" y="400" font-size="13" fill="#1b1b1b">어느 군집에도 속하지 않는 점</text>

    <path d="M670,100 L670,110" stroke="#2d6a4f" stroke-width="2"/>
    <path d="M670,162 L670,172" stroke="#2d6a4f" stroke-width="2"/>
    <path d="M670,224 L670,234" stroke="#2d6a4f" stroke-width="2"/>
    <path d="M670,286 L670,296" stroke="#2d6a4f" stroke-width="2"/>
    <path d="M670,348 L670,358" stroke="#2d6a4f" stroke-width="2"/>
  </g>
</svg>
