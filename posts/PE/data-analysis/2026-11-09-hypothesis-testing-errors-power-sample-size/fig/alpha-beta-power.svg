  <!-- 범례 -->
  <rect x="40" y="342" width="18" height="16" fill="#9d0208"/>
  <text x="66" y="355" font-size="13" fill="#1b1b1b">α = 0.05 (α/2씩 양 꼬리) — 1종 오류: H₀가 참인데 기각</text>
  <rect x="40" y="366" width="18" height="16" fill="#f6dfb8" stroke="#b45309" stroke-width="1"/>
  <text x="66" y="379" font-size="13" fill="#1b1b1b">β = 0.20 — 2종 오류: H₁이 참인데 기각하지 못함</text>
  <rect x="40" y="390" width="18" height="16" fill="#d6ebdd" stroke="#2d6a4f" stroke-width="1"/>
  <text x="66" y="403" font-size="13" fill="#1b1b1b">1 − β = 0.80 — 검정력: H₁이 참일 때 기각</text>
