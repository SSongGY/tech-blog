<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#4a5568" stroke-width="1.6"/>
    </marker>
  </defs>

  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">포함확률이 추론을 가른다 — 확률표본과 비확률표본</text>

  <!-- population / frame -->
  <rect x="24" y="52" width="250" height="64" fill="#f4f5f7" stroke="#1b1b1b" stroke-width="2" rx="4"/>
  <text x="149" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">모집단 → 표본프레임</text>
  <text x="149" y="100" text-anchor="middle" font-size="13" fill="#4a5568">프레임 밖 단위는 π = 0 (포괄 오차)</text>

  <line x1="274" y1="84" x2="326" y2="84" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- decision -->
  <rect x="330" y="52" width="300" height="64" fill="#fff8eb" stroke="#b45309" stroke-width="1.6" rx="4"/>
  <text x="480" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">모든 단위의 포함확률 π가</text>
  <text x="480" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">0보다 크고 계산 가능한가</text>

  <!-- yes branch -->
  <line x1="420" y1="116" x2="230" y2="160" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="300" y="132" text-anchor="middle" font-size="13" fill="#2d6a4f">예</text>

  <rect x="24" y="164" width="400" height="104" fill="#f4f5f7" stroke="#2d6a4f" stroke-width="2" rx="4"/>
  <text x="224" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">확률표본추출</text>
  <text x="40" y="216" font-size="13" fill="#4a5568">π가 같다: 단순무작위 · 계통 · 층화 비례배분</text>
  <text x="40" y="238" font-size="13" fill="#4a5568">π가 다를 수 있다: 층화 불균등배분 · 집락 · PPS</text>
  <text x="40" y="258" font-size="13" fill="#4a5568">다단계·다상: 단계별 π를 곱한다</text>

  <line x1="224" y1="268" x2="224" y2="300" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="24" y="304" width="400" height="56" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.6" rx="4"/>
  <text x="224" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">설계 가중치 w = 1 / π</text>
  <text x="224" y="349" text-anchor="middle" font-size="13" fill="#4a5568">표본 한 단위가 대표하는 모집단 단위 수</text>

  <line x1="224" y1="360" x2="224" y2="392" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="24" y="396" width="400" height="56" fill="#eef7f1" stroke="#2d6a4f" stroke-width="2" rx="4"/>
  <text x="224" y="420" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d6a4f">설계 기반 추론</text>
  <text x="224" y="441" text-anchor="middle" font-size="13" fill="#2d6a4f">비편향 추정 + 표본오차 추정</text>

  <!-- no branch -->
  <line x1="540" y1="116" x2="650" y2="160" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="620" y="132" text-anchor="middle" font-size="13" fill="#9d0208">아니오</text>

  <rect x="456" y="164" width="400" height="104" fill="#f4f5f7" stroke="#9d0208" stroke-width="2" rx="4"/>
  <text x="656" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">비확률표본추출</text>
  <text x="472" y="216" font-size="13" fill="#4a5568">편의 · 자원자 · 판단 · 할당 · 눈덩이</text>
  <text x="472" y="238" font-size="13" fill="#4a5568">할당 = 층별 개수는 맞추되 층 안 선택이 비무작위</text>
  <text x="472" y="258" font-size="13" fill="#4a5568">선택 편향이 모든 비확률표본에 있다</text>

  <line x1="656" y1="268" x2="656" y2="300" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="456" y="304" width="400" height="56" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.6" rx="4"/>
  <text x="656" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">가중치를 정의할 수 없다</text>
  <text x="656" y="349" text-anchor="middle" font-size="13" fill="#4a5568">사후 보정(가중 보정·표본 매칭)은 모형에 기댄다</text>

  <line x1="656" y1="360" x2="656" y2="392" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="456" y="396" width="400" height="56" fill="#fdf0f0" stroke="#9d0208" stroke-width="2" rx="4"/>
  <text x="656" y="420" text-anchor="middle" font-size="15" font-weight="bold" fill="#9d0208">모형 가정이 맞을 때만 추론</text>
  <text x="656" y="441" text-anchor="middle" font-size="13" fill="#9d0208">표본오차를 설계로 낼 수 없다</text>
</svg>
