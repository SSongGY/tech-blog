<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="340" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">붕괴점 — 몇 할까지 오염돼도 추정값이 유한하게 남는가</text>

  <!-- 축 -->
  <line x1="90" y1="170" x2="790" y2="170" stroke="#374151" stroke-width="2"/>
  <line x1="90" y1="162" x2="90" y2="178" stroke="#374151" stroke-width="2"/>
  <line x1="265" y1="164" x2="265" y2="176" stroke="#374151" stroke-width="1.5"/>
  <line x1="440" y1="164" x2="440" y2="176" stroke="#374151" stroke-width="1.5"/>
  <line x1="615" y1="164" x2="615" y2="176" stroke="#374151" stroke-width="1.5"/>
  <line x1="790" y1="160" x2="790" y2="180" stroke="#2d6a4f" stroke-width="3"/>
  <text x="90" y="198" text-anchor="middle" font-size="14" fill="#374151">0</text>
  <text x="265" y="198" text-anchor="middle" font-size="14" fill="#374151">0.125</text>
  <text x="440" y="198" text-anchor="middle" font-size="14" fill="#374151">0.25</text>
  <text x="615" y="198" text-anchor="middle" font-size="14" fill="#374151">0.375</text>
  <text x="790" y="198" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">0.5</text>
  <text x="440" y="222" text-anchor="middle" font-size="13" fill="#6b7280">붕괴점 ε* (표본 중 임의로 바꿀 수 있는 비율)</text>

  <!-- 위: 위치 추정량 -->
  <text x="20" y="92" font-size="14" font-weight="bold" fill="#374151">위치</text>
  <circle cx="90" cy="130" r="8" fill="#9d0208"/>
  <text x="104" y="135" font-size="14" fill="#9d0208">평균 (1/n)</text>
  <circle cx="300" cy="130" r="8" fill="#b45309"/>
  <text x="300" y="112" text-anchor="middle" font-size="14" fill="#b45309">α 절사평균 (≈ α)</text>
  <line x1="230" y1="130" x2="740" y2="130" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="790" cy="130" r="8" fill="#2d6a4f"/>
  <text x="790" y="112" text-anchor="middle" font-size="14" fill="#2d6a4f">중앙값</text>

  <!-- 아래: 척도 추정량 -->
  <text x="20" y="262" font-size="14" font-weight="bold" fill="#374151">척도</text>
  <circle cx="90" cy="250" r="8" fill="#9d0208"/>
  <text x="104" y="255" font-size="14" fill="#9d0208">표준편차 (1/n)</text>
  <circle cx="440" cy="250" r="8" fill="#b45309"/>
  <text x="440" y="278" text-anchor="middle" font-size="14" fill="#b45309">사분위범위 (≈ 0.25)</text>
  <circle cx="790" cy="250" r="8" fill="#2d6a4f"/>
  <text x="790" y="278" text-anchor="middle" font-size="14" fill="#2d6a4f">MAD</text>

  <!-- 상한과 대가 -->
  <text x="865" y="300" text-anchor="end" font-size="13" fill="#2d6a4f">이동 등변 추정량의 상한 ⌊(n+1)/2⌋/n</text>
  <line x1="140" y1="322" x2="740" y2="322" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="316" text-anchor="middle" font-size="13" fill="#6b7280">오른쪽으로 갈수록 정규분포에서의 효율이 떨어진다</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
