<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fbfbf8"/>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">TFT의 층 구조 — 입력 3종이 서로 다른 자리로 들어간다</text>
  <text x="30" y="56" font-size="13" fill="#555">아래에서 위로 흐른다. 오른쪽 상자는 정적 정보를 네 갈래로 나눠 각 층에 넣는다</text>

  <!-- 입력 3종 -->
  <rect x="60" y="78" width="160" height="44" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="140" y="105" font-size="13" text-anchor="middle" fill="#1b1b1b">과거 관측 입력 z</text>
  <rect x="240" y="78" width="160" height="44" fill="#eaf2ec" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="320" y="105" font-size="13" text-anchor="middle" fill="#1b1b1b">미래 기지 입력 x</text>
  <rect x="420" y="78" width="160" height="44" fill="#e6eef7" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="500" y="105" font-size="13" text-anchor="middle" fill="#1b1b1b">정적 공변량 s</text>

  <!-- 주 흐름 -->
  <rect x="150" y="152" width="380" height="44" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="340" y="179" font-size="13" text-anchor="middle" fill="#1b1b1b">변수 선택망 — 정적·과거·미래 각각 한 벌씩</text>

  <rect x="150" y="222" width="380" height="44" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="340" y="249" font-size="13" text-anchor="middle" fill="#1b1b1b">시퀀스-투-시퀀스 층 (LSTM 인코더·디코더)</text>

  <rect x="150" y="292" width="380" height="44" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="340" y="319" font-size="13" text-anchor="middle" fill="#1b1b1b">정적 강화층</text>

  <rect x="150" y="362" width="380" height="44" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="340" y="389" font-size="13" text-anchor="middle" fill="#1b1b1b">해석 가능 멀티헤드 어텐션</text>

  <rect x="150" y="420" width="380" height="36" fill="#eaf2ec" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="340" y="443" font-size="13" text-anchor="middle" fill="#1b1b1b">분위수 출력 10·50·90% × τmax 시점</text>

  <!-- 정적 인코더 -->
  <rect x="610" y="152" width="250" height="84" fill="#e6eef7" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="735" y="180" font-size="13" text-anchor="middle" fill="#1b1b1b">정적 공변량 인코더</text>
  <text x="735" y="202" font-size="13" text-anchor="middle" fill="#1b1b1b">컨텍스트 벡터 4개</text>
  <text x="735" y="224" font-size="13" text-anchor="middle" fill="#1f4e79">c_s · c_e · c_c · c_h</text>

  <!-- 화살표 -->
  <line x1="140" y1="122" x2="200" y2="150" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="320" y1="122" x2="330" y2="150" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="500" y1="122" x2="460" y2="150" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="560" y1="100" x2="700" y2="150" stroke="#1f4e79" stroke-width="1.5" marker-end="url(#ar)"/>

  <line x1="340" y1="196" x2="340" y2="220" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="340" y1="266" x2="340" y2="290" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="340" y1="336" x2="340" y2="360" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="340" y1="406" x2="340" y2="418" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>

  <line x1="608" y1="174" x2="534" y2="174" stroke="#1f4e79" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="608" y1="244" x2="534" y2="244" stroke="#1f4e79" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="608" y1="314" x2="534" y2="314" stroke="#1f4e79" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="610" y="290" font-size="13" fill="#555">정적 정보가 변수 선택·지역</text>
  <text x="610" y="310" font-size="13" fill="#555">처리·정적 강화에 각각 들어간다</text>
</svg>
