<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="350" fill="#fbfbf8"/>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#555"/>
    </marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="1" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6 z" fill="#555"/>
    </marker>
  </defs>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">다중 시점 예측의 입력 3종 — 시간축에서 차지하는 범위가 다르다</text>
  <text x="30" y="56" font-size="13" fill="#555">세로로 쌓인 띠는 각 입력이 모델에 들어오는 구간이다</text>

  <!-- 예측 시작 경계 -->
  <rect x="170" y="76" width="390" height="200" fill="#eef2f6"/>
  <rect x="560" y="76" width="280" height="200" fill="#fbf6ee"/>
  <line x1="560" y1="70" x2="560" y2="286" stroke="#9d0208" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="560" y="64" font-size="13" font-weight="bold" text-anchor="middle" fill="#9d0208">예측 시작 시점 t</text>

  <!-- 정적 공변량 -->
  <text x="30" y="106" font-size="13" fill="#1b1b1b">정적 공변량 s</text>
  <rect x="170" y="88" width="670" height="32" fill="#e6eef7" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="505" y="109" font-size="13" text-anchor="middle" fill="#1b1b1b">시간에 따라 변하지 않는다 (지점 유형, 계약 용량)</text>

  <!-- 미래 기지 입력 -->
  <text x="30" y="151" font-size="13" fill="#1b1b1b">미래 기지 입력 x</text>
  <rect x="170" y="133" width="670" height="32" fill="#eaf2ec" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="505" y="154" font-size="13" text-anchor="middle" fill="#1b1b1b">앞으로의 값을 미리 안다 (달력, 공휴일, 기상 예보)</text>

  <!-- 과거 관측 입력 -->
  <text x="30" y="196" font-size="13" fill="#1b1b1b">과거 관측 입력 z</text>
  <rect x="170" y="178" width="390" height="32" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="365" y="199" font-size="13" text-anchor="middle" fill="#1b1b1b">실측값만 있다 (실측 부하, 거래량)</text>
  <text x="700" y="199" font-size="13" text-anchor="middle" fill="#9d0208">앞으로는 값이 없다</text>

  <!-- 목표 -->
  <text x="30" y="241" font-size="13" fill="#1b1b1b">목표 y</text>
  <rect x="170" y="223" width="390" height="32" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="365" y="244" font-size="13" text-anchor="middle" fill="#1b1b1b">관측된 과거 목표값</text>
  <rect x="560" y="223" width="280" height="32" fill="#ffffff" stroke="#9d0208" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="700" y="244" font-size="13" text-anchor="middle" fill="#9d0208">예측 대상</text>

  <!-- 구간 표시 -->
  <line x1="172" y1="296" x2="558" y2="296" stroke="#555" stroke-width="1.5" marker-start="url(#a2)" marker-end="url(#a1)"/>
  <text x="365" y="316" font-size="13" text-anchor="middle" fill="#1b1b1b">룩백 창 k</text>
  <line x1="562" y1="296" x2="838" y2="296" stroke="#555" stroke-width="1.5" marker-start="url(#a2)" marker-end="url(#a1)"/>
  <text x="700" y="316" font-size="13" text-anchor="middle" fill="#1b1b1b">예측 구간 τ = 1 … τmax</text>

  <text x="30" y="340" font-size="13" fill="#1b1b1b">세 입력을 한 덩어리로 이어 붙이면 미래 기지 입력의 오른쪽 구간을 쓰지 못한다. 분리가 구조의 출발점이다.</text>
</svg>
