<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
    <marker id="arr-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2d6a4f"/>
    </marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b45309"/>
    </marker>
  </defs>
  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">기대 시험 오차의 3항과 규제 기법이 움직이는 항</text>

  <!-- 맨 위: 기대 시험 오차 -->
  <rect x="290" y="50" width="300" height="52" rx="6" fill="#f3f4f6" stroke="#333" stroke-width="2"/>
  <text x="440" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">기대 시험 오차</text>
  <text x="440" y="92" text-anchor="middle" font-size="13" fill="#333">E_D[(y − f(x; D))²]</text>

  <path d="M340 102 L160 140" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M440 102 L440 140" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M540 102 L720 140" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 3항 -->
  <rect x="40" y="142" width="240" height="80" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <text x="160" y="166" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">① 잡음 σ²</text>
  <text x="160" y="190" text-anchor="middle" font-size="13" fill="#333">y 자체의 흔들림</text>
  <text x="160" y="212" text-anchor="middle" font-size="13" fill="#333">어떤 모형으로도 못 줄임</text>

  <rect x="320" y="142" width="240" height="80" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="166" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">② 편향²</text>
  <text x="440" y="190" text-anchor="middle" font-size="13" fill="#333">(평균 예측 − 참 회귀함수)²</text>
  <text x="440" y="212" text-anchor="middle" font-size="13" fill="#333">용량이 작으면 커짐</text>

  <rect x="600" y="142" width="240" height="80" rx="6" fill="#fff5f5" stroke="#9d0208" stroke-width="2"/>
  <text x="720" y="166" text-anchor="middle" font-size="15" font-weight="bold" fill="#9d0208">③ 분산</text>
  <text x="720" y="190" text-anchor="middle" font-size="13" fill="#333">학습 데이터마다 예측이 흔들림</text>
  <text x="720" y="212" text-anchor="middle" font-size="13" fill="#333">용량이 크면 커짐</text>

  <!-- 아래: 기법 -->
  <line x1="30" y1="238" x2="850" y2="238" stroke="#ccc" stroke-width="1"/>

  <rect x="320" y="290" width="240" height="78" rx="6" fill="#eef4f0" stroke="#2d6a4f" stroke-width="2"/>
  <text x="440" y="314" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d6a4f">유효 용량을 줄이는 4가지</text>
  <text x="440" y="337" text-anchor="middle" font-size="13" fill="#333">L2 · L1 · 드롭아웃 · 조기 종료</text>
  <text x="440" y="358" text-anchor="middle" font-size="13" fill="#333">강도 λ · p · 걸음 수 t</text>

  <path d="M560 300 L700 226" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arr-good)"/>
  <text x="660" y="278" text-anchor="middle" font-size="13" fill="#2d6a4f">분산 ↓</text>
  <path d="M440 290 L440 226" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-warn)"/>
  <text x="485" y="262" text-anchor="middle" font-size="13" fill="#b45309">편향 ↑ (대가)</text>

  <rect x="640" y="300" width="200" height="68" rx="6" fill="#eef4f0" stroke="#2d6a4f" stroke-width="2"/>
  <text x="740" y="326" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d6a4f">데이터 확대</text>
  <text x="740" y="348" text-anchor="middle" font-size="13" fill="#333">편향은 그대로, 분산 ↓</text>
  <path d="M770 300 L770 226" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arr-good)"/>

  <rect x="40" y="290" width="220" height="78" rx="6" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="150" y="314" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">교차검증</text>
  <text x="150" y="337" text-anchor="middle" font-size="13" fill="#333">항을 직접 줄이지 않음</text>
  <text x="150" y="358" text-anchor="middle" font-size="13" fill="#333">합이 최소인 강도를 고름</text>
  <path d="M260 329 L316 329" stroke="#555" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>

  <text x="440" y="410" text-anchor="middle" font-size="13" fill="#555">②와 ③은 같은 손잡이(유효 용량)에 반대로 걸려 있다 — 한쪽을 줄이면 다른 쪽이 는다</text>
  <text x="440" y="434" text-anchor="middle" font-size="13" fill="#555">데이터 확대만 편향을 건드리지 않고 분산을 줄인다</text>
</svg>
