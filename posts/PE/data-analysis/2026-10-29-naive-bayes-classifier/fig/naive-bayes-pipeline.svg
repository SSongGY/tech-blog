<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="430" fill="#fdfdfb"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="17" font-weight="bold" fill="#1a202c">나이브 베이즈 — 학습은 빈도 세기, 분류는 로그 점수 합</text>
  <text x="24" y="52" font-size="13" fill="#4a5568">학습에 반복 최적화가 없다. 표를 한 번 세고 끝난다</text>

  <!-- 학습 단계 -->
  <rect x="20" y="72" width="840" height="140" fill="#f4f8f5" stroke="#2d6a4f" stroke-width="1.4" rx="6"/>
  <text x="36" y="96" font-size="14" font-weight="bold" fill="#2d6a4f">학습 — 표본을 한 번 훑는다</text>

  <rect x="36" y="112" width="150" height="76" fill="#ffffff" stroke="#4a5568" stroke-width="1.3" rx="4"/>
  <text x="111" y="140" font-size="13" fill="#1a202c" text-anchor="middle">라벨 달린 문서</text>
  <text x="111" y="162" font-size="13" fill="#4a5568" text-anchor="middle">스팸 3통</text>
  <text x="111" y="180" font-size="13" fill="#4a5568" text-anchor="middle">정상 4통</text>

  <line x1="190" y1="150" x2="222" y2="150" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="226" y="112" width="168" height="76" fill="#ffffff" stroke="#4a5568" stroke-width="1.3" rx="4"/>
  <text x="310" y="140" font-size="13" fill="#1a202c" text-anchor="middle">클래스별 단어 빈도</text>
  <text x="310" y="162" font-size="13" fill="#4a5568" text-anchor="middle">어휘 |V| = 16</text>
  <text x="310" y="180" font-size="13" fill="#4a5568" text-anchor="middle">스팸 13 · 정상 16 토큰</text>

  <line x1="398" y1="150" x2="430" y2="150" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="434" y="112" width="190" height="76" fill="#fff4e3" stroke="#b45309" stroke-width="1.3" rx="4"/>
  <text x="529" y="138" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">라플라스 스무딩</text>
  <text x="529" y="160" font-size="13" fill="#1a202c" text-anchor="middle">분자 +α · 분모 +α|V|</text>
  <text x="529" y="180" font-size="13" fill="#4a5568" text-anchor="middle">못 본 단어의 0 을 없앤다</text>

  <line x1="628" y1="150" x2="660" y2="150" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="664" y="112" width="180" height="76" fill="#e8f3ec" stroke="#2d6a4f" stroke-width="1.3" rx="4"/>
  <text x="754" y="140" font-size="13" fill="#1a202c" text-anchor="middle">모수 두 벌</text>
  <text x="754" y="162" font-size="13" fill="#4a5568" text-anchor="middle">사전확률 P(c)</text>
  <text x="754" y="180" font-size="13" fill="#4a5568" text-anchor="middle">조건부확률 P(w|c)</text>

  <!-- 분류 단계 -->
  <rect x="20" y="226" width="840" height="140" fill="#f6f7f9" stroke="#4a5568" stroke-width="1.4" rx="6"/>
  <text x="36" y="250" font-size="14" font-weight="bold" fill="#1a202c">분류 — 로그 점수를 더해 가장 큰 클래스를 고른다</text>

  <rect x="36" y="266" width="150" height="76" fill="#ffffff" stroke="#4a5568" stroke-width="1.3" rx="4"/>
  <text x="111" y="294" font-size="13" fill="#1a202c" text-anchor="middle">새 문서</text>
  <text x="111" y="318" font-size="13" fill="#4a5568" text-anchor="middle">"무료 자료 공유"</text>

  <line x1="190" y1="304" x2="222" y2="304" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="226" y="266" width="168" height="76" fill="#ffffff" stroke="#4a5568" stroke-width="1.3" rx="4"/>
  <text x="310" y="292" font-size="13" fill="#1a202c" text-anchor="middle">토큰 분해</text>
  <text x="310" y="314" font-size="13" fill="#4a5568" text-anchor="middle">순서와 문맥은 버린다</text>
  <text x="310" y="332" font-size="13" fill="#4a5568" text-anchor="middle">(조건부 독립 가정)</text>

  <line x1="398" y1="304" x2="430" y2="304" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="434" y="266" width="190" height="76" fill="#ffffff" stroke="#4a5568" stroke-width="1.3" rx="4"/>
  <text x="529" y="292" font-size="13" fill="#1a202c" text-anchor="middle">클래스별 로그 점수</text>
  <text x="529" y="316" font-size="13" fill="#4a5568" text-anchor="middle">log P(c) + Σ log P(w|c)</text>

  <line x1="628" y1="304" x2="660" y2="304" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="664" y="266" width="180" height="76" fill="#e8f3ec" stroke="#2d6a4f" stroke-width="1.3" rx="4"/>
  <text x="754" y="292" font-size="13" fill="#1a202c" text-anchor="middle">argmax 로 판정</text>
  <text x="754" y="314" font-size="13" fill="#4a5568" text-anchor="middle">정상 -8.47 · 스팸 -9.34</text>
  <text x="754" y="332" font-size="13" font-weight="bold" fill="#2d6a4f" text-anchor="middle">→ 정상</text>

  <text x="24" y="392" font-size="13" fill="#4a5568">곱 대신 로그 합을 쓰는 이유는 하한 때문이다. 확률 0.01 을 200번 곱하면</text>
  <text x="24" y="412" font-size="13" fill="#4a5568">배정밀도 부동소수점에서 0.0 이 되지만, 로그 합은 -921.03 으로 남는다.</text>
  <text x="470" y="392" font-size="13" fill="#4a5568">사후확률이 필요하면 로그 점수에서 최댓값을 빼고</text>
  <text x="470" y="412" font-size="13" fill="#4a5568">지수를 취해 정규화한다.</text>
</svg>
