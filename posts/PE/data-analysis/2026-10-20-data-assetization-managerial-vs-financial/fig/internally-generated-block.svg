<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="440" fill="#fbfaf7"/>

  <text x="32" y="34" font-size="17" font-weight="bold" fill="#1f2933">내부에서 만든 데이터가 막히는 지점</text>
  <text x="32" y="56" font-size="13" fill="#52606d">같은 데이터라도 외부 취득이면 분기가 짧다</text>

  <!-- 출발 -->
  <rect x="350" y="76" width="180" height="46" rx="6" fill="#ffffff" stroke="#3e4c59" stroke-width="1.5"/>
  <text x="440" y="105" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">데이터 관련 지출</text>

  <line x1="440" y1="122" x2="440" y2="140" stroke="#3e4c59" stroke-width="1.5"/>
  <line x1="190" y1="140" x2="690" y2="140" stroke="#3e4c59" stroke-width="1.5"/>
  <line x1="190" y1="140" x2="190" y2="160" stroke="#3e4c59" stroke-width="1.5"/>
  <line x1="690" y1="140" x2="690" y2="160" stroke="#3e4c59" stroke-width="1.5"/>

  <!-- 외부 취득 -->
  <rect x="90" y="160" width="200" height="46" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="190" y="189" font-size="14" fill="#2d6a4f" text-anchor="middle">외부 취득</text>

  <line x1="190" y1="206" x2="190" y2="238" stroke="#2d6a4f" stroke-width="1.5"/>
  <polygon points="190,246 185,234 195,234" fill="#2d6a4f"/>

  <rect x="70" y="246" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="190" y="270" font-size="13" fill="#2d6a4f" text-anchor="middle">정의 3요건 + 인식 2요건</text>
  <text x="190" y="291" font-size="13" fill="#2d6a4f" text-anchor="middle">판단만 하면 된다</text>

  <line x1="190" y1="302" x2="190" y2="334" stroke="#2d6a4f" stroke-width="1.5"/>
  <polygon points="190,342 185,330 195,330" fill="#2d6a4f"/>

  <rect x="90" y="342" width="200" height="46" rx="6" fill="#edf7f1" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="190" y="371" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">무형자산 인식 가능</text>

  <!-- 내부창출 -->
  <rect x="590" y="160" width="200" height="46" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="690" y="189" font-size="14" fill="#b45309" text-anchor="middle">내부창출</text>

  <line x1="690" y1="206" x2="690" y2="224" stroke="#b45309" stroke-width="1.5"/>
  <line x1="465" y1="224" x2="735" y2="224" stroke="#b45309" stroke-width="1.5"/>
  <line x1="465" y1="224" x2="465" y2="246" stroke="#b45309" stroke-width="1.5"/>
  <line x1="735" y1="224" x2="735" y2="246" stroke="#b45309" stroke-width="1.5"/>

  <rect x="370" y="246" width="190" height="56" rx="6" fill="#fde8e8" stroke="#9d0208" stroke-width="1.5"/>
  <text x="465" y="270" font-size="13" font-weight="bold" fill="#9d0208" text-anchor="middle">연구단계</text>
  <text x="465" y="291" font-size="13" fill="#9d0208" text-anchor="middle">인식하지 않는다 (§54)</text>

  <rect x="610" y="246" width="230" height="56" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="725" y="270" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">개발단계</text>
  <text x="725" y="291" font-size="13" fill="#8a5a0b" text-anchor="middle">6요건 모두 입증 (§57)</text>

  <line x1="725" y1="302" x2="725" y2="334" stroke="#9d0208" stroke-width="1.5"/>
  <polygon points="725,342 720,330 730,330" fill="#9d0208"/>

  <rect x="370" y="342" width="470" height="56" rx="6" fill="#fde8e8" stroke="#9d0208" stroke-width="2"/>
  <text x="605" y="366" font-size="14" font-weight="bold" fill="#9d0208" text-anchor="middle">고객목록과 실질이 유사하면 — 인식하지 않는다 (§63)</text>
  <text x="605" y="387" font-size="13" fill="#9d0208" text-anchor="middle">사업 전체를 개발하는 원가와 구분할 수 없기 때문</text>

  <text x="32" y="424" font-size="13" fill="#52606d">기업이 쌓는 데이터의 상당 부분이 이 칸에 걸린다</text>
</svg>
