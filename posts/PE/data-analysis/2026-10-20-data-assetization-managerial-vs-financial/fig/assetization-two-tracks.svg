<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="440" fill="#fbfaf7"/>

  <text x="32" y="34" font-size="17" font-weight="bold" fill="#1f2933">관리적 자산화 5요소가 재무적 자산화 5요건의 입증 재료가 된다</text>

  <text x="40" y="70" font-size="13" font-weight="bold" fill="#52606d">관리적 자산화 — 5요소</text>
  <text x="300" y="70" font-size="13" font-weight="bold" fill="#52606d">재무적 자산화 — 관문 5요건</text>
  <text x="650" y="70" font-size="13" font-weight="bold" fill="#52606d">회계 처리</text>

  <!-- 왼쪽 5요소 -->
  <rect x="40" y="84" width="210" height="48" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="145" y="114" font-size="14" fill="#2d6a4f" text-anchor="middle">① 식별 · 목록화</text>

  <rect x="40" y="144" width="210" height="48" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="145" y="174" font-size="14" fill="#2d6a4f" text-anchor="middle">② 품질 확보</text>

  <rect x="40" y="204" width="210" height="48" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="145" y="234" font-size="14" fill="#2d6a4f" text-anchor="middle">③ 권리 · 통제</text>

  <rect x="40" y="264" width="210" height="48" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="145" y="294" font-size="14" fill="#2d6a4f" text-anchor="middle">④ 가치 측정</text>

  <rect x="40" y="324" width="210" height="48" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="145" y="354" font-size="14" fill="#2d6a4f" text-anchor="middle">⑤ 유통 기반</text>

  <!-- 화살표 -->
  <line x1="256" y1="228" x2="292" y2="228" stroke="#3e4c59" stroke-width="2"/>
  <polygon points="300,228 288,223 288,233" fill="#3e4c59"/>

  <!-- 가운데 관문 -->
  <rect x="306" y="84" width="280" height="288" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="446" y="116" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">정의 3요건</text>
  <text x="446" y="144" font-size="13" fill="#8a5a0b" text-anchor="middle">① 식별가능성 (§12)</text>
  <text x="446" y="170" font-size="13" fill="#8a5a0b" text-anchor="middle">② 통제 (§13)</text>
  <text x="446" y="196" font-size="13" fill="#8a5a0b" text-anchor="middle">③ 미래 경제적 효익 (§17)</text>
  <line x1="336" y1="218" x2="556" y2="218" stroke="#b45309" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="446" y="248" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">인식 2요건</text>
  <text x="446" y="276" font-size="13" fill="#8a5a0b" text-anchor="middle">④ 효익 유입 가능성이 높을 것</text>
  <text x="446" y="302" font-size="13" fill="#8a5a0b" text-anchor="middle">(§21a)</text>
  <text x="446" y="330" font-size="13" fill="#8a5a0b" text-anchor="middle">⑤ 원가의 신뢰성 있는 측정</text>
  <text x="446" y="356" font-size="13" fill="#8a5a0b" text-anchor="middle">(§21b)</text>

  <!-- 오른쪽 결과 -->
  <line x1="592" y1="160" x2="628" y2="160" stroke="#2d6a4f" stroke-width="2"/>
  <polygon points="636,160 624,155 624,165" fill="#2d6a4f"/>
  <rect x="642" y="132" width="198" height="56" rx="6" fill="#edf7f1" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="741" y="158" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">모두 충족</text>
  <text x="741" y="178" font-size="13" fill="#2d6a4f" text-anchor="middle">무형자산으로 인식</text>

  <line x1="592" y1="296" x2="628" y2="296" stroke="#9d0208" stroke-width="2"/>
  <polygon points="636,296 624,291 624,301" fill="#9d0208"/>
  <rect x="642" y="268" width="198" height="56" rx="6" fill="#fde8e8" stroke="#9d0208" stroke-width="1.5"/>
  <text x="741" y="294" font-size="14" font-weight="bold" fill="#9d0208" text-anchor="middle">하나라도 미충족</text>
  <text x="741" y="314" font-size="13" fill="#9d0208" text-anchor="middle">발생 시 비용 처리</text>

  <text x="32" y="412" font-size="13" fill="#52606d">왼쪽이 없으면 관문 앞에 설 수조차 없다 — 입증할 재료가 없기 때문이다</text>
</svg>
