<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="440" y="30" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">맥락 아웃라이어 — 속성을 둘로 나누고, 두 방식 중 하나로 검출한다</text>

  <!-- 데이터 인스턴스 -->
  <text x="200" y="66" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">데이터 인스턴스 d = [x, y]</text>
  <rect x="40" y="78" width="160" height="70" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="120" y="106" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">맥락 속성 x</text>
  <text x="120" y="128" font-size="13" text-anchor="middle" fill="#374151">비교할 이웃을 정한다</text>
  <rect x="200" y="78" width="160" height="70" rx="6" fill="#e8f5ee" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="280" y="106" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">행동 속성 y</text>
  <text x="280" y="128" font-size="13" text-anchor="middle" fill="#374151">벗어남을 잰다</text>

  <!-- 맥락 정의 4가지 -->
  <text x="200" y="186" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">맥락 속성을 정하는 4가지 (§10)</text>
  <line x1="120" y1="150" x2="120" y2="168" stroke="#374151" stroke-width="1.5"/>
  <rect x="40" y="198" width="155" height="54" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="117" y="222" font-size="14" text-anchor="middle" fill="#1f2937">① 공간</text>
  <text x="117" y="241" font-size="13" text-anchor="middle" fill="#6b7280">위도·경도</text>
  <rect x="205" y="198" width="155" height="54" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="282" y="222" font-size="14" text-anchor="middle" fill="#1f2937">② 그래프</text>
  <text x="282" y="241" font-size="13" text-anchor="middle" fill="#6b7280">간선으로 이웃</text>
  <rect x="40" y="262" width="155" height="54" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="117" y="286" font-size="14" text-anchor="middle" fill="#1f2937">③ 순차</text>
  <text x="117" y="305" font-size="13" text-anchor="middle" fill="#6b7280">시계열·이벤트 위치</text>
  <rect x="205" y="262" width="155" height="54" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="282" y="286" font-size="14" text-anchor="middle" fill="#1f2937">④ 프로파일</text>
  <text x="282" y="305" font-size="13" text-anchor="middle" fill="#6b7280">사용자 군·고객 그룹</text>

  <!-- 검출 방식 2가지 -->
  <line x1="365" y1="190" x2="440" y2="190" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="66" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">검출 방식 2가지 (§10.1, §10.2)</text>

  <rect x="450" y="80" width="400" height="140" rx="8" fill="#e8eef8" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="650" y="104" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">(1) 점 이상 탐지로 환원</text>
  <rect x="470" y="118" width="160" height="56" rx="6" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="550" y="142" font-size="13" text-anchor="middle" fill="#1f2937">x로 맥락을 찾는다</text>
  <text x="550" y="162" font-size="13" text-anchor="middle" fill="#6b7280">분할·군집·혼합 모델</text>
  <line x1="632" y1="146" x2="666" y2="146" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="670" y="118" width="160" height="56" rx="6" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="750" y="142" font-size="13" text-anchor="middle" fill="#1f2937">맥락 안에서 y 점수</text>
  <text x="750" y="162" font-size="13" text-anchor="middle" fill="#6b7280">기존 점 이상 기법</text>
  <text x="650" y="204" font-size="13" text-anchor="middle" fill="#374151">학습 빠름 · 판정 때마다 맥락을 다시 찾는다</text>

  <rect x="450" y="236" width="400" height="140" rx="8" fill="#e8eef8" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="650" y="260" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">(2) 데이터 구조를 모델링</text>
  <rect x="470" y="274" width="160" height="56" rx="6" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="550" y="298" font-size="13" text-anchor="middle" fill="#1f2937">x → 기대 y 예측</text>
  <text x="550" y="318" font-size="13" text-anchor="middle" fill="#6b7280">회귀·AR·ARIMA·HMM</text>
  <line x1="632" y1="302" x2="666" y2="302" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="670" y="274" width="160" height="56" rx="6" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="750" y="298" font-size="13" text-anchor="middle" fill="#1f2937">관측 y와 차이</text>
  <text x="750" y="318" font-size="13" text-anchor="middle" fill="#6b7280">크면 이상</text>
  <text x="650" y="360" font-size="13" text-anchor="middle" fill="#374151">학습 무거움 · 판정은 모델 하나와 비교</text>

  <text x="440" y="418" font-size="13" text-anchor="middle" fill="#4b5563">같은 y라도 x가 다르면 판정이 갈린다 — 겨울의 35°F는 정상, 여름의 35°F는 이상 (Chandola 외 그림 3)</text>
  <text x="440" y="444" font-size="13" text-anchor="middle" fill="#4b5563">Song 외(2007)는 x를 환경 속성, y를 지표 속성이라 부른다</text>
</svg>
