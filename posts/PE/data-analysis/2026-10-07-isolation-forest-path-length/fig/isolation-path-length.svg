<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#4a5568" stroke-width="1.6"/>
    </marker>
  </defs>

  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">Isolation Forest — 무작위 분할로 고립시키는 데 드는 횟수</text>

  <!-- 왼쪽: 특징 공간 -->
  <text x="40" y="62" font-size="14" font-weight="bold" fill="#1b1b1b">① 특징 공간을 무작위로 자른다</text>
  <rect x="40" y="76" width="360" height="300" fill="#f9fafb" stroke="#4a5568" stroke-width="1.6"/>

  <!-- 정상 군집 -->
  <g fill="#2d6a4f">
    <circle cx="170" cy="250" r="4"/><circle cx="185" cy="236" r="4"/><circle cx="160" cy="268" r="4"/>
    <circle cx="200" cy="258" r="4"/><circle cx="178" cy="280" r="4"/><circle cx="150" cy="240" r="4"/>
    <circle cx="210" cy="240" r="4"/><circle cx="192" cy="292" r="4"/><circle cx="140" cy="262" r="4"/>
    <circle cx="222" cy="272" r="4"/><circle cx="165" cy="222" r="4"/><circle cx="205" cy="222" r="4"/>
    <circle cx="230" cy="252" r="4"/><circle cx="155" cy="290" r="4"/><circle cx="185" cy="262" r="4"/>
    <circle cx="325" cy="236" r="4"/><circle cx="352" cy="288" r="4"/>
  </g>
  <circle cx="185" cy="262" r="8" fill="none" stroke="#2d6a4f" stroke-width="2"/>
  <text x="130" y="322" font-size="13" fill="#2d6a4f">x_i : 군집 안</text>

  <!-- 이상점 -->
  <circle cx="345" cy="115" r="6" fill="#9d0208"/>
  <text x="310" y="146" font-size="13" fill="#9d0208">x_o : 고립점</text>

  <!-- 분할선 -->
  <line x1="300" y1="76" x2="300" y2="376" stroke="#b45309" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="306" y="366" font-size="13" font-weight="bold" fill="#b45309">분할 1</text>
  <line x1="300" y1="160" x2="400" y2="160" stroke="#b45309" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="330" y="180" font-size="13" font-weight="bold" fill="#b45309">분할 2</text>

  <text x="40" y="402" font-size="13" fill="#4a5568">속성 q 하나와 그 최솟값~최댓값 사이 분할값 p 를</text>
  <text x="40" y="420" font-size="13" fill="#4a5568">무작위로 고른다. 드물고 동떨어진 점(x_o)은 두 번 만에 혼자 남고,</text>
  <text x="40" y="438" font-size="13" fill="#4a5568">군집 안의 점(x_i)은 여러 번 잘라야 혼자 남는다.</text>

  <!-- 오른쪽: iTree -->
  <text x="470" y="62" font-size="14" font-weight="bold" fill="#1b1b1b">② 같은 분할을 이진 트리(iTree)로 본다</text>

  <rect x="610" y="80" width="110" height="34" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.6" rx="4"/>
  <text x="665" y="102" text-anchor="middle" font-size="13" fill="#1b1b1b">분할 1</text>

  <line x1="640" y1="114" x2="560" y2="146" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="690" y1="114" x2="770" y2="146" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="500" y="150" width="120" height="34" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.6" rx="4"/>
  <text x="560" y="172" text-anchor="middle" font-size="13" fill="#1b1b1b">분할 … (계속)</text>

  <rect x="715" y="150" width="110" height="34" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.6" rx="4"/>
  <text x="770" y="172" text-anchor="middle" font-size="13" fill="#1b1b1b">분할 2</text>

  <line x1="790" y1="184" x2="815" y2="214" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="770" y="218" width="90" height="34" fill="#fdecec" stroke="#9d0208" stroke-width="2" rx="4"/>
  <text x="815" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#9d0208">x_o  h=2</text>

  <line x1="560" y1="184" x2="560" y2="270" stroke="#4a5568" stroke-width="1.6" stroke-dasharray="3,4" marker-end="url(#ar)"/>
  <rect x="505" y="274" width="110" height="34" fill="#eef7f1" stroke="#2d6a4f" stroke-width="2" rx="4"/>
  <text x="560" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d6a4f">x_i  h 큼</text>

  <!-- 점수식 -->
  <rect x="470" y="330" width="380" height="104" fill="#fff7ed" stroke="#b45309" stroke-width="2" rx="4"/>
  <text x="660" y="356" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">s(x, ψ) = 2^( − E[h(x)] / c(ψ) )</text>
  <text x="490" y="380" font-size="13" fill="#4a5568">E[h(x)] : 트리 t개의 평균 경로 길이</text>
  <text x="490" y="400" font-size="13" fill="#4a5568">c(ψ) : 표본 ψ개 이진 탐색 트리의 평균 경로 길이</text>
  <text x="490" y="420" font-size="13" fill="#4a5568">s → 1 이상 · s ≪ 0.5 정상 · 모두 ≈ 0.5 뚜렷한 이상 없음</text>
</svg>
