<svg xmlns="http://www.w3.org/2000/svg" width="880" height="485" viewBox="0 0 880 485" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="485" fill="#fbfbf8"/>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">NIST 포그 개념 모델 — 클라우드와 말단 장치 사이의 계층</text>
  <text x="30" y="56" font-size="13" fill="#555">포그 노드는 말단 장치 또는 접속망에 붙어 자원을 내주고, 필요할 때만 클라우드로 잇는다</text>

  <!-- tier labels -->
  <text x="30" y="104" font-size="14" font-weight="bold" fill="#1b1b1b">클라우드</text>
  <text x="30" y="122" font-size="13" fill="#555">중앙 집중</text>
  <text x="30" y="206" font-size="14" font-weight="bold" fill="#2d6a4f">포그</text>
  <text x="30" y="224" font-size="13" fill="#555">필수 아님</text>
  <text x="30" y="296" font-size="14" font-weight="bold" fill="#2d6a4f">미스트</text>
  <text x="30" y="314" font-size="13" fill="#555">경량 포그, 필수 아님</text>
  <text x="30" y="386" font-size="14" font-weight="bold" fill="#1b1b1b">엣지</text>
  <text x="30" y="404" font-size="13" fill="#555">말단 장치와 사용자</text>

  <!-- cloud -->
  <rect x="220" y="80" width="420" height="52" rx="8" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="430" y="104" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">중앙 클라우드 서비스</text>
  <text x="430" y="123" font-size="13" text-anchor="middle" fill="#333">자원 풀 · 통합 분석 · 장기 저장</text>

  <!-- fog cluster -->
  <rect x="210" y="170" width="440" height="78" rx="10" fill="none" stroke="#2d6a4f" stroke-width="1.2" stroke-dasharray="6 4"/>
  <rect x="230" y="182" width="170" height="54" rx="8" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="315" y="205" font-size="14" font-weight="bold" text-anchor="middle" fill="#2d6a4f">포그 노드 (물리)</text>
  <text x="315" y="225" font-size="13" text-anchor="middle" fill="#333">게이트웨이 · 라우터 · 서버</text>
  <rect x="460" y="182" width="170" height="54" rx="8" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="545" y="205" font-size="14" font-weight="bold" text-anchor="middle" fill="#2d6a4f">포그 노드 (가상)</text>
  <text x="545" y="225" font-size="13" text-anchor="middle" fill="#333">VM · cloudlet</text>
  <path d="M 402 209 L 458 209" stroke="#2d6a4f" stroke-width="1.3" fill="none" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <text x="430" y="264" font-size="13" text-anchor="middle" fill="#2d6a4f">클러스터 — 수평 연합 · 수직 격리</text>

  <!-- mist -->
  <rect x="230" y="278" width="170" height="48" rx="8" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.3"/>
  <text x="315" y="298" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b1b1b">미스트 노드</text>
  <text x="315" y="317" font-size="13" text-anchor="middle" fill="#333">마이크로컨트롤러</text>
  <rect x="460" y="278" width="170" height="48" rx="8" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.3"/>
  <text x="545" y="298" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b1b1b">미스트 노드</text>
  <text x="545" y="317" font-size="13" text-anchor="middle" fill="#333">마이크로컴퓨터</text>

  <!-- edge devices -->
  <rect x="220" y="366" width="120" height="44" rx="8" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="280" y="393" font-size="14" text-anchor="middle" fill="#1b1b1b">센서</text>
  <rect x="370" y="366" width="120" height="44" rx="8" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="430" y="393" font-size="14" text-anchor="middle" fill="#1b1b1b">계량기</text>
  <rect x="520" y="366" width="120" height="44" rx="8" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="580" y="393" font-size="14" text-anchor="middle" fill="#1b1b1b">차량 · 단말</text>

  <!-- upward links -->
  <path d="M 280 366 L 300 326" stroke="#3b3b3b" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
  <path d="M 430 366 L 520 326" stroke="#3b3b3b" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
  <path d="M 580 366 L 560 326" stroke="#3b3b3b" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
  <path d="M 315 280 L 315 238" stroke="#3b3b3b" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
  <path d="M 545 280 L 545 238" stroke="#3b3b3b" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
  <path d="M 430 170 L 430 134" stroke="#3b3b3b" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
  <text x="440" y="157" font-size="13" fill="#555">필요할 때만</text>

  <!-- right panel -->
  <text x="690" y="96" font-size="14" font-weight="bold" fill="#1b1b1b">필수 특성 6가지</text>
  <text x="690" y="118" font-size="13" fill="#333">① 위치 인식 · 저지연</text>
  <text x="690" y="137" font-size="13" fill="#333">② 지리적 분산</text>
  <text x="690" y="156" font-size="13" fill="#333">③ 이기종성</text>
  <text x="690" y="175" font-size="13" fill="#333">④ 상호운용 · 연합</text>
  <text x="690" y="194" font-size="13" fill="#333">⑤ 실시간 상호작용</text>
  <text x="690" y="213" font-size="13" fill="#333">⑥ 클러스터 확장 · 민첩성</text>

  <text x="690" y="256" font-size="14" font-weight="bold" fill="#1b1b1b">노드 속성 5가지</text>
  <text x="690" y="278" font-size="13" fill="#333">① 자율성</text>
  <text x="690" y="297" font-size="13" fill="#333">② 이기종성</text>
  <text x="690" y="316" font-size="13" fill="#333">③ 계층적 클러스터링</text>
  <text x="690" y="335" font-size="13" fill="#333">④ 관리 가능성</text>
  <text x="690" y="354" font-size="13" fill="#333">⑤ 프로그래밍 가능성</text>

  <line x1="30" y1="428" x2="850" y2="428" stroke="#d8d8d2" stroke-width="1"/>
  <text x="30" y="450" font-size="13" fill="#333">NIST는 말단 장치 계층만 엣지로 부르고, 그 위 중간 계층을 포그로 둔다.</text>
  <text x="30" y="469" font-size="13" fill="#555">포그 없이 장치가 클라우드에 바로 붙는 구성도, 클라우드 없이 포그만 쓰는 구성도 허용한다.</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b3b3b"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6a4f"/>
    </marker>
  </defs>
</svg>
