<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="460" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <text x="440" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#222222">EU AI법 범용 AI 의무와 행동강령 3개 장의 대응</text>

  <text x="170" y="60" text-anchor="middle" font-size="13" fill="#355070">AI법 의무 (Regulation (EU) 2024/1689)</text>
  <text x="640" y="60" text-anchor="middle" font-size="13" fill="#355070">범용 AI 행동강령 (2025-07-10)</text>

  <!-- all providers group -->
  <rect x="20" y="72" width="840" height="236" rx="8" fill="#f7f7f7" stroke="#355070" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="34" y="92" font-size="13" fill="#355070">모든 범용 AI 모델 제공자</text>

  <!-- law boxes -->
  <rect x="40" y="104" width="260" height="58" rx="6" fill="#eef3f8" stroke="#355070" stroke-width="1.5"/>
  <text x="170" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">제53조 제1항 (a)·(b)</text>
  <text x="170" y="148" text-anchor="middle" font-size="13" fill="#333333">기술 문서(부속서 XI) · 하류 정보(XII)</text>

  <rect x="40" y="174" width="260" height="52" rx="6" fill="#eef3f8" stroke="#355070" stroke-width="1.5"/>
  <text x="170" y="197" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">제53조 제1항 (c)</text>
  <text x="170" y="216" text-anchor="middle" font-size="13" fill="#333333">EU 저작권법 준수 정책</text>

  <rect x="40" y="238" width="260" height="52" rx="6" fill="#eef3f8" stroke="#355070" stroke-width="1.5"/>
  <text x="170" y="261" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">제53조 제1항 (d)</text>
  <text x="170" y="280" text-anchor="middle" font-size="13" fill="#333333">학습 데이터 요약 공개</text>

  <!-- code boxes -->
  <rect x="500" y="104" width="300" height="58" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="650" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">투명성 장 — 조치 3개</text>
  <text x="650" y="148" text-anchor="middle" font-size="13" fill="#333333">모델 문서 양식 · 10년 보관 · 14일 응답</text>

  <rect x="500" y="174" width="300" height="52" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="650" y="197" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">저작권 장 — 조치 5개</text>
  <text x="650" y="216" text-anchor="middle" font-size="13" fill="#333333">정책 · 크롤링 · robots.txt · 출력 · 창구</text>

  <rect x="500" y="238" width="300" height="52" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="650" y="261" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">행동강령 밖</text>
  <text x="650" y="280" text-anchor="middle" font-size="13" fill="#333333">AI Office 요약 양식을 따른다</text>

  <line x1="300" y1="133" x2="498" y2="133" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="300" y1="200" x2="498" y2="200" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="300" y1="264" x2="498" y2="264" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <text x="400" y="124" text-anchor="middle" font-size="13" fill="#9d0208">오픈소스 면제 가능</text>

  <!-- systemic risk group -->
  <rect x="20" y="322" width="840" height="110" rx="8" fill="#fff6ed" stroke="#9d0208" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="34" y="342" font-size="13" fill="#9d0208">시스템적 위험이 있는 모델 제공자만 (추정 기준: 학습 연산량 10²⁵ FLOP 초과)</text>

  <rect x="40" y="354" width="260" height="62" rx="6" fill="#eef3f8" stroke="#355070" stroke-width="1.5"/>
  <text x="170" y="379" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">제55조 제1항 (a)~(d)</text>
  <text x="170" y="400" text-anchor="middle" font-size="13" fill="#333333">평가 · 위험 완화 · 사고 보고 · 보안</text>

  <rect x="500" y="354" width="300" height="62" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="650" y="379" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">안전·보안 장 — 약속 10개</text>
  <text x="650" y="400" text-anchor="middle" font-size="13" fill="#333333">프레임워크 → 식별·분석·수용 → 완화 → 보고</text>

  <line x1="300" y1="385" x2="498" y2="385" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
