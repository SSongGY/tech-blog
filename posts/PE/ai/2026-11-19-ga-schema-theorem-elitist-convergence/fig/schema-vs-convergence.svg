<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 왼쪽: 스키마 정리 -->
  <text x="215" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">스키마 정리 (Holland, 1975)</text>
  <text x="215" y="56" text-anchor="middle" font-size="13" fill="#555">한 세대의 기대 개수에 대한 하한</text>

  <rect x="30" y="76" width="370" height="50" rx="6" fill="#f1f5f9" stroke="#475569"/>
  <text x="215" y="98" text-anchor="middle" font-size="14" fill="#222">① 선택 항</text>
  <text x="215" y="117" text-anchor="middle" font-size="13" fill="#333">m(H,t) · f(H) / f̄</text>

  <rect x="30" y="140" width="370" height="50" rx="6" fill="#f1f5f9" stroke="#475569"/>
  <text x="215" y="162" text-anchor="middle" font-size="14" fill="#222">② 교차에서 살아남을 확률</text>
  <text x="215" y="181" text-anchor="middle" font-size="13" fill="#333">1 − pc · δ(H) / (l − 1)</text>

  <rect x="30" y="204" width="370" height="50" rx="6" fill="#f1f5f9" stroke="#475569"/>
  <text x="215" y="226" text-anchor="middle" font-size="14" fill="#222">③ 변이에서 살아남을 확률</text>
  <text x="215" y="245" text-anchor="middle" font-size="13" fill="#333">1 − o(H) · pm</text>

  <line x1="215" y1="256" x2="215" y2="290" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="228" y="279" font-size="13" fill="#555">세 항을 곱한다</text>

  <rect x="30" y="294" width="370" height="56" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="215" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">E[m(H, t+1)] ≥ ① × ② × ③</text>
  <text x="215" y="338" text-anchor="middle" font-size="13" fill="#2d6a4f">짧고 차수 낮고 평균 이상인 스키마가 늘어난다</text>

  <text x="215" y="378" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">한 세대의 부등식일 뿐, 전역 최적 수렴을 보장하지 않는다</text>
  <text x="215" y="398" text-anchor="middle" font-size="13" fill="#b45309">(Rudolph 1994, §5)</text>

  <!-- 구분선 -->
  <line x1="440" y1="24" x2="440" y2="440" stroke="#cbd5e1" stroke-dasharray="4 4"/>

  <!-- 오른쪽: Rudolph -->
  <text x="660" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">수렴 분석 (Rudolph, 1994)</text>
  <text x="660" y="56" text-anchor="middle" font-size="13" fill="#555">유한 마르코프 체인으로 본 장기 거동</text>

  <rect x="480" y="76" width="360" height="50" rx="6" fill="#f1f5f9" stroke="#475569"/>
  <text x="660" y="98" text-anchor="middle" font-size="14" fill="#222">기본형 GA, 변이 확률 0 &lt; pm &lt; 1</text>
  <text x="660" y="117" text-anchor="middle" font-size="13" fill="#333">전이 행렬의 모든 칸이 양수 (정리 3)</text>

  <line x1="660" y1="128" x2="660" y2="148" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="480" y="152" width="360" height="50" rx="6" fill="#f1f5f9" stroke="#475569"/>
  <text x="660" y="174" text-anchor="middle" font-size="14" fill="#222">에르고딕 체인 (따름정리 1)</text>
  <text x="660" y="193" text-anchor="middle" font-size="13" fill="#333">극한에서 모든 상태의 확률이 0보다 크다</text>

  <line x1="600" y1="204" x2="560" y2="252" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="720" y1="204" x2="760" y2="252" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="528" y="232" font-size="13" fill="#555">그대로</text>
  <text x="745" y="226" font-size="13" fill="#555">최고 해 보존 추가</text>

  <rect x="470" y="256" width="175" height="94" rx="6" fill="#ffffff" stroke="#9d0208" stroke-width="2"/>
  <text x="557" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d0208">수렴하지 않는다</text>
  <text x="557" y="302" text-anchor="middle" font-size="13" fill="#9d0208">(정리 4)</text>
  <text x="557" y="324" text-anchor="middle" font-size="13" fill="#333">최적해가 없는 상태에도</text>
  <text x="557" y="341" text-anchor="middle" font-size="13" fill="#333">계속 확률이 남는다</text>

  <rect x="665" y="256" width="185" height="94" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="757" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">전역 최적으로 수렴</text>
  <text x="757" y="302" text-anchor="middle" font-size="13" fill="#2d6a4f">(정리 6·7)</text>
  <text x="757" y="324" text-anchor="middle" font-size="13" fill="#333">찾은 최적해를</text>
  <text x="757" y="341" text-anchor="middle" font-size="13" fill="#333">다시 잃지 않는다</text>

  <text x="660" y="378" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">수렴의 근거는 스키마가 아니라 '최고 해 보존'이다</text>
  <text x="660" y="398" text-anchor="middle" font-size="13" fill="#b45309">(Rudolph 1994, §6)</text>

  <text x="440" y="452" text-anchor="middle" font-size="13" fill="#555">H: 스키마, m: 집단 안 개수, f(H): 스키마 평균 적합도, f̄: 집단 평균, δ: 정의 길이, o: 차수, l: 염색체 길이</text>
</svg>
