<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="430" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <rect x="250" y="20" width="380" height="56" rx="6" fill="#f1f5f9" stroke="#475569"/>
  <text x="440" y="44" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">메타휴리스틱</text>
  <text x="440" y="64" text-anchor="middle" font-size="13" fill="#333">문제 독립적인 상위 알고리즘 틀 (Sörensen·Glover, 2013)</text>

  <line x1="380" y1="78" x2="250" y2="112" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="78" x2="700" y2="112" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="60" y="116" width="440" height="50" rx="6" fill="#ffffff" stroke="#475569"/>
  <text x="280" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">단일 해 탐색</text>
  <text x="280" y="157" text-anchor="middle" font-size="13" fill="#333">현재 해 1개를 이웃으로 옮겨 간다</text>

  <rect x="580" y="116" width="240" height="50" rx="6" fill="#ffffff" stroke="#475569"/>
  <text x="700" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">집단 탐색</text>
  <text x="700" y="157" text-anchor="middle" font-size="13" fill="#333">해 N개를 함께 바꿔 간다</text>

  <line x1="180" y1="168" x2="160" y2="200" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="380" y1="168" x2="400" y2="200" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="700" y1="168" x2="700" y2="200" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- SA -->
  <rect x="40" y="204" width="240" height="150" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="160" y="228" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d6a4f">시뮬레이티드 어닐링</text>
  <text x="160" y="248" text-anchor="middle" font-size="13" fill="#555">Kirkpatrick 외, 1983</text>
  <text x="160" y="276" text-anchor="middle" font-size="13" fill="#222">탈출: 나쁜 이동도 확률로 받는다</text>
  <text x="160" y="296" text-anchor="middle" font-size="13" fill="#222">P = exp(−ΔE / T)</text>
  <text x="160" y="320" text-anchor="middle" font-size="13" fill="#222">기억: 없음 (현재 해만)</text>
  <text x="160" y="340" text-anchor="middle" font-size="13" fill="#b45309">조절: 냉각 일정</text>

  <!-- TS -->
  <rect x="300" y="204" width="240" height="150" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="420" y="228" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d6a4f">타부 탐색</text>
  <text x="420" y="248" text-anchor="middle" font-size="13" fill="#555">Glover, 1986·1989</text>
  <text x="420" y="276" text-anchor="middle" font-size="13" fill="#222">탈출: 허용된 이웃 중 최선으로</text>
  <text x="420" y="296" text-anchor="middle" font-size="13" fill="#222">나빠지더라도 이동한다</text>
  <text x="420" y="320" text-anchor="middle" font-size="13" fill="#222">기억: 타부 목록 + 열망 기준</text>
  <text x="420" y="340" text-anchor="middle" font-size="13" fill="#b45309">조절: 타부 기간</text>

  <!-- GA -->
  <rect x="580" y="204" width="240" height="150" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="700" y="228" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d6a4f">유전 알고리즘</text>
  <text x="700" y="248" text-anchor="middle" font-size="13" fill="#555">Holland, 1975</text>
  <text x="700" y="276" text-anchor="middle" font-size="13" fill="#222">탈출: 집단 다양성과</text>
  <text x="700" y="296" text-anchor="middle" font-size="13" fill="#222">교차·변이로 멀리 뛴다</text>
  <text x="700" y="320" text-anchor="middle" font-size="13" fill="#222">기억: 집단 자체</text>
  <text x="700" y="340" text-anchor="middle" font-size="13" fill="#b45309">조절: 선택압·변이율</text>

  <text x="440" y="392" text-anchor="middle" font-size="13" fill="#9d0208">언덕 오르기는 지역 최적해에서 멈춘다 — 세 기법은 그것을 넘는 방식이 다르다</text>
  <text x="440" y="414" text-anchor="middle" font-size="13" fill="#555">ΔE: 나빠진 양, T: 온도(제어 파라미터)</text>
</svg>
