<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="420" fill="#f7f7f4"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="17" font-weight="bold" fill="#1b1b1b">실질적인 사람 감독 — 3단계</text>

  <!-- 1단계 -->
  <rect x="24" y="50" width="256" height="70" rx="6" fill="#e8f0ec" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="152" y="78" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">① 승인 지점 정의</text>
  <text x="152" y="100" font-size="13" fill="#444444" text-anchor="middle">어느 행동 앞에서 멈추는가</text>
  <line x1="280" y1="85" x2="306" y2="85" stroke="#444444" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 2단계 -->
  <rect x="312" y="50" width="256" height="70" rx="6" fill="#f8efe0" stroke="#b45309" stroke-width="1.5"/>
  <text x="440" y="78" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">② 승인자 교육·승인 감사</text>
  <text x="440" y="100" font-size="13" fill="#444444" text-anchor="middle">승인이 형식이 되지 않게</text>
  <line x1="568" y1="85" x2="594" y2="85" stroke="#444444" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 3단계 -->
  <rect x="600" y="50" width="256" height="70" rx="6" fill="#e8eef6" stroke="#35618f" stroke-width="1.5"/>
  <text x="728" y="78" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">③ 자동 감시로 보완</text>
  <text x="728" y="100" font-size="13" fill="#444444" text-anchor="middle">사람이 못 보는 속도를 메운다</text>

  <!-- 1단계 세부: 승인 지점 기준 4가지 -->
  <text x="24" y="152" font-size="13" font-weight="bold" fill="#2d6a4f">승인 지점 기준 4가지</text>
  <rect x="24" y="162" width="256" height="44" rx="4" fill="#ffffff" stroke="#9d0208" stroke-width="1.5"/>
  <text x="36" y="189" font-size="13" fill="#1b1b1b">고위험 행동·결정 (민감 데이터 수정)</text>
  <rect x="24" y="212" width="256" height="44" rx="4" fill="#ffffff" stroke="#9d0208" stroke-width="1.5"/>
  <text x="36" y="239" font-size="13" fill="#1b1b1b">되돌릴 수 없는 행동 (삭제·발송·결제)</text>
  <rect x="24" y="262" width="256" height="44" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="36" y="289" font-size="13" fill="#1b1b1b">이상·비정형 행동 (업무 범위 밖 접근)</text>
  <rect x="24" y="312" width="256" height="44" rx="4" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
  <text x="36" y="339" font-size="13" fill="#1b1b1b">사용자 정의 (일정 금액 넘는 구매)</text>

  <!-- 2단계 세부 -->
  <text x="312" y="152" font-size="13" font-weight="bold" fill="#b45309">감독의 실효성을 재는 지표</text>
  <text x="312" y="180" font-size="13" fill="#1b1b1b">· 사람이 거부·수정한 비율</text>
  <text x="326" y="199" font-size="13" fill="#555555">낮으면 습관적 승인을 의심</text>
  <text x="312" y="226" font-size="13" fill="#1b1b1b">· 검토 응답 시간</text>
  <text x="326" y="245" font-size="13" fill="#555555">짧으면 자동화 편향·피로를 의심</text>
  <text x="312" y="272" font-size="13" fill="#1b1b1b">· 판단 양상이 튀는 승인자</text>
  <text x="312" y="306" font-size="13" fill="#1b1b1b">· 에이전트 실패 양상 교육</text>
  <text x="312" y="333" font-size="13" fill="#1b1b1b">· 평가할 도메인 지식 확보</text>

  <!-- 3단계 세부 -->
  <text x="600" y="152" font-size="13" font-weight="bold" fill="#35618f">자동 감시 수단</text>
  <text x="600" y="180" font-size="13" fill="#1b1b1b">· 기록 이벤트에 경보</text>
  <text x="614" y="199" font-size="13" fill="#555555">무단 접근 시도, 도구 호출 반복 실패</text>
  <text x="600" y="226" font-size="13" fill="#1b1b1b">· 이상 궤적 탐지</text>
  <text x="600" y="253" font-size="13" fill="#1b1b1b">· 에이전트가 에이전트를 감시</text>
  <text x="600" y="280" font-size="13" fill="#9d0208">· 승인 체계가 멈추면 기본 거부</text>
  <text x="614" y="299" font-size="13" fill="#555555">승인자 부재, 정책 없는 새 행동</text>

  <text x="24" y="392" font-size="13" fill="#555555">세 단계는 순서대로 쌓인다. 지점만 정하고 ②·③이 없으면 승인 요청이 늘수록 승인이 형식으로 바뀐다.</text>
</svg>
