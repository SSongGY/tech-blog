<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="캐시 없이 재계산할 때와 KV 캐시를 재사용할 때 계산되는 키·값 칸의 수 비교">
  <rect x="0" y="0" width="880" height="400" fill="#fbfbf8"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a52"/>
    </marker>
  </defs>

  <text x="30" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1a1a18">같은 3스텝을 돌렸을 때 실제로 계산되는 키·값 칸</text>

  <line x1="445" y1="56" x2="445" y2="344" stroke="#cfcfc6" stroke-width="1"/>

  <text x="30" y="80" font-family="sans-serif" font-size="14" font-weight="bold" fill="#9d0208">① 캐시 없음 — 스텝마다 전부 다시 계산</text>
  <text x="462" y="80" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d6a4f">② KV 캐시 — 새 토큰 1칸만 계산</text>

  <!-- 왼쪽: 재계산 -->
  <text x="30" y="135" font-family="sans-serif" font-size="13" fill="#3a3a34">스텝 1</text>
  <rect x="100" y="110" width="58" height="42" rx="4" fill="#f8dcdc" stroke="#9d0208" stroke-width="1.5"/>
  <text x="129" y="136" font-family="sans-serif" font-size="13" fill="#5c0205" text-anchor="middle">k₁v₁</text>

  <text x="30" y="195" font-family="sans-serif" font-size="13" fill="#3a3a34">스텝 2</text>
  <rect x="100" y="170" width="58" height="42" rx="4" fill="#f8dcdc" stroke="#9d0208" stroke-width="1.5"/>
  <text x="129" y="196" font-family="sans-serif" font-size="13" fill="#5c0205" text-anchor="middle">k₁v₁</text>
  <rect x="168" y="170" width="58" height="42" rx="4" fill="#f8dcdc" stroke="#9d0208" stroke-width="1.5"/>
  <text x="197" y="196" font-family="sans-serif" font-size="13" fill="#5c0205" text-anchor="middle">k₂v₂</text>

  <text x="30" y="255" font-family="sans-serif" font-size="13" fill="#3a3a34">스텝 3</text>
  <rect x="100" y="230" width="58" height="42" rx="4" fill="#f8dcdc" stroke="#9d0208" stroke-width="1.5"/>
  <text x="129" y="256" font-family="sans-serif" font-size="13" fill="#5c0205" text-anchor="middle">k₁v₁</text>
  <rect x="168" y="230" width="58" height="42" rx="4" fill="#f8dcdc" stroke="#9d0208" stroke-width="1.5"/>
  <text x="197" y="256" font-family="sans-serif" font-size="13" fill="#5c0205" text-anchor="middle">k₂v₂</text>
  <rect x="236" y="230" width="58" height="42" rx="4" fill="#f8dcdc" stroke="#9d0208" stroke-width="1.5"/>
  <text x="265" y="256" font-family="sans-serif" font-size="13" fill="#5c0205" text-anchor="middle">k₃v₃</text>

  <text x="30" y="300" font-family="sans-serif" font-size="13" fill="#9d0208">계산한 칸 1 + 2 + 3 = 6칸</text>
  <text x="30" y="322" font-family="sans-serif" font-size="13" fill="#3a3a34">저장해 두는 칸 없음</text>

  <!-- 오른쪽: 캐시 재사용 -->
  <text x="462" y="135" font-family="sans-serif" font-size="13" fill="#3a3a34">스텝 1</text>
  <rect x="532" y="110" width="58" height="42" rx="4" fill="#dff0e6" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="561" y="136" font-family="sans-serif" font-size="13" fill="#1d4733" text-anchor="middle">k₁v₁</text>

  <text x="462" y="195" font-family="sans-serif" font-size="13" fill="#3a3a34">스텝 2</text>
  <rect x="532" y="170" width="58" height="42" rx="4" fill="#eaeae4" stroke="#8a8a80" stroke-width="1.5"/>
  <text x="561" y="196" font-family="sans-serif" font-size="13" fill="#55554c" text-anchor="middle">k₁v₁</text>
  <rect x="600" y="170" width="58" height="42" rx="4" fill="#dff0e6" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="629" y="196" font-family="sans-serif" font-size="13" fill="#1d4733" text-anchor="middle">k₂v₂</text>

  <text x="462" y="255" font-family="sans-serif" font-size="13" fill="#3a3a34">스텝 3</text>
  <rect x="532" y="230" width="58" height="42" rx="4" fill="#eaeae4" stroke="#8a8a80" stroke-width="1.5"/>
  <text x="561" y="256" font-family="sans-serif" font-size="13" fill="#55554c" text-anchor="middle">k₁v₁</text>
  <rect x="600" y="230" width="58" height="42" rx="4" fill="#eaeae4" stroke="#8a8a80" stroke-width="1.5"/>
  <text x="629" y="256" font-family="sans-serif" font-size="13" fill="#55554c" text-anchor="middle">k₂v₂</text>
  <rect x="668" y="230" width="58" height="42" rx="4" fill="#dff0e6" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="697" y="256" font-family="sans-serif" font-size="13" fill="#1d4733" text-anchor="middle">k₃v₃</text>

  <line x1="561" y1="156" x2="561" y2="166" stroke="#5a5a52" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="561" y1="216" x2="561" y2="226" stroke="#5a5a52" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="629" y1="216" x2="629" y2="226" stroke="#5a5a52" stroke-width="1.2" marker-end="url(#arrow)"/>

  <text x="462" y="300" font-family="sans-serif" font-size="13" fill="#2d6a4f">계산한 칸 1 + 1 + 1 = 3칸</text>
  <text x="462" y="322" font-family="sans-serif" font-size="13" fill="#b45309">저장해 두는 칸 3칸 — 스텝마다 1칸씩 쌓인다</text>

  <text x="30" y="368" font-family="sans-serif" font-size="13" fill="#3a3a34">초록 = 이번 스텝에 새로 계산한 칸 · 회색 = 캐시에서 읽어 쓴 칸 · 붉은색 = 이미 계산했는데 또 계산한 칸</text>
  <text x="30" y="390" font-family="sans-serif" font-size="13" fill="#3a3a34">스텝이 t개면 ①은 t(t+1)/2칸을 계산하고, ②는 t칸만 계산하는 대신 캐시에 t칸이 남는다.</text>
</svg>
