<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <text x="440" y="30" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">에이전트 = 모델 + 하네스 — 행동 전에 조종하고, 행동 뒤에 관측한다</text>

  <!-- 사람 -->
  <rect x="290" y="48" width="300" height="50" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/>
  <text x="440" y="70" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">사람 (조종)</text>
  <text x="440" y="89" font-size="13" text-anchor="middle" fill="#4b5563">같은 문제가 반복되면 하네스를 고친다</text>

  <!-- 하네스 테두리 -->
  <rect x="20" y="118" width="840" height="360" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="260" y="142" font-size="13" fill="#4b5563">하네스 (harness) — 모델을 뺀 나머지 전부</text>

  <!-- 가이드 -->
  <rect x="40" y="170" width="200" height="96" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="140" y="196" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">가이드</text>
  <text x="140" y="216" font-size="13" text-anchor="middle" fill="#4b5563">피드포워드 — 행동 전</text>
  <text x="140" y="238" font-size="13" text-anchor="middle" fill="#4b5563">규칙 문서 · 스킬</text>
  <text x="140" y="256" font-size="13" text-anchor="middle" fill="#4b5563">코드 변환 도구</text>

  <!-- 모델 -->
  <rect x="340" y="186" width="200" height="64" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="440" y="214" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">모델</text>
  <text x="440" y="236" font-size="13" text-anchor="middle" fill="#4b5563">추론 · 도구 호출</text>

  <!-- 행동 결과 -->
  <rect x="640" y="186" width="200" height="64" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="740" y="214" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">행동 결과</text>
  <text x="740" y="236" font-size="13" text-anchor="middle" fill="#4b5563">코드 변경 · 명령 실행</text>

  <!-- 센서 두 종류 -->
  <rect x="640" y="296" width="200" height="56" rx="8" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="740" y="320" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">계산형 센서</text>
  <text x="740" y="340" font-size="13" text-anchor="middle" fill="#2d6a4f">테스트 · 린터 — 결정적</text>

  <rect x="400" y="296" width="200" height="56" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/>
  <text x="500" y="320" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">추론형 센서</text>
  <text x="500" y="340" font-size="13" text-anchor="middle" fill="#b45309">AI 리뷰 — 비결정적</text>

  <!-- 세션 밖 상태 -->
  <rect x="40" y="390" width="360" height="64" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="220" y="416" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">세션 밖 상태</text>
  <text x="220" y="438" font-size="13" text-anchor="middle" fill="#4b5563">진행 기록 · 기능 목록 · git 커밋</text>

  <!-- 화살표 -->
  <g stroke="#374151" stroke-width="1.8" fill="none">
    <line x1="240" y1="218" x2="338" y2="218" marker-end="url(#arr)"/>
    <line x1="540" y1="218" x2="638" y2="218" marker-end="url(#arr)"/>
    <line x1="740" y1="250" x2="740" y2="294" marker-end="url(#arr)"/>
    <path d="M700,250 V272 H500 V294" marker-end="url(#arr)"/>
    <line x1="370" y1="254" x2="370" y2="386" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>
  <path d="M740,352 V378 H440 V254" fill="none" stroke="#2d6a4f" stroke-width="2.2" marker-end="url(#arrg)"/>
  <line x1="500" y1="352" x2="500" y2="376" stroke="#b45309" stroke-width="1.8"/>
  <g stroke="#b45309" stroke-width="1.6" fill="none" stroke-dasharray="5 4">
    <path d="M290,74 H140 V168" marker-end="url(#arro)"/>
    <path d="M590,74 H870 V324 H842" marker-end="url(#arro)"/>
  </g>

  <!-- 라벨 -->
  <g font-size="13" fill="#111827">
    <text x="250" y="208">조종</text>
    <text x="556" y="208">행동</text>
    <text x="520" y="398" fill="#2d6a4f">피드백 — 모델이 스스로 고친다</text>
    <text x="250" y="330">읽고 · 남긴다</text>
  </g>
</svg>
