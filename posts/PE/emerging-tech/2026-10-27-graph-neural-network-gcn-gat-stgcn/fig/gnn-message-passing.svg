<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fbfbf9"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6a4f"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>

  <text x="24" y="38" font-size="17" font-weight="bold" fill="#1b2a24">메시지 전달 한 단계 — 집계 → 갱신 → 읽기</text>
  <text x="24" y="58" font-size="13" fill="#555555">초록 화살표가 한 층에서 정보가 흐르는 주 경로다</text>

  <!-- neighbourhood -->
  <rect x="20" y="70" width="220" height="195" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="32" y="90" font-size="13" fill="#555555">이웃 N(v)</text>

  <circle cx="62" cy="120" r="18" fill="#e8f0ec" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="62" y="125" font-size="14" fill="#1b2a24" text-anchor="middle">w1</text>
  <circle cx="62" cy="175" r="18" fill="#e8f0ec" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="62" y="180" font-size="14" fill="#1b2a24" text-anchor="middle">w2</text>
  <circle cx="62" cy="230" r="18" fill="#e8f0ec" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="62" y="235" font-size="14" fill="#1b2a24" text-anchor="middle">w3</text>

  <circle cx="168" cy="175" r="27" fill="#ffffff" stroke="#2d6a4f" stroke-width="2.2"/>
  <text x="168" y="181" font-size="16" font-weight="bold" fill="#1b2a24" text-anchor="middle">v</text>

  <line x1="82" y1="128" x2="142" y2="162" stroke="#2d6a4f" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="82" y1="175" x2="137" y2="175" stroke="#2d6a4f" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="82" y1="222" x2="142" y2="188" stroke="#2d6a4f" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- aggregate -->
  <line x1="197" y1="175" x2="258" y2="175" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="265" y="140" width="240" height="70" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
  <text x="385" y="166" font-size="14" font-weight="bold" fill="#1b2a24" text-anchor="middle">① 집계</text>
  <text x="385" y="191" font-size="14" fill="#333333" text-anchor="middle">m_v = Σ M(h_v, h_w, e_vw)</text>

  <!-- update -->
  <line x1="505" y1="175" x2="528" y2="175" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="535" y="140" width="165" height="70" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
  <text x="617" y="166" font-size="14" font-weight="bold" fill="#1b2a24" text-anchor="middle">② 갱신</text>
  <text x="617" y="191" font-size="14" fill="#333333" text-anchor="middle">h_v ← U(h_v, m_v)</text>

  <!-- readout -->
  <line x1="700" y1="175" x2="718" y2="175" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="725" y="140" width="135" height="70" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
  <text x="792" y="166" font-size="14" font-weight="bold" fill="#1b2a24" text-anchor="middle">③ 읽기</text>
  <text x="792" y="191" font-size="14" fill="#333333" text-anchor="middle">ŷ = R({h_v})</text>

  <!-- repeat loop -->
  <path d="M 617 210 L 617 243 L 385 243 L 385 212" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="501" y="262" font-size="13" fill="#2d6a4f" text-anchor="middle">T번 반복하면 T홉 떨어진 이웃까지 닿는다</text>

  <!-- bottom: who decides the weight -->
  <text x="24" y="315" font-size="15" font-weight="bold" fill="#1b2a24">① 의 이웃 가중치를 무엇이 정하는가</text>

  <rect x="20" y="330" width="270" height="118" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
  <text x="36" y="356" font-size="14" font-weight="bold" fill="#1b2a24">GCN — 구조가 정한다</text>
  <text x="36" y="381" font-size="13" fill="#333333">Ã = A + I 의 차수로 정규화</text>
  <text x="36" y="403" font-size="13" fill="#333333">D̃^(-1/2) Ã D̃^(-1/2) H W</text>
  <text x="36" y="430" font-size="13" fill="#555555">학습 파라미터는 층별 W 뿐</text>

  <rect x="305" y="330" width="270" height="118" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
  <text x="321" y="356" font-size="14" font-weight="bold" fill="#1b2a24">GAT — 학습이 정한다</text>
  <text x="321" y="381" font-size="13" fill="#333333">e_ij = a(W h_i, W h_j) 를 이웃만</text>
  <text x="321" y="403" font-size="13" fill="#333333">소프트맥스로 정규화해 α_ij</text>
  <text x="321" y="430" font-size="13" fill="#555555">헤드 수만큼 파라미터가 늘어난다</text>

  <rect x="590" y="330" width="270" height="118" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
  <text x="606" y="356" font-size="14" font-weight="bold" fill="#1b2a24">STGCN — 시간축을 덧댄다</text>
  <text x="606" y="381" font-size="13" fill="#333333">시간 게이트 합성곱 Γ0</text>
  <text x="606" y="403" font-size="13" fill="#333333">→ 그래프 합성곱 Θ → Γ1</text>
  <text x="606" y="430" font-size="13" fill="#555555">한 블록이 샌드위치 구조</text>
</svg>
