<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>

  <text x="440" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">합의 3방식 — 누가 블록을 내고, 언제 확정되는가</text>

  <!-- 머리 -->
  <text x="160" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">PoW (비트코인)</text>
  <text x="440" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">PoS (이더리움)</text>
  <text x="720" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">PBFT</text>

  <!-- PoW -->
  <rect x="30" y="86" width="260" height="70" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="160" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">① 해시 퍼즐 경쟁</text>
  <text x="160" y="136" text-anchor="middle" font-size="13" fill="#1b1b1b">먼저 푼 노드가 블록을 낸다</text>

  <rect x="30" y="186" width="260" height="70" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="160" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">② 가장 긴 체인을 채택</text>
  <text x="160" y="236" text-anchor="middle" font-size="13" fill="#1b1b1b">갈라지면 다음 블록에서 정리</text>

  <rect x="30" y="286" width="260" height="70" rx="6" fill="#fff3cd" stroke="#b45309" stroke-width="1.5"/>
  <text x="160" y="314" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">③ 확률적 최종성</text>
  <text x="160" y="336" text-anchor="middle" font-size="13" fill="#1b1b1b">쌓인 블록 수만큼 뒤집힐 확률↓</text>

  <line x1="160" y1="156" x2="160" y2="178" stroke="#495057" stroke-width="1.5"/>
  <polygon points="155,178 160,186 165,178" fill="#495057"/>
  <line x1="160" y1="256" x2="160" y2="278" stroke="#495057" stroke-width="1.5"/>
  <polygon points="155,278 160,286 165,278" fill="#495057"/>

  <!-- PoS -->
  <rect x="310" y="86" width="260" height="70" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="440" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">① 슬롯마다 무작위 제안자</text>
  <text x="440" y="136" text-anchor="middle" font-size="13" fill="#1b1b1b">지분을 예치한 검증자 중에서</text>

  <rect x="310" y="186" width="260" height="70" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="440" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">② 위원회가 증명 투표</text>
  <text x="440" y="236" text-anchor="middle" font-size="13" fill="#1b1b1b">에포크 경계 체크포인트에 표를 모은다</text>

  <rect x="310" y="286" width="260" height="70" rx="6" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="440" y="314" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">③ 지분 2/3 → 확정</text>
  <text x="440" y="336" text-anchor="middle" font-size="13" fill="#1b1b1b">되돌리려면 지분 1/3 이상을 잃는다</text>

  <line x1="440" y1="156" x2="440" y2="178" stroke="#495057" stroke-width="1.5"/>
  <polygon points="435,178 440,186 445,178" fill="#495057"/>
  <line x1="440" y1="256" x2="440" y2="278" stroke="#495057" stroke-width="1.5"/>
  <polygon points="435,278 440,286 445,278" fill="#495057"/>

  <!-- PBFT -->
  <rect x="590" y="86" width="260" height="70" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="720" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">① pre-prepare</text>
  <text x="720" y="136" text-anchor="middle" font-size="13" fill="#1b1b1b">주 복제본이 요청에 순번을 준다</text>

  <rect x="590" y="186" width="260" height="70" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="720" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">② prepare 2f · commit 2f+1</text>
  <text x="720" y="236" text-anchor="middle" font-size="13" fill="#1b1b1b">복제본끼리 서로 전부에게 보낸다</text>

  <rect x="590" y="286" width="260" height="70" rx="6" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="720" y="314" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">③ 즉시 확정</text>
  <text x="720" y="336" text-anchor="middle" font-size="13" fill="#1b1b1b">n = 3f+1 이면 f개 장애를 견딘다</text>

  <line x1="720" y1="156" x2="720" y2="178" stroke="#495057" stroke-width="1.5"/>
  <polygon points="715,178 720,186 725,178" fill="#495057"/>
  <line x1="720" y1="256" x2="720" y2="278" stroke="#495057" stroke-width="1.5"/>
  <polygon points="715,278 720,286 725,278" fill="#495057"/>

  <!-- 참여 -->
  <text x="30" y="392" font-size="14" font-weight="bold" fill="#495057">참여</text>
  <text x="112" y="392" font-size="13" fill="#1b1b1b">누구나 (무허가형)</text>
  <text x="440" y="392" text-anchor="middle" font-size="13" fill="#1b1b1b">지분을 예치하면 누구나 (무허가형)</text>
  <text x="720" y="392" text-anchor="middle" font-size="13" fill="#1b1b1b">정해진 복제본 집합 (허가형)</text>

  <text x="30" y="420" font-size="14" font-weight="bold" fill="#495057">시빌 방어</text>
  <text x="112" y="420" font-size="13" fill="#1b1b1b">계산 자원 (하드웨어·전력)</text>
  <text x="440" y="420" text-anchor="middle" font-size="13" fill="#1b1b1b">예치한 지분</text>
  <text x="720" y="420" text-anchor="middle" font-size="13" fill="#1b1b1b">참여자 신원을 미리 안다</text>

  <text x="30" y="454" font-size="13" fill="#495057">③의 색: 주황 = 뒤집힐 확률이 0 이 되지 않는다, 초록 = 정해진 조건을 넘으면 되돌리지 않는다.</text>
</svg>
