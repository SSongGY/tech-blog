<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fbfbf8"/>

  <defs>
    <marker id="both" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6a4f"/>
    </marker>
  </defs>

  <text x="40" y="30" font-size="16" font-weight="bold" fill="#1b1b1b">ISO 23247 디지털 트윈 참조 모델 — 4개 도메인과 그 안의 엔티티</text>

  <!-- 사용자 도메인 -->
  <rect x="40" y="55" width="580" height="66" rx="5" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="56" y="78" font-size="14" font-weight="bold" fill="#1b1b1b">① 사용자 도메인 — 사용자 엔티티</text>
  <text x="56" y="100" font-size="13" fill="#333">ERP·PLM·모니터링 응용. 세션 시작에 트윈을 채우고 끝에 최종값을 보관한다.</text>
  <text x="56" y="116" font-size="13" fill="#333">사용자 인터페이스 FE 1개가 디지털 트윈 엔티티와 맞붙는다.</text>

  <line x1="120" y1="121" x2="120" y2="153" stroke="#2d6a4f" stroke-width="1.8" marker-start="url(#both)" marker-end="url(#both)"/>
  <text x="138" y="142" font-size="13" fill="#2d6a4f">서비스 호출 ↕ 트윈 값 조회</text>

  <!-- 디지털 트윈 도메인 -->
  <rect x="40" y="155" width="580" height="88" rx="5" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="56" y="178" font-size="14" font-weight="bold" fill="#1b1b1b">② 디지털 트윈 도메인 — 디지털 트윈 엔티티 (하위 엔티티 3개)</text>
  <text x="56" y="200" font-size="13" fill="#333">가. 운영·관리 — 동기화, 표현, 디지털 표상, 유지보수 (FE 4개)</text>
  <text x="56" y="218" font-size="13" fill="#333">나. 응용·서비스 — 시뮬레이션, 분석, 보고, 응용 지원 (FE 4개)</text>
  <text x="56" y="236" font-size="13" fill="#333">다. 자원 접근·교환 — 상호운용, 접근 제어, 플러그앤플레이, 피어 (FE 4개)</text>

  <line x1="120" y1="243" x2="120" y2="275" stroke="#2d6a4f" stroke-width="1.8" marker-start="url(#both)" marker-end="url(#both)"/>
  <text x="138" y="264" font-size="13" fill="#2d6a4f">동기화 값 ↑ / 제어 요청 ↓</text>

  <!-- 장치 통신 도메인 -->
  <rect x="40" y="277" width="580" height="70" rx="5" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="56" y="300" font-size="14" font-weight="bold" fill="#1b1b1b">③ 장치 통신 도메인 — 장치 통신 엔티티 (하위 엔티티 2개)</text>
  <text x="56" y="322" font-size="13" fill="#333">가. 데이터 수집 — 수집, 전처리, 수집 식별 (FE 3개)</text>
  <text x="56" y="340" font-size="13" fill="#333">나. 장치 제어 — 제어, 작동, 제어 식별 (FE 3개)</text>

  <line x1="120" y1="347" x2="120" y2="379" stroke="#2d6a4f" stroke-width="1.8" marker-start="url(#both)" marker-end="url(#both)"/>
  <text x="138" y="368" font-size="13" fill="#2d6a4f">센서 데이터 ↑ / 작동 명령 ↓</text>

  <!-- 관측 가능 제조 도메인 -->
  <rect x="40" y="381" width="580" height="66" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="56" y="404" font-size="14" font-weight="bold" fill="#4b5563">④ 관측 가능 제조 도메인 — 프레임워크 경계 밖</text>
  <text x="56" y="426" font-size="13" fill="#4b5563">OME 8종: 인원 · 설비 · 자재 · 공정 · 시설 · 환경 · 제품 · 지원 문서</text>

  <!-- 교차 시스템 엔티티 -->
  <rect x="648" y="55" width="192" height="392" rx="5" fill="#fdf3e4" stroke="#b45309" stroke-width="1.8"/>
  <text x="664" y="80" font-size="14" font-weight="bold" fill="#1b1b1b">교차 시스템 엔티티</text>
  <text x="664" y="106" font-size="13" fill="#333">도메인을 가로질러</text>
  <text x="664" y="124" font-size="13" fill="#333">공통 기능을 제공한다</text>
  <text x="664" y="156" font-size="13" fill="#333">· 데이터 보증 FE</text>
  <text x="664" y="178" font-size="13" fill="#333">· 보안 지원 FE</text>
  <text x="664" y="200" font-size="13" fill="#333">· 데이터 변환 FE</text>
  <text x="664" y="232" font-size="13" fill="#b45309">프로토콜 변환과</text>
  <text x="664" y="250" font-size="13" fill="#b45309">의미 해석이 여기에</text>
  <text x="664" y="268" font-size="13" fill="#b45309">모인다</text>
</svg>
