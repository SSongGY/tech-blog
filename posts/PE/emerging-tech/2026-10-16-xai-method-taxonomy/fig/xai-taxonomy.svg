<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 404" width="880" height="404"
     font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="404" fill="#fbfaf7"/>

  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2933">설명가능 AI 기법의 두 갈래와 설명 정확도</text>

  <!-- 뿌리 -->
  <rect x="330" y="46" width="220" height="38" rx="4" fill="#eef2f6" stroke="#3f4a56" stroke-width="1.6"/>
  <text x="440" y="70" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f2933">설명가능 AI 기법 (XAI)</text>

  <path d="M440 84 L440 100 L230 100 L230 116" fill="none" stroke="#3f4a56" stroke-width="1.4"/>
  <path d="M440 84 L440 100 L650 100 L650 116" fill="none" stroke="#3f4a56" stroke-width="1.4"/>

  <!-- 왼쪽: 내재적 -->
  <rect x="60" y="116" width="340" height="40" rx="4" fill="#e6f1ea" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="230" y="142" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1b4332">① 내재적 해석 가능 모델</text>
  <text x="76" y="180" font-size="13" fill="#344055">모델 자체가 설명이다. 전역·지역 설명을</text>
  <text x="76" y="200" font-size="13" fill="#344055">따로 만들지 않아도 둘 다 나온다.</text>
  <text x="76" y="226" font-size="13" fill="#52606d">결정트리 · 회귀 · 결정 리스트 · 결정 집합</text>
  <text x="76" y="246" font-size="13" fill="#52606d">베이지안 규칙 리스트 · 프로토타입</text>

  <!-- 오른쪽: 사후 -->
  <rect x="460" y="116" width="380" height="40" rx="4" fill="#fdf3e3" stroke="#b45309" stroke-width="1.6"/>
  <text x="650" y="142" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3d09">② 사후 설명</text>

  <path d="M650 156 L650 168 L545 168 L545 180" fill="none" stroke="#b45309" stroke-width="1.3"/>
  <path d="M650 156 L650 168 L755 168 L755 180" fill="none" stroke="#b45309" stroke-width="1.3"/>

  <rect x="460" y="180" width="170" height="36" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/>
  <text x="545" y="203" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7c3d09">지역 설명</text>
  <rect x="670" y="180" width="170" height="36" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/>
  <text x="755" y="203" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7c3d09">전역 설명</text>

  <text x="462" y="240" font-size="13" fill="#344055">판정 한 건을 설명</text>
  <text x="462" y="262" font-size="13" fill="#52606d">LIME · SHAP · 반사실</text>
  <text x="672" y="240" font-size="13" fill="#344055">모델 전체를 근사</text>
  <text x="672" y="262" font-size="13" fill="#52606d">PDP · ICE · TCAV</text>

  <!-- 설명 정확도 띠 -->
  <line x1="60" y1="292" x2="840" y2="292" stroke="#cbd2d9" stroke-width="1"/>
  <text x="60" y="318" font-size="13.5" font-weight="bold" fill="#1f2933">설명 정확도(fidelity) — 설명이 시스템의 실제 처리 과정을 반영하는가</text>

  <rect x="60" y="330" width="340" height="52" rx="4" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="76" y="352" font-size="13" fill="#1b4332">설명과 모델이 같은 것이므로</text>
  <text x="76" y="372" font-size="13" fill="#1b4332">정확도를 따로 물을 필요가 없다</text>

  <rect x="460" y="330" width="380" height="52" rx="4" fill="#ffffff" stroke="#9d0208" stroke-width="1.5"/>
  <text x="476" y="352" font-size="13" fill="#9d0208">원 모델의 근사이므로 어긋날 수 있다 —</text>
  <text x="476" y="372" font-size="13" fill="#9d0208">충실도를 별도 지표로 측정해야 한다</text>
</svg>
