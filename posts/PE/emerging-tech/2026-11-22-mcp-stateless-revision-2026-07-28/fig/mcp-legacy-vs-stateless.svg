<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9d0208"/>
    </marker>
  </defs>

  <text x="440" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#222222">MCP 연결 방식 — 레거시(2025-11-25 이전)와 무상태(2026-07-28)</text>

  <!-- 왼쪽: 레거시 -->
  <text x="215" y="56" text-anchor="middle" font-size="15" font-weight="bold" fill="#9d0208">레거시 — 세션 3단계</text>
  <rect x="40" y="68" width="110" height="34" rx="6" fill="#eef2f7" stroke="#4a5568"/>
  <text x="95" y="90" text-anchor="middle" font-size="14" fill="#222222">클라이언트</text>
  <rect x="280" y="68" width="110" height="34" rx="6" fill="#eef2f7" stroke="#4a5568"/>
  <text x="335" y="90" text-anchor="middle" font-size="14" fill="#222222">서버</text>
  <line x1="95" y1="102" x2="95" y2="470" stroke="#999999" stroke-dasharray="4,4"/>
  <line x1="335" y1="102" x2="335" y2="470" stroke="#999999" stroke-dasharray="4,4"/>

  <text x="20" y="132" font-size="13" fill="#555555">①</text>
  <line x1="97" y1="136" x2="331" y2="136" stroke="#333333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="215" y="129" text-anchor="middle" font-size="13" fill="#222222">initialize (버전·능력·clientInfo)</text>
  <line x1="333" y1="166" x2="99" y2="166" stroke="#333333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="215" y="159" text-anchor="middle" font-size="13" fill="#222222">결과 (합의 버전·능력·serverInfo)</text>
  <line x1="97" y1="196" x2="331" y2="196" stroke="#333333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="215" y="189" text-anchor="middle" font-size="13" fill="#222222">notifications/initialized</text>

  <text x="20" y="242" font-size="13" fill="#555555">②</text>
  <line x1="97" y1="246" x2="331" y2="246" stroke="#333333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="215" y="239" text-anchor="middle" font-size="13" fill="#222222">tools/call + Mcp-Session-Id</text>
  <line x1="333" y1="290" x2="99" y2="290" stroke="#9d0208" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="215" y="276" text-anchor="middle" font-size="13" fill="#9d0208">서버가 먼저 요청 보냄</text>
  <text x="215" y="306" text-anchor="middle" font-size="13" fill="#9d0208">elicitation/create · sampling (GET SSE)</text>
  <line x1="97" y1="336" x2="331" y2="336" stroke="#333333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="215" y="329" text-anchor="middle" font-size="13" fill="#222222">그 요청의 응답</text>
  <line x1="333" y1="366" x2="99" y2="366" stroke="#333333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="215" y="359" text-anchor="middle" font-size="13" fill="#222222">tools/call 결과</text>

  <text x="20" y="412" font-size="13" fill="#555555">③</text>
  <text x="215" y="412" text-anchor="middle" font-size="13" fill="#222222">종료 — 연결을 닫는다</text>
  <rect x="40" y="484" width="350" height="56" rx="6" fill="#fdf2f2" stroke="#9d0208"/>
  <text x="215" y="506" text-anchor="middle" font-size="13" fill="#9d0208">서버가 세션별 상태를 기억한다</text>
  <text x="215" y="526" text-anchor="middle" font-size="13" fill="#9d0208">같은 서버 인스턴스로 다시 와야 한다</text>

  <!-- 오른쪽: 무상태 -->
  <text x="665" y="56" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d6a4f">무상태 — 요청마다 완결</text>
  <rect x="490" y="68" width="110" height="34" rx="6" fill="#eef2f7" stroke="#4a5568"/>
  <text x="545" y="90" text-anchor="middle" font-size="14" fill="#222222">클라이언트</text>
  <rect x="730" y="68" width="110" height="34" rx="6" fill="#eef2f7" stroke="#4a5568"/>
  <text x="785" y="90" text-anchor="middle" font-size="14" fill="#222222">서버</text>
  <line x1="545" y1="102" x2="545" y2="470" stroke="#999999" stroke-dasharray="4,4"/>
  <line x1="785" y1="102" x2="785" y2="470" stroke="#999999" stroke-dasharray="4,4"/>

  <line x1="547" y1="136" x2="781" y2="136" stroke="#2d6a4f" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ag)"/>
  <text x="665" y="129" text-anchor="middle" font-size="13" fill="#222222">server/discover (선택)</text>
  <line x1="783" y1="166" x2="549" y2="166" stroke="#2d6a4f" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ag)"/>
  <text x="665" y="159" text-anchor="middle" font-size="13" fill="#222222">지원 버전·능력·serverInfo</text>

  <line x1="547" y1="226" x2="781" y2="226" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="665" y="200"text-anchor="middle" font-size="13" fill="#222222">tools/call</text>
  <text x="665" y="219" text-anchor="middle" font-size="13" fill="#2d6a4f">_meta: 버전·클라이언트 능력</text>
  <line x1="783" y1="276" x2="549" y2="276" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="665" y="250"text-anchor="middle" font-size="13" fill="#222222">resultType: input_required</text>
  <text x="665" y="269" text-anchor="middle" font-size="13" fill="#2d6a4f">inputRequests + requestState</text>
  <line x1="547" y1="326" x2="781" y2="326" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="665" y="300"text-anchor="middle" font-size="13" fill="#222222">같은 tools/call 재요청 (새 id)</text>
  <text x="665" y="319" text-anchor="middle" font-size="13" fill="#2d6a4f">inputResponses + requestState</text>
  <line x1="783" y1="366" x2="549" y2="366" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="665" y="359" text-anchor="middle" font-size="13" fill="#222222">resultType: complete</text>
  <text x="665" y="412" text-anchor="middle" font-size="13" fill="#222222">종료 절차 없음 — 연결은 운반 수단일 뿐</text>

  <rect x="490" y="484" width="350" height="56" rx="6" fill="#edf7f1" stroke="#2d6a4f"/>
  <text x="665" y="506" text-anchor="middle" font-size="13" fill="#2d6a4f">요청을 넘는 상태는 클라이언트가 들고 다닌다</text>
  <text x="665" y="526" text-anchor="middle" font-size="13" fill="#2d6a4f">어느 서버 인스턴스가 받아도 처리된다</text>

  <line x1="440" y1="46" x2="440" y2="540" stroke="#cccccc"/>
</svg>
