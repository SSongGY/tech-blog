<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="480" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f"/>
    </marker>
  </defs>
  <text x="440" y="34" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">컨텍스트 엔지니어링 — 창에 무엇을 넣고 무엇을 뺄 것인가</text>

  <!-- 컨텍스트 창 -->
  <rect x="270" y="60" width="340" height="300" rx="10" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
  <text x="440" y="84" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">컨텍스트 창 — 이번 호출의 토큰 전부</text>

  <rect x="290" y="100" width="145" height="50" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="362" y="130" font-size="14" text-anchor="middle" fill="#111827">시스템 프롬프트</text>
  <rect x="455" y="100" width="145" height="50" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="527" y="130" font-size="14" text-anchor="middle" fill="#111827">도구 정의</text>
  <rect x="290" y="170" width="145" height="50" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="362" y="200" font-size="14" text-anchor="middle" fill="#111827">예시</text>
  <rect x="455" y="170" width="145" height="50" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="527" y="192" font-size="14" text-anchor="middle" fill="#111827">메시지 이력</text>
  <text x="527" y="210" font-size="13" text-anchor="middle" fill="#4b5563">도구 결과 포함</text>

  <!-- 압축 -->
  <line x1="527" y1="220" x2="527" y2="268" stroke="#2d6a4f" stroke-width="1.8" marker-end="url(#arrg)"/>
  <text x="537" y="250" font-size="13" font-weight="bold" fill="#2d6a4f">③ 압축</text>
  <rect x="455" y="270" width="145" height="40" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="527" y="295" font-size="13" text-anchor="middle" fill="#2d6a4f">요약 · 결과 정리</text>
  <text x="440" y="342" font-size="13" text-anchor="middle" fill="#4b5563">출력(추론 포함)까지 한도 안에서 센다</text>

  <!-- 외부 메모 (쓰기) -->
  <rect x="20" y="140" width="180" height="70" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="110" y="170" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">외부 메모</text>
  <text x="110" y="192" font-size="13" text-anchor="middle" fill="#4b5563">진행 기록 · 메모 파일</text>
  <line x1="268" y1="175" x2="202" y2="175" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="235" y="165" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">① 쓰기</text>

  <!-- 데이터 원천 (고르기) -->
  <rect x="680" y="140" width="180" height="70" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="770" y="170" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">데이터 원천</text>
  <text x="770" y="192" font-size="13" text-anchor="middle" fill="#4b5563">파일 · 검색 · DB</text>
  <line x1="680" y1="175" x2="612" y2="175" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="645" y="165" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">② 고르기</text>
  <text x="770" y="232" font-size="13" text-anchor="middle" fill="#4b5563">식별자만 들고 있다가</text>
  <text x="770" y="250" font-size="13" text-anchor="middle" fill="#4b5563">필요할 때 불러온다</text>

  <!-- 하위 에이전트 (격리) -->
  <rect x="280" y="400" width="150" height="56" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="355" y="423" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">하위 에이전트</text>
  <text x="355" y="443" font-size="13" text-anchor="middle" fill="#4b5563">자기 창에서 탐색</text>
  <rect x="450" y="400" width="150" height="56" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="525" y="423" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">하위 에이전트</text>
  <text x="525" y="443" font-size="13" text-anchor="middle" fill="#4b5563">자기 창에서 탐색</text>
  <line x1="340" y1="360" x2="340" y2="398" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="350" y="385" font-size="13" fill="#111827">위임</text>
  <line x1="540" y1="398" x2="540" y2="362" stroke="#2d6a4f" stroke-width="1.8" marker-end="url(#arrg)"/>
  <text x="550" y="385" font-size="13" fill="#2d6a4f">요약만 반환</text>
  <text x="620" y="433" font-size="13" font-weight="bold" fill="#111827">④ 격리 — 창을 나눈다</text>
</svg>
