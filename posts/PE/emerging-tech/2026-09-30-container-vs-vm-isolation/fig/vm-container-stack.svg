<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">격리 경계가 놓이는 층 — 가상머신 두 형태와 컨테이너</text>

  <!-- 열 제목 -->
  <text x="150" y="64" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">① 베어메탈 가상화</text>
  <text x="440" y="64" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">② 호스트형 가상화</text>
  <text x="730" y="64" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">③ 컨테이너</text>

  <!-- ① 베어메탈 -->
  <rect x="30" y="84" width="240" height="120" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="150" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">앱</text>
  <text x="150" y="152" text-anchor="middle" font-size="13" fill="#1b1b1b">게스트 OS (커널 포함)</text>
  <text x="150" y="174" text-anchor="middle" font-size="13" fill="#495057">VM마다 하나씩 · Linux·Windows 혼재 가능</text>

  <rect x="30" y="266" width="240" height="52" rx="6" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="150" y="297" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">하이퍼바이저</text>

  <rect x="30" y="330" width="240" height="46" rx="6" fill="#e9ecef" stroke="#495057" stroke-width="1.5"/>
  <text x="150" y="358" text-anchor="middle" font-size="14" fill="#1b1b1b">물리 하드웨어</text>

  <!-- ② 호스트형 -->
  <rect x="320" y="84" width="240" height="120" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="440" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">앱</text>
  <text x="440" y="152" text-anchor="middle" font-size="13" fill="#1b1b1b">게스트 OS (커널 포함)</text>

  <rect x="320" y="214" width="240" height="46" rx="6" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="440" y="242" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">하이퍼바이저 (호스트 OS 위)</text>

  <rect x="320" y="270" width="240" height="50" rx="6" fill="#fff3cd" stroke="#b45309" stroke-width="1.5"/>
  <text x="440" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">호스트 OS</text>
  <text x="440" y="311" text-anchor="middle" font-size="13" fill="#b45309">모든 게스트가 이것에 기댄다</text>

  <rect x="320" y="330" width="240" height="46" rx="6" fill="#e9ecef" stroke="#495057" stroke-width="1.5"/>
  <text x="440" y="358" text-anchor="middle" font-size="14" fill="#1b1b1b">물리 하드웨어</text>

  <!-- ③ 컨테이너 -->
  <rect x="610" y="84" width="112" height="120" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="666" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">앱</text>
  <text x="666" y="152" text-anchor="middle" font-size="13" fill="#1b1b1b">라이브러리</text>
  <text x="666" y="172" text-anchor="middle" font-size="13" fill="#9d0208">(커널 없음)</text>
  <rect x="738" y="84" width="112" height="120" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="794" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">앱</text>
  <text x="794" y="152" text-anchor="middle" font-size="13" fill="#1b1b1b">라이브러리</text>
  <text x="794" y="172" text-anchor="middle" font-size="13" fill="#9d0208">(커널 없음)</text>

  <rect x="610" y="214" width="240" height="46" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="730" y="242" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">컨테이너 런타임</text>

  <rect x="610" y="270" width="240" height="50" rx="6" fill="#f8d7da" stroke="#9d0208" stroke-width="1.5"/>
  <text x="730" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d0208">호스트 OS 커널 (공유)</text>
  <text x="730" y="311" text-anchor="middle" font-size="13" fill="#1b1b1b">네임스페이스 · cgroup</text>

  <rect x="610" y="330" width="240" height="46" rx="6" fill="#e9ecef" stroke="#495057" stroke-width="1.5"/>
  <text x="730" y="358" text-anchor="middle" font-size="14" fill="#1b1b1b">물리 하드웨어 또는 VM</text>

  <!-- 격리 경계 표시 -->
  <line x1="24" y1="240" x2="276" y2="240" stroke="#2d6a4f" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="150" y="230" text-anchor="middle" font-size="13" fill="#2d6a4f">격리 경계 — 가상 하드웨어</text>
  <line x1="604" y1="208" x2="856" y2="208" stroke="#9d0208" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- 범례 -->
  <text x="30" y="410" font-size="13" fill="#495057">①·②는 VM마다 게스트 커널이 따로 있고 하이퍼바이저가 가상 하드웨어 단위로 가른다. ②는 호스트 OS가 하나 더 끼어 위험이 는다.</text>
  <text x="30" y="432" font-size="13" fill="#495057">③은 커널 하나를 모든 컨테이너가 나눠 쓰고, 그 커널의 네임스페이스·cgroup·파일시스템 가상화로 가른다(빨간 점선 아래가 공유).</text>
  <text x="30" y="454" font-size="13" fill="#495057">③의 맨 아래가 VM일 수 있다 — 두 방식은 한 스택에 함께 쓰인다.</text>
</svg>
