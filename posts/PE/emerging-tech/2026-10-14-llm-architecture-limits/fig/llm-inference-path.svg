<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Segoe UI', 'Malgun Gothic', sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fbfbf9"/>

  <text x="24" y="30" font-size="14" fill="#1f2933">LLM 이 토큰 하나를 만들어 내는 경로와, 비용·환각이 생기는 자리</text>

  <!-- 흐름 -->
  <rect x="56" y="56" width="320" height="50" rx="6" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
  <text x="74" y="87" font-size="13" fill="#1f2933">① 입력 텍스트</text>

  <rect x="56" y="121" width="320" height="50" rx="6" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
  <text x="74" y="152" font-size="13" fill="#1f2933">② 토큰화 — 서브워드 단위로 쪼갠다</text>

  <rect x="56" y="186" width="320" height="50" rx="6" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
  <text x="74" y="217" font-size="13" fill="#1f2933">③ 임베딩 + 위치 인코딩</text>

  <rect x="56" y="251" width="320" height="50" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="74" y="275" font-size="13" fill="#1f2933">④ 트랜스포머 블록 × N</text>
  <text x="74" y="294" font-size="13" fill="#52606d">멀티헤드 셀프어텐션 → 피드포워드</text>

  <rect x="56" y="316" width="320" height="50" rx="6" fill="#ffffff" stroke="#9d0208" stroke-width="2"/>
  <text x="74" y="347" font-size="13" fill="#1f2933">⑤ 다음 토큰의 확률분포</text>

  <rect x="56" y="381" width="320" height="50" rx="6" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
  <text x="74" y="412" font-size="13" fill="#1f2933">⑥ 하나를 골라 출력한다</text>

  <path d="M216 106 L216 119" stroke="#52606d" stroke-width="1.5" marker-end="url(#tip)"/>
  <path d="M216 171 L216 184" stroke="#52606d" stroke-width="1.5" marker-end="url(#tip)"/>
  <path d="M216 236 L216 249" stroke="#52606d" stroke-width="1.5" marker-end="url(#tip)"/>
  <path d="M216 301 L216 314" stroke="#52606d" stroke-width="1.5" marker-end="url(#tip)"/>
  <path d="M216 366 L216 379" stroke="#52606d" stroke-width="1.5" marker-end="url(#tip)"/>

  <!-- 자기회귀 되돌림 -->
  <path d="M56 406 L28 406 L28 146 L54 146" fill="none" stroke="#52606d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#tip)"/>
  <text x="24" y="452" font-size="13" fill="#52606d">점선 — 만든 토큰을 입력 끝에 붙여 ②부터 다시 돈다 (자기회귀). 길이 n 이 한 칸씩 늘어난다.</text>

  <!-- 주석 -->
  <rect x="424" y="251" width="420" height="50" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="442" y="275" font-size="13" fill="#b45309">비용이 나오는 자리 — 레이어당 O(n²·d)</text>
  <text x="442" y="294" font-size="13" fill="#52606d">길이가 2배면 어텐션 점수 칸은 4배가 된다</text>

  <rect x="424" y="316" width="420" height="115" rx="6" fill="#fdf2f2" stroke="#9d0208" stroke-width="1.5"/>
  <text x="442" y="340" font-size="13" fill="#9d0208">환각이 나오는 자리 — 분포는 언제나 만들어진다</text>
  <text x="442" y="362" font-size="13" fill="#52606d">모르는 것에도 확률이 매겨지고, 가장 큰 값이 뽑힌다</text>
  <text x="442" y="384" font-size="13" fill="#52606d">"모른다"에 해당하는 토큰이 따로 있지 않다</text>
  <text x="442" y="406" font-size="13" fill="#52606d">사실 여부를 확인하는 단계가 이 경로에 없다</text>

  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/>
    </marker>
  </defs>
</svg>
