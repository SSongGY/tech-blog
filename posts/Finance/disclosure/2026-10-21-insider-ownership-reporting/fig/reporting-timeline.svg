<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 348" width="880" height="348" role="img" aria-label="내부자 거래 1건을 둘러싼 사전공시·체결·결제·사후보고의 시간 순서를 보여주는 시간축 도식">
  <rect width="880" height="348" fill="#f7f8fa"/>

  <text x="24" y="32" font-size="17" font-weight="bold" fill="#1b1b1b">거래 1건과 공시 사이의 시간축 — 장내매매 기준</text>
  <text x="24" y="54" font-size="13" fill="#444">같은 매도 1건인데 5%룰은 체결일부터, 소유상황보고는 결제일부터 기한을 센다</text>

  <!-- 구간 배경 -->
  <rect x="64" y="74" width="300" height="34" rx="4" fill="#eaf3ee" stroke="#2d6a4f" stroke-width="1.2"/>
  <text x="84" y="96" font-size="13" fill="#2d6a4f">거래 전 — 계획이 미리 공시되는 구간</text>

  <rect x="364" y="74" width="452" height="34" rx="4" fill="#fdf4e7" stroke="#b45309" stroke-width="1.2"/>
  <text x="384" y="96" font-size="13" fill="#b45309">거래 후 — 이미 끝난 거래를 뒤늦게 알게 되는 구간</text>

  <!-- 시간축 -->
  <line x1="64" y1="188" x2="840" y2="188" stroke="#4b5563" stroke-width="2"/>
  <path d="M840,188 L830,183 L830,193 z" fill="#4b5563"/>

  <!-- 눈금 -->
  <line x1="120" y1="178" x2="120" y2="198" stroke="#4b5563" stroke-width="2"/>
  <line x1="364" y1="170" x2="364" y2="206" stroke="#9d0208" stroke-width="2.5"/>
  <line x1="470" y1="178" x2="470" y2="198" stroke="#4b5563" stroke-width="2"/>
  <line x1="612" y1="178" x2="612" y2="198" stroke="#4b5563" stroke-width="2"/>
  <line x1="762" y1="178" x2="762" y2="198" stroke="#4b5563" stroke-width="2"/>

  <!-- 축 위 라벨 -->
  <text x="120" y="140" font-size="13" font-weight="bold" fill="#2d6a4f" text-anchor="middle">D-30</text>
  <text x="120" y="160" font-size="13" fill="#333" text-anchor="middle">거래계획 보고</text>

  <text x="364" y="140" font-size="13" font-weight="bold" fill="#9d0208" text-anchor="middle">D-day</text>
  <text x="364" y="160" font-size="13" fill="#333" text-anchor="middle">장내 매도 체결</text>

  <!-- 축 아래 라벨 -->
  <text x="470" y="222" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">D+2</text>
  <text x="470" y="242" font-size="13" fill="#333" text-anchor="middle">결제</text>

  <text x="612" y="222" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">체결 + 5영업일</text>
  <text x="612" y="242" font-size="13" fill="#333" text-anchor="middle">5%룰 변동보고 기한</text>

  <text x="762" y="222" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">결제 + 5영업일</text>
  <text x="762" y="242" font-size="13" fill="#333" text-anchor="middle">소유상황보고 기한</text>

  <!-- 기산 구간 표시 -->
  <line x1="364" y1="276" x2="612" y2="276" stroke="#4b5563" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="488" y="270" font-size="13" fill="#4b5563" text-anchor="middle">5%룰 기산 — 체결일부터</text>

  <line x1="470" y1="306" x2="762" y2="306" stroke="#4b5563" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="616" y="300" font-size="13" fill="#4b5563" text-anchor="middle">소유상황보고 기산 — 결제일부터</text>

  <text x="24" y="336" font-size="13" fill="#9d0208">기산일이 이틀 어긋나 있어, 같은 거래라도 소유상황보고가 더 늦게 뜬다</text>
</svg>
