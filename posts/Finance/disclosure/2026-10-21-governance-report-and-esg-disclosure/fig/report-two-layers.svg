<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" width="880" height="452" role="img" aria-label="기업지배구조보고서가 비교 가능한 정형 항목 층과 비교 불가능한 서술 층으로 나뉘는 구조를 보여주는 도식">
  <rect width="880" height="452" fill="#f7f8fa"/>

  <text x="24" y="32" font-size="17" font-weight="bold" fill="#1b1b1b">기업지배구조보고서의 두 층 — 어디까지 나란히 놓을 수 있는가</text>
  <text x="24" y="54" font-size="13" fill="#444">같은 보고서 안에서도 양식이 고정된 층만 회사끼리 비교가 된다</text>

  <!-- 보고서 전체 -->
  <rect x="316" y="74" width="248" height="46" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="440" y="103" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">기업지배구조보고서 1건</text>

  <!-- 갈래 선 -->
  <line x1="440" y1="120" x2="440" y2="140" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="180" y1="140" x2="700" y2="140" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="180" y1="140" x2="180" y2="162" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arw2)"/>
  <line x1="700" y1="140" x2="700" y2="162" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arw2)"/>

  <defs>
    <marker id="arw2" markerWidth="9" markerHeight="9" refX="4" refY="8" orient="auto">
      <path d="M0,0 L8,0 L4,7 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 왼쪽: 정형 층 -->
  <rect x="24" y="170" width="332" height="212" rx="6" fill="#eaf3ee" stroke="#2d6a4f" stroke-width="2"/>
  <text x="44" y="198" font-size="14" font-weight="bold" fill="#2d6a4f">정형 층 — 양식이 고정됨</text>

  <rect x="44" y="212" width="292" height="44" rx="4" fill="#ffffff" stroke="#8a94a6" stroke-width="1.2"/>
  <text x="58" y="232" font-size="13" fill="#1b1b1b">지배구조 핵심지표 준수 현황</text>
  <text x="58" y="250" font-size="13" fill="#555">15개 항목 · 당기·전기 각각 O 또는 X</text>

  <rect x="44" y="264" width="292" height="44" rx="4" fill="#ffffff" stroke="#8a94a6" stroke-width="1.2"/>
  <text x="58" y="284" font-size="13" fill="#1b1b1b">준수율</text>
  <text x="58" y="302" font-size="13" fill="#555">준수 항목 ÷ 15 · 항목 가중치는 없다</text>

  <rect x="44" y="316" width="292" height="44" rx="4" fill="#ffffff" stroke="#8a94a6" stroke-width="1.2"/>
  <text x="58" y="336" font-size="13" fill="#1b1b1b">기업개요 요약 재무현황</text>
  <text x="58" y="354" font-size="13" fill="#555">당기·전기·전전기 3개년 같은 양식</text>

  <!-- 오른쪽: 서술 층 -->
  <rect x="380" y="170" width="476" height="212" rx="6" fill="#fdf4e7" stroke="#b45309" stroke-width="2"/>
  <text x="400" y="198" font-size="14" font-weight="bold" fill="#b45309">서술 층 — 분량·범위를 회사가 정함</text>

  <rect x="400" y="212" width="436" height="44" rx="4" fill="#ffffff" stroke="#8a94a6" stroke-width="1.2"/>
  <text x="414" y="232" font-size="13" fill="#1b1b1b">핵심원칙 10가지에 대한 준수 여부와 그 근거</text>
  <text x="414" y="250" font-size="13" fill="#555">주주 2 + 이사회 6 + 감사기구 2 · Comply or Explain</text>

  <rect x="400" y="264" width="436" height="44" rx="4" fill="#ffffff" stroke="#8a94a6" stroke-width="1.2"/>
  <text x="414" y="284" font-size="13" fill="#1b1b1b">미준수 사유와 향후 계획</text>
  <text x="414" y="302" font-size="13" fill="#555">항목이 같아도 서술 수준이 회사마다 갈린다</text>

  <rect x="400" y="316" width="436" height="44" rx="4" fill="#ffffff" stroke="#8a94a6" stroke-width="1.2"/>
  <text x="414" y="336" font-size="13" fill="#1b1b1b">기업 고유의 지배구조 특징</text>
  <text x="414" y="354" font-size="13" fill="#555">쓸지 말지부터 회사가 정한다</text>

  <text x="24" y="412" font-size="13" fill="#2d6a4f">정형 층은 회사끼리, 연도끼리 나란히 놓을 수 있다 — 여기서 숫자를 뽑는다</text>
  <text x="24" y="436" font-size="13" fill="#b45309">서술 층을 비교하려 들면 긴 쪽이 잘한 것으로 보인다. 분량은 지배구조가 아니다</text>
</svg>
