<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="기업지배구조보고서와 지속가능성 공시의 의무화 대상이 연도별로 확대되는 일정을 두 줄로 보여주는 도식">
  <rect width="880" height="400" fill="#f7f8fa"/>

  <text x="24" y="32" font-size="17" font-weight="bold" fill="#1b1b1b">두 공시의 의무화 일정 — 자산 기준이 해마다 내려간다</text>
  <text x="24" y="54" font-size="13" fill="#444">지배구조보고서는 자산총액, 지속가능성 공시는 연결자산총액이 기준이다 (모두 코스피 상장사)</text>

  <!-- 연도 축 -->
  <line x1="150" y1="104" x2="856" y2="104" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="196" y="94" font-size="13" font-weight="bold" fill="#555" text-anchor="middle">2019</text>
  <text x="300" y="94" font-size="13" font-weight="bold" fill="#555" text-anchor="middle">2022</text>
  <text x="404" y="94" font-size="13" font-weight="bold" fill="#555" text-anchor="middle">2024</text>
  <text x="508" y="94" font-size="13" font-weight="bold" fill="#555" text-anchor="middle">2026</text>
  <text x="612" y="94" font-size="13" font-weight="bold" fill="#555" text-anchor="middle">2028</text>
  <text x="716" y="94" font-size="13" font-weight="bold" fill="#555" text-anchor="middle">2029</text>
  <text x="820" y="94" font-size="13" font-weight="bold" fill="#555" text-anchor="middle">2030</text>

  <!-- 1행: 기업지배구조보고서 -->
  <text x="24" y="150" font-size="14" font-weight="bold" fill="#1b1b1b">기업지배구조</text>
  <text x="24" y="170" font-size="14" font-weight="bold" fill="#1b1b1b">보고서</text>
  <text x="24" y="192" font-size="13" fill="#555">제출 기한 5월 31일</text>

  <rect x="152" y="130" width="92" height="58" rx="5" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="198" y="154" font-size="13" fill="#1b1b1b" text-anchor="middle">2조원</text>
  <text x="198" y="174" font-size="13" fill="#555" text-anchor="middle">이상</text>

  <rect x="256" y="130" width="92" height="58" rx="5" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="302" y="154" font-size="13" fill="#1b1b1b" text-anchor="middle">1조원</text>
  <text x="302" y="174" font-size="13" fill="#555" text-anchor="middle">이상</text>

  <rect x="360" y="130" width="92" height="58" rx="5" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="406" y="154" font-size="13" fill="#1b1b1b" text-anchor="middle">5천억원</text>
  <text x="406" y="174" font-size="13" fill="#555" text-anchor="middle">이상</text>

  <rect x="464" y="130" width="92" height="58" rx="5" fill="#eaf3ee" stroke="#2d6a4f" stroke-width="2.4"/>
  <text x="510" y="154" font-size="13" font-weight="bold" fill="#2d6a4f" text-anchor="middle">전 상장사</text>
  <text x="510" y="174" font-size="13" fill="#2d6a4f" text-anchor="middle">기준 없음</text>

  <!-- 2행: 지속가능성 공시 -->
  <text x="24" y="256" font-size="14" font-weight="bold" fill="#1b1b1b">지속가능성</text>
  <text x="24" y="276" font-size="14" font-weight="bold" fill="#1b1b1b">(ESG) 공시</text>
  <text x="24" y="298" font-size="13" fill="#555">사업보고서 법정공시</text>

  <rect x="568" y="236" width="92" height="58" rx="5" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/>
  <text x="614" y="260" font-size="13" fill="#1b1b1b" text-anchor="middle">10조원</text>
  <text x="614" y="280" font-size="13" fill="#555" text-anchor="middle">FY2027분</text>

  <rect x="672" y="236" width="92" height="58" rx="5" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/>
  <text x="718" y="260" font-size="13" fill="#1b1b1b" text-anchor="middle">5조원</text>
  <text x="718" y="280" font-size="13" fill="#555" text-anchor="middle">FY2028분</text>

  <rect x="776" y="236" width="80" height="58" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="816" y="260" font-size="13" fill="#555" text-anchor="middle">2조원</text>
  <text x="816" y="280" font-size="13" fill="#555" text-anchor="middle">검토</text>

  <!-- 2030 검증 표시 -->
  <line x1="816" y1="294" x2="816" y2="316" stroke="#6b7280" stroke-width="1.4"/>
  <text x="856" y="332" font-size="13" fill="#6b7280" text-anchor="end">제3자 검증 의무 시작</text>

  <text x="24" y="366" font-size="13" fill="#b45309">점선 칸은 아직 확정되지 않은 검토 단계다. 확정된 칸과 구분해 읽는다</text>
  <text x="24" y="390" font-size="13" fill="#9d0208">지속가능성 공시의 최초 대상 기준은 2026년 2월 의견수렴안의 30조원에서 7월 최종안의 10조원으로 내려갔다</text>
</svg>
