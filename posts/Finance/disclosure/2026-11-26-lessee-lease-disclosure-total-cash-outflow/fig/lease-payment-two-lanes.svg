<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="880" height="430" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="440" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">리스료가 재무제표 세 장에 나타나는 두 경로</text>

  <!-- 열 머리 -->
  <text x="130" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">리스료의 종류</text>
  <text x="350" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">재무상태표</text>
  <text x="550" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">손익계산서</text>
  <text x="750" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">현금흐름표 (문단 50)</text>

  <!-- 경로 1: 리스부채에 들어간 리스료 -->
  <rect x="30" y="84" width="200" height="96" rx="6" fill="#e8f3ee" stroke="#2d6a4f" stroke-width="2"/>
  <text x="130" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">리스부채에 들어간 것</text>
  <text x="130" y="136" text-anchor="middle" font-size="13" fill="#1f2937">고정리스료</text>
  <text x="130" y="156" text-anchor="middle" font-size="13" fill="#1f2937">지수·요율 연동 리스료</text>

  <line x1="230" y1="132" x2="258" y2="132" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="260" y="84" width="180" height="96" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="350" y="124" text-anchor="middle" font-size="13" fill="#1f2937">사용권자산</text>
  <text x="350" y="146" text-anchor="middle" font-size="13" fill="#1f2937">리스부채</text>

  <line x1="440" y1="132" x2="458" y2="132" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="460" y="84" width="180" height="96" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="550" y="124" text-anchor="middle" font-size="13" fill="#1f2937">감가상각비 53⑴</text>
  <text x="550" y="146" text-anchor="middle" font-size="13" fill="#1f2937">이자비용 53⑵</text>

  <line x1="640" y1="132" x2="658" y2="132" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="660" y="84" width="190" height="96" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="755" y="124" text-anchor="middle" font-size="13" fill="#1f2937">원금 → 재무활동</text>
  <text x="755" y="146" text-anchor="middle" font-size="13" fill="#1f2937">이자 → 제1007호에 따름</text>

  <!-- 경로 2: 리스부채 밖 리스료 -->
  <rect x="30" y="204" width="200" height="96" rx="6" fill="#fdf3e6" stroke="#b45309" stroke-width="2"/>
  <text x="130" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">리스부채 밖에 남는 것</text>
  <text x="130" y="252" text-anchor="middle" font-size="13" fill="#1f2937">단기리스 · 소액자산 리스</text>
  <text x="130" y="272" text-anchor="middle" font-size="13" fill="#1f2937">매출·사용량 연동</text>
  <text x="130" y="290" text-anchor="middle" font-size="13" fill="#1f2937">변동리스료</text>

  <line x1="230" y1="252" x2="258" y2="252" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="260" y="204" width="180" height="96" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="350" y="256" text-anchor="middle" font-size="13" fill="#4b5563">인식하지 않는다</text>

  <line x1="440" y1="252" x2="458" y2="252" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="460" y="204" width="180" height="96" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="550" y="246" text-anchor="middle" font-size="13" fill="#1f2937">리스료 비용</text>
  <text x="550" y="268" text-anchor="middle" font-size="13" fill="#1f2937">53⑶ · ⑷ · ⑸</text>

  <line x1="640" y1="252" x2="658" y2="252" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="660" y="204" width="190" height="96" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="755" y="256" text-anchor="middle" font-size="13" fill="#1f2937">전액 → 영업활동</text>

  <!-- 합계 -->
  <line x1="755" y1="300" x2="755" y2="338" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="330" y="340" width="520" height="62" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="590" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">리스의 총 현금유출 53⑺</text>
  <text x="590" y="388" text-anchor="middle" font-size="13" fill="#1f2937">두 경로의 현금흐름표 금액을 모두 더한 값</text>
</svg>
