<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fbfaf7"/>

  <text x="24" y="40" font-size="18" font-weight="bold" fill="#1b1b1b">비적정 의견 하나로는 상장폐지가 되지 않는다 — 판정은 두 해에 걸친다</text>
  <text x="24" y="64" font-size="13" fill="#4a4a4a">유가증권시장 상장규정 기준 · 2025년 7월 1일 시행 이후 최초로 감사인 의견 미달이 발생한 법인부터 적용</text>

  <rect x="24" y="166" width="186" height="78" fill="#fbeee0" stroke="#b45309" stroke-width="1.4"/>
  <text x="38" y="192" font-size="13" font-weight="bold" fill="#b45309">1년차 — 감사인 의견 미달</text>
  <text x="38" y="212" font-size="13" fill="#b45309">부적정 · 의견거절 ·</text>
  <text x="38" y="230" font-size="13" fill="#b45309">감사범위 제한 한정</text>

  <rect x="248" y="166" width="190" height="78" fill="#e8e2d6" stroke="#9c9484" stroke-width="1.4"/>
  <text x="262" y="192" font-size="13" font-weight="bold" fill="#1b1b1b">개선기간</text>
  <text x="262" y="212" font-size="13" fill="#1b1b1b">차기 사업연도 감사보고서와</text>
  <text x="262" y="230" font-size="13" fill="#1b1b1b">사업보고서를 기다린다</text>

  <rect x="476" y="96" width="248" height="62" fill="#dfe8e2" stroke="#2d6a4f" stroke-width="1.4"/>
  <text x="490" y="120" font-size="13" fill="#2d6a4f">차기 사업연도 감사의견이</text>
  <text x="490" y="140" font-size="13" font-weight="bold" fill="#2d6a4f">적정으로 돌아온다</text>

  <rect x="754" y="96" width="102" height="62" fill="#2d6a4f"/>
  <text x="805" y="133" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">상장 유지</text>

  <rect x="476" y="252" width="248" height="78" fill="#fae3e3" stroke="#9d0208" stroke-width="1.4"/>
  <text x="490" y="276" font-size="13" fill="#9d0208">또 비적정이거나, 사업보고서를</text>
  <text x="490" y="296" font-size="13" fill="#9d0208">법정 제출기한부터 10일 안에</text>
  <text x="490" y="316" font-size="13" fill="#9d0208">내지 않는다</text>

  <rect x="754" y="252" width="102" height="78" fill="#9d0208"/>
  <text x="805" y="285" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">상장폐지</text>
  <text x="805" y="307" font-size="13" fill="#ffffff" text-anchor="middle">제2호의2</text>

  <path d="M 210 205 L 248 205 M 241 199 L 248 205 L 241 211" fill="none" stroke="#4a4a4a" stroke-width="1.4"/>
  <path d="M 438 205 L 456 205 L 456 127 L 476 127 M 469 121 L 476 127 L 469 133" fill="none" stroke="#2d6a4f" stroke-width="1.4"/>
  <path d="M 456 205 L 456 291 L 476 291 M 469 285 L 476 291 L 469 297" fill="none" stroke="#9d0208" stroke-width="1.4"/>
  <path d="M 724 127 L 754 127 M 747 121 L 754 127 L 747 133" fill="none" stroke="#2d6a4f" stroke-width="1.4"/>
  <path d="M 724 291 L 754 291 M 747 285 L 754 291 L 747 297" fill="none" stroke="#9d0208" stroke-width="1.4"/>

  <rect x="24" y="356" width="832" height="92" fill="#f2efe6" stroke="#9c9484" stroke-width="1"/>
  <text x="40" y="380" font-size="13" font-weight="bold" fill="#1b1b1b">아래 빠져나갈 길이 둘 있다</text>
  <text x="40" y="402" font-size="13" fill="#4a4a4a">① 최근 사업연도 보통주권 평균 상장시가총액이 1,000억원 이상이면 2년 연속 조항을 적용하지 않는다.</text>
  <text x="40" y="422" font-size="13" fill="#4a4a4a">② 계속기업 가정 불확실성이 원인이고, 회생계획 인가나 기업개선계획 약정이 있고, 종료 후 의견 변경이 가능하다는</text>
  <text x="40" y="440" font-size="13" fill="#4a4a4a">　 감사인 의견서를 정리매매 전에 내면, 국민경제에 중대한 영향이 있다고 판단될 때 1년 이내로 유예할 수 있다.</text>
</svg>
