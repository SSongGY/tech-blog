<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'맑은 고딕','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="450" fill="#fbfbf8"/>

  <text x="20" y="32" font-size="16" font-weight="bold" fill="#1b1b1b">합병 결의부터 매수가격이 정해지기까지</text>

  <!-- ===== 1행: 합병 절차 ===== -->
  <text x="20" y="58" font-size="13" fill="#555">① 회사가 밟는 절차</text>

  <g stroke="#2d6a4f" stroke-width="1.6" fill="#eef5f1">
    <rect x="20" y="70" width="146" height="60" rx="5"/>
    <rect x="192" y="70" width="146" height="60" rx="5"/>
    <rect x="364" y="70" width="146" height="60" rx="5"/>
    <rect x="536" y="70" width="146" height="60" rx="5"/>
  </g>
  <rect x="708" y="70" width="146" height="60" rx="5" stroke="#b45309" stroke-width="1.6" fill="#fdf3e4"/>

  <g font-size="13" fill="#1b1b1b" text-anchor="middle">
    <text x="93" y="95">이사회 결의</text>
    <text x="93" y="114">(합병계약 승인)</text>
    <text x="265" y="95">주요사항보고서</text>
    <text x="265" y="114">제출</text>
    <text x="437" y="95">합병계약서 등</text>
    <text x="437" y="114">본점 비치</text>
    <text x="609" y="95">주주총회</text>
    <text x="609" y="114">합병 승인 결의</text>
    <text x="781" y="95" fill="#8a4a05">주식매수청구</text>
    <text x="781" y="114" fill="#8a4a05">(서면)</text>
  </g>

  <g stroke="#555" stroke-width="1.4" marker-end="url(#ar)">
    <line x1="166" y1="100" x2="188" y2="100"/>
    <line x1="338" y1="100" x2="360" y2="100"/>
    <line x1="510" y1="100" x2="532" y2="100"/>
    <line x1="682" y1="100" x2="704" y2="100"/>
  </g>

  <g font-size="13" fill="#b45309" text-anchor="middle">
    <text x="177" y="152">3일 이내</text>
    <text x="349" y="152">주총 2주 전부터</text>
    <text x="693" y="152">결의일부터</text>
    <text x="693" y="167">20일 이내</text>
  </g>

  <!-- ===== 주주가 먼저 해 둘 일 ===== -->
  <rect x="364" y="186" width="318" height="44" rx="5" stroke="#2d6a4f" stroke-width="1.6" stroke-dasharray="5 3" fill="#eef5f1"/>
  <text x="523" y="213" font-size="13" fill="#1b1b1b" text-anchor="middle">주주: 주주총회 전까지 서면으로 반대 의사 통지</text>
  <line x1="523" y1="186" x2="523" y2="134" stroke="#2d6a4f" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arg)"/>

  <!-- ===== 2행: 매수가격 ===== -->
  <text x="20" y="266" font-size="13" fill="#555">② 매수가격이 정해지는 순서</text>

  <g stroke="#2d6a4f" stroke-width="1.6" fill="#eef5f1">
    <rect x="20" y="280" width="190" height="76" rx="5"/>
    <rect x="240" y="280" width="190" height="76" rx="5"/>
  </g>
  <rect x="460" y="280" width="190" height="76" rx="5" stroke="#b45309" stroke-width="1.6" fill="#fdf3e4"/>
  <rect x="660" y="280" width="200" height="76" rx="5" stroke="#9d0208" stroke-width="1.6" fill="#fbeceb"/>

  <g font-size="13" fill="#1b1b1b" text-anchor="middle">
    <text x="115" y="306">회사가 매수한다</text>
    <text x="115" y="325">청구기간 종료일부터</text>
    <text x="115" y="344">1개월 이내</text>

    <text x="335" y="315">주주와 회사의</text>
    <text x="335" y="334">협의로 결정</text>

    <text x="555" y="306" fill="#8a4a05">협의가 깨지면</text>
    <text x="555" y="325" fill="#8a4a05">2개월·1개월·1주일</text>
    <text x="555" y="344" fill="#8a4a05">가중평균의 산술평균</text>

    <text x="752" y="315" fill="#7a0206">그래도 반대하면</text>
    <text x="752" y="334" fill="#7a0206">법원이 결정</text>
  </g>

  <g stroke="#555" stroke-width="1.4" marker-end="url(#ar)">
    <line x1="210" y1="318" x2="236" y2="318"/>
    <line x1="430" y1="318" x2="456" y2="318"/>
    <line x1="650" y1="318" x2="656" y2="318"/>
  </g>

  <!-- 1행 → 2행 연결 -->
  <path d="M 781 130 L 781 180 L 900 180" fill="none" stroke="none"/>
  <path d="M 115 248 L 115 276" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M 781 174 L 781 248 L 115 248" fill="none" stroke="#555" stroke-width="1.4"/>
  <line x1="781" y1="134" x2="781" y2="176" stroke="#b45309" stroke-width="1.4" stroke-dasharray="4 3"/>

  <text x="20" y="390" font-size="13" fill="#555">청구 기간·매수 기한은 주권상장법인 기준이다. 비상장회사는 매수 기한이 2개월이다.</text>
  <text x="20" y="412" font-size="13" fill="#555">법정 산식은 2026년 12월 9일부터 주식가격·자산가치·수익가치를 종합하는 방식으로 바뀐다.</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#555"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2d6a4f"/>
    </marker>
  </defs>
</svg>
