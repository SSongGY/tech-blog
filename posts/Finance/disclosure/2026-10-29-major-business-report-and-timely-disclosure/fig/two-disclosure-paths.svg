<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fbfbf9"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrowSwap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <text x="24" y="32" font-size="16" font-weight="bold" fill="#1f2937">한 사건이 두 갈래로 나뉘어 알려지고, 두 기관이 서로 넘겨 받는다</text>

  <!-- 사건 -->
  <rect x="336" y="54" width="208" height="46" rx="5" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="440" y="74" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">상장법인에 사건 발생</text>
  <text x="440" y="92" font-size="13" text-anchor="middle" fill="#4b5563">이사회 결의 · 부도 · 양수도</text>

  <line x1="400" y1="100" x2="236" y2="138" stroke="#4b5563" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="480" y1="100" x2="644" y2="138" stroke="#4b5563" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 왼쪽: 주요사항보고서 -->
  <rect x="40" y="146" width="376" height="164" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="228" y="172" font-size="15" font-weight="bold" text-anchor="middle" fill="#312e81">주요사항보고서</text>
  <text x="228" y="194" font-size="13" text-anchor="middle" fill="#4b5563">법정 보고서 · 자본시장법 제161조</text>
  <line x1="60" y1="206" x2="396" y2="206" stroke="#c3c8f0" stroke-width="1"/>
  <text x="60" y="228" font-size="13" fill="#1f2937">제출처 : 금융위원회</text>
  <text x="60" y="250" font-size="13" fill="#1f2937">대상 : 사업보고서 제출대상법인</text>
  <text x="60" y="272" font-size="13" fill="#1f2937">사유 : 법이 10가지로 한정해 열거</text>
  <text x="60" y="294" font-size="13" fill="#1f2937">시한 : 발생일의 다음 날 (예외 2가지)</text>

  <!-- 오른쪽: 수시공시 -->
  <rect x="464" y="146" width="376" height="164" rx="6" fill="#ecfdf5" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="652" y="172" font-size="15" font-weight="bold" text-anchor="middle" fill="#14532d">수시공시</text>
  <text x="652" y="194" font-size="13" text-anchor="middle" fill="#4b5563">자율규제 · 자본시장법 제391조가 위임</text>
  <line x1="484" y1="206" x2="820" y2="206" stroke="#a7d3bf" stroke-width="1"/>
  <text x="484" y="228" font-size="13" fill="#1f2937">신고처 : 한국거래소</text>
  <text x="484" y="250" font-size="13" fill="#1f2937">대상 : 주권등상장법인</text>
  <text x="484" y="272" font-size="13" fill="#1f2937">사유 : 거래소 공시규정이 정한다</text>
  <text x="484" y="294" font-size="13" fill="#1f2937">시한 : 당일공시 당일 / 익일공시 다음 날</text>

  <!-- 상호 송부 -->
  <line x1="416" y1="238" x2="464" y2="238" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrowSwap)"/>
  <line x1="464" y1="268" x2="416" y2="268" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrowSwap)"/>
  <text x="440" y="330" font-size="13" text-anchor="middle" fill="#78350f">서로 송부</text>

  <rect x="248" y="344" width="384" height="46" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="440" y="364" font-size="13" text-anchor="middle" fill="#78350f">금융위 → 거래소 송부 (법 제161조 제5항)</text>
  <text x="440" y="382" font-size="13" text-anchor="middle" fill="#78350f">거래소 → 금융위 송부 후 공시 (법 제392조 제3·4항)</text>

  <!-- 결과 -->
  <line x1="440" y1="390" x2="440" y2="414" stroke="#4b5563" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="268" y="414" width="344" height="42" rx="5" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="440" y="441" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">투자자는 양쪽을 한 화면에서 본다</text>
</svg>
