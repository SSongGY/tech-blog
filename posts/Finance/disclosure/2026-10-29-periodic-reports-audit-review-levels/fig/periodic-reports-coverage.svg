<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 434" width="880" height="434" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="434" fill="#fdfdfb"/>

  <text x="16" y="30" font-size="17" font-weight="bold" fill="#1b263b">12월 결산법인의 정기보고서 — 덮는 기간과 회계감사인 관여 수준</text>

  <!-- 분기 축 -->
  <rect x="150" y="48" width="152" height="30" fill="#e9ecef" stroke="#adb5bd"/>
  <rect x="302" y="48" width="153" height="30" fill="#e9ecef" stroke="#adb5bd"/>
  <rect x="455" y="48" width="152" height="30" fill="#e9ecef" stroke="#adb5bd"/>
  <rect x="607" y="48" width="153" height="30" fill="#e9ecef" stroke="#adb5bd"/>
  <text x="226" y="68" font-size="14" text-anchor="middle" fill="#343a40">1~3월</text>
  <text x="378" y="68" font-size="14" text-anchor="middle" fill="#343a40">4~6월</text>
  <text x="531" y="68" font-size="14" text-anchor="middle" fill="#343a40">7~9월</text>
  <text x="683" y="68" font-size="14" text-anchor="middle" fill="#343a40">10~12월</text>
  <text x="768" y="68" font-size="13" fill="#495057">확신 수준</text>

  <!-- 1분기보고서 -->
  <text x="16" y="110" font-size="14" fill="#212529">1분기보고서</text>
  <rect x="150" y="94" width="152" height="30" fill="#fdebd0" stroke="#b45309" stroke-width="2"/>
  <text x="226" y="114" font-size="13" text-anchor="middle" fill="#7c3f00">1분기 누계</text>
  <text x="768" y="114" font-size="13" fill="#b45309">검토 또는 없음</text>

  <!-- 반기보고서 -->
  <text x="16" y="150" font-size="14" fill="#212529">반기보고서</text>
  <rect x="150" y="134" width="305" height="30" fill="#fdebd0" stroke="#b45309" stroke-width="2"/>
  <text x="302" y="154" font-size="13" text-anchor="middle" fill="#7c3f00">반기 누계</text>
  <text x="768" y="154" font-size="13" fill="#b45309">검토</text>

  <!-- 3분기보고서 -->
  <text x="16" y="190" font-size="14" fill="#212529">3분기보고서</text>
  <rect x="150" y="174" width="457" height="30" fill="#fdebd0" stroke="#b45309" stroke-width="2"/>
  <text x="378" y="194" font-size="13" text-anchor="middle" fill="#7c3f00">3분기 누계</text>
  <text x="768" y="194" font-size="13" fill="#b45309">검토 또는 없음</text>

  <!-- 사업보고서 -->
  <text x="16" y="230" font-size="14" fill="#212529">사업보고서</text>
  <rect x="150" y="214" width="610" height="30" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="2"/>
  <text x="455" y="234" font-size="13" text-anchor="middle" fill="#1b4332">연간 (연차재무제표)</text>
  <text x="768" y="234" font-size="13" fill="#2d6a4f">감사</text>

  <!-- 4분기 역산 -->
  <line x1="607" y1="250" x2="607" y2="282" stroke="#9d0208" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="760" y1="250" x2="760" y2="282" stroke="#9d0208" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="607" y="282" width="153" height="34" fill="#fde2e2" stroke="#9d0208" stroke-width="2"/>
  <text x="683" y="304" font-size="13" text-anchor="middle" fill="#9d0208">4분기 단독</text>
  <text x="150" y="304" font-size="13" fill="#9d0208">어느 보고서에도 단독으로 실리지 않는다 →</text>
  <text x="150" y="332" font-size="13" fill="#495057">4분기 = 사업보고서의 연간 금액 − 3분기보고서의 누계 금액</text>

  <!-- 범례 -->
  <line x1="16" y1="352" x2="864" y2="352" stroke="#ced4da"/>
  <rect x="16" y="364" width="18" height="16" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="2"/>
  <text x="42" y="377" font-size="13" fill="#343a40">감사 — 적정 여부에 대한 의견을 낸다</text>
  <rect x="330" y="364" width="18" height="16" fill="#fdebd0" stroke="#b45309" stroke-width="2"/>
  <text x="356" y="377" font-size="13" fill="#343a40">검토 — 질문과 분석적 절차 위주</text>
  <rect x="610" y="364" width="18" height="16" fill="#fde2e2" stroke="#9d0208" stroke-width="2"/>
  <text x="636" y="377" font-size="13" fill="#343a40">역산해야 보이는 구간</text>
  <text x="16" y="400" font-size="13" fill="#6c757d">분기보고서의 '검토 또는 없음' — 금융기관이거나 직전 사업연도말 자산총액</text>
  <text x="16" y="416" font-size="13" fill="#6c757d">5천억원 이상이면 검토, 그 밖이면 감사인 의견을 생략할 수 있다.</text>
</svg>
