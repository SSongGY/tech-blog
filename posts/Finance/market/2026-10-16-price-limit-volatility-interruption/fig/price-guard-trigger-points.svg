<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fbfbf8"/>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1c1917">같은 매수 주문이 호가창을 훑을 때, 장치가 걸리는 자리</text>
  <text x="30" y="58" font-size="13" fill="#57534e">기준가 10,000원 · 매도호가 8단계를 차례로 체결해 올라가는 경로. 장치마다 재는 자(참조가격)가 다르다.</text>

  <!-- 가격 축 -->
  <line x1="92" y1="95" x2="92" y2="405" stroke="#a8a29e" stroke-width="1.2"/>
  <line x1="92" y1="392.9" x2="862" y2="392.9" stroke="#e7e5e4" stroke-width="1"/>
  <line x1="92" y1="321.4" x2="862" y2="321.4" stroke="#e7e5e4" stroke-width="1"/>
  <line x1="92" y1="250" x2="862" y2="250" stroke="#e7e5e4" stroke-width="1"/>
  <line x1="92" y1="107.1" x2="862" y2="107.1" stroke="#e7e5e4" stroke-width="1"/>
  <text x="84" y="397" font-size="13" fill="#57534e" text-anchor="end">10,000</text>
  <text x="84" y="326" font-size="13" fill="#57534e" text-anchor="end">11,000</text>
  <text x="84" y="255" font-size="13" fill="#57534e" text-anchor="end">12,000</text>
  <text x="84" y="183" font-size="13" fill="#57534e" text-anchor="end">13,000</text>
  <text x="84" y="112" font-size="13" fill="#57534e" text-anchor="end">14,000</text>

  <!-- 상한가 -->
  <line x1="92" y1="178.6" x2="862" y2="178.6" stroke="#9d0208" stroke-width="1.8" stroke-dasharray="7 5"/>
  <rect x="132" y="155" width="268" height="20" fill="#fbfbf8"/>
  <text x="136" y="170" font-size="13" font-weight="bold" fill="#9d0208">상한가 13,000원 — 기준가 +30%</text>

  <!-- 체결 경로 (계단) -->
  <path d="M 130 392.9 H 205 V 378.6 H 280 V 353.6 H 355 V 321.4 H 430 V 267.9 H 505 V 214.3 H 580"
        fill="none" stroke="#2d6a4f" stroke-width="2.4"/>
  <path d="M 580 214.3 V 171.4 H 655 V 107.1 H 700"
        fill="none" stroke="#9d0208" stroke-width="2.2" stroke-dasharray="6 4"/>

  <!-- 체결 지점 -->
  <circle cx="130" cy="392.9" r="4" fill="#2d6a4f"/>
  <circle cx="205" cy="378.6" r="4" fill="#2d6a4f"/>
  <circle cx="280" cy="353.6" r="4" fill="#2d6a4f"/>
  <circle cx="355" cy="321.4" r="4" fill="#2d6a4f"/>
  <circle cx="430" cy="267.9" r="4" fill="#2d6a4f"/>
  <circle cx="505" cy="214.3" r="4" fill="#2d6a4f"/>

  <!-- 발동 표시 -->
  <circle cx="280" cy="353.6" r="12" fill="#ffffff" stroke="#b45309" stroke-width="2.2"/>
  <text x="280" y="358" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">1</text>
  <circle cx="355" cy="321.4" r="12" fill="#ffffff" stroke="#b45309" stroke-width="2.2"/>
  <text x="355" y="326" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">2</text>
  <circle cx="430" cy="267.9" r="12" fill="#ffffff" stroke="#b45309" stroke-width="2.2"/>
  <text x="430" y="272" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">3</text>
  <circle cx="580" cy="171.4" r="12" fill="#ffffff" stroke="#9d0208" stroke-width="2.2"/>
  <text x="580" y="176" font-size="13" font-weight="bold" fill="#9d0208" text-anchor="middle">4</text>

  <!-- 단계 라벨 -->
  <text x="130" y="423" font-size="13" fill="#78716c" text-anchor="middle">10,000</text>
  <text x="205" y="423" font-size="13" fill="#78716c" text-anchor="middle">10,200</text>
  <text x="280" y="423" font-size="13" fill="#78716c" text-anchor="middle">10,550</text>
  <text x="355" y="423" font-size="13" fill="#78716c" text-anchor="middle">11,000</text>
  <text x="430" y="423" font-size="13" fill="#78716c" text-anchor="middle">11,750</text>
  <text x="505" y="423" font-size="13" fill="#78716c" text-anchor="middle">12,500</text>
  <text x="580" y="423" font-size="13" fill="#78716c" text-anchor="middle">13,100</text>
  <text x="655" y="423" font-size="13" fill="#78716c" text-anchor="middle">14,000</text>
  <text x="130" y="446" font-size="13" fill="#78716c" text-anchor="middle">1단계</text>
  <text x="655" y="446" font-size="13" fill="#78716c" text-anchor="middle">8단계</text>
  <text x="392" y="446" font-size="13" fill="#78716c" text-anchor="middle">매도호가를 차례로 체결해 올라간다</text>

  <!-- 범례 -->
  <rect x="600" y="256" width="262" height="146" rx="6" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.4"/>
  <text x="614" y="280" font-size="13" fill="#1c1917"><tspan font-weight="bold" fill="#b45309">1</tspan> 동적 VI 3% — 코스피200 구성종목</text>
  <text x="614" y="302" font-size="13" fill="#1c1917"><tspan font-weight="bold" fill="#b45309">2</tspan> 정적 VI 10% — 전 종목</text>
  <text x="614" y="324" font-size="13" fill="#1c1917"><tspan font-weight="bold" fill="#b45309">3</tspan> 동적 VI 6% — 일반·코스닥</text>
  <text x="614" y="346" font-size="13" fill="#1c1917"><tspan font-weight="bold" fill="#9d0208">4</tspan> 가격제한폭 +30%</text>
  <text x="614" y="372" font-size="13" fill="#57534e">1~3 은 2분 단일가매매로 전환,</text>
  <text x="614" y="391" font-size="13" fill="#57534e">4 는 호가 접수 자체를 막는다</text>
</svg>
