  <text x="688" y="306" font-size="13" fill="#1b1b1b" text-anchor="end">23,650</text>
  <text x="828" y="306" font-size="13" fill="#1b1b1b" text-anchor="end">60</text>

  <rect x="460" y="318" width="380" height="26" fill="#f4f6f8" stroke="#d9dde2"/>
  <text x="480" y="336" font-size="13" fill="#2d6a4f">매수</text>
  <text x="688" y="336" font-size="13" fill="#1b1b1b" text-anchor="end">23,500</text>
  <text x="828" y="336" font-size="13" fill="#1b1b1b" text-anchor="end">90</text>

  <text x="460" y="376" font-size="14" font-weight="700" fill="#b45309">네 호가를 비우고서야 300주 체결</text>
