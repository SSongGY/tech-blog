  <text x="600" y="247" font-size="13" fill="#b45309" text-anchor="middle">스프레드 300원</text>

  <text x="40" y="436" font-size="13" fill="#555">호가가격단위는 50원으로 같지만 다라정밀은 중간 호가가 비어 있어 한 단계가 150~200원씩 건너뛴다.</text>
  <text x="40" y="456" font-size="13" fill="#555">잔량과 체결 수량은 비용 구조를 보이려고 만든 가상 값이다.</text>
