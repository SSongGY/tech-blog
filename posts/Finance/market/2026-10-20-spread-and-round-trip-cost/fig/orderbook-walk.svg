<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fdfdfb"/>

  <text x="40" y="34" font-size="17" font-weight="700" fill="#1b1b1b">같은 300주 시장가 매수가 훑고 지나가는 호가</text>
  <text x="40" y="56" font-size="13" fill="#555">두 가상 종목은 현재가대가 같아 호가가격단위도 50원으로 같다. 다른 것은 호가에 깔린 잔량뿐이다.</text>

  <!-- 왼쪽 패널 -->
