  <text x="460" y="247" font-size="13" fill="#b45309" opacity="0"> </text>

  <rect x="460" y="258" width="380" height="26" fill="#f4f6f8" stroke="#d9dde2"/>
  <text x="480" y="276" font-size="13" fill="#2d6a4f">매수</text>
