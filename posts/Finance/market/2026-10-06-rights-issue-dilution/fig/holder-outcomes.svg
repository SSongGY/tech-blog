<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="440" fill="#ffffff"/>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">10% 주주 갑의 순재산과 지분율 — 증자 전 100억원 (1억 = 5px)</text>

  <!-- 범례 -->
  <rect x="230" y="46" width="16" height="16" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="252" y="59" font-size="13" fill="#1b1b1b">남은 순재산</text>
  <rect x="350" y="46" width="16" height="16" fill="#ffccd5" stroke="#9d0208"/>
  <text x="372" y="59" font-size="13" fill="#1b1b1b">줄어든 몫</text>
  <text x="560" y="59" font-size="13" fill="#495057">오른쪽 숫자: 순재산(억원) · 지분율</text>

  <!-- 증자 전 기준선 -->
  <line x1="730" y1="74" x2="730" y2="350" stroke="#495057" stroke-dasharray="4 3"/>
  <text x="730" y="366" text-anchor="middle" font-size="13" fill="#495057">100억</text>

  <!-- 주주배정 청약 -->
  <text x="40" y="100" font-size="14" fill="#1b1b1b">주주배정 — 청약</text>
  <rect x="230" y="84" width="500" height="24" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="742" y="101" font-size="13" fill="#2d6a4f">100.00 · 10.00%</text>

  <!-- 주주배정 권리 매각 -->
  <text x="40" y="150" font-size="14" fill="#1b1b1b">주주배정 — 권리 매각</text>
  <rect x="230" y="134" width="500" height="24" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="742" y="151" font-size="13" fill="#2d6a4f">100.00 · 8.33%</text>

  <!-- 주주배정 실권 -->
  <text x="40" y="200" font-size="14" fill="#1b1b1b">주주배정 — 실권</text>
  <rect x="230" y="184" width="476" height="24" fill="#d8f3dc" stroke="#2d6a4f"/>
  <rect x="706" y="184" width="24" height="24" fill="#ffccd5" stroke="#9d0208"/>
  <text x="742" y="201" font-size="13" fill="#9d0208">95.25 · 8.33%</text>

  <!-- 제3자배정 -->
  <text x="40" y="250" font-size="14" fill="#1b1b1b">제3자배정 할인 10%</text>
  <rect x="230" y="234" width="492" height="24" fill="#d8f3dc" stroke="#2d6a4f"/>
  <rect x="722" y="234" width="8" height="24" fill="#ffccd5" stroke="#9d0208"/>
  <text x="742" y="251" font-size="13" fill="#9d0208">98.33 · 8.33%</text>

  <!-- 일반공모 -->
  <text x="40" y="300" font-size="14" fill="#1b1b1b">일반공모 할인 30%</text>
  <rect x="230" y="284" width="475" height="24" fill="#d8f3dc" stroke="#2d6a4f"/>
  <rect x="705" y="284" width="25" height="24" fill="#ffccd5" stroke="#9d0208"/>
  <text x="742" y="301" font-size="13" fill="#9d0208">95.00 · 8.33%</text>

  <line x1="30" y1="380" x2="850" y2="380" stroke="#ced4da"/>
  <text x="40" y="404" font-size="13" fill="#1b1b1b">지분율이 같이 8.33%로 줄어도 순재산은 갈린다. 재산을 줄이는 것은 지분율이 아니라 시가보다 싼 발행가다.</text>
  <text x="40" y="426" font-size="13" fill="#495057">가상 회사 가나전자 · 발행주식 1,000만 주, 기준주가 10,000원, 신주 200만 주. 금액은 code/output.txt [2]에서 옮겼다.</text>
</svg>
