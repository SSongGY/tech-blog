<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
  </defs>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">ETF 가격이 지수에서 멀어지는 두 군데</text>

  <!-- 윗줄: 지수 → NAV → 시장가격 -->
  <rect x="40" y="70" width="190" height="64" rx="6" fill="#f1f3f5" stroke="#495057"/>
  <text x="135" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">기초지수</text>
  <text x="135" y="120" text-anchor="middle" font-size="13" fill="#495057">ETF 가 따르려는 값</text>

  <rect x="345" y="70" width="190" height="64" rx="6" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="440" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">순자산가치 (NAV)</text>
  <text x="440" y="120" text-anchor="middle" font-size="13" fill="#495057">(자산 - 부채) ÷ 좌수</text>

  <rect x="650" y="70" width="190" height="64" rx="6" fill="#cfe2ff" stroke="#495057"/>
  <text x="745" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">거래소 시장가격</text>
  <text x="745" y="120" text-anchor="middle" font-size="13" fill="#495057">투자자끼리 사고판 값</text>

  <line x1="230" y1="102" x2="343" y2="102" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="535" y1="102" x2="648" y2="102" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 두 간극 라벨 -->
  <rect x="200" y="150" width="175" height="62" rx="4" fill="#fff3e0" stroke="#b45309"/>
  <text x="287" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">① 추적차이 · 추적오차</text>
  <text x="287" y="192" text-anchor="middle" font-size="13" fill="#1b1b1b">보수, 복제 방식, 현금</text>
  <text x="287" y="207" text-anchor="middle" font-size="13" fill="#1b1b1b">→ 운용의 결과</text>

  <rect x="505" y="150" width="175" height="62" rx="4" fill="#fff3e0" stroke="#b45309"/>
  <text x="592" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">② 괴리율</text>
  <text x="592" y="192" text-anchor="middle" font-size="13" fill="#1b1b1b">호가 공백, 수급 쏠림</text>
  <text x="592" y="207" text-anchor="middle" font-size="13" fill="#1b1b1b">→ 거래의 결과</text>

  <!-- 아랫줄: 괴리를 줄이는 두 주체 -->
  <rect x="345" y="270" width="190" height="64" rx="6" fill="#f1f3f5" stroke="#495057"/>
  <text x="440" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">지정참가회사 (AP)</text>
  <text x="440" y="320" text-anchor="middle" font-size="13" fill="#495057">바스켓 ↔ ETF 설정·환매</text>

  <rect x="650" y="270" width="190" height="64" rx="6" fill="#f1f3f5" stroke="#495057"/>
  <text x="745" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">유동성공급자 (LP)</text>
  <text x="745" y="320" text-anchor="middle" font-size="13" fill="#495057">NAV 근처에 매수·매도 호가</text>

  <line x1="440" y1="268" x2="440" y2="136" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="745" y1="268" x2="745" y2="136" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="242" text-anchor="end" font-size="13" fill="#2d6a4f">괴리 &gt; 비용일 때</text>
  <text x="430" y="258" text-anchor="end" font-size="13" fill="#2d6a4f">좌수를 늘리고 줄임</text>
  <text x="735" y="250" text-anchor="end" font-size="13" fill="#2d6a4f">상시 호가</text>

  <line x1="30" y1="362" x2="850" y2="362" stroke="#ced4da"/>
  <text x="40" y="390" font-size="13" fill="#495057">①은 NAV 자체가 지수에서 멀어지는 것으로, 투자자가 언제 사고팔든 똑같이 겪는다.</text>
  <text x="40" y="410" font-size="13" fill="#495057">②는 시장가격이 NAV 에서 멀어지는 것으로, 사고판 시점에 따라 누구는 겪고 누구는 겪지 않는다.</text>
  <text x="40" y="430" font-size="13" fill="#495057">AP 의 차익거래는 괴리가 거래 비용보다 클 때만 일어나므로, 그보다 작은 괴리는 LP 호가가 좁힌다.</text>
  <text x="40" y="450" font-size="13" fill="#495057">숫자 예시는 가상 ETF 의 code/output.txt [2]~[4]에 있다.</text>
</svg>
