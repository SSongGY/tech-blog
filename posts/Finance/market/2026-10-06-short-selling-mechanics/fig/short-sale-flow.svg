<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
  </defs>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">차입공매도 한 번의 흐름 — 주식은 빌려 오고, 갚을 때는 시장에서 되산다</text>

  <!-- 노드 -->
  <rect x="40" y="130" width="170" height="70" rx="6" fill="#f8f9fa" stroke="#495057"/>
  <text x="125" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">대여자</text>
  <text x="125" y="182" text-anchor="middle" font-size="13" fill="#495057">주식을 가진 기관 등</text>

  <rect x="355" y="130" width="170" height="70" rx="6" fill="#fff8eb" stroke="#b45309"/>
  <text x="440" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">공매도자</text>
  <text x="440" y="182" text-anchor="middle" font-size="13" fill="#495057">주가 하락을 예상</text>

  <rect x="670" y="130" width="170" height="70" rx="6" fill="#f8f9fa" stroke="#495057"/>
  <text x="755" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">증권시장</text>
  <text x="755" y="182" text-anchor="middle" font-size="13" fill="#495057">다른 투자자</text>

  <!-- ① 대여 -->
  <line x1="210" y1="145" x2="353" y2="145" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="282" y="80" text-anchor="middle" font-size="13" fill="#1b1b1b">① 주식 1,000주 대여</text>
  <text x="282" y="98" text-anchor="middle" font-size="13" fill="#495057">기본 90일 · 연장 포함 12개월 이내</text>
  <line x1="282" y1="104" x2="282" y2="143" stroke="#ced4da" stroke-dasharray="3,3"/>

  <!-- 담보 -->
  <line x1="355" y1="188" x2="212" y2="188" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="282" y="222" text-anchor="middle" font-size="13" fill="#1b1b1b">담보: 평가액의 105% 유지</text>

  <!-- ② 매도 -->
  <line x1="525" y1="145" x2="668" y2="145" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="597" y="80" text-anchor="middle" font-size="13" fill="#1b1b1b">② 10,000원에 매도</text>
  <text x="597" y="98" text-anchor="middle" font-size="13" fill="#495057">직전가 이하 호가 금지(원칙)</text>
  <line x1="597" y1="104" x2="597" y2="143" stroke="#ced4da" stroke-dasharray="3,3"/>

  <!-- ③ 재매수 -->
  <line x1="670" y1="188" x2="527" y2="188" stroke="#9d0208" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="597" y="222" text-anchor="middle" font-size="13" fill="#1b1b1b">③ 그때 가격으로 되산다</text>

  <!-- ④ 상환 -->
  <path d="M440,200 L440,270 L125,270 L125,203" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="282" y="262" text-anchor="middle" font-size="13" fill="#1b1b1b">④ 같은 수량 상환 + 대차 수수료</text>

  <line x1="30" y1="300" x2="850" y2="300" stroke="#ced4da"/>
  <text x="40" y="324" font-size="13" fill="#1b1b1b">손익은 ②의 매도가격과 ③의 되사는 가격의 차이에서 수수료를 뺀 값이다. ③의 가격은 정해져 있지 않다.</text>
  <text x="40" y="346" font-size="13" fill="#1b1b1b">빌리지 않고 파는 무차입공매도는 금지다. 위 흐름은 빌린 주식으로 결제하는 차입공매도다.</text>
  <text x="40" y="368" font-size="13" fill="#495057">가상 종목 가나전자 · 수량과 가격은 code/output.txt [1]에서 옮겼다.</text>
</svg>
