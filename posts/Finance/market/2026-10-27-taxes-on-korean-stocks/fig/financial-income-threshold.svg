<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="880" height="350" fill="#fbfaf7"/>

  <text x="40" y="36" font-size="17" font-weight="bold" fill="#1f2937">금융소득 3,000만원은 어떻게 나뉘어 과세되는가</text>
  <text x="40" y="60" font-size="13" fill="#4b5563">기준금액을 넘는다고 전액이 넘어가지 않는다. 넘어가는 것은 초과분뿐이다</text>

  <!-- row 1 : misconception -->
  <text x="40" y="112" font-size="14" font-weight="bold" fill="#9d0208">흔한 오해</text>
  <rect x="200" y="92" width="600" height="46" rx="5" fill="#fdeaea" stroke="#9d0208" stroke-width="1.6"/>
  <text x="500" y="121" font-size="14" fill="#9d0208" text-anchor="middle">3,000만원 전액을 다른 소득과 합산해 누진세율</text>

  <!-- row 2 : actual -->
  <text x="40" y="192" font-size="14" font-weight="bold" fill="#1b4332">실제</text>
  <rect x="200" y="172" width="400" height="46" rx="5" fill="#d8f0e2" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="400" y="201" font-size="14" fill="#1b4332" text-anchor="middle">2,000만원까지 — 14% 그대로</text>
  <rect x="600" y="172" width="200" height="46" rx="5" fill="#fff7ed" stroke="#b45309" stroke-width="1.6"/>
  <text x="700" y="200" font-size="13" fill="#7c2d12" text-anchor="middle">초과 1,000만원만 합산</text>

  <!-- threshold marker -->
  <line x1="600" y1="80" x2="600" y2="248" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="600" y="268" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">기준금액 2,000만원</text>

  <!-- axis -->
  <line x1="200" y1="236" x2="800" y2="236" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="200" y1="232" x2="200" y2="240" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="800" y1="232" x2="800" y2="240" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="200" y="256" font-size="13" fill="#6b7280" text-anchor="middle">0</text>
  <text x="800" y="256" font-size="13" fill="#6b7280" text-anchor="middle">3,000만원</text>

  <!-- comparison note -->
  <rect x="40" y="286" width="760" height="50" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="56" y="307" font-size="13" fill="#374151">실제 산출세액은 비교과세로 정해진다. ① 금융소득 전액에 14%를 매긴 뒤 다른 소득의 세액을 더한 값과,</text>
  <text x="56" y="326" font-size="13" fill="#374151">② 기준금액까지 14% + 초과분을 다른 소득과 합산한 값 중 큰 쪽이다. 그래서 경계에서 세액이 튀지 않는다.</text>
</svg>
