  <rect x="0" y="0" width="880" height="440" fill="#fbfaf7"/>

  <text x="24" y="40" font-size="18" font-weight="bold" fill="#1b1b1b">하루의 매매거래시간 — 가격이 정해지는 방식으로 나눠 본다</text>
  <text x="24" y="64" font-size="13" fill="#4a4a4a">유가증권시장 기준 · 2026년 9월 14일 시간외접속매매 신설 이후</text>

  <text x="150" y="92" font-size="13" fill="#4a4a4a">장 개시 전 시간외시장 08:00~09:00</text>
  <line x1="179" y1="97" x2="179" y2="104" stroke="#4a4a4a" stroke-width="1.2"/>

