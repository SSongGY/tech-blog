  <text x="500" y="376" font-size="13" fill="#4a4a4a" text-anchor="middle">14시</text>
  <text x="616.7" y="376" font-size="13" fill="#4a4a4a" text-anchor="middle">16시</text>
  <text x="733.3" y="376" font-size="13" fill="#4a4a4a" text-anchor="middle">18시</text>
  <text x="850" y="376" font-size="13" fill="#4a4a4a" text-anchor="middle">20시</text>

  <text x="24" y="406" font-size="13" fill="#1b1b1b">단일가는 모아서 한 번에, 접속은 들어오는 대로 즉시, 종가매매는 이미 정해진 값으로 수량만 맞춘다.</text>
  <text x="24" y="428" font-size="13" fill="#4a4a4a">16시 이후 두 시간짜리 단일가 구간이 네 시간짜리 접속매매로 바뀐 것이 2026년 9월의 변화다.</text>
