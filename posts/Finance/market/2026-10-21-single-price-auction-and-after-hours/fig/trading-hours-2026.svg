  <text x="599" y="180" font-size="13" fill="#2d6a4f">종가 단일가 15:20~15:30</text>

  <rect x="616.7" y="200" width="116.6" height="26" fill="none" stroke="#9d0208" stroke-width="1.4" stroke-dasharray="5 4"/>
