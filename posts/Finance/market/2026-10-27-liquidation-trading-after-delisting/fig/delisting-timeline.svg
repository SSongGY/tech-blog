<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="880" height="360" fill="#fbfaf7"/>

  <text x="40" y="36" font-size="17" font-weight="bold" fill="#1f2937">상장폐지 결정에서 상장폐지일까지 — 구간마다 매매 조건이 다르다</text>
  <text x="40" y="60" font-size="13" fill="#4b5563">장내에서 팔 수 있는 구간은 가운데 7매매거래일 하나뿐이다</text>

  <!-- timeline axis -->
  <line x1="40" y1="100" x2="836" y2="100" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="836,94 852,100 836,106" fill="#9ca3af"/>
  <text x="40" y="88" font-size="13" fill="#6b7280">시간</text>

  <!-- segment 1 -->
  <rect x="40" y="114" width="186" height="60" rx="6" fill="#eef2f7" stroke="#64748b" stroke-width="1.6"/>
  <text x="133" y="140" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">매매거래정지</text>
  <text x="133" y="161" font-size="13" fill="#4b5563" text-anchor="middle">사유 발생 ~ 결정</text>
  <circle cx="40" cy="100" r="5" fill="#64748b"/>

  <!-- segment 2 -->
  <rect x="242" y="114" width="156" height="60" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.6"/>
  <text x="320" y="140" font-size="15" font-weight="bold" fill="#7c2d12" text-anchor="middle">상장폐지 결정</text>
  <text x="320" y="161" font-size="13" fill="#7c2d12" text-anchor="middle">이의신청 · 가처분</text>
  <circle cx="242" cy="100" r="5" fill="#b45309"/>

  <!-- segment 3 -->
  <rect x="414" y="114" width="252" height="60" rx="6" fill="#fdeaea" stroke="#9d0208" stroke-width="2"/>
  <text x="540" y="140" font-size="15" font-weight="bold" fill="#9d0208" text-anchor="middle">정리매매 7매매거래일</text>
  <text x="540" y="161" font-size="13" fill="#9d0208" text-anchor="middle">장내에서 팔 수 있는 마지막 구간</text>
  <circle cx="414" cy="100" r="5" fill="#9d0208"/>

  <!-- segment 4 -->
  <rect x="682" y="114" width="154" height="60" rx="6" fill="#eef2f7" stroke="#64748b" stroke-width="1.6"/>
  <text x="759" y="140" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">상장폐지 이후</text>
  <text x="759" y="161" font-size="13" fill="#4b5563" text-anchor="middle">비상장 주식</text>
  <circle cx="682" cy="100" r="5" fill="#64748b"/>

  <!-- connectors -->
  <path d="M226 144 L240 144" stroke="#9ca3af" stroke-width="1.6"/>
  <path d="M398 144 L412 144" stroke="#9ca3af" stroke-width="1.6"/>
  <path d="M666 144 L680 144" stroke="#9ca3af" stroke-width="1.6"/>

  <!-- condition lists -->
  <text x="52" y="206" font-size="13" fill="#374151">· 장내 매매 불가</text>
  <text x="52" y="228" font-size="13" fill="#374151">· 보유 수량은 그대로</text>
  <text x="52" y="250" font-size="13" fill="#374151">· 시세는 정지 직전 종가</text>

  <text x="254" y="206" font-size="13" fill="#374151">· 정지는 이어진다</text>
  <text x="254" y="228" font-size="13" fill="#374151">· 효력이 정지되면</text>
  <text x="254" y="250" font-size="13" fill="#374151">&#160;&#160;정리매매도 미뤄진다</text>

  <text x="426" y="206" font-size="13" fill="#9d0208">· 가격제한폭 없음</text>
  <text x="426" y="228" font-size="13" fill="#9d0208">· 09:00~15:30 매 30분 단일가매매</text>
  <text x="426" y="250" font-size="13" fill="#9d0208">· 변동성완화장치(VI) 적용 제외</text>
  <text x="426" y="272" font-size="13" fill="#9d0208">· 신용거래 · 대용증권 불가</text>

  <text x="694" y="206" font-size="13" fill="#374151">· 장내 거래 불가</text>
  <text x="694" y="228" font-size="13" fill="#374151">· 주주 지위는 유지</text>
  <text x="694" y="250" font-size="13" fill="#374151">· 시세 공표 없음</text>

  <rect x="40" y="298" width="796" height="40" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="56" y="323" font-size="13" fill="#374151">정리매매 기간은 매매거래일 기준 7일이고, 거래소가 달리 정하면 그에 따른다. 사유에 따라 아예 부여되지 않는 경우도 있다.</text>
</svg>
