<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="500" fill="#fbfbf8"/>

  <text x="24" y="28" font-size="15" fill="#212529" font-weight="bold">주식 수가 줄어드는 세 갈래 — 가상 회사 한결소재</text>
  <text x="24" y="48" font-size="13" fill="#495057">막대 한 칸은 10억 원. 기준선 위는 더하는 항목, 아래는 빼는 항목이다.</text>

  <!-- 범례 -->
  <rect x="404" y="18" width="14" height="14" fill="#40916c"/>
  <text x="424" y="30" font-size="13" fill="#212529">자본금</text>
  <rect x="486" y="18" width="14" height="14" fill="#95d5b2"/>
  <text x="506" y="30" font-size="13" fill="#212529">자본잉여금</text>
  <rect x="594" y="18" width="14" height="14" fill="#9d0208"/>
  <text x="614" y="30" font-size="13" fill="#212529">차감 항목(결손금·감자차손)</text>

  <!-- 기준선 -->
  <line x1="40" y1="290" x2="840" y2="290" stroke="#495057" stroke-width="1.5"/>

  <!-- 1. 감자 전 -->
  <rect x="70" y="65" width="130" height="75" fill="#95d5b2" stroke="#40916c" stroke-width="1.2"/>
  <text x="135" y="108" text-anchor="middle" font-size="13" fill="#1b4332">50억</text>
  <rect x="70" y="140" width="130" height="150" fill="#40916c" stroke="#1b4332" stroke-width="1.2"/>
  <text x="135" y="220" text-anchor="middle" font-size="13" fill="#ffffff">100억</text>
  <rect x="70" y="290" width="130" height="90" fill="#9d0208" stroke="#6a040f" stroke-width="1.2"/>
  <text x="135" y="340" text-anchor="middle" font-size="13" fill="#ffffff">결손 60억</text>
  <text x="135" y="425" text-anchor="middle" font-size="14" fill="#212529" font-weight="bold">감자 전</text>
  <text x="135" y="446" text-anchor="middle" font-size="13" fill="#495057">자본총계 90억</text>
  <text x="135" y="465" text-anchor="middle" font-size="13" fill="#495057">현금 60억</text>
  <text x="135" y="484" text-anchor="middle" font-size="13" fill="#495057">2,000만주 · 액면 500원</text>

  <!-- 2. 액면병합 -->
  <rect x="255" y="65" width="130" height="75" fill="#95d5b2" stroke="#40916c" stroke-width="1.2"/>
  <text x="320" y="108" text-anchor="middle" font-size="13" fill="#1b4332">50억</text>
  <rect x="255" y="140" width="130" height="150" fill="#40916c" stroke="#1b4332" stroke-width="1.2"/>
  <text x="320" y="220" text-anchor="middle" font-size="13" fill="#ffffff">100억</text>
  <rect x="255" y="290" width="130" height="90" fill="#9d0208" stroke="#6a040f" stroke-width="1.2"/>
  <text x="320" y="340" text-anchor="middle" font-size="13" fill="#ffffff">결손 60억</text>
  <text x="320" y="425" text-anchor="middle" font-size="14" fill="#212529" font-weight="bold">A 액면병합 10:1</text>
  <text x="320" y="446" text-anchor="middle" font-size="13" fill="#495057">자본총계 90억</text>
  <text x="320" y="465" text-anchor="middle" font-size="13" fill="#495057">현금 60억</text>
  <text x="320" y="484" text-anchor="middle" font-size="13" fill="#495057">200만주 · 액면 5,000원</text>

  <!-- 3. 무상감자 -->
  <rect x="440" y="155" width="130" height="120" fill="#95d5b2" stroke="#40916c" stroke-width="1.2"/>
  <text x="505" y="220" text-anchor="middle" font-size="13" fill="#1b4332">80억</text>
  <rect x="440" y="275" width="130" height="15" fill="#40916c" stroke="#1b4332" stroke-width="1.2"/>
  <text x="505" y="315" text-anchor="middle" font-size="13" fill="#1b4332">자본금 10억</text>
  <text x="505" y="348" text-anchor="middle" font-size="13" fill="#495057">결손 0</text>
  <text x="505" y="425" text-anchor="middle" font-size="14" fill="#212529" font-weight="bold">B 무상감자 10:1</text>
  <text x="505" y="446" text-anchor="middle" font-size="13" fill="#495057">자본총계 90억</text>
  <text x="505" y="465" text-anchor="middle" font-size="13" fill="#495057">현금 60억</text>
  <text x="505" y="484" text-anchor="middle" font-size="13" fill="#495057">200만주 · 액면 500원</text>

  <!-- 4. 유상감자 -->
  <rect x="625" y="95" width="130" height="75" fill="#95d5b2" stroke="#40916c" stroke-width="1.2"/>
  <text x="690" y="138" text-anchor="middle" font-size="13" fill="#1b4332">50억</text>
  <rect x="625" y="170" width="130" height="120" fill="#40916c" stroke="#1b4332" stroke-width="1.2"/>
  <text x="690" y="235" text-anchor="middle" font-size="13" fill="#ffffff">80억</text>
  <rect x="625" y="290" width="130" height="90" fill="#9d0208" stroke="#6a040f" stroke-width="1.2"/>
  <text x="690" y="340" text-anchor="middle" font-size="13" fill="#ffffff">결손 60억</text>
  <rect x="625" y="380" width="130" height="30" fill="#9d0208" stroke="#6a040f" stroke-width="1.2"/>
  <text x="690" y="400" text-anchor="middle" font-size="13" fill="#ffffff">감자차손 20억</text>
  <text x="690" y="425" text-anchor="middle" font-size="14" fill="#212529" font-weight="bold">C 유상감자 20%</text>
  <text x="690" y="446" text-anchor="middle" font-size="13" fill="#9d0208">자본총계 50억</text>
  <text x="690" y="465" text-anchor="middle" font-size="13" fill="#9d0208">현금 20억</text>
  <text x="690" y="484" text-anchor="middle" font-size="13" fill="#495057">1,600만주 · 액면 500원</text>
</svg>
