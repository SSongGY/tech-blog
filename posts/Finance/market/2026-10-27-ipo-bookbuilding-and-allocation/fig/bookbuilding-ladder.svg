<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#fbfbf8"/>

  <text x="24" y="32" font-size="15" fill="#212529" font-weight="bold">가격을 높은 쪽부터 훑으며 쌓은 누적 수요 — 가상 회사 마루소재</text>
  <text x="24" y="52" font-size="13" fill="#495057">가로 막대는 그 가격 이상으로 들어온 주문을 모두 더한 수량이다.</text>

  <!-- 공모희망가격 밴드 -->
  <rect x="96" y="110" width="676" height="184" fill="#eef2f0"/>
  <text x="782" y="196" font-size="13" fill="#2d6a4f">공모희망가격</text>
  <text x="782" y="214" font-size="13" fill="#2d6a4f">밴드 구간</text>

  <!-- 공모예정주식수 기준선 -->
  <line x1="155" y1="66" x2="155" y2="354" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="160" y="370" font-size="13" fill="#b45309">공모예정주식수 2,000,000주</text>

  <!-- 16,000 -->
  <text x="88" y="92" text-anchor="end" font-size="13.5" fill="#212529">16,000원</text>
  <rect x="150" y="70" width="135" height="34" rx="3" fill="#95a5a6" stroke="#495057" stroke-width="1.2"/>
  <text x="297" y="92" font-size="13" fill="#212529">14,000,000주 · 7.0:1</text>

  <!-- 15,000 -->
  <text x="88" y="138" text-anchor="end" font-size="13.5" fill="#1b4332" font-weight="bold">15,000원</text>
  <rect x="150" y="116" width="356" height="34" rx="3" fill="#2d6a4f" stroke="#1b4332" stroke-width="1.2"/>
  <text x="518" y="138" font-size="13" fill="#1b4332" font-weight="bold">37,000,000주 · 18.5:1 · 확정 공모가</text>

  <!-- 14,000 -->
  <text x="88" y="184" text-anchor="end" font-size="13.5" fill="#212529">14,000원</text>
  <rect x="150" y="162" width="443" height="34" rx="3" fill="#95a5a6" stroke="#495057" stroke-width="1.2"/>
  <text x="605" y="184" font-size="13" fill="#212529">46,000,000주 · 23.0:1</text>

  <!-- 13,000 -->
  <text x="88" y="230" text-anchor="end" font-size="13.5" fill="#212529">13,000원</text>
  <rect x="150" y="208" width="481" height="34" rx="3" fill="#95a5a6" stroke="#495057" stroke-width="1.2"/>
  <text x="643" y="230" font-size="13" fill="#212529">50,000,000주 · 25.0:1</text>

  <!-- 12,000 -->
  <text x="88" y="276" text-anchor="end" font-size="13.5" fill="#212529">12,000원</text>
  <rect x="150" y="254" width="506" height="34" rx="3" fill="#95a5a6" stroke="#495057" stroke-width="1.2"/>
  <text x="668" y="276" font-size="13" fill="#212529">52,500,000주 · 26.2:1</text>

  <!-- 11,000 -->
  <text x="88" y="322" text-anchor="end" font-size="13.5" fill="#212529">11,000원</text>
  <rect x="150" y="300" width="520" height="34" rx="3" fill="#95a5a6" stroke="#495057" stroke-width="1.2"/>
  <text x="682" y="322" font-size="13" fill="#212529">54,000,000주 · 27.0:1</text>
</svg>
