<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">자본 안에서 무엇이 움직이는가 (억원, 1억 = 0.6px)</text>

  <!-- 범례 -->
  <rect x="200" y="46" width="16" height="16" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="222" y="59" font-size="13" fill="#1b1b1b">자본금</text>
  <rect x="300" y="46" width="16" height="16" fill="#fff3e0" stroke="#b45309"/>
  <text x="322" y="59" font-size="13" fill="#1b1b1b">주식발행초과금</text>
  <rect x="450" y="46" width="16" height="16" fill="#e9ecef" stroke="#495057"/>
  <text x="472" y="59" font-size="13" fill="#1b1b1b">이익잉여금</text>

  <!-- 액면분할 -->
  <text x="40" y="96" font-size="15" font-weight="bold" fill="#1b1b1b">① 액면분할 1:10 — 자차소재</text>
  <text x="40" y="128" font-size="14" fill="#1b1b1b">분할 전</text>
  <rect x="140" y="112" width="60" height="26" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="170" y="130" text-anchor="middle" font-size="13" fill="#1b1b1b">100</text>
  <rect x="200" y="112" width="180" height="26" fill="#fff3e0" stroke="#b45309"/>
  <text x="290" y="130" text-anchor="middle" font-size="13" fill="#1b1b1b">300</text>
  <rect x="380" y="112" width="300" height="26" fill="#e9ecef" stroke="#495057"/>
  <text x="530" y="130" text-anchor="middle" font-size="13" fill="#1b1b1b">500</text>
  <text x="690" y="130" font-size="13" fill="#1b1b1b">액면 5,000원 × 200만 주</text>

  <text x="40" y="166" font-size="14" fill="#1b1b1b">분할 후</text>
  <rect x="140" y="150" width="60" height="26" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="170" y="168" text-anchor="middle" font-size="13" fill="#1b1b1b">100</text>
  <rect x="200" y="150" width="180" height="26" fill="#fff3e0" stroke="#b45309"/>
  <text x="290" y="168" text-anchor="middle" font-size="13" fill="#1b1b1b">300</text>
  <rect x="380" y="150" width="300" height="26" fill="#e9ecef" stroke="#495057"/>
  <text x="530" y="168" text-anchor="middle" font-size="13" fill="#1b1b1b">500</text>
  <text x="690" y="168" font-size="13" fill="#2d6a4f">액면 500원 × 2,000만 주</text>
  <text x="140" y="200" font-size="13" fill="#495057">자본 항목은 하나도 움직이지 않는다. 액면가와 주식 수만 바뀌고 그 곱(자본금)은 같다.</text>

  <line x1="30" y1="220" x2="850" y2="220" stroke="#ced4da"/>

  <!-- 무상증자 -->
  <text x="40" y="250" font-size="15" font-weight="bold" fill="#1b1b1b">② 무상증자 1:1 — 카타산업</text>
  <text x="40" y="282" font-size="14" fill="#1b1b1b">증자 전</text>
  <rect x="140" y="266" width="30" height="26" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="155" y="284" text-anchor="middle" font-size="13" fill="#1b1b1b">50</text>
  <rect x="170" y="266" width="180" height="26" fill="#fff3e0" stroke="#b45309"/>
  <text x="260" y="284" text-anchor="middle" font-size="13" fill="#1b1b1b">300</text>
  <rect x="350" y="266" width="240" height="26" fill="#e9ecef" stroke="#495057"/>
  <text x="470" y="284" text-anchor="middle" font-size="13" fill="#1b1b1b">400</text>
  <text x="600" y="284" font-size="13" fill="#1b1b1b">액면 500원 × 1,000만 주</text>

  <text x="40" y="340" font-size="14" fill="#1b1b1b">증자 후</text>
  <rect x="140" y="324" width="60" height="26" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="170" y="342" text-anchor="middle" font-size="13" fill="#1b1b1b">100</text>
  <rect x="200" y="324" width="150" height="26" fill="#fff3e0" stroke="#b45309"/>
  <text x="275" y="342" text-anchor="middle" font-size="13" fill="#1b1b1b">250</text>
  <rect x="350" y="324" width="240" height="26" fill="#e9ecef" stroke="#495057"/>
  <text x="470" y="342" text-anchor="middle" font-size="13" fill="#1b1b1b">400</text>
  <text x="600" y="342" font-size="13" fill="#b45309">액면 500원 × 2,000만 주</text>

  <!-- 전입 화살표 -->
  <line x1="320" y1="294" x2="180" y2="322" stroke="#b45309" stroke-width="2"/>
  <polygon points="180,322 192,312 194,322" fill="#b45309"/>
  <text x="330" y="312" font-size="13" fill="#b45309">50억 자본금 전입 (상법 제461조)</text>
  <text x="600" y="312" font-size="13" fill="#b45309">= 신주 1,000만 주 × 500원</text>

  <text x="140" y="380" font-size="13" fill="#495057">자본금은 늘고 주식발행초과금은 같은 만큼 줄어 자본총계 750억은 그대로다.</text>

  <line x1="30" y1="398" x2="850" y2="398" stroke="#ced4da"/>
  <text x="40" y="424" font-size="13" fill="#1b1b1b">두 경우 모두 회사에 들어오거나 나간 돈이 없다. 이론 시가총액과 지분율은 유지되고 주가만 나뉜다.</text>
  <text x="40" y="448" font-size="13" fill="#495057">금액은 가상 회사의 code/output.txt [1]·[2]에서 옮겼다.</text>
</svg>
