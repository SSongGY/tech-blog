<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="380" fill="#fbfaf7"/>

  <text x="24" y="30" font-size="16" font-weight="bold" fill="#1f2937">의결권 분모에서 우선주가 빠지면 — 마바화학 1,000만 주</text>
  <text x="24" y="52" font-size="13" fill="#4b5563">같은 320만 주를 들고 있어도 분모가 짧아지면 지분율이 올라간다. 막대 길이는 주식 수에 비례한다</text>

  <!-- 발행주식총수 -->
  <text x="24" y="86" font-size="14" font-weight="bold" fill="#1f2937">발행주식총수 10,000,000주</text>
  <rect x="100" y="100" width="576" height="52" fill="#dfe7e3" stroke="#2d6a4f" stroke-width="1.4"/>
  <rect x="676" y="100" width="144" height="52" fill="#f0e6d2" stroke="#b45309" stroke-width="1.4"/>
  <rect x="100" y="100" width="230.4" height="52" fill="#2d6a4f"/>
  <text x="215" y="131" font-size="13" fill="#ffffff" text-anchor="middle">지배주주 3,200,000주</text>
  <text x="503" y="131" font-size="13" fill="#2d6a4f" text-anchor="middle">그 밖의 보통주 4,800,000주</text>
  <text x="748" y="124" font-size="13" fill="#b45309" text-anchor="middle">우선주</text>
  <text x="748" y="142" font-size="13" fill="#b45309" text-anchor="middle">2,000,000주</text>
  <text x="100" y="172" font-size="13" fill="#374151">지배주주 지분율 32.00%</text>

  <!-- 상법 1/4 한도선 -->
  <line x1="640" y1="96" x2="640" y2="186" stroke="#9d0208" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="640" y="202" font-size="13" fill="#9d0208" text-anchor="middle">상법 1/4 한도 — 이 선 오른쪽이 2,500,000주</text>

  <!-- 의결권 분모 -->
  <text x="24" y="246" font-size="14" font-weight="bold" fill="#1f2937">의결권 기준 분모 8,000,000주</text>
  <rect x="100" y="260" width="576" height="52" fill="#dfe7e3" stroke="#2d6a4f" stroke-width="1.4"/>
  <rect x="100" y="260" width="230.4" height="52" fill="#2d6a4f"/>
  <text x="215" y="291" font-size="13" fill="#ffffff" text-anchor="middle">지배주주 3,200,000주</text>
  <text x="503" y="291" font-size="13" fill="#2d6a4f" text-anchor="middle">그 밖의 보통주 4,800,000주</text>
  <text x="692" y="291" font-size="13" fill="#6b7280">우선주는 분모에서 빠진다</text>
  <text x="100" y="332" font-size="13" fill="#374151">지배주주 지분율 40.00% — 같은 주식 수로 8.00%p 가 올라간다</text>

  <text x="24" y="366" font-size="13" fill="#6b7280">색이 칠해진 막대 길이는 위아래가 같다. 달라진 것은 분모뿐이다</text>
</svg>
