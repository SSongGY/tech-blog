<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 444" width="880" height="444" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="444" fill="#fdfdfb"/>

  <text x="40" y="34" font-size="17" font-weight="700" fill="#1b1b1b">괴리율이 커질 때 차례로 걸리는 네 개의 문턱</text>
  <text x="40" y="56" font-size="13" fill="#555">괴리율은 절댓값으로 본다. 국내형과 해외형은 문턱의 자리는 같고 숫자만 다르다.</text>

  <!-- 구간 띠 -->
  <rect x="110" y="96" width="140" height="34" fill="#dff0e6" stroke="#2d6a4f" stroke-width="1.2"/>
  <rect x="250" y="96" width="130" height="34" fill="#f2f7df" stroke="#2d6a4f" stroke-width="1.2"/>
  <rect x="380" y="96" width="180" height="34" fill="#fdf0d9" stroke="#b45309" stroke-width="1.2"/>
  <rect x="560" y="96" width="180" height="34" fill="#f7dcdc" stroke="#9d0208" stroke-width="1.2"/>
  <rect x="740" y="96" width="100" height="34" fill="#efc7c7" stroke="#9d0208" stroke-width="1.2"/>

  <text x="180" y="118" font-size="13" fill="#2d6a4f" text-anchor="middle">조치 없음</text>
  <text x="315" y="118" font-size="13" fill="#2d6a4f" text-anchor="middle">공시만</text>
  <text x="470" y="118" font-size="13" fill="#b45309" text-anchor="middle">의무 위반</text>
  <text x="650" y="118" font-size="13" fill="#9d0208" text-anchor="middle">지정 절차</text>
  <text x="790" y="118" font-size="13" fill="#9d0208" text-anchor="middle">정지까지</text>

  <!-- 문턱 세로선 -->
  <line x1="250" y1="96" x2="250" y2="286" stroke="#2d6a4f" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="380" y1="96" x2="380" y2="286" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="560" y1="96" x2="560" y2="286" stroke="#9d0208" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="740" y1="96" x2="740" y2="286" stroke="#9d0208" stroke-width="1.6" stroke-dasharray="5 4"/>

  <!-- 국내형 수치 축 -->
  <line x1="110" y1="170" x2="840" y2="170" stroke="#1b1b1b" stroke-width="1.4"/>
  <text x="100" y="175" font-size="13" font-weight="700" fill="#1b1b1b" text-anchor="end">국내형</text>
  <circle cx="250" cy="170" r="5" fill="#2d6a4f"/>
  <circle cx="380" cy="170" r="5" fill="#b45309"/>
  <circle cx="560" cy="170" r="5" fill="#9d0208"/>
  <circle cx="740" cy="170" r="5" fill="#9d0208"/>
  <text x="250" y="160" font-size="13" font-weight="700" fill="#2d6a4f" text-anchor="middle">1%</text>
  <text x="380" y="160" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">2%</text>
  <text x="560" y="160" font-size="13" font-weight="700" fill="#9d0208" text-anchor="middle">4%</text>
  <text x="740" y="160" font-size="13" font-weight="700" fill="#9d0208" text-anchor="middle">6%</text>

  <!-- 해외형 수치 축 -->
  <line x1="110" y1="214" x2="840" y2="214" stroke="#1b1b1b" stroke-width="1.4"/>
  <text x="100" y="219" font-size="13" font-weight="700" fill="#1b1b1b" text-anchor="end">해외형</text>
  <circle cx="250" cy="214" r="5" fill="#2d6a4f"/>
  <circle cx="380" cy="214" r="5" fill="#b45309"/>
  <circle cx="560" cy="214" r="5" fill="#9d0208"/>
  <circle cx="740" cy="214" r="5" fill="#9d0208"/>
  <text x="250" y="204" font-size="13" font-weight="700" fill="#2d6a4f" text-anchor="middle">2%</text>
  <text x="380" y="204" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">5%</text>
  <text x="560" y="204" font-size="13" font-weight="700" fill="#9d0208" text-anchor="middle">10%</text>
  <text x="740" y="204" font-size="13" font-weight="700" fill="#9d0208" text-anchor="middle">15%</text>

  <!-- 문턱 이름 -->
  <text x="250" y="248" font-size="13" font-weight="700" fill="#2d6a4f" text-anchor="middle">공시선</text>
  <text x="380" y="248" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">관리의무 범위</text>
  <text x="560" y="248" font-size="13" font-weight="700" fill="#9d0208" text-anchor="middle">의무의 2배</text>
  <text x="740" y="248" font-size="13" font-weight="700" fill="#9d0208" text-anchor="middle">의무의 3배</text>
  <text x="250" y="268" font-size="13" fill="#555" text-anchor="middle">넘으면 공시</text>
  <text x="380" y="268" font-size="13" fill="#555" text-anchor="middle">LP 가 안으로</text>
  <text x="560" y="268" font-size="13" fill="#555" text-anchor="middle">적출·지정예고</text>
  <text x="740" y="268" font-size="13" fill="#555" text-anchor="middle">단일가 마지막 날</text>

  <!-- 지정 절차 -->
  <rect x="110" y="300" width="730" height="42" rx="6" fill="#ffffff" stroke="#9d0208" stroke-width="1.4"/>
  <text x="130" y="326" font-size="13" fill="#1b1b1b">2배 초과 → 적출·지정예고 → 예고일부터 10거래일 이내 다시 2배 초과 → 투자유의종목 지정 → 단일가매매 3거래일</text>

  <rect x="110" y="352" width="355" height="42" rx="6" fill="#dff0e6" stroke="#2d6a4f" stroke-width="1.4"/>
  <text x="130" y="378" font-size="13" fill="#2d6a4f">1배 이하가 3거래일 연속이면 지정 해제</text>

  <rect x="485" y="352" width="355" height="42" rx="6" fill="#f7dcdc" stroke="#9d0208" stroke-width="1.4"/>
  <text x="505" y="378" font-size="13" fill="#9d0208">마지막 날 3배 이상이면 1거래일 거래정지</text>

  <text x="110" y="420" font-size="13" fill="#555">가로 자리는 문턱의 순서를 보인 것이고 수치에 비례하지 않는다.</text>
</svg>
