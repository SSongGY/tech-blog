<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">주가가 높은 쪽과 회사 값이 큰 쪽이 뒤집힌다</text>

  <!-- 주가 비교: 1만원 = 1px -->
  <text x="40" y="70" font-size="15" font-weight="bold" fill="#1b1b1b">① 주가 (1만원 = 1px)</text>
  <text x="40" y="102" font-size="14" fill="#1b1b1b">가나전자</text>
  <rect x="160" y="86" width="5" height="24" fill="#e9ecef" stroke="#495057"/>
  <text x="175" y="104" font-size="13" fill="#1b1b1b">50,000원</text>
  <text x="40" y="138" font-size="14" fill="#1b1b1b">다라바이오</text>
  <rect x="160" y="122" width="50" height="24" fill="#e9ecef" stroke="#495057"/>
  <text x="220" y="140" font-size="13" fill="#1b1b1b">500,000원 — 10배 높다</text>

  <!-- 곱하기 -->
  <text x="440" y="176" text-anchor="middle" font-size="14" fill="#b45309" font-weight="bold">× 상장주식수 (가나전자 1억 주, 다라바이오 200만 주)</text>

  <!-- 시가총액 비교: 100억 = 1px -->
  <text x="40" y="214" font-size="15" font-weight="bold" fill="#1b1b1b">② 시가총액 (100억원 = 1px)</text>
  <text x="40" y="246" font-size="14" fill="#1b1b1b">가나전자</text>
  <rect x="160" y="230" width="500" height="24" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="670" y="248" font-size="13" fill="#1b1b1b">5조원 — 5배 크다</text>
  <text x="40" y="282" font-size="14" fill="#1b1b1b">다라바이오</text>
  <rect x="160" y="266" width="100" height="24" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="270" y="284" font-size="13" fill="#1b1b1b">1조원</text>

  <line x1="30" y1="312" x2="850" y2="312" stroke="#ced4da"/>

  <!-- 자기주식 -->
  <text x="40" y="342" font-size="15" font-weight="bold" fill="#1b1b1b">③ 어느 주식 수를 곱하는가 — 마바물산 상장주식 1,000만 주 (10만 주 = 6px)</text>
  <rect x="160" y="360" width="540" height="28" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="170" y="379" font-size="13" fill="#1b1b1b">유통주식 900만 주 → 시가총액 2,700억 · 순이익 대비 10.0배</text>
  <rect x="700" y="360" width="60" height="28" fill="#fff3e0" stroke="#b45309"/>
  <text x="730" y="379" text-anchor="middle" font-size="13" fill="#b45309">자기주식</text>
  <text x="770" y="379" font-size="13" fill="#b45309">100만 주</text>
  <text x="40" y="379" font-size="14" fill="#1b1b1b">상장주식</text>

  <text x="40" y="418" font-size="13" fill="#495057">상장주식수를 다 곱하면 3,000억 · 11.1배. EPS 분모(유통보통주식수)에는 자기주식이 빠지므로</text>
  <text x="40" y="438" font-size="13" fill="#495057">주가 ÷ EPS(10.0배)와 맞추려면 자기주식을 뺀 시가총액을 쓴다.</text>
  <text x="40" y="458" font-size="13" fill="#495057">숫자는 가상 회사의 code/output.txt [1]·[3]에서 옮겼다.</text>
</svg>
