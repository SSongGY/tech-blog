<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="500" fill="#ffffff"/>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">가나전자 호가창 (09:01:00, 매수 I 접수 직후) — 두 주문이 호가를 소진하는 순서</text>

  <!-- 열 머리 -->
  <text x="300" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d0208">매도 잔량 (접수 순)</text>
  <text x="440" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">가격</text>
  <text x="580" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">매수 잔량 (접수 순)</text>

  <!-- 매도 호가 -->
  <rect x="220" y="80" width="160" height="34" fill="#fff5f5" stroke="#9d0208"/>
  <text x="300" y="102" text-anchor="middle" font-size="13" fill="#1b1b1b">E 500</text>
  <rect x="390" y="80" width="100" height="34" fill="#f8f9fa" stroke="#495057"/>
  <text x="440" y="102" text-anchor="middle" font-size="14" fill="#1b1b1b">10,060</text>

  <rect x="220" y="120" width="160" height="34" fill="#fff5f5" stroke="#9d0208"/>
  <text x="300" y="142" text-anchor="middle" font-size="13" fill="#1b1b1b">D 300</text>
  <rect x="390" y="120" width="100" height="34" fill="#f8f9fa" stroke="#495057"/>
  <text x="440" y="142" text-anchor="middle" font-size="14" fill="#1b1b1b">10,050</text>

  <rect x="220" y="160" width="160" height="34" fill="#fff5f5" stroke="#9d0208"/>
  <text x="300" y="182" text-anchor="middle" font-size="13" fill="#1b1b1b">B 200 → C 150</text>
  <rect x="390" y="160" width="100" height="34" fill="#f8f9fa" stroke="#495057"/>
  <text x="440" y="182" text-anchor="middle" font-size="14" fill="#1b1b1b">10,040</text>

  <!-- 매수 호가 -->
  <rect x="390" y="210" width="100" height="34" fill="#f8f9fa" stroke="#495057"/>
  <text x="440" y="232" text-anchor="middle" font-size="14" fill="#1b1b1b">10,030</text>
  <rect x="500" y="210" width="160" height="34" fill="#f1faf3" stroke="#2d6a4f"/>
  <text x="580" y="232" text-anchor="middle" font-size="13" fill="#1b1b1b">I 100</text>

  <rect x="390" y="250" width="100" height="34" fill="#f8f9fa" stroke="#495057"/>
  <text x="440" y="272" text-anchor="middle" font-size="14" fill="#1b1b1b">10,020</text>
  <rect x="500" y="250" width="160" height="34" fill="#f1faf3" stroke="#2d6a4f"/>
  <text x="580" y="272" text-anchor="middle" font-size="13" fill="#1b1b1b">F 400</text>

  <rect x="390" y="290" width="100" height="34" fill="#f8f9fa" stroke="#495057"/>
  <text x="440" y="312" text-anchor="middle" font-size="14" fill="#1b1b1b">10,010</text>
  <rect x="500" y="290" width="160" height="34" fill="#f1faf3" stroke="#2d6a4f"/>
  <text x="580" y="312" text-anchor="middle" font-size="13" fill="#1b1b1b">G 300</text>

  <rect x="390" y="330" width="100" height="34" fill="#f8f9fa" stroke="#495057"/>
  <text x="440" y="352" text-anchor="middle" font-size="14" fill="#1b1b1b">10,000</text>
  <rect x="500" y="330" width="160" height="34" fill="#f1faf3" stroke="#2d6a4f"/>
  <text x="580" y="352" text-anchor="middle" font-size="13" fill="#1b1b1b">H 600</text>

  <!-- 스프레드 -->
  <text x="300" y="232" text-anchor="middle" font-size="13" fill="#495057">스프레드 10원</text>

  <!-- J: 시장가 매수 450 — 매도 쪽을 아래에서 위로 -->
  <text x="30" y="166" font-size="14" font-weight="bold" fill="#b45309">J 시장가 매수 450</text>
  <line x1="200" y1="190" x2="200" y2="128" stroke="#b45309" stroke-width="3"/>
  <polygon points="200,120 193,132 207,132" fill="#b45309"/>
  <text x="30" y="188" font-size="13" fill="#1b1b1b">① B 200 @10,040</text>
  <text x="30" y="208" font-size="13" fill="#1b1b1b">② C 150 @10,040</text>
  <text x="30" y="228" font-size="13" fill="#1b1b1b">③ D 100 @10,050</text>
  <text x="30" y="248" font-size="13" fill="#495057">평균 10,042.22원</text>

  <!-- K: 매도 지정가 10,010 × 600 — 매수 쪽을 위에서 아래로 -->
  <text x="690" y="216" font-size="14" font-weight="bold" fill="#b45309">K 매도 지정가</text>
  <text x="690" y="234" font-size="14" font-weight="bold" fill="#b45309">10,010 × 600</text>
  <line x1="676" y1="214" x2="676" y2="310" stroke="#b45309" stroke-width="3"/>
  <polygon points="676,318 669,306 683,306" fill="#b45309"/>
  <text x="690" y="258" font-size="13" fill="#1b1b1b">④ I 100 @10,030</text>
  <text x="690" y="278" font-size="13" fill="#1b1b1b">⑤ F 400 @10,020</text>
  <text x="690" y="298" font-size="13" fill="#1b1b1b">⑥ G 100 @10,010</text>
  <text x="690" y="318" font-size="13" fill="#495057">10,000원 H에는 닿지 않음</text>

  <line x1="30" y1="390" x2="850" y2="390" stroke="#ced4da"/>
  <text x="40" y="414" font-size="13" fill="#1b1b1b">가격우선: 매도는 낮은 값부터, 매수는 높은 값부터 소진된다. D(09:00:20)가 C(09:00:30)보다 먼저 왔어도 C가 먼저다.</text>
  <text x="40" y="436" font-size="13" fill="#1b1b1b">시간우선: 같은 10,040원 안에서는 먼저 접수된 B가 C보다 먼저 체결된다.</text>
  <text x="40" y="458" font-size="13" fill="#1b1b1b">체결가격: 들어와 있던 주문의 가격이다. K는 10,010원을 불렀지만 ④·⑤는 10,030원·10,020원에 맺어진다.</text>
  <text x="40" y="484" font-size="13" fill="#495057">가상 종목 가나전자 · 주문 시각과 수량은 code/output.txt [2]·[3]에서 옮겼다.</text>
</svg>
