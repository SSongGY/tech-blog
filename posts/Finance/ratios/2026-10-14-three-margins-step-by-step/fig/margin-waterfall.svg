  <rect x="708" y="168" width="20.4" height="46" fill="#9d0208"/>
  <rect x="728.4" y="168" width="51.6" height="46" fill="#2d6a4f"/>
  <text x="426" y="196" font-size="13" fill="#334155" text-anchor="middle">매출원가 82.0</text>
  <text x="690" y="162" font-size="13" fill="#b45309" text-anchor="middle">6.0</text>
  <text x="860" y="196" font-size="14" fill="#2d6a4f" text-anchor="end">8.6%</text>

  <!-- 벼리소재: 매출원가 70.0 / 판관비 18.0 / 영업외수지·법인세 8.1 / 순이익 3.9 -->
