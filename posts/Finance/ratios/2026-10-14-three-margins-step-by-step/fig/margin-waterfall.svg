  <line x1="180" y1="296" x2="780" y2="296" stroke="#9ca3af" stroke-width="1"/>
  <text x="180" y="314" font-size="13" fill="#6b7280" text-anchor="middle">0</text>
  <text x="480" y="314" font-size="13" fill="#6b7280" text-anchor="middle">50</text>
