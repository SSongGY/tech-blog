  <text x="310" y="344" font-size="13" fill="#4b5563">판매비와관리비</text>
  <rect x="440" y="332" width="14" height="14" fill="#9d0208"/>
  <text x="460" y="344" font-size="13" fill="#4b5563">영업외수지·법인세</text>
