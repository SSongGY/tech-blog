<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="360" fill="#fdfdfb"/>

  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1f2937">매출액을 100으로 놓았을 때 단계마다 빠지는 몫 — 가상 회사 세 곳</text>

  <text x="708" y="58" font-size="13" fill="#1f2937" text-anchor="middle">영업이익률 12.0% — 세 회사가 같은 자리</text>
  <line x1="708" y1="66" x2="708" y2="296" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4"/>

  <text x="20" y="88" font-size="13" fill="#4b5563">회사 · 매출총이익률</text>
  <text x="860" y="88" font-size="13" fill="#4b5563" text-anchor="end">순이익률</text>

  <!-- 한결정밀: 매출원가 55.0 / 판관비 33.0 / 영업외수지·법인세 4.2 / 순이익 7.8 -->
