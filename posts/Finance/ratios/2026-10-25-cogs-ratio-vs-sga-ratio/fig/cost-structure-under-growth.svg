<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="480" fill="#fbfbf9"/>

  <text x="40" y="32" font-size="17" font-weight="bold" fill="#1c1917">
    영업이익률이 같은 두 비용 구조 — 매출이 20% 늘었을 때
  </text>
  <text x="40" y="54" font-size="13" fill="#57534e">
    단위 억원. 막대 높이가 매출액이고, 변동비 비중은 가정값이다. 두 회사 모두 매출 1,000에서 영업이익 120이다.
  </text>

  <!-- 기준선 -->
  <line x1="60" y1="400" x2="690" y2="400" stroke="#78716c" stroke-width="1.4"/>

  <!-- 두레상사 : 매출 1,000 -->
  <rect x="120" y="200.75" width="90" height="199.25" fill="#e7e5e4" stroke="#78716c" stroke-width="1.2"/>
  <rect x="120" y="180.00" width="90" height="20.75" fill="#f5d9b0" stroke="#b45309" stroke-width="1.4"/>
  <rect x="120" y="150.00" width="90" height="30.00" fill="#e3efe7" stroke="#2d6a4f" stroke-width="1.4"/>
  <text x="165" y="142" font-size="13" font-weight="bold" fill="#1b4332" text-anchor="middle">120</text>
  <text x="165" y="305" font-size="13" fill="#44403c" text-anchor="middle">797</text>
  <text x="165" y="418" font-size="13" fill="#57534e" text-anchor="middle">매출 1,000</text>

  <!-- 두레상사 : 매출 1,200 -->
  <rect x="240" y="160.90" width="90" height="239.10" fill="#e7e5e4" stroke="#78716c" stroke-width="1.2"/>
  <rect x="240" y="140.15" width="90" height="20.75" fill="#f5d9b0" stroke="#b45309" stroke-width="1.4"/>
  <rect x="240" y="100.00" width="90" height="40.15" fill="#e3efe7" stroke="#2d6a4f" stroke-width="1.4"/>
  <text x="285" y="92" font-size="13" font-weight="bold" fill="#1b4332" text-anchor="middle">160.6</text>
  <text x="285" y="285" font-size="13" fill="#44403c" text-anchor="middle">956.4</text>
  <text x="285" y="418" font-size="13" fill="#57534e" text-anchor="middle">매출 1,200</text>

  <text x="225" y="444" font-size="14" font-weight="bold" fill="#1c1917" text-anchor="middle">
    두레상사 — 원가율 82.0% · 판관비율 6.0%
  </text>
  <text x="225" y="464" font-size="13" fill="#b45309" text-anchor="middle">영업이익 +33.8%</text>

  <!-- 한별정밀 : 매출 1,000 -->
  <rect x="470" y="273.50" width="90" height="126.50" fill="#e7e5e4" stroke="#78716c" stroke-width="1.2"/>
  <rect x="470" y="180.00" width="90" height="93.50" fill="#f5d9b0" stroke="#b45309" stroke-width="1.4"/>
  <rect x="470" y="150.00" width="90" height="30.00" fill="#e3efe7" stroke="#2d6a4f" stroke-width="1.4"/>
  <text x="515" y="142" font-size="13" font-weight="bold" fill="#1b4332" text-anchor="middle">120</text>
  <text x="515" y="342" font-size="13" fill="#44403c" text-anchor="middle">506</text>
  <text x="515" y="232" font-size="13" fill="#7c2d12" text-anchor="middle">374</text>
  <text x="515" y="418" font-size="13" fill="#57534e" text-anchor="middle">매출 1,000</text>

  <!-- 한별정밀 : 매출 1,200 -->
  <rect x="590" y="248.20" width="90" height="151.80" fill="#e7e5e4" stroke="#78716c" stroke-width="1.2"/>
  <rect x="590" y="154.70" width="90" height="93.50" fill="#f5d9b0" stroke="#b45309" stroke-width="1.4"/>
  <rect x="590" y="100.00" width="90" height="54.70" fill="#e3efe7" stroke="#2d6a4f" stroke-width="1.4"/>
  <text x="635" y="92" font-size="13" font-weight="bold" fill="#1b4332" text-anchor="middle">218.8</text>
  <text x="635" y="330" font-size="13" fill="#44403c" text-anchor="middle">607.2</text>
  <text x="635" y="207" font-size="13" fill="#7c2d12" text-anchor="middle">374</text>
  <text x="635" y="418" font-size="13" fill="#57534e" text-anchor="middle">매출 1,200</text>

  <text x="575" y="444" font-size="14" font-weight="bold" fill="#1c1917" text-anchor="middle">
    한별정밀 — 원가율 55.0% · 판관비율 33.0%
  </text>
  <text x="575" y="464" font-size="13" fill="#2d6a4f" text-anchor="middle">영업이익 +82.3%</text>

  <!-- 범례 -->
  <rect x="712" y="158" width="20" height="14" fill="#e7e5e4" stroke="#78716c" stroke-width="1.2"/>
  <text x="740" y="164" font-size="13" fill="#44403c">변동비</text>
  <text x="712" y="181" font-size="13" fill="#57534e">매출에 비례해 늘어난다</text>
  <rect x="712" y="200" width="20" height="14" fill="#f5d9b0" stroke="#b45309" stroke-width="1.4"/>
  <text x="740" y="206" font-size="13" fill="#7c2d12">고정비</text>
  <text x="712" y="223" font-size="13" fill="#57534e">매출이 늘어도 그대로다</text>
  <rect x="712" y="242" width="20" height="14" fill="#e3efe7" stroke="#2d6a4f" stroke-width="1.4"/>
  <text x="740" y="254" font-size="13" fill="#1b4332">영업이익</text>
  <text x="712" y="294" font-size="13" fill="#57534e">고정비가 두꺼운 쪽에서</text>
  <text x="712" y="312" font-size="13" fill="#57534e">늘어난 매출이 더 많이</text>
  <text x="712" y="330" font-size="13" fill="#57534e">이익으로 남는다.</text>
</svg>
