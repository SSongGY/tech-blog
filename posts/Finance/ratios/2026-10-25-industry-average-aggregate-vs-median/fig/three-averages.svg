<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="다섯 회사의 부채비율 분포 위에 합산방식·중앙값·단순평균 세 기준선을 겹쳐 놓은 그림">
  <rect x="0" y="0" width="880" height="420" fill="#fdfdfb"/>

  <text x="40" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b">같은 다섯 회사에서 나오는 세 개의 업종 평균 — 부채비율</text>
  <text x="40" y="56" font-family="sans-serif" font-size="13" fill="#555">회사와 숫자는 가상이다. 가로축은 부채비율(%)이고 점 하나가 회사 하나다.</text>

  <!-- 세로 기준선 -->
  <line x1="211.7" y1="128" x2="211.7" y2="268" stroke="#2d6a4f" stroke-width="2.5"/>
  <line x1="368.6" y1="128" x2="368.6" y2="268" stroke="#b45309" stroke-width="2.5" stroke-dasharray="7 4"/>
  <line x1="628.6" y1="128" x2="628.6" y2="268" stroke="#9d0208" stroke-width="2.5" stroke-dasharray="2 4"/>

  <text x="211.7" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2d6a4f">한국은행 공표 방식</text>
  <text x="211.7" y="121" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d6a4f">합산 131.1%</text>
  <text x="368.6" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b45309">분포의 가운데</text>
  <text x="368.6" y="121" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b45309">중앙값 300.0%</text>
  <text x="628.6" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9d0208">비율을 그냥 평균</text>
  <text x="628.6" y="121" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#9d0208">단순평균 580.0%</text>

  <!-- 축 -->
  <line x1="90" y1="268" x2="740" y2="268" stroke="#333" stroke-width="1.5"/>
  <line x1="90" y1="268" x2="90" y2="276" stroke="#333" stroke-width="1.5"/>
  <line x1="182.9" y1="268" x2="182.9" y2="276" stroke="#333" stroke-width="1.5"/>
  <line x1="275.7" y1="268" x2="275.7" y2="276" stroke="#333" stroke-width="1.5"/>
  <line x1="368.6" y1="268" x2="368.6" y2="276" stroke="#333" stroke-width="1.5"/>
  <line x1="461.4" y1="268" x2="461.4" y2="276" stroke="#333" stroke-width="1.5"/>
  <line x1="554.3" y1="268" x2="554.3" y2="276" stroke="#333" stroke-width="1.5"/>
  <line x1="647.1" y1="268" x2="647.1" y2="276" stroke="#333" stroke-width="1.5"/>
  <line x1="740" y1="268" x2="740" y2="276" stroke="#333" stroke-width="1.5"/>

  <text x="90" y="293" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444">0</text>
  <text x="182.9" y="293" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444">100</text>
  <text x="275.7" y="293" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444">200</text>
  <text x="368.6" y="293" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444">300</text>
  <text x="461.4" y="293" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444">400</text>
  <text x="554.3" y="293" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444">500</text>
  <text x="647.1" y="293" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444">600</text>
  <text x="740" y="293" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444">700</text>
  <text x="415" y="316" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444">부채비율 (%)</text>

  <!-- 회사 점 -->
  <circle cx="182.9" cy="222" r="8" fill="#1b4965"/>
  <circle cx="275.7" cy="222" r="8" fill="#1b4965"/>
  <circle cx="368.6" cy="222" r="8" fill="#1b4965"/>
  <circle cx="461.4" cy="222" r="8" fill="#1b4965"/>

  <text x="182.9" y="203" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1b4965">큰별정밀</text>
  <text x="275.7" y="203" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1b4965">가온부품</text>
  <text x="368.6" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1b4965">늘품소재</text>
  <text x="461.4" y="203" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1b4965">밝은기계</text>

  <text x="182.9" y="162" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">자기자본</text>
  <text x="182.9" y="181" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#555">88.9%</text>

  <!-- 축 밖으로 나간 회사 -->
  <line x1="740" y1="222" x2="800" y2="222" stroke="#9d0208" stroke-width="2"/>
  <polygon points="800,222 788,216 788,228" fill="#9d0208"/>
  <text x="872" y="199" text-anchor="end" font-family="sans-serif" font-size="13" fill="#9d0208">한솔정공</text>
  <text x="872" y="222" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#9d0208">1900.0%</text>
  <text x="872" y="245" text-anchor="end" font-family="sans-serif" font-size="13" fill="#9d0208">자기자본 0.7%</text>

  <!-- 범례 -->
  <rect x="40" y="340" width="800" height="58" fill="#f2f1ec" stroke="#ddd" stroke-width="1"/>
  <text x="56" y="362" font-family="sans-serif" font-size="13" fill="#2d6a4f">합산방식은 항목을 먼저 더한 뒤 나눈다. 자기자본이 88.9%인 큰별정밀 한 곳이 기준선을 끌어간다.</text>
  <text x="56" y="382" font-family="sans-serif" font-size="13" fill="#9d0208">단순평균은 자기자본 0.7%인 한솔정공의 1900.0%를 다섯 중 하나로 똑같이 센다.</text>
</svg>
