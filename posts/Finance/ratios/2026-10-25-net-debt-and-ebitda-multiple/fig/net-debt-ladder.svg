<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="330" fill="#fbfaf7"/>

  <text x="24" y="34" font-size="16" font-weight="bold" fill="#1f2937">총차입금에서 현금성자산을 뺀 순차입금을 EBITDA로 나눈다 (억원)</text>
  <text x="24" y="56" font-size="13" fill="#4b5563">세 회사 모두 자기자본 400 · 부채총계 600 이므로 부채비율은 150.0%로 같다</text>

  <text x="150" y="92" font-size="13" fill="#374151">총차입금 = 순차입금 + 현금성자산</text>
  <text x="552" y="92" font-size="13" fill="#374151">EBITDA</text>
  <text x="722" y="92" font-size="13" fill="#374151">순차입금배수</text>

  <!-- 마루텍 : 총차입금 500 = 순차입금 150 + 현금 350 / EBITDA 150 -->
  <text x="24" y="130" font-size="14" fill="#111827">마루텍</text>
  <rect x="150" y="108" width="75" height="34" fill="#9d0208"/>
  <text x="187" y="130" font-size="13" fill="#ffffff" text-anchor="middle">150</text>
  <rect x="225" y="108" width="175" height="34" fill="#2d6a4f"/>
  <text x="312" y="130" font-size="13" fill="#ffffff" text-anchor="middle">현금 350</text>
  <rect x="552" y="108" width="75" height="34" fill="#9ca3af"/>
  <text x="589" y="130" font-size="13" fill="#ffffff" text-anchor="middle">150</text>
  <text x="762" y="131" font-size="15" font-weight="bold" fill="#2d6a4f" text-anchor="middle">1.00배</text>

  <!-- 너울산업 : 총차입금 500 = 순차입금 450 + 현금 50 / EBITDA 150 -->
  <text x="24" y="190" font-size="14" fill="#111827">너울산업</text>
  <rect x="150" y="168" width="225" height="34" fill="#9d0208"/>
  <text x="262" y="190" font-size="13" fill="#ffffff" text-anchor="middle">450</text>
  <rect x="375" y="168" width="25" height="34" fill="#2d6a4f"/>
  <text x="414" y="190" font-size="13" fill="#2d6a4f">현금 50</text>
  <rect x="552" y="168" width="75" height="34" fill="#9ca3af"/>
  <text x="589" y="190" font-size="13" fill="#ffffff" text-anchor="middle">150</text>
  <text x="762" y="191" font-size="15" font-weight="bold" fill="#9d0208" text-anchor="middle">3.00배</text>

  <!-- 벼리로지스 : 총차입금 200 = 순차입금 150 + 현금 50 / EBITDA 50 -->
  <text x="24" y="250" font-size="14" fill="#111827">벼리로지스</text>
  <rect x="150" y="228" width="75" height="34" fill="#9d0208"/>
  <text x="187" y="250" font-size="13" fill="#ffffff" text-anchor="middle">150</text>
  <rect x="225" y="228" width="25" height="34" fill="#2d6a4f"/>
  <text x="264" y="250" font-size="13" fill="#2d6a4f">현금 50</text>
  <rect x="552" y="228" width="25" height="34" fill="#9ca3af"/>
  <text x="585" y="250" font-size="13" fill="#4b5563">50</text>
  <text x="762" y="251" font-size="15" font-weight="bold" fill="#9d0208" text-anchor="middle">3.00배</text>

  <!-- 읽는 선 : 같은 순차입금, 같은 배수 -->
  <line x1="150" y1="272" x2="225" y2="272" stroke="#b45309" stroke-width="2"/>
  <line x1="150" y1="266" x2="150" y2="278" stroke="#b45309" stroke-width="2"/>
  <line x1="225" y1="266" x2="225" y2="278" stroke="#b45309" stroke-width="2"/>
  <text x="240" y="277" font-size="13" fill="#b45309">마루텍과 순차입금이 똑같이 150인데 배수는 1.00배와 3.00배로 갈린다</text>

  <text x="24" y="306" font-size="13" fill="#4b5563">붉은 칸이 순차입금, 초록 칸이 차감한 현금성자산, 회색 칸이 EBITDA. 가로 길이는 세 줄 모두 같은 눈금(1억 = 0.5px)이다.</text>
</svg>
