<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="360" fill="#fdfdfb"/>

  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1f2937">총자본 1,000억을 세 칸으로 나눈 모습 — 가상 회사 세 곳</text>

  <text x="420" y="58" font-size="13" fill="#1f2937" text-anchor="middle">자기자본비율 40.0% — 위 두 회사가 같은 자리</text>
  <line x1="420" y1="66" x2="420" y2="222" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4"/>

  <text x="20" y="88" font-size="13" fill="#4b5563">회사 · 부채비율</text>
  <text x="860" y="88" font-size="13" fill="#4b5563" text-anchor="end">차입금의존도</text>

  <!-- 나루정밀: 자기자본 400 / 매입채무 등 450 / 차입금 150 -->
  <text x="20" y="114" font-size="14" font-weight="bold" fill="#1f2937">나루정밀</text>
  <text x="20" y="132" font-size="13" fill="#4b5563">부채비율 150.0%</text>
  <rect x="180" y="96" width="240" height="46" fill="#2d6a4f"/>
  <rect x="420" y="96" width="270" height="46" fill="#cbd5e1"/>
  <rect x="690" y="96" width="90" height="46" fill="#9d0208"/>
  <text x="300" y="124" font-size="13" fill="#ffffff" text-anchor="middle">자기자본 400</text>
  <text x="555" y="124" font-size="13" fill="#334155" text-anchor="middle">매입채무 등 450</text>
  <text x="735" y="124" font-size="13" fill="#ffffff" text-anchor="middle">차입금 150</text>
  <text x="860" y="124" font-size="14" fill="#1f2937" text-anchor="end">15.0%</text>

  <!-- 들샘산업: 자기자본 400 / 매입채무 등 80 / 차입금 520 -->
  <text x="20" y="186" font-size="14" font-weight="bold" fill="#1f2937">들샘산업</text>
  <text x="20" y="204" font-size="13" fill="#4b5563">부채비율 150.0%</text>
  <rect x="180" y="168" width="240" height="46" fill="#2d6a4f"/>
  <rect x="420" y="168" width="48" height="46" fill="#cbd5e1"/>
  <rect x="468" y="168" width="312" height="46" fill="#9d0208"/>
  <text x="300" y="196" font-size="13" fill="#ffffff" text-anchor="middle">자기자본 400</text>
  <text x="444" y="196" font-size="13" fill="#334155" text-anchor="middle">80</text>
  <text x="624" y="196" font-size="13" fill="#ffffff" text-anchor="middle">차입금 520</text>
  <text x="860" y="196" font-size="14" fill="#9d0208" text-anchor="end">52.0%</text>

  <!-- 솔터물산: 자기자본 250 / 매입채무 등 600 / 차입금 150 -->
  <text x="20" y="258" font-size="14" font-weight="bold" fill="#1f2937">솔터물산</text>
  <text x="20" y="276" font-size="13" fill="#4b5563">부채비율 300.0%</text>
  <rect x="180" y="240" width="150" height="46" fill="#2d6a4f"/>
  <rect x="330" y="240" width="360" height="46" fill="#cbd5e1"/>
  <rect x="690" y="240" width="90" height="46" fill="#9d0208"/>
  <text x="255" y="268" font-size="13" fill="#ffffff" text-anchor="middle">자기자본 250</text>
  <text x="510" y="268" font-size="13" fill="#334155" text-anchor="middle">매입채무 등 600</text>
  <text x="735" y="268" font-size="13" fill="#ffffff" text-anchor="middle">차입금 150</text>
  <text x="860" y="268" font-size="14" fill="#1f2937" text-anchor="end">15.0%</text>

  <line x1="180" y1="296" x2="780" y2="296" stroke="#9ca3af" stroke-width="1"/>
  <text x="180" y="314" font-size="13" fill="#6b7280" text-anchor="middle">0</text>
  <text x="480" y="314" font-size="13" fill="#6b7280" text-anchor="middle">500</text>
  <text x="780" y="314" font-size="13" fill="#6b7280" text-anchor="middle">1,000 (억원)</text>

  <rect x="180" y="332" width="14" height="14" fill="#2d6a4f"/>
  <text x="200" y="344" font-size="13" fill="#4b5563">자기자본</text>
  <rect x="290" y="332" width="14" height="14" fill="#cbd5e1"/>
  <text x="310" y="344" font-size="13" fill="#4b5563">이자를 부담하지 않는 부채</text>
  <rect x="540" y="332" width="14" height="14" fill="#9d0208"/>
  <text x="560" y="344" font-size="13" fill="#4b5563">장단기차입금·회사채</text>
</svg>
