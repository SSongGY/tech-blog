<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-label="성장률이 요구수익률에 다가갈수록 배당할인모형의 주당가치가 급히 치솟고 g가 k와 같아지는 자리에서 정의되지 않는 모습">
  <rect x="0" y="0" width="880" height="460" fill="#fdfdfb"/>

  <text x="40" y="32" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b">분모 k − g 가 줄어들 때 주당가치가 움직이는 모양</text>
  <text x="40" y="54" font-family="sans-serif" font-size="13" fill="#555">가상 회사 하늘제과. 배당 D0 = 3,000원, 요구수익률 k = 11.0% 로 고정하고 g 만 바꿨다.</text>

  <!-- 격자 -->
  <line x1="100" y1="295" x2="760" y2="295" stroke="#e4e2dc" stroke-width="1"/>
  <line x1="100" y1="230" x2="760" y2="230" stroke="#e4e2dc" stroke-width="1"/>
  <line x1="100" y1="165" x2="760" y2="165" stroke="#e4e2dc" stroke-width="1"/>
  <line x1="100" y1="100" x2="760" y2="100" stroke="#e4e2dc" stroke-width="1"/>

  <!-- 점근선 -->
  <line x1="686.7" y1="92" x2="686.7" y2="360" stroke="#9d0208" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="686.7" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#9d0208">g = k = 11.0%</text>

  <!-- 곡선 -->
  <polyline points="100,342.3 206.7,337.9 313.3,331.0 420,318.7 473.3,307.8 526.7,289.8 580,253.7 606.7,217.6 633.3,145.5 642.6,100"
            fill="none" stroke="#1b4965" stroke-width="3"/>

  <!-- 축 -->
  <line x1="100" y1="360" x2="760" y2="360" stroke="#333" stroke-width="1.5"/>
  <line x1="100" y1="90" x2="100" y2="360" stroke="#333" stroke-width="1.5"/>

  <text x="92" y="365" text-anchor="end" font-family="sans-serif" font-size="13" fill="#444">0</text>
  <text x="92" y="300" text-anchor="end" font-family="sans-serif" font-size="13" fill="#444">10만</text>
  <text x="92" y="235" text-anchor="end" font-family="sans-serif" font-size="13" fill="#444">20만</text>
  <text x="92" y="170" text-anchor="end" font-family="sans-serif" font-size="13" fill="#444">30만</text>
  <text x="92" y="105" text-anchor="end" font-family="sans-serif" font-size="13" fill="#444">40만</text>
  <text x="34" y="225" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444" transform="rotate(-90 34 225)">주당가치 (원)</text>

  <text x="100" y="380" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444">0</text>
  <text x="206.7" y="380" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444">2</text>
  <text x="313.3" y="380" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444">4</text>
  <text x="420" y="380" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444">6</text>
  <text x="526.7" y="380" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444">8</text>
  <text x="633.3" y="380" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444">10</text>
  <text x="740" y="380" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444">12</text>
  <text x="430" y="402" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444">성장률 g (%)</text>

  <!-- 짚어 둘 점 -->
  <circle cx="526.7" cy="289.8" r="6" fill="#2d6a4f"/>
  <text x="516" y="270" text-anchor="end" font-family="sans-serif" font-size="13" fill="#2d6a4f">g = 8.0% 일 때</text>
  <text x="516" y="293" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d6a4f">108,000원</text>

  <circle cx="633.3" cy="145.5" r="6" fill="#b45309"/>
  <text x="622" y="126" text-anchor="end" font-family="sans-serif" font-size="13" fill="#b45309">g = 10.0% 일 때</text>
  <text x="622" y="149" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b45309">330,000원</text>

  <!-- g 가 k 를 넘긴 구간 -->
  <text x="768" y="230" font-family="sans-serif" font-size="13" fill="#9d0208">g &gt; k</text>
  <text x="768" y="249" font-family="sans-serif" font-size="13" fill="#9d0208">값이 음수</text>

  <rect x="40" y="416" width="800" height="36" fill="#f2f1ec" stroke="#ddd" stroke-width="1"/>
  <text x="56" y="439" font-family="sans-serif" font-size="13" fill="#333">g 가 8.0% 에서 10.0% 로 2%p 오르는 동안 값은 3.1배가 된다. 분모 k − g 가 3.0%p 에서 1.0%p 로 줄기 때문이다.</text>
</svg>
