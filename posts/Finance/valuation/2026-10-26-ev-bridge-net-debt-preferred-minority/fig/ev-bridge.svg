<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="시가총액에서 EV 까지 가산·차감 항목을 쌓은 폭포 도식">
  <rect x="0" y="0" width="880" height="400" fill="#fbfaf7"/>

  <text x="24" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b">마루정밀 — 시가총액에서 EV 까지 (단위: 억원)</text>
  <text x="856" y="34" font-family="sans-serif" font-size="13" fill="#4a4a4a" text-anchor="end">초록은 더하는 항목, 주황은 빼는 항목, 회색은 출발점과 결과</text>

  <!-- 기준선 -->
  <line x1="60" y1="300" x2="856" y2="300" stroke="#9a9a9a" stroke-width="1.2"/>
  <text x="52" y="304" font-family="sans-serif" font-size="13" fill="#6a6a6a" text-anchor="end">0</text>
  <line x1="60" y1="160" x2="856" y2="160" stroke="#dcdcdc" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="52" y="164" font-family="sans-serif" font-size="13" fill="#6a6a6a" text-anchor="end">1,000</text>
  <line x1="60" y1="90" x2="856" y2="90" stroke="#dcdcdc" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="52" y="94" font-family="sans-serif" font-size="13" fill="#6a6a6a" text-anchor="end">1,500</text>

  <!-- 연결선 -->
  <g stroke="#b0b0b0" stroke-width="1" stroke-dasharray="4 3">
    <line x1="170" y1="165.6" x2="200" y2="165.6"/>
    <line x1="280" y1="153" x2="310" y2="153"/>
    <line x1="390" y1="78.8" x2="420" y2="78.8"/>
    <line x1="500" y1="99.8" x2="530" y2="99.8"/>
    <line x1="610" y1="90" x2="640" y2="90"/>
    <line x1="720" y1="97" x2="750" y2="97"/>
  </g>

  <!-- 1. 보통주 시가총액 960 -->
  <rect x="90" y="165.6" width="80" height="134.4" fill="#495057"/>
  <text x="130" y="158" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">960</text>
  <text x="130" y="322" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">보통주</text>
  <text x="130" y="340" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">시가총액</text>

  <!-- 2. 우선주 +90 -->
  <rect x="200" y="153" width="80" height="12.6" fill="#2d6a4f"/>
  <text x="240" y="146" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2d6a4f" text-anchor="middle">+90</text>
  <text x="240" y="322" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">우선주</text>
  <text x="240" y="340" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">시가총액</text>

  <!-- 3. 총차입금 +530 -->
  <rect x="310" y="78.8" width="80" height="74.2" fill="#2d6a4f"/>
  <text x="350" y="71" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2d6a4f" text-anchor="middle">+530</text>
  <text x="350" y="322" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">총차입금</text>
  <text x="350" y="340" font-family="sans-serif" font-size="13" fill="#4a4a4a" text-anchor="middle">리스부채 포함</text>

  <!-- 4. 현금성자산 -150 -->
  <rect x="420" y="78.8" width="80" height="21" fill="#b45309"/>
  <text x="460" y="71" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">−150</text>
  <text x="460" y="322" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">현금성자산</text>
  <text x="460" y="340" font-family="sans-serif" font-size="13" fill="#4a4a4a" text-anchor="middle">단기금융상품 포함</text>

  <!-- 5. 비지배지분 +70 -->
  <rect x="530" y="90" width="80" height="9.8" fill="#2d6a4f"/>
  <text x="570" y="82" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2d6a4f" text-anchor="middle">+70</text>
  <text x="570" y="322" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">비지배지분</text>
  <text x="570" y="340" font-family="sans-serif" font-size="13" fill="#4a4a4a" text-anchor="middle">연결자본</text>

  <!-- 6. 비영업자산 -50 -->
  <rect x="640" y="90" width="80" height="7" fill="#b45309"/>
  <text x="680" y="82" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">−50</text>
  <text x="680" y="322" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">비영업자산</text>
  <text x="680" y="340" font-family="sans-serif" font-size="13" fill="#4a4a4a" text-anchor="middle">관계기업투자</text>

  <!-- 7. EV 1450 -->
  <rect x="750" y="97" width="80" height="203" fill="#495057"/>
  <text x="790" y="89" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">1,450</text>
  <text x="790" y="322" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">EV</text>
  <text x="790" y="340" font-family="sans-serif" font-size="13" fill="#4a4a4a" text-anchor="middle">기업가치</text>

  <text x="24" y="374" font-family="sans-serif" font-size="13" fill="#1b1b1b">EBITDA 190 으로 나누면 EV/EBITDA 는 7.63배다. 우선주와 비지배지분을 빼먹으면 1,290 이 되어 6.79배로 읽힌다.</text>
</svg>
