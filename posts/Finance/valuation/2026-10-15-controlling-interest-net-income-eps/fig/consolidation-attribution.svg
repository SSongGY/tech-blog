<svg viewBox="0 0 880 450" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="450" fill="#fbfaf7"/>

  <text x="24" y="32" font-size="16" font-weight="bold" fill="#1f2933">연결은 전액 합산하고, 귀속은 지분율로 나눈다</text>
  <text x="24" y="54" font-size="13" fill="#616e7c">자차홀딩스가 종속기업 지분 60%를 보유한 경우 (단위: 억원)</text>

  <!-- sources -->
  <rect x="24" y="76" width="250" height="82" rx="6" fill="#ffffff" stroke="#52606d" stroke-width="1.4"/>
  <text x="42" y="100" font-size="14" font-weight="bold" fill="#1f2933">지배기업 자체</text>
  <text x="42" y="124" font-size="13.5" fill="#3e4c59">당기순이익 300.0</text>
  <text x="42" y="146" font-size="13.5" fill="#3e4c59">자기자본 2,000.0</text>

  <rect x="314" y="76" width="250" height="82" rx="6" fill="#ffffff" stroke="#52606d" stroke-width="1.4"/>
  <text x="332" y="100" font-size="14" font-weight="bold" fill="#1f2933">종속기업 (지분 60%)</text>
  <text x="332" y="124" font-size="13.5" fill="#3e4c59">당기순이익 500.0</text>
  <text x="332" y="146" font-size="13.5" fill="#3e4c59">자기자본 3,000.0</text>

  <rect x="604" y="76" width="252" height="82" rx="6" fill="#fdf3e3" stroke="#b45309" stroke-width="1.4"/>
  <text x="622" y="100" font-size="14" font-weight="bold" fill="#8a4208">합산 규칙</text>
  <text x="622" y="124" font-size="13" fill="#7a4a12">지배력이 있으면 지분율과</text>
  <text x="622" y="146" font-size="13" fill="#7a4a12">무관하게 전액 더한다</text>

  <path d="M149 158 L149 186 L380 186 L380 212" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a2)"/>
  <path d="M439 158 L439 186 L380 186" fill="none" stroke="#52606d" stroke-width="1.6"/>
  <path d="M730 158 L730 186 L440 186" fill="none" stroke="#b45309" stroke-width="1.4" stroke-dasharray="4 3"/>

  <!-- consolidated -->
  <rect x="150" y="212" width="580" height="66" rx="6" fill="#eef2f6" stroke="#334e68" stroke-width="1.8"/>
  <text x="172" y="238" font-size="14" font-weight="bold" fill="#1f2933">연결 당기순이익 800.0 · 연결 자기자본 5,000.0</text>
  <text x="172" y="262" font-size="13" fill="#3e4c59">여기까지는 누구 몫인지 묻지 않는다</text>

  <path d="M330 278 L330 306" fill="none" stroke="#2d6a4f" stroke-width="1.8" marker-end="url(#a3)"/>
  <path d="M560 278 L560 306" fill="none" stroke="#9d0208" stroke-width="1.8" marker-end="url(#a4)"/>
  <text x="400" y="298" font-size="13" fill="#616e7c">귀속을 나눈다</text>

  <!-- attribution -->
  <rect x="120" y="306" width="300" height="100" rx="6" fill="#eef5f1" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="140" y="330" font-size="14" font-weight="bold" fill="#17422f">지배기업 소유주 지분</text>
  <text x="140" y="354" font-size="13.5" fill="#1f3b2d">순이익 600.0 · 자본 3,800.0</text>
  <text x="140" y="376" font-size="13" fill="#44614f">300.0 + 500.0 × 60%</text>
  <text x="140" y="398" font-size="13" fill="#2d6a4f" font-weight="bold">EPS·PER·PBR·ROE 는 이 줄로</text>

  <rect x="460" y="306" width="300" height="100" rx="6" fill="#f8eceb" stroke="#9d0208" stroke-width="1.8"/>
  <text x="480" y="330" font-size="14" font-weight="bold" fill="#6b0206">비지배지분</text>
  <text x="480" y="354" font-size="13.5" fill="#5a1a1c">순이익 200.0 · 자본 1,200.0</text>
  <text x="480" y="376" font-size="13" fill="#7a3134">500.0 × 40% · 3,000.0 × 40%</text>
  <text x="480" y="398" font-size="13" fill="#9d0208" font-weight="bold">주주의 몫이 아니다</text>

  <text x="24" y="434" font-size="13" fill="#616e7c">연결 자기자본 5,000.0 중 비지배지분 1,200.0은 자본에 포함하되 지배기업 소유주지분과 구분해 표시한다</text>

  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#52606d"/>
    </marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#2d6a4f"/>
    </marker>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#9d0208"/>
    </marker>
  </defs>
</svg>
