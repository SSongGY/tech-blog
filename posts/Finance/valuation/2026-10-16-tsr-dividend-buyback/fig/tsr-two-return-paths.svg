<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <rect x="0" y="0" width="880" height="450" fill="#fbfbf8"/>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#44403c"/>
    </marker>
  </defs>

  <text x="30" y="36" font-size="17" font-weight="bold" fill="#1c1917">같은 금액을 돌려주는 두 경로 — 주가는 갈리고 TSR 은 붙는다</text>
  <text x="30" y="60" font-size="13" fill="#57534e">순이익 200억 원 · 주주환원 100억 원 · PER 12배 고정 · 5년 · 배당은 받는 즉시 재투자</text>

  <!-- 출발 -->
  <rect x="30" y="195" width="125" height="86" rx="6" fill="#ffffff" stroke="#44403c" stroke-width="1.5"/>
  <text x="92" y="228" font-size="14" fill="#1c1917" text-anchor="middle">기초 주가</text>
  <text x="92" y="252" font-size="16" font-weight="bold" fill="#1c1917" text-anchor="middle">24,000원</text>

  <path d="M 158 220 L 185 155" fill="none" stroke="#44403c" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M 158 256 L 185 321" fill="none" stroke="#44403c" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 위 갈래: 배당 -->
  <rect x="190" y="98" width="178" height="80" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="279" y="124" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">가나전자</text>
  <text x="279" y="148" font-size="13" fill="#1c1917" text-anchor="middle">현금배당 1,000원</text>
  <text x="279" y="167" font-size="13" fill="#1c1917" text-anchor="middle">주식 수 그대로</text>

  <path d="M 372 138 L 402 138" fill="none" stroke="#44403c" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="406" y="98" width="178" height="80" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="495" y="124" font-size="13" fill="#1c1917" text-anchor="middle">배당락으로 주가는</text>
  <text x="495" y="145" font-size="13" fill="#1c1917" text-anchor="middle">24,000원에 머문다</text>
  <text x="495" y="167" font-size="13" font-weight="bold" fill="#2d6a4f" text-anchor="middle">주가수익률 0%</text>

  <path d="M 588 138 L 618 138" fill="none" stroke="#44403c" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="622" y="98" width="178" height="80" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="711" y="124" font-size="13" fill="#1c1917" text-anchor="middle">받은 배당으로</text>
  <text x="711" y="145" font-size="13" fill="#1c1917" text-anchor="middle">같은 주식을 더 산다</text>
  <text x="711" y="167" font-size="13" font-weight="bold" fill="#2d6a4f" text-anchor="middle">보유 주식 수 증가</text>

  <!-- 아래 갈래: 자사주 -->
  <rect x="190" y="298" width="178" height="80" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/>
  <text x="279" y="324" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">다라물산</text>
  <text x="279" y="348" font-size="13" fill="#1c1917" text-anchor="middle">자사주 매입·소각</text>
  <text x="279" y="367" font-size="13" fill="#1c1917" text-anchor="middle">배당 0원</text>

  <path d="M 372 338 L 402 338" fill="none" stroke="#44403c" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="406" y="298" width="178" height="80" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/>
  <text x="495" y="324" font-size="13" fill="#1c1917" text-anchor="middle">주식 수가 줄어</text>
  <text x="495" y="345" font-size="13" fill="#1c1917" text-anchor="middle">EPS 가 올라간다</text>
  <text x="495" y="367" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">주가 29,434원</text>

  <path d="M 588 338 L 618 338" fill="none" stroke="#44403c" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="622" y="298" width="178" height="80" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/>
  <text x="711" y="324" font-size="13" fill="#1c1917" text-anchor="middle">받은 현금은 없고</text>
  <text x="711" y="345" font-size="13" fill="#1c1917" text-anchor="middle">1주를 그대로 든다</text>
  <text x="711" y="367" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">주가수익률 22.64%</text>

  <!-- 합류 -->
  <path d="M 711 182 L 711 210" fill="none" stroke="#44403c" stroke-width="1.5"/>
  <path d="M 711 294 L 711 266" fill="none" stroke="#44403c" stroke-width="1.5"/>
  <path d="M 711 210 L 620 210 L 620 238" fill="none" stroke="#44403c" stroke-width="1.5"/>
  <path d="M 711 266 L 620 266 L 620 238" fill="none" stroke="#44403c" stroke-width="1.5"/>
  <path d="M 616 238 L 586 238" fill="none" stroke="#44403c" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="352" y="208" width="230" height="60" rx="6" fill="#edf6f0" stroke="#2d6a4f" stroke-width="2"/>
  <text x="467" y="232" font-size="13" fill="#1c1917" text-anchor="middle">5년 뒤 보유가치 29,434원</text>
  <text x="467" y="255" font-size="15" font-weight="bold" fill="#2d6a4f" text-anchor="middle">두 경로 모두 누적 TSR 22.64%</text>
</svg>
