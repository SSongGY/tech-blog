<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#fbfaf7"/>

  <text x="440" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">할인율 하나가 만들어지는 두 갈래</text>
  <text x="440" y="52" text-anchor="middle" font-size="13" fill="#475569">마바소재 — 무위험이자율 3.5%, 시장위험프리미엄 6.0%, 평균유효세율 22%, 시가 기준 D/V 25%</text>

  <text x="40" y="84" font-size="13" font-weight="bold" fill="#475569">주주가 요구하는 몫</text>

  <!-- 자기자본 갈래 -->
  <rect x="34" y="94" width="186" height="62" rx="5" fill="#eaf4ee" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="127" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4332">무부채 베타 0.90</text>
  <text x="127" y="140" text-anchor="middle" font-size="13" fill="#2d6a4f">부채/자기자본 0.3333</text>

  <path d="M220 125 L256 125" fill="none" stroke="#2d6a4f" stroke-width="1.6"/>
  <path d="M248 120 L256 125 L248 130 Z" fill="#2d6a4f"/>

  <rect x="256" y="94" width="196" height="62" rx="5" fill="#eaf4ee" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="354" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4332">하마다 식을 거쳐</text>
  <text x="354" y="140" text-anchor="middle" font-size="13" fill="#2d6a4f">부채 반영 베타 1.1340</text>

  <path d="M452 125 L488 125" fill="none" stroke="#2d6a4f" stroke-width="1.6"/>
  <path d="M480 120 L488 125 L480 130 Z" fill="#2d6a4f"/>

  <rect x="488" y="94" width="196" height="62" rx="5" fill="#eaf4ee" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="586" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4332">자기자본비용 10.304%</text>
  <text x="586" y="140" text-anchor="middle" font-size="13" fill="#2d6a4f">3.5% + 1.1340 × 6.0%</text>

  <text x="40" y="224" font-size="13" font-weight="bold" fill="#475569">채권자가 요구하는 몫</text>

  <!-- 타인자본 갈래 -->
  <rect x="34" y="234" width="186" height="62" rx="5" fill="#fdf6ec" stroke="#b45309" stroke-width="1.6"/>
  <text x="127" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">신용스프레드 1.35%p</text>
  <text x="127" y="280" text-anchor="middle" font-size="13" fill="#b45309">부채가 늘수록 가팔라진다</text>

  <path d="M220 265 L256 265" fill="none" stroke="#b45309" stroke-width="1.6"/>
  <path d="M248 260 L256 265 L248 270 Z" fill="#b45309"/>

  <rect x="256" y="234" width="196" height="62" rx="5" fill="#fdf6ec" stroke="#b45309" stroke-width="1.6"/>
  <text x="354" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">타인자본비용 4.850%</text>
  <text x="354" y="280" text-anchor="middle" font-size="13" fill="#b45309">3.5% + 1.35%p</text>

  <path d="M452 265 L488 265" fill="none" stroke="#b45309" stroke-width="1.6"/>
  <path d="M480 260 L488 265 L480 270 Z" fill="#b45309"/>
  <text x="470" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">×(1−22%)</text>

  <rect x="488" y="234" width="196" height="62" rx="5" fill="#fdf6ec" stroke="#b45309" stroke-width="1.6"/>
  <text x="586" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">세후 3.783%</text>
  <text x="586" y="280" text-anchor="middle" font-size="13" fill="#b45309">이자가 과세소득을 줄인 몫</text>

  <!-- 가중 -->
  <path d="M684 125 L724 125 L724 176" fill="none" stroke="#2d6a4f" stroke-width="1.6"/>
  <path d="M719 168 L724 176 L729 168 Z" fill="#2d6a4f"/>
  <text x="768" y="146" text-anchor="middle" font-size="13" fill="#2d6a4f">E/V 75%</text>

  <path d="M684 265 L724 265 L724 214" fill="none" stroke="#b45309" stroke-width="1.6"/>
  <path d="M719 222 L724 214 L729 222 Z" fill="#b45309"/>
  <text x="768" y="250" text-anchor="middle" font-size="13" fill="#b45309">D/V 25%</text>

  <rect x="700" y="176" width="156" height="38" rx="5" fill="#1f2937"/>
  <text x="778" y="201" text-anchor="middle" font-size="15" font-weight="bold" fill="#fbfaf7">WACC 8.674%</text>

  <text x="440" y="344" text-anchor="middle" font-size="13" fill="#475569">세율이 곱해지는 자리는 타인자본 갈래 한 곳뿐이다. 자기자본비용에는 절세효과가 붙지 않는다.</text>
  <text x="440" y="366" text-anchor="middle" font-size="13" fill="#475569">같은 세율이 하마다 식에도 들어가므로, 세율을 바꾸면 베타와 세후 kd 가 함께 움직인다.</text>
</svg>
