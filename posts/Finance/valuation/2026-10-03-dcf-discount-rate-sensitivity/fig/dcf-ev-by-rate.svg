<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>

  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">DCF — 무엇을 오늘 값으로 바꾸는가 (자차물류, 억원)</text>

  <!-- 위: 시간축 -->
  <line x1="80" y1="110" x2="800" y2="110" stroke="#495057" stroke-width="1.5"/>
  <text x="80" y="132" text-anchor="middle" font-size="13" fill="#1b1b1b">오늘</text>
  <text x="200" y="132" text-anchor="middle" font-size="13" fill="#495057">1년</text>
  <text x="300" y="132" text-anchor="middle" font-size="13" fill="#495057">2년</text>
  <text x="400" y="132" text-anchor="middle" font-size="13" fill="#495057">3년</text>
  <text x="500" y="132" text-anchor="middle" font-size="13" fill="#495057">4년</text>
  <text x="600" y="132" text-anchor="middle" font-size="13" fill="#495057">5년</text>
  <text x="740" y="132" text-anchor="middle" font-size="13" fill="#495057">6년 이후 영구히</text>

  <rect x="150" y="56" width="500" height="40" rx="6" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="400" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">예측 기간 FCF 100 → 121.6 (연 5%)</text>
  <text x="400" y="90" text-anchor="middle" font-size="13" fill="#1b1b1b">t년차 값을 (1 + r)ᵗ 로 나눠 더한다 · TV도 5년 할인</text>

  <rect x="660" y="56" width="200" height="40" rx="6" fill="#fff3e0" stroke="#b45309"/>
  <text x="760" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">잔존가치 TV</text>
  <text x="760" y="90" text-anchor="middle" font-size="13" fill="#1b1b1b">6년차 FCF ÷ (r − g)</text>

  <line x1="30" y1="160" x2="850" y2="160" stroke="#ced4da"/>

  <!-- 아래: 할인율별 EV 막대. 축척 1억 = 0.3px, 시작 x=140 -->
  <text x="440" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">할인율만 1%p씩 바꾼 기업가치 (영구성장률 2%)</text>
  <line x1="140" y1="200" x2="140" y2="390" stroke="#495057"/>

  <text x="40" y="232" font-size="14" font-weight="bold" fill="#1b1b1b">할인율 7%</text>
  <rect x="140" y="214" width="135" height="28" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="150" y="233" font-size="13" fill="#1b1b1b">450</text>
  <rect x="275" y="214" width="530" height="28" fill="#fff3e0" stroke="#b45309"/>
  <text x="285" y="233" font-size="13" fill="#1b1b1b">TV의 PV 1,768</text>
  <text x="700" y="233" font-size="13" font-weight="bold" fill="#1b1b1b">EV 2,218</text>

  <text x="40" y="292" font-size="14" font-weight="bold" fill="#1b1b1b">할인율 8%</text>
  <rect x="140" y="274" width="131" height="28" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="150" y="293" font-size="13" fill="#1b1b1b">438</text>
  <rect x="271" y="274" width="422" height="28" fill="#fff3e0" stroke="#b45309"/>
  <text x="281" y="293" font-size="13" fill="#1b1b1b">TV의 PV 1,406 (76%)</text>
  <text x="703" y="293" font-size="13" font-weight="bold" fill="#1b1b1b">EV 1,844</text>

  <text x="40" y="352" font-size="14" font-weight="bold" fill="#1b1b1b">할인율 9%</text>
  <rect x="140" y="334" width="128" height="28" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="150" y="353" font-size="13" fill="#1b1b1b">426</text>
  <rect x="268" y="334" width="345" height="28" fill="#fff3e0" stroke="#b45309"/>
  <text x="278" y="353" font-size="13" fill="#1b1b1b">TV의 PV 1,151</text>
  <text x="623" y="353" font-size="13" font-weight="bold" fill="#1b1b1b">EV 1,577</text>

  <!-- 순차입금 400 선: x = 140 + 120 = 260 -->
  <line x1="260" y1="204" x2="260" y2="372" stroke="#9d0208" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="150" y="390" font-size="13" fill="#9d0208">점선 = 순차입금 400. 점선 오른쪽 길이가 주주가치</text>

  <text x="40" y="430" font-size="13" fill="#495057">초록 = 1~5년차 현재가치 합, 주황 = 잔존가치의 현재가치. 막대 길이는 1억 = 0.3px 비례.</text>
  <text x="40" y="452" font-size="13" fill="#495057">금액은 가상 회사의 code/output.txt [1]·[3]에서 옮겼다.</text>
</svg>
