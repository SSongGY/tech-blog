<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-label="리스제공자의 분류. 소유에 따른 위험과 보상의 대부분이 이전되면 금융리스, 아니면 운용리스. 금융리스는 설비를 빼고 순투자 수취채권을 올리며 금융수익을 인식하고, 운용리스는 설비를 남겨 감가상각하고 리스료를 정액으로 수익 인식한다">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="440" fill="#f7f7f4"/>

  <text x="24" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b">리스제공자의 분류 — 위험과 보상의 대부분이 이전되는가</text>

  <rect x="240" y="52" width="400" height="56" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
  <text x="440" y="76" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">기초자산 소유에 따른 위험과 보상의</text>
  <text x="440" y="96" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">대부분이 이전되는가 (문단 62)</text>

  <path d="M340 108 L220 150" stroke="#2d6a4f" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M540 108 L660 150" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="250" y="124" font-family="sans-serif" font-size="13" fill="#2d6a4f" text-anchor="middle">예</text>
  <text x="630" y="124" font-family="sans-serif" font-size="13" fill="#b45309" text-anchor="middle">아니오</text>

  <rect x="24" y="152" width="420" height="204" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="234" y="178" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2d6a4f" text-anchor="middle">금융리스 (문단 67·75)</text>
  <text x="44" y="206" font-family="sans-serif" font-size="13" fill="#1b1b1b">· 개시일에 설비를 장부에서 뺀다</text>
  <text x="44" y="230" font-family="sans-serif" font-size="13" fill="#1b1b1b">· 같은 금액의 수취채권(리스순투자)을 올린다</text>
  <text x="44" y="254" font-family="sans-serif" font-size="13" fill="#1b1b1b">· 내재이자율로 재어 금융수익을 인식한다</text>
  <text x="44" y="278" font-family="sans-serif" font-size="13" fill="#1b1b1b">· 받는 리스료는 원금 회수와 금융수익으로 나뉜다</text>
  <text x="44" y="310" font-family="sans-serif" font-size="13" fill="#444">이익 모양: 순투자가 줄어드는 만큼 해마다 감소</text>
  <text x="44" y="334" font-family="sans-serif" font-size="13" fill="#444">설비 감가상각비는 인식하지 않는다</text>

  <rect x="456" y="152" width="400" height="204" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="656" y="178" font-family="sans-serif" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">운용리스 (문단 81·82)</text>
  <text x="476" y="206" font-family="sans-serif" font-size="13" fill="#1b1b1b">· 설비를 장부에 그대로 둔다</text>
  <text x="476" y="230" font-family="sans-serif" font-size="13" fill="#1b1b1b">· 정책에 따라 계속 감가상각한다 (문단 84)</text>
  <text x="476" y="254" font-family="sans-serif" font-size="13" fill="#1b1b1b">· 리스료를 정액(또는 체계적) 기준으로 수익 인식</text>
  <text x="476" y="278" font-family="sans-serif" font-size="13" fill="#1b1b1b">· 받은 현금과 수익의 차이는 미수·선수로 남는다</text>
  <text x="476" y="310" font-family="sans-serif" font-size="13" fill="#444">이익 모양: 수익과 상각이 정액이면 해마다 일정</text>
  <text x="476" y="334" font-family="sans-serif" font-size="13" fill="#444">제조·판매자도 개시일에 매출이익을 인식하지 않는다</text>

  <text x="24" y="390" font-family="sans-serif" font-size="13" fill="#444">금융리스로 보는 상황의 예 (문단 63): 소유권 이전 · 싼 매수선택권 · 리스기간이 내용연수의 상당 부분</text>
  <text x="24" y="412" font-family="sans-serif" font-size="13" fill="#444">· 리스료 현재가치가 공정가치의 대부분 · 이용자만 쓸 수 있는 특수 자산. 한 가지만으로 정해지지는 않는다 (문단 65)</text>
</svg>
