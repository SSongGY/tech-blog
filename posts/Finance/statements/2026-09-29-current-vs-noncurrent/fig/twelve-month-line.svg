<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>

  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">유동비율 150%인 두 회사 — 항목이 현금이 되고 나가는 시점 (가상, 억원)</text>

  <!-- 12개월 기준선 -->
  <rect x="560" y="48" width="290" height="372" fill="#f1f3f5"/>
  <line x1="560" y1="48" x2="560" y2="398" stroke="#495057" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="310" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">보고기간 후 12개월 이내 → 유동</text>
  <text x="705" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#495057">12개월 넘음 → 비유동</text>

  <!-- 가나전자 -->
  <text x="20" y="90" font-size="15" font-weight="bold" fill="#1b1b1b">가나전자</text>
  <line x1="80" y1="160" x2="820" y2="160" stroke="#495057" stroke-width="1.5"/>
  <circle cx="80" cy="160" r="5" fill="#2d6a4f"/>
  <text x="80" y="116" text-anchor="middle" font-size="13" fill="#2d6a4f">현금 60</text>
  <line x1="80" y1="121" x2="80" y2="155" stroke="#2d6a4f"/>
  <circle cx="120" cy="160" r="5" fill="#2d6a4f"/>
  <text x="140" y="136" text-anchor="start" font-size="13" fill="#2d6a4f">매출채권 60</text>
  <line x1="120" y1="140" x2="120" y2="155" stroke="#2d6a4f"/>
  <circle cx="240" cy="160" r="5" fill="#2d6a4f"/>
  <text x="240" y="136" text-anchor="middle" font-size="13" fill="#2d6a4f">재고 30</text>
  <line x1="240" y1="140" x2="240" y2="155" stroke="#2d6a4f"/>
  <circle cx="160" cy="160" r="5" fill="#9d0208"/>
  <text x="160" y="186" text-anchor="middle" font-size="13" fill="#9d0208">매입채무 70</text>
  <circle cx="320" cy="160" r="5" fill="#9d0208"/>
  <text x="320" y="186" text-anchor="middle" font-size="13" fill="#9d0208">단기차입금 30</text>
  <circle cx="800" cy="160" r="5" fill="#9d0208"/>
  <text x="800" y="186" text-anchor="end" font-size="13" fill="#9d0208">장기차입금 100</text>
  <text x="80" y="214" font-size="13" fill="#2d6a4f">누적 잔액이 가장 낮은 때도 +50 — 들어올 돈이 나갈 돈보다 먼저 온다</text>

  <!-- 다라물산 -->
  <text x="20" y="252" font-size="15" font-weight="bold" fill="#1b1b1b">다라물산</text>
  <rect x="200" y="300" width="280" height="40" fill="#fde2e4" stroke="#9d0208" stroke-width="1"/>
  <line x1="80" y1="320" x2="820" y2="320" stroke="#495057" stroke-width="1.5"/>
  <circle cx="80" cy="320" r="5" fill="#2d6a4f"/>
  <text x="80" y="284" text-anchor="middle" font-size="13" fill="#2d6a4f">현금 10</text>
  <line x1="80" y1="289" x2="80" y2="315" stroke="#2d6a4f"/>
  <circle cx="160" cy="320" r="5" fill="#2d6a4f"/>
  <text x="160" y="284" text-anchor="middle" font-size="13" fill="#2d6a4f">매출채권 20</text>
  <line x1="160" y1="289" x2="160" y2="315" stroke="#2d6a4f"/>
  <circle cx="480" cy="320" r="5" fill="#2d6a4f"/>
  <text x="480" y="284" text-anchor="middle" font-size="13" fill="#2d6a4f">재고 120</text>
  <line x1="480" y1="289" x2="480" y2="315" stroke="#2d6a4f"/>
  <text x="140" y="360" text-anchor="middle" font-size="13" fill="#9d0208">매입채무 20</text>
  <line x1="160" y1="325" x2="150" y2="346" stroke="#9d0208"/>
  <circle cx="200" cy="320" r="5" fill="#9d0208"/>
  <text x="240" y="360" text-anchor="middle" font-size="13" fill="#9d0208">단기차입금 80</text>
  <line x1="200" y1="325" x2="230" y2="346" stroke="#9d0208"/>
  <circle cx="800" cy="320" r="5" fill="#9d0208"/>
  <text x="800" y="346" text-anchor="end" font-size="13" fill="#9d0208">장기차입금 100</text>
  <text x="340" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#9d0208">3~9개월: 잔액 −70</text>
  <text x="80" y="388" font-size="13" fill="#9d0208">차입금은 3개월에 나가는데 재고는 10개월에야 현금이 된다 — 그 사이 70이 모자란다</text>

  <!-- 눈금 -->
  <text x="80" y="412" text-anchor="middle" font-size="13" fill="#495057">0</text>
  <text x="320" y="412" text-anchor="middle" font-size="13" fill="#495057">6</text>
  <text x="560" y="412" text-anchor="middle" font-size="13" fill="#495057">12</text>
  <text x="800" y="412" text-anchor="middle" font-size="13" fill="#495057">18개월</text>

  <text x="440" y="450" text-anchor="middle" font-size="13" fill="#495057">초록 = 현금이 들어오는 자산, 빨강 = 갚아야 하는 부채. 기준선 왼쪽 합계의 비율은 두 회사가 같다.</text>
</svg>
