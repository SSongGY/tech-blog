<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">고객 포인트 회계처리 순서 (제1115호)</text>

  <!-- 시작 -->
  <rect x="250" y="50" width="380" height="54" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="440" y="73" text-anchor="middle" font-size="14" fill="#1f2937">판매하면서 추가 구매 할인 선택권(포인트)을 준다</text>
  <text x="440" y="94" text-anchor="middle" font-size="13" fill="#4b5563">이 계약을 맺지 않으면 받을 수 없는 중요한 권리인가? (B40)</text>

  <!-- 아니오 -->
  <line x1="250" y1="77" x2="150" y2="77" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="150" y1="77" x2="150" y2="138" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="200" y="70" text-anchor="middle" font-size="13" fill="#4b5563">아니오</text>
  <rect x="30" y="140" width="240" height="78" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="150" y="164" text-anchor="middle" font-size="14" fill="#1f2937">마케팅 제안 (B41)</text>
  <text x="150" y="186" text-anchor="middle" font-size="13" fill="#4b5563">판매대가 전부 지금 수익</text>
  <text x="150" y="206" text-anchor="middle" font-size="13" fill="#4b5563">행사할 때 새 계약으로 처리</text>

  <!-- 예 -->
  <line x1="440" y1="104" x2="440" y2="138" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="456" y="126" font-size="13" fill="#4b5563">예 — 별도 수행의무</text>
  <rect x="300" y="140" width="420" height="78" rx="6" fill="#fffbeb" stroke="#b45309"/>
  <text x="510" y="164" text-anchor="middle" font-size="14" fill="#b45309">포인트의 개별 판매가격을 추정한다 (B42)</text>
  <text x="510" y="186" text-anchor="middle" font-size="13" fill="#4b5563">받을 할인 − ⑴ 포인트 없이도 받을 할인</text>
  <text x="510" y="206" text-anchor="middle" font-size="13" fill="#4b5563">× ⑵ 행사될 가능성</text>

  <line x1="510" y1="218" x2="510" y2="252" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="300" y="254" width="420" height="78" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="510" y="278" text-anchor="middle" font-size="14" fill="#1f2937">상대적 개별 판매가격으로 배분 (문단 74·76)</text>
  <text x="510" y="300" text-anchor="middle" font-size="13" fill="#4b5563">상품 몫 → 지금 수익</text>
  <text x="510" y="320" text-anchor="middle" font-size="13" fill="#4b5563">포인트 몫 → 계약부채</text>

  <line x1="510" y1="332" x2="510" y2="366" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="300" y="368" width="420" height="78" rx="6" fill="#ecfdf3" stroke="#2d6a4f"/>
  <text x="510" y="392" text-anchor="middle" font-size="14" fill="#2d6a4f">포인트를 쓰거나 만료될 때 수익 (B40)</text>
  <text x="510" y="414" text-anchor="middle" font-size="13" fill="#4b5563">안 쓰일 몫은 사용 패턴에 따라 함께 수익 (B46)</text>
  <text x="510" y="434" text-anchor="middle" font-size="13" fill="#4b5563">보고기간 말마다 총 사용 추정을 다시 잰다</text>

  <!-- 예제 숫자 -->
  <rect x="30" y="254" width="240" height="192" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="4,3"/>
  <text x="150" y="278" text-anchor="middle" font-size="14" fill="#1f2937">예제 (단위: 만원)</text>
  <text x="46" y="304" font-size="13" fill="#4b5563">대가 10,000 · 포인트 500점</text>
  <text x="46" y="326" font-size="13" fill="#4b5563">사용 예상 80% → 400</text>
  <text x="46" y="348" font-size="13" fill="#4b5563">상품 9,615.4 (96.15%)</text>
  <text x="46" y="370" font-size="13" fill="#4b5563">포인트 384.6 (3.85%)</text>
  <text x="46" y="392" font-size="13" fill="#4b5563">3년에 걸쳐 수익으로</text>
  <text x="46" y="414" font-size="13" fill="#4b5563">230.8 → 108.1 → 45.8</text>

  <text x="440" y="490" text-anchor="middle" font-size="13" fill="#6b7280">점선 상자는 기준서가 아니라 이 글의 가상 숫자다</text>
</svg>
