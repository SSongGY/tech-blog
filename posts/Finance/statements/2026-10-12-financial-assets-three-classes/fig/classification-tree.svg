<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
  </defs>

  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">금융자산 분류 — 두 가지 질문으로 세 갈래</text>

  <!-- 시작 -->
  <rect x="340" y="48" width="200" height="40" rx="6" fill="#f1f3f5" stroke="#495057"/>
  <text x="440" y="73" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">금융자산 취득</text>

  <!-- 채무상품 갈래 -->
  <rect x="120" y="120" width="260" height="48" rx="6" fill="#ffffff" stroke="#495057"/>
  <text x="250" y="142" text-anchor="middle" font-size="14" fill="#1b1b1b">① 현금흐름이 원금과 이자만인가</text>
  <text x="250" y="160" text-anchor="middle" font-size="13" fill="#495057">채무상품 (문단 4.1.2·4.1.2A)</text>

  <rect x="120" y="210" width="260" height="48" rx="6" fill="#ffffff" stroke="#495057"/>
  <text x="250" y="232" text-anchor="middle" font-size="14" fill="#1b1b1b">② 사업모형은 무엇인가</text>
  <text x="250" y="250" text-anchor="middle" font-size="13" fill="#495057">자산을 관리하는 방식</text>

  <!-- 지분상품 갈래 -->
  <rect x="540" y="120" width="260" height="48" rx="6" fill="#ffffff" stroke="#495057"/>
  <text x="670" y="142" text-anchor="middle" font-size="14" fill="#1b1b1b">단기매매가 아니고 OCI 선택?</text>
  <text x="670" y="160" text-anchor="middle" font-size="13" fill="#495057">지분상품 (문단 5.7.5, 취소불가)</text>

  <!-- 결과 박스 -->
  <rect x="40" y="310" width="170" height="64" rx="6" fill="#e9f5ee" stroke="#2d6a4f"/>
  <text x="125" y="334" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">상각후원가 (AC)</text>
  <text x="125" y="354" text-anchor="middle" font-size="13" fill="#2d6a4f">공정가치 변동 없음</text>

  <rect x="230" y="310" width="190" height="64" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="325" y="334" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">FVOCI (채무)</text>
  <text x="325" y="354" text-anchor="middle" font-size="13" fill="#b45309">OCI → 처분 시 재분류</text>

  <rect x="440" y="310" width="190" height="64" rx="6" fill="#fde2e4" stroke="#9d0208"/>
  <text x="535" y="334" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">FVPL (나머지 전부)</text>
  <text x="535" y="354" text-anchor="middle" font-size="13" fill="#9d0208">공정가치 변동 → 당기손익</text>

  <rect x="650" y="310" width="190" height="64" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="745" y="334" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">FVOCI (지분)</text>
  <text x="745" y="354" text-anchor="middle" font-size="13" fill="#b45309">OCI → 재분류 없음</text>

  <g stroke="#495057" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="400" y1="88" x2="290" y2="118"/>
    <line x1="480" y1="88" x2="630" y2="118"/>
    <line x1="250" y1="168" x2="250" y2="208"/>
    <line x1="380" y1="144" x2="560" y2="307"/>
    <line x1="190" y1="258" x2="130" y2="307"/>
    <line x1="290" y1="258" x2="320" y2="307"/>
    <line x1="380" y1="234" x2="500" y2="307"/>
    <line x1="630" y1="168" x2="610" y2="307"/>
    <line x1="720" y1="168" x2="745" y2="307"/>
  </g>

  <g font-size="13">
    <text x="320" y="106" text-anchor="middle" fill="#495057">채무상품</text>
    <text x="580" y="106" text-anchor="middle" fill="#495057">지분상품</text>
    <text x="262" y="193" fill="#2d6a4f">예</text>
    <text x="470" y="205" fill="#9d0208">아니오</text>
    <text x="120" y="290" text-anchor="middle" fill="#2d6a4f">수취</text>
    <text x="298" y="290" text-anchor="end" fill="#b45309">수취와 매도</text>
    <text x="462" y="303" text-anchor="end" fill="#9d0208">그 밖 (매매 등)</text>
    <text x="742" y="240" fill="#b45309">예</text>
    <text x="608" y="240" text-anchor="end" fill="#9d0208">아니오</text>
  </g>

  <line x1="30" y1="404" x2="850" y2="404" stroke="#ced4da"/>
  <text x="40" y="430" font-size="13" fill="#495057">AC·FVOCI 채무상품이 될 자산도 회계불일치를 줄이면 최초 인식 때 FVPL로 지정할 수 있다 (문단 4.1.5, 취소불가).</text>
  <text x="40" y="452" font-size="13" fill="#495057">분류는 사업모형을 바꿀 때만 다시 한다 (문단 4.4.1). 기대신용손실 손상은 AC와 FVOCI 채무상품에 적용한다 (문단 5.5.1).</text>
  <text x="40" y="474" font-size="13" fill="#495057">예제 숫자는 가상이며 code/output.txt [1]~[3]에 있다.</text>
</svg>
