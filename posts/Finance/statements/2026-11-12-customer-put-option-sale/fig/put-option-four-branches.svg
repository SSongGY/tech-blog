<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 시작 -->
  <rect x="250" y="20" width="380" height="54" rx="6" fill="#f1f3f5" stroke="#444"/>
  <text x="440" y="43" text-anchor="middle" font-size="15" font-weight="bold">고객이 요청하면 다시 사야 하는 의무(풋옵션)</text>
  <text x="440" y="63" text-anchor="middle" font-size="13" fill="#555">풋 가격 대 원래 판매가격 — 시간가치 고려 (B75)</text>

  <!-- 왼쪽: 낮다 -->
  <line x1="330" y1="74" x2="230" y2="118" stroke="#444" marker-end="url(#arrow)"/>
  <text x="222" y="98" font-size="13">낮다</text>
  <rect x="30" y="120" width="390" height="70" rx="6" fill="#f1f3f5" stroke="#444"/>
  <text x="225" y="146" text-anchor="middle" font-size="15" font-weight="bold">고객이 행사할 경제적 유인이 유의적인가</text>
  <text x="225" y="170" text-anchor="middle" font-size="13" fill="#555">풋 가격과 예상 시장가치, 남은 기간 (B71)</text>

  <!-- 오른쪽: 이상 -->
  <line x1="550" y1="74" x2="650" y2="118" stroke="#444" marker-end="url(#arrow)"/>
  <text x="630" y="98" font-size="13">같거나 높다</text>
  <rect x="460" y="120" width="390" height="70" rx="6" fill="#f1f3f5" stroke="#444"/>
  <text x="655" y="146" text-anchor="middle" font-size="15" font-weight="bold">풋 가격이 예상 시장가치보다 높은가</text>
  <text x="655" y="170" text-anchor="middle" font-size="13" fill="#555">B73·B74</text>

  <!-- 왼쪽 결과 -->
  <line x1="130" y1="190" x2="120" y2="246" stroke="#444" marker-end="url(#arrow)"/>
  <text x="96" y="222" font-size="13">예</text>
  <rect x="30" y="248" width="185" height="128" rx="6" fill="#fff8eb" stroke="#b45309" stroke-width="1.5"/>
  <text x="122" y="274" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">리스 (B70)</text>
  <text x="44" y="302" font-size="13">차액은 사용의 대가</text>
  <text x="44" y="324" font-size="13">판매후리스의 일부면</text>
  <text x="44" y="344" font-size="13">자산 유지 + 금융부채</text>

  <line x1="320" y1="190" x2="330" y2="246" stroke="#444" marker-end="url(#arrow)"/>
  <text x="334" y="222" font-size="13">아니오</text>
  <rect x="235" y="248" width="185" height="128" rx="6" fill="#e9f5ee" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="327" y="274" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d6a4f">반품권 판매</text>
  <text x="327" y="294" text-anchor="middle" font-size="13" fill="#2d6a4f">(B72 → B20~B27)</text>
  <text x="249" y="324" font-size="13">행사 예상 몫은</text>
  <text x="249" y="344" font-size="13">환불부채로</text>

  <!-- 오른쪽 결과 -->
  <line x1="560" y1="190" x2="550" y2="246" stroke="#444" marker-end="url(#arrow)"/>
  <text x="526" y="222" font-size="13">예</text>
  <rect x="460" y="248" width="185" height="128" rx="6" fill="#fdecec" stroke="#9d0208" stroke-width="1.5"/>
  <text x="552" y="274" text-anchor="middle" font-size="15" font-weight="bold" fill="#9d0208">금융약정 (B73)</text>
  <text x="474" y="302" font-size="13">자산 유지</text>
  <text x="474" y="324" font-size="13">받은 대가는 금융부채</text>
  <text x="474" y="344" font-size="13">차액은 이자 (B68)</text>

  <line x1="750" y1="190" x2="760" y2="246" stroke="#444" marker-end="url(#arrow)"/>
  <text x="764" y="222" font-size="13">아니오</text>
  <rect x="665" y="248" width="185" height="128" rx="6" fill="#e9f5ee" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="757" y="274" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d6a4f">반품권 판매</text>
  <text x="757" y="294" text-anchor="middle" font-size="13" fill="#2d6a4f">(B74 → B20~B27)</text>
  <text x="679" y="324" font-size="13">행사 유인이</text>
  <text x="679" y="344" font-size="13">유의적이지 않을 때</text>
</svg>
