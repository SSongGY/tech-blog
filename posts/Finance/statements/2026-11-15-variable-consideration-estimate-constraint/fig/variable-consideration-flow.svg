<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 1단계: 추정 -->
  <rect x="30" y="40" width="200" height="60" rx="6" fill="#f1f3f5" stroke="#444"/>
  <text x="130" y="66" text-anchor="middle" font-size="14">약속한 대가에</text>
  <text x="130" y="86" text-anchor="middle" font-size="14">변동금액이 있다 (문단 50)</text>

  <line x1="230" y1="70" x2="290" y2="70" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="295" y="20" width="250" height="44" rx="6" fill="#ffffff" stroke="#444"/>
  <text x="420" y="47" text-anchor="middle" font-size="14">⑴ 기댓값 — 비슷한 계약이 많을 때</text>
  <rect x="295" y="78" width="250" height="44" rx="6" fill="#ffffff" stroke="#444"/>
  <text x="420" y="105" text-anchor="middle" font-size="14">⑵ 가능성이 가장 높은 금액</text>
  <text x="420" y="142" text-anchor="middle" font-size="13" fill="#555">더 잘 예측하는 쪽 하나를 계약 전체에 (문단 53·54)</text>

  <line x1="545" y1="70" x2="605" y2="70" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2단계: 제약 -->
  <rect x="610" y="30" width="240" height="80" rx="6" fill="#fff8eb" stroke="#b45309"/>
  <text x="730" y="58" text-anchor="middle" font-size="14" fill="#b45309">제약 (문단 56·57)</text>
  <text x="730" y="80" text-anchor="middle" font-size="13">유의적으로 되돌리지 않을</text>
  <text x="730" y="98" text-anchor="middle" font-size="13">가능성이 매우 높은 만큼만</text>

  <line x1="730" y1="110" x2="730" y2="190" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="742" y="150" font-size="13" fill="#555">환원 가능성 × 크기</text>

  <rect x="610" y="195" width="240" height="50" rx="6" fill="#e9f5ef" stroke="#2d6a4f"/>
  <text x="730" y="225" text-anchor="middle" font-size="14" fill="#2d6a4f">거래가격에 포함할 금액</text>

  <!-- 3단계: 재추정 -->
  <line x1="610" y1="220" x2="440" y2="220" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="190" y="190" width="245" height="60" rx="6" fill="#f1f3f5" stroke="#444"/>
  <text x="312" y="216" text-anchor="middle" font-size="14">보고기간 말마다 다시 추정</text>
  <text x="312" y="236" text-anchor="middle" font-size="13">제약 여부도 다시 평가 (문단 59)</text>

  <line x1="312" y1="250" x2="312" y2="300" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="120" y="305" width="385" height="60" rx="6" fill="#ffffff" stroke="#444"/>
  <text x="312" y="331" text-anchor="middle" font-size="14">변동분 중 이미 이행한 몫은</text>
  <text x="312" y="351" text-anchor="middle" font-size="14">바뀐 기간의 수익에 더하거나 뺀다 (문단 88)</text>

  <text x="440" y="400" text-anchor="middle" font-size="13" fill="#555">추정은 "얼마를 받을까", 제약은 "그중 얼마까지 지금 수익으로 잡아도 되나"를 정한다</text>
</svg>
