<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
  </defs>

  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">같은 매입 5,200 이 매출원가와 기말재고로 나뉘는 방식</text>

  <!-- 매입 층 -->
  <text x="140" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">1년차 매입 (단가 오름)</text>
  <g font-size="13" fill="#1b1b1b" text-anchor="middle">
    <rect x="60" y="80" width="160" height="40" fill="#f1f3f5" stroke="#495057"/>
    <text x="140" y="105">1분기 100개 × 10</text>
    <rect x="60" y="120" width="160" height="40" fill="#f1f3f5" stroke="#495057"/>
    <text x="140" y="145">2분기 100개 × 12</text>
    <rect x="60" y="160" width="160" height="40" fill="#f1f3f5" stroke="#495057"/>
    <text x="140" y="185">3분기 100개 × 14</text>
    <rect x="60" y="200" width="160" height="40" fill="#f1f3f5" stroke="#495057"/>
    <text x="140" y="225">4분기 100개 × 16</text>
  </g>

  <!-- 선입선출 -->
  <text x="480" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">선입선출법 (가나전자)</text>
  <rect x="380" y="80" width="200" height="120" rx="4" fill="#fef3c7" stroke="#b45309"/>
  <text x="480" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">매출원가 3,600</text>
  <text x="480" y="152" text-anchor="middle" font-size="13" fill="#495057">오래된 10·12·14 층</text>
  <rect x="380" y="200" width="200" height="40" rx="4" fill="#e9f5ee" stroke="#2d6a4f"/>
  <text x="480" y="225" text-anchor="middle" font-size="13" fill="#1b1b1b">기말재고 1,600 (최근 16 층)</text>

  <!-- 총평균 -->
  <text x="740" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">총평균법 (다라물산)</text>
  <rect x="640" y="80" width="200" height="120" rx="4" fill="#fef3c7" stroke="#b45309"/>
  <text x="740" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">매출원가 3,900</text>
  <text x="740" y="152" text-anchor="middle" font-size="13" fill="#495057">300개 × 평균 13</text>
  <rect x="640" y="200" width="200" height="40" rx="4" fill="#e9f5ee" stroke="#2d6a4f"/>
  <text x="740" y="225" text-anchor="middle" font-size="13" fill="#1b1b1b">기말재고 1,300 (100개 × 13)</text>

  <g stroke="#495057" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="220" y1="160" x2="376" y2="160"/>
  </g>
  <text x="298" y="150" text-anchor="middle" font-size="13" fill="#495057">공식 적용</text>
  <text x="610" y="165" text-anchor="middle" font-size="13" fill="#495057">또는</text>

  <!-- 결과 띠 -->
  <rect x="60" y="280" width="780" height="110" rx="6" fill="#ffffff" stroke="#ced4da"/>
  <text x="80" y="308" font-size="14" font-weight="bold" fill="#1b1b1b">값이 오를 때</text>
  <text x="80" y="332" font-size="13" fill="#1b1b1b">선입선출은 싼 옛 원가가 매출원가로 가고 비싼 최근 원가가 재고에 남는다 → 이익·재고가 크게 잡힌다</text>
  <text x="80" y="362" font-size="14" font-weight="bold" fill="#1b1b1b">값이 내릴 때</text>
  <text x="80" y="384" font-size="13" fill="#1b1b1b">방향이 뒤집힌다 → 예제 3년차에 선입선출의 매출총이익이 768 작다</text>

  <line x1="30" y1="420" x2="850" y2="420" stroke="#ced4da"/>
  <text x="40" y="446" font-size="13" fill="#495057">두 방법 모두 매출원가 + 기말재고 = 매입 합계 5,200 이다. 숫자는 가상이며 code/output.txt [2]에 있다.</text>
</svg>
