<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="880" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="440" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">판매후리스 — 판매자-리스이용자의 회계처리 순서</text>

  <rect x="290" y="52" width="300" height="50" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="440" y="82" text-anchor="middle" font-size="14" fill="#111827">자산을 넘기고 다시 빌린다 (문단 98)</text>

  <line x1="440" y1="102" x2="440" y2="130" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="270" y="132" width="340" height="62" rx="6" fill="#fdf3e6" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">이전이 판매인가</text>
  <text x="440" y="180" text-anchor="middle" font-size="13" fill="#1f2937">제1115호의 통제 이전 기준으로 판단 (문단 99)</text>

  <!-- 판매 -->
  <line x1="350" y1="194" x2="230" y2="232" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="262" y="208" text-anchor="middle" font-size="13" fill="#2d6a4f">판매다</text>
  <rect x="40" y="234" width="400" height="76" rx="6" fill="#e8f3ee" stroke="#2d6a4f" stroke-width="2"/>
  <text x="240" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">판매가격을 공정가치로 맞춘다 (문단 101)</text>
  <text x="240" y="282" text-anchor="middle" font-size="13" fill="#1f2937">공정가치보다 낮게 받은 몫 → 선급리스료</text>
  <text x="240" y="300" text-anchor="middle" font-size="13" fill="#1f2937">공정가치보다 높게 받은 몫 → 추가 금융</text>

  <line x1="240" y1="310" x2="240" y2="346" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="348" width="400" height="118" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="240" y="374" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">사용권자산과 처분손익 (문단 100⑴)</text>
  <text x="240" y="398" text-anchor="middle" font-size="13" fill="#1f2937">사용권자산 = 종전 장부금액 × 보유 비율</text>
  <text x="240" y="420" text-anchor="middle" font-size="13" fill="#1f2937">보유 비율 = 사용권의 대가 ÷ 자산 공정가치</text>
  <text x="240" y="446" text-anchor="middle" font-size="13" fill="#4b5563">처분손익은 이전한 권리의 몫만 인식</text>

  <!-- 판매 아님 -->
  <line x1="530" y1="194" x2="650" y2="232" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="652" y="208" text-anchor="middle" font-size="13" fill="#9d0208">판매가 아니다</text>
  <rect x="480" y="234" width="360" height="76" rx="6" fill="#fbeaea" stroke="#9d0208" stroke-width="2"/>
  <text x="660" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d0208">자산을 계속 인식한다 (문단 103⑴)</text>
  <text x="660" y="282" text-anchor="middle" font-size="13" fill="#1f2937">받은 돈 전액을 금융부채로 인식</text>
  <text x="660" y="300" text-anchor="middle" font-size="13" fill="#1f2937">제1109호 적용</text>

  <line x1="660" y1="310" x2="660" y2="346" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="480" y="348" width="360" height="118" rx="6" fill="#ffffff" stroke="#9d0208" stroke-width="2"/>
  <text x="660" y="374" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">재무제표에 남는 것</text>
  <text x="660" y="398" text-anchor="middle" font-size="13" fill="#1f2937">건물은 장부금액 그대로</text>
  <text x="660" y="420" text-anchor="middle" font-size="13" fill="#1f2937">사용권자산·리스부채 없음</text>
  <text x="660" y="446" text-anchor="middle" font-size="13" fill="#4b5563">처분손익 없음</text>
</svg>
