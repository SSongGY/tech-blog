<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">계약원가 자산의 손상 — 검사 순서와 한도 (제1115호 문단 101~104)</text>

  <!-- 왼쪽: 순서 (문단 103) -->
  <text x="160" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">검사 순서 (문단 103)</text>
  <rect x="30" y="80" width="260" height="58" rx="6" fill="#f3f4f6" stroke="#4b5563"/>
  <text x="160" y="104" text-anchor="middle" font-size="14" fill="#1f2937">① 다른 기준서의 자산 손상</text>
  <text x="160" y="125" text-anchor="middle" font-size="13" fill="#4b5563">재고자산·유형자산·무형자산</text>
  <line x1="160" y1="138" x2="160" y2="166" stroke="#4b5563" marker-end="url(#arr)"/>
  <rect x="30" y="168" width="260" height="58" rx="6" fill="#fffbeb" stroke="#b45309"/>
  <text x="160" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">② 계약원가 자산</text>
  <text x="160" y="213" text-anchor="middle" font-size="13" fill="#b45309">문단 101 한도와 비교</text>
  <line x1="160" y1="226" x2="160" y2="254" stroke="#4b5563" marker-end="url(#arr)"/>
  <rect x="30" y="256" width="260" height="58" rx="6" fill="#f3f4f6" stroke="#4b5563"/>
  <text x="160" y="280" text-anchor="middle" font-size="14" fill="#1f2937">③ 현금창출단위 손상</text>
  <text x="160" y="301" text-anchor="middle" font-size="13" fill="#4b5563">제1036호, ② 반영 후 금액 포함</text>

  <!-- 오른쪽: 한도 막대 (예제 2년차 말), 1 = 0.25px -->
  <text x="600" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">예제 2년차 말 (단위 천원)</text>
  <text x="340" y="104" font-size="13" fill="#1f2937">⑴ 받을 대가</text>
  <rect x="440" y="88" width="391" height="26" fill="#ecfdf3" stroke="#2d6a4f"/>
  <text x="636" y="106" text-anchor="middle" font-size="13" fill="#2d6a4f">1,767 (신용위험 반영, 변동대가 제약 미적용)</text>

  <text x="340" y="148" font-size="13" fill="#1f2937">⑵ 남은 직접원가</text>
  <rect x="440" y="132" width="299" height="26" fill="#f3f4f6" stroke="#4b5563"/>
  <text x="590" y="150" text-anchor="middle" font-size="13" fill="#1f2937">1,350</text>
  <rect x="739" y="132" width="92" height="26" fill="#ecfdf3" stroke="#2d6a4f" stroke-dasharray="4 3"/>
  <text x="785" y="150" text-anchor="middle" font-size="13" fill="#2d6a4f">417</text>

  <text x="340" y="198" font-size="13" fill="#1f2937">한도 ⑴ − ⑵</text>
  <rect x="440" y="182" width="92" height="26" fill="#ecfdf3" stroke="#2d6a4f"/>
  <text x="486" y="200" text-anchor="middle" font-size="13" fill="#2d6a4f">417</text>

  <text x="340" y="242" font-size="13" fill="#1f2937">장부금액</text>
  <rect x="440" y="226" width="92" height="26" fill="#fffbeb" stroke="#b45309"/>
  <rect x="532" y="226" width="14" height="26" fill="#fde2e2" stroke="#9d0208"/>
  <text x="486" y="244" text-anchor="middle" font-size="13" fill="#b45309">480</text>
  <text x="556" y="244" font-size="13" fill="#9d0208">초과분 63 → 손상차손</text>

  <!-- 환입 -->
  <rect x="340" y="282" width="510" height="32" rx="6" fill="#ffffff" stroke="#4b5563"/>
  <text x="595" y="303" text-anchor="middle" font-size="13" fill="#1f2937">환입 상한 = 손상이 없었다면 산정됐을 상각 후 금액 (문단 104)</text>

  <!-- 판단 -->
  <rect x="30" y="346" width="820" height="104" rx="6" fill="#fffbeb" stroke="#b45309"/>
  <text x="50" y="372" font-size="14" font-weight="bold" fill="#b45309">읽는 법</text>
  <text x="50" y="398" font-size="13" fill="#1f2937">남은 대가로 남은 원가를 치르고 남는 금액이 자산 장부금액보다 작으면, 그 차이만큼 회수되지 않는다고 본다</text>
  <text x="50" y="422" font-size="13" fill="#1f2937">계약 전체로는 이익이 남아도(1,767 &gt; 1,350) 자산이 손상될 수 있다 — 손실부담계약 판단과 다른 질문이다</text>
  <text x="50" y="442" font-size="13" fill="#4b5563">⑵는 아직 비용으로 인식하지 않은 직접 관련 원가만 넣는다 (문단 101⑵, 97)</text>
</svg>
