<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="430" fill="#fdfdfb"/>

  <text x="30" y="32" font-size="17" font-weight="bold" fill="#1e293b">같은 600을 쓰고도 손익계산서에 찍히는 해가 달라진다</text>
  <text x="30" y="54" font-size="13" fill="#475569">1~2년차에 해마다 300씩 지출하는 같은 프로젝트. 자산화한 개발비는 완성 후 5년 정액상각 (금액 단위 억원)</text>

  <!-- 기간 띠 -->
  <rect x="170" y="92" width="190" height="248" fill="#f1f5f9"/>
  <text x="265" y="86" font-size="13" fill="#475569" text-anchor="middle">개발 기간</text>
  <text x="597" y="86" font-size="13" fill="#475569" text-anchor="middle">완성 후 상각 기간</text>

  <!-- 연도 -->
  <text x="217" y="110" font-size="13" fill="#334155" text-anchor="middle">1년차</text>
  <text x="312" y="110" font-size="13" fill="#334155" text-anchor="middle">2년차</text>
  <text x="407" y="110" font-size="13" fill="#334155" text-anchor="middle">3년차</text>
  <text x="502" y="110" font-size="13" fill="#334155" text-anchor="middle">4년차</text>
  <text x="597" y="110" font-size="13" fill="#334155" text-anchor="middle">5년차</text>
  <text x="692" y="110" font-size="13" fill="#334155" text-anchor="middle">6년차</text>
  <text x="787" y="110" font-size="13" fill="#334155" text-anchor="middle">7년차</text>
  <line x1="170" y1="120" x2="835" y2="120" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- 가나전자 -->
  <text x="30" y="200" font-size="14" font-weight="bold" fill="#1e293b">가나전자</text>
  <text x="30" y="220" font-size="13" fill="#475569">전액 비용 처리</text>
  <line x1="170" y1="215" x2="835" y2="215" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="187" y="140" width="60" height="75" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/>
  <text x="217" y="134" font-size="13" fill="#1e293b" text-anchor="middle">300</text>
  <rect x="282" y="140" width="60" height="75" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/>
  <text x="312" y="134" font-size="13" fill="#1e293b" text-anchor="middle">300</text>
  <text x="597" y="196" font-size="13" fill="#94a3b8" text-anchor="middle">3년차부터는 손익에 아무것도 남지 않는다</text>

  <!-- 다라물산 -->
  <text x="30" y="316" font-size="14" font-weight="bold" fill="#1e293b">다라물산</text>
  <text x="30" y="336" font-size="13" fill="#475569">60% 자산화 후 상각</text>
  <line x1="170" y1="330" x2="835" y2="330" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="187" y="300" width="60" height="30" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/>
  <text x="217" y="294" font-size="13" fill="#1e293b" text-anchor="middle">120</text>
  <rect x="282" y="300" width="60" height="30" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/>
  <text x="312" y="294" font-size="13" fill="#1e293b" text-anchor="middle">120</text>
  <rect x="377" y="312" width="60" height="18" fill="#fef3e2" stroke="#b45309" stroke-width="1.6"/>
  <text x="407" y="306" font-size="13" fill="#b45309" text-anchor="middle">72</text>
  <rect x="472" y="312" width="60" height="18" fill="#fef3e2" stroke="#b45309" stroke-width="1.6"/>
  <text x="502" y="306" font-size="13" fill="#b45309" text-anchor="middle">72</text>
  <rect x="567" y="312" width="60" height="18" fill="#fef3e2" stroke="#b45309" stroke-width="1.6"/>
  <text x="597" y="306" font-size="13" fill="#b45309" text-anchor="middle">72</text>
  <rect x="662" y="312" width="60" height="18" fill="#fef3e2" stroke="#b45309" stroke-width="1.6"/>
  <text x="692" y="306" font-size="13" fill="#b45309" text-anchor="middle">72</text>
  <rect x="757" y="312" width="60" height="18" fill="#fef3e2" stroke="#b45309" stroke-width="1.6"/>
  <text x="787" y="306" font-size="13" fill="#b45309" text-anchor="middle">72</text>

  <!-- 자산화 표시 -->
  <path d="M265,240 L265,268 L370,268" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="275" y="258" font-size="13" fill="#2d6a4f">자산으로 넘긴 360이 3년차부터 상각으로 돌아온다</text>

  <!-- 합계 -->
  <text x="30" y="372" font-size="13" fill="#1e293b">7년 동안 손익에 들어간 연구개발비는 두 회사 모두 600이다. 자산화는 총액이 아니라 찍히는 해를 바꾼다.</text>

  <!-- 범례 -->
  <rect x="30" y="394" width="16" height="16" fill="#e2e8f0" stroke="#334155" stroke-width="1.4"/>
  <text x="54" y="407" font-size="13" fill="#334155">지출한 해에 바로 비용</text>
  <rect x="250" y="394" width="16" height="16" fill="#fef3e2" stroke="#b45309" stroke-width="1.4"/>
  <text x="274" y="407" font-size="13" fill="#334155">자산으로 올렸다가 상각으로 나오는 비용</text>
</svg>
