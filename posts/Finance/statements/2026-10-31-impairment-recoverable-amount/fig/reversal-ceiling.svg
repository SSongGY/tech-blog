<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="430" fill="#fbfbfd"/>

  <!-- 축 -->
  <line x1="110" y1="360" x2="810" y2="360" stroke="#94a3b8" stroke-width="1"/>
  <line x1="110" y1="60" x2="110" y2="360" stroke="#94a3b8" stroke-width="1"/>
  <text x="140" y="382" font-size="13" fill="#475569" text-anchor="middle">손상 직전</text>
  <text x="240" y="382" font-size="13" fill="#475569" text-anchor="middle">손상 인식</text>
  <text x="420" y="382" font-size="13" fill="#475569" text-anchor="middle">1년 뒤</text>
  <text x="600" y="382" font-size="13" fill="#475569" text-anchor="middle">2년 뒤</text>

  <!-- 손상차손을 인식하지 않았을 경우의 경로 -->
  <polyline points="140,80 240,80 420,136 600,192" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="140" cy="80" r="4" fill="#94a3b8"/>
  <circle cx="420" cy="136" r="4" fill="#94a3b8"/>
  <circle cx="600" cy="192" r="4" fill="#94a3b8"/>
  <text x="300" y="70" font-size="13" fill="#475569">손상을 인식하지 않았을 경우 1,000.0 → 800.0 → 600.0</text>

  <!-- 손상을 인식한 경로 -->
  <line x1="140" y1="80" x2="240" y2="80" stroke="#334155" stroke-width="2"/>
  <line x1="240" y1="80" x2="240" y2="137" stroke="#9d0208" stroke-width="3"/>
  <polyline points="240,137 420,181.6 600,226.2" fill="none" stroke="#334155" stroke-width="2"/>
  <circle cx="240" cy="137" r="4" fill="#334155"/>
  <circle cx="420" cy="181.6" r="4" fill="#334155"/>
  <circle cx="600" cy="226.2" r="4" fill="#334155"/>
  <text x="252" y="132" font-size="13" fill="#9d0208">손상차손 203.6</text>
  <text x="140" y="258" font-size="13" fill="#334155">손상 반영 796.4 → 637.1 → 477.8</text>

  <!-- 환입 한도 -->
  <line x1="560" y1="192" x2="800" y2="192" stroke="#2d6a4f" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="800" y="212" font-size="13" fill="#2d6a4f" text-anchor="end">환입 한도 600.0 (문단 117)</text>

  <!-- 회복된 회수가능액 -->
  <circle cx="660" cy="178" r="4" fill="#b45309"/>
  <text x="674" y="156" font-size="13" fill="#b45309">회복된 회수가능액 650.0</text>
  <text x="674" y="174" font-size="13" fill="#b45309">여기까지는 올리지 못한다</text>

  <!-- 환입 화살표 -->
  <line x1="600" y1="226.2" x2="600" y2="200" stroke="#2d6a4f" stroke-width="2"/>
  <polygon points="600,192 595,202 605,202" fill="#2d6a4f"/>
  <text x="800" y="250" font-size="13" fill="#2d6a4f" text-anchor="end">손상차손환입 122.2 (문단 114·119)</text>

  <!-- 영업권 대조 -->
  <rect x="140" y="300" width="310" height="34" rx="6" fill="#ffffff" stroke="#9d0208"/>
  <text x="295" y="322" font-size="14" fill="#9d0208" text-anchor="middle">같은 상황이 영업권이면 환입 0 (문단 124)</text>

  <text x="110" y="414" font-size="13" fill="#475569">단위: 백만원 · 세로축은 장부금액 · 가상 회사 가나제철</text>
</svg>
