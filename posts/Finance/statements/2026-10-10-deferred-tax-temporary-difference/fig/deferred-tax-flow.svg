<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
  </defs>

  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">회계이익과 과세소득의 차이가 법인세비용으로 이어지는 경로</text>

  <!-- 회계이익 -->
  <rect x="30" y="110" width="180" height="60" rx="6" fill="#f1f3f5" stroke="#495057"/>
  <text x="120" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">회계이익</text>
  <text x="120" y="157" text-anchor="middle" font-size="13" fill="#495057">K-IFRS 기준 세전이익</text>

  <!-- 영구적차이 -->
  <rect x="285" y="55" width="240" height="60" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="405" y="81" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">영구적차이 (예: 비공제 비용)</text>
  <text x="405" y="102" text-anchor="middle" font-size="13" fill="#b45309">풀리지 않음 → 유효세율 변동</text>

  <!-- 일시적차이 -->
  <rect x="285" y="160" width="240" height="60" rx="6" fill="#e9f5ee" stroke="#2d6a4f"/>
  <text x="405" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">일시적차이 (예: 상각 방법)</text>
  <text x="405" y="207" text-anchor="middle" font-size="13" fill="#2d6a4f">나중에 반대 방향으로 풀림</text>

  <!-- 과세소득 -->
  <rect x="620" y="110" width="230" height="60" rx="6" fill="#f1f3f5" stroke="#495057"/>
  <text x="735" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">과세소득</text>
  <text x="735" y="157" text-anchor="middle" font-size="13" fill="#495057">세법 기준 소득</text>

  <g stroke="#495057" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="210" y1="130" x2="283" y2="90"/>
    <line x1="210" y1="150" x2="283" y2="188"/>
    <line x1="525" y1="90" x2="618" y2="130"/>
    <line x1="525" y1="188" x2="618" y2="152"/>
    <line x1="735" y1="170" x2="735" y2="258"/>
    <line x1="405" y1="220" x2="405" y2="258"/>
    <line x1="405" y1="320" x2="405" y2="368"/>
    <line x1="735" y1="320" x2="735" y2="368"/>
  </g>

  <!-- 이연법인세자산·부채 -->
  <rect x="285" y="260" width="240" height="60" rx="6" fill="#e9f5ee" stroke="#2d6a4f"/>
  <text x="405" y="286" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">이연법인세자산·부채</text>
  <text x="405" y="307" text-anchor="middle" font-size="13" fill="#495057">일시적차이 × 세율 (재무상태표)</text>

  <!-- 당기법인세 -->
  <rect x="620" y="260" width="230" height="60" rx="6" fill="#f1f3f5" stroke="#495057"/>
  <text x="735" y="286" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">당기법인세</text>
  <text x="735" y="307" text-anchor="middle" font-size="13" fill="#495057">과세소득 × 세율, 올해 낼 세금</text>

  <!-- 법인세비용 -->
  <rect x="285" y="370" width="565" height="56" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.5"/>
  <text x="567" y="394" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">법인세비용 = 당기법인세 + 이연법인세자산·부채의 변동</text>
  <text x="567" y="414" text-anchor="middle" font-size="13" fill="#495057">손익계산서에 표시 (문단 58)</text>

  <line x1="30" y1="446" x2="850" y2="446" stroke="#ced4da"/>
  <text x="40" y="468" font-size="13" fill="#495057">가나전자 1년차: 회계이익 300, 과세소득 250 → 당기법인세 50 + 이연법인세 10 = 법인세비용 60</text>
  <text x="40" y="488" font-size="13" fill="#495057">3년차: 과세소득 350 → 당기법인세 70 − 이연법인세 10 = 60. 3년 합계는 둘 다 180이다.</text>
  <text x="40" y="508" font-size="13" fill="#495057">세율 20%는 가정. 회사와 숫자는 가상이며 code/output.txt [2]에 있다.</text>
</svg>
