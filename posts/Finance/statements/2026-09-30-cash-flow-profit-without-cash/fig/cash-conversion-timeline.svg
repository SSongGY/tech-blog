<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>

  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">원재료를 산 날부터 현금을 받는 날까지 — 거래 한 건의 시간표 (가상)</text>

  <!-- 날짜 축: 0일 = x180, 1일 = 3px -->
  <line x1="180" y1="62" x2="820" y2="62" stroke="#495057" stroke-width="1"/>
  <text x="180" y="54" text-anchor="middle" font-size="13" fill="#495057">0일</text>
  <text x="270" y="54" text-anchor="middle" font-size="13" fill="#495057">30</text>
  <text x="360" y="54" text-anchor="middle" font-size="13" fill="#495057">60</text>
  <text x="450" y="54" text-anchor="middle" font-size="13" fill="#495057">90</text>
  <text x="540" y="54" text-anchor="middle" font-size="13" fill="#495057">120</text>
  <text x="630" y="54" text-anchor="middle" font-size="13" fill="#495057">150</text>
  <text x="720" y="54" text-anchor="middle" font-size="13" fill="#495057">180</text>
  <text x="810" y="54" text-anchor="middle" font-size="13" fill="#495057">210</text>

  <!-- 마바상사 -->
  <text x="20" y="100" font-size="15" font-weight="bold" fill="#1b1b1b">마바상사</text>
  <text x="20" y="120" font-size="13" fill="#495057">회수 30 · 재고 30</text>
  <text x="20" y="138" font-size="13" fill="#495057">지급 30 (일)</text>

  <rect x="180" y="84" width="90" height="24" fill="#e9ecef" stroke="#495057"/>
  <text x="225" y="101" text-anchor="middle" font-size="13" fill="#1b1b1b">재고 30일</text>
  <rect x="270" y="84" width="90" height="24" fill="#e9ecef" stroke="#495057"/>
  <text x="315" y="101" text-anchor="middle" font-size="13" fill="#1b1b1b">외상 30일</text>

  <rect x="180" y="114" width="90" height="24" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="225" y="131" text-anchor="middle" font-size="13" fill="#2d6a4f">지급 유예</text>

  <rect x="270" y="144" width="90" height="24" fill="#fde2e4" stroke="#9d0208"/>
  <text x="370" y="161" font-size="13" fill="#9d0208">현금이 묶인 30일</text>

  <line x1="270" y1="76" x2="270" y2="176" stroke="#b45309" stroke-dasharray="4 3"/>
  <line x1="360" y1="76" x2="360" y2="176" stroke="#2d6a4f" stroke-dasharray="4 3"/>

  <!-- 사아유통 -->
  <text x="20" y="226" font-size="15" font-weight="bold" fill="#1b1b1b">사아유통</text>
  <text x="20" y="246" font-size="13" fill="#495057">회수 120 · 재고 90</text>
  <text x="20" y="264" font-size="13" fill="#495057">지급 30 (일)</text>

  <rect x="180" y="210" width="270" height="24" fill="#e9ecef" stroke="#495057"/>
  <text x="315" y="227" text-anchor="middle" font-size="13" fill="#1b1b1b">재고 90일</text>
  <rect x="450" y="210" width="360" height="24" fill="#e9ecef" stroke="#495057"/>
  <text x="630" y="227" text-anchor="middle" font-size="13" fill="#1b1b1b">외상 120일</text>

  <rect x="180" y="240" width="90" height="24" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="225" y="257" text-anchor="middle" font-size="13" fill="#2d6a4f">지급 유예</text>

  <rect x="270" y="270" width="540" height="24" fill="#fde2e4" stroke="#9d0208"/>
  <text x="540" y="287" text-anchor="middle" font-size="13" fill="#9d0208">현금이 묶인 180일</text>

  <line x1="450" y1="202" x2="450" y2="302" stroke="#b45309" stroke-dasharray="4 3"/>
  <line x1="810" y1="202" x2="810" y2="302" stroke="#2d6a4f" stroke-dasharray="4 3"/>

  <!-- 범례 -->
  <line x1="20" y1="344" x2="52" y2="344" stroke="#b45309" stroke-dasharray="4 3" stroke-width="2"/>
  <text x="60" y="349" font-size="13" fill="#1b1b1b">판매 — 이 날 매출과 이익이 손익계산서에 잡힌다</text>
  <line x1="20" y1="370" x2="52" y2="370" stroke="#2d6a4f" stroke-dasharray="4 3" stroke-width="2"/>
  <text x="60" y="375" font-size="13" fill="#1b1b1b">회수 — 이 날 현금이 들어와 현금흐름표에 잡힌다</text>
  <rect x="20" y="387" width="32" height="16" fill="#fde2e4" stroke="#9d0208"/>
  <text x="60" y="400" font-size="13" fill="#1b1b1b">원재료 대금은 이미 나갔는데 판매 대금은 아직 안 들어온 기간 = 회수일 + 재고일 − 지급일</text>

  <text x="20" y="436" font-size="13" fill="#495057">회수일 + 재고일은 정상영업주기(재고 취득부터 현금 회수까지)에 해당한다. 묶인 기간이 길수록</text>
  <text x="20" y="456" font-size="13" fill="#495057">매출이 늘 때 채권과 재고로 먼저 들어가는 현금이 커진다.</text>
</svg>
