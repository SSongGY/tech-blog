<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">계약을 따내며 쓴 원가는 어디로 가는가 (제1115호 문단 91~94·99)</text>

  <!-- 시작 -->
  <rect x="330" y="50" width="220" height="40" rx="6" fill="#f3f4f6" stroke="#4b5563"/>
  <text x="440" y="75" text-anchor="middle" font-size="14" fill="#1f2937">계약 체결 전후에 든 원가</text>

  <!-- 질문 1 -->
  <line x1="440" y1="90" x2="440" y2="118" stroke="#4b5563" marker-end="url(#arr)"/>
  <rect x="250" y="120" width="380" height="44" rx="6" fill="#fffbeb" stroke="#b45309"/>
  <text x="440" y="147" text-anchor="middle" font-size="14" fill="#1f2937">계약을 맺지 않았어도 들었을 원가인가 (문단 92)</text>

  <!-- 예 → 비용 -->
  <line x1="250" y1="142" x2="182" y2="142" stroke="#4b5563" marker-end="url(#arr)"/>
  <text x="216" y="134" text-anchor="middle" font-size="13" fill="#4b5563">예</text>
  <rect x="20" y="118" width="160" height="62" rx="6" fill="#fde2e2" stroke="#9d0208"/>
  <text x="100" y="143" text-anchor="middle" font-size="14" fill="#9d0208">발생 시점 비용</text>
  <text x="100" y="164" text-anchor="middle" font-size="13" fill="#9d0208">문단 93</text>

  <!-- 질문 2 -->
  <line x1="440" y1="164" x2="440" y2="200" stroke="#4b5563" marker-end="url(#arr)"/>
  <text x="456" y="187" font-size="13" fill="#4b5563">아니오 — 증분원가</text>
  <rect x="250" y="202" width="380" height="44" rx="6" fill="#fffbeb" stroke="#b45309"/>
  <text x="440" y="229" text-anchor="middle" font-size="14" fill="#1f2937">회수될 것으로 예상되는가 (문단 91)</text>

  <line x1="250" y1="224" x2="182" y2="224" stroke="#4b5563" marker-end="url(#arr)"/>
  <text x="216" y="216" text-anchor="middle" font-size="13" fill="#4b5563">아니오</text>
  <rect x="20" y="200" width="160" height="48" rx="6" fill="#fde2e2" stroke="#9d0208"/>
  <text x="100" y="229" text-anchor="middle" font-size="14" fill="#9d0208">발생 시점 비용</text>

  <!-- 질문 3 -->
  <line x1="440" y1="246" x2="440" y2="282" stroke="#4b5563" marker-end="url(#arr)"/>
  <text x="456" y="269" font-size="13" fill="#4b5563">예</text>
  <rect x="250" y="284" width="380" height="44" rx="6" fill="#fffbeb" stroke="#b45309"/>
  <text x="440" y="311" text-anchor="middle" font-size="14" fill="#1f2937">상각기간이 1년 이하인가 — 예상 갱신 포함 (문단 94·99)</text>

  <line x1="630" y1="306" x2="698" y2="306" stroke="#4b5563" marker-end="url(#arr)"/>
  <text x="664" y="298" text-anchor="middle" font-size="13" fill="#4b5563">예</text>
  <rect x="700" y="276" width="160" height="62" rx="6" fill="#f3f4f6" stroke="#4b5563"/>
  <text x="780" y="301" text-anchor="middle" font-size="14" fill="#1f2937">즉시 비용 가능</text>
  <text x="780" y="322" text-anchor="middle" font-size="13" fill="#4b5563">간편법, 선택 사항</text>

  <!-- 자산 -->
  <line x1="440" y1="328" x2="440" y2="364" stroke="#4b5563" marker-end="url(#arr)"/>
  <text x="456" y="351" font-size="13" fill="#4b5563">아니오</text>
  <rect x="250" y="366" width="380" height="62" rx="6" fill="#ecfdf3" stroke="#2d6a4f"/>
  <text x="440" y="391" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">계약체결원가 자산</text>
  <text x="440" y="413" text-anchor="middle" font-size="13" fill="#2d6a4f">용역을 이전하는 방식대로 상각 (문단 99)</text>

  <text x="440" y="455" text-anchor="middle" font-size="13" fill="#4b5563">문단 93 예외: 계약 체결과 무관하게 고객에게 명백히 청구할 수 있는 원가는 발생 시점 비용으로 두지 않는다</text>
</svg>
