<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="440" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">제조자·판매자 리스제공자 — 리스개시일에 나뉘는 네 갈래</text>

  <!-- 입력 -->
  <rect x="40" y="60" width="240" height="64" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="160" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">받을 리스료</text>
  <text x="160" y="107" text-anchor="middle" font-size="13" fill="#4b5563">시장이자율로 할인한 현재가치</text>

  <rect x="320" y="60" width="240" height="64" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="440" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">무보증잔존가치</text>
  <text x="440" y="107" text-anchor="middle" font-size="13" fill="#4b5563">시장이자율로 할인한 현재가치</text>

  <rect x="600" y="60" width="240" height="64" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="720" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">기초자산 원가</text>
  <text x="720" y="107" text-anchor="middle" font-size="13" fill="#4b5563">다르면 장부금액</text>

  <!-- 결과 -->
  <rect x="40" y="200" width="240" height="84" rx="6" fill="#e8f3ee" stroke="#2d6a4f" stroke-width="2"/>
  <text x="160" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">매출액 (문단 71⑴)</text>
  <text x="160" y="250" text-anchor="middle" font-size="13" fill="#1f2937">공정가치와 리스료 현재가치</text>
  <text x="160" y="270" text-anchor="middle" font-size="13" fill="#1f2937">중 적은 금액</text>

  <rect x="600" y="200" width="240" height="84" rx="6" fill="#e8f3ee" stroke="#2d6a4f" stroke-width="2"/>
  <text x="720" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">매출원가 (문단 71⑵)</text>
  <text x="720" y="250" text-anchor="middle" font-size="13" fill="#1f2937">원가 − 무보증잔존가치</text>
  <text x="720" y="270" text-anchor="middle" font-size="13" fill="#1f2937">현재가치</text>

  <rect x="320" y="200" width="240" height="84" rx="6" fill="#fdf3e6" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">리스순투자</text>
  <text x="440" y="250" text-anchor="middle" font-size="13" fill="#1f2937">리스료 현재가치</text>
  <text x="440" y="270" text-anchor="middle" font-size="13" fill="#1f2937">+ 잔존가치 현재가치</text>

  <line x1="160" y1="124" x2="160" y2="198" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="124" x2="400" y2="198" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="124" x2="440" y2="198" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="124" x2="680" y2="198" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="720" y1="124" x2="720" y2="198" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="604" y="150" font-size="13" fill="#4b5563">차감</text>

  <!-- 매출총이익 -->
  <line x1="160" y1="284" x2="330" y2="350" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="720" y1="284" x2="550" y2="350" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="300" y="352" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="440" y="378" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">개시일 매출총이익</text>
  <text x="440" y="399" text-anchor="middle" font-size="13" fill="#4b5563">이전 여부와 무관하게 인식 (71⑶)</text>

  <!-- 주의 -->
  <rect x="40" y="352" width="220" height="84" rx="6" fill="#fbeaea" stroke="#9d0208" stroke-width="2"/>
  <text x="150" y="378" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d0208">판촉 저금리 (문단 73)</text>
  <text x="150" y="400" text-anchor="middle" font-size="13" fill="#1f2937">내건 이자율 대신</text>
  <text x="150" y="420" text-anchor="middle" font-size="13" fill="#1f2937">시장이자율로 할인</text>

  <rect x="620" y="352" width="220" height="84" rx="6" fill="#fbeaea" stroke="#9d0208" stroke-width="2"/>
  <text x="730" y="378" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d0208">체결 원가 (문단 74)</text>
  <text x="730" y="400" text-anchor="middle" font-size="13" fill="#1f2937">개시일 비용</text>
  <text x="730" y="420" text-anchor="middle" font-size="13" fill="#1f2937">순투자에 넣지 않음</text>
</svg>
