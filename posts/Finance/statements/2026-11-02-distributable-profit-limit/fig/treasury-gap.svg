<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="430" fill="#ffffff"/>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">이익잉여금 줄은 같은데 배당할 수 있는 금액이 150억원 다르다</text>
  <text x="440" y="52" text-anchor="middle" font-size="13" fill="#495057">자기주식만 다른 두 가상 회사 · 단위 억원</text>

  <!-- 가나전자 -->
  <text x="220" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">가나전자 — 자기주식 없음</text>

  <rect x="80" y="96" width="280" height="30" fill="#dee2e6" stroke="#495057"/>
  <text x="220" y="116" text-anchor="middle" font-size="13" fill="#1b1b1b">자본금 50</text>
  <rect x="80" y="126" width="280" height="44" fill="#dee2e6" stroke="#495057"/>
  <text x="220" y="153" text-anchor="middle" font-size="13" fill="#1b1b1b">자본준비금 200 · 이익준비금 10</text>
  <rect x="80" y="170" width="280" height="88" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="220" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">이익잉여금 710</text>
  <text x="220" y="228" text-anchor="middle" font-size="13" fill="#2d6a4f">공제하고 남는 금액 710</text>
  <text x="220" y="248" text-anchor="middle" font-size="13" fill="#495057">순자산액 970</text>

  <!-- 다라물산 -->
  <text x="660" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">다라물산 — 자기주식 150 보유</text>

  <rect x="520" y="96" width="280" height="30" fill="#dee2e6" stroke="#495057"/>
  <text x="660" y="116" text-anchor="middle" font-size="13" fill="#1b1b1b">자본금 50</text>
  <rect x="520" y="126" width="280" height="44" fill="#dee2e6" stroke="#495057"/>
  <text x="660" y="153" text-anchor="middle" font-size="13" fill="#1b1b1b">자본준비금 200 · 이익준비금 10</text>
  <rect x="520" y="170" width="280" height="88" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="660" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">이익잉여금 710</text>
  <text x="660" y="228" text-anchor="middle" font-size="13" fill="#2d6a4f">공제하고 남는 금액 560</text>
  <text x="660" y="248" text-anchor="middle" font-size="13" fill="#495057">순자산액 820</text>

  <rect x="520" y="258" width="280" height="44" fill="#fff1f0" stroke="#9d0208"/>
  <text x="660" y="279" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d0208">자기주식 −150</text>
  <text x="660" y="296" text-anchor="middle" font-size="13" fill="#495057">순자산은 줄이지만 공제 대상이 아니다</text>

  <!-- 설명 -->
  <rect x="80" y="330" width="720" height="84" rx="8" fill="#fff8e6" stroke="#b45309"/>
  <text x="102" y="356" font-size="14" font-weight="bold" fill="#b45309">자기주식은 두 번 빠지지 않는다 — 한 번만 빠진다</text>
  <text x="102" y="378" font-size="13" fill="#1b1b1b">순자산액에서 이미 차감된 뒤, 제462조 제1항의 공제 항목에는 들어 있지 않다.</text>
  <text x="102" y="398" font-size="13" fill="#1b1b1b">그래서 자기주식을 가진 만큼 배당할 수 있는 금액이 줄어든다. 이익잉여금 줄은 그대로인 채로.</text>
</svg>
