<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="460" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 출발 -->
  <rect x="30" y="30" width="250" height="64" rx="6" fill="#f1f3f5" stroke="#444"/>
  <text x="155" y="56" text-anchor="middle" font-size="14">고객(또는 고객에게서 사는</text>
  <text x="155" y="76" text-anchor="middle" font-size="14">다른 당사자)에게 지급 (문단 70)</text>

  <line x1="280" y1="62" x2="330" y2="62" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 질문 1 -->
  <rect x="335" y="30" width="240" height="64" rx="6" fill="#ffffff" stroke="#444"/>
  <text x="455" y="56" text-anchor="middle" font-size="14">고객에게서 받은 구별되는</text>
  <text x="455" y="76" text-anchor="middle" font-size="14">재화·용역의 대가인가?</text>

  <line x1="575" y1="62" x2="635" y2="62" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="605" y="52" text-anchor="middle" font-size="13">아니오</text>
  <rect x="640" y="36" width="210" height="52" rx="6" fill="#fdecec" stroke="#9d0208"/>
  <text x="745" y="67" text-anchor="middle" font-size="14" fill="#9d0208">전액 수익에서 차감</text>

  <line x1="455" y1="94" x2="455" y2="150" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="127" font-size="13">예</text>

  <!-- 질문 2 -->
  <rect x="335" y="155" width="240" height="64" rx="6" fill="#ffffff" stroke="#444"/>
  <text x="455" y="181" text-anchor="middle" font-size="14">받은 재화·용역의 공정가치를</text>
  <text x="455" y="201" text-anchor="middle" font-size="14">합리적으로 추정할 수 있는가?</text>

  <line x1="575" y1="187" x2="635" y2="187" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="605" y="177" text-anchor="middle" font-size="13">아니오</text>
  <rect x="640" y="161" width="210" height="52" rx="6" fill="#fdecec" stroke="#9d0208"/>
  <text x="745" y="192" text-anchor="middle" font-size="14" fill="#9d0208">전액 수익에서 차감</text>

  <line x1="455" y1="219" x2="455" y2="275" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="252" font-size="13">예</text>

  <!-- 결과 -->
  <rect x="235" y="280" width="440" height="64" rx="6" fill="#e9f5ef" stroke="#2d6a4f"/>
  <text x="455" y="306" text-anchor="middle" font-size="14" fill="#2d6a4f">공정가치까지는 다른 공급자에게 산 것처럼 비용</text>
  <text x="455" y="326" text-anchor="middle" font-size="14">초과분만 수익에서 차감 (문단 71)</text>

  <!-- 시점 -->
  <rect x="120" y="380" width="640" height="56" rx="6" fill="#fff8eb" stroke="#b45309"/>
  <text x="440" y="404" text-anchor="middle" font-size="14" fill="#b45309">수익 차감 시점 (문단 72)</text>
  <text x="440" y="424" text-anchor="middle" font-size="13">관련 수익 인식 ⑴과 지급·지급 약속 ⑵ 중 나중의 사건이 일어날 때</text>
</svg>
