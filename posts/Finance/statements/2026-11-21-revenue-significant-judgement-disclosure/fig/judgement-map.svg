<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="440" fill="#ffffff"/>

  <text x="440" y="28" text-anchor="middle" font-size="15">유의적 판단 공시의 갈래와 사아설비 수익 변동 (억원, 당기 수익 6605.4 기준)</text>

  <!-- 뿌리 -->
  <rect x="300" y="46" width="280" height="44" rx="6" fill="#e9ecef" stroke="#444"/>
  <text x="440" y="66" text-anchor="middle" font-size="14">문단 123 유의적인 판단과 그 변경</text>
  <text x="440" y="83" text-anchor="middle" font-size="13">수익의 금액과 시기를 정한 판단</text>

  <!-- 갈래 1 -->
  <line x1="380" y1="90" x2="210" y2="120" stroke="#444"/>
  <rect x="90" y="120" width="240" height="36" rx="6" fill="#ffffff" stroke="#444"/>
  <text x="210" y="143" text-anchor="middle" font-size="14">123⑴ 수행의무의 이행 시기</text>

  <!-- 갈래 2 -->
  <line x1="500" y1="90" x2="660" y2="120" stroke="#444"/>
  <rect x="520" y="120" width="280" height="36" rx="6" fill="#ffffff" stroke="#444"/>
  <text x="660" y="143" text-anchor="middle" font-size="14">123⑵ 거래가격과 배분 금액</text>

  <!-- 124 -->
  <line x1="170" y1="156" x2="110" y2="186" stroke="#444"/>
  <rect x="24" y="186" width="176" height="96" rx="6" fill="#f8e3c4" stroke="#b45309"/>
  <text x="112" y="208" text-anchor="middle" font-size="14">124 기간에 걸쳐</text>
  <text x="112" y="228" text-anchor="middle" font-size="13">사용한 방법</text>
  <text x="112" y="246" text-anchor="middle" font-size="13">충실히 나타내는 이유</text>
  <text x="112" y="270" text-anchor="middle" font-size="13" fill="#9d0208">투입→산출 −150.0</text>

  <!-- 125 -->
  <line x1="250" y1="156" x2="308" y2="186" stroke="#444"/>
  <rect x="220" y="186" width="176" height="96" rx="6" fill="#f8e3c4" stroke="#b45309"/>
  <text x="308" y="208" text-anchor="middle" font-size="14">125 한 시점</text>
  <text x="308" y="228" text-anchor="middle" font-size="13">고객이 언제 통제하는지</text>
  <text x="308" y="246" text-anchor="middle" font-size="13">검토한 유의적 판단</text>
  <text x="308" y="270" text-anchor="middle" font-size="13" fill="#9d0208">선적→도착 −240.0</text>

  <!-- 126 네 칸 -->
  <line x1="660" y1="156" x2="660" y2="180" stroke="#444"/>
  <line x1="490" y1="180" x2="830" y2="180" stroke="#444"/>
  <rect x="420" y="190" width="200" height="56" rx="6" fill="#ffffff" stroke="#444"/>
  <text x="520" y="212" text-anchor="middle" font-size="13">126⑴ 거래가격 산정</text>
  <text x="520" y="232" text-anchor="middle" font-size="13">변동대가·금융요소·비현금</text>

  <rect x="640" y="190" width="216" height="56" rx="6" fill="#ffffff" stroke="#444"/>
  <text x="748" y="212" text-anchor="middle" font-size="13">126⑵ 변동대가 제약 평가</text>
  <text x="748" y="232" text-anchor="middle" font-size="13">되돌릴 가능성 판단</text>

  <rect x="420" y="258" width="200" height="56" rx="6" fill="#f8e3c4" stroke="#b45309"/>
  <text x="520" y="280" text-anchor="middle" font-size="13">126⑶ 거래가격 배분</text>
  <text x="520" y="300" text-anchor="middle" font-size="13" fill="#2d6a4f">SSP 300→250 +24.6</text>

  <rect x="640" y="258" width="216" height="56" rx="6" fill="#f8e3c4" stroke="#b45309"/>
  <text x="748" y="280" text-anchor="middle" font-size="13">126⑷ 반환·환불의무 측정</text>
  <text x="748" y="300" text-anchor="middle" font-size="13" fill="#9d0208">반품률 5%→8% −60.0</text>

  <!-- 하단 설명 -->
  <rect x="24" y="340" width="832" height="76" rx="6" fill="#ffffff" stroke="#b45309"/>
  <text x="440" y="366" text-anchor="middle" font-size="13">주황 칸은 예제에서 판단 하나만 바꿔 다시 계산한 자리다</text>
  <text x="440" y="388" text-anchor="middle" font-size="13">124·125·126⑶은 수익이 잡히는 해를 옮기고, 126⑷는 인식하는 수익 금액을 바꾼다</text>
  <text x="440" y="408" text-anchor="middle" font-size="13">124는 방법, 126은 방법·투입변수·가정을 공시하고, 125는 판단 내용을 공시한다</text>
</svg>
