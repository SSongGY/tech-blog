<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="같은 정부보조금 240억원이 이연수익법에서는 부채로, 자산차감법에서는 자산 차감으로 앉는 모습">
  <rect x="0" y="0" width="880" height="420" fill="#f7f7f4"/>

  <text x="24" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b">같은 보조금 240억원이 재무상태표에 앉는 두 자리 (취득 직후)</text>
  <text x="24" y="56" font-family="sans-serif" font-size="13" fill="#444">설비 취득원가 600 · 정부보조금 240 · 기타자산 800 · 기타부채 300</text>

  <!-- 왼쪽: 이연수익법 -->
  <text x="219" y="86" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1b1b1b" text-anchor="middle">이연수익법 (문단 26)</text>

  <rect x="24" y="98" width="190" height="252" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="119" y="120" font-family="sans-serif" font-size="13" font-weight="bold" fill="#444" text-anchor="middle">자산</text>
  <rect x="36" y="130" width="166" height="80" rx="4" fill="#eceae4" stroke="#777" stroke-width="1"/>
  <text x="119" y="165" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">기타자산</text>
  <text x="119" y="186" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1b1b1b" text-anchor="middle">800</text>
  <rect x="36" y="220" width="166" height="118" rx="4" fill="#e6f0ea" stroke="#2d6a4f" stroke-width="2"/>
  <text x="119" y="262" font-family="sans-serif" font-size="13" fill="#2d6a4f" text-anchor="middle">설비 (총액)</text>
  <text x="119" y="292" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2d6a4f" text-anchor="middle">600</text>

  <rect x="228" y="98" width="190" height="252" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="323" y="120" font-family="sans-serif" font-size="13" font-weight="bold" fill="#444" text-anchor="middle">부채와 자본</text>
  <rect x="240" y="130" width="166" height="52" rx="4" fill="#eceae4" stroke="#777" stroke-width="1"/>
  <text x="323" y="150" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">기타부채</text>
  <text x="323" y="170" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1b1b1b" text-anchor="middle">300</text>
  <rect x="240" y="192" width="166" height="56" rx="4" fill="#fdf1e0" stroke="#b45309" stroke-width="2"/>
  <text x="323" y="213" font-family="sans-serif" font-size="13" fill="#b45309" text-anchor="middle">이연수익 (부채)</text>
  <text x="323" y="236" font-family="sans-serif" font-size="18" font-weight="bold" fill="#b45309" text-anchor="middle">240</text>
  <rect x="240" y="258" width="166" height="80" rx="4" fill="#eceae4" stroke="#777" stroke-width="1"/>
  <text x="323" y="293" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">자본</text>
  <text x="323" y="314" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1b1b1b" text-anchor="middle">860</text>

  <!-- 오른쪽: 자산차감법 -->
  <text x="661" y="86" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1b1b1b" text-anchor="middle">자산차감법 (문단 27)</text>

  <rect x="466" y="98" width="190" height="252" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="561" y="120" font-family="sans-serif" font-size="13" font-weight="bold" fill="#444" text-anchor="middle">자산</text>
  <rect x="478" y="130" width="166" height="80" rx="4" fill="#eceae4" stroke="#777" stroke-width="1"/>
  <text x="561" y="165" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">기타자산</text>
  <text x="561" y="186" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1b1b1b" text-anchor="middle">800</text>
  <rect x="478" y="220" width="166" height="71" rx="4" fill="#e6f0ea" stroke="#2d6a4f" stroke-width="2"/>
  <text x="561" y="248" font-family="sans-serif" font-size="13" fill="#2d6a4f" text-anchor="middle">설비 (보조금 차감 후)</text>
  <text x="561" y="275" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2d6a4f" text-anchor="middle">360</text>
  <rect x="478" y="291" width="166" height="47" rx="4" fill="#f7f7f4" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="561" y="312" font-family="sans-serif" font-size="13" fill="#b45309" text-anchor="middle">보조금 240 이 여기서</text>
  <text x="561" y="330" font-family="sans-serif" font-size="13" fill="#b45309" text-anchor="middle">깎여 사라진다</text>

  <rect x="670" y="98" width="186" height="252" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="763" y="120" font-family="sans-serif" font-size="13" font-weight="bold" fill="#444" text-anchor="middle">부채와 자본</text>
  <rect x="682" y="130" width="162" height="52" rx="4" fill="#eceae4" stroke="#777" stroke-width="1"/>
  <text x="763" y="150" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">기타부채</text>
  <text x="763" y="170" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1b1b1b" text-anchor="middle">300</text>
  <rect x="682" y="258" width="162" height="80" rx="4" fill="#eceae4" stroke="#777" stroke-width="1"/>
  <text x="763" y="293" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">자본</text>
  <text x="763" y="314" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1b1b1b" text-anchor="middle">860</text>

  <text x="24" y="382" font-family="sans-serif" font-size="13" fill="#1b1b1b">총자산 1,400 대 1,160 · 총부채 540 대 300 — 자산과 부채가 똑같이 240 만큼 벌어지므로</text>
  <text x="24" y="402" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2d6a4f">자본총계는 860 으로 같다. 부채비율만 갈린다.</text>
</svg>
