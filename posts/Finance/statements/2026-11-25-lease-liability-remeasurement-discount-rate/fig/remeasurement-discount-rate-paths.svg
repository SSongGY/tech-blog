<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="440" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">리스료가 바뀐 원인이 할인율을 정한다</text>

  <!-- 시작 -->
  <rect x="320" y="52" width="240" height="50" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="440" y="82" text-anchor="middle" font-size="14" fill="#111827">리스료 변경 (문단 39)</text>

  <!-- 왼쪽 갈래: 판단이 바뀜 -->
  <line x1="400" y1="102" x2="220" y2="140" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="142" width="360" height="74" rx="6" fill="#fdf3e6" stroke="#b45309" stroke-width="2"/>
  <text x="220" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">회사의 판단이 바뀌었다</text>
  <text x="220" y="192" text-anchor="middle" font-size="13" fill="#1f2937">리스기간 변경 · 매수선택권 평가 변경</text>
  <text x="220" y="208" text-anchor="middle" font-size="13" fill="#4b5563">(문단 20·21, 40)</text>

  <!-- 오른쪽 갈래: 계약 공식대로 움직임 -->
  <line x1="480" y1="102" x2="660" y2="140" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="480" y="142" width="360" height="74" rx="6" fill="#e8f3ee" stroke="#2d6a4f" stroke-width="2"/>
  <text x="660" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">계약에 정한 공식대로 움직였다</text>
  <text x="660" y="192" text-anchor="middle" font-size="13" fill="#1f2937">지수·요율 변동 · 잔존가치보증 예상액 변동</text>
  <text x="660" y="208" text-anchor="middle" font-size="13" fill="#4b5563">(문단 42)</text>

  <!-- 왼쪽 결과 -->
  <line x1="220" y1="216" x2="220" y2="256" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="258" width="360" height="62" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="220" y="284" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">수정 할인율</text>
  <text x="220" y="306" text-anchor="middle" font-size="13" fill="#4b5563">재평가일 내재이자율 또는 증분차입이자율 (41)</text>

  <!-- 오른쪽 결과 -->
  <line x1="660" y1="216" x2="660" y2="256" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="480" y="258" width="360" height="62" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="660" y="284" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">원래 할인율 그대로</text>
  <text x="660" y="306" text-anchor="middle" font-size="13" fill="#4b5563">예외: 변동이자율 변동이면 수정 할인율 (43)</text>

  <!-- 합류 -->
  <line x1="220" y1="320" x2="400" y2="362" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="320" x2="480" y2="362" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="250" y="364" width="380" height="76" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="440" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">차이는 사용권자산에서 조정</text>
  <text x="440" y="412" text-anchor="middle" font-size="13" fill="#1f2937">사용권자산이 0 이 된 뒤 남는 감소분만</text>
  <text x="440" y="430" text-anchor="middle" font-size="13" fill="#1f2937">당기손익 (문단 39)</text>
</svg>
