<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="상표권 장부금액 경로. 비한정은 1000에서 3년 차 손상차손 200으로 800, 유한은 해마다 100씩 줄어 500">
  <rect x="0" y="0" width="880" height="360" fill="#f7f7f4"/>

  <text x="24" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b">같은 상표권의 장부금액 경로 (연말, 억원)</text>
  <text x="24" y="56" font-family="sans-serif" font-size="13" fill="#444">취득원가 1,000 · 3년 차에 회수가능액이 800으로 하락 · 유한은 10년 정액</text>

  <!-- 축 -->
  <line x1="90" y1="80" x2="90" y2="300" stroke="#999" stroke-width="1"/>
  <line x1="90" y1="300" x2="780" y2="300" stroke="#999" stroke-width="1"/>
  <text x="80" y="104" font-family="sans-serif" font-size="13" fill="#666" text-anchor="end">1,000</text>
  <text x="80" y="204" font-family="sans-serif" font-size="13" fill="#666" text-anchor="end">750</text>
  <text x="80" y="304" font-family="sans-serif" font-size="13" fill="#666" text-anchor="end">500</text>

  <text x="140" y="324" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">1년</text>
  <text x="270" y="324" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">2년</text>
  <text x="400" y="324" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">3년</text>
  <text x="530" y="324" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">4년</text>
  <text x="660" y="324" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">5년</text>

  <!-- 비한정: 1000,1000,800,800,800 → y = 100 + (1000-v)*0.4 -->
  <polyline points="140,100 270,100 400,180 530,180 660,180" fill="none" stroke="#b45309" stroke-width="3"/>
  <circle cx="140" cy="100" r="5" fill="#b45309"/>
  <circle cx="270" cy="100" r="5" fill="#b45309"/>
  <circle cx="400" cy="180" r="5" fill="#b45309"/>
  <circle cx="530" cy="180" r="5" fill="#b45309"/>
  <circle cx="660" cy="180" r="5" fill="#b45309"/>
  <text x="680" y="176" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b45309">비한정 800</text>
  <text x="410" y="164" font-family="sans-serif" font-size="13" fill="#9d0208">손상차손 200</text>

  <!-- 유한: 900,800,700,600,500 -->
  <polyline points="140,140 270,180 400,220 530,260 660,300" fill="none" stroke="#2d6a4f" stroke-width="3"/>
  <circle cx="140" cy="140" r="5" fill="#2d6a4f"/>
  <circle cx="270" cy="180" r="5" fill="#2d6a4f"/>
  <circle cx="400" cy="220" r="5" fill="#2d6a4f"/>
  <circle cx="530" cy="260" r="5" fill="#2d6a4f"/>
  <circle cx="660" cy="300" r="5" fill="#2d6a4f"/>
  <text x="680" y="296" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d6a4f">유한 500</text>
  <text x="150" y="132" font-family="sans-serif" font-size="13" fill="#2d6a4f">해마다 상각 100</text>
</svg>
