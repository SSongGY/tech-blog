<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">충당부채와 제삼자 변제 — 두 줄로 따로 적는다 (제1037호)</text>

  <!-- 피해자 / 회사 / 보험사 -->
  <rect x="30" y="60" width="220" height="62" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="140" y="85" text-anchor="middle" font-size="14" fill="#1f2937">소송 상대방</text>
  <text x="140" y="107" text-anchor="middle" font-size="13" fill="#4b5563">배상 청구 300</text>

  <rect x="330" y="60" width="220" height="62" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="440" y="85" text-anchor="middle" font-size="14" fill="#1f2937">다라물산</text>
  <text x="440" y="107" text-anchor="middle" font-size="13" fill="#4b5563">전체 금액에 책임 (문단 56)</text>

  <rect x="630" y="60" width="220" height="62" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="740" y="85" text-anchor="middle" font-size="14" fill="#1f2937">보험사</text>
  <text x="740" y="107" text-anchor="middle" font-size="13" fill="#4b5563">보전 250 (자기부담 50)</text>

  <line x1="330" y1="91" x2="254" y2="91" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="292" y="83" text-anchor="middle" font-size="13" fill="#4b5563">지급</text>
  <line x1="630" y1="91" x2="554" y2="91" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="592" y="83" text-anchor="middle" font-size="13" fill="#4b5563">보전</text>

  <!-- 재무상태표 -->
  <line x1="390" y1="122" x2="250" y2="168" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="490" y1="122" x2="630" y2="168" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="440" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">재무상태표</text>

  <rect x="60" y="170" width="340" height="86" rx="6" fill="#fef2f2" stroke="#9d0208"/>
  <text x="230" y="195" text-anchor="middle" font-size="14" fill="#9d0208">부채 — 충당부채 300</text>
  <text x="230" y="219" text-anchor="middle" font-size="13" fill="#4b5563">변제 예상분을 빼지 않은 전체 금액</text>
  <text x="230" y="241" text-anchor="middle" font-size="13" fill="#4b5563">문단 53·56</text>

  <rect x="480" y="170" width="340" height="86" rx="6" fill="#ecfdf5" stroke="#2d6a4f"/>
  <text x="650" y="195" text-anchor="middle" font-size="14" fill="#2d6a4f">자산 — 변제자산 250</text>
  <text x="650" y="219" text-anchor="middle" font-size="13" fill="#4b5563">거의 확실할 때만 · 충당부채가 한도</text>
  <text x="650" y="241" text-anchor="middle" font-size="13" fill="#4b5563">문단 53</text>

  <text x="440" y="218" text-anchor="middle" font-size="13" fill="#b45309">상계 안 함</text>

  <!-- 손익계산서 -->
  <text x="440" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">포괄손익계산서</text>
  <rect x="200" y="304" width="480" height="62" rx="6" fill="#fffbeb" stroke="#b45309"/>
  <text x="440" y="328" text-anchor="middle" font-size="14" fill="#1f2937">비용 300 과 변제 250 을 순액 50 으로 표시할 수 있다</text>
  <text x="440" y="352" text-anchor="middle" font-size="13" fill="#4b5563">문단 54 — 손익 쪽만 상계 허용</text>

  <!-- 연대채무 -->
  <rect x="60" y="400" width="360" height="72" rx="6" fill="#f9fafb" stroke="#6b7280"/>
  <text x="240" y="424" text-anchor="middle" font-size="14" fill="#1f2937">제삼자와 연대해 지는 의무</text>
  <text x="240" y="448" text-anchor="middle" font-size="13" fill="#4b5563">제삼자 몫은 우발부채 · 내 몫만 충당부채 (29·58)</text>

  <rect x="460" y="400" width="360" height="72" rx="6" fill="#f9fafb" stroke="#6b7280"/>
  <text x="640" y="424" text-anchor="middle" font-size="14" fill="#1f2937">제삼자가 안 내도 내 의무가 아닌 몫</text>
  <text x="640" y="448" text-anchor="middle" font-size="13" fill="#4b5563">충당부채에 넣지 않음 (문단 57)</text>
</svg>
