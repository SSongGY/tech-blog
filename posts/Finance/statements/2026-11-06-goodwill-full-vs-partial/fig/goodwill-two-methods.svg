<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-label="영업권 계산. 전부영업권은 이전대가 400 더하기 비지배지분 공정가치 110 빼기 순자산 450으로 60, 부분영업권은 비지배지분 90을 써서 40">
  <rect x="0" y="0" width="880" height="340" fill="#f7f7f4"/>
  <text x="24" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b">영업권 = 이전대가 + 비지배지분 - 식별가능 순자산 공정가치 (억원)</text>

  <rect x="24" y="64" width="400" height="200" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="224" y="92" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2d6a4f" text-anchor="middle">전부영업권 (공정가치 측정)</text>
  <text x="224" y="126" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">이전대가 400</text>
  <text x="224" y="150" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">+ 비지배지분 공정가치 110</text>
  <text x="224" y="174" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">- 식별가능 순자산 450</text>
  <text x="224" y="212" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2d6a4f" text-anchor="middle">영업권 60</text>
  <text x="224" y="240" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">비지배지분 몫 영업권 20 포함</text>

  <rect x="456" y="64" width="400" height="200" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="656" y="92" font-family="sans-serif" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">부분영업권 (비례지분 측정)</text>
  <text x="656" y="126" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">이전대가 400</text>
  <text x="656" y="150" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">+ 비지배지분 450 x 20% = 90</text>
  <text x="656" y="174" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">- 식별가능 순자산 450</text>
  <text x="656" y="212" font-family="sans-serif" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">영업권 40</text>
  <text x="656" y="240" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">지배기업 몫 영업권만 인식</text>

  <text x="24" y="300" font-family="sans-serif" font-size="13" fill="#1b1b1b">결과가 음수이면 영업권이 아니라 염가매수차익이며, 재검토 후에도 남으면 당기손익이다.</text>
</svg>
