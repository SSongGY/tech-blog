<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>

  <text x="440" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">연말마다 분쟁 한 건이 지나가는 길</text>

  <!-- 1단: 유출 가능성 -->
  <rect x="300" y="52" width="280" height="54" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="440" y="76" text-anchor="middle" font-size="14" fill="#111827">자원 유출 가능성이 높은가</text>
  <text x="440" y="95" text-anchor="middle" font-size="13" fill="#4b5563">일어날 쪽이 더 큼 (23)</text>

  <!-- 예 → 추정 가능? -->
  <line x1="580" y1="79" x2="640" y2="79" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="610" y="70" text-anchor="middle" font-size="13" fill="#2d6a4f">예</text>
  <rect x="644" y="52" width="200" height="54" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="744" y="76" text-anchor="middle" font-size="14" fill="#111827">금액을 신뢰성 있게</text>
  <text x="744" y="95" text-anchor="middle" font-size="14" fill="#111827">추정할 수 있는가 (25)</text>

  <line x1="744" y1="106" x2="744" y2="146" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="756" y="131" font-size="13" fill="#2d6a4f">예</text>
  <rect x="644" y="150" width="200" height="54" rx="6" fill="#e8f3ee" stroke="#2d6a4f" stroke-width="2"/>
  <text x="744" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">충당부채 인식</text>
  <text x="744" y="193" text-anchor="middle" font-size="13" fill="#1f2937">변동표에 올라감 (84)</text>

  <!-- 추정 불가 → 우발부채 -->
  <path d="M644,92 L600,92 L600,250 L520,250" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="610" y="240" font-size="13" fill="#b45309">아니오 (극히 드묾, 26)</text>

  <!-- 아니오 → 희박? -->
  <line x1="440" y1="106" x2="440" y2="146" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="452" y="131" font-size="13" fill="#9d0208">아니오</text>
  <rect x="300" y="150" width="280" height="54" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="440" y="174" text-anchor="middle" font-size="14" fill="#111827">유출 가능성이 희박한가</text>
  <text x="440" y="193" text-anchor="middle" font-size="13" fill="#4b5563">수치 기준 없음 (28)</text>

  <line x1="300" y1="177" x2="210" y2="177" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="255" y="168" text-anchor="middle" font-size="13" fill="#9d0208">예</text>
  <rect x="40" y="150" width="166" height="54" rx="6" fill="#fbeaea" stroke="#9d0208" stroke-width="2"/>
  <text x="123" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d0208">공시 안 함</text>

  <line x1="440" y1="204" x2="440" y2="226" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="452" y="220" font-size="13" fill="#b45309">아니오</text>
  <rect x="300" y="228" width="220" height="48" rx="6" fill="#fdf3e6" stroke="#b45309" stroke-width="2"/>
  <text x="410" y="257" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">우발부채 — 특성 공시 (86)</text>

  <!-- 금액 공시 세 갈래 -->
  <line x1="410" y1="276" x2="410" y2="300" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="150" y1="300" x2="700" y2="300" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="150" y1="300" x2="150" y2="326" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="300" x2="420" y2="326" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="300" x2="700" y2="326" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="330" width="220" height="70" rx="6" fill="#ffffff" stroke="#b45309"/>
  <text x="150" y="356" text-anchor="middle" font-size="14" fill="#111827">추정 금액·불확실성·</text>
  <text x="150" y="376" text-anchor="middle" font-size="14" fill="#111827">변제 가능성 (86⑴~⑶)</text>

  <rect x="300" y="330" width="240" height="70" rx="6" fill="#ffffff" stroke="#b45309"/>
  <text x="420" y="356" text-anchor="middle" font-size="14" fill="#111827">실무상 못 적은 항목은</text>
  <text x="420" y="376" text-anchor="middle" font-size="14" fill="#111827">그 사실을 공시 (91)</text>

  <rect x="580" y="330" width="260" height="70" rx="6" fill="#ffffff" stroke="#b45309"/>
  <text x="710" y="356" text-anchor="middle" font-size="14" fill="#111827">분쟁에 현저히 불리하면 생략,</text>
  <text x="710" y="376" text-anchor="middle" font-size="14" fill="#111827">특성·생략 사유는 공시 (92)</text>

  <text x="440" y="440" text-anchor="middle" font-size="13" fill="#4b5563">다음 연말에 같은 건을 처음부터 다시 판단한다 (30)</text>
</svg>
