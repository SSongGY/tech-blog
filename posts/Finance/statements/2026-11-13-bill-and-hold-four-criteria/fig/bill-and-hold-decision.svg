<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 시작 -->
  <rect x="250" y="16" width="380" height="54" rx="6" fill="#f1f3f5" stroke="#444"/>
  <text x="440" y="39" text-anchor="middle" font-size="15" font-weight="bold">대금은 청구했고 제품은 기업 창고에 있다</text>
  <text x="440" y="59" text-anchor="middle" font-size="13" fill="#555">미인도청구약정 (B79)</text>

  <line x1="440" y1="70" x2="440" y2="96" stroke="#444" marker-end="url(#arrow)"/>
  <rect x="250" y="98" width="380" height="54" rx="6" fill="#f1f3f5" stroke="#444"/>
  <text x="440" y="121" text-anchor="middle" font-size="15" font-weight="bold">통제 이전 지표 다섯 가지</text>
  <text x="440" y="141" text-anchor="middle" font-size="13" fill="#555">지급청구권·법적 소유권·점유·위험과 보상·인수 (문단 38)</text>

  <line x1="440" y1="152" x2="440" y2="178" stroke="#444" marker-end="url(#arrow)"/>
  <rect x="170" y="180" width="540" height="128" rx="6" fill="#fff8eb" stroke="#b45309" stroke-width="1.5"/>
  <text x="440" y="204" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">추가로 네 기준을 모두 충족하는가 (B81)</text>
  <text x="196" y="232" font-size="13">⑴ 약정의 이유가 실질적이다 (예: 고객이 요구)</text>
  <text x="196" y="254" font-size="13">⑵ 제품이 고객의 소유물로 구분되어 식별된다</text>
  <text x="196" y="276" font-size="13">⑶ 지금 고객에게 물리적으로 이전할 준비가 되어 있다</text>
  <text x="196" y="298" font-size="13">⑷ 기업이 제품을 쓰거나 다른 고객에게 넘길 수 없다</text>

  <!-- 예 -->
  <line x1="300" y1="308" x2="230" y2="346" stroke="#444" marker-end="url(#arrow)"/>
  <text x="196" y="330" font-size="13">모두 예</text>
  <rect x="30" y="348" width="390" height="106" rx="6" fill="#e9f5ee" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="225" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d6a4f">고객이 통제 — 지금 수익 (B80)</text>
  <text x="46" y="402" font-size="13">기업은 고객 자산을 보관하는 용역을 제공한다</text>
  <text x="46" y="424" font-size="13">보관이 별도 수행의무면 거래가격 일부를 배분</text>
  <text x="46" y="444" font-size="13" fill="#555">(B82 → 문단 22~30, 73~86)</text>

  <!-- 아니오 -->
  <line x1="580" y1="308" x2="650" y2="346" stroke="#444" marker-end="url(#arrow)"/>
  <text x="626" y="330" font-size="13">하나라도 아니오</text>
  <rect x="460" y="348" width="390" height="106" rx="6" fill="#fdecec" stroke="#9d0208" stroke-width="1.5"/>
  <text x="655" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#9d0208">기업이 통제 — 인도 때 수익</text>
  <text x="476" y="402" font-size="13">제품은 기업의 재고자산으로 남는다</text>
  <text x="476" y="424" font-size="13">받은 대금은 계약부채</text>
  <text x="476" y="444" font-size="13" fill="#555">(보관은 자기 재고를 두는 일)</text>
</svg>
