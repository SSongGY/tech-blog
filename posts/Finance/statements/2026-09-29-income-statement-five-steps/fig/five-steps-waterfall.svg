<svg xmlns="http://www.w3.org/2000/svg" width="880" height="510" viewBox="0 0 880 510" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="510" fill="#ffffff"/>

  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">매출 200, 순이익 10으로 같은 두 회사 — 단계마다 빠지는 것 (가상, 억원)</text>
  <line x1="300" y1="78" x2="300" y2="440" stroke="#495057" stroke-width="1"/>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#495057">0</text>

  <!-- 가나전자 -->
  <text x="20" y="70" font-size="15" font-weight="bold" fill="#1b1b1b">가나전자</text>

  <text x="20" y="100" font-size="13" fill="#1b1b1b">매출액</text>
  <text x="270" y="100" text-anchor="end" font-size="13" fill="#1b1b1b">200</text>
  <rect x="300" y="84" width="480" height="22" fill="#adb5bd"/>

  <text x="20" y="132" font-size="13" fill="#1b1b1b">매출총이익</text>
  <text x="270" y="132" text-anchor="end" font-size="13" fill="#1b1b1b">60</text>
  <rect x="300" y="116" width="144" height="22" fill="#2d6a4f"/>
  <rect x="444" y="116" width="336" height="22" fill="#fde2e4" stroke="#9d0208"/>
  <text x="612" y="132" text-anchor="middle" font-size="13" fill="#9d0208">− 매출원가 140</text>

  <text x="20" y="164" font-size="13" fill="#1b1b1b">영업이익</text>
  <text x="270" y="164" text-anchor="end" font-size="13" fill="#1b1b1b">20</text>
  <rect x="300" y="148" width="48" height="22" fill="#2d6a4f"/>
  <rect x="348" y="148" width="96" height="22" fill="#fde2e4" stroke="#9d0208"/>
  <text x="452" y="164" font-size="13" fill="#9d0208">− 판매비와관리비 40</text>

  <text x="20" y="196" font-size="13" fill="#1b1b1b">법인세비용차감전순이익</text>
  <text x="270" y="196" text-anchor="end" font-size="13" fill="#1b1b1b">12.5</text>
  <rect x="300" y="180" width="30" height="22" fill="#2d6a4f"/>
  <rect x="330" y="180" width="18" height="22" fill="#fde2e4" stroke="#9d0208"/>
  <text x="356" y="196" font-size="13" fill="#9d0208">− 금융원가 8.5, + 금융수익 1</text>

  <text x="20" y="228" font-size="13" fill="#1b1b1b">당기순이익</text>
  <text x="270" y="228" text-anchor="end" font-size="13" font-weight="bold" fill="#1b1b1b">10</text>
  <rect x="300" y="212" width="24" height="22" fill="#2d6a4f"/>
  <rect x="324" y="212" width="6" height="22" fill="#fde2e4" stroke="#9d0208"/>
  <text x="338" y="228" font-size="13" fill="#9d0208">− 법인세비용 2.5</text>

  <!-- 다라물산 -->
  <text x="20" y="270" font-size="15" font-weight="bold" fill="#1b1b1b">다라물산</text>

  <text x="20" y="300" font-size="13" fill="#1b1b1b">매출액</text>
  <text x="270" y="300" text-anchor="end" font-size="13" fill="#1b1b1b">200</text>
  <rect x="300" y="284" width="480" height="22" fill="#adb5bd"/>

  <text x="20" y="332" font-size="13" fill="#1b1b1b">매출총이익</text>
  <text x="270" y="332" text-anchor="end" font-size="13" fill="#1b1b1b">30</text>
  <rect x="300" y="316" width="72" height="22" fill="#2d6a4f"/>
  <rect x="372" y="316" width="408" height="22" fill="#fde2e4" stroke="#9d0208"/>
  <text x="576" y="332" text-anchor="middle" font-size="13" fill="#9d0208">− 매출원가 170</text>

  <text x="20" y="364" font-size="13" fill="#1b1b1b">영업이익</text>
  <text x="270" y="364" text-anchor="end" font-size="13" fill="#9d0208">−10</text>
  <rect x="276" y="348" width="24" height="22" fill="#9d0208"/>
  <rect x="300" y="348" width="72" height="22" fill="#fde2e4" stroke="#9d0208"/>
  <text x="380" y="364" font-size="13" fill="#9d0208">− 판매비와관리비 40 → 영업손실</text>

  <text x="20" y="396" font-size="13" fill="#1b1b1b">법인세비용차감전순이익</text>
  <text x="270" y="396" text-anchor="end" font-size="13" fill="#1b1b1b">12.5</text>
  <rect x="276" y="380" width="54" height="22" fill="#fff3cd" stroke="#b45309"/>
  <rect x="300" y="381" width="30" height="20" fill="#2d6a4f"/>
  <text x="338" y="396" font-size="13" fill="#b45309">+ 설비 처분이익 25, − 금융원가 2.5</text>

  <text x="20" y="428" font-size="13" fill="#1b1b1b">당기순이익</text>
  <text x="270" y="428" text-anchor="end" font-size="13" font-weight="bold" fill="#1b1b1b">10</text>
  <rect x="300" y="412" width="24" height="22" fill="#2d6a4f"/>
  <rect x="324" y="412" width="6" height="22" fill="#fde2e4" stroke="#9d0208"/>
  <text x="338" y="428" font-size="13" fill="#9d0208">− 법인세비용 2.5</text>

  <text x="440" y="468" text-anchor="middle" font-size="13" fill="#495057">초록 = 그 단계에서 남은 이익, 분홍 = 그 단계에서 뺀 비용, 노랑 = 영업 밖에서 더하고 뺀 것.</text>
  <text x="440" y="490" text-anchor="middle" font-size="13" fill="#495057">맨 아래 줄은 같지만 두 회사의 영업이익은 30 차이가 난다.</text>
</svg>
