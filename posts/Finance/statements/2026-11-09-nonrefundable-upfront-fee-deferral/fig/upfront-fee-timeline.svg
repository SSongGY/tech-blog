<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="430" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">가입비 120,000을 어느 기간에 걸쳐 수익으로 옮기는가 (제1115호 B49)</text>

  <!-- 연도 축: 1년차 10월 = x 200, 한 달 = 20px -->
  <line x1="200" y1="70" x2="800" y2="70" stroke="#6b7280" stroke-width="1"/>
  <line x1="200" y1="62" x2="200" y2="78" stroke="#6b7280"/>
  <line x1="260" y1="62" x2="260" y2="78" stroke="#6b7280"/>
  <line x1="500" y1="62" x2="500" y2="78" stroke="#6b7280"/>
  <line x1="740" y1="62" x2="740" y2="78" stroke="#6b7280"/>
  <text x="230" y="58" text-anchor="middle" font-size="13" fill="#4b5563">1년차</text>
  <text x="380" y="58" text-anchor="middle" font-size="13" fill="#4b5563">2년차</text>
  <text x="620" y="58" text-anchor="middle" font-size="13" fill="#4b5563">3년차</text>
  <text x="770" y="58" text-anchor="middle" font-size="13" fill="#4b5563">4년차</text>
  <text x="200" y="96" text-anchor="middle" font-size="13" fill="#4b5563">10월 가입</text>

  <!-- (가) -->
  <text x="40" y="132" font-size="14" font-weight="bold" fill="#9d0208">(가) 받은 날</text>
  <rect x="200" y="112" width="60" height="32" fill="#fde2e2" stroke="#9d0208"/>
  <text x="270" y="133" font-size="13" fill="#9d0208">120,000 전액 — 허용되지 않는다</text>

  <!-- (나) -->
  <text x="40" y="192" font-size="14" font-weight="bold" fill="#1f2937">(나) 최초 계약</text>
  <text x="40" y="214" font-size="13" fill="#4b5563">12개월</text>
  <rect x="200" y="172" width="60" height="32" fill="#ecfdf3" stroke="#2d6a4f"/>
  <rect x="260" y="172" width="180" height="32" fill="#ecfdf3" stroke="#2d6a4f"/>
  <text x="230" y="193" text-anchor="middle" font-size="13" fill="#2d6a4f">30,000</text>
  <text x="350" y="193" text-anchor="middle" font-size="13" fill="#2d6a4f">90,000</text>

  <!-- (다) -->
  <text x="40" y="252" font-size="14" font-weight="bold" fill="#1f2937">(다) 갱신 포함</text>
  <text x="40" y="274" font-size="13" fill="#4b5563">예상 30개월</text>
  <rect x="200" y="232" width="60" height="32" fill="#ecfdf3" stroke="#2d6a4f"/>
  <rect x="260" y="232" width="240" height="32" fill="#ecfdf3" stroke="#2d6a4f"/>
  <rect x="500" y="232" width="240" height="32" fill="#ecfdf3" stroke="#2d6a4f"/>
  <rect x="740" y="232" width="60" height="32" fill="#ecfdf3" stroke="#2d6a4f"/>
  <text x="230" y="253" text-anchor="middle" font-size="13" fill="#2d6a4f">12,000</text>
  <text x="380" y="253" text-anchor="middle" font-size="13" fill="#2d6a4f">48,000</text>
  <text x="620" y="253" text-anchor="middle" font-size="13" fill="#2d6a4f">48,000</text>
  <text x="770" y="253" text-anchor="middle" font-size="13" fill="#2d6a4f">12,000</text>

  <!-- 판단 -->
  <rect x="40" y="300" width="800" height="110" rx="6" fill="#fffbeb" stroke="#b45309"/>
  <text x="60" y="326" font-size="14" font-weight="bold" fill="#b45309">기간을 가르는 질문</text>
  <text x="60" y="352" font-size="13" fill="#1f2937">가입비는 고객에게 무엇을 이전한 대가인가 — 이전한 것이 없으면 미래 용역의 선수금이다 (B49, 문단 25)</text>
  <text x="60" y="376" font-size="13" fill="#1f2937">갱신할 때 가입비를 다시 내지 않는 선택권이 중요한 권리인가 — 그렇다면 최초 계약기간보다 길어진다 (B40·B49)</text>
  <text x="60" y="398" font-size="13" fill="#4b5563">30개월은 예제의 가정이다. 기준서는 기간이 연장된다고만 쓰고 개월 수를 정하지 않는다</text>
</svg>
