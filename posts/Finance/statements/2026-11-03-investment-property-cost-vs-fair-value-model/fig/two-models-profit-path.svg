<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="같은 임대 건물이 원가모형에서는 감가상각비로, 공정가치모형에서는 평가손익으로 당기손익에 닿는 경로">
  <rect x="0" y="0" width="880" height="400" fill="#f7f7f4"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="24" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b">같은 임대 건물이 당기손익에 닿는 두 경로 (문단 30 의 선택)</text>
  <text x="24" y="56" font-family="sans-serif" font-size="13" fill="#444">취득원가 500 · 임대수익 40 · 운영비용 10 · 1년 말 공정가치 520 (단위: 억원)</text>

  <!-- 공통 출발점 -->
  <rect x="24" y="150" width="170" height="90" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="109" y="182" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">투자부동산</text>
  <text x="109" y="204" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">임대수익 목적 보유</text>
  <text x="109" y="224" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">(문단 5 정의)</text>

  <!-- 갈림 화살표 -->
  <line x1="194" y1="175" x2="270" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="194" y1="215" x2="270" y2="280" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 원가모형 줄 -->
  <text x="282" y="86" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d6a4f">원가모형 (문단 56 → 제1016호)</text>
  <rect x="282" y="96" width="180" height="60" rx="6" fill="#e6f0ea" stroke="#2d6a4f" stroke-width="2"/>
  <text x="372" y="120" font-family="sans-serif" font-size="13" fill="#2d6a4f" text-anchor="middle">장부금액 = 원가 − 상각누계</text>
  <text x="372" y="142" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2d6a4f" text-anchor="middle">500 → 480</text>
  <line x1="462" y1="126" x2="528" y2="126" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="530" y="96" width="150" height="60" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="605" y="120" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">감가상각비</text>
  <text x="605" y="142" font-family="sans-serif" font-size="15" font-weight="bold" fill="#9d0208" text-anchor="middle">−20 (매년 같다)</text>

  <!-- 공정가치모형 줄 -->
  <text x="282" y="256" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b45309">공정가치모형 (문단 33·35)</text>
  <rect x="282" y="266" width="180" height="60" rx="6" fill="#fdf1e0" stroke="#b45309" stroke-width="2"/>
  <text x="372" y="290" font-family="sans-serif" font-size="13" fill="#b45309" text-anchor="middle">장부금액 = 기말 공정가치</text>
  <text x="372" y="312" font-family="sans-serif" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">500 → 520</text>
  <line x1="462" y1="296" x2="528" y2="296" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="530" y="266" width="150" height="60" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="605" y="290" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">평가손익 (감가상각 없음)</text>
  <text x="605" y="312" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2d6a4f" text-anchor="middle">+20 (시세를 따른다)</text>

  <!-- 합류: 당기손익 -->
  <line x1="680" y1="126" x2="740" y2="185" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="296" x2="740" y2="235" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="742" y="160" width="116" height="100" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="800" y="184" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">당기순이익</text>
  <text x="800" y="206" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">임대 30 ± 위 금액</text>
  <text x="800" y="230" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">원가 10</text>
  <text x="800" y="250" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">공정가치 50</text>

  <text x="24" y="362" font-family="sans-serif" font-size="13" fill="#1b1b1b">임대료가 들어오고 운영비가 나가는 현금흐름 30 은 두 경로가 같다. 갈리는 것은 건물 장부금액을</text>
  <text x="24" y="382" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1b1b1b">무엇으로 다시 재느냐, 그 차이를 어느 줄로 손익에 넣느냐다.</text>
</svg>
