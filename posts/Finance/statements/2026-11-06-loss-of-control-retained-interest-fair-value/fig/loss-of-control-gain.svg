<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="지배력 상실 처분이익 22는 판 지분 6.25, 남긴 지분 재측정 3.75, 기타포괄손익 재분류 12로 이루어지고, 지배력을 유지한 처분은 차이 5가 자본으로 가서 당기손익이 0이다">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="400" fill="#f7f7f4"/>
  <text x="24" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b">지배력을 잃으면 팔지 않은 지분과 OCI까지 처분이익에 들어간다 (억원)</text>

  <text x="24" y="66" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b">80% 중 50%p 처분 → 30% 잔존 (지배력 상실)</text>

  <rect x="24" y="80" width="250" height="62" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
  <text x="149" y="106" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">판 50%p  6.25</text>
  <text x="149" y="128" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">대가 150 − 장부 143.75</text>

  <rect x="24" y="152" width="250" height="62" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="149" y="178" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">남긴 30%p  3.75</text>
  <text x="149" y="200" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">공정가치 90 − 장부 86.25</text>

  <rect x="24" y="224" width="250" height="62" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="149" y="250" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">OCI 재분류  12</text>
  <text x="149" y="272" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">해외사업환산 누적액</text>

  <path d="M274 111 L360 170" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M274 183 L360 183" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M274 255 L360 196" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="362" y="146" width="200" height="74" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="462" y="176" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">처분이익 22</text>
  <text x="462" y="200" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">당기손익</text>

  <rect x="606" y="146" width="250" height="74" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
  <text x="731" y="176" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">잔존 30% = 관계기업</text>
  <text x="731" y="200" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">원가 90에서 지분법 시작</text>
  <path d="M562 183 L604 183" stroke="#444" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <line x1="24" y1="304" x2="856" y2="304" stroke="#bbbbbb" stroke-width="1"/>
  <text x="24" y="330" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b">비교: 10%p만 처분 → 70% 유지 (지배력 유지)</text>
  <text x="24" y="356" font-family="sans-serif" font-size="13" fill="#1b1b1b">대가 30 − 비지배지분 증가 25 = 5 → 지배기업 소유주지분에 직접. 당기손익 0, 재측정·재분류 없음</text>
  <text x="24" y="382" font-family="sans-serif" font-size="13" fill="#444">경계는 판 지분의 크기가 아니라 지배력이 남는가이다 (제1110호 문단 23·25)</text>
</svg>
