<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <text x="440" y="30" text-anchor="middle" font-size="15">1년차 말의 사실 (계약가격 1,000 · 추정 총원가 800)</text>

  <!-- 사실 3개 -->
  <rect x="30" y="48" width="260" height="70" rx="6" fill="#f1f3f5" stroke="#444"/>
  <text x="160" y="74" text-anchor="middle" font-size="14">기기 10대 인도 · 원가 400</text>
  <text x="160" y="96" text-anchor="middle" font-size="13">고객이 통제, 아직 미설치</text>

  <rect x="310" y="48" width="260" height="70" rx="6" fill="#f1f3f5" stroke="#444"/>
  <text x="440" y="74" text-anchor="middle" font-size="14">설치원가 100 / 400</text>
  <text x="440" y="96" text-anchor="middle" font-size="13">설치 노력의 25%</text>

  <rect x="590" y="48" width="260" height="70" rx="6" fill="#f1f3f5" stroke="#444"/>
  <text x="720" y="74" text-anchor="middle" font-size="14">설치 완료 2 / 10대</text>
  <text x="720" y="96" text-anchor="middle" font-size="13">눈에 보이는 산출물</text>

  <!-- 화살표 -->
  <line x1="160" y1="118" x2="160" y2="186" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="118" x2="380" y2="186" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="118" x2="220" y2="186" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="118" x2="440" y2="186" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="118" x2="720" y2="186" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 방법 3개 -->
  <rect x="30" y="190" width="260" height="96" rx="6" fill="#fff8eb" stroke="#b45309"/>
  <text x="160" y="216" text-anchor="middle" font-size="14" fill="#b45309">원가기준 · 조정 없음</text>
  <text x="160" y="240" text-anchor="middle" font-size="13">(400 + 100) ÷ 800 = 62.5%</text>
  <text x="160" y="262" text-anchor="middle" font-size="13">수익 625 · 이익 125</text>

  <rect x="310" y="190" width="260" height="96" rx="6" fill="#e9f5ef" stroke="#2d6a4f"/>
  <text x="440" y="216" text-anchor="middle" font-size="14" fill="#2d6a4f">원가기준 · B19⑵ 조정</text>
  <text x="440" y="240" text-anchor="middle" font-size="13">기기 400은 이익 0, 설치 100 ÷ 400</text>
  <text x="440" y="262" text-anchor="middle" font-size="13">수익 400 + 150 = 550 · 이익 50</text>

  <rect x="590" y="190" width="260" height="96" rx="6" fill="#fdecec" stroke="#9d0208"/>
  <text x="720" y="216" text-anchor="middle" font-size="14" fill="#9d0208">산출법 · 설치 완료 대수</text>
  <text x="720" y="240" text-anchor="middle" font-size="13">2 ÷ 10 = 20%</text>
  <text x="720" y="262" text-anchor="middle" font-size="13">수익 200 · 이익 −300</text>

  <!-- 문제점 -->
  <text x="160" y="316" text-anchor="middle" font-size="13">기기를 옮겨 놓기만 해도</text>
  <text x="160" y="336" text-anchor="middle" font-size="13">계약 이익률이 붙는다</text>
  <text x="440" y="316" text-anchor="middle" font-size="13">B19⑵ ㈎~㈑를 모두</text>
  <text x="440" y="336" text-anchor="middle" font-size="13">충족할 때 쓴다</text>
  <text x="720" y="316" text-anchor="middle" font-size="13">고객이 통제하는 기기 8대가</text>
  <text x="720" y="336" text-anchor="middle" font-size="13">산출물 측정에서 빠진다 (B15)</text>

  <rect x="30" y="370" width="820" height="56" rx="6" fill="#ffffff" stroke="#444"/>
  <text x="440" y="394" text-anchor="middle" font-size="14">2년차에 완성하면 세 방법 모두 합계 이익 200 — 달라지는 것은 해마다 나뉘는 몫이다</text>
  <text x="440" y="414" text-anchor="middle" font-size="13">진행률 측정의 목적: 통제를 이전하는 과정에서 기업의 수행 정도를 나타낸다 (문단 39)</text>
</svg>
