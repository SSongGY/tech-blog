<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 1단계: 개별 판매가격 -->
  <rect x="30" y="30" width="380" height="64" rx="6" fill="#f1f3f5" stroke="#444"/>
  <text x="220" y="56" text-anchor="middle" font-size="14">수행의무마다 개별 판매가격 산정 (문단 76~78)</text>
  <text x="220" y="76" text-anchor="middle" font-size="13">관측 가격이 최선의 증거, 없으면 추정</text>

  <rect x="470" y="30" width="380" height="64" rx="6" fill="#ffffff" stroke="#444"/>
  <text x="660" y="56" text-anchor="middle" font-size="14">추정 방법 (문단 79)</text>
  <text x="660" y="76" text-anchor="middle" font-size="13">시장평가 조정 · 예상원가 이윤 가산 · 잔여</text>
  <line x1="410" y1="62" x2="465" y2="62" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="220" y1="94" x2="220" y2="140" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2단계: 할인 -->
  <rect x="30" y="145" width="380" height="64" rx="6" fill="#ffffff" stroke="#444"/>
  <text x="220" y="171" text-anchor="middle" font-size="14">개별 판매가격 합계 &gt; 계약가격이면 할인</text>
  <text x="220" y="191" text-anchor="middle" font-size="14">문단 82의 세 조건을 모두 충족하는가?</text>

  <line x1="220" y1="209" x2="220" y2="255" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="235" y="237" font-size="13">아니오</text>
  <rect x="30" y="260" width="380" height="52" rx="6" fill="#e9f5ef" stroke="#2d6a4f"/>
  <text x="220" y="291" text-anchor="middle" font-size="14" fill="#2d6a4f">할인을 모든 수행의무에 비례 배분 (문단 81)</text>

  <line x1="410" y1="177" x2="465" y2="177" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="437" y="167" text-anchor="middle" font-size="13">예</text>
  <rect x="470" y="145" width="380" height="64" rx="6" fill="#fff8eb" stroke="#b45309"/>
  <text x="660" y="171" text-anchor="middle" font-size="14" fill="#b45309">할인 전체를 일부 수행의무에만 배분</text>
  <text x="660" y="191" text-anchor="middle" font-size="13">따로 파는 묶음의 할인과 계약 할인이 같을 때</text>

  <line x1="660" y1="209" x2="660" y2="255" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="470" y="260" width="380" height="52" rx="6" fill="#fdecec" stroke="#9d0208"/>
  <text x="660" y="291" text-anchor="middle" font-size="14" fill="#9d0208">잔여접근법은 이 배분 뒤에 쓴다 (문단 83)</text>

  <!-- 변동대가 -->
  <rect x="30" y="360" width="820" height="64" rx="6" fill="#ffffff" stroke="#444"/>
  <text x="440" y="386" text-anchor="middle" font-size="14">변동대가가 특정 수행의무의 노력·성과와 명백히 관련되고 배분 목적에 맞으면</text>
  <text x="440" y="406" text-anchor="middle" font-size="14">그 수행의무에만 배분 (문단 84·85), 나머지 거래가격은 위 흐름으로 (문단 86)</text>

  <text x="440" y="462" text-anchor="middle" font-size="13" fill="#444">수행의무가 하나뿐인 계약에는 문단 76~86을 적용하지 않는다. 일련의 재화·용역이면 84~86만 적용 가능 (문단 75)</text>
</svg>
