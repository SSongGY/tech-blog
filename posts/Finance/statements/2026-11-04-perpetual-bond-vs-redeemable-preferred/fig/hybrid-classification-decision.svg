<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-label="기업회계기준서 제1032호가 발행한 금융상품을 금융부채와 지분상품으로 가르는 판단 흐름">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="440" fill="#f7f7f4"/>

  <text x="24" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b">발행자가 묻는 순서 — 자본인가 부채인가 (제1032호 문단 16·18·19·25)</text>
  <text x="24" y="56" font-family="sans-serif" font-size="13" fill="#444">법적 형식(채권·주식)이 아니라 계약의 실질로 분류한다 (문단 15·18)</text>

  <!-- 1단계 -->
  <rect x="240" y="78" width="400" height="56" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="440" y="101" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">현금 등 금융자산을 인도할 계약상 의무가 있는가?</text>
  <text x="440" y="121" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">확정일 상환 · 보유자의 상환 청구권 · 조건부 결제조항 (문단 16⑴·18⑴·25)</text>

  <!-- 왼쪽: 있다 -->
  <line x1="340" y1="134" x2="200" y2="188" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="246" y="158" font-family="sans-serif" font-size="13" font-weight="bold" fill="#9d0208">있다</text>
  <rect x="60" y="190" width="300" height="64" rx="6" fill="#fbe9e7" stroke="#9d0208" stroke-width="2"/>
  <text x="210" y="214" font-family="sans-serif" font-size="14" font-weight="bold" fill="#9d0208" text-anchor="middle">금융부채</text>
  <text x="210" y="236" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">상환우선주 · 풋가능 금융상품 (문단 18)</text>

  <!-- 오른쪽: 없다 -->
  <line x1="540" y1="134" x2="680" y2="188" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="604" y="158" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2d6a4f">없다</text>
  <rect x="520" y="190" width="300" height="64" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="670" y="214" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">인도를 회피할 무조건적인 권리가 있는가?</text>
  <text x="670" y="236" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">상환 여부를 발행자가 재량으로 결정 (문단 19·AG25)</text>

  <line x1="670" y1="254" x2="670" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="684" y="282" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2d6a4f">있다</text>
  <rect x="520" y="302" width="300" height="64" rx="6" fill="#e6f0ea" stroke="#2d6a4f" stroke-width="2"/>
  <text x="670" y="326" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">지분상품 (자본)</text>
  <text x="670" y="348" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">영구채 · 배당을 발행자가 정하는 우선주 (AG25·AG26)</text>

  <line x1="520" y1="222" x2="362" y2="222" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="441" y="214" font-family="sans-serif" font-size="13" font-weight="bold" fill="#9d0208" text-anchor="middle">없다</text>

  <!-- 결과 -->
  <rect x="60" y="302" width="300" height="64" rx="6" fill="#fdf1e0" stroke="#b45309" stroke-width="2"/>
  <text x="210" y="326" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">분배금 = 이자비용 → 당기손익</text>
  <text x="210" y="348" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">부채비율 분자에 들어간다 (문단 35·36)</text>
  <line x1="210" y1="254" x2="210" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="24" y="400" font-family="sans-serif" font-size="13" fill="#1b1b1b">지분상품이면 분배금은 비용이 아니라 자본에서 직접 뺀다 (문단 35). 과거 배당 실적·미래 배당 의도·적립금 크기는</text>
  <text x="24" y="420" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2d6a4f">분류에 영향을 주지 않는다 (AG26). 보는 것은 계약에 의무가 적혀 있는가뿐이다.</text>
</svg>
