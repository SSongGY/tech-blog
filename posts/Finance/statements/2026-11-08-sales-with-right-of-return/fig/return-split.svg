<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">반품권이 있는 판매 — 판매 시점에 두 금액이 각각 둘로 나뉜다 (제1115호 B21)</text>

  <!-- 위: 대가 -->
  <text x="40" y="70" font-size="14" font-weight="bold" fill="#1f2937">받은 대가</text>
  <rect x="40" y="82" width="220" height="70" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="150" y="110" text-anchor="middle" font-size="14" fill="#1f2937">판매대가</text>
  <text x="150" y="134" text-anchor="middle" font-size="13" fill="#4b5563">1,000개 × 10 = 10,000</text>

  <line x1="260" y1="105" x2="398" y2="85" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="260" y1="130" x2="398" y2="160" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="400" y="58" width="420" height="54" rx="6" fill="#ecfdf3" stroke="#2d6a4f"/>
  <text x="610" y="81" text-anchor="middle" font-size="14" fill="#2d6a4f">수익 9,450 — 반품 안 될 945개</text>
  <text x="610" y="101" text-anchor="middle" font-size="13" fill="#4b5563">권리를 갖게 될 것으로 예상하는 대가 (B21⑴)</text>

  <rect x="400" y="130" width="420" height="54" rx="6" fill="#fffbeb" stroke="#b45309"/>
  <text x="610" y="153" text-anchor="middle" font-size="14" fill="#b45309">환불부채 550 — 반품 예상 55개</text>
  <text x="610" y="173" text-anchor="middle" font-size="13" fill="#4b5563">돌려줄 것으로 예상하는 대가 (B21⑵, 문단 55)</text>

  <!-- 아래: 재고 -->
  <text x="40" y="240" font-size="14" font-weight="bold" fill="#1f2937">내보낸 재고</text>
  <rect x="40" y="252" width="220" height="70" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="150" y="280" text-anchor="middle" font-size="14" fill="#1f2937">재고 장부금액</text>
  <text x="150" y="304" text-anchor="middle" font-size="13" fill="#4b5563">1,000개 × 6 = 6,000</text>

  <line x1="260" y1="275" x2="398" y2="255" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="260" y1="300" x2="398" y2="330" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="400" y="228" width="420" height="54" rx="6" fill="#ecfdf3" stroke="#2d6a4f"/>
  <text x="610" y="251" text-anchor="middle" font-size="14" fill="#2d6a4f">매출원가 5,752.5</text>
  <text x="610" y="271" text-anchor="middle" font-size="13" fill="#4b5563">6,000 − 회수권 247.5 (B21⑶의 매출원가 조정)</text>

  <rect x="400" y="300" width="420" height="54" rx="6" fill="#fffbeb" stroke="#b45309"/>
  <text x="610" y="323" text-anchor="middle" font-size="14" fill="#b45309">반환재고 회수권 247.5</text>
  <text x="610" y="343" text-anchor="middle" font-size="13" fill="#4b5563">55개 × (6 − 회수 원가 0.5 − 가치 감소 1.0) (B25)</text>

  <!-- 재추정 -->
  <rect x="40" y="378" width="780" height="76" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="430" y="400" text-anchor="middle" font-size="14" fill="#1f2937">보고기간 말마다 반품 예상을 다시 잰다</text>
  <text x="430" y="421" text-anchor="middle" font-size="13" fill="#4b5563">환불부채 변동 → 수익 조정 (B24) · 회수권 변동 → 매출원가 조정 (B25)</text>
  <text x="430" y="442" text-anchor="middle" font-size="13" fill="#9d0208">환불부채와 회수권은 같은 55개에서 나오지만 상계하지 않고 따로 표시한다 (B25)</text>
</svg>
