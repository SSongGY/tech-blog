<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" role="img" aria-label="별도재무제표 단순합산 매출 85,000과 연결 매출 75,000을 가로 막대로 비교해, 연결실체 내부 매출 10,000만 사라지고 관계기업 매출 20,000은 그대로 남는 것을 보이는 도식">
  <rect width="880" height="390" fill="#f7f8fa"/>

  <text x="24" y="32" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1b1f23">같은 거래, 다른 재무제표 — 사라지는 것은 연결실체 안의 거래뿐이다</text>
  <text x="24" y="54" font-family="sans-serif" font-size="13" fill="#55606b">마바홀딩스 그룹의 당기 매출 (단위: 백만원)</text>

  <!-- 별도 단순합산 -->
  <text x="24" y="98" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1f23">별도 단순합산</text>
  <text x="24" y="118" font-family="sans-serif" font-size="13" fill="#55606b">85,000</text>
  <rect x="150" y="80" width="324" height="46" fill="#55606b"/>
  <rect x="474" y="80" width="59" height="46" fill="#9d0208"/>
  <rect x="533" y="80" width="118" height="46" fill="#b45309"/>
  <text x="312" y="108" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff">외부 매출 55,000</text>
  <text x="592" y="108" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff">자차물산 20,000</text>
  <text x="503" y="146" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9d0208">10,000</text>

  <!-- 연결 -->
  <text x="24" y="196" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1f23">연결</text>
  <text x="24" y="216" font-family="sans-serif" font-size="13" fill="#55606b">75,000</text>
  <rect x="150" y="178" width="324" height="46" fill="#55606b"/>
  <rect x="474" y="178" width="118" height="46" fill="#b45309"/>
  <rect x="592" y="178" width="59" height="46" fill="#ffffff" stroke="#9d0208" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="312" y="206" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff">외부 매출 55,000</text>
  <text x="533" y="206" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff">자차물산 20,000</text>
  <text x="621" y="206" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9d0208">제거</text>

  <path d="M 503 152 L 614 174" stroke="#9d0208" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>

  <!-- 범례 -->
  <rect x="672" y="80" width="14" height="14" fill="#55606b"/>
  <text x="694" y="92" font-family="sans-serif" font-size="13" fill="#1b1f23">연결실체 밖 외부 고객</text>
  <rect x="672" y="106" width="14" height="14" fill="#9d0208"/>
  <text x="694" y="118" font-family="sans-serif" font-size="13" fill="#1b1f23">사아전자 → 마바홀딩스</text>
  <text x="694" y="136" font-family="sans-serif" font-size="13" fill="#9d0208">연결실체 안의 거래</text>
  <rect x="672" y="152" width="14" height="14" fill="#b45309"/>
  <text x="694" y="164" font-family="sans-serif" font-size="13" fill="#1b1f23">사아전자 → 자차물산</text>
  <text x="694" y="182" font-family="sans-serif" font-size="13" fill="#b45309">관계기업 · 연결실체 밖</text>

  <!-- 주석 공시 -->
  <rect x="24" y="250" width="406" height="120" rx="6" fill="#ffffff" stroke="#55606b" stroke-width="1.5"/>
  <text x="44" y="276" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1f23">사아전자 별도재무제표 주석</text>
  <text x="44" y="302" font-family="sans-serif" font-size="13" fill="#2d6a4f">지배기업 마바홀딩스와의 매출 10,000 — 공시</text>
  <text x="44" y="325" font-family="sans-serif" font-size="13" fill="#2d6a4f">관계기업 자차물산과의 매출 20,000 — 공시</text>
  <text x="44" y="348" font-family="sans-serif" font-size="13" fill="#2d6a4f">지배기업의 명칭 — 거래가 없어도 공시</text>

  <rect x="450" y="250" width="406" height="120" rx="6" fill="#ffffff" stroke="#55606b" stroke-width="1.5"/>
  <text x="470" y="276" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1f23">마바홀딩스 연결재무제표 주석</text>
  <text x="470" y="302" font-family="sans-serif" font-size="13" fill="#9d0208">사아전자와의 매출 10,000 — 제거되어 없다</text>
  <text x="470" y="325" font-family="sans-serif" font-size="13" fill="#2d6a4f">관계기업 자차물산과의 매출 20,000 — 공시</text>
  <text x="470" y="348" font-family="sans-serif" font-size="13" fill="#2d6a4f">주요 경영진 보상 — 공시</text>
</svg>
