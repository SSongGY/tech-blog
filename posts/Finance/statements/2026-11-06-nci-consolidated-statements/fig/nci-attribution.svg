<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="다라물산 총포괄이익 60이 지배기업 소유주 48과 비지배지분 12로 나뉘는 경로">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="330" fill="#f7f7f4"/>
  <text x="24" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b">연결 포괄손익은 100%를 합산하고 지분율대로 귀속한다 (억원)</text>

  <rect x="24" y="70" width="230" height="130" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
  <text x="139" y="98" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">다라물산 (지분 80%)</text>
  <text x="139" y="128" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">당기순이익 50</text>
  <text x="139" y="152" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">기타포괄이익 10</text>
  <text x="139" y="180" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">총포괄이익 60</text>

  <path d="M254 135 L316 135" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="285" y="124" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">100% 합산</text>

  <rect x="318" y="70" width="230" height="130" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
  <text x="433" y="98" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">연결 포괄손익계산서</text>
  <text x="433" y="128" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">가나전자 + 다라물산</text>
  <text x="433" y="152" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">내부거래 제거 후</text>
  <text x="433" y="180" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">끝 줄에서 귀속을 나눈다</text>

  <path d="M548 110 L610 80" stroke="#2d6a4f" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M548 160 L610 190" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="612" y="50" width="244" height="64" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="734" y="78" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">지배기업 소유주 48</text>
  <text x="734" y="100" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">순이익 40 + 기타포괄 8</text>

  <rect x="612" y="160" width="244" height="64" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="734" y="188" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">비지배지분 12</text>
  <text x="734" y="210" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">순이익 10 + 기타포괄 2</text>

  <text x="24" y="270" font-family="sans-serif" font-size="13" fill="#1b1b1b">EPS 분자는 지배기업 소유주 귀속분이다. 비지배지분 몫은 분자에 들어가지 않는다.</text>
  <text x="24" y="296" font-family="sans-serif" font-size="13" fill="#444">비지배지분 기말 = 기초 30 + 12 - 배당 몫 2 = 40</text>
</svg>
