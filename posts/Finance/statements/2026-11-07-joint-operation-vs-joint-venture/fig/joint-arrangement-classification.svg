<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="공동약정 분류 순서. 별도기구가 아니거나, 법적 형식이 당사자와 구분되지 않거나, 계약이 자산 권리와 부채 의무를 주거나, 산출물과 현금흐름이 당사자에게 묶여 있으면 공동영업이고, 모두 아니면 공동기업이다. 같은 약정에서 가나건설 부채비율은 공동영업 130%, 공동기업 100%이다">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="470" fill="#f7f7f4"/>
  <text x="24" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b">자산·부채에 대한 권리와 의무가 당사자에게 있는가 — 네 번 묻는다</text>

  <rect x="24" y="56" width="420" height="54" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
  <text x="234" y="80" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">① 별도기구(회사 등)로 만들었나</text>
  <text x="234" y="100" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">아니오면 공동영업 (B16)</text>

  <rect x="24" y="136" width="420" height="54" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
  <text x="234" y="160" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">② 법적 형식이 당사자와 기구를 구분하나</text>
  <text x="234" y="180" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">구분하지 않으면 공동영업 (B24)</text>

  <rect x="24" y="216" width="420" height="54" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
  <text x="234" y="240" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">③ 계약이 자산 권리·부채 의무를 당사자에게 주나</text>
  <text x="234" y="260" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">주면 공동영업 (B25~B28)</text>

  <rect x="24" y="296" width="420" height="54" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
  <text x="234" y="320" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">④ 산출물을 당사자가 거의 다 가져가나</text>
  <text x="234" y="340" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">부채를 당사자 현금이 갚으면 공동영업 (B31·B32)</text>

  <path d="M234 110 L234 134" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M234 190 L234 214" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M234 270 L234 294" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M234 350 L234 384" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="244" y="372" font-family="sans-serif" font-size="13" fill="#444">모두 아니면</text>

  <path d="M444 83 L560 160" stroke="#2d6a4f" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M444 163 L560 185" stroke="#2d6a4f" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M444 243 L560 210" stroke="#2d6a4f" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M444 323 L560 235" stroke="#2d6a4f" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="562" y="130" width="294" height="140" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="709" y="158" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2d6a4f" text-anchor="middle">공동영업 (문단 15·20)</text>
  <text x="709" y="184" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">자산·부채·수익·비용 중</text>
  <text x="709" y="204" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">자기 몫을 줄마다 더한다</text>
  <text x="709" y="236" font-family="sans-serif" font-size="13" fill="#b45309" text-anchor="middle">가나건설 부채비율 130%</text>
  <text x="709" y="256" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">매출 3,400</text>

  <rect x="24" y="386" width="420" height="70" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
  <text x="234" y="410" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1b1b1b" text-anchor="middle">공동기업 (문단 16·24)</text>
  <text x="234" y="432" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">순자산 몫을 투자자산 한 줄로, 지분법</text>
  <text x="234" y="450" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">가나건설 부채비율 100%, 매출 3,000</text>

  <text x="562" y="310" font-family="sans-serif" font-size="13" fill="#444">같은 50:50 약정, 같은 자본 1,000·</text>
  <text x="562" y="330" font-family="sans-serif" font-size="13" fill="#444">순이익 250. 분류만 다르다</text>
</svg>
