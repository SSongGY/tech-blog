<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="460" fill="#fdfdfb"/>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="30" y="32" font-size="17" font-weight="bold" fill="#1e293b">전환사채 1,000이 부채요소와 자본요소로 나뉘어 만기까지 가는 경로</text>
  <text x="30" y="54" font-size="13" fill="#475569">가나전자 — 액면 1,000, 표면이자율 2%, 3년 만기, 일반사채 시장이자율 8% (금액 단위 억원)</text>

  <!-- 액면선 -->
  <line x1="100" y1="130" x2="478" y2="130" stroke="#334155" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="96" y="127" font-size="13" fill="#334155" text-anchor="end">액면</text>
  <text x="96" y="143" font-size="13" fill="#334155" text-anchor="end">1,000</text>

  <!-- 기준선 -->
  <line x1="100" y1="340" x2="478" y2="340" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- 발행 -->
  <rect x="110" y="130" width="70" height="33" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.6"/>
  <rect x="110" y="163" width="70" height="177" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/>
  <text x="145" y="152" font-size="13" fill="#2d6a4f" text-anchor="middle">154.6</text>
  <text x="145" y="186" font-size="14" fill="#1e293b" text-anchor="middle">845.4</text>
  <text x="145" y="358" font-size="13" fill="#334155" text-anchor="middle">발행</text>

  <!-- 1년차 말 -->
  <rect x="205" y="130" width="70" height="23" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.6"/>
  <rect x="205" y="153" width="70" height="187" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/>
  <text x="240" y="176" font-size="14" fill="#1e293b" text-anchor="middle">893.0</text>
  <text x="240" y="358" font-size="13" fill="#334155" text-anchor="middle">1년차 말</text>

  <!-- 2년차 말 -->
  <rect x="300" y="130" width="70" height="12" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.6"/>
  <rect x="300" y="142" width="70" height="198" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/>
  <text x="335" y="165" font-size="14" fill="#1e293b" text-anchor="middle">944.4</text>
  <text x="335" y="358" font-size="13" fill="#334155" text-anchor="middle">2년차 말</text>

  <!-- 3년차 말 -->
  <rect x="395" y="130" width="70" height="210" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/>
  <text x="430" y="153" font-size="14" fill="#1e293b" text-anchor="middle">1,000.0</text>
  <text x="430" y="358" font-size="13" fill="#334155" text-anchor="middle">3년차 말</text>

  <!-- 상각액 -->
  <text x="192" y="382" font-size="13" fill="#b45309" text-anchor="middle">+47.6</text>
  <text x="287" y="382" font-size="13" fill="#b45309" text-anchor="middle">+51.4</text>
  <text x="382" y="382" font-size="13" fill="#b45309" text-anchor="middle">+55.6</text>
  <text x="104" y="406" font-size="13" fill="#b45309">상각액 합계 +154.6 — 발행 때 자본으로 간 금액과 같다</text>
  <text x="104" y="426" font-size="13" fill="#475569">현금으로 나가는 표면이자는 해마다 20.0뿐이다</text>

  <!-- 분기 화살표 -->
  <path d="M465,170 L500,170 L500,186" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M465,250 L500,250 L500,276" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- 결말 1: 전환 -->
  <rect x="506" y="150" width="344" height="86" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.6" rx="4"/>
  <text x="522" y="174" font-size="14" font-weight="bold" fill="#2d6a4f">만기에 주식으로 전환하면</text>
  <text x="522" y="196" font-size="13" fill="#1e293b">부채 1,000.0이 자본으로 간다 (자본요소 합쳐 1,154.6)</text>
  <text x="522" y="216" font-size="13" fill="#1e293b">신주 5,000,000주 발행 · 손익은 인식하지 않는다</text>

  <!-- 결말 2: 만기 상환 -->
  <rect x="506" y="256" width="344" height="86" fill="#fef3e2" stroke="#b45309" stroke-width="1.6" rx="4"/>
  <text x="522" y="280" font-size="14" font-weight="bold" fill="#b45309">만기에 현금으로 갚으면</text>
  <text x="522" y="302" font-size="13" fill="#1e293b">현금 1,000.0 유출 · 부채 1,000.0 제거</text>
  <text x="522" y="322" font-size="13" fill="#1e293b">자본요소 154.6은 자본에 그대로 남는다</text>

  <!-- 범례 -->
  <rect x="506" y="372" width="16" height="16" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.4"/>
  <text x="530" y="385" font-size="13" fill="#334155">자본요소 — 자본으로 들어가 재측정하지 않는다</text>
  <rect x="506" y="398" width="16" height="16" fill="#e2e8f0" stroke="#334155" stroke-width="1.4"/>
  <text x="530" y="411" font-size="13" fill="#334155">부채요소 — 유효이자율 8%로 상각되어 액면에 닿는다</text>
</svg>
