<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="매각예정 분류 흐름. 분류 요건 충족, 장부금액과 순공정가치 중 작은 금액으로 측정, 감가상각 중단, 이후 순공정가치 변동은 손상차손 또는 한도 내 환입">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="420" fill="#f7f7f4"/>

  <text x="24" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b">매각예정으로 분류되면 일어나는 일 — 네 단계</text>

  <rect x="24" y="56" width="400" height="116" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
  <text x="224" y="80" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">① 분류 요건 (문단 6~8)</text>
  <text x="44" y="104" font-family="sans-serif" font-size="13" fill="#1b1b1b">· 장부금액이 주로 매각으로 회수된다</text>
  <text x="44" y="126" font-family="sans-serif" font-size="13" fill="#1b1b1b">· 현재 상태에서 즉시 매각 가능하다</text>
  <text x="44" y="148" font-family="sans-serif" font-size="13" fill="#1b1b1b">· 매각 가능성이 매우 높다 (원칙적으로 1년 이내)</text>

  <path d="M424 114 L456 114" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="458" y="56" width="400" height="116" rx="6" fill="#ffffff" stroke="#9d0208" stroke-width="2"/>
  <text x="658" y="80" font-family="sans-serif" font-size="14" font-weight="bold" fill="#9d0208" text-anchor="middle">② 측정 (문단 15)</text>
  <text x="658" y="108" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">장부금액 과 (공정가치 − 처분부대원가)</text>
  <text x="658" y="130" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">중 작은 금액으로 잰다</text>
  <text x="658" y="152" font-family="sans-serif" font-size="13" fill="#9d0208" text-anchor="middle">모자라는 만큼은 손상차손 (문단 20)</text>

  <path d="M658 172 L658 212" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="458" y="214" width="400" height="76" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="658" y="238" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">③ 상각 중단 (문단 25)</text>
  <text x="658" y="262" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">감가상각(또는 상각)을 하지 않는다</text>
  <text x="658" y="280" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">부채의 이자와 기타 비용은 계속 인식</text>

  <path d="M458 252 L426 252" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="24" y="214" width="400" height="116" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="224" y="238" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">④ 이후 재측정 (문단 20·21)</text>
  <text x="224" y="264" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">순공정가치가 더 내리면 손상차손</text>
  <text x="224" y="286" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">오르면 이익 — 과거 손상차손누계액이 한도</text>
  <text x="224" y="308" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">(누계액을 넘는 상승은 인식하지 않는다)</text>

  <text x="24" y="380" font-family="sans-serif" font-size="13" fill="#444">분류 직전 장부금액은 해당 자산에 적용되는 기준서대로 먼저 잰다 (문단 18)</text>
</svg>
