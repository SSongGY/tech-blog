<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fdfdfb"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="30" y="32" font-size="17" font-weight="bold" fill="#1e293b">재평가로 생긴 차이는 방향에 따라 다른 곳으로 간다</text>
  <text x="30" y="54" font-size="13" fill="#475569">같은 자산에 앞서 반대 방향으로 기록한 금액이 있으면 그것부터 되돌린다</text>

  <!-- 출발 -->
  <rect x="340" y="76" width="200" height="44" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/>
  <text x="440" y="103" font-size="14" fill="#1e293b" text-anchor="middle">공정가치 − 장부금액</text>

  <line x1="400" y1="120" x2="210" y2="160" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="480" y1="120" x2="670" y2="160" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="140" y="132" font-size="13" fill="#2d6a4f">올랐다 (평가증)</text>
  <text x="640" y="132" font-size="13" fill="#9d0208">내렸다 (평가감)</text>

  <!-- 평가증 -->
  <rect x="60" y="162" width="300" height="56" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <text x="210" y="186" font-size="13" fill="#1e293b" text-anchor="middle">앞서 당기손익으로 인식한</text>
  <text x="210" y="206" font-size="13" fill="#1e293b" text-anchor="middle">평가감이 남아 있는가</text>

  <line x1="140" y1="218" x2="120" y2="268" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="280" y1="218" x2="300" y2="268" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="40" y="248" font-size="13" fill="#475569">그 한도까지</text>
  <text x="304" y="248" font-size="13" fill="#475569">나머지</text>

  <rect x="40" y="270" width="160" height="50" rx="6" fill="#fef3e2" stroke="#b45309" stroke-width="1.6"/>
  <text x="120" y="292" font-size="13" fill="#1e293b" text-anchor="middle">당기손익</text>
  <text x="120" y="311" font-size="13" fill="#475569" text-anchor="middle">(평가감 환입)</text>

  <rect x="220" y="270" width="160" height="50" rx="6" fill="#e8f3ee" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="300" y="292" font-size="13" fill="#1e293b" text-anchor="middle">기타포괄손익</text>
  <text x="300" y="311" font-size="13" fill="#475569" text-anchor="middle">재평가잉여금 증가</text>

  <!-- 평가감 -->
  <rect x="520" y="162" width="300" height="56" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <text x="670" y="186" font-size="13" fill="#1e293b" text-anchor="middle">그 자산의 재평가잉여금</text>
  <text x="670" y="206" font-size="13" fill="#1e293b" text-anchor="middle">잔액이 남아 있는가</text>

  <line x1="600" y1="218" x2="580" y2="268" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="740" y1="218" x2="760" y2="268" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="500" y="248" font-size="13" fill="#475569">그 한도까지</text>
  <text x="764" y="248" font-size="13" fill="#475569">나머지</text>

  <rect x="500" y="270" width="160" height="50" rx="6" fill="#e8f3ee" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="580" y="292" font-size="13" fill="#1e293b" text-anchor="middle">기타포괄손익</text>
  <text x="580" y="311" font-size="13" fill="#475569" text-anchor="middle">재평가잉여금 감소</text>

  <rect x="680" y="270" width="160" height="50" rx="6" fill="#fdecec" stroke="#9d0208" stroke-width="1.6"/>
  <text x="760" y="292" font-size="13" fill="#1e293b" text-anchor="middle">당기손익</text>
  <text x="760" y="311" font-size="13" fill="#475569" text-anchor="middle">(재평가손실)</text>

  <!-- 잉여금의 행방 -->
  <line x1="300" y1="320" x2="300" y2="372" stroke="#2d6a4f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="220" y="374" width="440" height="50" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="440" y="396" font-size="13" fill="#1e293b" text-anchor="middle">사용하거나 처분할 때 이익잉여금으로 직접 대체</text>
  <text x="440" y="415" font-size="13" fill="#475569" text-anchor="middle">당기손익으로 다시 옮기지 않는다</text>

  <text x="30" y="452" font-size="13" fill="#1e293b">평가증은 대부분 자본으로 바로 가고, 평가감은 쌓아 둔 잉여금을 넘는 순간 손익으로 간다.</text>
</svg>
