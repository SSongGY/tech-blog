<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">원가기준 진행률 — 추정 총원가가 바뀐 해에 누적 차이를 맞춘다</text>

  <!-- 계산식 -->
  <rect x="150" y="46" width="580" height="54" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="440" y="67" text-anchor="middle" font-size="14" fill="#1f2937">당기 수익 = 계약금액 × (누적 발생원가 ÷ 추정 총원가) − 전기까지 인식한 수익</text>
  <text x="440" y="90" text-anchor="middle" font-size="13" fill="#4b5563">진행률은 보고기간 말마다 다시 측정한다 (문단 40) · 변동은 회계추정치 변경 (문단 43)</text>

  <!-- 열 머리 -->
  <text x="300" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">1년차</text>
  <text x="520" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">2년차</text>
  <text x="740" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">3년차</text>

  <!-- 가나건설 -->
  <text x="100" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">가나건설</text>
  <text x="100" y="188" text-anchor="middle" font-size="13" fill="#4b5563">추정 800 유지</text>
  <rect x="210" y="138" width="180" height="62" rx="6" fill="#ecfdf5" stroke="#2d6a4f"/>
  <text x="300" y="162" text-anchor="middle" font-size="13" fill="#1f2937">240/800 = 30.00%</text>
  <text x="300" y="184" text-anchor="middle" font-size="13" fill="#2d6a4f">수익 300.0 · 이익 60.0</text>
  <rect x="430" y="138" width="180" height="62" rx="6" fill="#ecfdf5" stroke="#2d6a4f"/>
  <text x="520" y="162" text-anchor="middle" font-size="13" fill="#1f2937">600/800 = 75.00%</text>
  <text x="520" y="184" text-anchor="middle" font-size="13" fill="#2d6a4f">수익 450.0 · 이익 90.0</text>
  <rect x="650" y="138" width="180" height="62" rx="6" fill="#ecfdf5" stroke="#2d6a4f"/>
  <text x="740" y="162" text-anchor="middle" font-size="13" fill="#1f2937">800/800 = 100%</text>
  <text x="740" y="184" text-anchor="middle" font-size="13" fill="#2d6a4f">수익 250.0 · 이익 50.0</text>

  <!-- 다라건설 -->
  <text x="100" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">다라건설</text>
  <text x="100" y="278" text-anchor="middle" font-size="13" fill="#4b5563">2년차 말 800→950</text>
  <rect x="210" y="228" width="180" height="62" rx="6" fill="#ecfdf5" stroke="#2d6a4f"/>
  <text x="300" y="252" text-anchor="middle" font-size="13" fill="#1f2937">240/800 = 30.00%</text>
  <text x="300" y="274" text-anchor="middle" font-size="13" fill="#2d6a4f">수익 300.0 · 이익 60.0</text>
  <rect x="430" y="228" width="180" height="62" rx="6" fill="#fef2f2" stroke="#9d0208" stroke-width="2"/>
  <text x="520" y="252" text-anchor="middle" font-size="13" fill="#1f2937">650/950 = 68.42%</text>
  <text x="520" y="274" text-anchor="middle" font-size="13" fill="#9d0208">수익 384.2 · 이익 −25.8</text>
  <rect x="650" y="228" width="180" height="62" rx="6" fill="#ecfdf5" stroke="#2d6a4f"/>
  <text x="740" y="252" text-anchor="middle" font-size="13" fill="#1f2937">950/950 = 100%</text>
  <text x="740" y="274" text-anchor="middle" font-size="13" fill="#2d6a4f">수익 315.8 · 이익 15.8</text>

  <!-- 설명 화살표 -->
  <line x1="300" y1="296" x2="300" y2="330" stroke="#b45309" stroke-width="1.5"/>
  <line x1="300" y1="330" x2="500" y2="330" stroke="#b45309" stroke-width="1.5"/>
  <line x1="500" y1="330" x2="500" y2="298" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <text x="400" y="350" text-anchor="middle" font-size="13" fill="#b45309">1년차 이익 60.0 중 새 추정으로 맞는 몫은 12.6</text>
  <text x="400" y="372" text-anchor="middle" font-size="13" fill="#b45309">1년차는 고치지 않고 나머지를 2년차에서 덜어낸다</text>

  <!-- 하단: 합계 -->
  <rect x="150" y="392" width="580" height="60" rx="6" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="440" y="415" text-anchor="middle" font-size="14" fill="#1f2937">3년 합계 이익 = 계약금액 − 실제 총원가</text>
  <text x="440" y="438" text-anchor="middle" font-size="13" fill="#4b5563">가나 1,000 − 800 = 200.0 · 다라 1,000 − 950 = 50.0 (단위 억원)</text>
</svg>
