<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-label="과거 손실 실적에 전망 정보를 얹어 만든 충당률을 연령 구간별 매출채권 잔액에 곱해 기말 손실충당금 74,800,000원을 구하고, 기초 잔액 50,000,000원에서 제각 12,000,000원을 뺀 금액과의 차이 36,800,000원이 당기 손상차손으로 손익계산서에 들어간 뒤 현금흐름표에서 다시 가산되는 경로를 보인 흐름도">
  <rect width="880" height="460" fill="#f7f8fa"/>

  <text x="24" y="32" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1b1f23">충당률에서 손익계산서까지 — 기말 잔액이 먼저고 당기 비용은 나중이다</text>

  <!-- 1단: 충당률 만들기 -->
  <rect x="24" y="56" width="184" height="60" rx="5" fill="#e3e7eb" stroke="#55606b" stroke-width="1.5"/>
  <text x="116" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1b1f23">과거 손실 실적</text>
  <text x="116" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#55606b">0.64% ~ 48.00%</text>

  <path d="M208 86 H 248" stroke="#55606b" stroke-width="1.5" fill="none" marker-end="url(#a1)"/>

  <rect x="254" y="56" width="184" height="60" rx="5" fill="#fdf1e3" stroke="#b45309" stroke-width="1.5"/>
  <text x="346" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b45309">전망 정보 반영</text>
  <text x="346" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1b1f23">조정 배수 1.25</text>

  <path d="M438 86 H 478" stroke="#55606b" stroke-width="1.5" fill="none" marker-end="url(#a1)"/>

  <rect x="484" y="56" width="184" height="60" rx="5" fill="#e7f1ec" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="576" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2d6a4f">당기 충당률</text>
  <text x="576" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1b1f23">0.80% ~ 60.00%</text>

  <path d="M576 116 V 150" stroke="#55606b" stroke-width="1.5" fill="none" marker-end="url(#a1)"/>

  <!-- 2단: 연령 구간별 적용 -->
  <rect x="24" y="150" width="184" height="60" rx="5" fill="#e3e7eb" stroke="#55606b" stroke-width="1.5"/>
  <text x="116" y="174" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1b1f23">연령 구간별 잔액</text>
  <text x="116" y="194" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#55606b">합계 1,920,000,000</text>

  <path d="M208 180 H 466" stroke="#55606b" stroke-width="1.5" fill="none" marker-end="url(#a1)"/>
  <text x="337" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#55606b">구간마다 잔액 × 충당률</text>

  <rect x="472" y="150" width="208" height="60" rx="5" fill="#fbe9e9" stroke="#9d0208" stroke-width="1.5"/>
  <text x="576" y="174" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#9d0208">기말 손실충당금</text>
  <text x="576" y="194" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1f23">74,800,000</text>

  <path d="M576 210 V 246" stroke="#55606b" stroke-width="1.5" fill="none" marker-end="url(#a1)"/>

  <!-- 3단: 역산 -->
  <rect x="24" y="246" width="420" height="78" rx="5" fill="#ffffff" stroke="#c3c9cf" stroke-width="1"/>
  <text x="44" y="270" font-family="sans-serif" font-size="13" fill="#1b1f23">기초 손실충당금  50,000,000</text>
  <text x="44" y="292" font-family="sans-serif" font-size="13" fill="#1b1f23">(-) 당기 제각       12,000,000  — 손익을 거치지 않는다</text>
  <text x="44" y="314" font-family="sans-serif" font-size="13" fill="#55606b">= 제각 후 잔액    38,000,000</text>

  <path d="M444 285 H 490" stroke="#9d0208" stroke-width="1.5" fill="none" marker-end="url(#a2)"/>
  <text x="467" y="277" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9d0208">차이</text>

  <rect x="496" y="246" width="184" height="78" rx="5" fill="#fbe9e9" stroke="#9d0208" stroke-width="1.5"/>
  <text x="588" y="276" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#9d0208">당기 손상차손</text>
  <text x="588" y="302" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1b1f23">36,800,000</text>

  <!-- 4단: 두 재무제표 -->
  <path d="M588 324 V 352 H 230 V 374" stroke="#55606b" stroke-width="1.5" fill="none" marker-end="url(#a1)"/>
  <path d="M588 324 V 352 H 650 V 374" stroke="#55606b" stroke-width="1.5" fill="none" marker-end="url(#a1)"/>

  <rect x="24" y="374" width="412" height="62" rx="5" fill="#e3e7eb" stroke="#55606b" stroke-width="1.5"/>
  <text x="230" y="398" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1b1f23">손익계산서 — 손상차손으로 별도 표시</text>
  <text x="230" y="420" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9d0208">이익이 36,800,000원 줄어든다</text>

  <rect x="444" y="374" width="412" height="62" rx="5" fill="#e7f1ec" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="650" y="398" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1b1f23">현금흐름표 — 간접법에서 도로 가산</text>
  <text x="650" y="420" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2d6a4f">현금은 한 푼도 나가지 않았다</text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#55606b"/>
    </marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#9d0208"/>
    </marker>
  </defs>
</svg>
