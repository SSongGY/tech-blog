<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="한 해에 발생한 차입원가 89,000,000원이 특정차입금과 일반차입금으로 나뉘고, 특정차입금은 일시 운용 투자수익을 뺀 23,000,000원이, 일반차입금은 연평균지출액에서 특정차입금 충당분을 뺀 475,000,000원에 자본화이자율 6.4퍼센트를 곱한 30,400,000원이 자본화되어 합계 53,400,000원이 자산이 되고 나머지 35,600,000원은 비용으로 간다는 것을 보인 흐름도">
  <rect width="880" height="470" fill="#f7f8fa"/>

  <text x="24" y="32" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1b1f23">같은 이자, 두 갈래 — 어느 차입금에서 나왔는지로 계산이 갈린다</text>

  <rect x="310" y="54" width="260" height="46" rx="5" fill="#e3e7eb" stroke="#55606b" stroke-width="1.5"/>
  <text x="440" y="83" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1f23">2026년 차입원가 89,000,000</text>

  <path d="M440 100 V 120 H 206 V 142" stroke="#55606b" stroke-width="1.5" fill="none" marker-end="url(#b1)"/>
  <path d="M440 100 V 120 H 674 V 142" stroke="#55606b" stroke-width="1.5" fill="none" marker-end="url(#b1)"/>

  <!-- 특정차입금 -->
  <rect x="24" y="142" width="364" height="212" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="206" y="168" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d6a4f">특정차입금 (문단 12)</text>
  <text x="206" y="190" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#55606b">공장 건설 목적으로 특정하여 차입</text>

  <rect x="44" y="204" width="324" height="34" rx="4" fill="#e7f1ec" stroke="#2d6a4f" stroke-width="1"/>
  <text x="60" y="226" font-family="sans-serif" font-size="13" fill="#1b1f23">실제 발생한 차입원가</text>
  <text x="352" y="226" text-anchor="end" font-family="sans-serif" font-size="13" fill="#1b1f23">25,000,000</text>

  <rect x="44" y="244" width="324" height="34" rx="4" fill="#fdf1e3" stroke="#b45309" stroke-width="1"/>
  <text x="60" y="266" font-family="sans-serif" font-size="13" fill="#b45309">(-) 일시 운용 투자수익</text>
  <text x="352" y="266" text-anchor="end" font-family="sans-serif" font-size="13" fill="#b45309">2,000,000</text>

  <rect x="44" y="290" width="324" height="40" rx="4" fill="#e7f1ec" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="60" y="315" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2d6a4f">= 자본화액</text>
  <text x="352" y="315" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1f23">23,000,000</text>

  <!-- 일반차입금 -->
  <rect x="492" y="142" width="364" height="212" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="674" y="168" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b45309">일반차입금 (문단 14)</text>
  <text x="674" y="190" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#55606b">용도를 묶지 않은 모든 차입금</text>

  <rect x="512" y="204" width="324" height="34" rx="4" fill="#fdf1e3" stroke="#b45309" stroke-width="1"/>
  <text x="528" y="226" font-family="sans-serif" font-size="13" fill="#1b1f23">연평균지출액 − 특정차입금 충당분</text>
  <text x="820" y="226" text-anchor="end" font-family="sans-serif" font-size="13" fill="#1b1f23">475,000,000</text>

  <rect x="512" y="244" width="324" height="34" rx="4" fill="#fdf1e3" stroke="#b45309" stroke-width="1"/>
  <text x="528" y="266" font-family="sans-serif" font-size="13" fill="#1b1f23">× 자본화이자율 (가중평균)</text>
  <text x="820" y="266" text-anchor="end" font-family="sans-serif" font-size="13" fill="#1b1f23">6.4%</text>

  <rect x="512" y="290" width="324" height="40" rx="4" fill="#fdf1e3" stroke="#b45309" stroke-width="1.5"/>
  <text x="528" y="315" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b45309">= 자본화액 (한도 64,000,000)</text>
  <text x="820" y="315" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1f23">30,400,000</text>

  <path d="M206 354 V 378 H 300 V 398" stroke="#2d6a4f" stroke-width="1.5" fill="none" marker-end="url(#b2)"/>
  <path d="M674 354 V 378 H 580 V 398" stroke="#b45309" stroke-width="1.5" fill="none" marker-end="url(#b3)"/>

  <rect x="24" y="398" width="832" height="54" rx="5" fill="#ffffff" stroke="#55606b" stroke-width="1.5"/>
  <line x1="440" y1="398" x2="440" y2="452" stroke="#55606b" stroke-width="1.5"/>

  <rect x="26" y="400" width="412" height="50" rx="4" fill="#e7f1ec"/>
  <text x="232" y="421" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2d6a4f">자본화 합계 — 공장 취득원가에 더한다</text>
  <text x="232" y="442" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1f23">23,000,000 + 30,400,000 = 53,400,000</text>

  <rect x="442" y="400" width="412" height="50" rx="4" fill="#fbe9e9"/>
  <text x="648" y="421" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#9d0208">나머지 — 발생한 기간의 비용</text>
  <text x="648" y="442" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1f23">89,000,000 − 53,400,000 = 35,600,000</text>

  <defs>
    <marker id="b1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#55606b"/>
    </marker>
    <marker id="b2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#2d6a4f"/>
    </marker>
    <marker id="b3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
