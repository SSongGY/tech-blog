<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="가나지주가 원가 300 재고를 다라부품에 400에 팔고 다라부품이 75%를 외부에 450에 팔면, 연결재무제표는 외부 매출 450만 남기고 창고에 남은 재고의 미실현이익 25를 지운다. 설비 이전 처분이익 40은 감가상각비 차이로 4년에 걸쳐 10씩 되돌아온다">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="420" fill="#f7f7f4"/>
  <text x="24" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b">연결실체 밖으로 나간 거래만 남고, 안에 남은 이익은 지운다 (억원)</text>

  <rect x="24" y="56" width="530" height="166" rx="8" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="76" font-family="sans-serif" font-size="13" fill="#444">연결실체 (가나지주 + 다라부품 80%)</text>

  <rect x="44" y="92" width="170" height="64" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
  <text x="129" y="118" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">가나지주</text>
  <text x="129" y="140" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">원가 300</text>

  <path d="M214 124 L318 124" stroke="#9d0208" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="266" y="114" font-family="sans-serif" font-size="13" fill="#9d0208" text-anchor="middle">내부 매출 400</text>
  <text x="266" y="144" font-family="sans-serif" font-size="13" fill="#9d0208" text-anchor="middle">연결에서 제거</text>

  <rect x="320" y="92" width="170" height="64" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
  <text x="405" y="118" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">다라부품</text>
  <text x="405" y="140" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">매입 400</text>

  <rect x="320" y="168" width="220" height="44" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="430" y="195" font-family="sans-serif" font-size="13" fill="#b45309" text-anchor="middle">창고 25%: 장부 100 → 연결 75</text>
  <path d="M405 156 L405 166" stroke="#444" stroke-width="2" fill="none"/>

  <path d="M490 124 L636 124" stroke="#2d6a4f" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="596" y="98" font-family="sans-serif" font-size="13" fill="#2d6a4f" text-anchor="middle">외부 450</text>
  <text x="596" y="114" font-family="sans-serif" font-size="13" fill="#2d6a4f" text-anchor="middle">(75%)</text>

  <rect x="638" y="92" width="218" height="64" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="747" y="118" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">외부 고객</text>
  <text x="747" y="140" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">연결 매출 450, 원가 225</text>

  <path d="M540 190 L700 190 L700 158" stroke="#444" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="712" y="186" font-family="sans-serif" font-size="13" fill="#444">2년차 외부 판매 때</text>
  <text x="712" y="204" font-family="sans-serif" font-size="13" fill="#444">미실현이익 25 실현</text>

  <line x1="24" y1="244" x2="856" y2="244" stroke="#bbbbbb" stroke-width="1"/>
  <text x="24" y="270" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b">설비: 장부 80을 120에 이전, 4년 정액 상각 — 연결 장부와의 차이가 해마다 10씩 준다</text>

  <text x="24" y="304" font-family="sans-serif" font-size="13" fill="#444">연차</text>
  <text x="24" y="330" font-family="sans-serif" font-size="13" fill="#444">다라 장부</text>
  <text x="24" y="356" font-family="sans-serif" font-size="13" fill="#444">연결 장부</text>
  <text x="24" y="382" font-family="sans-serif" font-size="13" fill="#9d0208">차이</text>

  <text x="170" y="304" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">이전 시점</text>
  <text x="170" y="330" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">120</text>
  <text x="170" y="356" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">80</text>
  <text x="170" y="382" font-family="sans-serif" font-size="13" fill="#9d0208" text-anchor="middle">−40</text>

  <text x="300" y="304" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">1년차 말</text>
  <text x="300" y="330" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">90</text>
  <text x="300" y="356" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">60</text>
  <text x="300" y="382" font-family="sans-serif" font-size="13" fill="#9d0208" text-anchor="middle">−30</text>

  <text x="430" y="304" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">2년차 말</text>
  <text x="430" y="330" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">60</text>
  <text x="430" y="356" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">40</text>
  <text x="430" y="382" font-family="sans-serif" font-size="13" fill="#9d0208" text-anchor="middle">−20</text>

  <text x="560" y="304" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">3년차 말</text>
  <text x="560" y="330" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">30</text>
  <text x="560" y="356" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">20</text>
  <text x="560" y="382" font-family="sans-serif" font-size="13" fill="#9d0208" text-anchor="middle">−10</text>

  <text x="690" y="304" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">4년차 말</text>
  <text x="690" y="330" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">0</text>
  <text x="690" y="356" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">0</text>
  <text x="690" y="382" font-family="sans-serif" font-size="13" fill="#2d6a4f" text-anchor="middle">0</text>

  <text x="24" y="408" font-family="sans-serif" font-size="13" fill="#444">처분이익 40을 1년차에 지우고, 다라부품 상각비 30과 연결 상각비 20의 차이 10이 해마다 이익으로 돌아온다</text>
</svg>
