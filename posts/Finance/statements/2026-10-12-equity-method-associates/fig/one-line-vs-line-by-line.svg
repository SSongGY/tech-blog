<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
  </defs>

  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">같은 마바소재 40% 지분 — 지분법은 한 줄, 연결은 전 항목</text>

  <!-- 마바소재 -->
  <rect x="330" y="50" width="220" height="74" rx="6" fill="#f1f3f5" stroke="#495057"/>
  <text x="440" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">마바소재 (피투자자)</text>
  <text x="440" y="94" text-anchor="middle" font-size="13" fill="#495057">자산 6,550 · 부채 3,700</text>
  <text x="440" y="113" text-anchor="middle" font-size="13" fill="#495057">매출 5,000 · 순이익 500</text>

  <line x1="380" y1="124" x2="230" y2="172" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="124" x2="650" y2="172" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="190" y="146" text-anchor="middle" font-size="13" fill="#2d6a4f">유의적인 영향력 → 지분법</text>
  <text x="640" y="146" text-anchor="middle" font-size="13" fill="#b45309">지배력 → 연결</text>

  <!-- 지분법 쪽 -->
  <text x="220" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">가나전자 재무상태표 (지분법)</text>
  <rect x="60" y="210" width="160" height="150" fill="#ffffff" stroke="#495057"/>
  <text x="140" y="270" text-anchor="middle" font-size="13" fill="#1b1b1b">자체 자산</text>
  <text x="140" y="290" text-anchor="middle" font-size="13" fill="#495057">9,480</text>
  <rect x="60" y="360" width="160" height="40" fill="#e9f5ee" stroke="#2d6a4f"/>
  <text x="140" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d6a4f">관계기업투자 1,340</text>
  <rect x="220" y="210" width="160" height="70" fill="#ffffff" stroke="#495057"/>
  <text x="300" y="242" text-anchor="middle" font-size="13" fill="#1b1b1b">부채</text>
  <text x="300" y="262" text-anchor="middle" font-size="13" fill="#495057">4,000</text>
  <rect x="220" y="280" width="160" height="120" fill="#ffffff" stroke="#495057"/>
  <text x="300" y="334" text-anchor="middle" font-size="13" fill="#1b1b1b">자본 (지배기업)</text>
  <text x="300" y="354" text-anchor="middle" font-size="13" fill="#495057">6,820</text>
  <text x="220" y="428" text-anchor="middle" font-size="13" fill="#495057">손익: 지분법이익 200 한 줄</text>

  <!-- 연결 쪽 -->
  <text x="660" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">가나전자 재무상태표 (연결 가정)</text>
  <rect x="500" y="210" width="160" height="110" fill="#ffffff" stroke="#495057"/>
  <text x="580" y="260" text-anchor="middle" font-size="13" fill="#1b1b1b">자체 자산</text>
  <text x="580" y="280" text-anchor="middle" font-size="13" fill="#495057">9,480</text>
  <rect x="500" y="320" width="160" height="80" fill="#fef3c7" stroke="#b45309"/>
  <text x="580" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">마바 자산 6,550</text>
  <text x="580" y="372" text-anchor="middle" font-size="13" fill="#b45309">+ 영업권 200</text>
  <rect x="660" y="210" width="160" height="100" fill="#ffffff" stroke="#495057"/>
  <text x="740" y="248" text-anchor="middle" font-size="13" fill="#1b1b1b">부채</text>
  <text x="740" y="268" text-anchor="middle" font-size="13" fill="#495057">4,000 + 3,700</text>
  <rect x="660" y="310" width="160" height="55" fill="#ffffff" stroke="#495057"/>
  <text x="740" y="333" text-anchor="middle" font-size="13" fill="#1b1b1b">자본 (지배기업)</text>
  <text x="740" y="352" text-anchor="middle" font-size="13" fill="#495057">6,820</text>
  <rect x="660" y="365" width="160" height="35" fill="#fef3c7" stroke="#b45309"/>
  <text x="740" y="388" text-anchor="middle" font-size="13" fill="#b45309">비지배지분 1,710</text>
  <text x="660" y="428" text-anchor="middle" font-size="13" fill="#495057">손익: 매출·비용 전 항목 합산</text>

  <line x1="30" y1="452" x2="850" y2="452" stroke="#ced4da"/>
  <text x="40" y="478" font-size="13" fill="#495057">지배기업 소유주지분(6,820)과 지배기업 몫 순이익(800)은 두 방식에서 같다. 달라지는 것은 매출·자산·부채의 크기다.</text>
  <text x="40" y="500" font-size="13" fill="#495057">금액 단위 백만원, 가상 숫자. 칸 높이는 금액에 비례하지 않는다. code/output.txt [3]에 있다.</text>
</svg>
