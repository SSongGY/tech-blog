<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <text x="440" y="28" text-anchor="middle" font-size="15">계약의 식별 — 받은 현금이 수익이 되는 길과 부채로 남는 길</text>

  <!-- 1. 문단 12 -->
  <rect x="30" y="56" width="230" height="64" rx="6" fill="#f1f3f5" stroke="#444"/>
  <text x="145" y="82" text-anchor="middle" font-size="14">양쪽 모두 무보상 해지 가능</text>
  <text x="145" y="104" text-anchor="middle" font-size="13">+ 전혀 수행 안 됨 (문단 12)</text>
  <text x="145" y="146" text-anchor="middle" font-size="13" fill="#b45309">예 → 계약 없음</text>
  <line x1="260" y1="88" x2="318" y2="88" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="289" y="80" text-anchor="middle" font-size="13">아니오</text>

  <!-- 2. 문단 9 -->
  <rect x="320" y="56" width="240" height="64" rx="6" fill="#f1f3f5" stroke="#444"/>
  <text x="440" y="82" text-anchor="middle" font-size="14">다섯 조건 모두 충족?</text>
  <text x="440" y="104" text-anchor="middle" font-size="13">승인·권리·지급조건·실질·회수 (문단 9)</text>

  <!-- 예 → 계약 -->
  <line x1="560" y1="88" x2="618" y2="88" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="589" y="80" text-anchor="middle" font-size="13" fill="#2d6a4f">예</text>
  <rect x="620" y="56" width="230" height="64" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <text x="735" y="82" text-anchor="middle" font-size="14" fill="#2d6a4f">고객과의 계약</text>
  <text x="735" y="104" text-anchor="middle" font-size="13">이행할 때 수익 인식</text>

  <!-- 문단 13 재검토 -->
  <path d="M735,120 L735,200 L562,200" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="745" y="160" font-size="13" fill="#b45309">유의적 변동 징후 →</text>
  <text x="745" y="178" font-size="13" fill="#b45309">재검토 (문단 13)</text>

  <!-- 아니오 → 부채 -->
  <line x1="440" y1="120" x2="440" y2="176" stroke="#9d0208" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="452" y="152" font-size="13" fill="#9d0208">아니오</text>
  <rect x="320" y="178" width="240" height="64" rx="6" fill="#ffffff" stroke="#9d0208" stroke-width="2"/>
  <text x="440" y="204" text-anchor="middle" font-size="14" fill="#9d0208">받은 대가 = 부채</text>
  <text x="440" y="226" text-anchor="middle" font-size="13">받은 금액으로 측정 (문단 16)</text>

  <!-- 문단 14 지속 검토 -->
  <line x1="340" y1="242" x2="340" y2="266" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="100" y="268" width="260" height="64" rx="6" fill="#f1f3f5" stroke="#444"/>
  <text x="230" y="294" text-anchor="middle" font-size="14">조건이 나중에 충족되나</text>
  <text x="230" y="316" text-anchor="middle" font-size="13">계속 검토 (문단 14)</text>
  <path d="M290,268 L290,112 L318,112" fill="none" stroke="#2d6a4f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="250" y="200" text-anchor="middle" font-size="13" fill="#2d6a4f">충족</text>

  <!-- 문단 15 두 사건 -->
  <line x1="440" y1="242" x2="440" y2="330" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="400" y="332" width="210" height="72" rx="6" fill="#f1f3f5" stroke="#444"/>
  <text x="505" y="356" text-anchor="middle" font-size="13">⑴ 남은 의무 없음 +</text>
  <text x="505" y="376" text-anchor="middle" font-size="13">대가 대부분 받음 + 환불 안 함</text>
  <text x="505" y="396" text-anchor="middle" font-size="13">(문단 15)</text>
  <rect x="630" y="332" width="210" height="72" rx="6" fill="#f1f3f5" stroke="#444"/>
  <text x="735" y="362" text-anchor="middle" font-size="13">⑵ 계약 종료 +</text>
  <text x="735" y="382" text-anchor="middle" font-size="13">받은 대가 환불 안 함</text>
  <line x1="560" y1="230" x2="733" y2="330" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="452" text-anchor="middle" font-size="13" fill="#2d6a4f">둘 중 하나가 일어나면 받은 대가만큼 수익</text>
  <line x1="505" y1="404" x2="530" y2="436" stroke="#2d6a4f" stroke-width="1.5"/>
  <line x1="735" y1="404" x2="640" y2="436" stroke="#2d6a4f" stroke-width="1.5"/>
</svg>
