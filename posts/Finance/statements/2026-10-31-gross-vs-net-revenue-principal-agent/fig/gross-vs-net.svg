<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="540" fill="#fbfbfd"/>

  <!-- 상단: 하나의 거래 -->
  <rect x="290" y="20" width="300" height="38" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="440" y="44" font-size="15" fill="#1e293b" text-anchor="middle">고객 결제액 11,000</text>

  <line x1="440" y1="58" x2="440" y2="86" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="440,94 435,84 445,84" fill="#94a3b8"/>

  <rect x="250" y="94" width="380" height="38" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="440" y="118" font-size="15" fill="#1e293b" text-anchor="middle">거래가격 10,000 — 부가가치세 1,000 제외 (문단 47)</text>

  <!-- 갈라지는 두 길 -->
  <path d="M 440 132 L 440 152 L 190 152 L 190 168" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="190,176 185,166 195,166" fill="#94a3b8"/>
  <path d="M 440 132 L 440 152 L 660 152 L 660 168" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="660,176 655,166 665,166" fill="#94a3b8"/>

  <text x="190" y="198" font-size="15" fill="#1e293b" text-anchor="middle">대리인 — 순액 (문단 B36)</text>
  <text x="190" y="218" font-size="13" fill="#475569" text-anchor="middle">이전 전에 통제하지 않는다</text>
  <text x="660" y="198" font-size="15" fill="#1e293b" text-anchor="middle">본인 — 총액 (문단 B35B)</text>
  <text x="660" y="218" font-size="13" fill="#475569" text-anchor="middle">이전 전에 통제한다 (문단 B35)</text>

  <!-- 기준선 -->
  <line x1="60" y1="470" x2="820" y2="470" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 왼쪽: 대리인 막대 (매출 800) -->
  <rect x="120" y="450.8" width="110" height="19.2" fill="#b45309"/>
  <text x="244" y="465" font-size="14" fill="#b45309">매출액 800</text>
  <text x="120" y="420" font-size="13" fill="#475569">매출원가가 없다 — 판매자 몫 9,200 은</text>
  <text x="120" y="438" font-size="13" fill="#475569">애초에 매출에 들어오지 않는다</text>

  <!-- 오른쪽: 본인 막대 (매출원가 9,200 + 매출총이익 800) -->
  <rect x="600" y="230" width="110" height="220.8" fill="#cbd5e1" stroke="#94a3b8"/>
  <rect x="600" y="450.8" width="110" height="19.2" fill="#b45309"/>
  <text x="724" y="345" font-size="14" fill="#334155">매출원가 9,200</text>
  <text x="724" y="465" font-size="14" fill="#b45309">매출총이익 800</text>

  <!-- 매출액 10,000 괄호 -->
  <path d="M 586 230 L 576 230 L 576 470 L 586 470" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="566" y="345" font-size="14" fill="#b45309" text-anchor="end">매출액</text>
  <text x="566" y="363" font-size="14" fill="#b45309" text-anchor="end">10,000</text>

  <!-- 하단: 같은 영업이익 -->
  <rect x="250" y="494" width="380" height="34" rx="6" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="440" y="516" font-size="15" fill="#2d6a4f" text-anchor="middle">영업이익 300 — 두 경우가 같다</text>
</svg>
