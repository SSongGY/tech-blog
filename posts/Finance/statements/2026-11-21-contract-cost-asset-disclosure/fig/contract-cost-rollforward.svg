<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>

  <text x="440" y="28" text-anchor="middle" font-size="15">카타서비스 3년차 계약원가 자산 변동과 공시 문단 (억원)</text>

  <!-- 1억원 = 0.8px, 기준 x=200 -->
  <text x="190" y="72" text-anchor="end" font-size="13">기초</text>
  <rect x="200" y="56" width="214.8" height="24" fill="#e9ecef" stroke="#444"/>
  <text x="307" y="73" text-anchor="middle" font-size="13">268.5</text>

  <text x="190" y="110" text-anchor="end" font-size="13">증가 (세 범주)</text>
  <rect x="414.8" y="94" width="240" height="24" fill="#d8eadf" stroke="#2d6a4f"/>
  <text x="535" y="111" text-anchor="middle" font-size="13" fill="#2d6a4f">+300.0</text>

  <text x="190" y="148" text-anchor="end" font-size="13">상각 128⑵</text>
  <rect x="528" y="132" width="126.8" height="24" fill="#f6d5d5" stroke="#9d0208"/>
  <text x="591" y="149" text-anchor="middle" font-size="13" fill="#9d0208">−158.5</text>

  <text x="190" y="186" text-anchor="end" font-size="13">손상 128⑵</text>
  <rect x="518.4" y="170" width="9.6" height="24" fill="#f8e3c4" stroke="#b45309"/>
  <text x="510" y="187" text-anchor="end" font-size="13" fill="#b45309">−12.0</text>

  <text x="190" y="224" text-anchor="end" font-size="13">기말 128⑴</text>
  <rect x="200" y="208" width="192" height="24" fill="#e9ecef" stroke="#444"/>
  <rect x="392" y="208" width="24" height="24" fill="#f1f3f5" stroke="#444"/>
  <rect x="416" y="208" width="102.4" height="24" fill="#e9ecef" stroke="#444"/>
  <text x="296" y="225" text-anchor="middle" font-size="13">체결원가 240.0</text>
  <text x="467" y="225" text-anchor="middle" font-size="13">준비 128.0</text>
  <text x="404" y="252" text-anchor="middle" font-size="13">계약 전 30.0</text>
  <text x="530" y="225" font-size="13">합계 398.0</text>

  <text x="680" y="72" font-size="13">범주별로 나눠</text>
  <text x="680" y="92" font-size="13">기말 잔액을 공시한다</text>
  <text x="680" y="148" font-size="13">상각과 손상은</text>
  <text x="680" y="168" font-size="13">금액을 따로 적는다</text>

  <line x1="24" y1="278" x2="856" y2="278" stroke="#ccc"/>

  <!-- 공시 문단 세 칸 -->
  <rect x="24" y="296" width="264" height="150" rx="6" fill="#ffffff" stroke="#444"/>
  <text x="156" y="320" text-anchor="middle" font-size="14">문단 127 — 문장</text>
  <text x="40" y="346" font-size="13">⑴ 체결·이행원가 산정 판단</text>
  <text x="40" y="368" font-size="13">⑵ 상각금액 산정 방법</text>
  <text x="40" y="402" font-size="13" fill="#b45309">상각기간 4년 → 3년이면</text>
  <text x="40" y="424" font-size="13" fill="#b45309">4년차 상각 162.5 → 239.2</text>

  <rect x="308" y="296" width="264" height="150" rx="6" fill="#ffffff" stroke="#444"/>
  <text x="440" y="320" text-anchor="middle" font-size="14">문단 128 — 숫자</text>
  <text x="324" y="346" font-size="13">⑴ 주요 범주별 기말 잔액</text>
  <text x="324" y="368" font-size="13">(체결원가·계약 전·준비원가)</text>
  <text x="324" y="390" font-size="13">⑵ 상각금액과 손상차손</text>

  <rect x="592" y="296" width="264" height="150" rx="6" fill="#ffffff" stroke="#444"/>
  <text x="724" y="320" text-anchor="middle" font-size="14">문단 129 — 사실</text>
  <text x="608" y="346" font-size="13">문단 94 간편법을 쓰면</text>
  <text x="608" y="368" font-size="13">그 사실을 공시한다</text>
  <text x="608" y="402" font-size="13" fill="#9d0208">간편법 회사의 잔액은 0</text>
  <text x="608" y="424" font-size="13" fill="#9d0208">수수료 180은 전액 비용</text>
</svg>
