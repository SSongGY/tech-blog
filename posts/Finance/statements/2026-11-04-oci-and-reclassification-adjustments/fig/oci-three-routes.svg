<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="같은 평가이익 60억원이 당기손익, 채무상품 기타포괄손익, 지분상품 기타포괄손익 세 경로로 자본에 닿는 모습">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="470" fill="#f7f7f4"/>

  <text x="24" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b">같은 평가이익 60억원이 자본에 닿는 세 경로</text>
  <text x="24" y="56" font-family="sans-serif" font-size="13" fill="#444">취득원가 200 · 1년 말 공정가치 260 · 2년 차에 260 에 처분 · 본업 순이익은 매년 100</text>

  <!-- 열 머리 -->
  <text x="150" y="88" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1b1b1b" text-anchor="middle">아자전자 — 당기손익(FVPL)</text>
  <text x="440" y="88" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1b1b1b" text-anchor="middle">차카물산 — 채무상품 FVOCI</text>
  <text x="730" y="88" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1b1b1b" text-anchor="middle">타파산업 — 지분상품 FVOCI</text>

  <!-- 1행: 평가이익 -->
  <rect x="60" y="104" width="180" height="44" rx="4" fill="#eceae4" stroke="#777" stroke-width="1"/>
  <text x="150" y="131" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">1년 차 평가이익 60</text>
  <rect x="350" y="104" width="180" height="44" rx="4" fill="#eceae4" stroke="#777" stroke-width="1"/>
  <text x="440" y="131" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">1년 차 평가이익 60</text>
  <rect x="640" y="104" width="180" height="44" rx="4" fill="#eceae4" stroke="#777" stroke-width="1"/>
  <text x="730" y="131" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">1년 차 평가이익 60</text>

  <line x1="150" y1="148" x2="150" y2="178" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="148" x2="440" y2="178" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="148" x2="730" y2="178" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2행: 손익 자리 -->
  <rect x="60" y="180" width="180" height="46" rx="4" fill="#e6f0ea" stroke="#2d6a4f" stroke-width="2"/>
  <text x="150" y="199" font-family="sans-serif" font-size="13" fill="#2d6a4f" text-anchor="middle">당기손익</text>
  <text x="150" y="217" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2d6a4f" text-anchor="middle">1년 차 순이익 160</text>
  <rect x="350" y="180" width="180" height="46" rx="4" fill="#fdf1e0" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="199" font-family="sans-serif" font-size="13" fill="#b45309" text-anchor="middle">기타포괄손익 +60</text>
  <text x="440" y="217" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">1년 차 순이익 100</text>
  <rect x="640" y="180" width="180" height="46" rx="4" fill="#fdf1e0" stroke="#b45309" stroke-width="2"/>
  <text x="730" y="199" font-family="sans-serif" font-size="13" fill="#b45309" text-anchor="middle">기타포괄손익 +60</text>
  <text x="730" y="217" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">1년 차 순이익 100</text>

  <line x1="150" y1="226" x2="150" y2="254" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="226" x2="440" y2="254" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="226" x2="730" y2="254" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3행: 자본 안의 자리 -->
  <rect x="60" y="256" width="180" height="46" rx="4" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="150" y="275" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">이익잉여금 +60</text>
  <text x="150" y="293" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">1년 말 자본총계 1,160</text>
  <rect x="350" y="256" width="180" height="46" rx="4" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="440" y="275" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">기타포괄손익누계액 +60</text>
  <text x="440" y="293" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">1년 말 자본총계 1,160</text>
  <rect x="640" y="256" width="180" height="46" rx="4" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="730" y="275" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">기타포괄손익누계액 +60</text>
  <text x="730" y="293" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">1년 말 자본총계 1,160</text>

  <line x1="440" y1="302" x2="440" y2="330" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="302" x2="730" y2="330" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="350" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">2년 차 처분 — 손익 없음</text>
  <text x="150" y="368" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">(이미 260 으로 적혀 있다)</text>

  <!-- 4행: 2년 차 처분 -->
  <rect x="350" y="332" width="180" height="58" rx="4" fill="#e6f0ea" stroke="#2d6a4f" stroke-width="2"/>
  <text x="440" y="351" font-family="sans-serif" font-size="13" fill="#2d6a4f" text-anchor="middle">2년 차 처분 — 재분류조정</text>
  <text x="440" y="368" font-family="sans-serif" font-size="13" fill="#2d6a4f" text-anchor="middle">기타포괄손익 −60</text>
  <text x="440" y="384" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2d6a4f" text-anchor="middle">당기손익 +60 → 순이익 160</text>
  <rect x="640" y="332" width="180" height="58" rx="4" fill="#f7f7f4" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="730" y="351" font-family="sans-serif" font-size="13" fill="#b45309" text-anchor="middle">2년 차 처분 — 자본 내 대체</text>
  <text x="730" y="368" font-family="sans-serif" font-size="13" fill="#b45309" text-anchor="middle">누계액 → 이익잉여금</text>
  <text x="730" y="384" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">당기손익을 거치지 않는다</text>

  <text x="24" y="426" font-family="sans-serif" font-size="13" fill="#1b1b1b">2년 차 순이익은 160 · 100 · 160 · 100 중 어느 하나로 적히지만, 2년 말 자본총계는 셋 다 1,260 이다.</text>
  <text x="24" y="448" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2d6a4f">경로가 바꾸는 것은 60 이 어느 해, 어느 줄에 적히는가뿐이다.</text>
</svg>
