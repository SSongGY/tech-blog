<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">구조조정 충당부채 — 인식 판단과 측정 범위 (제1037호)</text>

  <!-- 시작 -->
  <rect x="290" y="50" width="300" height="54" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="440" y="73" text-anchor="middle" font-size="14" fill="#1f2937">경영진·이사회가 구조조정을 결정</text>
  <text x="440" y="94" text-anchor="middle" font-size="13" fill="#4b5563">사업 매각인가?</text>

  <!-- 오른쪽: 매각 -->
  <line x1="590" y1="77" x2="710" y2="77" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="710" y1="77" x2="710" y2="128" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="650" y="70" text-anchor="middle" font-size="13" fill="#4b5563">예</text>
  <rect x="580" y="130" width="270" height="62" rx="6" fill="#fef2f2" stroke="#9d0208"/>
  <text x="715" y="154" text-anchor="middle" font-size="14" fill="#9d0208">구속력 있는 매각약정 전 — 인식 안 함</text>
  <text x="715" y="178" text-anchor="middle" font-size="13" fill="#4b5563">문단 78·79 · 자산은 제1036호 손상검토</text>

  <!-- 계획 요건 -->
  <line x1="440" y1="104" x2="440" y2="128" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="470" y="122" font-size="13" fill="#4b5563">아니오</text>
  <rect x="230" y="130" width="320" height="86" rx="6" fill="#fffbeb" stroke="#b45309"/>
  <text x="390" y="154" text-anchor="middle" font-size="14" fill="#1f2937">구체적인 공식 계획이 있는가? (72⑴)</text>
  <text x="390" y="178" text-anchor="middle" font-size="13" fill="#4b5563">대상 사업 · 주사업장 소재지 · 해고 인원·역할</text>
  <text x="390" y="200" text-anchor="middle" font-size="13" fill="#4b5563">필요한 지출 · 실행 시기 — 다섯 가지 모두</text>

  <line x1="230" y1="173" x2="140" y2="173" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="140" y1="173" x2="140" y2="248" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="185" y="165" text-anchor="middle" font-size="13" fill="#4b5563">아니오</text>
  <rect x="30" y="250" width="220" height="54" rx="6" fill="#fef2f2" stroke="#9d0208"/>
  <text x="140" y="273" text-anchor="middle" font-size="14" fill="#9d0208">인식 안 함</text>
  <text x="140" y="294" text-anchor="middle" font-size="13" fill="#4b5563">의제의무 요건 미충족</text>

  <!-- 착수·공표 -->
  <line x1="440" y1="216" x2="440" y2="248" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="458" y="238" font-size="13" fill="#4b5563">예</text>
  <rect x="280" y="250" width="320" height="62" rx="6" fill="#fffbeb" stroke="#b45309"/>
  <text x="440" y="274" text-anchor="middle" font-size="14" fill="#1f2937">보고기간 말 전에 착수·공표했는가?</text>
  <text x="440" y="298" text-anchor="middle" font-size="13" fill="#4b5563">당사자가 정당한 기대를 갖게 됨 (72⑵·75)</text>

  <line x1="600" y1="281" x2="715" y2="281" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="715" y1="281" x2="715" y2="328" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="655" y="273" text-anchor="middle" font-size="13" fill="#4b5563">아니오</text>
  <rect x="590" y="330" width="260" height="62" rx="6" fill="#fef2f2" stroke="#9d0208"/>
  <text x="720" y="354" text-anchor="middle" font-size="14" fill="#9d0208">이번 기말엔 인식 안 함</text>
  <text x="720" y="378" text-anchor="middle" font-size="13" fill="#4b5563">기말 후 공표면 제1010호로 공시</text>

  <!-- 인식 -->
  <line x1="440" y1="312" x2="440" y2="348" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="458" y="336" font-size="13" fill="#4b5563">예</text>
  <rect x="280" y="350" width="280" height="54" rx="6" fill="#ecfdf5" stroke="#2d6a4f" stroke-width="2"/>
  <text x="420" y="373" text-anchor="middle" font-size="14" fill="#2d6a4f">구조조정충당부채 인식</text>
  <text x="420" y="394" text-anchor="middle" font-size="13" fill="#4b5563">해고급여도 같은 날 (제1019호 165⑵)</text>

  <!-- 측정 -->
  <line x1="350" y1="404" x2="230" y2="438" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="490" y1="404" x2="620" y2="438" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="40" y="440" width="380" height="96" rx="6" fill="#ecfdf5" stroke="#2d6a4f"/>
  <text x="230" y="464" text-anchor="middle" font-size="14" fill="#2d6a4f">넣는다 — 직접비용 (문단 80)</text>
  <text x="230" y="488" text-anchor="middle" font-size="13" fill="#4b5563">구조조정 때문에 반드시 생기고</text>
  <text x="230" y="510" text-anchor="middle" font-size="13" fill="#4b5563">계속 활동과 관련 없는 지출</text>
  <rect x="450" y="440" width="400" height="96" rx="6" fill="#fef2f2" stroke="#9d0208"/>
  <text x="650" y="464" text-anchor="middle" font-size="14" fill="#9d0208">넣지 않는다 · 빼지 않는다</text>
  <text x="650" y="488" text-anchor="middle" font-size="13" fill="#4b5563">재배치·교육 · 마케팅 · 새 시스템 투자 (81)</text>
  <text x="650" y="510" text-anchor="middle" font-size="13" fill="#4b5563">완료까지 영업손실 (82) · 처분이익 차감 (83)</text>
</svg>
