<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="460" fill="#fbfbf8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b3b3b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9d0208"/>
    </marker>
  </defs>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">시그널을 받은 프로세스가 하는 일 — 처리 방식(disposition)이 정한다</text>
  <text x="30" y="56" font-size="13" fill="#555">종료 코드는 bash 가 wait 로 받은 값 (실습 2·4·5·6번)</text>

  <!-- 보내는 쪽 -->
  <rect x="30" y="110" width="170" height="70" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="115" y="140" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">kill -TERM</text>
  <text x="115" y="162" font-size="13" fill="#555" text-anchor="middle">-HUP · -INT · -USR1</text>

  <!-- 처리 방식 분기 -->
  <rect x="250" y="100" width="170" height="90" rx="6" fill="#f3f1ea" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="335" y="132" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">대상 프로세스의</text>
  <text x="335" y="154" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">처리 방식</text>
  <text x="335" y="176" font-size="13" fill="#555" text-anchor="middle">trap 으로 바꾼다</text>
  <line x1="200" y1="145" x2="246" y2="145" stroke="#3b3b3b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 세 갈래 -->
  <rect x="490" y="74" width="360" height="56" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="506" y="98" font-size="14" font-weight="bold" fill="#b45309">기본 동작 — 그 자리에서 종료</text>
  <text x="506" y="119" font-size="13" fill="#b45309">정리 코드가 돌지 않는다 · 종료 코드 128+n</text>

  <rect x="490" y="146" width="360" height="56" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="506" y="170" font-size="14" font-weight="bold" fill="#2d6a4f">핸들러 — trap 의 명령을 실행</text>
  <text x="506" y="191" font-size="13" fill="#2d6a4f">정리 후 스스로 exit · 종료 코드는 핸들러가 정한다</text>

  <rect x="490" y="218" width="360" height="56" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="506" y="242" font-size="14" font-weight="bold" fill="#1b1b1b">무시 — trap "" TERM</text>
  <text x="506" y="263" font-size="13" fill="#555">아무 일도 없다 · 프로세스는 계속 돈다</text>

  <line x1="420" y1="130" x2="486" y2="102" stroke="#3b3b3b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="150" x2="486" y2="174" stroke="#3b3b3b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="172" x2="486" y2="242" stroke="#3b3b3b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- KILL / STOP -->
  <rect x="30" y="320" width="170" height="70" rx="6" fill="#ffffff" stroke="#9d0208" stroke-width="1.5"/>
  <text x="115" y="350" font-size="14" font-weight="bold" fill="#9d0208" text-anchor="middle">kill -KILL</text>
  <text x="115" y="372" font-size="13" fill="#9d0208" text-anchor="middle">kill -STOP</text>

  <rect x="490" y="320" width="360" height="70" rx="6" fill="#fbeaea" stroke="#9d0208" stroke-width="1.5"/>
  <text x="506" y="346" font-size="14" font-weight="bold" fill="#9d0208">처리 방식을 거치지 않는다</text>
  <text x="506" y="368" font-size="13" fill="#9d0208">KILL 은 종료(137), STOP 은 정지 · trap 을 걸어도</text>
  <text x="506" y="384" font-size="13" fill="#9d0208">실행되지 않는다 · 락 파일이 남는다</text>
  <line x1="200" y1="355" x2="486" y2="355" stroke="#9d0208" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="343" y="345" font-size="13" fill="#9d0208" text-anchor="middle">잡기·막기·무시 불가</text>

  <text x="30" y="430" font-size="13" fill="#555">bash 는 포그라운드 명령이 끝날 때까지 trap 실행을 미룬다 — 핸들러가 늦게 도는 이유 (실습 8번)</text>
</svg>
