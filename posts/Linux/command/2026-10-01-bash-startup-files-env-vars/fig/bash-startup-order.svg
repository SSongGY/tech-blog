<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">bash 가 뜨는 방식에 따라 읽는 초기화 파일</text>

  <!-- 시작 -->
  <rect x="20" y="170" width="130" height="80" rx="6" fill="#e9ecef" stroke="#495057" stroke-width="1.5"/>
  <text x="85" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">bash 시작</text>
  <text x="85" y="222" text-anchor="middle" font-size="13" fill="#1b1b1b">로그인인가?</text>
  <text x="85" y="240" text-anchor="middle" font-size="13" fill="#1b1b1b">대화형인가?</text>

  <!-- 분기선 -->
  <line x1="150" y1="210" x2="170" y2="210" stroke="#495057" stroke-width="1.5"/>
  <line x1="170" y1="96" x2="170" y2="370" stroke="#495057" stroke-width="1.5"/>
  <line x1="170" y1="96" x2="192" y2="96" stroke="#495057" stroke-width="1.5"/>
  <polygon points="192,91 200,96 192,101" fill="#495057"/>
  <line x1="170" y1="236" x2="192" y2="236" stroke="#495057" stroke-width="1.5"/>
  <polygon points="192,231 200,236 192,241" fill="#495057"/>
  <line x1="170" y1="370" x2="192" y2="370" stroke="#495057" stroke-width="1.5"/>
  <polygon points="192,365 200,370 192,375" fill="#495057"/>

  <!-- 1행: 로그인 -->
  <text x="200" y="62" font-size="14" font-weight="bold" fill="#495057">로그인 셸 (-l · 접속 직후) — 대화형이든 아니든</text>
  <rect x="200" y="72" width="140" height="48" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="270" y="101" text-anchor="middle" font-size="14" fill="#1b1b1b">/etc/profile</text>

  <rect x="360" y="72" width="290" height="48" rx="6" fill="#fff3cd" stroke="#b45309" stroke-width="1.5"/>
  <text x="505" y="92" text-anchor="middle" font-size="13" fill="#1b1b1b">~/.bash_profile → ~/.bash_login → ~/.profile</text>
  <text x="505" y="111" text-anchor="middle" font-size="13" fill="#b45309">있는 것 중 처음 하나만</text>

  <rect x="670" y="72" width="190" height="48" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="765" y="92" text-anchor="middle" font-size="13" fill="#1b1b1b">끝날 때 ~/.bash_logout</text>
  <text x="765" y="111" text-anchor="middle" font-size="13" fill="#495057">비대화형은 exit 때만</text>

  <line x1="340" y1="96" x2="352" y2="96" stroke="#495057" stroke-width="1.5"/>
  <polygon points="352,91 360,96 352,101" fill="#495057"/>
  <line x1="650" y1="96" x2="662" y2="96" stroke="#495057" stroke-width="1.5"/>
  <polygon points="662,91 670,96 662,101" fill="#495057"/>

  <text x="200" y="144" font-size="13" fill="#9d0208">~/.bashrc 는 읽지 않는다 — 필요하면 ~/.bash_profile 안에서 직접 읽는다.</text>
  <text x="200" y="164" font-size="13" fill="#495057">--noprofile 이면 이 줄 전체를 건너뛴다.</text>

  <!-- 2행: 대화형 비로그인 -->
  <text x="200" y="202" font-size="14" font-weight="bold" fill="#495057">대화형 · 비로그인 (-i · 새 터미널 창)</text>
  <rect x="200" y="212" width="190" height="48" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="295" y="232" text-anchor="middle" font-size="13" fill="#1b1b1b">/etc/bash.bashrc</text>
  <text x="295" y="251" text-anchor="middle" font-size="13" fill="#495057">빌드 옵션 (Git Bash 에 있음)</text>

  <rect x="420" y="212" width="200" height="48" rx="6" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="520" y="232" text-anchor="middle" font-size="14" fill="#1b1b1b">~/.bashrc</text>
  <text x="520" y="251" text-anchor="middle" font-size="13" fill="#2d6a4f">--rcfile 파일 이면 그 파일</text>

  <line x1="390" y1="236" x2="412" y2="236" stroke="#495057" stroke-width="1.5"/>
  <polygon points="412,231 420,236 412,241" fill="#495057"/>
  <text x="650" y="232" font-size="13" fill="#1b1b1b">--norc 면 둘 다 건너뛴다</text>
  <text x="650" y="251" font-size="13" fill="#1b1b1b">--rcfile 은 앞 것을 못 막는다</text>

  <!-- 3행: 비대화형 -->
  <text x="200" y="336" font-size="14" font-weight="bold" fill="#495057">비대화형 · 비로그인 (스크립트 · bash -c · cron)</text>
  <rect x="200" y="346" width="250" height="48" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="325" y="366" text-anchor="middle" font-size="13" fill="#1b1b1b">$BASH_ENV 가 가리키는 파일</text>
  <text x="325" y="385" text-anchor="middle" font-size="13" fill="#495057">없으면 아무것도 읽지 않는다</text>
  <text x="470" y="366" font-size="13" fill="#1b1b1b">원격 셸 데몬(sshd)이 띄운 비대화형 셸은</text>
  <text x="470" y="385" font-size="13" fill="#1b1b1b">예외로 ~/.bashrc 를 읽는다 (매뉴얼, 미실측)</text>

  <text x="20" y="434" font-size="13" fill="#495057">sh 이름이나 --posix 로 띄우면: 로그인은 /etc/profile · ~/.profile 만, 대화형은 $ENV 가 가리키는 파일만 읽는다.</text>
  <text x="20" y="454" font-size="13" fill="#495057">파일 목록과 순서는 Bash 매뉴얼 6.2, /etc/bash.bashrc 와 exit 조건은 이 글의 실측(code/output.txt).</text>
</svg>
