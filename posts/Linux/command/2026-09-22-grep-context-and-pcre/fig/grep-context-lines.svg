<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="480" fill="#fbfbf8"/>

  <text x="24" y="30" font-size="17" font-weight="bold" fill="#1b1b1b">grep ERROR 가 고르는 줄과 -A · -B · -C 가 끌어오는 줄</text>
  <text x="24" y="52" font-size="13" fill="#555">굵은 테두리 두 줄이 패턴에 걸린 줄이고, 오른쪽 막대는 각 옵션이 함께 출력하는 범위다</text>

  <text x="44" y="82" font-size="13" fill="#555">app.log</text>
  <text x="520" y="82" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">-B 2</text>
  <text x="632" y="82" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">-A 2</text>
  <text x="744" y="82" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">-C 1</text>

  <!-- 매칭된 줄 강조 -->
  <rect x="40" y="199" width="432" height="22" rx="3" fill="#fbeaea" stroke="#9d0208" stroke-width="2"/>
  <rect x="40" y="303" width="432" height="22" rx="3" fill="#fbeaea" stroke="#9d0208" stroke-width="2"/>

  <!-- 로그 12줄 -->
  <g font-family="Consolas,'D2Coding',monospace" font-size="13">
    <text x="48" y="112" fill="#888">01</text><text x="80" y="112" fill="#1b1b1b">INFO  pool  connection acquired id=17</text>
    <text x="48" y="138" fill="#888">02</text><text x="80" y="138" fill="#1b1b1b">INFO  http  GET /api/orders 200 41ms</text>
    <text x="48" y="164" fill="#888">03</text><text x="80" y="164" fill="#1b1b1b">WARN  pool  wait time above threshold</text>
    <text x="48" y="190" fill="#888">04</text><text x="80" y="190" fill="#1b1b1b">INFO  http  GET /api/orders 200 39ms</text>
    <text x="48" y="216" fill="#888">05</text><text x="80" y="216" fill="#9d0208">ERROR pool  acquire failed: timeout</text>
    <text x="48" y="242" fill="#888">06</text><text x="80" y="242" fill="#1b1b1b">INFO  http  GET /api/orders 500 5002ms</text>
    <text x="48" y="268" fill="#888">07</text><text x="80" y="268" fill="#1b1b1b">INFO  pool  connection released id=17</text>
    <text x="48" y="294" fill="#888">08</text><text x="80" y="294" fill="#1b1b1b">INFO  http  POST /api/orders 201 88ms</text>
    <text x="48" y="320" fill="#888">09</text><text x="80" y="320" fill="#9d0208">ERROR http  upstream returned 503</text>
    <text x="48" y="346" fill="#888">10</text><text x="80" y="346" fill="#1b1b1b">INFO  http  POST /api/orders 201 91ms</text>
    <text x="48" y="372" fill="#888">11</text><text x="80" y="372" fill="#1b1b1b">error pool  retry scheduled in 2s</text>
    <text x="48" y="398" fill="#888">12</text><text x="80" y="398" fill="#1b1b1b">INFO  http  GET /api/health 200 2ms</text>
  </g>

  <!-- -B 2 : 03~05, 07~09 -->
  <rect x="490" y="147" width="60" height="74" rx="4" fill="#eef2f6" stroke="#5a6b7c"/>
  <text x="520" y="190" font-size="13" fill="#1b1b1b" text-anchor="middle">03–05</text>
  <rect x="490" y="251" width="60" height="74" rx="4" fill="#eef2f6" stroke="#5a6b7c"/>
  <text x="520" y="294" font-size="13" fill="#1b1b1b" text-anchor="middle">07–09</text>

  <!-- -A 2 : 05~07, 09~11 -->
  <rect x="602" y="199" width="60" height="74" rx="4" fill="#eef2f6" stroke="#5a6b7c"/>
  <text x="632" y="242" font-size="13" fill="#1b1b1b" text-anchor="middle">05–07</text>
  <rect x="602" y="303" width="60" height="74" rx="4" fill="#eef2f6" stroke="#5a6b7c"/>
  <text x="632" y="346" font-size="13" fill="#1b1b1b" text-anchor="middle">09–11</text>

  <!-- -C 1 : 04~06, 08~10 -->
  <rect x="714" y="173" width="60" height="74" rx="4" fill="#eef2f6" stroke="#5a6b7c"/>
  <text x="744" y="216" font-size="13" fill="#1b1b1b" text-anchor="middle">04–06</text>
  <rect x="714" y="277" width="60" height="74" rx="4" fill="#eef2f6" stroke="#5a6b7c"/>
  <text x="744" y="320" font-size="13" fill="#1b1b1b" text-anchor="middle">08–10</text>

  <text x="24" y="436" font-size="13" fill="#1b1b1b">세 옵션 모두 블록이 둘로 갈리므로 그 사이에 구분선 <tspan font-family="Consolas,monospace">--</tspan> 한 줄이 들어간다. 범위가 겹쳐 이어지면 구분선 없이 한 덩어리로 나온다.</text>
  <text x="24" y="458" font-size="13" fill="#1b1b1b">11행의 소문자 <tspan font-family="Consolas,monospace">error</tspan> 는 어느 범위에도 없다. 대문자 <tspan font-family="Consolas,monospace">ERROR</tspan> 로 찾았기 때문이고, <tspan font-family="Consolas,monospace">-i</tspan> 를 붙이면 그때 걸린다.</text>
</svg>
