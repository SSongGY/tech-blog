<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fbfbf8"/>

  <text x="40" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">sed가 한 줄을 처리하는 순서, 그리고 -i가 파일을 바꾸는 방식</text>

  <!-- panel A: cycle -->
  <text x="40" y="70" font-size="14" font-weight="bold" fill="#1b1b1b">가. 실행 주기 — 줄마다 반복</text>

  <rect x="40" y="86" width="150" height="56" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="115" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">입력 한 줄</text>
  <text x="115" y="130" font-size="13" text-anchor="middle" fill="#444">줄끝 개행은 뗀다</text>

  <rect x="230" y="86" width="170" height="56" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="315" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">패턴 공간</text>
  <text x="315" y="130" font-size="13" text-anchor="middle" fill="#444">pattern space</text>

  <rect x="440" y="86" width="190" height="56" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="535" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">스크립트 명령</text>
  <text x="535" y="130" font-size="13" text-anchor="middle" fill="#444">주소가 맞는 것만 실행</text>

  <rect x="670" y="86" width="170" height="56" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="2"/>
  <text x="755" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#2d6a4f">출력</text>
  <text x="755" y="130" font-size="13" text-anchor="middle" fill="#444">-n · d면 생략</text>

  <path d="M 192 114 L 226 114" stroke="#3b3b3b" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 402 114 L 436 114" stroke="#3b3b3b" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 632 114 L 666 114" stroke="#2d6a4f" stroke-width="1.5" fill="none" marker-end="url(#arg)"/>
  <path d="M 755 144 L 755 172 L 115 172 L 115 146" stroke="#3b3b3b" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="435" y="192" font-size="13" text-anchor="middle" fill="#555">다음 줄 — 치환이 한 번도 안 일어나도 오류가 아니다 (종료 코드 0)</text>

  <line x1="40" y1="214" x2="840" y2="214" stroke="#d8d8d2" stroke-width="1"/>

  <!-- panel B: in-place -->
  <text x="40" y="246" font-size="14" font-weight="bold" fill="#1b1b1b">나. -i — 원본을 고치지 않고, 새 파일을 만들어 원래 이름을 붙인다</text>

  <rect x="40" y="264" width="170" height="64" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="125" y="290" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">① 원본을 읽는다</text>
  <text x="125" y="310" font-size="13" text-anchor="middle" fill="#444">batch.conf (링크 2개)</text>

  <rect x="250" y="264" width="190" height="64" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="345" y="290" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">② 임시 파일에 쓴다</text>
  <text x="345" y="310" font-size="13" text-anchor="middle" fill="#444">표준 출력 대신</text>

  <rect x="480" y="264" width="170" height="64" rx="6" fill="#fdf3e6" stroke="#b45309" stroke-width="2"/>
  <text x="565" y="290" font-size="14" font-weight="bold" text-anchor="middle" fill="#b45309">③ 이름을 바꾼다</text>
  <text x="565" y="310" font-size="13" text-anchor="middle" fill="#444">임시 → batch.conf</text>

  <text x="670" y="284" font-size="13" fill="#555">접미사를 주면</text>
  <text x="670" y="302" font-size="13" fill="#555">옛 파일이</text>
  <text x="670" y="320" font-size="13" fill="#555">백업 이름으로 남는다</text>

  <path d="M 212 296 L 246 296" stroke="#3b3b3b" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 442 296 L 476 296" stroke="#3b3b3b" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <rect x="40" y="352" width="380" height="96" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="58" y="376" font-size="14" font-weight="bold" fill="#2d6a4f">batch.conf — 새 파일</text>
  <text x="58" y="400" font-size="13" fill="#333">db.pool=60 · 링크 수 1</text>
  <text x="58" y="422" font-size="13" fill="#333">이름만 같고 파일은 다르다</text>

  <rect x="460" y="352" width="380" height="96" rx="6" fill="#fbeaea" stroke="#9d0208" stroke-width="1.5"/>
  <text x="478" y="376" font-size="14" font-weight="bold" fill="#9d0208">batch.link — 옛 파일에 남는다</text>
  <text x="478" y="400" font-size="13" fill="#333">db.pool=40 · 링크 수 1</text>
  <text x="478" y="422" font-size="13" fill="#333">이 이름으로 읽는 프로그램은 옛 값을 본다</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b3b3b"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6a4f"/>
    </marker>
  </defs>
</svg>
