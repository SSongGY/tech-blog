<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14">
  <rect x="0" y="0" width="880" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9d0208"/>
    </marker>
  </defs>

  <text x="30" y="32" font-size="16" font-weight="bold" fill="#1f2937">① 이름 바꾸기 로테이션 (mv svc.log svc.log.1 → 새 svc.log 생성) 직후</text>

  <!-- 이름 -->
  <text x="105" y="66" text-anchor="middle" font-size="13" fill="#4b5563">파일 이름</text>
  <rect x="40" y="78" width="130" height="40" rx="6" fill="#f3f4f6" stroke="#4b5563"/>
  <text x="105" y="103" text-anchor="middle" font-family="Consolas,monospace">svc.log.1</text>
  <rect x="40" y="188" width="130" height="40" rx="6" fill="#f3f4f6" stroke="#4b5563"/>
  <text x="105" y="213" text-anchor="middle" font-family="Consolas,monospace">svc.log</text>

  <!-- 파일 실체 -->
  <text x="345" y="66" text-anchor="middle" font-size="13" fill="#4b5563">파일 실체 (장치·inode 번호)</text>
  <rect x="240" y="78" width="210" height="58" rx="6" fill="#eef2ff" stroke="#4b5563"/>
  <text x="345" y="100" text-anchor="middle" font-weight="bold" fill="#1f2937">파일 A (옛 파일)</text>
  <text x="345" y="122" text-anchor="middle" font-size="13" fill="#374151">late write to old file</text>
  <rect x="240" y="180" width="210" height="58" rx="6" fill="#eef2ff" stroke="#4b5563"/>
  <text x="345" y="202" text-anchor="middle" font-weight="bold" fill="#1f2937">파일 B (새 파일)</text>
  <text x="345" y="224" text-anchor="middle" font-size="13" fill="#374151">after rotate 1, 2</text>

  <line x1="170" y1="98" x2="238" y2="104" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="170" y1="208" x2="238" y2="208" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <!-- tail -->
  <rect x="640" y="78" width="200" height="58" rx="6" fill="#fdecec" stroke="#9d0208"/>
  <text x="740" y="100" text-anchor="middle" font-weight="bold" fill="#1f2937">tail -f</text>
  <text x="740" y="122" text-anchor="middle" font-size="13" fill="#374151">열어 둔 파일(descriptor)</text>
  <rect x="640" y="180" width="200" height="58" rx="6" fill="#e8f5ee" stroke="#2d6a4f"/>
  <text x="740" y="202" text-anchor="middle" font-weight="bold" fill="#1f2937">tail -F</text>
  <text x="740" y="224" text-anchor="middle" font-size="13" fill="#374151">이름(name) + --retry</text>

  <line x1="640" y1="107" x2="452" y2="107" stroke="#9d0208" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="546" y="98" text-anchor="middle" font-size="13" fill="#9d0208">끝까지 A만 읽는다</text>

  <line x1="640" y1="196" x2="452" y2="126" stroke="#9d0208" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-r)"/>
  <text x="560" y="150" text-anchor="middle" font-size="13" fill="#9d0208">전환 전엔 A</text>
  <line x1="640" y1="222" x2="452" y2="222" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="546" y="244" text-anchor="middle" font-size="13" fill="#2d6a4f">이름을 다시 열어 B로</text>

  <text x="40" y="276" font-size="13" fill="#b45309">-F는 크기 변화 없는 확인이 5회 이어지면(폴링 1초 간격 기본) 이름을 다시 열어 inode를 비교한다.</text>
  <text x="40" y="296" font-size="13" fill="#b45309">실습: 기본값에서 7초 뒤, --max-unchanged-stats=1이면 3초 뒤에 새 파일 내용이 나왔다. 그 사이 옛 파일에 쓴 줄도 읽었다.</text>

  <!-- copytruncate -->
  <text x="30" y="342" font-size="16" font-weight="bold" fill="#1f2937">② copytruncate — 비운 직후 더 길게 쓰면 앞부분이 사라진다</text>
  <text x="40" y="372" font-size="13" fill="#374151">tail은 읽은 위치를 기억한다(15바이트). 다음 확인 때 크기가 위치보다 작아야 "file truncated"로 보고 처음부터 읽는다.</text>

  <!-- 65바이트 막대, 1바이트 = 10px -->
  <rect x="40" y="392" width="150" height="34" fill="#fdecec" stroke="#9d0208"/>
  <text x="115" y="414" text-anchor="middle" font-size="13" fill="#9d0208">0~14 못 읽음</text>
  <rect x="190" y="392" width="500" height="34" fill="#e8f5ee" stroke="#2d6a4f"/>
  <text x="440" y="414" text-anchor="middle" font-size="13" fill="#2d6a4f">15~64 읽음 → "BBBBBBBB-2"부터 출력</text>
  <line x1="190" y1="384" x2="190" y2="434" stroke="#1f2937" stroke-width="2"/>
  <text x="700" y="414" font-size="13" fill="#374151">새 크기 65바이트</text>

  <text x="40" y="460" font-size="13" fill="#374151">비운 뒤 tail이 확인하기 전에 65바이트가 쓰였다. 65 ≥ 15라 크기만 보고는 비운 것을 알 수 없어, 15바이트부터 이어 읽었다.</text>
  <text x="40" y="482" font-size="13" fill="#374151">첫 줄 "AAAAAAAAAA-1"(13바이트)과 둘째 줄 앞 2바이트가 출력에서 빠졌다 (실습 7번).</text>
</svg>
