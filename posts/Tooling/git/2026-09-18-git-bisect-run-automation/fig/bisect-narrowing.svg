<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="'Segoe UI', 'Malgun Gothic', sans-serif">
  <rect width="880" height="350" fill="#fbfbfd"/>

  <text x="24" y="34" font-size="16" font-weight="600" fill="#0f172a">이분 탐색으로 후보가 줄어드는 과정</text>
  <text x="24" y="56" font-size="13" fill="#64748b">커밋 64개 · 테스트 1회마다 남은 후보가 절반이 된다</text>

  <!-- 시작 -->
  <text x="24" y="100" font-size="13" fill="#475569">시작</text>
  <rect x="96" y="82" width="688" height="26" rx="3" fill="#eef2ff" stroke="#6366f1"/>
  <rect x="96" y="82" width="10" height="26" rx="3" fill="#2d6a4f"/>
  <rect x="774" y="82" width="10" height="26" rx="3" fill="#9d0208"/>
  <text x="116" y="100" font-size="13" fill="#2d6a4f">r000 good — 확실히 되던 시점</text>
  <text x="766" y="100" font-size="13" fill="#9d0208" text-anchor="end">r063 bad — 지금</text>
  <text x="800" y="100" font-size="13" fill="#64748b">후보 64</text>

  <!-- 1회: r031 good → 오른쪽이 남는다 -->
  <text x="24" y="148" font-size="13" fill="#475569">1회</text>
  <rect x="96" y="130" width="688" height="26" rx="3" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="429" y="130" width="355" height="26" rx="3" fill="#eef2ff" stroke="#6366f1"/>
  <circle cx="429" cy="143" r="6" fill="#2d6a4f"/>
  <text x="106" y="148" font-size="13" fill="#0f172a">r031 테스트 → good</text>
  <text x="800" y="148" font-size="13" fill="#64748b">후보 32</text>

  <!-- 2회: r047 bad → 왼쪽이 남는다 -->
  <text x="24" y="196" font-size="13" fill="#475569">2회</text>
  <rect x="429" y="178" width="355" height="26" rx="3" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="429" y="178" width="172" height="26" rx="3" fill="#eef2ff" stroke="#6366f1"/>
  <circle cx="601" cy="191" r="6" fill="#9d0208"/>
  <text x="613" y="196" font-size="13" fill="#0f172a">r047 테스트 → bad</text>
  <text x="800" y="196" font-size="13" fill="#64748b">후보 16</text>

  <!-- 3회: r039 good → 오른쪽이 남는다 -->
  <text x="24" y="244" font-size="13" fill="#475569">3회</text>
  <rect x="429" y="226" width="172" height="26" rx="3" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="515" y="226" width="86" height="26" rx="3" fill="#eef2ff" stroke="#6366f1"/>
  <circle cx="515" cy="239" r="6" fill="#2d6a4f"/>
  <text x="613" y="244" font-size="13" fill="#0f172a">r039 테스트 → good</text>
  <text x="800" y="244" font-size="13" fill="#64748b">후보 8</text>

  <!-- 결과 -->
  <text x="24" y="292" font-size="13" fill="#475569">…</text>
  <rect x="96" y="274" width="300" height="32" rx="4" fill="#e8f3ed" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="112" y="295" font-size="13" font-weight="600" fill="#2d6a4f">6회면 커밋 1개로 좁혀진다</text>
  <text x="416" y="295" font-size="13" fill="#64748b">log₂(64) = 6 · 커밋 1,000개면 10회 · 100만 개면 20회</text>

  <text x="24" y="336" font-size="13" fill="#94a3b8">파란 구간 = 아직 남은 후보. good으로 판정되면 그 뒤쪽이, bad로 판정되면 그 앞쪽이 남는다.</text>
</svg>
