<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340"
     font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="880" height="340" fill="#f8f9fa"/>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#495057"/>
    </marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 z" fill="#495057"/>
    </marker>
  </defs>

  <text x="24" y="28" font-size="16" font-weight="bold" fill="#212529">플레임 그래프의 두 축 — 가로는 표본 비율, 세로는 스택 깊이</text>
  <text x="24" y="50" font-size="13" fill="#495057">세로가 높다고 느린 것이 아니다. 비용은 가로폭에, 그중 직접 쓴 시간은 맨 윗면에 있다.</text>

  <!-- 모식 플레임 -->
  <rect x="60" y="246" width="420" height="26" rx="2" fill="#e9ecef" stroke="#495057" stroke-width="1"/>
  <text x="270" y="264" font-size="13" fill="#212529" text-anchor="middle">root — 표본 전체</text>

  <rect x="60" y="218" width="268" height="26" rx="2" fill="#e0b473" stroke="#495057" stroke-width="1"/>
  <text x="194" y="236" font-size="13" fill="#212529" text-anchor="middle">A</text>
  <rect x="330" y="218" width="150" height="26" rx="2" fill="#d19a56" stroke="#495057" stroke-width="1"/>
  <text x="405" y="236" font-size="13" fill="#212529" text-anchor="middle">B</text>

  <rect x="60" y="190" width="86" height="26" rx="2" fill="#c98b4b" stroke="#495057" stroke-width="1"/>
  <text x="103" y="208" font-size="13" fill="#212529" text-anchor="middle">A1</text>
  <rect x="148" y="190" width="180" height="26" rx="2" fill="#bf7a3c" stroke="#495057" stroke-width="1"/>
  <text x="238" y="208" font-size="13" fill="#212529" text-anchor="middle">A2</text>
  <rect x="330" y="190" width="150" height="26" rx="2" fill="#cf8f4f" stroke="#495057" stroke-width="1"/>
  <text x="405" y="208" font-size="13" fill="#212529" text-anchor="middle">B1</text>

  <rect x="148" y="162" width="180" height="26" rx="2" fill="#d9a05b" stroke="#495057" stroke-width="1"/>
  <text x="238" y="180" font-size="13" fill="#212529" text-anchor="middle">A2a</text>

  <!-- ① 가로폭 -->
  <line x1="148" y1="290" x2="328" y2="290" stroke="#495057" stroke-width="1.4"
        marker-end="url(#a1)" marker-start="url(#a2)"/>
  <text x="238" y="310" font-size="13" fill="#495057" text-anchor="middle">① 가로폭</text>

  <!-- ② 세로 깊이 -->
  <line x1="42" y1="272" x2="42" y2="164" stroke="#495057" stroke-width="1.4"
        marker-end="url(#a1)" marker-start="url(#a2)"/>
  <text x="24" y="150" font-size="13" fill="#495057">② 세로</text>

  <!-- ③ 윗면 -->
  <line x1="520" y1="150" x2="334" y2="166" stroke="#495057" stroke-width="1.4" marker-end="url(#a1)"/>
  <text x="528" y="146" font-size="13" font-weight="bold" fill="#212529">③ 윗면</text>

  <!-- ④ 가로 순서 -->
  <text x="270" y="332" font-size="13" fill="#495057" text-anchor="middle">④ A 가 B 왼쪽에 있는 이유는 이름순이기 때문이다</text>

  <text x="528" y="186" font-size="13" fill="#212529">① 그 스택이 표본에서 차지한 비율.</text>
  <text x="544" y="204" font-size="13" fill="#212529">자식까지 포함한 시간이다</text>
  <text x="528" y="228" font-size="13" fill="#212529">② 스택 깊이. 호출이 몇 단 겹쳤는지일</text>
  <text x="544" y="246" font-size="13" fill="#212529">뿐 비용이 아니다</text>
  <text x="528" y="270" font-size="13" fill="#212529">③ 집은 순간 돌고 있던 프레임.</text>
  <text x="544" y="288" font-size="13" fill="#212529">자기 시간이다</text>
  <text x="528" y="312" font-size="13" fill="#212529">④ 형제 칸의 좌우는 이름순이다</text>
  <text x="528" y="332" font-size="13" fill="#9d0208">A 는 A2a 보다 넓지만 직접 쓴 시간은 0 일 수 있다</text>
</svg>
