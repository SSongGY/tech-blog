<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404"
     font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="880" height="404" fill="#f8f9fa"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#495057"/>
    </marker>
  </defs>

  <text x="20" y="26" font-size="16" font-weight="bold" fill="#212529">공개키는 연결마다 몇 번, 대칭키는 바이트마다 — 그래서 둘을 섞어 쓴다</text>
  <text x="20" y="48" font-size="13" fill="#495057">왼쪽은 TLS 1.3 이 두 층을 나눠 쓰는 구조, 오른쪽은 이 기계에서 잰 값으로 환산한 비용.</text>

  <!-- 왼쪽: TLS 구조 -->
  <text x="20" y="80" font-size="14" font-weight="bold" fill="#212529">TLS 1.3 연결 한 번</text>

  <rect x="20" y="92" width="400" height="124" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="36" y="116" font-size="13" font-weight="bold" fill="#b45309">핸드셰이크 — 연결마다 한 번</text>
  <text x="36" y="140" font-size="13" fill="#212529">· 키 교환: ClientHello·ServerHello 의 key_share</text>
  <text x="36" y="162" font-size="13" fill="#212529">· 인증: CertificateVerify 가 개인키 보유를 증명</text>
  <text x="36" y="184" font-size="13" fill="#495057">공개키 연산이 여기에만 들어간다</text>
  <text x="36" y="206" font-size="13" fill="#495057">세 단계: 키 교환 · 서버 파라미터 · 인증</text>

  <line x1="220" y1="216" x2="220" y2="244" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="248" width="400" height="104" rx="6" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="36" y="272" font-size="13" font-weight="bold" fill="#2d6a4f">레코드 — 주고받는 데이터 전부</text>
  <text x="36" y="296" font-size="13" fill="#212529">· 모든 암호 방식을 AEAD 로 다룬다</text>
  <text x="36" y="318" font-size="13" fill="#212529">· 레코드 하나는 2^14 = 16,384 바이트 이하</text>
  <text x="36" y="340" font-size="13" fill="#495057">대칭키 연산이 바이트 수만큼 반복된다</text>

  <!-- 오른쪽: 환산 -->
  <text x="450" y="80" font-size="14" font-weight="bold" fill="#212529">공개키 연산 한 번 = AES-128-GCM 이 처리하는 양</text>

  <text x="450" y="112" font-size="13" fill="#212529">RSA-2048 서명</text>
  <rect x="450" y="120" width="319" height="22" fill="#9d0208"/>
  <text x="777" y="136" font-size="13" font-weight="bold" fill="#9d0208">3.19 MB</text>

  <text x="450" y="172" font-size="13" fill="#212529">X25519 키 합의</text>
  <rect x="450" y="180" width="16" height="22" fill="#2d6a4f"/>
  <text x="474" y="196" font-size="13" font-weight="bold" fill="#2d6a4f">0.16 MB</text>

  <text x="450" y="232" font-size="13" fill="#212529">ECDSA P-256 서명</text>
  <rect x="450" y="240" width="12" height="22" fill="#2d6a4f"/>
  <text x="470" y="256" font-size="13" font-weight="bold" fill="#2d6a4f">0.12 MB</text>

  <rect x="450" y="280" width="410" height="72" rx="6" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <text x="466" y="304" font-size="13" fill="#212529">같은 시간에 AES 는 16KB 레코드를 7.67 GB/s 로 민다.</text>
  <text x="466" y="326" font-size="13" fill="#212529">공개키 연산은 연결마다 몇 번뿐이라, 주고받는 양이</text>
  <text x="466" y="344" font-size="13" fill="#212529">몇 MB 를 넘으면 비용의 축이 대칭키 쪽으로 넘어간다.</text>
</svg>
