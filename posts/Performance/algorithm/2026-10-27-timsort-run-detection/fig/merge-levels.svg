<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="380" fill="#fbfbf7"/>

  <text x="40" y="34" font-size="17" font-weight="bold" fill="#1b2a2f">병합 단계 수가 비교 횟수를 정한다</text>
  <text x="40" y="58" font-size="13" fill="#52616b">1024개씩 정렬된 블록 32개 — 단계마다 전체 원소를 한 번씩 훑으므로 비용이 단계 수에 비례한다</text>

  <text x="40" y="88" font-size="13" fill="#52616b">가로 폭은 언제나 전체 원소 32,768개. 칸이 합쳐지며 줄어드는 것은 런의 개수뿐이다.</text>

  <g font-size="13">
    <text x="40" y="118" fill="#1b2a2f">런 32개</text>
    <text x="760" y="118" fill="#52616b">시작</text>
    <text x="40" y="156" fill="#1b2a2f">런 16개</text>
    <text x="760" y="156" fill="#2d6a4f">+32,768</text>
    <text x="40" y="194" fill="#1b2a2f">런 8개</text>
    <text x="760" y="194" fill="#2d6a4f">+32,768</text>
    <text x="40" y="232" fill="#1b2a2f">런 4개</text>
    <text x="760" y="232" fill="#2d6a4f">+32,768</text>
    <text x="40" y="270" fill="#1b2a2f">런 2개</text>
    <text x="760" y="270" fill="#2d6a4f">+32,768</text>
    <text x="40" y="308" fill="#1b2a2f">런 1개</text>
    <text x="760" y="308" fill="#2d6a4f">+32,768</text>
  </g>

  <!-- level 0: 32 segments -->
  <g stroke="#2d6a4f" fill="#e8f1ec">
    <rect x="130" y="100" width="620" height="22"/>
  </g>
  <g stroke="#2d6a4f" stroke-width="0.8">
    <line x1="149" y1="100" x2="149" y2="122"/><line x1="168" y1="100" x2="168" y2="122"/><line x1="188" y1="100" x2="188" y2="122"/><line x1="207" y1="100" x2="207" y2="122"/>
    <line x1="227" y1="100" x2="227" y2="122"/><line x1="246" y1="100" x2="246" y2="122"/><line x1="265" y1="100" x2="265" y2="122"/><line x1="285" y1="100" x2="285" y2="122"/>
    <line x1="304" y1="100" x2="304" y2="122"/><line x1="324" y1="100" x2="324" y2="122"/><line x1="343" y1="100" x2="343" y2="122"/><line x1="362" y1="100" x2="362" y2="122"/>
    <line x1="382" y1="100" x2="382" y2="122"/><line x1="401" y1="100" x2="401" y2="122"/><line x1="421" y1="100" x2="421" y2="122"/><line x1="440" y1="100" x2="440" y2="122"/>
    <line x1="459" y1="100" x2="459" y2="122"/><line x1="479" y1="100" x2="479" y2="122"/><line x1="498" y1="100" x2="498" y2="122"/><line x1="518" y1="100" x2="518" y2="122"/>
    <line x1="537" y1="100" x2="537" y2="122"/><line x1="556" y1="100" x2="556" y2="122"/><line x1="576" y1="100" x2="576" y2="122"/><line x1="595" y1="100" x2="595" y2="122"/>
    <line x1="615" y1="100" x2="615" y2="122"/><line x1="634" y1="100" x2="634" y2="122"/><line x1="653" y1="100" x2="653" y2="122"/><line x1="673" y1="100" x2="673" y2="122"/>
    <line x1="692" y1="100" x2="692" y2="122"/><line x1="712" y1="100" x2="712" y2="122"/><line x1="731" y1="100" x2="731" y2="122"/>
  </g>

  <!-- level 1: 16 segments -->
  <rect x="130" y="138" width="620" height="22" fill="#e8f1ec" stroke="#2d6a4f"/>
  <g stroke="#2d6a4f" stroke-width="0.8">
    <line x1="168" y1="138" x2="168" y2="160"/><line x1="207" y1="138" x2="207" y2="160"/><line x1="246" y1="138" x2="246" y2="160"/><line x1="285" y1="138" x2="285" y2="160"/>
    <line x1="324" y1="138" x2="324" y2="160"/><line x1="362" y1="138" x2="362" y2="160"/><line x1="401" y1="138" x2="401" y2="160"/><line x1="440" y1="138" x2="440" y2="160"/>
    <line x1="479" y1="138" x2="479" y2="160"/><line x1="518" y1="138" x2="518" y2="160"/><line x1="556" y1="138" x2="556" y2="160"/><line x1="595" y1="138" x2="595" y2="160"/>
    <line x1="634" y1="138" x2="634" y2="160"/><line x1="673" y1="138" x2="673" y2="160"/><line x1="712" y1="138" x2="712" y2="160"/>
  </g>

  <!-- level 2: 8 segments -->
  <rect x="130" y="176" width="620" height="22" fill="#e8f1ec" stroke="#2d6a4f"/>
  <g stroke="#2d6a4f" stroke-width="0.8">
    <line x1="207" y1="176" x2="207" y2="198"/><line x1="285" y1="176" x2="285" y2="198"/><line x1="362" y1="176" x2="362" y2="198"/><line x1="440" y1="176" x2="440" y2="198"/>
    <line x1="518" y1="176" x2="518" y2="198"/><line x1="595" y1="176" x2="595" y2="198"/><line x1="673" y1="176" x2="673" y2="198"/>
  </g>

  <!-- level 3: 4 segments -->
  <rect x="130" y="214" width="620" height="22" fill="#e8f1ec" stroke="#2d6a4f"/>
  <g stroke="#2d6a4f" stroke-width="0.8">
    <line x1="285" y1="214" x2="285" y2="236"/><line x1="440" y1="214" x2="440" y2="236"/><line x1="595" y1="214" x2="595" y2="236"/>
  </g>

  <!-- level 4: 2 segments -->
  <rect x="130" y="252" width="620" height="22" fill="#e8f1ec" stroke="#2d6a4f"/>
  <line x1="440" y1="252" x2="440" y2="274" stroke="#2d6a4f" stroke-width="0.8"/>

  <!-- level 5: 1 -->
  <rect x="130" y="290" width="620" height="22" fill="#e8f1ec" stroke="#2d6a4f"/>

  <text x="40" y="344" font-size="13" fill="#1b2a2f">런을 찾는 데 n−1 번 + 병합 5단계 × n 번 = 196,607 번 — 실제로 센 값은 196,603 번이다.</text>
  <text x="40" y="366" font-size="13" fill="#52616b">덩어리가 커지면 단계 수가 줄고, 입력이 이미 정렬돼 있으면 런이 하나라 병합 단계가 아예 없다.</text>
</svg>
