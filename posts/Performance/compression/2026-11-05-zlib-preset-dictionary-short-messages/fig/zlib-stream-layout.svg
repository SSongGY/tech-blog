<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360"
     font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="880" height="360" fill="#f8f9fa"/>
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#212529">zlib 스트림의 바이트 배치와 사전이 들어가는 자리</text>
  <text x="20" y="48" font-size="13" fill="#495057">사전은 스트림에 실리지 않는다. 압축기와 해제기가 각자 갖고 있다가 창(32KiB)의 앞부분을 미리 채운다.</text>

  <text x="20" y="84" font-size="13" font-weight="bold" fill="#212529">① 사전 없음</text>
  <rect x="20" y="96" width="70" height="44" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <text x="30" y="123" font-size="13" fill="#212529">헤더 2B</text>
  <rect x="90" y="96" width="600" height="44" fill="#fde2e4" stroke="#9d0208" stroke-width="1.5"/>
  <text x="104" y="123" font-size="13" fill="#212529">deflate 데이터 — 앞에 찾아볼 반복이 없어 리터럴 위주</text>
  <rect x="690" y="96" width="80" height="44" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <text x="700" y="123" font-size="13" fill="#212529">Adler 4B</text>

  <text x="20" y="190" font-size="13" font-weight="bold" fill="#212529">② 사전 사용 (FDICT = 1)</text>
  <rect x="20" y="202" width="70" height="44" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <text x="30" y="229" font-size="13" fill="#212529">헤더 2B</text>
  <rect x="90" y="202" width="90" height="44" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="100" y="229" font-size="13" fill="#212529">DICTID 4B</text>
  <rect x="180" y="202" width="270" height="44" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="194" y="229" font-size="13" fill="#212529">deflate 데이터 — 사전을 가리키는 참조</text>
  <rect x="450" y="202" width="80" height="44" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <text x="460" y="229" font-size="13" fill="#212529">Adler 4B</text>

  <text x="20" y="284" font-size="13" fill="#212529">DICTID 는 사전의 Adler-32 값이다. 해제기가 다른 사전을 쓰면 이 값으로 불일치를 알아챈다.</text>
  <text x="20" y="306" font-size="13" fill="#495057">wbits 를 음수로 주면 헤더·DICTID·Adler 가 모두 빠지지만, 사전 확인도 함께 사라진다.</text>
  <text x="20" y="328" font-size="13" fill="#495057">박스 너비는 비율을 나타내지 않는다.</text>
</svg>
