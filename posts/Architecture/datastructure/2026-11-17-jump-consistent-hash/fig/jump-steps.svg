<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="440" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">버킷 수 n 이 늘 때 한 키의 버킷 — 바뀔 때는 항상 새 버킷 n-1 로 점프한다</text>
  <text x="440" y="54" font-size="13" text-anchor="middle" fill="#4b5563">실습 [1]의 key1 · 세로축은 ch(key, n), 가로축은 버킷 수 n</text>

  <!-- 축 -->
  <line x1="80" y1="350" x2="800" y2="350" stroke="#6b7280" stroke-width="1"/>
  <line x1="80" y1="350" x2="80" y2="80" stroke="#6b7280" stroke-width="1"/>
  <g font-size="13" fill="#4b5563" text-anchor="middle">
    <text x="100" y="370">1</text><text x="152" y="370">2</text><text x="204" y="370">3</text>
    <text x="256" y="370">4</text><text x="308" y="370">5</text><text x="360" y="370">6</text>
    <text x="412" y="370">7</text><text x="464" y="370">8</text><text x="516" y="370">9</text>
    <text x="568" y="370">10</text><text x="620" y="370">11</text><text x="672" y="370">12</text>
    <text x="724" y="370">13</text><text x="776" y="370">14</text>
    <text x="440" y="392">버킷 수 n</text>
  </g>
  <g font-size="13" fill="#4b5563" text-anchor="end">
    <text x="72" y="345">0</text><text x="72" y="250">5</text><text x="72" y="155">10</text><text x="72" y="98">13</text>
  </g>

  <!-- 대각선: 버킷이 가질 수 있는 최댓값 n-1 -->
  <line x1="100" y1="340" x2="776" y2="93" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="540" y="290" font-size="13" fill="#b45309">점선: 새 버킷 n-1 (가질 수 있는 최댓값)</text>

  <!-- 계단 -->
  <path d="M100,340 H204 V302 H308 V264 H412 V226 H464 V207 H620 V150 H776 V93" fill="none" stroke="#1f2937" stroke-width="2"/>

  <!-- 점프 지점 -->
  <g fill="#2d6a4f">
    <circle cx="204" cy="302" r="6"/><circle cx="308" cy="264" r="6"/><circle cx="412" cy="226" r="6"/>
    <circle cx="464" cy="207" r="6"/><circle cx="620" cy="150" r="6"/><circle cx="776" cy="93" r="6"/>
  </g>
  <g font-size="13" fill="#2d6a4f">
    <text x="212" y="296">2</text><text x="316" y="258">4</text><text x="420" y="220">6</text>
    <text x="472" y="201">7</text><text x="628" y="144">10</text><text x="784" y="88">13</text>
  </g>

  <!-- 설명 상자 -->
  <rect x="100" y="408" width="330" height="50" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="265" y="428" font-size="13" text-anchor="middle" fill="#1f2937">n → n+1 에서 키의 n/(n+1) 은 제자리,</text>
  <text x="265" y="448" font-size="13" text-anchor="middle" fill="#1f2937">1/(n+1) 은 새 버킷 n 으로 옮긴다</text>
  <rect x="450" y="408" width="350" height="50" rx="6" fill="#e8f3ee" stroke="#2d6a4f"/>
  <text x="625" y="428" font-size="13" text-anchor="middle" fill="#2d6a4f">알고리즘은 초록 점만 차례로 계산한다</text>
  <text x="625" y="448" font-size="13" text-anchor="middle" fill="#2d6a4f">다음 점프 j = ⌊(b+1)/r⌋, r 은 0~1 균등 난수</text>
</svg>
