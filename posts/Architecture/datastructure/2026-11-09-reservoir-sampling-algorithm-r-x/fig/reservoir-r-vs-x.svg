<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f"/>
    </marker>
  </defs>

  <text x="24" y="32" font-size="16" font-weight="bold" fill="#222222">저수지 표본추출 — Algorithm R 과 X 가 같은 스트림을 처리하는 방식</text>
  <text x="24" y="54" font-size="13" fill="#555555">처음 n개로 저수지를 채운 뒤, t번째 레코드는 확률 n/t 로 저수지의 한 자리를 바꿔 차지한다</text>

  <!-- 저수지 -->
  <rect x="24" y="150" width="150" height="110" rx="4" fill="#f0f7f3" stroke="#2d6a4f" stroke-width="2"/>
  <text x="99" y="186" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">저수지</text>
  <text x="99" y="210" font-size="13" fill="#222222" text-anchor="middle">C[0] … C[n-1]</text>
  <text x="99" y="234" font-size="13" fill="#555555" text-anchor="middle">처음 n개로 채움</text>

  <!-- Algorithm R -->
  <text x="210" y="96" font-size="14" font-weight="bold" fill="#222222">Algorithm R — 레코드마다 난수 1회</text>
  <g font-size="13" text-anchor="middle">
    <rect x="210" y="108" width="100" height="48" rx="4" fill="#f7f7f7" stroke="#999999"/>
    <text x="260" y="128" fill="#222222">t+1</text>
    <text x="260" y="147" fill="#555555">n/(t+1)</text>
    <rect x="320" y="108" width="100" height="48" rx="4" fill="#f0f7f3" stroke="#2d6a4f" stroke-width="2"/>
    <text x="370" y="128" fill="#2d6a4f">t+2 저장</text>
    <text x="370" y="147" fill="#555555">n/(t+2)</text>
    <rect x="430" y="108" width="100" height="48" rx="4" fill="#f7f7f7" stroke="#999999"/>
    <text x="480" y="128" fill="#222222">t+3</text>
    <text x="480" y="147" fill="#555555">n/(t+3)</text>
    <rect x="540" y="108" width="100" height="48" rx="4" fill="#f7f7f7" stroke="#999999"/>
    <text x="590" y="128" fill="#222222">t+4</text>
    <text x="590" y="147" fill="#555555">n/(t+4)</text>
    <rect x="650" y="108" width="100" height="48" rx="4" fill="#f0f7f3" stroke="#2d6a4f" stroke-width="2"/>
    <text x="700" y="128" fill="#2d6a4f">t+5 저장</text>
    <text x="700" y="147" fill="#555555">n/(t+5)</text>
    <rect x="760" y="108" width="100" height="48" rx="4" fill="#f7f7f7" stroke="#999999"/>
    <text x="810" y="128" fill="#222222">t+6</text>
    <text x="810" y="147" fill="#555555">n/(t+6)</text>
  </g>
  <text x="535" y="178" font-size="13" fill="#555555" text-anchor="middle">칸마다 m = ⌊t·RANDOM()⌋ 를 뽑아 m &lt; n 이면 C[m] 을 바꾼다</text>

  <!-- Algorithm X -->
  <text x="210" y="218" font-size="14" font-weight="bold" fill="#222222">Algorithm X — 저장할 때만 난수 2회</text>
  <path d="M212,262 L212,252 L638,252 L638,262" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <text x="425" y="246" font-size="13" fill="#b45309" text-anchor="middle">난수 V 한 번으로 건너뛸 개수 S = 3 을 정한다</text>
  <g font-size="13" text-anchor="middle">
    <rect x="210" y="268" width="100" height="48" rx="4" fill="#f7f7f7" stroke="#bbbbbb" stroke-dasharray="4 3"/>
    <text x="260" y="297" fill="#999999">t+1 건너뜀</text>
    <rect x="320" y="268" width="100" height="48" rx="4" fill="#f7f7f7" stroke="#bbbbbb" stroke-dasharray="4 3"/>
    <text x="370" y="297" fill="#999999">t+2 건너뜀</text>
    <rect x="430" y="268" width="100" height="48" rx="4" fill="#f7f7f7" stroke="#bbbbbb" stroke-dasharray="4 3"/>
    <text x="480" y="297" fill="#999999">t+3 건너뜀</text>
    <rect x="540" y="268" width="100" height="48" rx="4" fill="#f0f7f3" stroke="#2d6a4f" stroke-width="2"/>
    <text x="590" y="297" fill="#2d6a4f">t+4 저장</text>
    <rect x="650" y="268" width="100" height="48" rx="4" fill="#f7f7f7" stroke="#bbbbbb" stroke-dasharray="4 3"/>
    <text x="700" y="297" fill="#999999">다음 V …</text>
  </g>
  <path d="M590,316 C590,390 110,390 99,266" fill="none" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="350" y="404" font-size="13" fill="#2d6a4f" text-anchor="middle">자리 ⌊n·RANDOM()⌋ 를 골라 바꾼다 (난수 1회)</text>

  <text x="24" y="428" font-size="13" fill="#333333">R: 난수 N − n 회 · 저장 횟수 기댓값 n(H_N − H_n) ≈ n·ln(N/n)</text>
  <text x="24" y="452" font-size="13" fill="#333333">X: 저장 1번에 난수 2회 → 약 2n·ln(N/n) 회 · 읽기는 둘 다 레코드 N 개를 끝까지 지난다</text>
</svg>
