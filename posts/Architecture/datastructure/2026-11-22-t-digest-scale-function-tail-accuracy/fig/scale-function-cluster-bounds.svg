<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="480" fill="#ffffff"/>
  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">척도 함수 k1 이 정하는 클러스터 경계 (δ = 10)</text>

  <!-- axes -->
  <line x1="100" y1="270" x2="790" y2="270" stroke="#444" stroke-width="1.2"/>
  <line x1="100" y1="60" x2="100" y2="270" stroke="#444" stroke-width="1.2"/>
  <text x="440" y="292" text-anchor="middle" font-size="13" fill="#444">분위수 q (0 → 1)</text>
  <text x="60" y="60" font-size="13" fill="#444">k</text>

  <!-- integer k lines -->
  <g stroke="#bbb" stroke-dasharray="4 3" stroke-width="1">
    <line x1="100" y1="250" x2="780" y2="250"/>
    <line x1="100" y1="210" x2="780" y2="210"/>
    <line x1="100" y1="170" x2="780" y2="170"/>
    <line x1="100" y1="130" x2="780" y2="130"/>
    <line x1="100" y1="90" x2="780" y2="90"/>
  </g>
  <g font-size="13" fill="#555" text-anchor="end">
    <text x="92" y="254">−2</text>
    <text x="92" y="214">−1</text>
    <text x="92" y="174">0</text>
    <text x="92" y="134">1</text>
    <text x="92" y="94">2</text>
  </g>

  <!-- k1 curve -->
  <polyline fill="none" stroke="#2d6a4f" stroke-width="2.5"
    points="100,270 106.8,257.2 117,249.8 134,241.3 168,229 202,219.4 236,211 304,196.2 372,182.8 440,170 508,157.2 576,143.8 644,129 678,120.6 712,111 746,98.7 763,90.2 773.2,82.8 780,70"/>
  <text x="130" y="112" font-size="13" fill="#2d6a4f">k1(q) = δ/(2π)·asin(2q − 1)</text>

  <!-- vertical drops at integer k -->
  <g stroke="#2d6a4f" stroke-width="1" stroke-dasharray="2 2">
    <line x1="116.7" y1="250" x2="116.7" y2="270"/>
    <line x1="240.1" y1="210" x2="240.1" y2="270"/>
    <line x1="440" y1="170" x2="440" y2="270"/>
    <line x1="639.9" y1="130" x2="639.9" y2="270"/>
    <line x1="763.3" y1="90" x2="763.3" y2="270"/>
  </g>

  <!-- k1 partition bar -->
  <text x="20" y="342" font-size="13" fill="#2d6a4f" font-weight="bold">k1</text>
  <g stroke="#2d6a4f" stroke-width="1.2">
    <rect x="100" y="322" width="16.7" height="30" fill="#b7dcc8"/>
    <rect x="116.7" y="322" width="123.4" height="30" fill="#e6f2ec"/>
    <rect x="240.1" y="322" width="199.9" height="30" fill="#ffffff"/>
    <rect x="440" y="322" width="199.9" height="30" fill="#ffffff"/>
    <rect x="639.9" y="322" width="123.4" height="30" fill="#e6f2ec"/>
    <rect x="763.3" y="322" width="16.7" height="30" fill="#b7dcc8"/>
  </g>
  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="178" y="342">0.18</text>
    <text x="340" y="342">0.29</text>
    <text x="540" y="342">0.29</text>
    <text x="701" y="342">0.18</text>
  </g>
  <text x="108" y="372" font-size="13" fill="#9d0208" text-anchor="start">↑ 0.025</text>
  <text x="780" y="372" font-size="13" fill="#9d0208" text-anchor="end">0.025 ↑</text>

  <!-- k0 partition bar -->
  <text x="20" y="412" font-size="13" fill="#b45309" font-weight="bold">k0</text>
  <g stroke="#b45309" stroke-width="1.2" fill="#fff4e5">
    <rect x="100" y="392" width="136" height="30"/>
    <rect x="236" y="392" width="136" height="30"/>
    <rect x="372" y="392" width="136" height="30"/>
    <rect x="508" y="392" width="136" height="30"/>
    <rect x="644" y="392" width="136" height="30"/>
  </g>
  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="168" y="412">0.2</text>
    <text x="304" y="412">0.2</text>
    <text x="440" y="412">0.2</text>
    <text x="576" y="412">0.2</text>
    <text x="712" y="412">0.2</text>
  </g>

  <text x="20" y="452" font-size="13" fill="#555">막대 칸 = 클러스터 하나가 차지할 수 있는 최대 q 폭 (k 가 1 늘 때마다 경계 하나)</text>
  <text x="20" y="472" font-size="13" fill="#555">k1 은 양 끝에서 촘촘하고, k0(= δq/2)는 고르다</text>
</svg>
