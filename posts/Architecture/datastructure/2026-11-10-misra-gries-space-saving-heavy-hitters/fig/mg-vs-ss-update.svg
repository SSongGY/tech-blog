<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- arrival -->
  <rect x="330" y="20" width="220" height="40" rx="6" fill="#f1f5f9" stroke="#475569"/>
  <text x="440" y="46" font-size="15" text-anchor="middle" fill="#222">항목 x 도착 (칸 m개)</text>

  <!-- case labels -->
  <line x1="440" y1="60" x2="440" y2="88" stroke="#475569" stroke-width="1.5"/>
  <line x1="150" y1="88" x2="730" y2="88" stroke="#475569" stroke-width="1.5"/>
  <line x1="150" y1="88" x2="150" y2="108" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="88" x2="440" y2="108" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="88" x2="730" y2="108" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="112" width="220" height="64" rx="6" fill="#ecfdf5" stroke="#2d6a4f"/>
  <text x="150" y="138" font-size="14" text-anchor="middle" fill="#222">① x 가 이미 칸에 있다</text>
  <text x="150" y="162" font-size="14" text-anchor="middle" fill="#2d6a4f">그 칸 +1 (두 알고리즘 같음)</text>

  <rect x="330" y="112" width="220" height="64" rx="6" fill="#ecfdf5" stroke="#2d6a4f"/>
  <text x="440" y="138" font-size="14" text-anchor="middle" fill="#222">② 빈 칸이 있다</text>
  <text x="440" y="162" font-size="14" text-anchor="middle" fill="#2d6a4f">새 칸에 x = 1 (같음)</text>

  <rect x="620" y="112" width="220" height="64" rx="6" fill="#fff7ed" stroke="#b45309"/>
  <text x="730" y="138" font-size="14" text-anchor="middle" fill="#222">③ 칸이 다 찼다</text>
  <text x="730" y="162" font-size="14" text-anchor="middle" fill="#b45309">여기서 두 알고리즘이 갈린다</text>

  <line x1="730" y1="176" x2="730" y2="200" stroke="#475569" stroke-width="1.5"/>
  <line x1="230" y1="200" x2="730" y2="200" stroke="#475569" stroke-width="1.5"/>
  <line x1="230" y1="200" x2="230" y2="222" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="200" x2="650" y2="222" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- MG -->
  <rect x="40" y="226" width="380" height="104" rx="6" fill="#f8fafc" stroke="#475569"/>
  <text x="230" y="252" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">Misra-Gries</text>
  <text x="60" y="278" font-size="14" fill="#222">모든 칸 −1, 0 이 된 칸은 비운다</text>
  <text x="60" y="302" font-size="14" fill="#222">x 는 저장하지 않는다</text>
  <text x="60" y="322" font-size="13" fill="#475569">한 번에 m+1 개의 도착이 지워진다</text>

  <!-- SS -->
  <rect x="460" y="226" width="380" height="104" rx="6" fill="#f8fafc" stroke="#475569"/>
  <text x="650" y="252" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">Space-Saving</text>
  <text x="480" y="278" font-size="14" fill="#222">가장 작은 칸(값 min)을 x 에게 넘긴다</text>
  <text x="480" y="302" font-size="14" fill="#222">x 의 값 = min + 1, 오차 ε = min</text>
  <text x="480" y="322" font-size="13" fill="#475569">칸 값의 합은 언제나 n 이다</text>

  <!-- guarantees -->
  <rect x="40" y="356" width="380" height="88" rx="6" fill="#fef2f2" stroke="#9d0208"/>
  <text x="60" y="384" font-size="14" fill="#222">추정값 ≤ 실제 빈도 (과소 추정만)</text>
  <text x="60" y="410" font-size="14" fill="#222">실제 − 추정 ≤ 감소 횟수 d ≤ n/(m+1)</text>
  <text x="60" y="432" font-size="13" fill="#475569">빈도 &gt; n/(m+1) 인 항목은 반드시 남는다</text>

  <rect x="460" y="356" width="380" height="88" rx="6" fill="#fef2f2" stroke="#9d0208"/>
  <text x="480" y="384" font-size="14" fill="#222">추정값 ≥ 실제 빈도 (과대 추정만)</text>
  <text x="480" y="410" font-size="14" fill="#222">추정 − 실제 ≤ ε ≤ min ≤ n/m</text>
  <text x="480" y="432" font-size="13" fill="#475569">빈도 &gt; min 인 항목은 반드시 남는다</text>
</svg>
