<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="440" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">Roaring 비트맵 — 상위 16비트로 나누고, 청크마다 담는 방식을 고른다</text>

  <!-- 32비트 정수 분해 -->
  <rect x="250" y="52" width="190" height="40" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="345" y="77" font-size="14" text-anchor="middle" fill="#1f2937">상위 16비트 = 키</text>
  <rect x="440" y="52" width="190" height="40" fill="#fef3c7" stroke="#b45309"/>
  <text x="535" y="77" font-size="14" text-anchor="middle" fill="#1f2937">하위 16비트 = 값</text>
  <text x="240" y="77" font-size="13" text-anchor="end" fill="#4b5563">32비트 정수 x</text>

  <!-- 1단계 색인 -->
  <text x="40" y="132" font-size="14" font-weight="bold" fill="#1f2937">1단계 색인 (키 정렬 배열)</text>
  <rect x="40" y="145" width="150" height="44" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="115" y="172" font-size="14" text-anchor="middle" fill="#1f2937">0x0000 · 1000개</text>
  <rect x="40" y="235" width="150" height="44" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="115" y="262" font-size="14" text-anchor="middle" fill="#1f2937">0x0001 · 100개</text>
  <rect x="40" y="325" width="150" height="44" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="115" y="352" font-size="14" text-anchor="middle" fill="#1f2937">0x0002 · 32768개</text>

  <!-- 화살표 -->
  <g stroke="#4b5563" stroke-width="1.5">
    <line x1="190" y1="167" x2="250" y2="167"/>
    <line x1="190" y1="257" x2="250" y2="257"/>
    <line x1="190" y1="347" x2="250" y2="347"/>
  </g>
  <g fill="#4b5563">
    <polygon points="248,161 258,167 248,173"/>
    <polygon points="248,251 258,257 248,263"/>
    <polygon points="248,341 258,347 248,353"/>
  </g>

  <!-- 컨테이너 -->
  <rect x="260" y="145" width="370" height="44" fill="#e8f3ee" stroke="#2d6a4f"/>
  <text x="275" y="172" font-size="14" fill="#1f2937">배열 컨테이너 · 0, 62, 124, … 정렬된 16비트</text>
  <rect x="260" y="235" width="370" height="44" fill="#e8f3ee" stroke="#2d6a4f"/>
  <text x="275" y="262" font-size="14" fill="#1f2937">배열 컨테이너 · 0, 1, 2, … 99</text>
  <rect x="260" y="325" width="370" height="44" fill="#fde8e8" stroke="#9d0208"/>
  <text x="275" y="352" font-size="14" fill="#1f2937">비트맵 컨테이너 · 64비트 워드 1024개</text>

  <!-- 크기 -->
  <text x="650" y="172" font-size="14" fill="#2d6a4f">2,000 B (2 B × 1000)</text>
  <text x="650" y="262" font-size="14" fill="#2d6a4f">200 B (2 B × 100)</text>
  <text x="650" y="352" font-size="14" fill="#9d0208">8,192 B 고정</text>

  <!-- 4096 규칙 -->
  <rect x="40" y="395" width="800" height="56" rx="6" fill="#fff7ed" stroke="#b45309"/>
  <text x="440" y="418" font-size="14" font-weight="bold" text-anchor="middle" fill="#b45309">원소 4096개 이하 → 배열, 넘으면 → 비트맵</text>
  <text x="440" y="440" font-size="13" text-anchor="middle" fill="#1f2937">4096 × 16비트 = 65,536비트 = 비트맵 한 장. 경계에서 두 방식의 크기가 같다</text>
</svg>
