<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="430" fill="#ffffff"/>
  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">ARC 의 네 목록 — 캐시는 T1·T2, 유령 목록 B1·B2 는 이름만 기억한다</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 캐시 범위 -->
  <line x1="210" y1="128" x2="670" y2="128" stroke="#2d6a4f" stroke-width="2"/>
  <line x1="210" y1="122" x2="210" y2="134" stroke="#2d6a4f" stroke-width="2"/>
  <line x1="670" y1="122" x2="670" y2="134" stroke="#2d6a4f" stroke-width="2"/>
  <text x="560" y="120" text-anchor="middle" font-size="13" fill="#2d6a4f">캐시 c 칸 = T1 + T2</text>

  <!-- 들어오는 화살표 -->
  <text x="395" y="70" text-anchor="end" font-size="13" fill="#222">처음 보는 페이지</text>
  <line x1="400" y1="62" x2="400" y2="146" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="485" y="70" font-size="13" fill="#222">캐시 적중 (T1·T2 어디서든)</text>
  <line x1="480" y1="62" x2="480" y2="146" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 목록 -->
  <rect x="40" y="150" width="170" height="60" fill="#f4f4f4" stroke="#666" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="125" y="177" text-anchor="middle" font-size="15" font-weight="bold" fill="#555">B1</text>
  <text x="125" y="198" text-anchor="middle" font-size="13" fill="#555">T1 에서 쫓겨난 이름</text>
  <rect x="210" y="150" width="220" height="60" fill="#fff4e5" stroke="#b45309" stroke-width="1.5"/>
  <text x="320" y="177" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">T1</text>
  <text x="320" y="198" text-anchor="middle" font-size="13" fill="#222">최근 한 번 본 페이지</text>
  <rect x="450" y="150" width="220" height="60" fill="#e6f2ec" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="560" y="177" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">T2</text>
  <text x="560" y="198" text-anchor="middle" font-size="13" fill="#222">최근 두 번 이상 본 페이지</text>
  <rect x="670" y="150" width="170" height="60" fill="#f4f4f4" stroke="#666" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="755" y="177" text-anchor="middle" font-size="15" font-weight="bold" fill="#555">B2</text>
  <text x="755" y="198" text-anchor="middle" font-size="13" fill="#555">T2 에서 쫓겨난 이름</text>

  <!-- LRU / MRU 끝 -->
  <text x="214" y="228" font-size="13" fill="#555">LRU</text>
  <text x="426" y="228" text-anchor="end" font-size="13" fill="#555">MRU</text>
  <text x="454" y="228" font-size="13" fill="#555">MRU</text>
  <text x="666" y="228" text-anchor="end" font-size="13" fill="#555">LRU</text>
  <line x1="440" y1="140" x2="440" y2="236" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="440" y="252" text-anchor="middle" font-size="13" fill="#b45309">T1 의 목표 크기 = p</text>

  <!-- 쫓겨남 -->
  <line x1="226" y1="216" x2="196" y2="216" stroke="#9d0208" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="654" y1="216" x2="684" y2="216" stroke="#9d0208" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 유령 적중 -->
  <polyline points="125,212 125,295 535,295 535,214" fill="none" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="140" y="287" font-size="13" fill="#2d6a4f">B1 유령 적중 → T2 로, p += δ1 (T1 을 키운다)</text>
  <polyline points="755,212 755,325 600,325 600,214" fill="none" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="840" y="345" text-anchor="end" font-size="13" fill="#2d6a4f">B2 유령 적중 → T2 로, p −= δ2 (T2 를 키운다)</text>

  <text x="40" y="385" font-size="13" fill="#222">· 자리가 필요하면 REPLACE 가 |T1| 과 p 를 비교해 T1·T2 중 어느 LRU 를 뺄지 정한다 (빨간 화살표)</text>
  <text x="40" y="410" font-size="13" fill="#555">· 한 번만 읽고 버리는 스캔은 T1 에 들어왔다 B1 으로 빠질 뿐 T2 를 밀어내지 않는다</text>
</svg>
