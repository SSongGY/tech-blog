<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#ffffff"/>

  <text x="24" y="32" font-size="16" font-weight="bold" fill="#222222">가장 작은 확률 둘을 합치는 일을 하나가 남을 때까지 되풀이한다</text>
  <text x="24" y="54" font-size="13" fill="#555555">섀넌 1948 예제 A 1/2, B 1/4, C 1/8, D 1/8 — 합친 순서 ① → ② → ③, 왼쪽 가지 0 · 오른쪽 가지 1</text>

  <g stroke="#555555" stroke-width="1.5">
    <line x1="300" y1="104" x2="160" y2="160"/>
    <line x1="300" y1="104" x2="420" y2="160"/>
    <line x1="420" y1="190" x2="300" y2="246"/>
    <line x1="420" y1="190" x2="540" y2="246"/>
    <line x1="540" y1="276" x2="440" y2="332"/>
    <line x1="540" y1="276" x2="640" y2="332"/>
  </g>
  <g font-size="13" fill="#555555">
    <text x="218" y="126">0</text>
    <text x="368" y="126">1</text>
    <text x="348" y="212">0</text>
    <text x="488" y="212">1</text>
    <text x="478" y="298">0</text>
    <text x="598" y="298">1</text>
  </g>

  <!-- 내부 노드 -->
  <g font-size="14" text-anchor="middle">
    <rect x="250" y="74" width="100" height="30" rx="15" fill="#f7f7f7" stroke="#999999"/>
    <text x="300" y="94" fill="#222222">③ 1.0</text>
    <rect x="370" y="160" width="100" height="30" rx="15" fill="#f7f7f7" stroke="#999999"/>
    <text x="420" y="180" fill="#222222">② 0.5</text>
    <rect x="490" y="246" width="100" height="30" rx="15" fill="#f7f7f7" stroke="#999999"/>
    <text x="540" y="266" fill="#222222">① 0.25</text>
  </g>

  <!-- 잎 -->
  <g font-size="14" text-anchor="middle">
    <rect x="100" y="160" width="120" height="44" fill="#f0f7f3" stroke="#2d6a4f" stroke-width="2"/>
    <text x="160" y="178" fill="#2d6a4f">A 0.5</text>
    <text x="160" y="197" font-size="13" fill="#222222">부호 0</text>
    <rect x="240" y="246" width="120" height="44" fill="#f0f7f3" stroke="#2d6a4f" stroke-width="2"/>
    <text x="300" y="264" fill="#2d6a4f">B 0.25</text>
    <text x="300" y="283" font-size="13" fill="#222222">부호 10</text>
    <rect x="380" y="332" width="120" height="44" fill="#f0f7f3" stroke="#2d6a4f" stroke-width="2"/>
    <text x="440" y="350" fill="#2d6a4f">C 0.125</text>
    <text x="440" y="369" font-size="13" fill="#222222">부호 110</text>
    <rect x="580" y="332" width="120" height="44" fill="#f0f7f3" stroke="#2d6a4f" stroke-width="2"/>
    <text x="640" y="350" fill="#2d6a4f">D 0.125</text>
    <text x="640" y="369" font-size="13" fill="#222222">부호 111</text>
  </g>

  <!-- 오른쪽 계산 -->
  <text x="620" y="110" font-size="13" fill="#222222">평균 길이 L</text>
  <text x="620" y="130" font-size="13" fill="#222222">= 0.5×1 + 0.25×2 + 0.125×3×2</text>
  <text x="620" y="150" font-size="13" fill="#2d6a4f">= 1.75 = 엔트로피 H</text>
  <text x="620" y="190" font-size="13" fill="#b45309">확률이 2의 거듭제곱이 아니면</text>
  <text x="620" y="210" font-size="13" fill="#b45309">H ≤ L &lt; H + 1 사이에 놓인다</text>
</svg>
