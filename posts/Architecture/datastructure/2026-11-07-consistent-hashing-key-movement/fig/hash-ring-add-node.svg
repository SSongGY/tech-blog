<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- 왼쪽: 나머지 분배 -->
  <text x="24" y="34" font-size="16" font-weight="bold" fill="#9d0208">나머지 분배 — node = hash % N</text>
  <text x="24" y="58" font-size="13" fill="#555555">N 이 바뀌면 나머지가 거의 전부 바뀐다</text>
  <g font-size="13" fill="#222222">
    <text x="24" y="96">키 해시</text>
    <text x="114" y="96">% 3</text>
    <text x="184" y="96">% 4</text>
    <text x="24" y="124">1001</text><text x="124" y="124">2</text><text x="194" y="124" fill="#9d0208">1</text>
    <text x="24" y="150">1002</text><text x="124" y="150">0</text><text x="194" y="150" fill="#9d0208">2</text>
    <text x="24" y="176">1003</text><text x="124" y="176">1</text><text x="194" y="176" fill="#9d0208">3</text>
    <text x="24" y="202">1004</text><text x="124" y="202">2</text><text x="194" y="202" fill="#9d0208">0</text>
    <text x="24" y="228">1005</text><text x="124" y="228">0</text><text x="194" y="228" fill="#9d0208">1</text>
    <text x="24" y="254">1008</text><text x="124" y="254">0</text><text x="194" y="254" fill="#2d6a4f">0</text>
  </g>
  <text x="24" y="292" font-size="13" fill="#555555">빨강: 노드가 바뀐 키 (6개 중 5개)</text>
  <text x="24" y="312" font-size="13" fill="#555555">옮겨지는 곳도 새 노드만이 아니다</text>

  <line x1="300" y1="24" x2="300" y2="396" stroke="#cccccc" stroke-width="1"/>

  <!-- 오른쪽: 해시 링 -->
  <text x="324" y="34" font-size="16" font-weight="bold" fill="#2d6a4f">해시 링 — 시계 방향 첫 노드가 주인</text>
  <text x="324" y="58" font-size="13" fill="#555555">새 노드 D 는 앞 노드 A 와 자기 사이의 키만 가져간다</text>

  <circle cx="560" cy="230" r="130" fill="none" stroke="#999999" stroke-width="2"/>
  <!-- D 가 가져가는 호 (A 에서 D 까지, B 몫이던 구간 일부) -->
  <path d="M 560 100 A 130 130 0 0 1 680 180" fill="none" stroke="#b45309" stroke-width="7"/>

  <!-- 노드 점 -->
  <circle cx="560" cy="100" r="9" fill="#2d6a4f"/>
  <text x="560" y="86" font-size="14" text-anchor="middle" fill="#2d6a4f">A</text>
  <circle cx="673" cy="295" r="9" fill="#2d6a4f"/>
  <text x="694" y="314" font-size="14" fill="#2d6a4f">B</text>
  <circle cx="447" cy="295" r="9" fill="#2d6a4f"/>
  <text x="418" y="314" font-size="14" fill="#2d6a4f">C</text>
  <circle cx="680" cy="180" r="9" fill="#ffffff" stroke="#b45309" stroke-width="3"/>
  <text x="698" y="176" font-size="14" fill="#b45309">D (추가)</text>

  <!-- 키 점 -->
  <circle cx="625" cy="117" r="5" fill="#b45309"/>
  <text x="634" y="108" font-size="13" fill="#b45309">k1</text>
  <circle cx="689" cy="245" r="5" fill="#555555"/>
  <text x="700" y="250" font-size="13" fill="#555555">k2</text>
  <circle cx="560" cy="360" r="5" fill="#555555"/>
  <text x="560" y="384" font-size="13" text-anchor="middle" fill="#555555">k3</text>
  <circle cx="436" cy="190" r="5" fill="#555555"/>
  <text x="400" y="186" font-size="13" fill="#555555">k4</text>

  <text x="560" y="222" font-size="13" text-anchor="middle" fill="#555555">시계 방향 →</text>
  <text x="560" y="242" font-size="13" text-anchor="middle" fill="#555555">k1: B 에서 D 로</text>
  <text x="560" y="262" font-size="13" text-anchor="middle" fill="#555555">k2·k3·k4: 그대로</text>

  <text x="730" y="370" font-size="13" fill="#555555">가상 노드: 한 노드를</text>
  <text x="730" y="390" font-size="13" fill="#555555">링 위 여러 점에 둔다</text>
</svg>
