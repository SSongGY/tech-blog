<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2d6a4f"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="490" fill="#fbfaf7"/>

  <text x="40" y="34" font-size="18" font-weight="bold" fill="#1b1b1b">부분 키 쿠쿠 해싱 — 지문만으로 대체 버킷을 찾는다</text>
  <text x="40" y="56" font-size="13" fill="#444">(2, 4)-쿠쿠 필터: 항목마다 후보 버킷 2개, 버킷마다 지문 칸 4개. 표에는 원래 항목이 없고 지문만 있다.</text>

  <!-- 왼쪽: 계산 단계 -->
  <rect x="40" y="90" width="290" height="40" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.4"/>
  <text x="185" y="115" font-size="14" text-anchor="middle" fill="#1b1b1b">항목 x</text>

  <rect x="40" y="166" width="135" height="40" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.4"/>
  <text x="107.5" y="191" font-size="14" text-anchor="middle" fill="#1b1b1b">f = 지문(x)</text>
  <rect x="195" y="166" width="135" height="40" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.4"/>
  <text x="262.5" y="191" font-size="14" text-anchor="middle" fill="#1b1b1b">i1 = hash(x)</text>

  <rect x="40" y="242" width="290" height="40" rx="6" fill="#e3f1e8" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="185" y="267" font-size="14" text-anchor="middle" fill="#1d4733">i2 = i1 ⊕ hash(f)</text>

  <rect x="40" y="318" width="290" height="58" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
  <text x="185" y="341" font-size="13" text-anchor="middle" fill="#7c3d06">쫓겨난 지문 g 의 새 자리</text>
  <text x="185" y="363" font-size="14" text-anchor="middle" fill="#7c3d06">j = i ⊕ hash(g)</text>

  <line x1="107.5" y1="130" x2="107.5" y2="164" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="262.5" y1="130" x2="262.5" y2="164" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="107.5" y1="206" x2="107.5" y2="240" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="262.5" y1="206" x2="262.5" y2="240" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- 오른쪽: 버킷 표 -->
  <text x="470" y="80" font-size="13" fill="#444">버킷 표 (칸 하나에 지문 하나)</text>
  <g font-size="13" fill="#333" text-anchor="end">
    <text x="458" y="113">0</text><text x="458" y="155">1 = i1</text><text x="458" y="197">2</text>
    <text x="458" y="239">3</text><text x="458" y="281">4</text><text x="458" y="323">5 = i2</text>
    <text x="458" y="365">6</text><text x="458" y="407">7 = j</text>
  </g>

  <!-- 칸: 빈 칸은 흰색, 찬 칸은 회색 -->
  <g stroke="#b9b4a8" stroke-width="1" fill="#ffffff">
    <rect x="470" y="90" width="80" height="36"/><rect x="554" y="90" width="80" height="36"/><rect x="638" y="90" width="80" height="36"/><rect x="722" y="90" width="80" height="36"/>
    <rect x="470" y="174" width="80" height="36"/><rect x="554" y="174" width="80" height="36"/><rect x="638" y="174" width="80" height="36"/><rect x="722" y="174" width="80" height="36"/>
    <rect x="470" y="216" width="80" height="36"/><rect x="554" y="216" width="80" height="36"/><rect x="638" y="216" width="80" height="36"/><rect x="722" y="216" width="80" height="36"/>
    <rect x="470" y="258" width="80" height="36"/><rect x="554" y="258" width="80" height="36"/><rect x="638" y="258" width="80" height="36"/><rect x="722" y="258" width="80" height="36"/>
    <rect x="470" y="342" width="80" height="36"/><rect x="554" y="342" width="80" height="36"/><rect x="638" y="342" width="80" height="36"/><rect x="722" y="342" width="80" height="36"/>
    <rect x="554" y="384" width="80" height="36"/><rect x="638" y="384" width="80" height="36"/>
  </g>
  <g fill="#ecebe6">
    <rect x="470" y="90" width="80" height="36"/><rect x="554" y="90" width="80" height="36"/>
    <rect x="470" y="174" width="80" height="36"/>
    <rect x="470" y="216" width="80" height="36"/><rect x="554" y="216" width="80" height="36"/><rect x="638" y="216" width="80" height="36"/>
    <rect x="470" y="258" width="80" height="36"/>
    <rect x="470" y="342" width="80" height="36"/><rect x="554" y="342" width="80" height="36"/>
  </g>
  <!-- i1: 가득 참 -->
  <g stroke="#2d6a4f" stroke-width="1.6" fill="#ecebe6">
    <rect x="470" y="132" width="80" height="36"/><rect x="554" y="132" width="80" height="36"/><rect x="638" y="132" width="80" height="36"/><rect x="722" y="132" width="80" height="36"/>
  </g>
  <!-- i2: 가득 차 있어 g 를 쫓아내고 f 가 들어감 -->
  <g stroke="#2d6a4f" stroke-width="1.6" fill="#ecebe6">
    <rect x="470" y="300" width="80" height="36"/><rect x="554" y="300" width="80" height="36"/><rect x="638" y="300" width="80" height="36"/>
  </g>
  <rect x="722" y="300" width="80" height="36" fill="#e3f1e8" stroke="#2d6a4f" stroke-width="2"/>
  <!-- j: 빈 칸에 g -->
  <rect x="470" y="384" width="80" height="36" fill="#ecebe6" stroke="#b9b4a8" stroke-width="1"/>
  <rect x="722" y="384" width="80" height="36" fill="#fdf0d9" stroke="#b45309" stroke-width="2"/>

  <g font-size="13" text-anchor="middle" fill="#333">
    <text x="510" y="113">71</text><text x="594" y="113">0c</text>
    <text x="510" y="155">3a</text><text x="594" y="155">c1</text><text x="678" y="155">7e</text><text x="762" y="155">05</text>
    <text x="510" y="197">d2</text>
    <text x="510" y="239">18</text><text x="594" y="239">a6</text><text x="678" y="239">5f</text>
    <text x="510" y="281">b0</text>
    <text x="510" y="323">9b</text><text x="594" y="323">2d</text><text x="678" y="323">e4</text>
    <text x="510" y="365">63</text><text x="594" y="365">f9</text>
    <text x="510" y="407">41</text>
  </g>
  <text x="762" y="323" font-size="14" font-weight="bold" text-anchor="middle" fill="#2d6a4f">f</text>
  <text x="762" y="407" font-size="14" font-weight="bold" text-anchor="middle" fill="#b45309">g</text>

  <!-- 화살표: i1, i2 로 -->
  <path d="M330,262 C375,262 375,150 404,150" fill="none" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <path d="M330,262 C375,262 375,318 404,318" fill="none" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <!-- 쫓아내기: i2 에 있던 g 가 j 로 -->
  <path d="M802,318 C852,318 852,402 806,402" fill="none" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr-amber)"/>

  <text x="40" y="452" font-size="13" fill="#333">i1·i2 가 모두 차 있으면 한쪽의 지문 g 를 쫓아내고 f 를 넣는다. g 는 j = i ⊕ hash(g) 로 옮긴다 (최대 500번).</text>
  <text x="40" y="474" font-size="13" fill="#333">조회·삭제는 i1 과 i2 두 버킷만 본다. 원래 항목 x 가 없어도 지문과 현재 버킷 번호만으로 계산된다.</text>
</svg>
