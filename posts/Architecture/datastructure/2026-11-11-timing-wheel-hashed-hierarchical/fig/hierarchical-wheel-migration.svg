<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="440" y="28" font-size="17" text-anchor="middle" font-weight="bold" fill="#222">계층 휠 3단(16슬롯 x 3) — 만료 2008틱(0x7D8) 타이머가 내려오는 길</text>

  <!-- column header -->
  <g font-size="13" fill="#475569" text-anchor="middle">
    <text x="200" y="62">0</text><text x="240" y="62">1</text><text x="280" y="62">2</text><text x="320" y="62">3</text>
    <text x="360" y="62">4</text><text x="400" y="62">5</text><text x="440" y="62">6</text><text x="480" y="62">7</text>
    <text x="520" y="62">8</text><text x="560" y="62">9</text><text x="600" y="62">A</text><text x="640" y="62">B</text>
    <text x="680" y="62">C</text><text x="720" y="62">D</text><text x="760" y="62">E</text><text x="800" y="62">F</text>
  </g>

  <!-- level 2 -->
  <text x="24" y="96" font-size="14" font-weight="bold" fill="#222">휠 2</text>
  <text x="24" y="114" font-size="13" fill="#475569">슬롯 = 256틱</text>
  <g fill="#f8fafc" stroke="#cbd5e1">
    <rect x="180" y="80" width="40" height="40"/><rect x="220" y="80" width="40" height="40"/><rect x="260" y="80" width="40" height="40"/><rect x="300" y="80" width="40" height="40"/>
    <rect x="340" y="80" width="40" height="40"/><rect x="380" y="80" width="40" height="40"/><rect x="420" y="80" width="40" height="40"/>
    <rect x="500" y="80" width="40" height="40"/><rect x="540" y="80" width="40" height="40"/><rect x="580" y="80" width="40" height="40"/><rect x="620" y="80" width="40" height="40"/>
    <rect x="660" y="80" width="40" height="40"/><rect x="700" y="80" width="40" height="40"/><rect x="740" y="80" width="40" height="40"/><rect x="780" y="80" width="40" height="40"/>
  </g>
  <rect x="460" y="80" width="40" height="40" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="480" y="105" font-size="13" text-anchor="middle" fill="#222">7</text>
  <text x="440" y="140" font-size="13" text-anchor="end" fill="#222">910틱에 넣음</text>

  <!-- arrow 2 -> 1 -->
  <line x1="480" y1="122" x2="720" y2="196" stroke="#b45309" stroke-width="2"/>
  <polygon points="712,188 724,198 709,199" fill="#b45309"/>
  <text x="600" y="176" font-size="13" text-anchor="end" fill="#222">1792틱(0x700)에 휠 2 슬롯 7 을 비우며 이동</text>

  <!-- level 1 -->
  <text x="24" y="226" font-size="14" font-weight="bold" fill="#222">휠 1</text>
  <text x="24" y="244" font-size="13" fill="#475569">슬롯 = 16틱</text>
  <g fill="#f8fafc" stroke="#cbd5e1">
    <rect x="180" y="210" width="40" height="40"/><rect x="220" y="210" width="40" height="40"/><rect x="260" y="210" width="40" height="40"/><rect x="300" y="210" width="40" height="40"/>
    <rect x="340" y="210" width="40" height="40"/><rect x="380" y="210" width="40" height="40"/><rect x="420" y="210" width="40" height="40"/><rect x="460" y="210" width="40" height="40"/>
    <rect x="500" y="210" width="40" height="40"/><rect x="540" y="210" width="40" height="40"/><rect x="580" y="210" width="40" height="40"/><rect x="620" y="210" width="40" height="40"/>
    <rect x="660" y="210" width="40" height="40"/><rect x="740" y="210" width="40" height="40"/><rect x="780" y="210" width="40" height="40"/>
  </g>
  <rect x="700" y="210" width="40" height="40" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="720" y="235" font-size="13" text-anchor="middle" fill="#222">D</text>

  <!-- arrow 1 -> 0 -->
  <line x1="720" y1="252" x2="528" y2="326" stroke="#b45309" stroke-width="2"/>
  <polygon points="537,319 524,328 532,331" fill="#b45309"/>
  <text x="200" y="282" font-size="13" fill="#222">2000틱(0x7D0)에 휠 1 슬롯 D 를 비우며 이동</text>

  <!-- level 0 -->
  <text x="24" y="356" font-size="14" font-weight="bold" fill="#222">휠 0</text>
  <text x="24" y="374" font-size="13" fill="#475569">슬롯 = 1틱</text>
  <g fill="#f8fafc" stroke="#cbd5e1">
    <rect x="180" y="340" width="40" height="40"/><rect x="220" y="340" width="40" height="40"/><rect x="260" y="340" width="40" height="40"/><rect x="300" y="340" width="40" height="40"/>
    <rect x="340" y="340" width="40" height="40"/><rect x="380" y="340" width="40" height="40"/><rect x="420" y="340" width="40" height="40"/><rect x="460" y="340" width="40" height="40"/>
    <rect x="540" y="340" width="40" height="40"/><rect x="580" y="340" width="40" height="40"/><rect x="620" y="340" width="40" height="40"/>
    <rect x="660" y="340" width="40" height="40"/><rect x="700" y="340" width="40" height="40"/><rect x="740" y="340" width="40" height="40"/><rect x="780" y="340" width="40" height="40"/>
  </g>
  <rect x="500" y="340" width="40" height="40" fill="#ecfdf5" stroke="#2d6a4f" stroke-width="2"/>
  <text x="520" y="365" font-size="13" text-anchor="middle" fill="#222">8</text>
  <text x="430" y="406" font-size="13" text-anchor="middle" fill="#2d6a4f">2008틱(0x7D8)에 만료</text>

  <rect x="40" y="420" width="800" height="36" fill="#fff7ed" stroke="#b45309"/>
  <text x="60" y="443" font-size="13" fill="#222">윗자리 휠은 경계(0x100 배수)에서 한 슬롯을 통째로 비운다 — 그 틱에 일이 몰린다(실측 최대 669)</text>
</svg>
