<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400"
     font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="880" height="400" fill="#f8f9fa"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#495057"/>
    </marker>
    <marker id="arrowg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2d6a4f"/>
    </marker>
    <marker id="arrowr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9d0208"/>
    </marker>
  </defs>

  <text x="20" y="26" font-size="16" font-weight="bold" fill="#212529">넣을 때는 k자리를 1로, 물을 때는 그 k자리를 다 본다 (m=16, k=3)</text>
  <text x="20" y="48" font-size="13" fill="#495057">두 원소를 넣은 뒤의 비트 배열이다. 아래 두 질의가 왜 다르게 끝나는지 자리 번호로 따라갈 수 있다.</text>

  <!-- 넣기 -->
  <rect x="20" y="68" width="150" height="30" rx="4" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="95" y="88" font-size="13" fill="#2d6a4f" text-anchor="middle">넣기: "사과"</text>
  <text x="182" y="88" font-size="13" fill="#495057">해시 3개 → 자리 1, 5, 11</text>

  <rect x="430" y="68" width="150" height="30" rx="4" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="505" y="88" font-size="13" fill="#2d6a4f" text-anchor="middle">넣기: "포도"</text>
  <text x="592" y="88" font-size="13" fill="#495057">해시 3개 → 자리 3, 5, 14</text>

  <line x1="300" y1="100" x2="300" y2="124" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#arrowg)"/>
  <line x1="600" y1="100" x2="600" y2="124" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#arrowg)"/>

  <!-- 비트 배열 -->
  <text x="20" y="146" font-size="13" font-weight="bold" fill="#495057">비트 배열 (자리 번호 0~15)</text>
  <g font-size="13" text-anchor="middle">
    <rect x="20" y="156" width="50" height="38" fill="#ffffff" stroke="#495057"/><text x="45" y="181" fill="#212529">0</text>
    <rect x="70" y="156" width="50" height="38" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/><text x="95" y="181" fill="#2d6a4f" font-weight="bold">1</text>
    <rect x="120" y="156" width="50" height="38" fill="#ffffff" stroke="#495057"/><text x="145" y="181" fill="#212529">0</text>
    <rect x="170" y="156" width="50" height="38" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/><text x="195" y="181" fill="#2d6a4f" font-weight="bold">1</text>
    <rect x="220" y="156" width="50" height="38" fill="#ffffff" stroke="#495057"/><text x="245" y="181" fill="#212529">0</text>
    <rect x="270" y="156" width="50" height="38" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/><text x="295" y="181" fill="#2d6a4f" font-weight="bold">1</text>
    <rect x="320" y="156" width="50" height="38" fill="#ffffff" stroke="#495057"/><text x="345" y="181" fill="#212529">0</text>
    <rect x="370" y="156" width="50" height="38" fill="#ffffff" stroke="#495057"/><text x="395" y="181" fill="#212529">0</text>
    <rect x="420" y="156" width="50" height="38" fill="#ffffff" stroke="#495057"/><text x="445" y="181" fill="#212529">0</text>
    <rect x="470" y="156" width="50" height="38" fill="#ffffff" stroke="#495057"/><text x="495" y="181" fill="#212529">0</text>
    <rect x="520" y="156" width="50" height="38" fill="#ffffff" stroke="#495057"/><text x="545" y="181" fill="#212529">0</text>
    <rect x="570" y="156" width="50" height="38" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/><text x="595" y="181" fill="#2d6a4f" font-weight="bold">1</text>
    <rect x="620" y="156" width="50" height="38" fill="#ffffff" stroke="#495057"/><text x="645" y="181" fill="#212529">0</text>
    <rect x="670" y="156" width="50" height="38" fill="#ffffff" stroke="#495057"/><text x="695" y="181" fill="#212529">0</text>
    <rect x="720" y="156" width="50" height="38" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/><text x="745" y="181" fill="#2d6a4f" font-weight="bold">1</text>
    <rect x="770" y="156" width="50" height="38" fill="#ffffff" stroke="#495057"/><text x="795" y="181" fill="#212529">0</text>
  </g>
  <g font-size="13" fill="#868e96" text-anchor="middle">
    <text x="45" y="210">0</text><text x="95" y="210">1</text><text x="145" y="210">2</text><text x="195" y="210">3</text>
    <text x="245" y="210">4</text><text x="295" y="210">5</text><text x="345" y="210">6</text><text x="395" y="210">7</text>
    <text x="445" y="210">8</text><text x="495" y="210">9</text><text x="545" y="210">10</text><text x="595" y="210">11</text>
    <text x="645" y="210">12</text><text x="695" y="210">13</text><text x="745" y="210">14</text><text x="795" y="210">15</text>
  </g>
  <text x="20" y="232" font-size="13" fill="#495057">자리 5는 두 원소가 같이 썼다. 한 자리가 어느 원소 것인지는 배열에 남지 않는다.</text>

  <!-- 질의 -->
  <line x1="230" y1="240" x2="230" y2="266" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="240" x2="650" y2="266" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="270" width="410" height="110" rx="6" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="36" y="292" font-size="14" font-weight="bold" fill="#2d6a4f">질의: "바나나" → 자리 2, 5, 11</text>
  <text x="36" y="316" font-size="13" fill="#212529">자리 2가 0이다. 한 자리라도 0이면</text>
  <text x="36" y="336" font-size="13" fill="#212529">넣은 적이 없다는 뜻이다.</text>
  <text x="36" y="362" font-size="13" font-weight="bold" fill="#2d6a4f">답: 확실히 없다</text>

  <rect x="450" y="270" width="410" height="110" rx="6" fill="#ffe3e3" stroke="#9d0208" stroke-width="1.5"/>
  <text x="466" y="292" font-size="14" font-weight="bold" fill="#9d0208">질의: "참외" → 자리 1, 3, 14</text>
  <text x="466" y="316" font-size="13" fill="#212529">세 자리가 다 1이다. 그런데 그 1들은</text>
  <text x="466" y="336" font-size="13" fill="#212529">사과와 포도가 남긴 것이다.</text>
  <text x="466" y="362" font-size="13" font-weight="bold" fill="#9d0208">답: 있을 수도 있다 (여기서는 오탐)</text>

  <line x1="195" y1="240" x2="195" y2="268" stroke="#2d6a4f" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="745" y1="240" x2="745" y2="268" stroke="#9d0208" stroke-width="1" stroke-dasharray="3 3"/>
</svg>
