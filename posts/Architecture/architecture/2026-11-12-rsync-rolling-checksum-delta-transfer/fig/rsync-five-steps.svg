<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="450" fill="#ffffff"/>

  <!-- β -->
  <text x="220" y="34" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">β (받는 쪽) — 옛 파일 B</text>
  <g font-size="14" text-anchor="middle">
    <rect x="50" y="50" width="80" height="34" fill="#e6f4ea" stroke="#2d6a4f"/><text x="90" y="72" fill="#111827">B0</text>
    <rect x="135" y="50" width="80" height="34" fill="#e6f4ea" stroke="#2d6a4f"/><text x="175" y="72" fill="#111827">B1</text>
    <rect x="220" y="50" width="80" height="34" fill="#e6f4ea" stroke="#2d6a4f"/><text x="260" y="72" fill="#111827">B2</text>
    <rect x="305" y="50" width="80" height="34" fill="#e6f4ea" stroke="#2d6a4f"/><text x="345" y="72" fill="#111827">B3</text>
  </g>

  <!-- α -->
  <text x="660" y="34" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">α (보내는 쪽) — 새 파일 A</text>
  <g font-size="14" text-anchor="middle">
    <rect x="480" y="50" width="80" height="34" fill="#e6f4ea" stroke="#2d6a4f"/><text x="520" y="72" fill="#111827">B0</text>
    <rect x="562" y="50" width="40" height="34" fill="#fef3c7" stroke="#b45309"/><text x="582" y="72" fill="#b45309">+5</text>
    <rect x="604" y="50" width="80" height="34" fill="#e6f4ea" stroke="#2d6a4f"/><text x="644" y="72" fill="#111827">B1</text>
    <rect x="686" y="50" width="80" height="34" fill="#fde8e8" stroke="#9d0208"/><text x="726" y="72" fill="#9d0208">바뀜</text>
    <rect x="768" y="50" width="80" height="34" fill="#e6f4ea" stroke="#2d6a4f"/><text x="808" y="72" fill="#111827">B3</text>
  </g>
  <path d="M562,92 L562,100 L642,100 L642,92" fill="none" stroke="#1e40af" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="652" y="114" font-size="13" fill="#1e40af">창 = 블록 크기, 1바이트씩 이동</text>

  <!-- ① -->
  <rect x="40" y="130" width="360" height="74" rx="4" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="220" y="156" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">① 겹치지 않는 블록마다 체크섬</text>
  <text x="220" y="180" font-size="13" text-anchor="middle" fill="#111827">약한 32비트(롤링) + 강한 128비트(MD4)</text>
  <text x="220" y="197" font-size="13" text-anchor="middle" fill="#4b5563">블록당 20바이트</text>
  <line x1="220" y1="84" x2="220" y2="128" stroke="#374151" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- ② -->
  <line x1="400" y1="167" x2="468" y2="167" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="434" y="158" font-size="13" text-anchor="middle" fill="#111827">② 전송</text>

  <!-- ③ -->
  <rect x="470" y="130" width="380" height="96" rx="4" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
  <text x="660" y="155" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a8a">③ 모든 위치에서 3단 검사</text>
  <text x="660" y="178" font-size="13" text-anchor="middle" fill="#111827">16비트 해시로 표 조회 → 32비트 약한 값 비교</text>
  <text x="660" y="197" font-size="13" text-anchor="middle" fill="#111827">→ 맞으면 그 위치의 강한 체크섬 비교</text>
  <text x="660" y="216" font-size="13" text-anchor="middle" fill="#4b5563">일치: 블록만큼 건너뜀 · 불일치: 1바이트 밀기</text>

  <!-- ④ -->
  <rect x="470" y="256" width="380" height="64" rx="4" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="660" y="281" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">④ 지시 목록</text>
  <text x="660" y="303" font-size="13" text-anchor="middle" fill="#111827">블록 0 · 리터럴 · 블록 1 · 리터럴 · 블록 3</text>
  <line x1="660" y1="226" x2="660" y2="254" stroke="#374151" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- ⑤ -->
  <line x1="470" y1="288" x2="402" y2="288" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="436" y="279" font-size="13" text-anchor="middle" fill="#111827">전송</text>
  <rect x="40" y="256" width="360" height="64" rx="4" fill="#e6f4ea" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="220" y="281" font-size="14" font-weight="bold" text-anchor="middle" fill="#2d6a4f">⑤ A 를 다시 만든다</text>
  <text x="220" y="303" font-size="13" text-anchor="middle" fill="#111827">B 의 블록 + 받은 리터럴을 차례로 잇는다</text>

  <!-- 점화식 -->
  <rect x="40" y="346" width="810" height="84" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <text x="56" y="370" font-size="13" font-weight="bold" fill="#111827">창을 1바이트 밀 때 — 위치마다 상수 시간에 갱신 (M = 2^16)</text>
  <text x="56" y="394" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#111827">a(k+1, l+1) = (a(k, l) − X_k + X_(l+1)) mod M</text>
  <text x="56" y="416" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#111827">b(k+1, l+1) = (b(k, l) − (l−k+1)·X_k + a(k+1, l+1)) mod M        s = a + 2^16·b</text>
</svg>
