<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="560" fill="#ffffff"/>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">글 목록 한 화면이 DB 에 보내는 문장 — 세 방식과, 그 문장을 세어 반복을 잡는 탐지기</text>

  <!-- 세 열 머리 -->
  <text x="150" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d0208">지연 로딩 — 1 + N</text>
  <text x="440" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">IN 묶음 — 2</text>
  <text x="730" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">JOIN — 1</text>

  <!-- 생명선 -->
  <text x="60" y="94" text-anchor="middle" font-size="13" fill="#495057">앱</text>
  <text x="240" y="94" text-anchor="middle" font-size="13" fill="#495057">DB</text>
  <line x1="60" y1="102" x2="60" y2="300" stroke="#adb5bd" stroke-width="1.5"/>
  <line x1="240" y1="102" x2="240" y2="300" stroke="#adb5bd" stroke-width="1.5"/>

  <text x="350" y="94" text-anchor="middle" font-size="13" fill="#495057">앱</text>
  <text x="530" y="94" text-anchor="middle" font-size="13" fill="#495057">DB</text>
  <line x1="350" y1="102" x2="350" y2="300" stroke="#adb5bd" stroke-width="1.5"/>
  <line x1="530" y1="102" x2="530" y2="300" stroke="#adb5bd" stroke-width="1.5"/>

  <text x="640" y="94" text-anchor="middle" font-size="13" fill="#495057">앱</text>
  <text x="820" y="94" text-anchor="middle" font-size="13" fill="#495057">DB</text>
  <line x1="640" y1="102" x2="640" y2="300" stroke="#adb5bd" stroke-width="1.5"/>
  <line x1="820" y1="102" x2="820" y2="300" stroke="#adb5bd" stroke-width="1.5"/>

  <!-- 지연 로딩 화살표 -->
  <line x1="60" y1="122" x2="232" y2="122" stroke="#495057" stroke-width="1.5"/>
  <polygon points="232,117 240,122 232,127" fill="#495057"/>
  <text x="150" y="116" text-anchor="middle" font-size="13" fill="#1b1b1b">SELECT … FROM post</text>

  <line x1="60" y1="162" x2="232" y2="162" stroke="#9d0208" stroke-width="1.5"/>
  <polygon points="232,157 240,162 232,167" fill="#9d0208"/>
  <text x="150" y="156" text-anchor="middle" font-size="13" fill="#9d0208">author WHERE id = 1</text>
  <line x1="60" y1="198" x2="232" y2="198" stroke="#9d0208" stroke-width="1.5"/>
  <polygon points="232,193 240,198 232,203" fill="#9d0208"/>
  <text x="150" y="192" text-anchor="middle" font-size="13" fill="#9d0208">author WHERE id = 2</text>
  <text x="150" y="230" text-anchor="middle" font-size="13" fill="#9d0208">⋮</text>
  <line x1="60" y1="262" x2="232" y2="262" stroke="#9d0208" stroke-width="1.5"/>
  <polygon points="232,257 240,262 232,267" fill="#9d0208"/>
  <text x="150" y="256" text-anchor="middle" font-size="13" fill="#9d0208">author WHERE id = N</text>
  <text x="150" y="290" text-anchor="middle" font-size="13" fill="#495057">서로 다른 저자마다 한 번</text>

  <!-- IN 묶음 -->
  <line x1="350" y1="122" x2="522" y2="122" stroke="#495057" stroke-width="1.5"/>
  <polygon points="522,117 530,122 522,127" fill="#495057"/>
  <text x="440" y="116" text-anchor="middle" font-size="13" fill="#1b1b1b">SELECT … FROM post</text>
  <line x1="350" y1="162" x2="522" y2="162" stroke="#2d6a4f" stroke-width="1.5"/>
  <polygon points="522,157 530,162 522,167" fill="#2d6a4f"/>
  <text x="440" y="156" text-anchor="middle" font-size="13" fill="#2d6a4f">author id IN (1,…,N)</text>
  <text x="440" y="200" text-anchor="middle" font-size="13" fill="#495057">자리표시자 수 상한이 있다</text>
  <text x="440" y="220" text-anchor="middle" font-size="13" fill="#495057">(SQLite 3.32.0 이후 32766)</text>

  <!-- JOIN -->
  <line x1="640" y1="122" x2="812" y2="122" stroke="#2d6a4f" stroke-width="1.5"/>
  <polygon points="812,117 820,122 812,127" fill="#2d6a4f"/>
  <text x="730" y="116" text-anchor="middle" font-size="13" fill="#2d6a4f">post JOIN author</text>
  <text x="730" y="200" text-anchor="middle" font-size="13" fill="#495057">글 행마다 저자 이름이 반복돼</text>
  <text x="730" y="220" text-anchor="middle" font-size="13" fill="#495057">결과 행이 넓어진다</text>

  <!-- 탐지기 -->
  <text x="20" y="342" font-size="14" font-weight="bold" fill="#495057">탐지기 — 실행된 문장을 모아 값만 다른 것끼리 묶고, 한 모양이 몇 번 나왔는지 본다</text>

  <rect x="20" y="360" width="190" height="84" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="115" y="388" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">trace 콜백</text>
  <text x="115" y="410" text-anchor="middle" font-size="13" fill="#1b1b1b">실제 실행된 문장</text>
  <text x="115" y="430" text-anchor="middle" font-size="13" fill="#495057">… WHERE id = 1</text>

  <rect x="240" y="360" width="190" height="84" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="335" y="388" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">지문</text>
  <text x="335" y="410" text-anchor="middle" font-size="13" fill="#1b1b1b">리터럴 → ?</text>
  <text x="335" y="430" text-anchor="middle" font-size="13" fill="#495057">… WHERE id = ?</text>

  <rect x="460" y="360" width="190" height="84" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="555" y="388" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">지문별 횟수</text>
  <text x="555" y="410" text-anchor="middle" font-size="13" fill="#1b1b1b">Counter</text>
  <text x="555" y="430" text-anchor="middle" font-size="13" fill="#495057">id = ? → N회</text>

  <rect x="680" y="360" width="180" height="84" rx="6" fill="#fff4e6" stroke="#b45309" stroke-width="1.5"/>
  <text x="770" y="388" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">허용치 비교</text>
  <text x="770" y="410" text-anchor="middle" font-size="13" fill="#1b1b1b">N &gt; 2 이면</text>
  <text x="770" y="430" text-anchor="middle" font-size="13" fill="#9d0208">테스트 실패</text>

  <line x1="210" y1="402" x2="232" y2="402" stroke="#495057" stroke-width="1.5"/>
  <polygon points="232,397 240,402 232,407" fill="#495057"/>
  <line x1="430" y1="402" x2="452" y2="402" stroke="#495057" stroke-width="1.5"/>
  <polygon points="452,397 460,402 452,407" fill="#495057"/>
  <line x1="650" y1="402" x2="672" y2="402" stroke="#495057" stroke-width="1.5"/>
  <polygon points="672,397 680,402 672,407" fill="#495057"/>

  <text x="440" y="480" text-anchor="middle" font-size="13" fill="#495057">전체 문장 수가 아니라 "한 모양의 반복 횟수"를 보므로 데이터가 늘어도 허용치를 다시 맞추지 않아도 된다</text>
  <text x="440" y="502" text-anchor="middle" font-size="13" fill="#495057">Python 3.13.5 에서 trace 콜백이 넘긴 문장에는 바인딩 값이 채워져 있었다 — 그래서 지문 단계가 필요하다</text>
  <text x="440" y="530" text-anchor="middle" font-size="13" fill="#495057">지연 로딩은 식별자 맵이 있는 경우(이미 읽은 저자는 다시 읽지 않음)로 그렸다</text>
</svg>
