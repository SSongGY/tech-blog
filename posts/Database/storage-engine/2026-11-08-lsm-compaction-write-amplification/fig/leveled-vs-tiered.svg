<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <text x="24" y="32" font-size="16" font-weight="bold" fill="#222222">같은 memtable 흐름, 다른 압축 규칙</text>
  <text x="24" y="54" font-size="13" fill="#555555">레벨 압축은 레벨마다 정렬 run 을 하나로 유지하고, 크기 계층 압축은 비슷한 크기의 run 이 모일 때까지 둔다</text>

  <!-- 공통 memtable -->
  <rect x="340" y="72" width="200" height="38" rx="5" fill="#f7f7f7" stroke="#555555"/>
  <text x="440" y="96" font-size="14" text-anchor="middle" fill="#222222">memtable (메모리)</text>
  <line x1="400" y1="110" x2="220" y2="146" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="480" y1="110" x2="660" y2="146" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="440" y="134" font-size="13" text-anchor="middle" fill="#555555">가득 차면 정렬해 파일로 내린다(flush)</text>

  <!-- 왼쪽: 레벨 -->
  <text x="220" y="166" font-size="15" font-weight="bold" text-anchor="middle" fill="#9d0208">레벨 압축 (leveled)</text>
  <rect x="40" y="180" width="360" height="50" rx="5" fill="#fff8ec" stroke="#b45309"/>
  <text x="220" y="201" font-size="14" text-anchor="middle" fill="#222222">L0 — 파일끼리 키 범위가 겹친다</text>
  <text x="220" y="221" font-size="13" text-anchor="middle" fill="#555555">파일 수가 트리거에 닿으면 L1 과 전부 합친다</text>
  <line x1="220" y1="230" x2="220" y2="250" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="40" y="252" width="360" height="50" rx="5" fill="#fff4f4" stroke="#9d0208"/>
  <text x="220" y="273" font-size="14" text-anchor="middle" fill="#222222">L1 — 정렬 run 1개 (파일은 겹치지 않음)</text>
  <text x="220" y="293" font-size="13" text-anchor="middle" fill="#555555">목표 크기를 넘으면 파일 하나를 골라 내린다</text>
  <line x1="220" y1="302" x2="220" y2="322" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="40" y="324" width="360" height="50" rx="5" fill="#fff4f4" stroke="#9d0208"/>
  <text x="220" y="345" font-size="14" text-anchor="middle" fill="#222222">L2 — 목표 크기 L1 × 10, 정렬 run 1개</text>
  <text x="220" y="365" font-size="13" text-anchor="middle" fill="#555555">내려온 파일과 키 범위가 겹치는 파일을 다시 쓴다</text>
  <text x="220" y="400" font-size="13" text-anchor="middle" fill="#9d0208">한 번 내려갈 때마다 약 10배를 다시 쓴다</text>
  <text x="220" y="420" font-size="13" text-anchor="middle" fill="#2d6a4f">찾을 run 이 레벨 수만큼으로 적다</text>

  <!-- 오른쪽: 크기 계층 -->
  <text x="660" y="166" font-size="15" font-weight="bold" text-anchor="middle" fill="#2d6a4f">크기 계층 압축 (tiered)</text>
  <rect x="480" y="180" width="360" height="50" rx="5" fill="#f0f7f3" stroke="#2d6a4f"/>
  <text x="660" y="201" font-size="14" text-anchor="middle" fill="#222222">계층 0 — 비슷한 크기의 run 여러 개</text>
  <text x="660" y="221" font-size="13" text-anchor="middle" fill="#555555">run 이 트리거 수만큼 모이면 하나로 합친다</text>
  <line x1="660" y1="230" x2="660" y2="250" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="480" y="252" width="360" height="50" rx="5" fill="#f0f7f3" stroke="#2d6a4f"/>
  <text x="660" y="273" font-size="14" text-anchor="middle" fill="#222222">계층 1 — 합친 run 이 여러 개 쌓인다</text>
  <text x="660" y="293" font-size="13" text-anchor="middle" fill="#555555">기존 run 은 건드리지 않는다</text>
  <line x1="660" y1="302" x2="660" y2="322" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="480" y="324" width="360" height="50" rx="5" fill="#f0f7f3" stroke="#2d6a4f"/>
  <text x="660" y="345" font-size="14" text-anchor="middle" fill="#222222">계층 2 … — 같은 규칙을 반복</text>
  <text x="660" y="365" font-size="13" text-anchor="middle" fill="#555555">한 항목은 계층마다 한 번만 다시 쓰인다</text>
  <text x="660" y="400" font-size="13" text-anchor="middle" fill="#2d6a4f">다시 쓰는 양이 적다</text>
  <text x="660" y="420" font-size="13" text-anchor="middle" fill="#9d0208">찾을 run 이 많고, 큰 병합 중엔 공간이 두 배로 든다</text>

  <text x="24" y="455" font-size="13" fill="#555555">run = 키 순으로 정렬된 파일 묶음 하나. 읽기는 새 run 부터 차례로 확인한다.</text>
</svg>
