<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2933">PSM 프로시저 한 개의 구조와 파라미터 모드 3가지</text>

  <!-- 왼쪽: 블록 구조 -->
  <text x="210" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#495057">블록 구조</text>
  <rect x="40" y="76" width="340" height="56" rx="6" fill="#f8f9fa" stroke="#495057"/>
  <text x="210" y="100" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#1f2933">CREATE OR REPLACE PROCEDURE p (…)</text>
  <text x="210" y="120" text-anchor="middle" font-size="13" fill="#495057">머리 · 파라미터 목록 · IS 또는 AS</text>

  <rect x="40" y="146" width="340" height="66" rx="6" fill="#ffffff" stroke="#495057"/>
  <text x="210" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">선언부 (선택)</text>
  <text x="210" y="194" text-anchor="middle" font-size="13" fill="#1f2933">변수 · 상수 · 타입 · 예외 · 커서를 선언</text>

  <rect x="40" y="226" width="340" height="66" rx="6" fill="#e9f5ee" stroke="#2d6a4f"/>
  <text x="210" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">BEGIN 실행부 (필수)</text>
  <text x="210" y="274" text-anchor="middle" font-size="13" fill="#1f2933">SQL과 제어문 · 문장마다 ;</text>

  <rect x="40" y="306" width="340" height="66" rx="6" fill="#fdecec" stroke="#9d0208"/>
  <text x="210" y="332" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d0208">EXCEPTION 예외부 (선택)</text>
  <text x="210" y="354" text-anchor="middle" font-size="13" fill="#1f2933">실행부에서 예외가 나면 여기로 · OTHERS는 맨 끝</text>

  <rect x="40" y="386" width="340" height="40" rx="6" fill="#f8f9fa" stroke="#495057"/>
  <text x="210" y="411" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#1f2933">END;</text>


  <!-- 오른쪽: 파라미터 모드 -->
  <text x="640" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#495057">파라미터 모드 — 호출한 쪽과 프로시저 사이</text>
  <text x="500" y="96" text-anchor="middle" font-size="13" fill="#495057">호출한 쪽</text>
  <text x="790" y="96" text-anchor="middle" font-size="13" fill="#495057">프로시저 안</text>

  <rect x="440" y="110" width="400" height="86" rx="6" fill="#ffffff" stroke="#495057"/>
  <text x="640" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">IN (기본값)</text>
  <line x1="470" y1="152" x2="800" y2="152" stroke="#2d6a4f" stroke-width="2" marker-end="url(#green)"/>
  <text x="640" y="178" text-anchor="middle" font-size="13" fill="#1f2933">값이 들어가기만 한다 · 안에서 읽기 전용 · DEFAULT 가능</text>

  <rect x="440" y="210" width="400" height="86" rx="6" fill="#ffffff" stroke="#495057"/>
  <text x="640" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">OUT</text>
  <line x1="800" y1="252" x2="470" y2="252" stroke="#2d6a4f" stroke-width="2" marker-end="url(#green)"/>
  <text x="640" y="278" text-anchor="middle" font-size="13" fill="#1f2933">NULL로 시작해 끝날 때 나온다 · 실인수는 변수</text>

  <rect x="440" y="310" width="400" height="96" rx="6" fill="#ffffff" stroke="#495057"/>
  <text x="640" y="334" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">IN OUT</text>
  <line x1="470" y1="350" x2="800" y2="350" stroke="#2d6a4f" stroke-width="2" marker-end="url(#green)"/>
  <line x1="800" y1="364" x2="470" y2="364" stroke="#2d6a4f" stroke-width="2" marker-end="url(#green)"/>
  <text x="640" y="392" text-anchor="middle" font-size="13" fill="#1f2933">들어간 값을 고쳐서 돌려준다 · 실인수는 변수</text>

  <text x="640" y="430" text-anchor="middle" font-size="13" fill="#b45309">OUT · IN OUT에는 DEFAULT를 줄 수 없고 NOCOPY를 붙일 수 있다</text>
  <text x="440" y="458" text-anchor="middle" font-size="13" fill="#495057">파라미터 타입에는 길이를 적지 않는다 — VARCHAR2(10)이 아니라 VARCHAR2 또는 %TYPE</text>
</svg>
