<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="500" fill="#fbfbf8"/>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">파티션 종류별로 행이 들어갈 자리를 정하는 방식</text>
  <text x="30" y="56" font-size="13" fill="#555">Tibero 7.2 · 파티션 이름과 경계는 예제 스크립트 그대로</text>

  <!-- RANGE -->
  <rect x="30" y="76" width="190" height="52" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="125" y="98" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">RANGE (sold_on)</text>
  <text x="125" y="118" font-size="13" text-anchor="middle" fill="#444">값이 경계보다 작은 첫 칸</text>

  <rect x="30" y="140" width="190" height="34" rx="4" fill="#eef5f0" stroke="#2d6a4f"/>
  <text x="42" y="162" font-size="13" fill="#333">P2026Q1  &lt; 04-01</text>
  <rect x="30" y="180" width="190" height="34" rx="4" fill="#eef5f0" stroke="#2d6a4f"/>
  <text x="42" y="202" font-size="13" fill="#333">P2026Q2  &lt; 07-01</text>
  <rect x="30" y="220" width="190" height="34" rx="4" fill="#eef5f0" stroke="#2d6a4f"/>
  <text x="42" y="242" font-size="13" fill="#333">P2026Q3  &lt; 10-01</text>
  <rect x="30" y="260" width="190" height="34" rx="4" fill="#fdf3e4" stroke="#b45309"/>
  <text x="42" y="282" font-size="13" fill="#b45309">PMAX  MAXVALUE · NULL</text>

  <!-- LIST -->
  <rect x="240" y="76" width="190" height="52" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="335" y="98" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">LIST (region)</text>
  <text x="335" y="118" font-size="13" text-anchor="middle" fill="#444">값이 목록에 있는 칸</text>

  <rect x="240" y="140" width="190" height="34" rx="4" fill="#eef5f0" stroke="#2d6a4f"/>
  <text x="252" y="162" font-size="13" fill="#333">SEOUL, GYEONGGI</text>
  <rect x="240" y="180" width="190" height="34" rx="4" fill="#eef5f0" stroke="#2d6a4f"/>
  <text x="252" y="202" font-size="13" fill="#333">BUSAN, ULSAN</text>
  <rect x="240" y="220" width="190" height="34" rx="4" fill="#fdf3e4" stroke="#b45309"/>
  <text x="252" y="242" font-size="13" fill="#b45309">DEFAULT · JEJU · NULL</text>
  <text x="252" y="282" font-size="13" fill="#555">키 컬럼은 하나만</text>

  <!-- HASH -->
  <rect x="450" y="76" width="190" height="52" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="545" y="98" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">HASH (member_id)</text>
  <text x="545" y="118" font-size="13" text-anchor="middle" fill="#444">해시 값이 정하는 칸</text>

  <rect x="450" y="140" width="190" height="34" rx="4" fill="#eef5f0" stroke="#2d6a4f"/>
  <text x="462" y="162" font-size="13" fill="#333">1번  262행</text>
  <rect x="450" y="180" width="190" height="34" rx="4" fill="#eef5f0" stroke="#2d6a4f"/>
  <text x="462" y="202" font-size="13" fill="#333">2번  276행</text>
  <rect x="450" y="220" width="190" height="34" rx="4" fill="#eef5f0" stroke="#2d6a4f"/>
  <text x="462" y="242" font-size="13" fill="#333">3번  227행</text>
  <rect x="450" y="260" width="190" height="34" rx="4" fill="#eef5f0" stroke="#2d6a4f"/>
  <text x="462" y="282" font-size="13" fill="#333">4번  235행</text>

  <!-- COMPOSITE -->
  <rect x="660" y="76" width="190" height="52" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="755" y="98" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">RANGE → LIST</text>
  <text x="755" y="118" font-size="13" text-anchor="middle" fill="#444">날짜로 한 번, 채널로 한 번</text>

  <text x="712" y="160" font-size="13" text-anchor="middle" fill="#333">P2026H1</text>
  <text x="808" y="160" font-size="13" text-anchor="middle" fill="#333">P2026H2</text>
  <rect x="668" y="170" width="88" height="34" rx="4" fill="#eef5f0" stroke="#2d6a4f"/>
  <text x="712" y="192" font-size="13" text-anchor="middle" fill="#333">WEB</text>
  <rect x="764" y="170" width="88" height="34" rx="4" fill="#eef5f0" stroke="#2d6a4f"/>
  <text x="808" y="192" font-size="13" text-anchor="middle" fill="#333">WEB</text>
  <rect x="668" y="210" width="88" height="34" rx="4" fill="#eef5f0" stroke="#2d6a4f"/>
  <text x="712" y="232" font-size="13" text-anchor="middle" fill="#333">STORE</text>
  <rect x="764" y="210" width="88" height="34" rx="4" fill="#eef5f0" stroke="#2d6a4f"/>
  <text x="808" y="232" font-size="13" text-anchor="middle" fill="#333">STORE</text>
  <rect x="668" y="250" width="88" height="34" rx="4" fill="#fdf3e4" stroke="#b45309"/>
  <text x="712" y="272" font-size="13" text-anchor="middle" fill="#b45309">DEFAULT</text>
  <rect x="764" y="250" width="88" height="34" rx="4" fill="#fdf3e4" stroke="#b45309"/>
  <text x="808" y="272" font-size="13" text-anchor="middle" fill="#b45309">DEFAULT</text>

  <!-- bottom -->
  <line x1="30" y1="318" x2="850" y2="318" stroke="#d8d8d2" stroke-width="1"/>

  <rect x="30" y="336" width="400" height="80" rx="6" fill="#fbeaea" stroke="#9d0208" stroke-width="1.5"/>
  <text x="46" y="362" font-size="14" font-weight="bold" fill="#9d0208">들어갈 칸이 없으면 INSERT 가 실패한다</text>
  <text x="46" y="386" font-size="13" fill="#333">RANGE 에 MAXVALUE 가 없을 때 10-01 과 NULL,</text>
  <text x="46" y="406" font-size="13" fill="#333">LIST 에 DEFAULT 가 없을 때 JEJU 와 NULL → TBR-10018</text>

  <rect x="450" y="336" width="400" height="80" rx="6" fill="#fdf3e4" stroke="#b45309" stroke-width="1.5"/>
  <text x="466" y="362" font-size="14" font-weight="bold" fill="#b45309">주황 칸은 나머지를 받는 칸이다</text>
  <text x="466" y="386" font-size="13" fill="#333">받아 주는 대신, 매뉴얼은 이 칸이 있으면</text>
  <text x="466" y="406" font-size="13" fill="#333">ADD PARTITION 을 할 수 없다고 적는다</text>

  <text x="30" y="446" font-size="13" fill="#333">키 값을 바꾸는 UPDATE 가 칸을 옮기게 되면 ROW MOVEMENT 를 켜기 전까지 TBR-10019 로 막힌다.</text>
  <text x="30" y="470" font-size="13" fill="#555">HASH 칸의 행 수는 1~1000 을 4 개로 나눈 실제 결과(통계 수집 후 NUM_ROWS)다.</text>
</svg>
