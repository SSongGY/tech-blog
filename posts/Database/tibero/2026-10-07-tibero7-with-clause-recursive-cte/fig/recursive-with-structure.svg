<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fbfbf8"/>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">Tibero 7 재귀 WITH 절의 구성 — with_clause 의 다섯 요소</text>
  <text x="30" y="56" font-size="13" fill="#555">Tibero 7.2.6 SQL 참조 안내서 SELECT 절의 with_clause · search_clause · cycle_clause 기준</text>

  <!-- WITH 바깥 상자 -->
  <rect x="30" y="76" width="820" height="296" rx="8" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="46" y="100" font-size="14" font-weight="bold" fill="#1b1b1b">WITH  query_name (col_alias, col_alias, …)  AS (</text>

  <!-- 시작 질의 -->
  <rect x="70" y="116" width="340" height="56" rx="6" fill="#e8e8e8" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="240" y="139" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b1b1b">시작 질의</text>
  <text x="240" y="160" font-size="13" text-anchor="middle" fill="#1b1b1b">query_name 을 참조하지 않는다 · 루트 행</text>

  <text x="240" y="196" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">UNION ALL</text>

  <!-- 재귀 질의 -->
  <rect x="70" y="208" width="340" height="56" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="240" y="231" font-size="13" font-weight="bold" text-anchor="middle" fill="#2d6a4f">재귀 질의</text>
  <text x="240" y="252" font-size="13" text-anchor="middle" fill="#1b1b1b">FROM 에서 query_name 을 다시 읽는다</text>

  <!-- 재귀 화살표: 재귀 질의 → query_name -->
  <path d="M 410 236 C 450 236, 450 100, 420 100" fill="none" stroke="#2d6a4f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="428,95 418,100 428,105" fill="#2d6a4f"/>

  <text x="46" y="292" font-size="14" font-weight="bold" fill="#1b1b1b">)</text>

  <!-- SEARCH -->
  <rect x="470" y="116" width="360" height="66" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="650" y="139" font-size="13" font-weight="bold" text-anchor="middle" fill="#b45309">search_clause (선택)</text>
  <text x="650" y="158" font-size="13" text-anchor="middle" fill="#1b1b1b">SEARCH DEPTH | BREADTH FIRST BY col_alias</text>
  <text x="650" y="175" font-size="13" text-anchor="middle" fill="#1b1b1b">SET ordering_column — 정렬용 컬럼이 추가된다</text>

  <!-- CYCLE -->
  <rect x="470" y="198" width="360" height="66" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="650" y="221" font-size="13" font-weight="bold" text-anchor="middle" fill="#b45309">cycle_clause (선택)</text>
  <text x="650" y="240" font-size="13" text-anchor="middle" fill="#1b1b1b">CYCLE col_alias SET mark TO 'Y' DEFAULT 'N'</text>
  <text x="650" y="257" font-size="13" text-anchor="middle" fill="#1b1b1b">순환 행에 표시, 그 가지만 멈춘다 · 없으면 에러</text>

  <!-- 주 질의 -->
  <rect x="70" y="306" width="760" height="48" rx="6" fill="#e8e8e8" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="450" y="327" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b1b1b">주 질의 — SELECT … FROM query_name  ORDER BY ordering_column</text>
  <text x="450" y="345" font-size="13" text-anchor="middle" fill="#555">INSERT · UPDATE · DELETE 의 부질의 자리에도 올 수 있다</text>

  <!-- 하단 비교 -->
  <text x="30" y="404" font-size="13" fill="#1b1b1b">같은 트리를 CONNECT BY 로 쓰면: 시작 질의 = START WITH · 재귀 질의의 조인 = CONNECT BY PRIOR</text>
  <text x="30" y="426" font-size="13" fill="#1b1b1b">SEARCH 절 = 깊이 우선 고정 + ORDER SIBLINGS BY · CYCLE 절 = NOCYCLE + CONNECT_BY_ISCYCLE</text>
  <text x="30" y="452" font-size="13" fill="#555">깊이·경로는 재귀 WITH 에서는 직접 컬럼으로 만들고, CONNECT BY 에서는 LEVEL 과 SYS_CONNECT_BY_PATH 가 준다</text>
</svg>
