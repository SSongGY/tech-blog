<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-label="MERGE 문에서 소스 한 행이 ON 조건과 WHERE, DELETE WHERE를 거쳐 INSERT·UPDATE·삭제·무시로 갈라지는 경로">
  <rect x="0" y="0" width="880" height="470" fill="#fbfbf9"/>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8794"/>
    </marker>
  </defs>

  <text x="440" y="28" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f2933">MERGE — 소스 한 행이 지나가는 갈림길</text>

  <!-- 시작 -->
  <rect x="340" y="46" width="200" height="38" rx="19" fill="#eef2f6" stroke="#3e4c59" stroke-width="1.4"/>
  <text x="440" y="70" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2933">소스(USING) 한 행</text>

  <line x1="440" y1="84" x2="440" y2="104" stroke="#7b8794" stroke-width="1.4" marker-end="url(#a1)"/>

  <!-- ON 판정 -->
  <rect x="320" y="108" width="240" height="40" rx="4" fill="#ffffff" stroke="#3e4c59" stroke-width="1.5"/>
  <text x="440" y="133" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#1f2933">ON (조인 조건)</text>

  <!-- 좌우 분기선 -->
  <line x1="440" y1="148" x2="440" y2="166" stroke="#7b8794" stroke-width="1.4"/>
  <line x1="180" y1="166" x2="700" y2="166" stroke="#7b8794" stroke-width="1.4"/>
  <line x1="180" y1="166" x2="180" y2="192" stroke="#7b8794" stroke-width="1.4" marker-end="url(#a1)"/>
  <line x1="700" y1="166" x2="700" y2="192" stroke="#7b8794" stroke-width="1.4" marker-end="url(#a1)"/>
  <text x="300" y="182" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#52606d">일치하는 타깃 행 있음</text>
  <text x="620" y="182" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#52606d">없음</text>

  <!-- 왼쪽: MATCHED -->
  <rect x="60" y="196" width="240" height="40" rx="4" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.4"/>
  <text x="180" y="221" text-anchor="middle" font-family="monospace" font-size="13" fill="#2d6a4f">WHEN MATCHED UPDATE</text>

  <line x1="180" y1="236" x2="180" y2="256" stroke="#7b8794" stroke-width="1.4" marker-end="url(#a1)"/>

  <rect x="60" y="260" width="240" height="40" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
  <text x="180" y="285" text-anchor="middle" font-family="monospace" font-size="13" fill="#b45309">WHERE (갱신 조건)</text>

  <line x1="180" y1="300" x2="180" y2="316" stroke="#7b8794" stroke-width="1.4"/>
  <line x1="90" y1="316" x2="270" y2="316" stroke="#7b8794" stroke-width="1.4"/>
  <line x1="90" y1="316" x2="90" y2="340" stroke="#7b8794" stroke-width="1.4" marker-end="url(#a1)"/>
  <line x1="270" y1="316" x2="270" y2="398" stroke="#7b8794" stroke-width="1.4" marker-end="url(#a1)"/>
  <text x="52" y="332" font-family="sans-serif" font-size="13" fill="#52606d">참</text>
  <text x="280" y="332" font-family="sans-serif" font-size="13" fill="#52606d">거짓</text>

  <rect x="20" y="344" width="200" height="38" rx="4" fill="#e7f3ec" stroke="#2d6a4f" stroke-width="1.4"/>
  <text x="120" y="368" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2d6a4f">타깃 행을 갱신한다</text>

  <line x1="120" y1="382" x2="120" y2="398" stroke="#7b8794" stroke-width="1.4" marker-end="url(#a1)"/>

  <rect x="20" y="402" width="200" height="38" rx="4" fill="#ffffff" stroke="#9d0208" stroke-width="1.4"/>
  <text x="120" y="420" text-anchor="middle" font-family="monospace" font-size="13" fill="#9d0208">DELETE WHERE</text>
  <text x="120" y="435" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9d0208">참이면 그 행을 지운다</text>

  <rect x="230" y="402" width="180" height="38" rx="4" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.4"/>
  <text x="320" y="420" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#52606d">아무 일도 없다</text>
  <text x="320" y="435" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#52606d">DELETE 판정도 안 한다</text>

  <!-- 오른쪽: NOT MATCHED -->
  <rect x="580" y="196" width="240" height="40" rx="4" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.4"/>
  <text x="700" y="221" text-anchor="middle" font-family="monospace" font-size="13" fill="#2d6a4f">WHEN NOT MATCHED INSERT</text>

  <line x1="700" y1="236" x2="700" y2="256" stroke="#7b8794" stroke-width="1.4" marker-end="url(#a1)"/>

  <rect x="580" y="260" width="240" height="40" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
  <text x="700" y="285" text-anchor="middle" font-family="monospace" font-size="13" fill="#b45309">WHERE (소스 값만 본다)</text>

  <line x1="700" y1="300" x2="700" y2="340" stroke="#7b8794" stroke-width="1.4" marker-end="url(#a1)"/>

  <rect x="600" y="344" width="200" height="38" rx="4" fill="#e7f3ec" stroke="#2d6a4f" stroke-width="1.4"/>
  <text x="700" y="368" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2d6a4f">타깃에 새 행을 넣는다</text>

  <text x="600" y="412" font-family="sans-serif" font-size="13" fill="#9d0208">타깃에만 있고 소스에 없는 행을</text>
  <text x="600" y="430" font-family="sans-serif" font-size="13" fill="#9d0208">다루는 절은 없다</text>
</svg>
