<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <text x="24" y="34" font-size="16" font-weight="bold" fill="#222222">시스템 권한·롤 — WITH ADMIN OPTION</text>
  <rect x="24" y="52" width="170" height="54" rx="6" fill="#f3f3f3" stroke="#555555"/>
  <text x="109" y="76" font-size="14" text-anchor="middle" fill="#222222">SYS</text>
  <text x="109" y="95" font-size="13" text-anchor="middle" fill="#555555">권한 소유</text>
  <rect x="304" y="52" width="170" height="54" rx="6" fill="#ffffff" stroke="#555555"/>
  <text x="389" y="76" font-size="14" text-anchor="middle" fill="#222222">사용자 A</text>
  <text x="389" y="95" font-size="13" text-anchor="middle" fill="#555555">사용 + 재부여 가능</text>
  <rect x="584" y="52" width="170" height="54" rx="6" fill="#f0f7f3" stroke="#2d6a4f"/>
  <text x="669" y="76" font-size="14" text-anchor="middle" fill="#222222">사용자 B</text>
  <text x="669" y="95" font-size="13" text-anchor="middle" fill="#2d6a4f">권한이 남는다</text>
  <line x1="194" y1="79" x2="300" y2="79" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="247" y="70" font-size="13" text-anchor="middle" fill="#555555">GRANT</text>
  <line x1="474" y1="79" x2="580" y2="79" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="527" y="70" font-size="13" text-anchor="middle" fill="#555555">GRANT</text>
  <text x="389" y="132" font-size="13" text-anchor="middle" fill="#b45309">REVOKE … FROM 사용자 A</text>
  <text x="669" y="132" font-size="13" text-anchor="middle" fill="#2d6a4f">연쇄 회수 없음</text>

  <text x="24" y="190" font-size="16" font-weight="bold" fill="#222222">객체 권한 — WITH GRANT OPTION</text>
  <rect x="24" y="208" width="170" height="54" rx="6" fill="#f3f3f3" stroke="#555555"/>
  <text x="109" y="232" font-size="14" text-anchor="middle" fill="#222222">객체 소유자</text>
  <text x="109" y="251" font-size="13" text-anchor="middle" fill="#555555">스키마 주인</text>
  <rect x="304" y="208" width="170" height="54" rx="6" fill="#ffffff" stroke="#555555"/>
  <text x="389" y="232" font-size="14" text-anchor="middle" fill="#222222">사용자 A</text>
  <text x="389" y="251" font-size="13" text-anchor="middle" fill="#555555">사용 + 재부여 가능</text>
  <rect x="584" y="208" width="170" height="54" rx="6" fill="#fff5f5" stroke="#9d0208"/>
  <text x="669" y="232" font-size="14" text-anchor="middle" fill="#222222">사용자 B</text>
  <text x="669" y="251" font-size="13" text-anchor="middle" fill="#9d0208">권한이 같이 사라진다</text>
  <line x1="194" y1="235" x2="300" y2="235" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="247" y="226" font-size="13" text-anchor="middle" fill="#555555">GRANT</text>
  <line x1="474" y1="235" x2="580" y2="235" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="527" y="226" font-size="13" text-anchor="middle" fill="#555555">GRANT</text>
  <text x="389" y="288" font-size="13" text-anchor="middle" fill="#b45309">REVOKE … FROM 사용자 A</text>
  <text x="669" y="288" font-size="13" text-anchor="middle" fill="#9d0208">연쇄 회수</text>

  <text x="24" y="346" font-size="16" font-weight="bold" fill="#222222">롤 — 권한을 묶어 한 번에 준다</text>
  <rect x="24" y="364" width="250" height="54" rx="6" fill="#ffffff" stroke="#555555"/>
  <text x="149" y="388" font-size="14" text-anchor="middle" fill="#222222">시스템 권한 · 객체 권한</text>
  <text x="149" y="407" font-size="13" text-anchor="middle" fill="#555555">다른 롤도 넣을 수 있다</text>
  <rect x="364" y="364" width="170" height="54" rx="6" fill="#f0f7f3" stroke="#2d6a4f"/>
  <text x="449" y="388" font-size="14" text-anchor="middle" fill="#222222">롤</text>
  <text x="449" y="407" font-size="13" text-anchor="middle" fill="#555555">CREATE ROLE</text>
  <rect x="624" y="364" width="170" height="54" rx="6" fill="#ffffff" stroke="#555555"/>
  <text x="709" y="388" font-size="14" text-anchor="middle" fill="#222222">사용자 · PUBLIC</text>
  <text x="709" y="407" font-size="13" text-anchor="middle" fill="#555555">SET ROLE 로 켜고 끈다</text>
  <line x1="274" y1="391" x2="360" y2="391" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="534" y1="391" x2="620" y2="391" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="449" y="446" font-size="13" text-anchor="middle" fill="#b45309">롤에는 WITH GRANT OPTION 으로 객체 권한을 줄 수 없다</text>
</svg>
