<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222222">가. ROWNUM 할당 순서 — 로우 하나마다 되풀이한다</text>

  <rect x="20" y="80" width="170" height="64" rx="6" fill="#f5f5f5" stroke="#888888" stroke-width="1.5"/>
  <text x="105" y="106" text-anchor="middle" font-size="14" fill="#222222">① 질의 수행</text>
  <text x="105" y="126" text-anchor="middle" font-size="13" fill="#555555">결과 로우 하나 생성</text>

  <rect x="230" y="80" width="190" height="64" rx="6" fill="#f5f5f5" stroke="#888888" stroke-width="1.5"/>
  <text x="325" y="106" text-anchor="middle" font-size="14" fill="#222222">② 반환 직전 할당</text>
  <text x="325" y="126" text-anchor="middle" font-size="13" fill="#555555">ROWNUM = 카운터 값</text>

  <rect x="460" y="80" width="150" height="64" rx="6" fill="#fdf3e6" stroke="#b45309" stroke-width="1.5"/>
  <text x="535" y="106" text-anchor="middle" font-size="14" fill="#222222">③ 조건식 적용</text>
  <text x="535" y="126" text-anchor="middle" font-size="13" fill="#b45309">WHERE ROWNUM …</text>

  <rect x="650" y="50" width="210" height="56" rx="6" fill="#e8f3ee" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="755" y="73" text-anchor="middle" font-size="14" fill="#2d6a4f">④ 만족: ROWNUM 확정</text>
  <text x="755" y="93" text-anchor="middle" font-size="13" fill="#555555">카운터 1 증가</text>

  <rect x="650" y="122" width="210" height="56" rx="6" fill="#fdecec" stroke="#9d0208" stroke-width="1.5"/>
  <text x="755" y="145" text-anchor="middle" font-size="14" fill="#9d0208">불만족: 로우 버림</text>
  <text x="755" y="165" text-anchor="middle" font-size="13" fill="#555555">카운터 그대로</text>

  <line x1="190" y1="112" x2="226" y2="112" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="112" x2="456" y2="112" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="610" y1="104" x2="646" y2="80" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="610" y1="120" x2="646" y2="148" stroke="#9d0208" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polyline points="860,178 860,200 105,200 105,148" fill="none" stroke="#444444" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="470" y="194" text-anchor="middle" font-size="13" fill="#555555">다음 로우</text>

  <text x="20" y="232" font-size="13" fill="#9d0208">WHERE ROWNUM &gt; 1 — 첫 로우가 1을 받아 버려지고, 카운터가 그대로라 다음 로우도 1을 받는다. 끝까지 0행.</text>
  <text x="20" y="254" font-size="13" fill="#9d0208">ORDER BY 는 이 할당보다 뒤에 적용되므로, 같은 블록의 ROWNUM &lt;= 5 는 정렬 전 아무 다섯 행을 고른다.</text>

  <text x="20" y="300" font-size="16" font-weight="bold" fill="#222222">나. 정렬된 페이지를 뽑는 세 겹 인라인 뷰 — 2페이지(6~10번째)</text>

  <rect x="20" y="330" width="250" height="84" rx="6" fill="#f5f5f5" stroke="#888888" stroke-width="1.5"/>
  <text x="145" y="356" text-anchor="middle" font-size="14" fill="#222222">안쪽 질의</text>
  <text x="145" y="377" text-anchor="middle" font-size="13" fill="#555555">ORDER BY view_count DESC,</text>
  <text x="145" y="396" text-anchor="middle" font-size="13" fill="#555555">post_id (동점 처리 키)</text>

  <rect x="310" y="330" width="260" height="84" rx="6" fill="#e8f3ee" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="440" y="356" text-anchor="middle" font-size="14" fill="#222222">가운데 질의</text>
  <text x="440" y="377" text-anchor="middle" font-size="13" fill="#555555">정렬된 순서로 ROWNUM AS rn</text>
  <text x="440" y="396" text-anchor="middle" font-size="13" fill="#2d6a4f">WHERE ROWNUM &lt;= 10</text>

  <rect x="610" y="330" width="250" height="84" rx="6" fill="#f5f5f5" stroke="#888888" stroke-width="1.5"/>
  <text x="735" y="356" text-anchor="middle" font-size="14" fill="#222222">바깥 질의</text>
  <text x="735" y="377" text-anchor="middle" font-size="13" fill="#555555">rn 은 보통 컬럼</text>
  <text x="735" y="396" text-anchor="middle" font-size="13" fill="#2d6a4f">WHERE rn &gt; 5</text>

  <line x1="270" y1="372" x2="306" y2="372" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="372" x2="606" y2="372" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="20" y="450" font-size="13" fill="#555555">상한(ROWNUM &lt;= 10)은 ROWNUM 이 붙는 가운데에, 하한(rn &gt; 5)은 이름이 생긴 바깥에 둔다.</text>
  <text x="20" y="472" font-size="13" fill="#555555">하한을 가운데에 두면 가. 의 ROWNUM &gt; 1 과 같은 이유로 0행이 된다.</text>
</svg>
