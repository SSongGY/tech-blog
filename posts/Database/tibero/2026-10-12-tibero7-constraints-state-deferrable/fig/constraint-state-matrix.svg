<svg xmlns="http://www.w3.org/2000/svg" width="880" height="624" viewBox="0 0 880 624" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="624" fill="#fbfbf8"/>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">가. 제약조건 상태 — 새 행을 검사하는가 × 기존 행을 보장하는가</text>
  <text x="30" y="56" font-size="13" fill="#555">Tibero 7.2.6 매뉴얼 기준 · 생성할 때 상태를 안 적으면 ENABLE VALIDATE</text>

  <!-- 열 머리 -->
  <text x="300" y="88" font-size="14" font-weight="bold" fill="#1b1b1b">VALIDATE — 기존 행 검사</text>
  <text x="600" y="88" font-size="14" font-weight="bold" fill="#1b1b1b">NOVALIDATE — 기존 행 안 봄</text>
  <!-- 행 머리 -->
  <text x="30" y="140" font-size="14" font-weight="bold" fill="#1b1b1b">ENABLE</text>
  <text x="30" y="160" font-size="13" fill="#555">새 행 검사</text>
  <text x="30" y="250" font-size="14" font-weight="bold" fill="#1b1b1b">DISABLE</text>
  <text x="30" y="270" font-size="13" fill="#555">새 행 안 봄</text>

  <rect x="150" y="100" width="340" height="96" rx="6" fill="#eef6f1" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="166" y="126" font-size="14" font-weight="bold" fill="#2d6a4f">ENABLE VALIDATE (기본값)</text>
  <text x="166" y="150" font-size="13" fill="#1b1b1b">기존 행과 새 행 모두 만족함을 보장</text>
  <text x="166" y="172" font-size="13" fill="#1b1b1b">기존 위반 행이 있으면 DDL이 실패</text>

  <rect x="510" y="100" width="340" height="96" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="526" y="126" font-size="14" font-weight="bold" fill="#b45309">ENABLE NOVALIDATE</text>
  <text x="526" y="150" font-size="13" fill="#1b1b1b">새 행만 검사, 기존 위반 행은 남는다</text>
  <text x="526" y="172" font-size="13" fill="#1b1b1b">PK·UNIQUE는 인덱스 때문에 VALIDATE로 동작</text>

  <rect x="150" y="210" width="340" height="96" rx="6" fill="#fbeaea" stroke="#9d0208" stroke-width="1.5"/>
  <text x="166" y="236" font-size="14" font-weight="bold" fill="#9d0208">DISABLE VALIDATE</text>
  <text x="166" y="260" font-size="13" fill="#1b1b1b">기존 행은 보장, 새 행은 보장 못 함</text>
  <text x="166" y="282" font-size="13" fill="#1b1b1b">그래서 이 표에 INSERT·UPDATE·DELETE 불가</text>

  <rect x="510" y="210" width="340" height="96" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="526" y="236" font-size="14" font-weight="bold" fill="#1b1b1b">DISABLE NOVALIDATE</text>
  <text x="526" y="260" font-size="13" fill="#1b1b1b">아무것도 검사하지 않는다</text>
  <text x="526" y="282" font-size="13" fill="#1b1b1b">DISABLE만 적으면 이 상태</text>

  <!-- 나. 검사 시점 -->
  <text x="30" y="352" font-size="17" font-weight="bold" fill="#1b1b1b">나. 검사 시점 — Deferrable_option (FOREIGN KEY에는 쓸 수 없다)</text>

  <text x="30" y="398" font-size="14" font-weight="bold" fill="#1b1b1b">즉시 검사</text>
  <text x="30" y="418" font-size="13" fill="#555">기본 · INITIALLY IMMEDIATE</text>
  <line x1="220" y1="404" x2="840" y2="404" stroke="#3b3b3b" stroke-width="1.5"/>
  <g font-size="13" fill="#1b1b1b">
    <rect x="250" y="384" width="120" height="40" rx="4" fill="#ffffff" stroke="#3b3b3b"/>
    <text x="272" y="409">UPDATE ①</text>
    <rect x="450" y="384" width="120" height="40" rx="4" fill="#ffffff" stroke="#3b3b3b"/>
    <text x="472" y="409">UPDATE ②</text>
    <rect x="680" y="384" width="120" height="40" rx="4" fill="#ffffff" stroke="#3b3b3b"/>
    <text x="712" y="409">COMMIT</text>
  </g>
  <g font-size="13" fill="#2d6a4f">
    <text x="262" y="446">문장마다 검사</text>
    <text x="462" y="446">문장마다 검사</text>
  </g>

  <text x="30" y="498" font-size="14" font-weight="bold" fill="#1b1b1b">지연 검사</text>
  <text x="30" y="518" font-size="13" fill="#555">INITIALLY DEFERRED</text>
  <line x1="220" y1="504" x2="840" y2="504" stroke="#3b3b3b" stroke-width="1.5"/>
  <g font-size="13" fill="#1b1b1b">
    <rect x="250" y="484" width="120" height="40" rx="4" fill="#ffffff" stroke="#3b3b3b"/>
    <text x="272" y="509">UPDATE ①</text>
    <rect x="450" y="484" width="120" height="40" rx="4" fill="#ffffff" stroke="#3b3b3b"/>
    <text x="472" y="509">UPDATE ②</text>
    <rect x="680" y="484" width="120" height="40" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <text x="712" y="509">COMMIT</text>
  </g>
  <text x="262" y="546" font-size="13" fill="#555">검사 안 함</text>
  <text x="462" y="546" font-size="13" fill="#555">검사 안 함</text>
  <text x="680" y="546" font-size="13" fill="#b45309">여기서 검사</text>
  <text x="250" y="580" font-size="13" fill="#b45309">COMMIT 때 마지막 COMMIT 이후 바뀐 데이터를 검사하고,</text>
  <text x="250" y="602" font-size="13" fill="#9d0208">통과하지 못하면 데이터가 마지막 COMMIT 시점으로 모두 ROLLBACK된다</text>
</svg>
