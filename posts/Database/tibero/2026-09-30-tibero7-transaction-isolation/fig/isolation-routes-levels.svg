<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fbfbf8"/>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">Tibero 7 격리 수준 — 정하는 두 경로와 매뉴얼이 적은 세 값</text>
  <text x="30" y="56" font-size="13" fill="#555">Tibero 7.2.6 SQL 참조 안내서 기준. 실행 검증 없음</text>

  <!-- 경로 -->
  <text x="30" y="92" font-size="14" font-weight="bold" fill="#1b1b1b">정하는 경로</text>
  <rect x="30" y="104" width="250" height="92" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="155" y="128" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">SET TRANSACTION</text>
  <text x="155" y="150" font-size="13" fill="#333" text-anchor="middle">ISOLATION LEVEL &lt;값&gt;</text>
  <text x="155" y="172" font-size="13" fill="#333" text-anchor="middle">적용: 지금 트랜잭션 하나</text>
  <text x="155" y="214" font-size="13" fill="#b45309" text-anchor="middle">첫 문장이 아니면 TBR-7191</text>

  <rect x="30" y="250" width="250" height="92" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="155" y="274" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">ALTER SESSION</text>
  <text x="155" y="296" font-size="13" fill="#333" text-anchor="middle">SET ISOLATION_LEVEL = &lt;값&gt;</text>
  <text x="155" y="318" font-size="13" fill="#333" text-anchor="middle">적용: 세션이 만드는 트랜잭션</text>

  <!-- 값 -->
  <text x="330" y="92" font-size="14" font-weight="bold" fill="#1b1b1b">값 (3가지)</text>
  <rect x="330" y="104" width="190" height="64" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="425" y="130" font-size="13" font-weight="bold" fill="#2d6a4f" text-anchor="middle">READ COMMITTED</text>
  <text x="425" y="152" font-size="13" fill="#333" text-anchor="middle">기본값</text>

  <rect x="330" y="200" width="190" height="64" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="425" y="226" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">SERIALIZABLE</text>
  <text x="425" y="248" font-size="13" fill="#333" text-anchor="middle">SQL-92 직렬화 모드</text>

  <rect x="330" y="296" width="190" height="64" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="425" y="322" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">READ ONLY</text>
  <text x="425" y="344" font-size="13" fill="#333" text-anchor="middle">SERIALIZABLE과 같게 동작</text>

  <!-- 경로 → 값 -->
  <line x1="280" y1="232" x2="326" y2="232" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="302" y1="136" x2="302" y2="328" stroke="#8a8a84" stroke-width="1.5"/>
  <line x1="302" y1="136" x2="326" y2="136" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="302" y1="328" x2="326" y2="328" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="280" y1="150" x2="302" y2="150" stroke="#8a8a84" stroke-width="1.5"/>
  <line x1="280" y1="296" x2="302" y2="296" stroke="#8a8a84" stroke-width="1.5"/>

  <!-- 매뉴얼이 적은 동작 -->
  <text x="570" y="92" font-size="14" font-weight="bold" fill="#1b1b1b">매뉴얼이 적은 동작</text>
  <rect x="570" y="104" width="290" height="64" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="715" y="130" font-size="13" fill="#333" text-anchor="middle">남이 바꾸고 커밋 안 한 행을 DML로</text>
  <text x="715" y="152" font-size="13" fill="#333" text-anchor="middle">바꾸려 하면 잠금 때문에 대기</text>

  <rect x="570" y="200" width="290" height="64" rx="6" fill="#fbeaea" stroke="#9d0208" stroke-width="1.5"/>
  <text x="715" y="226" font-size="13" fill="#333" text-anchor="middle">시작 후 수정된 데이터에 접근하면</text>
  <text x="715" y="248" font-size="13" font-weight="bold" fill="#9d0208" text-anchor="middle">21012 직렬화 실패 → 재시도</text>

  <rect x="570" y="296" width="290" height="64" rx="6" fill="#fbeaea" stroke="#9d0208" stroke-width="1.5"/>
  <text x="715" y="322" font-size="13" fill="#333" text-anchor="middle">데이터를 바꾸려 하면</text>
  <text x="715" y="344" font-size="13" font-weight="bold" fill="#9d0208" text-anchor="middle">21030 DML 허용 안 됨</text>

  <line x1="520" y1="136" x2="566" y2="136" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="520" y1="232" x2="566" y2="232" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="520" y1="328" x2="566" y2="328" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>

  <line x1="30" y1="386" x2="850" y2="386" stroke="#d0d0c8" stroke-width="1"/>
  <text x="30" y="412" font-size="13" fill="#333">읽기는 MVCC로 다른 트랜잭션과 무관하게 참조하고, 쓰기는 로우 단위 잠금으로 충돌을 줄인다 (관리자 안내서 Isolation 항목).</text>
  <text x="30" y="436" font-size="13" fill="#555">READ UNCOMMITTED · REPEATABLE READ 는 SET TRANSACTION 의 값 목록에 없다.</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a84"/>
    </marker>
  </defs>
</svg>
