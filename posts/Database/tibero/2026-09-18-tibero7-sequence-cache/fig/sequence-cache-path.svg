<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" font-family="system-ui, 'Malgun Gothic', sans-serif">
  <rect x="0" y="0" width="880" height="340" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="700" fill="#1b1b1b">시퀀스 값이 나오는 경로와 번호가 건너뛰는 지점</text>

  <defs>
    <marker id="arrowDark" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2d6a4f"/>
    </marker>
  </defs>

  <rect x="20" y="58" width="210" height="70" rx="5" fill="#f2f8f4" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="125" y="86" font-size="13" text-anchor="middle" fill="#1b1b1b">데이터 사전</text>
  <text x="125" y="108" font-size="12" text-anchor="middle" fill="#555555">시퀀스 정의와 다음 시작값</text>

  <line x1="234" y1="93" x2="294" y2="93" stroke="#2d6a4f" stroke-width="1.8" marker-end="url(#arrowDark)"/>
  <text x="264" y="84" font-size="11.5" text-anchor="middle" fill="#2d6a4f">N개 확보</text>

  <rect x="300" y="58" width="230" height="70" rx="5" fill="#f2f8f4" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="415" y="86" font-size="13" text-anchor="middle" fill="#1b1b1b">시퀀스 캐시 (CACHE N)</text>
  <text x="415" y="108" font-size="12" text-anchor="middle" fill="#555555">소진되면 사전을 다시 갱신</text>

  <line x1="534" y1="93" x2="594" y2="93" stroke="#2d6a4f" stroke-width="1.8" marker-end="url(#arrowDark)"/>
  <text x="564" y="84" font-size="11.5" text-anchor="middle" fill="#2d6a4f">NEXTVAL</text>

  <rect x="600" y="58" width="200" height="70" rx="5" fill="#f2f8f4" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="700" y="86" font-size="13" text-anchor="middle" fill="#1b1b1b">세션</text>
  <text x="700" y="108" font-size="12" text-anchor="middle" fill="#555555">CURRVAL은 이 값을 본다</text>

  <text x="20" y="168" font-size="13" font-weight="600" fill="#9d0208">번호가 건너뛰는 세 가지 경로</text>

  <rect x="20" y="182" width="270" height="86" rx="5" fill="#fbeaea" stroke="#9d0208" stroke-width="1.6"/>
  <text x="36" y="206" font-size="12.5" font-weight="600" fill="#1b1b1b">① 비정상 종료</text>
  <text x="36" y="228" font-size="12" fill="#555555">캐시에 저장된 값이</text>
  <text x="36" y="248" font-size="12" fill="#555555">유실될 수 있다</text>

  <rect x="305" y="182" width="270" height="86" rx="5" fill="#fbeaea" stroke="#9d0208" stroke-width="1.6"/>
  <text x="321" y="206" font-size="12.5" font-weight="600" fill="#1b1b1b">② ALTER SEQUENCE</text>
  <text x="321" y="228" font-size="12" fill="#555555">캐시에 있던 값을</text>
  <text x="321" y="248" font-size="12" fill="#555555">무효화한다</text>

  <rect x="590" y="182" width="270" height="86" rx="5" fill="#fbeaea" stroke="#9d0208" stroke-width="1.6"/>
  <text x="606" y="206" font-size="12.5" font-weight="600" fill="#1b1b1b">③ 클러스터 NOORDER</text>
  <text x="606" y="228" font-size="12" fill="#555555">노드별 캐시를 따로 두어</text>
  <text x="606" y="248" font-size="12" fill="#555555">전체 순서가 달라진다</text>

  <line x1="20" y1="290" x2="860" y2="290" stroke="#dddddd" stroke-width="1"/>
  <text x="20" y="312" font-size="12" fill="#666666">근거: Tibero 7.2.6 SQL 참조 안내서 — CREATE SEQUENCE(CACHE, NOORDER), ALTER SEQUENCE(sequence_attributes)</text>
  <text x="20" y="330" font-size="12" fill="#666666">이 글은 실행 검증 없음. 그림은 매뉴얼에 적힌 동작만 나타낸다.</text>
</svg>
