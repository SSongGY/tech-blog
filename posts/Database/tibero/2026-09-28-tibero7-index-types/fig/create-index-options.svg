<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="500" fill="#fbfbf8"/>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">Tibero 7 CREATE INDEX — 선택지를 "무엇을 바꾸는가"로 묶으면</text>
  <text x="30" y="56" font-size="13" fill="#555">기본 구조는 B-Tree 이고, 아래 선택지가 그 위에 얹힌다 (Tibero 7.2.6 매뉴얼 기준)</text>

  <!-- 가운데 -->
  <rect x="340" y="200" width="200" height="64" rx="8" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
  <text x="440" y="226" font-size="15" font-weight="bold" fill="#1b1b1b" text-anchor="middle">CREATE INDEX</text>
  <text x="440" y="248" font-size="13" fill="#555" text-anchor="middle">기본: B-Tree, ASC</text>

  <!-- 1 키 값 제약 -->
  <rect x="30" y="86" width="250" height="84" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="44" y="110" font-size="14" font-weight="bold" fill="#2d6a4f">키 값에 거는 제약</text>
  <text x="44" y="132" font-size="13" fill="#1b1b1b">UNIQUE — 중복 키 저장 불가</text>
  <text x="44" y="154" font-size="13" fill="#555">PK·UNIQUE 제약은 인덱스를 자동 생성</text>

  <!-- 2 키 구성 -->
  <rect x="600" y="86" width="250" height="84" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="614" y="110" font-size="14" font-weight="bold" fill="#2d6a4f">키를 무엇으로 만드는가</text>
  <text x="614" y="132" font-size="13" fill="#1b1b1b">컬럼 또는 식 (함수 기반)</text>
  <text x="614" y="154" font-size="13" fill="#1b1b1b">컬럼마다 ASC / DESC</text>

  <!-- 3 저장 방식 -->
  <rect x="30" y="300" width="250" height="100" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="44" y="324" font-size="14" font-weight="bold" fill="#b45309">키를 어떻게 저장하는가</text>
  <text x="44" y="346" font-size="13" fill="#1b1b1b">BITMAP — 비트맵 인덱스</text>
  <text x="44" y="368" font-size="13" fill="#1b1b1b">REVERSE — 바이트 역순 저장</text>
  <text x="44" y="390" font-size="13" fill="#1b1b1b">COMPRESS — 프리픽스 압축</text>

  <!-- 4 분할 -->
  <rect x="600" y="300" width="250" height="100" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="614" y="324" font-size="14" font-weight="bold" fill="#1b1b1b">어떻게 나누는가</text>
  <text x="614" y="346" font-size="13" fill="#1b1b1b">LOCAL — 테이블 파티션과 1:1</text>
  <text x="614" y="368" font-size="13" fill="#1b1b1b">GLOBAL — 인덱스 고유 분할</text>
  <text x="614" y="390" font-size="13" fill="#555">GLOBAL 분할 키 = 인덱스 키 앞부분</text>

  <!-- 5 상태 -->
  <rect x="315" y="300" width="250" height="100" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="329" y="324" font-size="14" font-weight="bold" fill="#1b1b1b">상태와 만드는 방식</text>
  <text x="329" y="346" font-size="13" fill="#1b1b1b">INVISIBLE — 고려 대상 제외</text>
  <text x="329" y="368" font-size="13" fill="#1b1b1b">UNUSABLE — REBUILD 전엔 못 씀</text>
  <text x="329" y="390" font-size="13" fill="#555">ONLINE — 만드는 동안 DML 허용</text>

  <line x1="340" y1="214" x2="284" y2="160" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="540" y1="214" x2="596" y2="160" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="360" y1="264" x2="250" y2="296" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="440" y1="264" x2="440" y2="296" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="520" y1="264" x2="630" y2="296" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 막히는 조합 -->
  <text x="30" y="438" font-size="14" font-weight="bold" fill="#9d0208">매뉴얼이 막는다고 적은 조합</text>
  <text x="30" y="462" font-size="13" fill="#9d0208">BITMAP + COMPRESS → TBR-7013</text>
  <text x="360" y="462" font-size="13" fill="#9d0208">DETERMINISTIC 아닌 함수·SYSDATE 를 키로 → TBR-8082</text>
  <text x="30" y="484" font-size="13" fill="#9d0208">같은 키의 인덱스를 또 만들기 → TBR-7124</text>
  <text x="360" y="484" font-size="13" fill="#9d0208">함수 기반 인덱스에 REBUILD ONLINE REVERSE → 사용 불가</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a84"/>
    </marker>
  </defs>
</svg>
