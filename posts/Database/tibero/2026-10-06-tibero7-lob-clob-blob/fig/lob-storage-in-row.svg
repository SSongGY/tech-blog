<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fbfbf8"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b3b3b"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f"/>
    </marker>
    <marker id="arr-amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">LOB 값이 어디에 저장되는가 — 저장 옵션과 값의 크기</text>
  <text x="30" y="56" font-size="13" fill="#555">Tibero 7.2.6 매뉴얼 기준 · CLOB · NCLOB · BLOB 공통</text>

  <!-- 시작 -->
  <rect x="30" y="180" width="170" height="80" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="115" y="212" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">LOB 컬럼에</text>
  <text x="115" y="234" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">값을 넣는다</text>

  <!-- ENABLE 갈래 -->
  <line x1="200" y1="205" x2="266" y2="130" stroke="#3b3b3b" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="270" y="84" width="230" height="86" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="385" y="110" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">ENABLE STORAGE IN ROW</text>
  <text x="385" y="132" font-size="13" fill="#555" text-anchor="middle">기본값</text>
  <text x="385" y="154" font-size="13" fill="#555" text-anchor="middle">값의 크기를 본다</text>

  <!-- DISABLE 갈래 -->
  <line x1="200" y1="240" x2="266" y2="330" stroke="#3b3b3b" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="270" y="296" width="230" height="86" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="385" y="322" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">DISABLE STORAGE IN ROW</text>
  <text x="385" y="344" font-size="13" fill="#555" text-anchor="middle">LOB (컬럼) STORE AS … 로 지정</text>
  <text x="385" y="366" font-size="13" fill="#555" text-anchor="middle">크기와 관계없이</text>

  <!-- 로우 안 -->
  <line x1="500" y1="112" x2="626" y2="112" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <text x="564" y="102" font-size="13" fill="#2d6a4f" text-anchor="middle">약 4000바이트 이하</text>
  <rect x="630" y="76" width="220" height="72" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="740" y="104" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">로우 안에 함께 저장</text>
  <text x="740" y="128" font-size="13" fill="#2d6a4f" text-anchor="middle">LOB 세그먼트 없이</text>

  <!-- LOB 세그먼트 -->
  <line x1="500" y1="150" x2="626" y2="268" stroke="#b45309" stroke-width="1.6" marker-end="url(#arr-amber)"/>
  <text x="590" y="186" font-size="13" fill="#b45309">그보다 크면</text>
  <line x1="500" y1="339" x2="626" y2="300" stroke="#b45309" stroke-width="1.6" marker-end="url(#arr-amber)"/>
  <rect x="630" y="240" width="220" height="96" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="740" y="266" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">LOB 세그먼트에 저장</text>
  <text x="740" y="290" font-size="13" fill="#b45309" text-anchor="middle">로우에는 그 위치를</text>
  <text x="740" y="310" font-size="13" fill="#b45309" text-anchor="middle">가리키는 포인터만</text>

  <rect x="30" y="404" width="820" height="46" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.2"/>
  <text x="46" y="432" font-size="13" fill="#333">세그먼트의 테이블스페이스는 STORE AS (TABLESPACE …) 로 정한다. 세그먼트가 생기는 시점은 매뉴얼에 없다 (실습 2·4번).</text>
</svg>
