<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fbfbf8"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a55"/>
    </marker>
  </defs>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">외부 테이블이 파일에 닿기까지 — 객체 둘과 파일 하나</text>
  <text x="30" y="56" font-size="13" fill="#555">Tibero 7.2.6 매뉴얼의 CREATE DIRECTORY·CREATE TABLE(external_table_clause) 구성요소</text>

  <!-- 외부 테이블 정의 -->
  <rect x="30" y="80" width="430" height="300" rx="8" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="50" y="106" font-size="15" font-weight="bold" fill="#1b1b1b">외부 테이블 ext_member</text>
  <text x="50" y="126" font-size="13" fill="#555">CREATE TABLE … ORGANIZATION EXTERNAL ( … )</text>

  <rect x="50" y="140" width="390" height="46" rx="5" fill="#f4f4f0" stroke="#8a8a84" stroke-width="1"/>
  <text x="66" y="160" font-size="13" font-weight="bold" fill="#1b1b1b">컬럼 정의</text>
  <text x="66" y="178" font-size="13" fill="#333">이것 말고 다른 속성은 지정할 수 없다</text>

  <rect x="50" y="196" width="390" height="46" rx="5" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.2"/>
  <text x="66" y="216" font-size="13" font-weight="bold" fill="#2d6a4f">DEFAULT DIRECTORY 디렉터리 객체</text>
  <text x="66" y="234" font-size="13" fill="#333">파일을 찾을 기본 디렉터리</text>

  <rect x="50" y="252" width="390" height="62" rx="5" fill="#ffffff" stroke="#8a8a84" stroke-width="1"/>
  <text x="66" y="272" font-size="13" font-weight="bold" fill="#1b1b1b">ACCESS PARAMETERS ( … )</text>
  <text x="66" y="290" font-size="13" fill="#333">파일을 읽는 방법 — tbLoader 제어 파일 형식</text>
  <text x="66" y="306" font-size="13" fill="#555">필드 구분자·이스케이프·줄 끝·건너뛸 줄 수</text>

  <rect x="50" y="324" width="390" height="46" rx="5" fill="#ffffff" stroke="#8a8a84" stroke-width="1"/>
  <text x="66" y="344" font-size="13" font-weight="bold" fill="#1b1b1b">LOCATION ('members.csv')</text>
  <text x="66" y="362" font-size="13" fill="#333">디렉터리부터 파일까지의 경로와 파일 이름</text>

  <!-- 디렉터리 객체 -->
  <rect x="540" y="160" width="300" height="88" rx="8" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="560" y="186" font-size="15" font-weight="bold" fill="#2d6a4f">디렉터리 객체 blog_ext_dir</text>
  <text x="560" y="208" font-size="13" fill="#333">CREATE DIRECTORY … AS '경로 문자열'</text>
  <text x="560" y="228" font-size="13" fill="#b45309">경로의 존재·접근 권한은 검사하지 않는다</text>

  <line x1="440" y1="219" x2="536" y2="206" stroke="#5a5a55" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 파일 -->
  <rect x="540" y="300" width="300" height="70" rx="8" fill="#f4f4f0" stroke="#5a5a55" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="560" y="326" font-size="15" font-weight="bold" fill="#1b1b1b">파일 members.csv</text>
  <text x="560" y="348" font-size="13" fill="#333">DB 밖에 있는 텍스트 파일</text>

  <line x1="690" y1="248" x2="690" y2="296" stroke="#5a5a55" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="700" y="278" font-size="13" fill="#555">경로 + 파일 이름</text>
  <line x1="440" y1="347" x2="536" y2="337" stroke="#5a5a55" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <line x1="30" y1="402" x2="850" y2="402" stroke="#d0d0c8" stroke-width="1"/>
  <text x="30" y="428" font-size="13" fill="#333">외부 테이블은 읽기 전용 테이블로 쓰인다. 디렉터리를 만들면 만든 사용자에게 READ·WRITE 특권이 자동으로 붙는다</text>
  <text x="30" y="452" font-size="13" fill="#333">사전 뷰: ALL_DIRECTORIES·DBA_DIRECTORIES / USER·ALL·DBA_EXTERNAL_TABLES / USER·ALL·DBA_EXTERNAL_LOCATIONS</text>
</svg>
