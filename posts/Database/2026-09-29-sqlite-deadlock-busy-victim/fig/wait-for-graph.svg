<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9d0208"/>
    </marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2933">둘 다 읽은 뒤 둘 다 쓰려 할 때 — 누가 무엇을 기다리는가</text>

  <!-- 왼쪽: rollback 저널 -->
  <rect x="20" y="56" width="410" height="296" rx="8" fill="#f8f9fa" stroke="#adb5bd"/>
  <text x="225" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933">rollback 저널 — 대기 그래프에 순환이 생긴다</text>

  <rect x="50" y="104" width="150" height="92" rx="6" fill="#ffffff" stroke="#495057"/>
  <text x="125" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">연결 A</text>
  <text x="125" y="152" text-anchor="middle" font-size="13" fill="#1f2933">보유: RESERVED</text>
  <text x="125" y="176" text-anchor="middle" font-size="13" fill="#1f2933">요청: EXCLUSIVE</text>

  <rect x="250" y="104" width="150" height="92" rx="6" fill="#ffffff" stroke="#495057"/>
  <text x="325" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">연결 B</text>
  <text x="325" y="152" text-anchor="middle" font-size="13" fill="#1f2933">보유: SHARED</text>
  <text x="325" y="176" text-anchor="middle" font-size="13" fill="#1f2933">요청: RESERVED</text>

  <line x1="202" y1="132" x2="246" y2="132" stroke="#9d0208" stroke-width="2" marker-end="url(#red)"/>
  <text x="225" y="124" text-anchor="middle" font-size="13" fill="#9d0208">①</text>
  <line x1="248" y1="170" x2="204" y2="170" stroke="#9d0208" stroke-width="2" marker-end="url(#red)"/>
  <text x="225" y="190" text-anchor="middle" font-size="13" fill="#9d0208">②</text>

  <text x="40" y="232" font-size="13" fill="#1f2933">① A의 커밋은 B의 SHARED가 풀려야 진행된다</text>
  <text x="40" y="256" font-size="13" fill="#1f2933">② B의 UPDATE는 A의 RESERVED가 풀려야 진행된다</text>
  <text x="40" y="284" font-size="13" font-weight="bold" fill="#9d0208">순환: 기다려도 어느 쪽도 풀리지 않는다</text>
  <text x="40" y="310" font-size="13" fill="#1f2933">B의 ② 요청에 즉시 SQLITE_BUSY (0.000초)</text>
  <text x="40" y="334" font-size="13" fill="#1f2933">B가 롤백하기 전에는 A의 커밋도 1.2초 뒤 실패</text>

  <!-- 오른쪽: WAL -->
  <rect x="450" y="56" width="410" height="296" rx="8" fill="#f8f9fa" stroke="#adb5bd"/>
  <text x="655" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933">WAL — 순환은 없지만 B는 쓸 수 없다</text>

  <rect x="480" y="104" width="150" height="92" rx="6" fill="#ffffff" stroke="#495057"/>
  <text x="555" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">연결 A</text>
  <text x="555" y="152" text-anchor="middle" font-size="13" fill="#1f2933">보유: 쓰기 잠금</text>
  <text x="555" y="176" text-anchor="middle" font-size="13" fill="#1f2933">커밋: 대기 없음</text>

  <rect x="680" y="104" width="150" height="92" rx="6" fill="#ffffff" stroke="#495057"/>
  <text x="755" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">연결 B</text>
  <text x="755" y="152" text-anchor="middle" font-size="13" fill="#1f2933">보유: 읽기 스냅샷</text>
  <text x="755" y="176" text-anchor="middle" font-size="13" fill="#1f2933">요청: 쓰기 잠금</text>

  <line x1="678" y1="150" x2="634" y2="150" stroke="#b45309" stroke-width="2" marker-end="url(#amber)"/>
  <text x="655" y="142" text-anchor="middle" font-size="13" fill="#b45309">③</text>

  <text x="470" y="232" font-size="13" fill="#1f2933">③ B의 UPDATE는 A의 쓰기 잠금에 막힌다</text>
  <text x="470" y="256" font-size="13" fill="#1f2933">A의 커밋은 B의 읽기를 기다리지 않는다</text>
  <text x="470" y="284" font-size="13" font-weight="bold" fill="#2d6a4f">순환 없음: A는 0.001초에 커밋</text>
  <text x="470" y="310" font-size="13" fill="#1f2933">B의 ③ 요청에 즉시 SQLITE_BUSY (0.000초)</text>
  <text x="470" y="334" font-size="13" fill="#1f2933">A 커밋 뒤 다시 써도 SQLITE_BUSY_SNAPSHOT</text>

  <!-- 아래: 공통 규칙 -->
  <rect x="20" y="372" width="840" height="80" rx="8" fill="#fff8eb" stroke="#b45309"/>
  <text x="440" y="400" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">읽기 트랜잭션을 쥔 채 쓰기로 올리려던 쪽이 busy handler 없이 곧바로 SQLITE_BUSY를 받는다</text>
  <text x="440" y="428" text-anchor="middle" font-size="13" fill="#1f2933">그 트랜잭션은 열린 채 남는다. 롤백은 애플리케이션의 몫이다</text>
</svg>
