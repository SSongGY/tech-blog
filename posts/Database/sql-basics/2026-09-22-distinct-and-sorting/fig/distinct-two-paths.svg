<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392" role="img" aria-label="DISTINCT가 중복을 지우는 두 경로: 임시 B-Tree를 쓰는 경로와 인덱스 순서를 쓰는 경로">
  <rect x="0" y="0" width="880" height="392" fill="#fbfbf9"/>

  <text x="440" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f2933">DISTINCT가 중복을 지우는 두 경로</text>
  <text x="440" y="50" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#52606d">SELECT DISTINCT team FROM employee</text>

  <line x1="440" y1="66" x2="440" y2="368" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- 왼쪽: 인덱스 없음 -->
  <rect x="85" y="70" width="300" height="32" rx="4" fill="#fbe9e9" stroke="#9d0208" stroke-width="1.5"/>
  <text x="235" y="91" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#9d0208">team 인덱스 없음</text>

  <rect x="85" y="124" width="300" height="56" rx="4" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/>
  <text x="235" y="146" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2933">테이블 전체를 훑는다</text>
  <text x="235" y="166" text-anchor="middle" font-family="monospace" font-size="13" fill="#52606d">SCAN employee</text>

  <rect x="85" y="204" width="300" height="56" rx="4" fill="#ffffff" stroke="#9d0208" stroke-width="1.2"/>
  <text x="235" y="226" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2933">임시 B-Tree에 행을 담는다</text>
  <text x="235" y="246" text-anchor="middle" font-family="monospace" font-size="13" fill="#9d0208">USE TEMP B-TREE FOR DISTINCT</text>

  <rect x="85" y="284" width="300" height="56" rx="4" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/>
  <text x="235" y="306" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2933">담는 동안 같은 값이 모인다</text>
  <text x="235" y="326" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2933">그래서 중복이 사라진다</text>

  <text x="235" y="362" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9d0208">자료구조를 하나 더 만든다</text>

  <!-- 오른쪽: 인덱스 있음 -->
  <rect x="495" y="70" width="300" height="32" rx="4" fill="#e7f3ec" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="645" y="91" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2d6a4f">team 인덱스 있음</text>

  <rect x="495" y="124" width="300" height="56" rx="4" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/>
  <text x="645" y="146" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2933">인덱스를 순서대로 훑는다</text>
  <text x="645" y="166" text-anchor="middle" font-family="monospace" font-size="13" fill="#52606d">USING COVERING INDEX</text>

  <rect x="495" y="204" width="300" height="56" rx="4" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.2"/>
  <text x="645" y="226" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2933">같은 값이 이미 이웃해 있다</text>
  <text x="645" y="246" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2d6a4f">개발 · 개발 · 개발 · 영업 · 영업 · …</text>

  <rect x="495" y="284" width="300" height="56" rx="4" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/>
  <text x="645" y="306" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2933">바로 앞 행과만 비교해</text>
  <text x="645" y="326" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2933">같으면 버린다</text>

  <text x="645" y="362" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2d6a4f">추가 자료구조가 없다</text>

  <!-- 화살표 -->
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8794"/>
    </marker>
  </defs>
  <line x1="235" y1="102" x2="235" y2="120" stroke="#7b8794" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="235" y1="180" x2="235" y2="200" stroke="#7b8794" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="235" y1="260" x2="235" y2="280" stroke="#7b8794" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="645" y1="102" x2="645" y2="120" stroke="#7b8794" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="645" y1="180" x2="645" y2="200" stroke="#7b8794" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="645" y1="260" x2="645" y2="280" stroke="#7b8794" stroke-width="1.4" marker-end="url(#arw)"/>
</svg>
