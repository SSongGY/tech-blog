<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="440" fill="#fbfbf8"/>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">두 표를 합칠 때 행이 지나가는 길 — UNION ALL과 UNION</text>
  <text x="30" y="56" font-size="13" fill="#555">EXPLAIN QUERY PLAN 의 UNION ALL / UNION USING TEMP B-TREE 줄이 가리키는 처리</text>

  <!-- UNION ALL -->
  <text x="30" y="92" font-size="15" font-weight="bold" fill="#2d6a4f">가. UNION ALL</text>
  <rect x="30" y="106" width="200" height="50" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="130" y="136" font-size="13" fill="#1b1b1b" text-anchor="middle">SCAN online_member</text>
  <rect x="30" y="170" width="200" height="50" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="130" y="200" font-size="13" fill="#1b1b1b" text-anchor="middle">SCAN store_member</text>

  <rect x="620" y="136" width="230" height="56" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="735" y="160" font-size="13" font-weight="bold" fill="#2d6a4f" text-anchor="middle">결과로 바로 내보낸다</text>
  <text x="735" y="180" font-size="13" fill="#333" text-anchor="middle">읽은 순서 그대로, 비교 없음</text>

  <line x1="230" y1="131" x2="616" y2="156" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#arg)"/>
  <line x1="230" y1="195" x2="616" y2="174" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#arg)"/>

  <!-- UNION -->
  <text x="30" y="262" font-size="15" font-weight="bold" fill="#9d0208">나. UNION</text>
  <rect x="30" y="276" width="200" height="50" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="130" y="306" font-size="13" fill="#1b1b1b" text-anchor="middle">SCAN online_member</text>
  <rect x="30" y="340" width="200" height="50" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="130" y="370" font-size="13" fill="#1b1b1b" text-anchor="middle">SCAN store_member</text>

  <rect x="320" y="290" width="230" height="86" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="435" y="314" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">임시 B-Tree</text>
  <text x="435" y="336" font-size="13" fill="#333" text-anchor="middle">행 전체를 키로 넣는다</text>
  <text x="435" y="358" font-size="13" fill="#333" text-anchor="middle">같은 키가 있으면 버린다</text>

  <rect x="620" y="306" width="230" height="56" rx="6" fill="#fbeaea" stroke="#9d0208" stroke-width="1.5"/>
  <text x="735" y="330" font-size="13" font-weight="bold" fill="#9d0208" text-anchor="middle">B-Tree를 처음부터 읽어</text>
  <text x="735" y="350" font-size="13" fill="#333" text-anchor="middle">결과로 내보낸다</text>

  <line x1="230" y1="301" x2="316" y2="318" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="230" y1="365" x2="316" y2="350" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="550" y1="334" x2="616" y2="334" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="30" y="418" font-size="13" fill="#333">UNION은 두 표의 모든 행을 한 번씩 B-Tree에 넣어 보는 일이 더해진다. 지울 중복이 없어도 이 비용은 그대로 든다.</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a84"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6a4f"/>
    </marker>
  </defs>
</svg>
