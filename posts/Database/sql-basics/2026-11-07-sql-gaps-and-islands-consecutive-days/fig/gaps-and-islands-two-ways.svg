<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>

  <text x="440" y="30" font-size="17" font-weight="bold" text-anchor="middle" fill="#222222">kim 의 출석 6일을 연속 구간으로 묶는 두 가지 방법</text>

  <!-- 행 이름 -->
  <text x="30" y="78" font-size="14" font-weight="bold" fill="#222222">attend_date</text>
  <text x="30" y="118" font-size="14" fill="#333333">① 행 번호 rn</text>
  <text x="30" y="158" font-size="14" fill="#333333">① julianday − rn</text>
  <text x="30" y="298" font-size="14" fill="#333333">② 앞 행과 차이</text>
  <text x="30" y="338" font-size="14" fill="#333333">② 시작 표시</text>
  <text x="30" y="378" font-size="14" fill="#333333">② 표시 누적합</text>

  <!-- 날짜 칸 (열 중심 x = 225 + 110*i) -->
  <g font-size="13" text-anchor="middle" fill="#222222">
    <text x="225" y="78">10-28</text>
    <text x="335" y="78">10-29</text>
    <text x="445" y="78">10-30</text>
    <text x="555" y="78">11-02</text>
    <text x="665" y="78">11-03</text>
    <text x="775" y="78">11-05</text>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333333">
    <text x="225" y="118">1</text>
    <text x="335" y="118">2</text>
    <text x="445" y="118">3</text>
    <text x="555" y="118">4</text>
    <text x="665" y="118">5</text>
    <text x="775" y="118">6</text>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333333">
    <text x="225" y="158">2461340.5</text>
    <text x="335" y="158">2461340.5</text>
    <text x="445" y="158">2461340.5</text>
    <text x="555" y="158">2461342.5</text>
    <text x="665" y="158">2461342.5</text>
    <text x="775" y="158">2461343.5</text>
  </g>

  <!-- 묶음 -->
  <rect x="175" y="185" width="320" height="56" rx="6" fill="#ecfdf5" stroke="#2d6a4f"/>
  <text x="335" y="210" font-size="14" font-weight="bold" text-anchor="middle" fill="#2d6a4f">묶음 1</text>
  <text x="335" y="230" font-size="13" text-anchor="middle" fill="#333333">10-28 ~ 10-30, 3일</text>
  <rect x="505" y="185" width="210" height="56" rx="6" fill="#ecfdf5" stroke="#2d6a4f"/>
  <text x="610" y="210" font-size="14" font-weight="bold" text-anchor="middle" fill="#2d6a4f">묶음 2</text>
  <text x="610" y="230" font-size="13" text-anchor="middle" fill="#333333">11-02 ~ 11-03, 2일</text>
  <rect x="725" y="185" width="100" height="56" rx="6" fill="#ecfdf5" stroke="#2d6a4f"/>
  <text x="775" y="210" font-size="14" font-weight="bold" text-anchor="middle" fill="#2d6a4f">묶음 3</text>
  <text x="775" y="230" font-size="13" text-anchor="middle" fill="#333333">11-05, 1일</text>

  <line x1="30" y1="260" x2="850" y2="260" stroke="#cbd5e1" stroke-dasharray="4 4"/>

  <g font-size="13" text-anchor="middle" fill="#333333">
    <text x="225" y="298">NULL</text>
    <text x="335" y="298">1</text>
    <text x="445" y="298">1</text>
    <text x="555" y="298">3</text>
    <text x="665" y="298">1</text>
    <text x="775" y="298">2</text>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="225" y="338" fill="#b45309">1</text>
    <text x="335" y="338" fill="#333333">0</text>
    <text x="445" y="338" fill="#333333">0</text>
    <text x="555" y="338" fill="#b45309">1</text>
    <text x="665" y="338" fill="#333333">0</text>
    <text x="775" y="338" fill="#b45309">1</text>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333333">
    <text x="225" y="378">1</text>
    <text x="335" y="378">1</text>
    <text x="445" y="378">1</text>
    <text x="555" y="378">2</text>
    <text x="665" y="378">2</text>
    <text x="775" y="378">3</text>
  </g>

  <text x="440" y="420" font-size="13" text-anchor="middle" fill="#333333">①은 연속인 동안 같은 값이 남고, ②는 차이가 1이 아닌 자리에서 번호가 하나 오른다 — 두 값 모두 GROUP BY 의 묶음 키가 된다</text>
  <text x="440" y="448" font-size="13" text-anchor="middle" fill="#9d0208">같은 날 기록이 두 번 있으면 ①은 rn 만 하나 더 올라 묶음이 갈리고, ②는 차이 0 을 새 시작으로 본다</text>
</svg>
