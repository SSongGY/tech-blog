<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Segoe UI, Malgun Gothic, sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fdfdfb"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="17" font-weight="600" fill="#222">재귀 CTE 가 'db,index,sql' 을 한 행씩 떼어 내는 과정</text>

  <text x="40" y="70" font-size="13" fill="#666">단계</text>
  <text x="210" y="70" font-size="13" fill="#666">tag — 이번에 떼어 낸 조각</text>
  <text x="470" y="70" font-size="13" fill="#666">rest — 아직 안 본 뒷부분</text>
  <text x="730" y="70" font-size="13" fill="#666">최종 결과</text>

  <!-- 초기 SELECT -->
  <text x="40" y="107" font-size="13" fill="#333">초기 SELECT</text>
  <rect x="200" y="86" width="240" height="34" rx="4" fill="#fff3e0" stroke="#b45309"/>
  <text x="215" y="108" font-size="14" fill="#b45309">'' (빈 문자열)</text>
  <rect x="460" y="86" width="240" height="34" rx="4" fill="#eef2f7" stroke="#55606e"/>
  <text x="475" y="108" font-size="14" fill="#333" font-family="Consolas, monospace">db,index,sql,</text>
  <text x="722" y="108" font-size="13" fill="#b45309">제외된다</text>

  <line x1="320" y1="120" x2="320" y2="146" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="580" y1="120" x2="580" y2="146" stroke="#555" marker-end="url(#arrow)"/>

  <!-- 재귀 1회 -->
  <text x="40" y="171" font-size="13" fill="#333">재귀 1회</text>
  <rect x="200" y="150" width="240" height="34" rx="4" fill="#e7f3ec" stroke="#2d6a4f"/>
  <text x="215" y="172" font-size="14" fill="#2d6a4f" font-family="Consolas, monospace">db</text>
  <rect x="460" y="150" width="240" height="34" rx="4" fill="#eef2f7" stroke="#55606e"/>
  <text x="475" y="172" font-size="14" fill="#333" font-family="Consolas, monospace">index,sql,</text>
  <text x="722" y="172" font-size="13" fill="#2d6a4f">한 행으로 나온다</text>

  <line x1="320" y1="184" x2="320" y2="210" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="580" y1="184" x2="580" y2="210" stroke="#555" marker-end="url(#arrow)"/>

  <!-- 재귀 2회 -->
  <text x="40" y="235" font-size="13" fill="#333">재귀 2회</text>
  <rect x="200" y="214" width="240" height="34" rx="4" fill="#e7f3ec" stroke="#2d6a4f"/>
  <text x="215" y="236" font-size="14" fill="#2d6a4f" font-family="Consolas, monospace">index</text>
  <rect x="460" y="214" width="240" height="34" rx="4" fill="#eef2f7" stroke="#55606e"/>
  <text x="475" y="236" font-size="14" fill="#333" font-family="Consolas, monospace">sql,</text>
  <text x="722" y="236" font-size="13" fill="#2d6a4f">한 행으로 나온다</text>

  <line x1="320" y1="248" x2="320" y2="274" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="580" y1="248" x2="580" y2="274" stroke="#555" marker-end="url(#arrow)"/>

  <!-- 재귀 3회 -->
  <text x="40" y="299" font-size="13" fill="#333">재귀 3회</text>
  <rect x="200" y="278" width="240" height="34" rx="4" fill="#e7f3ec" stroke="#2d6a4f"/>
  <text x="215" y="300" font-size="14" fill="#2d6a4f" font-family="Consolas, monospace">sql</text>
  <rect x="460" y="278" width="240" height="34" rx="4" fill="#eef2f7" stroke="#55606e"/>
  <text x="475" y="300" font-size="14" fill="#333">'' (빈 문자열)</text>
  <text x="722" y="300" font-size="13" fill="#2d6a4f">한 행으로 나온다</text>

  <line x1="580" y1="312" x2="580" y2="338" stroke="#555" marker-end="url(#arrow)"/>

  <!-- 종료 -->
  <rect x="200" y="342" width="500" height="36" rx="4" fill="#fff" stroke="#9d0208" stroke-dasharray="5 3"/>
  <text x="215" y="365" font-size="13" fill="#9d0208">rest 가 빈 문자열이라 WHERE rest &lt;&gt; '' 가 거짓 — 재귀가 여기서 멈춘다</text>

  <!-- 규칙 -->
  <rect x="40" y="398" width="800" height="54" rx="4" fill="#f4f6f8" stroke="#55606e"/>
  <text x="56" y="419" font-size="13" fill="#333">한 걸음마다 쓰는 식 두 개 —</text>
  <text x="240" y="419" font-size="13" fill="#333" font-family="Consolas, monospace">tag  = substr(rest, 1, instr(rest, ',') - 1)</text>
  <text x="240" y="440" font-size="13" fill="#333" font-family="Consolas, monospace">rest = substr(rest, instr(rest, ',') + 1)</text>
</svg>
