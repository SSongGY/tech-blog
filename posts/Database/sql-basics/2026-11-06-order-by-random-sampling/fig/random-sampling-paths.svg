<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <text x="24" y="34" font-size="16" font-weight="bold" fill="#9d0208">ORDER BY RANDOM() LIMIT n — 행 수만큼 일한다</text>
  <rect x="24" y="52" width="180" height="56" rx="6" fill="#fff5f5" stroke="#9d0208"/>
  <text x="114" y="76" font-size="14" text-anchor="middle" fill="#222222">SCAN 표 전체</text>
  <text x="114" y="96" font-size="13" text-anchor="middle" fill="#555555">N행을 모두 읽는다</text>
  <rect x="244" y="52" width="180" height="56" rx="6" fill="#fff5f5" stroke="#9d0208"/>
  <text x="334" y="76" font-size="14" text-anchor="middle" fill="#222222">행마다 random()</text>
  <text x="334" y="96" font-size="13" text-anchor="middle" fill="#555555">난수 N번 생성</text>
  <rect x="464" y="52" width="180" height="56" rx="6" fill="#fff5f5" stroke="#9d0208"/>
  <text x="554" y="76" font-size="14" text-anchor="middle" fill="#222222">TEMP B-TREE</text>
  <text x="554" y="96" font-size="13" text-anchor="middle" fill="#555555">난수 순으로 정렬</text>
  <rect x="684" y="52" width="172" height="56" rx="6" fill="#ffffff" stroke="#555555"/>
  <text x="770" y="76" font-size="14" text-anchor="middle" fill="#222222">앞의 n행</text>
  <text x="770" y="96" font-size="13" text-anchor="middle" fill="#555555">나머지는 버린다</text>
  <line x1="204" y1="80" x2="240" y2="80" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="424" y1="80" x2="460" y2="80" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="644" y1="80" x2="680" y2="80" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="24" y="160" font-size="16" font-weight="bold" fill="#2d6a4f">WHERE id &gt;= 난수 LIMIT 1 — 트리를 한 번 내려간다</text>
  <rect x="24" y="178" width="180" height="56" rx="6" fill="#f0f7f3" stroke="#2d6a4f"/>
  <text x="114" y="202" font-size="14" text-anchor="middle" fill="#222222">난수 1개</text>
  <text x="114" y="222" font-size="13" text-anchor="middle" fill="#555555">1 ~ MAX(id) 사이</text>
  <rect x="244" y="178" width="250" height="56" rx="6" fill="#f0f7f3" stroke="#2d6a4f"/>
  <text x="369" y="202" font-size="14" text-anchor="middle" fill="#222222">SEARCH rowid B-Tree</text>
  <text x="369" y="222" font-size="13" text-anchor="middle" fill="#555555">난수 이상인 첫 rowid</text>
  <rect x="534" y="178" width="180" height="56" rx="6" fill="#ffffff" stroke="#555555"/>
  <text x="624" y="202" font-size="14" text-anchor="middle" fill="#222222">1행</text>
  <text x="624" y="222" font-size="13" text-anchor="middle" fill="#555555">표 크기와 무관</text>
  <line x1="204" y1="206" x2="240" y2="206" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="494" y1="206" x2="530" y2="206" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="24" y="290" font-size="16" font-weight="bold" fill="#b45309">빈 번호가 있을 때 — 난수가 떨어지는 자리와 돌려받는 행</text>
  <text x="24" y="316" font-size="13" fill="#555555">id 1~100 중 11~60 을 지운 표. 난수 1~100 이 고르게 나온다</text>
  <rect x="24" y="332" width="80" height="40" fill="#f0f7f3" stroke="#2d6a4f"/>
  <text x="64" y="357" font-size="13" text-anchor="middle" fill="#222222">1~10</text>
  <rect x="104" y="332" width="400" height="40" fill="#f3f3f3" stroke="#999999" stroke-dasharray="5,4"/>
  <text x="304" y="357" font-size="13" text-anchor="middle" fill="#555555">11~60 삭제된 구간</text>
  <rect x="504" y="332" width="8" height="40" fill="#b45309" stroke="#b45309"/>
  <rect x="512" y="332" width="312" height="40" fill="#f0f7f3" stroke="#2d6a4f"/>
  <text x="668" y="357" font-size="13" text-anchor="middle" fill="#222222">62~100</text>
  <text x="508" y="392" font-size="13" text-anchor="middle" fill="#b45309">61</text>

  <path d="M104,404 L104,414 L512,414 L512,404" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <text x="308" y="436" font-size="13" text-anchor="middle" fill="#b45309">난수 11~61 (51가지) 이 전부 61 로 간다 → 51%</text>
  <text x="668" y="436" font-size="13" text-anchor="middle" fill="#2d6a4f">나머지 행은 각 1%</text>
</svg>
