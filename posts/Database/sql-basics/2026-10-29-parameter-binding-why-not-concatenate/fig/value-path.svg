<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fbfbfd"/>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1f">파이썬 값 85 가 SQLite 에 닿기까지 — 두 경로</text>

  <line x1="440" y1="48" x2="440" y2="452" stroke="#c9ccd4" stroke-width="1" stroke-dasharray="5 4"/>

  <text x="215" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#9d0208">문자열 조합</text>
  <text x="665" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d6a4f">파라미터 바인딩</text>

  <!-- 좌: 1 -->
  <rect x="105" y="80" width="220" height="42" rx="5" fill="#ffffff" stroke="#55585f" stroke-width="1.4"/>
  <text x="215" y="106" text-anchor="middle" font-size="14" fill="#1b1b1f">파이썬 int 값  85</text>
  <line x1="215" y1="122" x2="215" y2="144" stroke="#9d0208" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 좌: 2 -->
  <rect x="105" y="146" width="220" height="48" rx="5" fill="#fdeeee" stroke="#9d0208" stroke-width="1.4"/>
  <text x="215" y="167" text-anchor="middle" font-size="14" fill="#1b1b1f">f-string 이 문자로 바꾼다</text>
  <text x="215" y="186" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#9d0208">85 &#8594; "85"</text>
  <line x1="215" y1="194" x2="215" y2="216" stroke="#9d0208" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 좌: 3 -->
  <rect x="60" y="218" width="310" height="44" rx="5" fill="#ffffff" stroke="#55585f" stroke-width="1.4"/>
  <text x="215" y="246" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#1b1b1f">INSERT ... VALUES ('85')</text>
  <line x1="215" y1="262" x2="215" y2="284" stroke="#9d0208" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 좌: 4 -->
  <rect x="105" y="286" width="220" height="48" rx="5" fill="#ffffff" stroke="#55585f" stroke-width="1.4"/>
  <text x="215" y="307" text-anchor="middle" font-size="14" fill="#1b1b1f">파서가 TEXT 리터럴로 읽는다</text>
  <text x="215" y="326" text-anchor="middle" font-size="13" fill="#6b6e76">저장 클래스 TEXT</text>
  <line x1="155" y1="334" x2="130" y2="364" stroke="#55585f" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="275" y1="334" x2="300" y2="364" stroke="#55585f" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 좌: 5a / 5b -->
  <rect x="30" y="366" width="180" height="62" rx="5" fill="#eaf4ee" stroke="#2d6a4f" stroke-width="1.4"/>
  <text x="120" y="386" text-anchor="middle" font-size="13" fill="#1b1b1f">컬럼이 INTEGER 선언</text>
  <text x="120" y="404" text-anchor="middle" font-size="13" fill="#2d6a4f">숫자로 되돌려 저장</text>
  <text x="120" y="421" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#6b6e76">typeof = integer</text>

  <rect x="222" y="366" width="180" height="62" rx="5" fill="#fdeeee" stroke="#9d0208" stroke-width="1.4"/>
  <text x="312" y="386" text-anchor="middle" font-size="13" fill="#1b1b1f">컬럼에 타입 없음</text>
  <text x="312" y="404" text-anchor="middle" font-size="13" fill="#9d0208">TEXT 인 채로 저장</text>
  <text x="312" y="421" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#6b6e76">typeof = text</text>

  <text x="215" y="450" text-anchor="middle" font-size="13" fill="#9d0208">저장된 타입이 컬럼 선언에 달려 있다</text>

  <!-- 우: 1 -->
  <rect x="555" y="80" width="220" height="42" rx="5" fill="#ffffff" stroke="#55585f" stroke-width="1.4"/>
  <text x="665" y="106" text-anchor="middle" font-size="14" fill="#1b1b1f">파이썬 int 값  85</text>
  <line x1="665" y1="122" x2="665" y2="144" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- 우: 2 -->
  <rect x="510" y="146" width="310" height="48" rx="5" fill="#eaf4ee" stroke="#2d6a4f" stroke-width="1.4"/>
  <text x="665" y="167" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#1b1b1f">INSERT ... VALUES (?)</text>
  <text x="665" y="186" text-anchor="middle" font-size="13" fill="#2d6a4f">값 85 는 문장 밖에 따로 둔다</text>
  <line x1="665" y1="194" x2="665" y2="216" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- 우: 3 -->
  <rect x="555" y="218" width="220" height="44" rx="5" fill="#ffffff" stroke="#55585f" stroke-width="1.4"/>
  <text x="665" y="246" text-anchor="middle" font-size="14" fill="#1b1b1f">파서는 자리표시자만 읽는다</text>
  <line x1="665" y1="262" x2="665" y2="284" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- 우: 4 -->
  <rect x="555" y="286" width="220" height="48" rx="5" fill="#ffffff" stroke="#55585f" stroke-width="1.4"/>
  <text x="665" y="307" text-anchor="middle" font-size="14" fill="#1b1b1f">값을 타입째로 묶는다</text>
  <text x="665" y="326" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#6b6e76">sqlite3_bind_int64()</text>
  <line x1="665" y1="334" x2="665" y2="364" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- 우: 5 -->
  <rect x="555" y="366" width="220" height="62" rx="5" fill="#eaf4ee" stroke="#2d6a4f" stroke-width="1.4"/>
  <text x="665" y="386" text-anchor="middle" font-size="13" fill="#1b1b1f">저장 클래스 INTEGER</text>
  <text x="665" y="404" text-anchor="middle" font-size="13" fill="#2d6a4f">컬럼 선언과 무관하게 같다</text>
  <text x="665" y="421" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#6b6e76">typeof = integer</text>

  <text x="665" y="450" text-anchor="middle" font-size="13" fill="#2d6a4f">보낸 타입이 그대로 남는다</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#9d0208"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#2d6a4f"/>
    </marker>
  </defs>
</svg>
