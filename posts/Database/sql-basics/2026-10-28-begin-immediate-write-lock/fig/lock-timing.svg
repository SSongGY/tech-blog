<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="430" fill="#fbfbf8"/>

  <text x="24" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">쓰기 잠금을 요청하는 시점</text>
  <text x="24" y="56" font-size="13" fill="#555">같은 작업을 두 방식으로 열었을 때, SQLITE_BUSY 가 돌아오는 자리가 달라진다</text>

  <!-- ===== 패널 1: BEGIN (DEFERRED) ===== -->
  <rect x="24" y="74" width="832" height="150" rx="6" fill="#ffffff" stroke="#d6d6cf"/>
  <text x="40" y="98" font-size="14" font-weight="bold" fill="#1b1b1b">BEGIN (= DEFERRED)</text>
  <text x="196" y="98" font-size="13" fill="#666">첫 쓰기 문장에서야 쓰기 잠금을 요청한다</text>

  <line x1="44" y1="140" x2="840" y2="140" stroke="#bbb" stroke-width="1"/>

  <rect x="48" y="120" width="104" height="40" rx="4" fill="#eef3ef" stroke="#2d6a4f"/>
  <text x="100" y="145" font-size="13" text-anchor="middle" fill="#1b1b1b">BEGIN</text>

  <rect x="172" y="120" width="124" height="40" rx="4" fill="#eef3ef" stroke="#2d6a4f"/>
  <text x="234" y="145" font-size="13" text-anchor="middle" fill="#1b1b1b">SELECT 읽기</text>

  <rect x="316" y="120" width="134" height="40" rx="4" fill="#eef3ef" stroke="#2d6a4f"/>
  <text x="383" y="145" font-size="13" text-anchor="middle" fill="#1b1b1b">읽은 값으로 계산</text>

  <rect x="470" y="120" width="134" height="40" rx="4" fill="#f6e6e6" stroke="#9d0208" stroke-width="2"/>
  <text x="537" y="145" font-size="13" text-anchor="middle" fill="#9d0208">UPDATE</text>

  <rect x="624" y="120" width="104" height="40" rx="4" fill="#f4f4f2" stroke="#999" stroke-dasharray="4 3"/>
  <text x="676" y="145" font-size="13" text-anchor="middle" fill="#888">COMMIT</text>

  <text x="537" y="180" font-size="13" text-anchor="middle" fill="#9d0208">여기서 처음 잠금을 요청 → SQLITE_BUSY</text>
  <path d="M 48 198 L 48 206 L 604 206 L 604 198" fill="none" stroke="#9d0208" stroke-width="1.2"/>
  <text x="326" y="222" font-size="13" text-anchor="middle" fill="#9d0208">실패하면 여기까지 한 읽기와 계산을 버리고 다시 연다</text>

  <!-- ===== 패널 2: BEGIN IMMEDIATE ===== -->
  <rect x="24" y="240" width="832" height="150" rx="6" fill="#ffffff" stroke="#d6d6cf"/>
  <text x="40" y="264" font-size="14" font-weight="bold" fill="#1b1b1b">BEGIN IMMEDIATE</text>
  <text x="196" y="264" font-size="13" fill="#666">BEGIN 문장 자체가 쓰기 잠금을 요청한다</text>

  <line x1="44" y1="306" x2="840" y2="306" stroke="#bbb" stroke-width="1"/>

  <rect x="48" y="286" width="104" height="40" rx="4" fill="#f6e6e6" stroke="#9d0208" stroke-width="2"/>
  <text x="100" y="311" font-size="13" text-anchor="middle" fill="#9d0208">BEGIN IMM.</text>

  <rect x="172" y="286" width="124" height="40" rx="4" fill="#eef3ef" stroke="#2d6a4f"/>
  <text x="234" y="311" font-size="13" text-anchor="middle" fill="#1b1b1b">SELECT 읽기</text>

  <rect x="316" y="286" width="134" height="40" rx="4" fill="#eef3ef" stroke="#2d6a4f"/>
  <text x="383" y="311" font-size="13" text-anchor="middle" fill="#1b1b1b">읽은 값으로 계산</text>

  <rect x="470" y="286" width="134" height="40" rx="4" fill="#eef3ef" stroke="#2d6a4f"/>
  <text x="537" y="311" font-size="13" text-anchor="middle" fill="#1b1b1b">UPDATE</text>

  <rect x="624" y="286" width="104" height="40" rx="4" fill="#eef3ef" stroke="#2d6a4f"/>
  <text x="676" y="311" font-size="13" text-anchor="middle" fill="#1b1b1b">COMMIT</text>

  <text x="100" y="346" font-size="13" text-anchor="middle" fill="#9d0208">여기서 SQLITE_BUSY</text>
  <path d="M 48 362 L 48 370 L 152 370 L 152 362" fill="none" stroke="#2d6a4f" stroke-width="1.2"/>
  <text x="176" y="384" font-size="13" text-anchor="start" fill="#2d6a4f">버릴 일을 아직 하지 않았으므로 같은 자리에서 그대로 다시 시도한다</text>

  <text x="24" y="416" font-size="13" fill="#777">붉은 테두리 = 쓰기 잠금을 요청하는 문장 · 초록 테두리 = 잠금 없이 지나가는 문장</text>
</svg>
