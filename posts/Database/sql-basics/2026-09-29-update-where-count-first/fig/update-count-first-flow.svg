<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="440" fill="#ffffff"/>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">UPDATE 전에 세고, 바꾼 뒤 대조한다</text>

  <!-- ① 센다 -->
  <rect x="40" y="70" width="240" height="84" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="160" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">① 같은 조건으로 센다</text>
  <text x="160" y="120" text-anchor="middle" font-size="13" fill="#1b1b1b">SELECT COUNT(*)</text>
  <text x="160" y="140" text-anchor="middle" font-size="13" fill="#1b1b1b">FROM member WHERE 조건</text>

  <line x1="280" y1="112" x2="330" y2="112" stroke="#495057" stroke-width="1.5"/>
  <polygon points="330,107 340,112 330,117" fill="#495057"/>

  <!-- ② 바꾼다 -->
  <rect x="340" y="70" width="220" height="84" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="450" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">② 트랜잭션 안에서 바꾼다</text>
  <text x="450" y="120" text-anchor="middle" font-size="13" fill="#1b1b1b">BEGIN</text>
  <text x="450" y="140" text-anchor="middle" font-size="13" fill="#1b1b1b">UPDATE … WHERE 조건</text>

  <line x1="560" y1="112" x2="610" y2="112" stroke="#495057" stroke-width="1.5"/>
  <polygon points="610,107 620,112 610,117" fill="#495057"/>

  <!-- ③ 대조 -->
  <rect x="620" y="70" width="220" height="84" rx="6" fill="#fff3cd" stroke="#b45309" stroke-width="1.5"/>
  <text x="730" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b1b1b">③ 수를 대조한다</text>
  <text x="730" y="120" text-anchor="middle" font-size="13" fill="#1b1b1b">바뀐 행 수 = ①에서 센 값?</text>
  <text x="730" y="140" text-anchor="middle" font-size="13" fill="#495057">(changes, rowcount)</text>

  <!-- 갈래 -->
  <line x1="700" y1="154" x2="560" y2="230" stroke="#2d6a4f" stroke-width="1.5"/>
  <polygon points="566,222 556,232 570,231" fill="#2d6a4f"/>
  <text x="600" y="186" text-anchor="middle" font-size="13" fill="#2d6a4f">같다</text>

  <line x1="760" y1="154" x2="760" y2="222" stroke="#9d0208" stroke-width="1.5"/>
  <polygon points="755,222 760,232 765,222" fill="#9d0208"/>
  <text x="786" y="196" text-anchor="middle" font-size="13" fill="#9d0208">다르다</text>

  <rect x="400" y="232" width="200" height="60" rx="6" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="500" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d6a4f">④ COMMIT</text>
  <text x="500" y="279" text-anchor="middle" font-size="13" fill="#1b1b1b">바뀐 것이 확정된다</text>

  <rect x="660" y="232" width="200" height="60" rx="6" fill="#f8d7da" stroke="#9d0208" stroke-width="1.5"/>
  <text x="760" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#9d0208">④ ROLLBACK</text>
  <text x="760" y="279" text-anchor="middle" font-size="13" fill="#1b1b1b">BEGIN 이전으로 돌아간다</text>

  <!-- 주석 -->
  <text x="40" y="338" font-size="13" fill="#495057">WHERE 가 없으면 표의 모든 행이 바뀐다. ①을 건너뛰면 그 수를 비교할 기준이 없다.</text>
  <text x="40" y="362" font-size="13" fill="#495057">②를 BEGIN 없이 돌리면 자동 커밋이라 ③에서 틀린 것을 알아도 되돌릴 수 없다.</text>
  <text x="40" y="386" font-size="13" fill="#495057">바뀐 행 수는 조건에 맞은 행의 수다. 값이 그대로인 행도 센다(실습 4장).</text>
</svg>
