<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310"
     font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="880" height="310" fill="#fbfaf7"/>

  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2933">인덱스 idx_mgr 안에서 NULL 이 놓이는 자리</text>
  <text x="440" y="52" text-anchor="middle" font-size="13" fill="#52606d">NULL 은 어떤 값보다도 작다. 그래서 인덱스의 가장 왼쪽에 모여 있고, 지워지지 않는다.</text>

  <!-- 인덱스 항목 — 키 순서대로 -->
  <rect x="120" y="72" width="80" height="50" fill="#fdf3e3" stroke="#b45309" stroke-width="1.5"/>
  <rect x="200" y="72" width="80" height="50" fill="#fdf3e3" stroke="#b45309" stroke-width="1.5"/>
  <rect x="280" y="72" width="80" height="50" fill="#fdf3e3" stroke="#b45309" stroke-width="1.5"/>
  <rect x="360" y="72" width="80" height="50" fill="#fdf3e3" stroke="#b45309" stroke-width="1.5"/>
  <text x="160" y="103" text-anchor="middle" font-size="15" fill="#7c3d09">NULL</text>
  <text x="240" y="103" text-anchor="middle" font-size="15" fill="#7c3d09">NULL</text>
  <text x="320" y="103" text-anchor="middle" font-size="15" fill="#7c3d09">⋯</text>
  <text x="400" y="103" text-anchor="middle" font-size="15" fill="#7c3d09">NULL</text>

  <rect x="440" y="72" width="80" height="50" fill="#e6f1ea" stroke="#2d6a4f" stroke-width="1.5"/>
  <rect x="520" y="72" width="80" height="50" fill="#e6f1ea" stroke="#2d6a4f" stroke-width="1.5"/>
  <rect x="600" y="72" width="80" height="50" fill="#e6f1ea" stroke="#2d6a4f" stroke-width="1.5"/>
  <rect x="680" y="72" width="80" height="50" fill="#e6f1ea" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="480" y="103" text-anchor="middle" font-size="15" fill="#1b4332">1</text>
  <text x="560" y="103" text-anchor="middle" font-size="15" fill="#1b4332">2</text>
  <text x="640" y="103" text-anchor="middle" font-size="15" fill="#1b4332">⋯</text>
  <text x="720" y="103" text-anchor="middle" font-size="15" fill="#1b4332">20</text>

  <!-- 묶음 표시 -->
  <path d="M120 140 L120 132 L440 132 L440 140" fill="none" stroke="#b45309" stroke-width="1.3"/>
  <path d="M440 140 L440 132 L760 132 L760 140" fill="none" stroke="#2d6a4f" stroke-width="1.3"/>
  <text x="280" y="158" text-anchor="middle" font-size="13" fill="#7c3d09">NULL 항목 80개</text>
  <text x="600" y="158" text-anchor="middle" font-size="13" fill="#1b4332">값이 있는 항목 20개</text>

  <line x1="280" y1="166" x2="280" y2="182" stroke="#b45309" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="600" y1="166" x2="600" y2="182" stroke="#2d6a4f" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- 질의별로 어디를 보는가 -->
  <rect x="118" y="182" width="324" height="76" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="134" y="204" font-size="13.5" font-weight="bold" fill="#7c3d09">WHERE manager_id IS NULL</text>
  <text x="134" y="226" font-size="13" fill="#52606d">SEARCH … idx_mgr (manager_id=?)</text>
  <text x="134" y="247" font-size="13" fill="#52606d">80건 — NULL 묶음을 바로 찾아간다</text>

  <rect x="458" y="182" width="324" height="76" rx="4" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="474" y="204" font-size="13.5" font-weight="bold" fill="#1b4332">WHERE manager_id IS NOT NULL</text>
  <text x="474" y="226" font-size="13" fill="#52606d">SEARCH … idx_mgr (manager_id&gt;?)</text>
  <text x="474" y="247" font-size="13" fill="#52606d">20건 — NULL 묶음 바로 뒤부터 읽는다</text>

  <text x="440" y="288" text-anchor="middle" font-size="13" fill="#9d0208">manager_id = NULL 은 계획이 왼쪽과 똑같이 찍히지만 결과는 0건이다 — 비교가 참이 되는 일이 없기 때문이다.</text>
</svg>
