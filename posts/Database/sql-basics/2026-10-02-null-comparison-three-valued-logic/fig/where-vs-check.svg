<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="440" fill="#fbfbf8"/>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">조건식의 결과는 셋이고, 받는 쪽마다 '알 수 없음'을 다르게 처리한다</text>
  <text x="30" y="56" font-size="13" fill="#555">조건: rate BETWEEN 1 AND 50 (SQLite 3.49.1 실행 결과)</text>

  <!-- 입력 값 -->
  <rect x="40" y="96" width="150" height="50" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.2"/>
  <text x="115" y="126" font-size="14" fill="#1b1b1b" text-anchor="middle">rate = 10</text>
  <rect x="40" y="176" width="150" height="50" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.2"/>
  <text x="115" y="206" font-size="14" fill="#1b1b1b" text-anchor="middle">rate = 99</text>
  <rect x="40" y="256" width="150" height="50" rx="6" fill="#f1f1ee" stroke="#3b3b3b" stroke-width="1.2"/>
  <text x="115" y="286" font-size="14" fill="#9d0208" text-anchor="middle">rate = NULL</text>

  <!-- 조건식 결과 -->
  <rect x="260" y="96" width="170" height="50" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="345" y="126" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">참 (1)</text>
  <rect x="260" y="176" width="170" height="50" rx="6" fill="#fbeaea" stroke="#9d0208" stroke-width="1.5"/>
  <text x="345" y="206" font-size="14" font-weight="bold" fill="#9d0208" text-anchor="middle">거짓 (0)</text>
  <rect x="260" y="256" width="170" height="50" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="345" y="286" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">알 수 없음 (NULL)</text>

  <line x1="190" y1="121" x2="256" y2="121" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="190" y1="201" x2="256" y2="201" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="190" y1="281" x2="256" y2="281" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 받는 쪽 표 -->
  <text x="590" y="84" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">WHERE</text>
  <text x="590" y="102" font-size="13" fill="#555" text-anchor="middle">참인 행만 남긴다</text>
  <text x="760" y="84" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">CHECK</text>
  <text x="760" y="102" font-size="13" fill="#555" text-anchor="middle">거짓일 때만 거부한다</text>

  <text x="590" y="126" font-size="14" fill="#2d6a4f" text-anchor="middle">남긴다</text>
  <text x="760" y="126" font-size="14" fill="#2d6a4f" text-anchor="middle">통과</text>
  <text x="590" y="206" font-size="14" fill="#9d0208" text-anchor="middle">버린다</text>
  <text x="760" y="206" font-size="14" fill="#9d0208" text-anchor="middle">거부</text>
  <text x="590" y="286" font-size="14" font-weight="bold" fill="#9d0208" text-anchor="middle">버린다</text>
  <text x="760" y="286" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">통과</text>

  <line x1="430" y1="121" x2="520" y2="121" stroke="#c8c8c0" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="430" y1="201" x2="520" y2="201" stroke="#c8c8c0" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="430" y1="281" x2="520" y2="281" stroke="#c8c8c0" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="510" y="258" width="330" height="46" rx="6" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 요약 -->
  <line x1="30" y1="336" x2="850" y2="336" stroke="#d0d0c8" stroke-width="1"/>
  <text x="30" y="364" font-size="14" font-weight="bold" fill="#b45309">같은 조건이라도 NULL 행은 WHERE에서 빠지고 CHECK는 통과한다</text>
  <text x="30" y="390" font-size="13" fill="#333">= NULL 은 언제나 알 수 없음 → WHERE referrer_id = NULL 은 0행</text>
  <text x="30" y="414" font-size="13" fill="#333">IS NULL · IS NOT · IS DISTINCT FROM 은 참·거짓만 돌려주므로 NULL 행도 고를 수 있다</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a84"/>
    </marker>
  </defs>
</svg>
