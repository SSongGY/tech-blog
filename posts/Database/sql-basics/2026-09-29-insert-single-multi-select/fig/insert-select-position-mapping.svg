<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">INSERT … SELECT 는 이름이 아니라 자리 순서로 값을 맞춘다</text>

  <!-- 1. SELECT * -->
  <text x="40" y="68" font-size="15" font-weight="bold" fill="#9d0208">① INSERT INTO member (name, email) SELECT * FROM signup_staging</text>

  <text x="150" y="98" text-anchor="middle" font-size="13" fill="#495057">SELECT 결과의 자리</text>
  <rect x="60" y="108" width="180" height="36" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="150" y="131" text-anchor="middle" font-size="14" fill="#1b1b1b">1번째: email</text>
  <rect x="60" y="154" width="180" height="36" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="150" y="177" text-anchor="middle" font-size="14" fill="#1b1b1b">2번째: name</text>

  <text x="690" y="98" text-anchor="middle" font-size="13" fill="#495057">컬럼 목록의 자리</text>
  <rect x="600" y="108" width="180" height="36" fill="#f8d7da" stroke="#9d0208" stroke-width="1.5"/>
  <text x="690" y="131" text-anchor="middle" font-size="14" fill="#1b1b1b">1번째: name</text>
  <rect x="600" y="154" width="180" height="36" fill="#f8d7da" stroke="#9d0208" stroke-width="1.5"/>
  <text x="690" y="177" text-anchor="middle" font-size="14" fill="#1b1b1b">2번째: email</text>

  <line x1="240" y1="126" x2="590" y2="126" stroke="#9d0208" stroke-width="1.5"/>
  <polygon points="590,121 600,126 590,131" fill="#9d0208"/>
  <line x1="240" y1="172" x2="590" y2="172" stroke="#9d0208" stroke-width="1.5"/>
  <polygon points="590,167 600,172 590,177" fill="#9d0208"/>
  <text x="420" y="118" text-anchor="middle" font-size="13" fill="#9d0208">이메일이 name 에 들어간다</text>
  <text x="420" y="164" text-anchor="middle" font-size="13" fill="#9d0208">이름이 email 에 들어간다</text>
  <text x="420" y="214" text-anchor="middle" font-size="13" fill="#9d0208">둘 다 TEXT 라 에러가 나지 않는다</text>

  <!-- 2. 컬럼 이름을 양쪽에 -->
  <text x="40" y="266" font-size="15" font-weight="bold" fill="#2d6a4f">② INSERT INTO member (name, email) SELECT name, email FROM signup_staging</text>

  <text x="150" y="296" text-anchor="middle" font-size="13" fill="#495057">SELECT 결과의 자리</text>
  <rect x="60" y="306" width="180" height="36" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="150" y="329" text-anchor="middle" font-size="14" fill="#1b1b1b">1번째: name</text>
  <rect x="60" y="352" width="180" height="36" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="150" y="375" text-anchor="middle" font-size="14" fill="#1b1b1b">2번째: email</text>

  <text x="690" y="296" text-anchor="middle" font-size="13" fill="#495057">컬럼 목록의 자리</text>
  <rect x="600" y="306" width="180" height="36" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="690" y="329" text-anchor="middle" font-size="14" fill="#1b1b1b">1번째: name</text>
  <rect x="600" y="352" width="180" height="36" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="690" y="375" text-anchor="middle" font-size="14" fill="#1b1b1b">2번째: email</text>

  <line x1="240" y1="324" x2="590" y2="324" stroke="#2d6a4f" stroke-width="1.5"/>
  <polygon points="590,319 600,324 590,329" fill="#2d6a4f"/>
  <line x1="240" y1="370" x2="590" y2="370" stroke="#2d6a4f" stroke-width="1.5"/>
  <polygon points="590,365 600,370 590,375" fill="#2d6a4f"/>

  <text x="40" y="424" font-size="13" fill="#495057">목록에 없는 컬럼(member_id, grade)은 각자의 DEFAULT 로, DEFAULT 가 없으면 NULL 로 채워진다.</text>
  <text x="40" y="446" font-size="13" fill="#495057">member_id 는 INTEGER PRIMARY KEY 라 비워 두면 SQLite 가 번호를 매긴다.</text>
</svg>
