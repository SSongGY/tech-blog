<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="500" fill="#fbfbf8"/>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">BETWEEN의 양끝은 포함이다 — 잘리는 쪽은 끝값이 아니라 끝값 뒤에 붙은 시각이다</text>
  <text x="30" y="56" font-size="13" fill="#555">SQLite 3.49.1 · 실습 1·5·6번 결과 · 눈금 간격은 실제 비율이 아니다</text>

  <!-- 1. 숫자 범위 -->
  <text x="30" y="96" font-size="14" font-weight="bold" fill="#1b1b1b">amount BETWEEN 10000 AND 50000</text>

  <rect x="250" y="112" width="370" height="54" fill="#e8f1ec" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="268" y="134" font-size="13" fill="#2d6a4f">조건이 참인 구간 — 양끝 포함</text>

  <line x1="70" y1="166" x2="820" y2="166" stroke="#3b3b3b" stroke-width="1.5"/>

  <g font-size="13" fill="#1b1b1b">
    <circle cx="150" cy="166" r="5" fill="#ffffff" stroke="#9d0208" stroke-width="2"/>
    <text x="124" y="192">9,900</text>
    <text x="118" y="210" fill="#9d0208">빠짐</text>

    <circle cx="250" cy="166" r="5" fill="#2d6a4f"/>
    <text x="222" y="192">10,000</text>
    <text x="226" y="210" fill="#2d6a4f">포함</text>

    <circle cx="430" cy="166" r="5" fill="#2d6a4f"/>
    <text x="402" y="192">23,500</text>

    <circle cx="620" cy="166" r="5" fill="#2d6a4f"/>
    <text x="592" y="192">50,000</text>
    <text x="596" y="210" fill="#2d6a4f">포함</text>

    <circle cx="720" cy="166" r="5" fill="#ffffff" stroke="#9d0208" stroke-width="2"/>
    <text x="692" y="192">50,001</text>
    <text x="700" y="210" fill="#9d0208">빠짐</text>
  </g>
  <text x="760" y="152" font-size="13" fill="#555">amount →</text>

  <!-- 2. 날짜 범위 -->
  <text x="30" y="268" font-size="14" font-weight="bold" fill="#1b1b1b">ordered_at BETWEEN '2026-03-01' AND '2026-03-31'</text>

  <rect x="110" y="284" width="430" height="54" fill="#e8f1ec" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="128" y="306" font-size="13" fill="#2d6a4f">끝값은 0시 자리에 선다</text>

  <line x1="70" y1="338" x2="820" y2="338" stroke="#3b3b3b" stroke-width="1.5"/>
  <line x1="540" y1="276" x2="540" y2="356" stroke="#9d0208" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="548" y="272" font-size="13" font-weight="bold" fill="#9d0208">'2026-03-31' ← 여기서 끊긴다</text>

  <g font-size="13" fill="#1b1b1b">
    <circle cx="140" cy="338" r="5" fill="#2d6a4f"/>
    <text x="100" y="364">03-01 09:12</text>

    <circle cx="280" cy="338" r="5" fill="#2d6a4f"/>
    <text x="240" y="364">03-05 18:40</text>

    <circle cx="420" cy="338" r="5" fill="#2d6a4f"/>
    <text x="380" y="364">03-17 11:05</text>

    <circle cx="590" cy="338" r="5" fill="#ffffff" stroke="#9d0208" stroke-width="2"/>
    <text x="550" y="364">03-31 14:20</text>
    <text x="556" y="384" fill="#9d0208">3월인데 빠짐</text>

    <circle cx="700" cy="338" r="5" fill="#ffffff" stroke="#9d0208" stroke-width="2"/>
    <text x="660" y="364">03-31 23:59</text>
    <text x="666" y="384" fill="#9d0208">3월인데 빠짐</text>
  </g>
  <text x="762" y="324" font-size="13" fill="#555">ordered_at →</text>

  <!-- 고쳐 쓰는 법 -->
  <rect x="30" y="412" width="820" height="66" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="46" y="436" font-size="14" font-weight="bold" fill="#b45309">끝에 시각이 붙는 컬럼은 BETWEEN 대신 다음 날 0시를 &lt; 로 끊는다</text>
  <text x="46" y="460" font-size="13" fill="#1b1b1b">ordered_at &gt;= '2026-03-01' AND ordered_at &lt; '2026-04-01' — 실습 5번은 3행, 6번은 5행이었다</text>
</svg>
