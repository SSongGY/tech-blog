<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#fbfbf8"/>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">같은 순서, 다른 번호 — 동점 묶음(peer)을 어떻게 세는가</text>
  <text x="30" y="56" font-size="13" fill="#555">SQLite 3.49.1 · ORDER BY score DESC · 점수가 있는 8명 (실습 10번 결과)</text>

  <!-- 헤더 -->
  <rect x="30" y="76" width="520" height="34" fill="#ecebe4" stroke="#3b3b3b" stroke-width="1"/>
  <text x="90" y="98" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">score</text>
  <text x="220" y="98" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">ROW_NUMBER</text>
  <text x="350" y="98" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">RANK</text>
  <text x="480" y="98" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">DENSE_RANK</text>

  <!-- 동점 묶음 배경 -->
  <rect x="30" y="144" width="520" height="68" fill="#f3f1ea"/>
  <rect x="30" y="246" width="520" height="102" fill="#f3f1ea"/>

  <!-- 행: y 기준 126, 160, 194, 228, 262, 296, 330, 364 -->
  <g font-size="14" text-anchor="middle" fill="#1b1b1b">
    <text x="90" y="132">95</text><text x="220" y="132">1</text><text x="350" y="132">1</text><text x="480" y="132">1</text>
    <text x="90" y="166">88</text><text x="220" y="166">2</text><text x="350" y="166">2</text><text x="480" y="166">2</text>
    <text x="90" y="200">88</text><text x="220" y="200">3</text><text x="350" y="200">2</text><text x="480" y="200">2</text>
    <text x="90" y="234">80</text><text x="220" y="234">4</text><text x="350" y="234" fill="#b45309" font-weight="bold">4</text><text x="480" y="234" fill="#2d6a4f" font-weight="bold">3</text>
    <text x="90" y="268">75</text><text x="220" y="268">5</text><text x="350" y="268">5</text><text x="480" y="268">4</text>
    <text x="90" y="302">75</text><text x="220" y="302">6</text><text x="350" y="302">5</text><text x="480" y="302">4</text>
    <text x="90" y="336">75</text><text x="220" y="336">7</text><text x="350" y="336">5</text><text x="480" y="336">4</text>
    <text x="90" y="370">70</text><text x="220" y="370">8</text><text x="350" y="370" fill="#b45309" font-weight="bold">8</text><text x="480" y="370" fill="#2d6a4f" font-weight="bold">5</text>
  </g>
  <line x1="30" y1="384" x2="550" y2="384" stroke="#3b3b3b" stroke-width="1"/>

  <text x="30" y="410" font-size="13" fill="#555">회색 띠 = 점수가 같아 같은 묶음(peer)으로 보는 행</text>

  <!-- 오른쪽 설명 -->
  <rect x="580" y="76" width="270" height="76" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="596" y="100" font-size="14" font-weight="bold" fill="#1b1b1b">ROW_NUMBER</text>
  <text x="596" y="122" font-size="13" fill="#555">동점이어도 1씩 늘린다</text>
  <text x="596" y="142" font-size="13" fill="#555">동점자 중 누가 앞인지는 임의</text>

  <rect x="580" y="170" width="270" height="96" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="596" y="194" font-size="14" font-weight="bold" fill="#b45309">RANK — 건너뛴다</text>
  <text x="596" y="216" font-size="13" fill="#b45309">묶음 첫 행의 ROW_NUMBER를 준다</text>
  <text x="596" y="236" font-size="13" fill="#b45309">88점 둘 → 다음은 4 (3이 없다)</text>
  <text x="596" y="256" font-size="13" fill="#b45309">마지막 값 8 = 나보다 높은 7명 + 1</text>

  <rect x="580" y="284" width="270" height="96" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="596" y="308" font-size="14" font-weight="bold" fill="#2d6a4f">DENSE_RANK — 이어 센다</text>
  <text x="596" y="330" font-size="13" fill="#2d6a4f">몇 번째 묶음인지를 준다</text>
  <text x="596" y="350" font-size="13" fill="#2d6a4f">88점 둘 → 다음은 3</text>
  <text x="596" y="370" font-size="13" fill="#2d6a4f">마지막 값 5 = 서로 다른 점수 5개</text>

  <rect x="30" y="430" width="820" height="66" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="46" y="456" font-size="14" font-weight="bold" fill="#1b1b1b">"3등까지" 로 거르면 (실습 2번)</text>
  <text x="46" y="480" font-size="13" fill="#555">ROW_NUMBER 3명 · RANK 3명이지만 3등은 없다 · DENSE_RANK 4명 (80점 최유나까지)</text>
</svg>
