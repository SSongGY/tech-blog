<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fdfdfb"/>

  <defs>
    <marker id="slow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9d0208"/>
    </marker>
    <marker id="fast" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2d6a4f"/>
    </marker>
  </defs>

  <!-- 위단: LIKE 경로 -->
  <text x="30" y="30" font-size="15" font-weight="bold" fill="#9d0208">LIKE '%디스크%' — 본문을 한 행씩 비교한다</text>

  <rect x="30" y="72" width="180" height="56" rx="4" fill="#fdecea" stroke="#9d0208" stroke-width="1.5"/>
  <text x="120" y="96" font-size="14" text-anchor="middle" fill="#9d0208">LIKE '%디스크%'</text>
  <text x="120" y="116" font-size="13" text-anchor="middle" fill="#5a5a5a">인덱스로 좁힐 수 없다</text>

  <line x1="212" y1="100" x2="292" y2="100" stroke="#9d0208" stroke-width="1.6" marker-end="url(#slow)"/>

  <rect x="296" y="46" width="320" height="170" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="308" y="66" font-size="14" font-weight="bold" fill="#333333">note 표 — 5행</text>
  <rect x="306" y="74" width="300" height="24" fill="#fdecea" stroke="#d9a7a2"/>
  <text x="314" y="91" font-size="13" fill="#333333">1  야간 백업이 디스크 공간 부족으로…</text>
  <rect x="306" y="100" width="300" height="24" fill="#fdecea" stroke="#d9a7a2"/>
  <text x="314" y="117" font-size="13" fill="#333333">2  오래된 로그를 지워 디스크 공간을…</text>
  <rect x="306" y="126" width="300" height="24" fill="#fdecea" stroke="#d9a7a2"/>
  <text x="314" y="143" font-size="13" fill="#333333">3  네트워크 지연이 사라졌다</text>
  <rect x="306" y="152" width="300" height="24" fill="#fdecea" stroke="#d9a7a2"/>
  <text x="314" y="169" font-size="13" fill="#333333">4  조회가 느려 인덱스를 다시…</text>
  <rect x="306" y="178" width="300" height="24" fill="#fdecea" stroke="#d9a7a2"/>
  <text x="314" y="195" font-size="13" fill="#333333">5  백업 작업을 새벽으로 옮겨…</text>

  <line x1="618" y1="130" x2="696" y2="130" stroke="#9d0208" stroke-width="1.6" marker-end="url(#slow)"/>

  <rect x="700" y="100" width="150" height="60" rx="4" fill="#ffffff" stroke="#9d0208" stroke-width="1.5"/>
  <text x="775" y="124" font-size="13" text-anchor="middle" fill="#333333">읽은 행 5</text>
  <text x="775" y="146" font-size="13" text-anchor="middle" fill="#9d0208">맞은 행 1, 2</text>

  <line x1="30" y1="243" x2="850" y2="243" stroke="#c9c9c9" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- 아래단: FTS5 경로 -->
  <text x="30" y="276" font-size="15" font-weight="bold" fill="#2d6a4f">MATCH '디스크' — 토큰에서 rowid 를 집는다</text>

  <rect x="30" y="330" width="180" height="56" rx="4" fill="#e9f5ee" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="120" y="354" font-size="14" text-anchor="middle" fill="#2d6a4f">MATCH '디스크'</text>
  <text x="120" y="374" font-size="13" text-anchor="middle" fill="#5a5a5a">질의어도 토큰으로 쪼갠다</text>

  <line x1="212" y1="358" x2="292" y2="358" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#fast)"/>

  <rect x="296" y="296" width="320" height="150" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="308" y="316" font-size="14" font-weight="bold" fill="#333333">note_fts 역색인 — 토큰 → 문서 목록</text>
  <text x="314" y="340" font-size="13" fill="#5a5a5a">공간</text>
  <text x="400" y="340" font-size="13" fill="#5a5a5a">→  rowid 1</text>
  <rect x="306" y="348" width="300" height="24" fill="#e9f5ee" stroke="#9cc5ae"/>
  <text x="314" y="365" font-size="13" fill="#2d6a4f">디스크</text>
  <text x="400" y="365" font-size="13" fill="#2d6a4f">→  rowid 1, 2</text>
  <text x="314" y="392" font-size="13" fill="#5a5a5a">로그를</text>
  <text x="400" y="392" font-size="13" fill="#5a5a5a">→  rowid 2</text>
  <text x="314" y="414" font-size="13" fill="#5a5a5a">백업이</text>
  <text x="400" y="414" font-size="13" fill="#5a5a5a">→  rowid 1</text>
  <text x="314" y="436" font-size="13" fill="#5a5a5a">엔트리마다 컬럼 번호와 위치도 함께</text>

  <line x1="618" y1="370" x2="696" y2="370" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#fast)"/>

  <rect x="700" y="340" width="150" height="60" rx="4" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="775" y="364" font-size="13" text-anchor="middle" fill="#333333">읽은 행 2</text>
  <text x="775" y="386" font-size="13" text-anchor="middle" fill="#2d6a4f">맞은 행 1, 2</text>
</svg>
