<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="430" fill="#fbfaf7"/>

  <text x="24" y="32" font-size="17" font-weight="bold" fill="#1b2430">ATTACH — 연결 하나가 여러 데이터베이스 파일을 이름으로 갈라 본다</text>

  <!-- 연결 상자 -->
  <rect x="24" y="52" width="360" height="216" rx="10" fill="#eef3f0" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="44" y="78" font-size="14" font-weight="bold" fill="#2d6a4f">연결 하나 (sqlite3.Connection)</text>
  <text x="44" y="98" font-size="13" fill="#44525f">PRAGMA database_list 가 돌려주는 목록</text>

  <rect x="44" y="110" width="320" height="42" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.4"/>
  <text x="60" y="128" font-size="14" font-weight="bold" fill="#1b2430">seq 0 · main</text>
  <text x="60" y="145" font-size="13" fill="#44525f">연결을 열 때 지정한 파일. 떼어낼 수 없다</text>

  <rect x="44" y="158" width="320" height="42" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
  <text x="60" y="176" font-size="14" font-weight="bold" fill="#1b2430">seq 1 · temp</text>
  <text x="60" y="193" font-size="13" fill="#44525f">TEMP 객체 전용. 예약된 이름이라 붙이지 못한다</text>

  <rect x="44" y="206" width="320" height="42" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.4"/>
  <text x="60" y="224" font-size="14" font-weight="bold" fill="#1b2430">seq 2 · archive</text>
  <text x="60" y="241" font-size="13" fill="#44525f">ATTACH 로 붙인 이름. 최대 10개 (기본값)</text>

  <!-- 화살표 -->
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#44525f"/>
    </marker>
  </defs>
  <line x1="384" y1="131" x2="520" y2="131" stroke="#44525f" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="384" y1="179" x2="520" y2="179" stroke="#44525f" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="384" y1="227" x2="520" y2="227" stroke="#44525f" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- 파일 상자 -->
  <rect x="524" y="110" width="332" height="42" rx="6" fill="#ffffff" stroke="#44525f" stroke-width="1.4"/>
  <text x="540" y="128" font-size="14" font-weight="bold" fill="#1b2430">sales.db</text>
  <text x="540" y="145" font-size="13" fill="#44525f">표: orders</text>

  <rect x="524" y="158" width="332" height="42" rx="6" fill="#ffffff" stroke="#44525f" stroke-width="1.4"/>
  <text x="540" y="176" font-size="14" font-weight="bold" fill="#1b2430">임시 저장소</text>
  <text x="540" y="193" font-size="13" fill="#44525f">메모리 또는 임시 파일</text>

  <rect x="524" y="206" width="332" height="42" rx="6" fill="#ffffff" stroke="#44525f" stroke-width="1.4"/>
  <text x="540" y="224" font-size="14" font-weight="bold" fill="#1b2430">archive.db</text>
  <text x="540" y="241" font-size="13" fill="#44525f">표: orders, customer</text>

  <!-- 커밋 영역 -->
  <text x="24" y="302" font-size="14" font-weight="bold" fill="#1b2430">두 파일을 함께 고치는 COMMIT 은 저널 모드에 따라 갈린다</text>

  <rect x="24" y="316" width="408" height="92" rx="8" fill="#eef3f0" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="44" y="340" font-size="14" font-weight="bold" fill="#2d6a4f">롤백 저널 모드 (delete 등)</text>
  <text x="44" y="362" font-size="13" fill="#1b2430">파일마다 롤백 저널 + 공용 슈퍼저널 &lt;main&gt;-mjXXXXXXXX</text>
  <text x="44" y="382" font-size="13" fill="#1b2430">슈퍼저널을 지우는 순간이 커밋 지점</text>
  <text x="44" y="400" font-size="13" fill="#2d6a4f">→ 전원이 끊겨도 전부 반영되거나 전부 취소된다</text>

  <rect x="448" y="316" width="408" height="92" rx="8" fill="#fdf1ef" stroke="#9d0208" stroke-width="1.6"/>
  <text x="468" y="340" font-size="14" font-weight="bold" fill="#9d0208">WAL 모드 또는 main 이 :memory:</text>
  <text x="468" y="362" font-size="13" fill="#1b2430">슈퍼저널을 쓰지 않는다. 파일 하나하나만 원자적</text>
  <text x="468" y="382" font-size="13" fill="#1b2430">COMMIT 도중 호스트가 죽으면 한쪽만 반영될 수 있다</text>
  <text x="468" y="400" font-size="13" fill="#9d0208">→ 파일을 걸치는 갱신에 기대지 않는다</text>
</svg>
