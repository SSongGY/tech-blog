<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500"
     font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="880" height="500" fill="#f8f9fa"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#495057"/>
    </marker>
  </defs>

  <text x="20" y="26" font-size="16" font-weight="bold" fill="#212529">기간 [18000, 18010] 과 겹치는 예약 찾기 — 같은 조건, 다른 자료구조</text>
  <text x="20" y="48" font-size="13" fill="#495057">조건: start_day ≤ 18010 AND end_day ≥ 18000. 겹치는 행은 20만 건 중 129건이다.</text>

  <!-- 왼쪽: B-tree -->
  <rect x="20" y="66" width="414" height="400" rx="6" fill="#ffffff" stroke="#9d0208" stroke-width="1.5"/>
  <text x="36" y="90" font-size="14" font-weight="bold" fill="#9d0208">B-tree 인덱스 (start_day, end_day)</text>
  <text x="36" y="110" font-size="13" fill="#495057">start_day 순으로 한 줄로 정렬돼 있다</text>

  <!-- 정렬된 띠 -->
  <rect x="36" y="128" width="382" height="34" fill="#ffffff" stroke="#495057" stroke-width="1"/>
  <rect x="36" y="128" width="189" height="34" fill="#ffe3e3" stroke="none"/>
  <line x1="225" y1="122" x2="225" y2="168" stroke="#212529" stroke-width="1.5"/>
  <text x="46" y="150" font-size="13" fill="#9d0208">start_day ≤ 18010 → 98,775행</text>
  <text x="236" y="150" font-size="13" fill="#495057">start_day &gt; 18010 (건너뜀)</text>
  <text x="36" y="186" font-size="13" fill="#212529">① 첫 컬럼 조건으로 범위를 자른다 — 전체의 절반이 남는다</text>

  <rect x="36" y="200" width="382" height="34" fill="#ffe3e3" stroke="#9d0208" stroke-width="1"/>
  <text x="46" y="222" font-size="13" fill="#9d0208">98,775행을 하나씩 읽어 end_day ≥ 18000 인지 본다</text>
  <text x="36" y="258" font-size="13" fill="#212529">② 둘째 컬럼은 범위를 좁히지 못한다 — 첫 컬럼이 범위 조건이면</text>
  <text x="36" y="276" font-size="13" fill="#212529">   그 뒤 컬럼은 정렬 순서가 끊겨 "걸러내기"로만 쓰인다</text>

  <rect x="36" y="296" width="382" height="34" fill="#ffffff" stroke="#495057" stroke-width="1"/>
  <text x="46" y="318" font-size="13" fill="#212529">결과 129행</text>

  <text x="36" y="364" font-size="13" font-family="'Consolas','D2Coding',monospace" fill="#212529">SEARCH booking USING COVERING INDEX</text>
  <text x="36" y="382" font-size="13" font-family="'Consolas','D2Coding',monospace" fill="#212529">  ix_booking_start_end (start_day&lt;?)</text>
  <text x="36" y="412" font-size="13" fill="#9d0208">읽은 행 98,775 · 평균 2.479 ms</text>
  <text x="36" y="436" font-size="13" fill="#495057">기간이 뒤쪽일수록 절반이 아니라 거의 전부가 된다</text>

  <!-- 오른쪽: rtree -->
  <rect x="446" y="66" width="414" height="400" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="462" y="90" font-size="14" font-weight="bold" fill="#2d6a4f">rtree 가상 테이블 (booking_id, start_day, end_day)</text>
  <text x="462" y="110" font-size="13" fill="#495057">노드마다 자식들을 모두 품는 경계 구간을 갖는다</text>

  <!-- 루트 -->
  <rect x="560" y="126" width="186" height="30" rx="4" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="653" y="146" font-size="13" fill="#212529" text-anchor="middle">루트 [0, 36530]</text>

  <!-- 자식 3개 -->
  <line x1="600" y1="156" x2="520" y2="196" stroke="#495057" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="653" y1="156" x2="653" y2="196" stroke="#495057" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="706" y1="156" x2="786" y2="196" stroke="#495057" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="462" y="200" width="120" height="30" rx="4" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
  <text x="522" y="220" font-size="13" fill="#868e96" text-anchor="middle">[0, 12100]</text>
  <rect x="593" y="200" width="120" height="30" rx="4" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="653" y="220" font-size="13" fill="#212529" text-anchor="middle">[12070, 24240]</text>
  <rect x="724" y="200" width="120" height="30" rx="4" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
  <text x="784" y="220" font-size="13" fill="#868e96" text-anchor="middle">[24210, 36530]</text>

  <text x="462" y="254" font-size="13" fill="#212529">① 질의 구간과 경계가 겹치는 노드만 내려간다</text>
  <text x="462" y="272" font-size="13" fill="#212529">   양 옆 노드는 경계만 보고 통째로 건너뛴다</text>

  <line x1="653" y1="230" x2="653" y2="290" stroke="#495057" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="593" y="294" width="120" height="30" rx="4" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="653" y="314" font-size="13" fill="#212529" text-anchor="middle">… 잎 노드</text>
  <text x="462" y="346" font-size="13" fill="#212529">② 잎에 닿으면 각 행의 [start_day, end_day] 를 직접 비교한다</text>

  <text x="462" y="376" font-size="13" font-family="'Consolas','D2Coding',monospace" fill="#212529">SCAN booking_span VIRTUAL TABLE</text>
  <text x="462" y="394" font-size="13" font-family="'Consolas','D2Coding',monospace" fill="#212529">  INDEX 2:B0D1</text>
  <text x="462" y="420" font-size="13" fill="#2d6a4f">결과 129행 · 평균 0.039 ms</text>
  <text x="462" y="441" font-size="13" fill="#495057">경계 구간의 숫자는 설명용 예시다.</text>
  <text x="462" y="460" font-size="13" fill="#495057">실제 분할은 삽입 순서에 따라 달라진다.</text>

  <text x="20" y="488" font-size="13" fill="#495057">두 축(시작·끝)을 한 번에 쓰는 것이 rtree 가 하는 일이다. B-tree 는 정렬 축이 하나뿐이라 둘째 조건이 범위를 못 줄인다.</text>
</svg>
