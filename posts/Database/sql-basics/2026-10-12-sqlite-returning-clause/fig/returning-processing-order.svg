<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9d0208"/>
    </marker>
  </defs>

  <text x="25" y="34" font-size="16" font-weight="bold" fill="#1f2937">INSERT … RETURNING 한 문장이 처리되는 순서</text>

  <!-- 위 줄: 네 단계 -->
  <rect x="25" y="60" width="190" height="104" rx="6" fill="#e8f5ee" stroke="#2d6a4f"/>
  <text x="120" y="88" text-anchor="middle" font-weight="bold" fill="#1f2937">① 행 변경</text>
  <text x="120" y="112" text-anchor="middle" font-size="13" fill="#374151">첫 sqlite3_step()</text>
  <text x="120" y="132" text-anchor="middle" font-size="13" fill="#374151">한 번에 대상 행을</text>
  <text x="120" y="152" text-anchor="middle" font-size="13" fill="#374151">전부 바꾼다</text>

  <rect x="235" y="60" width="190" height="104" rx="6" fill="#eef2ff" stroke="#4b5563"/>
  <text x="330" y="88" text-anchor="middle" font-weight="bold" fill="#1f2937">② 반환 값 계산</text>
  <text x="330" y="112" text-anchor="middle" font-size="13" fill="#374151">INSERT·UPDATE는</text>
  <text x="330" y="132" text-anchor="middle" font-size="13" fill="#374151">바뀐 뒤 값,</text>
  <text x="330" y="152" text-anchor="middle" font-size="13" fill="#374151">DELETE는 지우기 전 값</text>

  <rect x="445" y="60" width="190" height="104" rx="6" fill="#eef2ff" stroke="#4b5563"/>
  <text x="540" y="88" text-anchor="middle" font-weight="bold" fill="#1f2937">③ 메모리에 쌓기</text>
  <text x="540" y="112" text-anchor="middle" font-size="13" fill="#374151">결과 행 전부를</text>
  <text x="540" y="132" text-anchor="middle" font-size="13" fill="#374151">연결의 메모리에</text>
  <text x="540" y="152" text-anchor="middle" font-size="13" fill="#374151">모아 둔다</text>

  <rect x="655" y="60" width="200" height="104" rx="6" fill="#eef2ff" stroke="#4b5563"/>
  <text x="755" y="88" text-anchor="middle" font-weight="bold" fill="#1f2937">④ 응용이 읽기</text>
  <text x="755" y="112" text-anchor="middle" font-size="13" fill="#374151">fetch로 한 행씩 꺼낸다</text>
  <text x="755" y="132" text-anchor="middle" font-size="13" fill="#374151">행 순서는</text>
  <text x="755" y="152" text-anchor="middle" font-size="13" fill="#374151">보장되지 않는다</text>

  <line x1="215" y1="112" x2="233" y2="112" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="425" y1="112" x2="443" y2="112" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="635" y1="112" x2="653" y2="112" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="25" y="190" font-size="13" fill="#2d6a4f">①이 끝난 뒤에야 ④가 시작된다. 결과를 한 행만 읽어도 변경은 이미 전부 반영돼 있다 (실습 7번).</text>

  <!-- 아래: 트리거 갈래 -->
  <line x1="120" y1="164" x2="120" y2="236" stroke="#9d0208" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <rect x="25" y="240" width="300" height="84" rx="6" fill="#fdecec" stroke="#9d0208"/>
  <text x="175" y="266" text-anchor="middle" font-weight="bold" fill="#1f2937">트리거·외래 키 동작</text>
  <text x="175" y="290" text-anchor="middle" font-size="13" fill="#374151">같은 행의 값을 다시 바꾸거나</text>
  <text x="175" y="310" text-anchor="middle" font-size="13" fill="#374151">다른 표에 행을 쓴다</text>

  <text x="345" y="268" font-size="13" fill="#9d0208">이 변경은 RETURNING에 나오지 않는다.</text>
  <text x="345" y="290" font-size="13" fill="#9d0208">실습 6번: RETURNING은 '접수', 표에는 '검토'.</text>
  <text x="345" y="312" font-size="13" fill="#9d0208">트리거가 쓴 order_log 행도 돌아오지 않았다.</text>

  <!-- 맨 아래: 파이썬 관찰 -->
  <rect x="25" y="350" width="830" height="92" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="45" y="376" font-weight="bold" fill="#1f2937">파이썬 3.13.5 executemany()에 RETURNING을 붙이면 (실습 10번, 관찰)</text>
  <text x="45" y="400" font-size="13" fill="#374151">문서는 "결과 행을 버린다"고 적지만, 실제로는 첫 번째 행만 들어간 뒤 InterfaceError로 멈췄다.</text>
  <text x="45" y="422" font-size="13" fill="#374151">기본 트랜잭션 모드에서는 그 한 행이 열린 트랜잭션에 남는다 — rollback() 하면 0행이 된다.</text>
</svg>
