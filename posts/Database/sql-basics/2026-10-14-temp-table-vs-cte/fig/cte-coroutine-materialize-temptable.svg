  <text x="150" y="330" font-size="13" fill="#4a5a56" text-anchor="middle">중간 결과가 어디에도</text>
  <text x="150" y="350" font-size="13" fill="#4a5a56" text-anchor="middle">남지 않는다</text>

  <!-- 패널 B -->
  <rect x="300" y="16" width="268" height="368" rx="8" fill="#ffffff" stroke="#cbd5d1" stroke-width="1.5"/>
  <text x="318" y="44" font-size="15" font-weight="bold" fill="#1b2a27">② CTE 를 두 번 참조</text>
  <text x="318" y="66" font-size="13" fill="#4a5a56">MATERIALIZE — 한 번 만들어 쓴다</text>

  <rect x="340" y="88" width="188" height="42" rx="5" fill="#eef2f1" stroke="#7b8a86" stroke-width="1.5"/>
  <text x="434" y="114" font-size="14" fill="#1b2a27" text-anchor="middle">sale 240행</text>

  <path d="M434 130 L434 164" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrow-g)"/>

  <rect x="340" y="164" width="188" height="58" rx="5" fill="#e3efe8" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="434" y="188" font-size="14" fill="#1b2a27" text-anchor="middle">임시 결과 4행</text>
  <text x="434" y="208" font-size="13" fill="#2d6a4f" text-anchor="middle">집계 자리 통과 240회</text>

  <path d="M400 222 L372 256" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrow-g)"/>
  <path d="M468 222 L496 256" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrow-g)"/>

  <rect x="320" y="256" width="104" height="42" rx="5" fill="#eef2f1" stroke="#7b8a86" stroke-width="1.5"/>
  <text x="372" y="282" font-size="14" fill="#1b2a27" text-anchor="middle">참조 a</text>

  <rect x="444" y="256" width="104" height="42" rx="5" fill="#eef2f1" stroke="#7b8a86" stroke-width="1.5"/>
  <text x="496" y="282" font-size="14" fill="#1b2a27" text-anchor="middle">참조 b</text>

  <text x="434" y="330" font-size="13" fill="#4a5a56" text-anchor="middle">참조가 둘이어도 몸체는</text>
  <text x="434" y="350" font-size="13" fill="#4a5a56" text-anchor="middle">한 번만 돈다</text>

  <!-- 패널 C -->
  <rect x="584" y="16" width="280" height="368" rx="8" fill="#ffffff" stroke="#cbd5d1" stroke-width="1.5"/>
  <text x="602" y="44" font-size="15" font-weight="bold" fill="#1b2a27">③ CREATE TEMP TABLE</text>
  <text x="602" y="66" font-size="13" fill="#4a5a56">temp 데이터베이스에 남는다</text>

  <rect x="630" y="88" width="188" height="42" rx="5" fill="#eef2f1" stroke="#7b8a86" stroke-width="1.5"/>
