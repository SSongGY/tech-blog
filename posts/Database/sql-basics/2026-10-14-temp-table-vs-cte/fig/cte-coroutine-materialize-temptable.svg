  <text x="34" y="66" font-size="13" fill="#4a5a56">CO-ROUTINE — 저장 없이 넘긴다</text>

  <rect x="56" y="88" width="188" height="42" rx="5" fill="#eef2f1" stroke="#7b8a86" stroke-width="1.5"/>
  <text x="150" y="114" font-size="14" fill="#1b2a27" text-anchor="middle">sale 240행</text>

  <path d="M150 130 L150 164" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrow-g)"/>

  <rect x="56" y="164" width="188" height="58" rx="5" fill="#e3efe8" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="150" y="188" font-size="14" fill="#1b2a27" text-anchor="middle">region_total 몸체</text>
  <text x="150" y="208" font-size="13" fill="#2d6a4f" text-anchor="middle">집계 자리 통과 240회</text>

  <path d="M150 222 L150 256" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrow-g)"/>

  <rect x="56" y="256" width="188" height="42" rx="5" fill="#eef2f1" stroke="#7b8a86" stroke-width="1.5"/>
