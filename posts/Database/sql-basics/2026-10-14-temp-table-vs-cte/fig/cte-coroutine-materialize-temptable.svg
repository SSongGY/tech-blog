  <path d="M724 130 L724 164" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-o)"/>

  <rect x="610" y="164" width="228" height="58" rx="5" fill="#fdf0dd" stroke="#b45309" stroke-width="1.8"/>
  <text x="724" y="188" font-size="14" fill="#1b2a27" text-anchor="middle">temp.region_total 4행</text>
  <text x="724" y="208" font-size="13" fill="#b45309" text-anchor="middle">연결이 닫힐 때까지 남는다</text>

  <path d="M690 222 L662 256" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrow-g)"/>
  <path d="M758 222 L786 256" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrow-g)"/>

  <rect x="606" y="256" width="112" height="42" rx="5" fill="#eef2f1" stroke="#7b8a86" stroke-width="1.5"/>
  <text x="662" y="282" font-size="14" fill="#1b2a27" text-anchor="middle">질의 1</text>

  <rect x="730" y="256" width="112" height="42" rx="5" fill="#eef2f1" stroke="#7b8a86" stroke-width="1.5"/>
  <text x="786" y="282" font-size="14" fill="#1b2a27" text-anchor="middle">질의 2</text>

  <text x="724" y="330" font-size="13" fill="#4a5a56" text-anchor="middle">다른 문장에서도 읽히고,</text>
  <text x="724" y="350" font-size="13" fill="#4a5a56" text-anchor="middle">집계 자리 통과는 0회</text>

  <defs>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2d6a4f"/>
    </marker>
    <marker id="arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
