<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fbfbf8"/>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">"2 PRECEDING AND CURRENT ROW" — 현재 행이 5번 주문(10월 5일)일 때 프레임</text>
  <text x="30" y="56" font-size="13" fill="#555">SQLite 3.49.1 · ORDER BY day_no · 10월 4일은 주문이 없다 (실습 5번·6번 결과)</text>

  <!-- 열 머리: 칸 폭 90, 시작 x=200 -->
  <text x="40" y="100" font-size="14" font-weight="bold" fill="#1b1b1b">day_no</text>
  <text x="40" y="132" font-size="14" font-weight="bold" fill="#1b1b1b">order_id</text>
  <text x="40" y="164" font-size="14" font-weight="bold" fill="#1b1b1b">amount</text>

  <!-- 같은 날짜(피어) 묶음 배경 -->
  <rect x="380" y="78" width="180" height="100" fill="#f3f1ea"/>
  <rect x="560" y="78" width="180" height="100" fill="#ece6d6"/>

  <g font-size="14" text-anchor="middle" fill="#1b1b1b">
    <text x="245" y="100">1</text><text x="335" y="100">2</text>
    <text x="425" y="100">3</text><text x="515" y="100">3</text>
    <text x="605" y="100">5</text><text x="695" y="100">5</text>
    <text x="785" y="100">6</text>

    <text x="245" y="132">1</text><text x="335" y="132">2</text>
    <text x="425" y="132">3</text><text x="515" y="132">4</text>
    <text x="605" y="132" font-weight="bold">5</text><text x="695" y="132">6</text>
    <text x="785" y="132">7</text>

    <text x="245" y="164">100</text><text x="335" y="164">200</text>
    <text x="425" y="164">300</text><text x="515" y="164">50</text>
    <text x="605" y="164">400</text><text x="695" y="164">10</text>
    <text x="785" y="164">500</text>
  </g>
  <line x1="30" y1="180" x2="840" y2="180" stroke="#3b3b3b" stroke-width="1"/>

  <!-- 현재 행 표시 -->
  <rect x="562" y="80" width="86" height="96" fill="none" stroke="#1b1b1b" stroke-width="2"/>
  <text x="605" y="198" font-size="13" text-anchor="middle" fill="#1b1b1b">현재 행</text>

  <!-- ROWS: 3,4,5 -->
  <text x="40" y="238" font-size="14" font-weight="bold" fill="#1b1b1b">ROWS</text>
  <text x="40" y="256" font-size="13" fill="#555">행 3개</text>
  <rect x="384" y="222" width="262" height="30" rx="4" fill="#e8e8e8" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="515" y="242" font-size="14" text-anchor="middle" fill="#1b1b1b">주문 3·4·5 = 750</text>
  <text x="660" y="242" font-size="13" fill="#555">같은 날 6번이 빠진다</text>

  <!-- RANGE: day 3..5 -->
  <text x="40" y="298" font-size="14" font-weight="bold" fill="#2d6a4f">RANGE</text>
  <text x="40" y="316" font-size="13" fill="#2d6a4f">값 거리 2 이내</text>
  <rect x="384" y="282" width="352" height="30" rx="4" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="560" y="302" font-size="14" text-anchor="middle" fill="#2d6a4f">day_no 3~5 = 760</text>

  <!-- GROUPS: groups day 2,3,5 -->
  <text x="40" y="358" font-size="14" font-weight="bold" fill="#b45309">GROUPS</text>
  <text x="40" y="376" font-size="13" fill="#b45309">날짜 묶음 3개</text>
  <rect x="294" y="342" width="442" height="30" rx="4" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="515" y="362" font-size="14" text-anchor="middle" fill="#b45309">day_no 2·3·5 묶음 = 960</text>

  <rect x="30" y="398" width="820" height="56" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="46" y="422" font-size="13" fill="#1b1b1b">ROWS는 행을 세고, RANGE는 ORDER BY 값의 차이를 재고, GROUPS는 값이 같은 묶음을 센다.</text>
  <text x="46" y="442" font-size="13" fill="#555">10월 4일 묶음이 없으므로 GROUPS의 "앞 묶음 2개"는 10월 2일까지 거슬러 올라간다.</text>
</svg>
