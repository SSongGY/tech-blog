<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
  </defs>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">INSERT 한 행이 ON CONFLICT 를 만났을 때</text>

  <!-- 새 행 -->
  <rect x="30" y="170" width="150" height="60" rx="6" fill="#f1f3f5" stroke="#495057"/>
  <text x="105" y="196" text-anchor="middle" font-size="14" fill="#1b1b1b">넣으려는 새 행</text>
  <text x="105" y="216" text-anchor="middle" font-size="13" fill="#495057">excluded.*</text>

  <!-- 판정 -->
  <rect x="230" y="160" width="170" height="80" rx="6" fill="#f1f3f5" stroke="#495057"/>
  <text x="315" y="190" text-anchor="middle" font-size="14" fill="#1b1b1b">PK·UNIQUE 중</text>
  <text x="315" y="210" text-anchor="middle" font-size="14" fill="#1b1b1b">어느 제약과</text>
  <text x="315" y="230" text-anchor="middle" font-size="14" fill="#1b1b1b">겹치는가</text>
  <line x1="180" y1="200" x2="228" y2="200" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 갈래 1: 겹치지 않음 -->
  <line x1="400" y1="175" x2="478" y2="82" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="118" font-size="13" fill="#2d6a4f">없음</text>
  <rect x="480" y="56" width="370" height="50" rx="6" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="496" y="86" font-size="14" fill="#1b1b1b">그냥 INSERT — 새 행이 들어간다</text>

  <!-- 갈래 2: 충돌 대상 -->
  <line x1="400" y1="200" x2="478" y2="170" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="404" y="176" font-size="13" fill="#495057">충돌 대상</text>
  <rect x="480" y="126" width="170" height="76" rx="6" fill="#f1f3f5" stroke="#495057"/>
  <text x="565" y="158" text-anchor="middle" font-size="14" fill="#1b1b1b">DO NOTHING</text>
  <text x="565" y="180" text-anchor="middle" font-size="13" fill="#495057">기존 행 그대로</text>
  <rect x="660" y="126" width="190" height="76" rx="6" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="755" y="148" text-anchor="middle" font-size="14" fill="#1b1b1b">DO UPDATE SET …</text>
  <text x="755" y="170" text-anchor="middle" font-size="13" fill="#495057">기존 행을 고친다</text>
  <text x="755" y="192" text-anchor="middle" font-size="13" fill="#b45309">WHERE 거짓이면 그대로</text>

  <!-- 갈래 3: 다른 제약 -->
  <line x1="400" y1="225" x2="478" y2="248" stroke="#9d0208" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="272" font-size="13" fill="#9d0208">대상이 아닌 제약</text>
  <rect x="480" y="214" width="370" height="50" rx="6" fill="#f8d7da" stroke="#9d0208"/>
  <text x="496" y="244" font-size="14" fill="#1b1b1b">에러 — 문장 전체를 되돌린다 (ABORT)</text>

  <!-- 비교: OR REPLACE -->
  <line x1="20" y1="300" x2="860" y2="300" stroke="#ced4da"/>
  <text x="30" y="328" font-size="14" font-weight="bold" fill="#b45309">비교: INSERT OR REPLACE</text>
  <rect x="30" y="342" width="240" height="50" rx="6" fill="#fff3cd" stroke="#b45309"/>
  <text x="150" y="372" text-anchor="middle" font-size="14" fill="#1b1b1b">겹치는 기존 행을 지운다</text>
  <line x1="270" y1="367" x2="318" y2="367" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="320" y="342" width="240" height="50" rx="6" fill="#fff3cd" stroke="#b45309"/>
  <text x="440" y="372" text-anchor="middle" font-size="14" fill="#1b1b1b">새 행을 넣는다</text>
  <text x="580" y="362" font-size="13" fill="#b45309">적지 않은 컬럼은 기본값·NULL,</text>
  <text x="580" y="382" font-size="13" fill="#b45309">rowid 도 새로 받는다</text>

  <text x="30" y="420" font-size="13" fill="#495057">충돌 대상을 생략한 마지막 ON CONFLICT 는 앞 절이 잡지 않은 모든 PK·UNIQUE 충돌에 걸린다.</text>
</svg>
