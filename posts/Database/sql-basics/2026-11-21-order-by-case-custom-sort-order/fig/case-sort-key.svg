<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>

  <text x="440" y="30" font-size="17" font-weight="bold" text-anchor="middle" fill="#222222">ORDER BY CASE — 값을 정렬 키로 바꾼 뒤 그 키로 정렬한다</text>

  <!-- 1행: ELSE 없음 -->
  <text x="30" y="72" font-size="15" font-weight="bold" fill="#9d0208">① ELSE 없는 CASE</text>
  <rect x="30" y="85" width="170" height="96" rx="6" fill="#f4f4f4" stroke="#666666"/>
  <text x="115" y="108" font-size="14" text-anchor="middle" fill="#222222">priority 값</text>
  <text x="115" y="134" font-size="13" text-anchor="middle" fill="#222222">high · medium · low</text>
  <text x="115" y="158" font-size="13" text-anchor="middle" fill="#222222">later · NULL</text>

  <rect x="240" y="85" width="180" height="96" rx="6" fill="#fdecea" stroke="#9d0208"/>
  <text x="330" y="112" font-size="14" text-anchor="middle" fill="#222222">CASE priority</text>
  <text x="330" y="136" font-size="13" text-anchor="middle" fill="#222222">WHEN 세 개만 있음</text>
  <text x="330" y="160" font-size="13" text-anchor="middle" fill="#9d0208">맞는 WHEN 없음 → NULL</text>

  <rect x="460" y="85" width="160" height="96" rx="6" fill="#f4f4f4" stroke="#666666"/>
  <text x="540" y="112" font-size="14" text-anchor="middle" fill="#222222">정렬 키</text>
  <text x="540" y="138" font-size="13" text-anchor="middle" fill="#222222">1 · 2 · 3</text>
  <text x="540" y="162" font-size="13" text-anchor="middle" fill="#9d0208">NULL · NULL</text>

  <rect x="660" y="85" width="190" height="96" rx="6" fill="#fdecea" stroke="#9d0208"/>
  <text x="755" y="112" font-size="14" text-anchor="middle" fill="#222222">오름차순 결과</text>
  <text x="755" y="138" font-size="13" text-anchor="middle" fill="#9d0208">NULL · NULL · 1 · 2 · 3</text>
  <text x="755" y="162" font-size="13" text-anchor="middle" fill="#9d0208">모르는 값이 맨 위</text>

  <line x1="200" y1="133" x2="236" y2="133" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="133" x2="456" y2="133" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="133" x2="656" y2="133" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2행: ELSE 9 -->
  <text x="30" y="232" font-size="15" font-weight="bold" fill="#2d6a4f">② ELSE 9 를 붙인 CASE</text>
  <rect x="30" y="245" width="170" height="96" rx="6" fill="#f4f4f4" stroke="#666666"/>
  <text x="115" y="268" font-size="14" text-anchor="middle" fill="#222222">priority 값</text>
  <text x="115" y="294" font-size="13" text-anchor="middle" fill="#222222">high · medium · low</text>
  <text x="115" y="318" font-size="13" text-anchor="middle" fill="#222222">later · NULL</text>

  <rect x="240" y="245" width="180" height="96" rx="6" fill="#e8f3ee" stroke="#2d6a4f"/>
  <text x="330" y="272" font-size="14" text-anchor="middle" fill="#222222">CASE priority</text>
  <text x="330" y="296" font-size="13" text-anchor="middle" fill="#222222">WHEN 세 개</text>
  <text x="330" y="320" font-size="13" text-anchor="middle" fill="#2d6a4f">나머지는 ELSE → 9</text>

  <rect x="460" y="245" width="160" height="96" rx="6" fill="#f4f4f4" stroke="#666666"/>
  <text x="540" y="272" font-size="14" text-anchor="middle" fill="#222222">정렬 키</text>
  <text x="540" y="298" font-size="13" text-anchor="middle" fill="#222222">1 · 2 · 3</text>
  <text x="540" y="322" font-size="13" text-anchor="middle" fill="#2d6a4f">9 · 9</text>

  <rect x="660" y="245" width="190" height="96" rx="6" fill="#e8f3ee" stroke="#2d6a4f"/>
  <text x="755" y="272" font-size="14" text-anchor="middle" fill="#222222">오름차순 결과</text>
  <text x="755" y="298" font-size="13" text-anchor="middle" fill="#2d6a4f">1 · 2 · 3 · 9 · 9</text>
  <text x="755" y="322" font-size="13" text-anchor="middle" fill="#2d6a4f">모르는 값이 맨 뒤</text>

  <line x1="200" y1="293" x2="236" y2="293" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="293" x2="456" y2="293" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="293" x2="656" y2="293" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="440" y="368" font-size="13" text-anchor="middle" fill="#555555">SQLite 는 오름차순에서 NULL 을 어떤 값보다 작게 본다.</text>
  <text x="440" y="388" font-size="13" text-anchor="middle" fill="#555555">원래 값(priority)은 결과에 그대로 남고, 정렬 키는 순서를 정하는 데만 쓰인다.</text>
</svg>
