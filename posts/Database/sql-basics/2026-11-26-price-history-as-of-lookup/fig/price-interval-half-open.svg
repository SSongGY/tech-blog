<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="330" fill="#fafaf7"/>
  <text x="440" y="34" font-size="17" font-weight="bold" text-anchor="middle" fill="#1b1b1b">상품 P01의 가격 구간과 주문 4건 — 시작일은 포함, 다음 시작일은 제외</text>

  <!-- 가격 구간 막대 -->
  <rect x="100" y="80" width="200" height="44" fill="#e6f0ea" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="200" y="107" font-size="15" text-anchor="middle" fill="#1b1b1b">1,000원</text>
  <rect x="300" y="80" width="313" height="44" fill="#d3e6da" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="456" y="107" font-size="15" text-anchor="middle" fill="#1b1b1b">1,200원</text>
  <rect x="613" y="80" width="207" height="44" fill="#e6f0ea" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="716" y="107" font-size="15" text-anchor="middle" fill="#1b1b1b">1,100원</text>
  <text x="840" y="107" font-size="14" text-anchor="middle" fill="#555555">이후</text>

  <!-- 구간의 시작(채운 점) -->
  <circle cx="100" cy="80" r="5" fill="#2d6a4f"/>
  <circle cx="300" cy="80" r="5" fill="#2d6a4f"/>
  <circle cx="613" cy="80" r="5" fill="#2d6a4f"/>
  <text x="100" y="66" font-size="13" text-anchor="middle" fill="#1b1b1b">valid_from 01-01</text>
  <text x="300" y="66" font-size="13" text-anchor="middle" fill="#1b1b1b">03-01</text>
  <text x="613" y="66" font-size="13" text-anchor="middle" fill="#1b1b1b">06-01</text>

  <!-- 주문 위치 -->
  <line x1="147" y1="124" x2="147" y2="180" stroke="#555555" stroke-width="1.5"/>
  <line x1="300" y1="124" x2="300" y2="180" stroke="#b45309" stroke-width="2"/>
  <line x1="609" y1="124" x2="609" y2="180" stroke="#b45309" stroke-width="2"/>
  <line x1="745" y1="124" x2="745" y2="180" stroke="#555555" stroke-width="1.5"/>

  <rect x="82" y="180" width="130" height="50" fill="#ffffff" stroke="#555555" stroke-width="1.2"/>
  <text x="147" y="201" font-size="14" text-anchor="middle" fill="#1b1b1b">주문 1 · 01-15</text>
  <text x="147" y="221" font-size="14" text-anchor="middle" fill="#2d6a4f">1,000원</text>

  <rect x="235" y="180" width="130" height="50" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="300" y="201" font-size="14" text-anchor="middle" fill="#1b1b1b">주문 2 · 03-01</text>
  <text x="300" y="221" font-size="14" text-anchor="middle" fill="#2d6a4f">1,200원</text>

  <rect x="479" y="180" width="130" height="50" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="544" y="201" font-size="14" text-anchor="middle" fill="#1b1b1b">주문 3 · 05-31</text>
  <text x="544" y="221" font-size="14" text-anchor="middle" fill="#2d6a4f">1,200원</text>

  <rect x="680" y="180" width="130" height="50" fill="#ffffff" stroke="#555555" stroke-width="1.2"/>
  <text x="745" y="201" font-size="14" text-anchor="middle" fill="#1b1b1b">주문 4 · 07-10</text>
  <text x="745" y="221" font-size="14" text-anchor="middle" fill="#2d6a4f">1,100원</text>

  <!-- 설명 -->
  <text x="300" y="254" font-size="13" text-anchor="middle" fill="#b45309">가격이 바뀐 날 → 새 가격</text>
  <text x="544" y="254" font-size="13" text-anchor="middle" fill="#b45309">바뀌기 하루 전 → 이전 가격</text>
  <text x="440" y="292" font-size="14" text-anchor="middle" fill="#1b1b1b">조건: valid_from &lt;= order_date 그리고 order_date &lt; 다음 valid_from</text>
  <text x="440" y="314" font-size="13" text-anchor="middle" fill="#9d0208">끝을 &lt;= 로 닫으면 주문 2가 1,000원 구간과 1,200원 구간에 모두 걸린다</text>
</svg>
