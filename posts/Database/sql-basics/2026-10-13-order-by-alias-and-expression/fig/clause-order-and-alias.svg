<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="330" fill="#fbfbf9"/>

  <text x="30" y="26" font-size="15" font-weight="bold" fill="#1b1b1b">절이 처리되는 차례와 별칭이 생기는 자리</text>

  <!-- 구간 표시 -->
  <line x1="30" y1="68" x2="490" y2="68" stroke="#9d0208" stroke-width="1.5"/>
  <line x1="30" y1="68" x2="30" y2="76" stroke="#9d0208" stroke-width="1.5"/>
  <line x1="490" y1="68" x2="490" y2="76" stroke="#9d0208" stroke-width="1.5"/>
  <text x="260" y="61" font-size="13" fill="#9d0208" text-anchor="middle">별칭이 아직 없다</text>

  <line x1="630" y1="68" x2="850" y2="68" stroke="#2d6a4f" stroke-width="1.5"/>
  <line x1="630" y1="68" x2="630" y2="76" stroke="#2d6a4f" stroke-width="1.5"/>
  <line x1="850" y1="68" x2="850" y2="76" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="740" y="61" font-size="13" fill="#2d6a4f" text-anchor="middle">별칭을 쓸 수 있다</text>

  <text x="560" y="61" font-size="13" fill="#b45309" text-anchor="middle">별칭 생성</text>

  <!-- 절 박스 -->
  <g stroke="#555" stroke-width="1.2" fill="#ffffff">
    <rect x="30"  y="80" width="100" height="56" rx="4"/>
    <rect x="150" y="80" width="100" height="56" rx="4"/>
    <rect x="270" y="80" width="100" height="56" rx="4"/>
    <rect x="390" y="80" width="100" height="56" rx="4"/>
    <rect x="630" y="80" width="100" height="56" rx="4"/>
    <rect x="750" y="80" width="100" height="56" rx="4"/>
  </g>
  <rect x="510" y="80" width="100" height="56" rx="4" fill="#fdf0dc" stroke="#b45309" stroke-width="1.8"/>

  <g font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">
    <text x="80"  y="103">FROM</text>
    <text x="200" y="103">WHERE</text>
    <text x="320" y="103">GROUP BY</text>
    <text x="440" y="103">HAVING</text>
    <text x="560" y="103">SELECT</text>
    <text x="680" y="103">DISTINCT</text>
    <text x="800" y="103">ORDER BY</text>
  </g>
  <g font-size="13" fill="#444" text-anchor="middle">
    <text x="80"  y="124">표를 읽는다</text>
    <text x="200" y="124">행을 거른다</text>
    <text x="320" y="124">행을 묶는다</text>
    <text x="440" y="124">묶음을 거른다</text>
    <text x="560" y="124">별칭이 생긴다</text>
    <text x="680" y="124">중복을 뺀다</text>
    <text x="800" y="124">정렬한다</text>
  </g>

  <!-- 화살표 -->
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <g stroke="#555" stroke-width="1.4" marker-end="url(#ar)">
    <line x1="130" y1="108" x2="146" y2="108"/>
    <line x1="250" y1="108" x2="266" y2="108"/>
    <line x1="370" y1="108" x2="386" y2="108"/>
    <line x1="490" y1="108" x2="506" y2="108"/>
    <line x1="610" y1="108" x2="626" y2="108"/>
    <line x1="730" y1="108" x2="746" y2="108"/>
  </g>

  <text x="30" y="166" font-size="13" fill="#444">WHERE·GROUP BY·HAVING은 SELECT보다 먼저 처리되므로, 표준 SQL에서 이 세 절은 별칭을 읽지 못한다.</text>
  <text x="30" y="186" font-size="13" fill="#b45309">다만 SQLite는 WHERE에서도 별칭을 받아 준다 — 표준에 없는 확장이다(실습 6번).</text>

  <!-- 이름 충돌 -->
  <text x="30" y="224" font-size="14" font-weight="bold" fill="#1b1b1b">같은 이름이 별칭에도 있고 원래 컬럼에도 있을 때 어느 쪽을 가리키는가</text>

  <rect x="30"  y="238" width="260" height="72" rx="4" fill="#eef6f1" stroke="#2d6a4f" stroke-width="1.5"/>
  <rect x="310" y="238" width="260" height="72" rx="4" fill="#fdf0dc" stroke="#b45309" stroke-width="1.5"/>
  <rect x="590" y="238" width="260" height="72" rx="4" fill="#fdf0dc" stroke="#b45309" stroke-width="1.5"/>

  <g font-size="14" font-weight="bold" fill="#1b1b1b">
    <text x="46" y="261">ORDER BY</text>
    <text x="326" y="261">GROUP BY</text>
    <text x="606" y="261">WHERE</text>
  </g>
  <g font-size="13" fill="#1b1b1b">
    <text x="46" y="283">별칭이 이긴다</text>
    <text x="326" y="283">원래 컬럼이 이긴다</text>
    <text x="606" y="283">원래 컬럼이 이긴다</text>
  </g>
  <g font-size="13" fill="#555">
    <text x="46" y="302">실습 11번</text>
    <text x="326" y="302">실습 14b번</text>
    <text x="606" y="302">실습 12번</text>
  </g>
</svg>
