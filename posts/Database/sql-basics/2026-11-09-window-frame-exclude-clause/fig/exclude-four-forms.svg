<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="380" fill="#fbfaf7"/>

  <text x="40" y="34" font-size="18" font-weight="bold" fill="#1b1b1b">현재 행이 나래일 때 EXCLUDE 네 가지가 프레임에서 빼는 행</text>
  <text x="40" y="58" font-size="13" fill="#444">개발 부서 4명, ORDER BY salary, 프레임은 파티션 전체(ROWS UNBOUNDED PRECEDING ~ UNBOUNDED FOLLOWING)</text>

  <!-- 열 머리: 사람 -->
  <g font-size="14" text-anchor="middle" fill="#1b1b1b">
    <text x="330" y="96">가온 300</text>
    <text x="462" y="96" font-weight="bold">나래 400</text>
    <text x="594" y="96">다온 400</text>
    <text x="726" y="96">라온 500</text>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="462" y="114" fill="#b45309">현재 행</text>
    <text x="594" y="114" fill="#b45309">현재 행과 동점</text>
  </g>
  <text x="830" y="96" font-size="13" text-anchor="middle" fill="#333">남는 행</text>

  <!-- 행 머리: EXCLUDE 형태 -->
  <g font-size="14" fill="#1b1b1b">
    <text x="40" y="149">NO OTHERS (기본)</text>
    <text x="40" y="199">CURRENT ROW</text>
    <text x="40" y="249">GROUP</text>
    <text x="40" y="299">TIES</text>
  </g>

  <!-- 포함 칸 -->
  <g fill="#e3f1e8" stroke="#2d6a4f" stroke-width="1.4">
    <rect x="270" y="126" width="120" height="36" rx="4"/>
    <rect x="402" y="126" width="120" height="36" rx="4"/>
    <rect x="534" y="126" width="120" height="36" rx="4"/>
    <rect x="666" y="126" width="120" height="36" rx="4"/>

    <rect x="270" y="176" width="120" height="36" rx="4"/>
    <rect x="534" y="176" width="120" height="36" rx="4"/>
    <rect x="666" y="176" width="120" height="36" rx="4"/>

    <rect x="270" y="226" width="120" height="36" rx="4"/>
    <rect x="666" y="226" width="120" height="36" rx="4"/>

    <rect x="270" y="276" width="120" height="36" rx="4"/>
    <rect x="402" y="276" width="120" height="36" rx="4"/>
    <rect x="666" y="276" width="120" height="36" rx="4"/>
  </g>
  <!-- 제외 칸 -->
  <g fill="#f4eeee" stroke="#9d0208" stroke-width="1.4" stroke-dasharray="5 3">
    <rect x="402" y="176" width="120" height="36" rx="4"/>
    <rect x="402" y="226" width="120" height="36" rx="4"/>
    <rect x="534" y="226" width="120" height="36" rx="4"/>
    <rect x="534" y="276" width="120" height="36" rx="4"/>
  </g>

  <g font-size="13" text-anchor="middle" fill="#1d4733">
    <text x="330" y="149">포함</text><text x="462" y="149">포함</text><text x="594" y="149">포함</text><text x="726" y="149">포함</text>
    <text x="330" y="199">포함</text><text x="594" y="199">포함</text><text x="726" y="199">포함</text>
    <text x="330" y="249">포함</text><text x="726" y="249">포함</text>
    <text x="330" y="299">포함</text><text x="462" y="299">포함</text><text x="726" y="299">포함</text>
  </g>
  <g font-size="13" text-anchor="middle" fill="#9d0208">
    <text x="462" y="199">제외</text>
    <text x="462" y="249">제외</text><text x="594" y="249">제외</text>
    <text x="594" y="299">제외</text>
  </g>

  <g font-size="14" text-anchor="middle" fill="#1b1b1b">
    <text x="830" y="149">4</text>
    <text x="830" y="199">3</text>
    <text x="830" y="249">2</text>
    <text x="830" y="299">3</text>
  </g>

  <text x="40" y="344" font-size="13" fill="#333">동점(peer) = ORDER BY 값이 같은 행. ROWS 프레임이어도 GROUP·TIES 는 동점을 이 기준으로 가른다.</text>
  <text x="40" y="366" font-size="13" fill="#333">CURRENT ROW 는 나만, GROUP 은 나와 동점 전부, TIES 는 나를 남기고 동점만 뺀다.</text>
</svg>
