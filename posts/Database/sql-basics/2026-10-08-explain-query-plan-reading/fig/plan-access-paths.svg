<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="450" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <text x="440" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#222222">계획의 낱말이 가리키는 읽기 경로 — 사원 5,000행, dept_id = 3 은 500행</text>

  <!-- 1. SCAN -->
  <text x="20" y="84" font-size="15" font-weight="bold" fill="#9d0208">SCAN employee</text>
  <text x="20" y="104" font-size="13" fill="#555555">VDBE 명령 16,008개 (2-A)</text>
  <rect x="250" y="66" width="190" height="52" rx="6" fill="#fdecec" stroke="#9d0208" stroke-width="1.5"/>
  <text x="345" y="88" text-anchor="middle" font-size="14" fill="#222222">employee 표</text>
  <text x="345" y="107" text-anchor="middle" font-size="13" fill="#9d0208">5,000행을 모두 읽음</text>
  <rect x="480" y="66" width="190" height="52" rx="6" fill="#f5f5f5" stroke="#888888" stroke-width="1.5"/>
  <text x="575" y="88" text-anchor="middle" font-size="14" fill="#222222">행마다 조건 검사</text>
  <text x="575" y="107" text-anchor="middle" font-size="13" fill="#555555">4,500행 버림</text>
  <rect x="710" y="66" width="150" height="52" rx="6" fill="#f5f5f5" stroke="#888888" stroke-width="1.5"/>
  <text x="785" y="97" text-anchor="middle" font-size="14" fill="#222222">결과 500행</text>
  <line x1="440" y1="92" x2="476" y2="92" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="670" y1="92" x2="706" y2="92" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. SEARCH USING INDEX -->
  <text x="20" y="174" font-size="15" font-weight="bold" fill="#2d6a4f">SEARCH … USING INDEX</text>
  <text x="20" y="194" font-size="13" fill="#555555">VDBE 명령 2,509개 (2-B)</text>
  <rect x="250" y="156" width="190" height="52" rx="6" fill="#e8f3ee" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="345" y="178" text-anchor="middle" font-size="14" fill="#222222">ix_employee_dept</text>
  <text x="345" y="197" text-anchor="middle" font-size="13" fill="#2d6a4f">dept_id = 3 구간만</text>
  <rect x="480" y="156" width="190" height="52" rx="6" fill="#f5f5f5" stroke="#888888" stroke-width="1.5"/>
  <text x="575" y="178" text-anchor="middle" font-size="14" fill="#222222">employee 표</text>
  <text x="575" y="197" text-anchor="middle" font-size="13" fill="#555555">rowid로 500번 찾아감</text>
  <rect x="710" y="156" width="150" height="52" rx="6" fill="#f5f5f5" stroke="#888888" stroke-width="1.5"/>
  <text x="785" y="187" text-anchor="middle" font-size="14" fill="#222222">결과 500행</text>
  <line x1="440" y1="182" x2="476" y2="182" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="670" y1="182" x2="706" y2="182" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. COVERING INDEX -->
  <text x="20" y="264" font-size="15" font-weight="bold" fill="#2d6a4f">… COVERING INDEX</text>
  <text x="20" y="284" font-size="13" fill="#555555">VDBE 명령 2,009개 (2-D)</text>
  <rect x="250" y="246" width="190" height="52" rx="6" fill="#e8f3ee" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="345" y="268" text-anchor="middle" font-size="14" fill="#222222">ix_employee_dept</text>
  <text x="345" y="287" text-anchor="middle" font-size="13" fill="#2d6a4f">필요한 값이 다 있음</text>
  <text x="575" y="266" text-anchor="middle" font-size="13" fill="#555555">표를 읽지 않는다</text>
  <rect x="710" y="246" width="150" height="52" rx="6" fill="#f5f5f5" stroke="#888888" stroke-width="1.5"/>
  <text x="785" y="277" text-anchor="middle" font-size="14" fill="#222222">결과 500행</text>
  <line x1="440" y1="278" x2="706" y2="278" stroke="#2d6a4f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- 4. USE TEMP B-TREE -->
  <text x="20" y="354" font-size="15" font-weight="bold" fill="#b45309">USE TEMP B-TREE</text>
  <text x="20" y="374" font-size="13" fill="#555555">VDBE 명령 50,009개 (4-A)</text>
  <rect x="250" y="336" width="190" height="52" rx="6" fill="#fdecec" stroke="#9d0208" stroke-width="1.5"/>
  <text x="345" y="358" text-anchor="middle" font-size="14" fill="#222222">employee 표</text>
  <text x="345" y="377" text-anchor="middle" font-size="13" fill="#9d0208">5,000행을 모두 읽음</text>
  <rect x="480" y="336" width="190" height="52" rx="6" fill="#fdf3e6" stroke="#b45309" stroke-width="1.5"/>
  <text x="575" y="358" text-anchor="middle" font-size="14" fill="#222222">임시 B-Tree</text>
  <text x="575" y="377" text-anchor="middle" font-size="13" fill="#b45309">salary 순으로 다시 쌓음</text>
  <rect x="710" y="336" width="150" height="52" rx="6" fill="#f5f5f5" stroke="#888888" stroke-width="1.5"/>
  <text x="785" y="367" text-anchor="middle" font-size="14" fill="#222222">결과 5,000행</text>
  <line x1="440" y1="362" x2="476" y2="362" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="670" y1="362" x2="706" y2="362" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="20" y="425" font-size="13" fill="#555555">빨강 = 표 전체를 읽는 경로 · 초록 = 인덱스로 구간만 읽는 경로 · 주황 = 결과를 한 번 더 정렬하는 단계</text>
</svg>
