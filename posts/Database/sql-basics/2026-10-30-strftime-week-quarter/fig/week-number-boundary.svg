<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 368" width="880" height="368" font-family="'Malgun Gothic','Segoe UI',sans-serif">
  <rect x="0" y="0" width="880" height="368" fill="#fbfbf8"/>

  <text x="14" y="26" font-size="16" font-weight="bold" fill="#1b1b1b">2025년 12월 28일부터 2026년 1월 11일까지 — %U · %V · %W 가 1주차를 세기 시작하는 지점</text>

  <text x="14" y="62" font-size="13" fill="#444">날짜</text>
  <text x="14" y="88" font-size="13" fill="#444">요일</text>

  <g font-size="13" fill="#1b1b1b" text-anchor="middle">
    <text x="184" y="62">12/28</text>
    <text x="231" y="62">12/29</text>
    <text x="278" y="62">12/30</text>
    <text x="325" y="62">12/31</text>
    <text x="372" y="62">1/1</text>
    <text x="419" y="62">1/2</text>
    <text x="466" y="62">1/3</text>
    <text x="513" y="62">1/4</text>
    <text x="560" y="62">1/5</text>
    <text x="607" y="62">1/6</text>
    <text x="654" y="62">1/7</text>
    <text x="701" y="62">1/8</text>
    <text x="748" y="62">1/9</text>
    <text x="795" y="62">1/10</text>
    <text x="842" y="62">1/11</text>
  </g>
  <g font-size="13" fill="#555" text-anchor="middle">
    <text x="184" y="88">일</text>
    <text x="231" y="88">월</text>
    <text x="278" y="88">화</text>
    <text x="325" y="88">수</text>
    <text x="372" y="88">목</text>
    <text x="419" y="88">금</text>
    <text x="466" y="88">토</text>
    <text x="513" y="88">일</text>
    <text x="560" y="88">월</text>
    <text x="607" y="88">화</text>
    <text x="654" y="88">수</text>
    <text x="701" y="88">목</text>
    <text x="748" y="88">금</text>
    <text x="795" y="88">토</text>
    <text x="842" y="88">일</text>
  </g>

  <!-- %U 행: 첫 일요일(1/4)부터 1주차 -->
  <text x="14" y="121" font-size="14" font-weight="bold" fill="#1b1b1b">%U</text>
  <text x="48" y="121" font-size="13" fill="#555">일요일 기준</text>
  <rect x="160" y="102" width="329" height="28" fill="#eceae4" stroke="#bbb"/>
  <rect x="489" y="102" width="329" height="28" fill="#d7e8dd" stroke="#2d6a4f" stroke-width="2"/>
  <rect x="818" y="102" width="47" height="28" fill="#eceae4" stroke="#bbb"/>
  <g font-size="13" text-anchor="middle">
    <text x="184" y="121" fill="#555">52</text>
    <text x="231" y="121" fill="#555">52</text>
    <text x="278" y="121" fill="#555">52</text>
    <text x="325" y="121" fill="#555">52</text>
    <text x="372" y="121" fill="#555">00</text>
    <text x="419" y="121" fill="#555">00</text>
    <text x="466" y="121" fill="#555">00</text>
    <text x="513" y="121" fill="#2d6a4f" font-weight="bold">01</text>
    <text x="560" y="121" fill="#2d6a4f">01</text>
    <text x="607" y="121" fill="#2d6a4f">01</text>
    <text x="654" y="121" fill="#2d6a4f">01</text>
    <text x="701" y="121" fill="#2d6a4f">01</text>
    <text x="748" y="121" fill="#2d6a4f">01</text>
    <text x="795" y="121" fill="#2d6a4f">01</text>
    <text x="842" y="121" fill="#555">02</text>
  </g>

  <!-- %V 행: ISO. 1월 1일이 목요일이라 12/29 부터 2026년 1주차 -->
  <text x="14" y="161" font-size="14" font-weight="bold" fill="#1b1b1b">%V</text>
  <text x="48" y="161" font-size="13" fill="#555">ISO 8601</text>
  <rect x="160" y="142" width="47" height="28" fill="#eceae4" stroke="#bbb"/>
  <rect x="207" y="142" width="141" height="28" fill="#fae6c8" stroke="#b45309" stroke-width="2"/>
  <rect x="348" y="142" width="188" height="28" fill="#d7e8dd" stroke="#2d6a4f" stroke-width="2"/>
  <rect x="536" y="142" width="329" height="28" fill="#eceae4" stroke="#bbb"/>
  <g font-size="13" text-anchor="middle">
    <text x="184" y="161" fill="#555">52</text>
    <text x="231" y="161" fill="#b45309" font-weight="bold">01</text>
    <text x="278" y="161" fill="#b45309">01</text>
    <text x="325" y="161" fill="#b45309">01</text>
    <text x="372" y="161" fill="#2d6a4f">01</text>
    <text x="419" y="161" fill="#2d6a4f">01</text>
    <text x="466" y="161" fill="#2d6a4f">01</text>
    <text x="513" y="161" fill="#2d6a4f">01</text>
    <text x="560" y="161" fill="#555">02</text>
    <text x="607" y="161" fill="#555">02</text>
    <text x="654" y="161" fill="#555">02</text>
    <text x="701" y="161" fill="#555">02</text>
    <text x="748" y="161" fill="#555">02</text>
    <text x="795" y="161" fill="#555">02</text>
    <text x="842" y="161" fill="#555">02</text>
  </g>

  <!-- %W 행: 첫 월요일(1/5)부터 1주차 -->
  <text x="14" y="201" font-size="14" font-weight="bold" fill="#1b1b1b">%W</text>
  <text x="48" y="201" font-size="13" fill="#555">월요일 기준</text>
  <rect x="160" y="182" width="376" height="28" fill="#eceae4" stroke="#bbb"/>
  <rect x="536" y="182" width="329" height="28" fill="#d7e8dd" stroke="#2d6a4f" stroke-width="2"/>
  <g font-size="13" text-anchor="middle">
    <text x="184" y="201" fill="#555">51</text>
    <text x="231" y="201" fill="#555">52</text>
    <text x="278" y="201" fill="#555">52</text>
    <text x="325" y="201" fill="#555">52</text>
    <text x="372" y="201" fill="#555">00</text>
    <text x="419" y="201" fill="#555">00</text>
    <text x="466" y="201" fill="#555">00</text>
    <text x="513" y="201" fill="#555">00</text>
    <text x="560" y="201" fill="#2d6a4f" font-weight="bold">01</text>
    <text x="607" y="201" fill="#2d6a4f">01</text>
    <text x="654" y="201" fill="#2d6a4f">01</text>
    <text x="701" y="201" fill="#2d6a4f">01</text>
    <text x="748" y="201" fill="#2d6a4f">01</text>
    <text x="795" y="201" fill="#2d6a4f">01</text>
    <text x="842" y="201" fill="#2d6a4f">01</text>
  </g>

  <!-- 달력 연도가 바뀌는 자리 -->
  <line x1="348" y1="44" x2="348" y2="216" stroke="#9d0208" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="352" y="234" font-size="13" fill="#9d0208">여기서 %Y 가 2025 에서 2026 으로 바뀐다</text>

  <g font-size="13" fill="#333">
    <rect x="14" y="254" width="16" height="16" fill="#d7e8dd" stroke="#2d6a4f" stroke-width="2"/>
    <text x="40" y="267">그 방식이 2026년 1주차로 세는 구간. 시작 날짜가 방식마다 이레까지 벌어진다.</text>

    <rect x="14" y="282" width="16" height="16" fill="#fae6c8" stroke="#b45309" stroke-width="2"/>
    <text x="40" y="295">%V 로는 2026년 1주차인데 %Y 는 아직 2025 다. 이 사흘은 %G 가 2026 을 돌려준다.</text>
  </g>

  <text x="14" y="328" font-size="13" fill="#333">%U 와 %W 는 첫 일요일·첫 월요일 앞의 날들을 00 주차에 넣는다. 연초 며칠이 "0주차"가 된다.</text>
  <text x="14" y="352" font-size="13" fill="#333">%V 는 00 을 쓰지 않는다. 대신 전년도의 52 또는 53 주차로 넘긴다.</text>
</svg>
