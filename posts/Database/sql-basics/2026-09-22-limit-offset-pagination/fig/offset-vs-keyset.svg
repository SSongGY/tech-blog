<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="420" fill="#ffffff"/>

  <text x="440" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">같은 10행을 가져오는 두 방법 — 몇 행을 방문하는가</text>

  <!-- 1. OFFSET 방식 -->
  <text x="60" y="68" font-size="15" font-weight="bold" fill="#1b1b1b">① OFFSET 방식 — ORDER BY id LIMIT 10 OFFSET 100000</text>

  <rect x="60" y="88" width="380" height="34" fill="#f8d7da" stroke="#9d0208" stroke-width="1.5"/>
  <rect x="440" y="88" width="30" height="34" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="2"/>
  <rect x="470" y="88" width="350" height="34" fill="#f1f3f5" stroke="#ced4da" stroke-width="1"/>

  <text x="250" y="110" text-anchor="middle" font-size="13" fill="#9d0208">읽고 나서 버리는 100,000행</text>
  <text x="645" y="110" text-anchor="middle" font-size="13" fill="#6c757d">보지 않는 나머지</text>

  <line x1="455" y1="122" x2="455" y2="136" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="455" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d6a4f">돌려주는 10행</text>

  <text x="60" y="180" font-size="14" font-weight="bold" fill="#9d0208">방문하는 행 = OFFSET + LIMIT = 100,010행</text>
  <text x="60" y="202" font-size="13" fill="#6c757d">실행 계획: SCAN article</text>

  <!-- 2. 키셋 방식 -->
  <text x="60" y="258" font-size="15" font-weight="bold" fill="#1b1b1b">② 키셋 방식 — WHERE id &gt; 100000 ORDER BY id LIMIT 10</text>

  <rect x="60" y="278" width="380" height="34" fill="#f1f3f5" stroke="#ced4da" stroke-width="1"/>
  <rect x="440" y="278" width="30" height="34" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="2"/>
  <rect x="470" y="278" width="350" height="34" fill="#f1f3f5" stroke="#ced4da" stroke-width="1"/>

  <text x="250" y="300" text-anchor="middle" font-size="13" fill="#6c757d">인덱스로 곧장 찾아간다</text>
  <text x="645" y="300" text-anchor="middle" font-size="13" fill="#6c757d">보지 않는 나머지</text>

  <line x1="455" y1="312" x2="455" y2="326" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="455" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d6a4f">돌려주는 10행</text>

  <text x="60" y="370" font-size="14" font-weight="bold" fill="#2d6a4f">방문하는 행 = LIMIT = 10행</text>
  <text x="60" y="392" font-size="13" fill="#6c757d">실행 계획: SEARCH article USING INTEGER PRIMARY KEY (rowid&gt;?)</text>

  <text x="820" y="412" text-anchor="end" font-size="13" fill="#6c757d">※ 초록 구간(10행)은 보이도록 넓게 그렸다. 전체는 200,000행.</text>
</svg>
