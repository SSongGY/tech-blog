<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#fbfbf8"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
    <marker id="arrowWarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <text x="40" y="30" font-size="16" font-weight="bold" fill="#1b1b1b">UPDATE … FROM 이 대상 행에 값을 넣는 경로</text>

  <text x="40" y="62" font-size="14" font-weight="bold" fill="#333">대상 표 product</text>
  <text x="300" y="62" font-size="14" font-weight="bold" fill="#333">조인 결과 — FROM 절과 WHERE 가 만든 행</text>
  <text x="620" y="62" font-size="14" font-weight="bold" fill="#333">갱신 결과</text>

  <!-- 대상 표 -->
  <rect x="40" y="80" width="160" height="30" rx="4" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="52" y="100" font-size="13" fill="#1b1b1b">1 키보드 38000</text>
  <rect x="40" y="130" width="160" height="30" rx="4" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="52" y="150" font-size="13" fill="#1b1b1b">2 마우스 19000</text>
  <rect x="40" y="185" width="160" height="30" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="52" y="205" font-size="13" fill="#1b1b1b">3 모니터 210000</text>
  <rect x="40" y="280" width="160" height="30" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="52" y="300" font-size="13" fill="#1b1b1b">4 웹캠 55000</text>

  <!-- 조인 결과 -->
  <rect x="300" y="80" width="250" height="30" rx="4" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="312" y="100" font-size="13" fill="#1b1b1b">1 · 가나상사 → 36500</text>
  <rect x="300" y="130" width="250" height="30" rx="4" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="312" y="150" font-size="13" fill="#1b1b1b">2 · 가나상사 → 17800</text>
  <rect x="300" y="170" width="250" height="30" rx="4" fill="#fdf3e4" stroke="#b45309" stroke-width="1.5"/>
  <text x="312" y="190" font-size="13" fill="#1b1b1b">3 · 가나상사 → 198000</text>
  <rect x="300" y="210" width="250" height="30" rx="4" fill="#fdf3e4" stroke="#b45309" stroke-width="1.5"/>
  <text x="312" y="230" font-size="13" fill="#1b1b1b">3 · 다라유통 → 203000</text>
  <rect x="300" y="280" width="250" height="30" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="312" y="300" font-size="13" fill="#4b5563">4 · 걸리는 행 없음</text>

  <!-- 갱신 결과 -->
  <rect x="620" y="80" width="230" height="30" rx="4" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="632" y="100" font-size="13" fill="#1b1b1b">1 키보드 36500</text>
  <rect x="620" y="130" width="230" height="30" rx="4" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="632" y="150" font-size="13" fill="#1b1b1b">2 마우스 17800</text>
  <rect x="620" y="190" width="230" height="30" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="632" y="210" font-size="13" fill="#1b1b1b">3 모니터 198000 또는 203000</text>
  <rect x="620" y="280" width="230" height="30" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="632" y="300" font-size="13" fill="#1b1b1b">4 웹캠 55000 — 손대지 않는다</text>

  <!-- 대상 표 → 조인 결과 -->
  <line x1="200" y1="95" x2="294" y2="95" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="145" x2="294" y2="145" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 200 200 L 250 200 L 250 185 L 294 185" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrowWarn)"/>
  <path d="M 200 200 L 250 200 L 250 225 L 294 225" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrowWarn)"/>
  <line x1="200" y1="295" x2="294" y2="295" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <!-- 조인 결과 → 갱신 결과 -->
  <line x1="550" y1="95" x2="614" y2="95" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="145" x2="614" y2="145" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 550 185 L 585 185 L 585 205 L 614 205" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrowWarn)"/>
  <path d="M 550 225 L 585 225 L 585 205 L 614 205" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrowWarn)"/>
  <text x="300" y="262" font-size="13" fill="#b45309">둘 중 한 행만 쓰인다 — 어느 쪽인지는 정해져 있지 않다</text>

  <line x1="40" y1="330" x2="850" y2="330" stroke="#d4d4d8" stroke-width="1"/>
  <text x="40" y="352" font-size="13" fill="#333">· 조인 결과에 안 나온 행(4번)은 UPDATE … FROM 이 건드리지 않는다. 상관 서브쿼리는 같은 자리에 NULL 을 넣는다.</text>
  <text x="40" y="374" font-size="13" fill="#333">· 한 대상 행에 조인 결과가 여럿이면(3번) 그중 한 행만 적용된다. SQLite 판이 바뀌거나 같은 문장을 다시 돌려도 달라질 수 있다.</text>
</svg>
