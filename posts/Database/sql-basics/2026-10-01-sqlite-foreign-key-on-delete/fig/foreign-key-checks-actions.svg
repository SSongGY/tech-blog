<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="490" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2933">외래 키가 검사하는 두 방향</text>
  <rect x="240" y="44" width="400" height="28" rx="4" fill="#fff8eb" stroke="#b45309"/>
  <text x="440" y="63" text-anchor="middle" font-size="13" fill="#b45309">PRAGMA foreign_keys = ON 인 연결에서만 (기본값 0)</text>

  <!-- 두 표 -->
  <rect x="40" y="96" width="280" height="78" rx="6" fill="#f8f9fa" stroke="#495057"/>
  <text x="180" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">부모 표 customer</text>
  <text x="180" y="148" text-anchor="middle" font-size="13" fill="#1f2933">부모 키: PRIMARY KEY 또는 UNIQUE</text>

  <rect x="560" y="96" width="280" height="78" rx="6" fill="#f8f9fa" stroke="#495057"/>
  <text x="700" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">자식 표 sale_order</text>
  <text x="700" y="148" text-anchor="middle" font-size="13" fill="#1f2933">자식 키: REFERENCES customer</text>

  <line x1="556" y1="135" x2="324" y2="135" stroke="#495057" stroke-width="1.5" marker-end="url(#gray)"/>
  <text x="440" y="127" text-anchor="middle" font-size="13" fill="#495057">자식 키가 부모 키를 가리킨다</text>

  <!-- 방향 1: 자식 쪽 쓰기 -->
  <line x1="700" y1="176" x2="700" y2="198" stroke="#495057" stroke-width="1.5" marker-end="url(#gray)"/>
  <rect x="560" y="202" width="280" height="96" rx="6" fill="#ffffff" stroke="#495057"/>
  <text x="700" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">① 자식에 쓸 때 (INSERT·UPDATE)</text>
  <text x="700" y="248" text-anchor="middle" font-size="13" fill="#2d6a4f">값이 부모에 있으면 통과</text>
  <text x="700" y="268" text-anchor="middle" font-size="13" fill="#b45309">값이 NULL이면 통과</text>
  <text x="700" y="288" text-anchor="middle" font-size="13" fill="#9d0208">없으면 FOREIGN KEY constraint failed</text>

  <!-- 방향 2: 부모 쪽 지우기 -->
  <text x="180" y="204" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">② 부모를 지울 때 (ON DELETE)</text>
  <text x="180" y="226" text-anchor="middle" font-size="13" fill="#495057">자식이 남아 있으면 정한 동작을 한다</text>
  <line x1="180" y1="176" x2="180" y2="188" stroke="#495057" stroke-width="1.5"/>
  <line x1="180" y1="234" x2="180" y2="316" stroke="#495057" stroke-width="1.5"/>
  <line x1="95" y1="316" x2="787" y2="316" stroke="#495057" stroke-width="1.5"/>
  <line x1="95" y1="316" x2="95" y2="336" stroke="#495057" stroke-width="1.5" marker-end="url(#gray)"/>
  <line x1="268" y1="316" x2="268" y2="336" stroke="#495057" stroke-width="1.5" marker-end="url(#gray)"/>
  <line x1="441" y1="316" x2="441" y2="336" stroke="#495057" stroke-width="1.5" marker-end="url(#gray)"/>
  <line x1="614" y1="316" x2="614" y2="336" stroke="#495057" stroke-width="1.5" marker-end="url(#gray)"/>
  <line x1="787" y1="316" x2="787" y2="336" stroke="#495057" stroke-width="1.5" marker-end="url(#gray)"/>

  <rect x="20" y="340" width="150" height="104" rx="6" fill="#fdecec" stroke="#9d0208"/>
  <text x="95" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d0208">NO ACTION</text>
  <text x="95" y="388" text-anchor="middle" font-size="13" fill="#1f2933">기본값</text>
  <text x="95" y="408" text-anchor="middle" font-size="13" fill="#1f2933">문장 끝에 검사</text>
  <text x="95" y="428" text-anchor="middle" font-size="13" fill="#1f2933">(지연이면 COMMIT 때)</text>

  <rect x="193" y="340" width="150" height="104" rx="6" fill="#fdecec" stroke="#9d0208"/>
  <text x="268" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d0208">RESTRICT</text>
  <text x="268" y="388" text-anchor="middle" font-size="13" fill="#1f2933">그 자리에서</text>
  <text x="268" y="408" text-anchor="middle" font-size="13" fill="#1f2933">바로 에러</text>
  <text x="268" y="428" text-anchor="middle" font-size="13" fill="#1f2933">(지연이어도)</text>

  <rect x="366" y="340" width="150" height="104" rx="6" fill="#e9f5ee" stroke="#2d6a4f"/>
  <text x="441" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">CASCADE</text>
  <text x="441" y="388" text-anchor="middle" font-size="13" fill="#1f2933">자식 행도</text>
  <text x="441" y="408" text-anchor="middle" font-size="13" fill="#1f2933">함께 지운다</text>

  <rect x="539" y="340" width="150" height="104" rx="6" fill="#e9f5ee" stroke="#2d6a4f"/>
  <text x="614" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">SET NULL</text>
  <text x="614" y="388" text-anchor="middle" font-size="13" fill="#1f2933">자식 키를</text>
  <text x="614" y="408" text-anchor="middle" font-size="13" fill="#1f2933">NULL로 바꾼다</text>

  <rect x="712" y="340" width="150" height="104" rx="6" fill="#e9f5ee" stroke="#2d6a4f"/>
  <text x="787" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a4f">SET DEFAULT</text>
  <text x="787" y="388" text-anchor="middle" font-size="13" fill="#1f2933">자식 키를</text>
  <text x="787" y="408" text-anchor="middle" font-size="13" fill="#1f2933">컬럼 기본값으로</text>
  <text x="787" y="428" text-anchor="middle" font-size="13" fill="#b45309">그 값도 부모에 있어야</text>

  <text x="440" y="472" text-anchor="middle" font-size="13" fill="#495057">빨간 칸은 자식이 남은 부모를 지우지 못하게 막고, 초록 칸은 자식 행을 바꿔 맞춘다</text>
</svg>
