<svg xmlns="http://www.w3.org/2000/svg" width="880" height="576" viewBox="0 0 880 576" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="576" fill="#fbfbf8"/>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">선언한 타입 이름에서 컬럼 친화성이 정해지는 순서</text>
  <text x="30" y="56" font-size="13" fill="#555">위에서부터 차례로 보고, 처음 맞는 규칙에서 멈춘다. 오른쪽은 글자 '0123'을 넣었을 때 저장되는 값 (SQLite 3.49.1)</text>

  <text x="40" y="92" font-size="13" font-weight="bold" fill="#555">이름에 이 글자가 들어 있으면</text>
  <text x="420" y="92" font-size="13" font-weight="bold" fill="#555">친화성</text>
  <text x="640" y="92" font-size="13" font-weight="bold" fill="#555">'0123' → 저장</text>

  <!-- 규칙 1 -->
  <rect x="40" y="106" width="330" height="62" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.2"/>
  <text x="56" y="130" font-size="14" font-weight="bold" fill="#1b1b1b">① INT</text>
  <text x="56" y="152" font-size="13" fill="#555">INTEGER, BIGINT, CHARINT, FLOATING POINT</text>
  <rect x="420" y="112" width="170" height="50" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="505" y="142" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">INTEGER</text>
  <text x="640" y="142" font-size="14" fill="#1b1b1b">123  (integer)</text>
  <line x1="370" y1="137" x2="414" y2="137" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 규칙 2 -->
  <rect x="40" y="186" width="330" height="62" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.2"/>
  <text x="56" y="210" font-size="14" font-weight="bold" fill="#1b1b1b">② CHAR · CLOB · TEXT</text>
  <text x="56" y="232" font-size="13" fill="#555">VARCHAR(10), NCHAR(55), TEXT</text>
  <rect x="420" y="192" width="170" height="50" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.2"/>
  <text x="505" y="222" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">TEXT</text>
  <text x="640" y="222" font-size="14" fill="#1b1b1b">'0123'  (text)</text>
  <line x1="370" y1="217" x2="414" y2="217" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 규칙 3 -->
  <rect x="40" y="266" width="330" height="62" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.2"/>
  <text x="56" y="290" font-size="14" font-weight="bold" fill="#1b1b1b">③ BLOB, 또는 타입을 안 적음</text>
  <text x="56" y="312" font-size="13" fill="#555">BLOB, memo (이름만 적은 컬럼)</text>
  <rect x="420" y="272" width="170" height="50" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.2"/>
  <text x="505" y="302" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">BLOB</text>
  <text x="640" y="302" font-size="14" fill="#1b1b1b">'0123'  (넘긴 그대로)</text>
  <line x1="370" y1="297" x2="414" y2="297" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 규칙 4 -->
  <rect x="40" y="346" width="330" height="62" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.2"/>
  <text x="56" y="370" font-size="14" font-weight="bold" fill="#1b1b1b">④ REAL · FLOA · DOUB</text>
  <text x="56" y="392" font-size="13" fill="#555">REAL, DOUBLE, FLOAT</text>
  <rect x="420" y="352" width="170" height="50" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="505" y="382" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">REAL</text>
  <text x="640" y="382" font-size="14" fill="#1b1b1b">123.0  (real)</text>
  <line x1="370" y1="377" x2="414" y2="377" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 규칙 5 -->
  <rect x="40" y="426" width="330" height="62" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="56" y="450" font-size="14" font-weight="bold" fill="#b45309">⑤ 위 어디에도 안 걸림</text>
  <text x="56" y="472" font-size="13" fill="#555">STRING, DATETIME, BOOLEAN, DECIMAL(10,2)</text>
  <rect x="420" y="432" width="170" height="50" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="505" y="462" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">NUMERIC</text>
  <text x="640" y="462" font-size="14" fill="#1b1b1b">123  (integer)</text>
  <line x1="370" y1="457" x2="414" y2="457" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 범례 -->
  <line x1="30" y1="508" x2="850" y2="508" stroke="#d0d0c8" stroke-width="1"/>
  <text x="30" y="532" font-size="13" fill="#333">초록 칸은 숫자로 읽히는 글자를 숫자로 바꿔 저장한다. 앞자리 0은 이때 사라진다.</text>
  <text x="30" y="552" font-size="13" fill="#333">FLOATING POINT는 POINT 안의 INT 때문에 ①에 걸리고, STRING은 ②에 안 걸려 ⑤까지 내려간다.</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a84"/>
    </marker>
  </defs>
</svg>
