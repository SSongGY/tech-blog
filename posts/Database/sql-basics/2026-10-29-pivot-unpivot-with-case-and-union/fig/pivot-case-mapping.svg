<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320"
     font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="880" height="320" fill="#f8f9fa"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#495057"/>
    </marker>
  </defs>

  <text x="24" y="28" font-size="16" font-weight="bold" fill="#212529">SUM(CASE WHEN quarter = n THEN amount END) 이 한 그룹을 한 행으로 접는 과정</text>
  <text x="24" y="50" font-size="13" fill="#495057">CASE 는 ELSE 가 없으면 NULL 을 내고 SUM 은 NULL 을 빼고 더한다. 4분기 행이 없는 그룹은 더할 값이 없어 합계도 NULL 이다.</text>

  <text x="24" y="80" font-size="13" font-weight="bold" fill="#212529">입력 — region = '대구' 그룹의 3행</text>

  <rect x="24" y="90" width="180" height="104" rx="5" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <text x="114" y="117" font-size="13" fill="#212529" text-anchor="middle">quarter 1 · amount 40</text>
  <text x="114" y="146" font-size="13" fill="#212529" text-anchor="middle">quarter 2 · amount 55</text>
  <text x="114" y="175" font-size="13" fill="#212529" text-anchor="middle">quarter 3 · amount 30</text>

  <line x1="206" y1="140" x2="224" y2="140" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 분기 1 -->
  <rect x="230" y="78" width="150" height="28" rx="4" fill="#e9ecef" stroke="#495057" stroke-width="1.2"/>
  <text x="305" y="97" font-size="13" fill="#212529" text-anchor="middle">CASE … quarter = 1</text>
  <rect x="230" y="110" width="150" height="84" rx="4" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
  <text x="305" y="132" font-size="13" font-weight="bold" fill="#2d6a4f" text-anchor="middle">40</text>
  <text x="305" y="156" font-size="13" fill="#868e96" text-anchor="middle">NULL</text>
  <text x="305" y="180" font-size="13" fill="#868e96" text-anchor="middle">NULL</text>
  <line x1="305" y1="196" x2="305" y2="212" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="230" y="216" width="150" height="32" rx="4" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="305" y="237" font-size="13" fill="#2d6a4f" text-anchor="middle">SUM → 40</text>

  <!-- 분기 2 -->
  <rect x="388" y="78" width="150" height="28" rx="4" fill="#e9ecef" stroke="#495057" stroke-width="1.2"/>
  <text x="463" y="97" font-size="13" fill="#212529" text-anchor="middle">CASE … quarter = 2</text>
  <rect x="388" y="110" width="150" height="84" rx="4" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
  <text x="463" y="132" font-size="13" fill="#868e96" text-anchor="middle">NULL</text>
  <text x="463" y="156" font-size="13" font-weight="bold" fill="#2d6a4f" text-anchor="middle">55</text>
  <text x="463" y="180" font-size="13" fill="#868e96" text-anchor="middle">NULL</text>
  <line x1="463" y1="196" x2="463" y2="212" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="388" y="216" width="150" height="32" rx="4" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="463" y="237" font-size="13" fill="#2d6a4f" text-anchor="middle">SUM → 55</text>

  <!-- 분기 3 -->
  <rect x="546" y="78" width="150" height="28" rx="4" fill="#e9ecef" stroke="#495057" stroke-width="1.2"/>
  <text x="621" y="97" font-size="13" fill="#212529" text-anchor="middle">CASE … quarter = 3</text>
  <rect x="546" y="110" width="150" height="84" rx="4" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
  <text x="621" y="132" font-size="13" fill="#868e96" text-anchor="middle">NULL</text>
  <text x="621" y="156" font-size="13" fill="#868e96" text-anchor="middle">NULL</text>
  <text x="621" y="180" font-size="13" font-weight="bold" fill="#2d6a4f" text-anchor="middle">30</text>
  <line x1="621" y1="196" x2="621" y2="212" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="546" y="216" width="150" height="32" rx="4" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="621" y="237" font-size="13" fill="#2d6a4f" text-anchor="middle">SUM → 30</text>

  <!-- 분기 4 -->
  <rect x="704" y="78" width="150" height="28" rx="4" fill="#e9ecef" stroke="#495057" stroke-width="1.2"/>
  <text x="779" y="97" font-size="13" fill="#212529" text-anchor="middle">CASE … quarter = 4</text>
  <rect x="704" y="110" width="150" height="84" rx="4" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
  <text x="779" y="132" font-size="13" fill="#868e96" text-anchor="middle">NULL</text>
  <text x="779" y="156" font-size="13" fill="#868e96" text-anchor="middle">NULL</text>
  <text x="779" y="180" font-size="13" fill="#868e96" text-anchor="middle">NULL</text>
  <line x1="779" y1="196" x2="779" y2="212" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="704" y="216" width="150" height="32" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/>
  <text x="779" y="237" font-size="13" fill="#b45309" text-anchor="middle">SUM → NULL</text>

  <text x="24" y="237" font-size="13" fill="#495057">그룹당 한 번씩</text>
  <text x="24" y="296" font-size="13" fill="#212529">결과 1행</text>

  <rect x="104" y="272" width="100" height="32" rx="4" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <text x="154" y="293" font-size="13" fill="#212529" text-anchor="middle">대구</text>
  <rect x="230" y="272" width="150" height="32" rx="4" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <text x="305" y="293" font-size="13" fill="#212529" text-anchor="middle">q1 = 40</text>
  <rect x="388" y="272" width="150" height="32" rx="4" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <text x="463" y="293" font-size="13" fill="#212529" text-anchor="middle">q2 = 55</text>
  <rect x="546" y="272" width="150" height="32" rx="4" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <text x="621" y="293" font-size="13" fill="#212529" text-anchor="middle">q3 = 30</text>
  <rect x="704" y="272" width="150" height="32" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="779" y="293" font-size="13" fill="#b45309" text-anchor="middle">q4 = NULL</text>
</svg>
