<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="440" y="32" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">COUNT(temp) 누적이 묶음 번호가 되는 과정 — 센서 S1</text>

  <!-- 단계 머리 -->
  <text x="100" y="74" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">ts</text>
  <text x="215" y="74" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">temp (원본)</text>
  <text x="355" y="66" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">① grp</text>
  <text x="355" y="84" font-size="13" text-anchor="middle" fill="#4b5563">COUNT(temp) 누적</text>
  <text x="530" y="66" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">② filled</text>
  <text x="530" y="84" font-size="13" text-anchor="middle" fill="#4b5563">MAX(temp) OVER (grp)</text>

  <!-- grp 0 묶음: 채울 값이 없다 -->
  <rect x="40" y="100" width="800" height="44" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <!-- grp 1 묶음 -->
  <rect x="40" y="152" width="800" height="140" rx="6" fill="#e8f5ee" stroke="#2d6a4f" stroke-width="1.5"/>
  <!-- grp 2 묶음 -->
  <rect x="40" y="300" width="800" height="92" rx="6" fill="#e8f5ee" stroke="#2d6a4f" stroke-width="1.5"/>

  <!-- 행 -->
  <g font-size="14" text-anchor="middle" fill="#1f2937">
    <text x="100" y="127">09:00</text><text x="215" y="127" fill="#9d0208">NULL</text><text x="355" y="127">0</text><text x="530" y="127" fill="#9d0208">NULL</text>
    <text x="100" y="179">09:10</text><text x="215" y="179" font-weight="bold">21.5</text><text x="355" y="179">1</text><text x="530" y="179">21.5</text>
    <text x="100" y="225">09:20</text><text x="215" y="225" fill="#9d0208">NULL</text><text x="355" y="225">1</text><text x="530" y="225" font-weight="bold" fill="#2d6a4f">21.5</text>
    <text x="100" y="271">09:30</text><text x="215" y="271" fill="#9d0208">NULL</text><text x="355" y="271">1</text><text x="530" y="271" font-weight="bold" fill="#2d6a4f">21.5</text>
    <text x="100" y="327">09:40</text><text x="215" y="327" font-weight="bold">22.0</text><text x="355" y="327">2</text><text x="530" y="327">22.0</text>
    <text x="100" y="373">09:50</text><text x="215" y="373" fill="#9d0208">NULL</text><text x="355" y="373">2</text><text x="530" y="373" font-weight="bold" fill="#2d6a4f">22.0</text>
  </g>

  <!-- 묶음 설명 -->
  <text x="825" y="127" font-size="13" text-anchor="end" fill="#b45309">grp 0 — 앞에 값이 없어 NULL</text>
  <text x="825" y="225" font-size="13" text-anchor="end" fill="#2d6a4f">grp 1 — 값 1개 + NULL 2개</text>
  <text x="825" y="350" font-size="13" text-anchor="end" fill="#2d6a4f">grp 2 — 값 1개 + NULL 1개</text>

  <!-- 아래 설명 -->
  <text x="440" y="422" font-size="13" text-anchor="middle" fill="#374151">COUNT(temp)는 NULL을 세지 않아 NULL 행에서 누적값이 멈춘다 → 값 하나와 그 뒤 NULL들이 같은 grp</text>
  <text x="440" y="446" font-size="13" text-anchor="middle" fill="#374151">한 grp 안에 NULL 아닌 값은 하나뿐이므로 MAX(또는 MIN)가 그 값을 묶음 전체에 편다</text>
</svg>
