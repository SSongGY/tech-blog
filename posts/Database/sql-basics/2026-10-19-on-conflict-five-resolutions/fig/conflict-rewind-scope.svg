<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <rect x="0" y="0" width="880" height="360" fill="#fbfbf8"/>

  <text x="12" y="24" font-size="16" font-weight="bold" fill="#1b2430">같은 배치, 다섯 가지 해결 방식 — 어디까지 되돌아가는가</text>

  <!-- 한 문장 묶음 표시 -->
  <path d="M298 50 L298 44 L797 44 L797 50" fill="none" stroke="#5b6670" stroke-width="1.2"/>
  <text x="547" y="40" font-size="13" fill="#5b6670" text-anchor="middle">한 문장 안의 4행 INSERT</text>

  <!-- 타임라인 -->
  <text x="12" y="80" font-size="13" fill="#1b2430">실행 순서 →</text>
  <rect x="160" y="58" width="130" height="34" fill="#eef2f6" stroke="#5b6670"/>
  <text x="225" y="80" font-size="13" fill="#1b2430" text-anchor="middle">선행 T-001</text>
  <rect x="298" y="58" width="115" height="34" fill="#eef2f6" stroke="#5b6670"/>
  <text x="355" y="80" font-size="13" fill="#1b2430" text-anchor="middle">B-010</text>
  <rect x="421" y="58" width="115" height="34" fill="#eef2f6" stroke="#5b6670"/>
  <text x="478" y="80" font-size="13" fill="#1b2430" text-anchor="middle">B-020</text>
  <rect x="544" y="58" width="130" height="34" fill="#fde2e2" stroke="#9d0208"/>
  <text x="609" y="80" font-size="13" fill="#9d0208" text-anchor="middle">A-100 충돌</text>
  <rect x="682" y="58" width="115" height="34" fill="#eef2f6" stroke="#5b6670"/>
  <text x="739" y="80" font-size="13" fill="#1b2430" text-anchor="middle">B-030</text>

  <!-- ROLLBACK -->
  <text x="12" y="129" font-size="13" fill="#1b2430">OR ROLLBACK</text>
  <rect x="160" y="108" width="637" height="32" fill="#fde2e2" stroke="#9d0208"/>
  <text x="478" y="129" font-size="13" fill="#9d0208" text-anchor="middle">트랜잭션 전체가 되돌아간다 — 선행 문장이 넣은 행까지</text>

  <!-- ABORT -->
  <text x="12" y="167" font-size="13" fill="#1b2430">OR ABORT (기본)</text>
  <rect x="160" y="146" width="130" height="32" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="225" y="167" font-size="13" fill="#2d6a4f" text-anchor="middle">남음</text>
  <rect x="298" y="146" width="499" height="32" fill="#fde2e2" stroke="#9d0208"/>
  <text x="547" y="167" font-size="13" fill="#9d0208" text-anchor="middle">이 문장이 넣은 행만 되돌아간다</text>

  <!-- FAIL -->
  <text x="12" y="205" font-size="13" fill="#1b2430">OR FAIL</text>
  <rect x="160" y="184" width="376" height="32" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="348" y="205" font-size="13" fill="#2d6a4f" text-anchor="middle">충돌 전에 넣은 행은 그대로 남는다</text>
  <rect x="544" y="184" width="253" height="32" fill="#fde2e2" stroke="#9d0208"/>
  <text x="670" y="205" font-size="13" fill="#9d0208" text-anchor="middle">여기서 멈춘다 — 뒤는 실행 안 됨</text>

  <!-- IGNORE -->
  <text x="12" y="243" font-size="13" fill="#1b2430">OR IGNORE</text>
  <rect x="160" y="222" width="376" height="32" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="348" y="243" font-size="13" fill="#2d6a4f" text-anchor="middle">남음</text>
  <rect x="544" y="222" width="130" height="32" fill="#fef3c7" stroke="#b45309"/>
  <text x="609" y="243" font-size="13" fill="#b45309" text-anchor="middle">건너뜀</text>
  <rect x="682" y="222" width="115" height="32" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="739" y="243" font-size="13" fill="#2d6a4f" text-anchor="middle">남음</text>

  <!-- REPLACE -->
  <text x="12" y="281" font-size="13" fill="#1b2430">OR REPLACE</text>
  <rect x="160" y="260" width="376" height="32" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="348" y="281" font-size="13" fill="#2d6a4f" text-anchor="middle">남음</text>
  <rect x="544" y="260" width="130" height="32" fill="#fef3c7" stroke="#b45309"/>
  <text x="609" y="281" font-size="13" fill="#b45309" text-anchor="middle">기존 행 교체</text>
  <rect x="682" y="260" width="115" height="32" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="739" y="281" font-size="13" fill="#2d6a4f" text-anchor="middle">남음</text>

  <!-- 범례 -->
  <rect x="12" y="312" width="18" height="16" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="36" y="325" font-size="13" fill="#1b2430">반영된 채로 남음</text>
  <rect x="170" y="312" width="18" height="16" fill="#fde2e2" stroke="#9d0208"/>
  <text x="194" y="325" font-size="13" fill="#1b2430">되돌아가거나 실행되지 않음</text>
  <rect x="398" y="312" width="18" height="16" fill="#fef3c7" stroke="#b45309"/>
  <text x="422" y="325" font-size="13" fill="#1b2430">에러 없이 처리됨 (건너뜀·교체)</text>
  <text x="660" y="325" font-size="13" fill="#5b6670">SQLite 3.49.1 실측</text>
</svg>
