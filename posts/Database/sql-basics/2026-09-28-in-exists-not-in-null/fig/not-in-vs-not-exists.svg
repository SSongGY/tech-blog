<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fbfbf8"/>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">고객 4(장하준)를 거를 때 — NOT IN과 NOT EXISTS가 하는 계산</text>
  <text x="30" y="56" font-size="13" fill="#555">purchase.customer_id 값: 1, 1, 2, 3, NULL, 3. 참 = 1, 거짓 = 0, 알 수 없음 = NULL</text>

  <!-- left: NOT IN -->
  <rect x="30" y="76" width="400" height="104" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="46" y="100" font-size="15" font-weight="bold" fill="#1b1b1b">가. 4 NOT IN (서브쿼리)</text>
  <text x="46" y="124" font-size="13" fill="#333">목록의 값 하나하나와 &lt;&gt; 비교해 AND로 묶는다</text>
  <text x="46" y="148" font-size="13" fill="#333">4&lt;&gt;1 AND 4&lt;&gt;1 AND 4&lt;&gt;2 AND 4&lt;&gt;3</text>
  <text x="46" y="168" font-size="13" fill="#9d0208">AND 4&lt;&gt;NULL AND 4&lt;&gt;3</text>

  <rect x="30" y="220" width="400" height="84" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="46" y="246" font-size="13" fill="#333">1 AND 1 AND 1 AND 1 AND NULL AND 1</text>
  <text x="46" y="270" font-size="13" fill="#9d0208">4&lt;&gt;NULL 하나가 NULL이라 전체가 NULL</text>
  <text x="46" y="290" font-size="13" fill="#333">(참이 아니므로 AND 결과가 참이 될 수 없다)</text>

  <rect x="30" y="344" width="400" height="60" rx="6" fill="#fbeaea" stroke="#9d0208" stroke-width="1.5"/>
  <text x="46" y="370" font-size="13" font-weight="bold" fill="#9d0208">WHERE NULL → 행이 빠진다</text>
  <text x="46" y="392" font-size="13" fill="#333">고객 5도 같은 이유로 빠져 결과 0행</text>

  <!-- right: NOT EXISTS -->
  <rect x="450" y="76" width="400" height="104" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="466" y="100" font-size="15" font-weight="bold" fill="#1b1b1b">나. NOT EXISTS (서브쿼리)</text>
  <text x="466" y="124" font-size="13" fill="#333">p.customer_id = 4 를 만족하는 행이 있는지 본다</text>
  <text x="466" y="148" font-size="13" fill="#333">1=4, 1=4, 2=4, 3=4 → 0</text>
  <text x="466" y="168" font-size="13" fill="#333">NULL=4 → NULL, 3=4 → 0</text>

  <rect x="450" y="220" width="400" height="84" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="466" y="246" font-size="13" fill="#333">조건이 참인 행이 하나도 없다 → 0행</text>
  <text x="466" y="270" font-size="13" fill="#2d6a4f">EXISTS는 0 또는 1만 돌려준다 (NULL 없음)</text>
  <text x="466" y="290" font-size="13" fill="#333">EXISTS = 0, NOT EXISTS = 1</text>

  <rect x="450" y="344" width="400" height="60" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="466" y="370" font-size="13" font-weight="bold" fill="#2d6a4f">WHERE 1 → 행이 남는다</text>
  <text x="466" y="392" font-size="13" fill="#333">고객 4, 5 두 행이 결과로 나온다</text>

  <line x1="230" y1="180" x2="230" y2="218" stroke="#8a8a84" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="230" y1="304" x2="230" y2="342" stroke="#8a8a84" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="650" y1="180" x2="650" y2="218" stroke="#8a8a84" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="650" y1="304" x2="650" y2="342" stroke="#8a8a84" stroke-width="1.2" marker-end="url(#ar)"/>

  <text x="30" y="436" font-size="13" fill="#333">NULL 행은 두 쪽 모두 "같지 않다"를 확정하지 못한다. NOT IN은 그 불확정이 결과 전체로 번지고,</text>
  <text x="30" y="456" font-size="13" fill="#333">NOT EXISTS는 "참인 행이 있는가"만 묻기 때문에 그 행을 없는 것으로 친다.</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a84"/>
    </marker>
  </defs>
</svg>
