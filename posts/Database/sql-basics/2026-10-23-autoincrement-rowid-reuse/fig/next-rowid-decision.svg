<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="'Malgun Gothic','Segoe UI',sans-serif">
  <rect x="0" y="0" width="880" height="460" fill="#fbfbf8"/>

  <text x="440" y="34" font-size="17" font-weight="bold" fill="#1b1b1b" text-anchor="middle">INSERT 에서 id 를 생략했을 때 다음 번호를 고르는 경로</text>

  <!-- 입력 -->
  <rect x="330" y="52" width="220" height="40" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="440" y="77" font-size="14" fill="#1b1b1b" text-anchor="middle">INSERT INTO t (title) VALUES (…)</text>

  <path d="M 440 92 L 440 112 L 220 112 L 220 136" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M 440 92 L 440 112 L 660 112 L 660 136" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9d0208"/>
    </marker>
  </defs>

  <!-- 왼쪽: 일반 rowid -->
  <rect x="40" y="136" width="360" height="44" rx="6" fill="#eef3ef" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="220" y="156" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">id INTEGER PRIMARY KEY</text>
  <text x="220" y="173" font-size="13" fill="#2d6a4f" text-anchor="middle">rowid 자체 · 별도 기록 없음</text>

  <path d="M 220 180 L 220 206" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="40" y="206" width="360" height="44" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="220" y="226" font-size="14" fill="#1b1b1b" text-anchor="middle">지금 표에 남아 있는 가장 큰 rowid 를 본다</text>
  <text x="220" y="243" font-size="13" fill="#666" text-anchor="middle">지워진 행은 세지 않는다</text>

  <path d="M 220 250 L 220 276" fill="none" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="40" y="276" width="360" height="40" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="220" y="301" font-size="14" fill="#1b1b1b" text-anchor="middle">다음 번호 = 그 값 + 1 (빈 표면 1)</text>

  <path d="M 220 316 L 220 346" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ah)"/>
  <text x="232" y="336" font-size="13" fill="#b45309">가장 큰 rowid 가 상한이면</text>

  <rect x="40" y="346" width="360" height="44" rx="6" fill="#fdf5e9" stroke="#b45309" stroke-width="1.5"/>
  <text x="220" y="366" font-size="14" fill="#b45309" text-anchor="middle">쓰이지 않은 번호를 무작위로 고른다</text>
  <text x="220" y="383" font-size="13" fill="#b45309" text-anchor="middle">못 찾으면 SQLITE_FULL</text>

  <!-- 오른쪽: AUTOINCREMENT -->
  <rect x="480" y="136" width="360" height="44" rx="6" fill="#eef3ef" stroke="#2d6a4f" stroke-width="1.8"/>
  <text x="660" y="156" font-size="14" font-weight="bold" fill="#2d6a4f" text-anchor="middle">id INTEGER PRIMARY KEY AUTOINCREMENT</text>
  <text x="660" y="173" font-size="13" fill="#2d6a4f" text-anchor="middle">sqlite_sequence 에 최고 기록을 남긴다</text>

  <path d="M 660 180 L 660 206" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="480" y="206" width="360" height="44" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="660" y="226" font-size="14" fill="#1b1b1b" text-anchor="middle">sqlite_sequence 의 seq 값을 읽는다</text>
  <text x="660" y="243" font-size="13" fill="#666" text-anchor="middle">지금까지 쓰인 적 있는 가장 큰 번호</text>

  <path d="M 660 250 L 660 276" fill="none" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="480" y="276" width="360" height="40" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="660" y="301" font-size="14" fill="#1b1b1b" text-anchor="middle">다음 번호 = seq + 1 · 쓴 뒤 seq 갱신</text>

  <path d="M 660 316 L 660 346" fill="none" stroke="#9d0208" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ahr)"/>
  <text x="672" y="336" font-size="13" fill="#9d0208">seq 가 상한이면</text>

  <rect x="480" y="346" width="360" height="44" rx="6" fill="#fdeeee" stroke="#9d0208" stroke-width="1.5"/>
  <text x="660" y="366" font-size="14" fill="#9d0208" text-anchor="middle">바로 SQLITE_FULL — 무작위 선택 없음</text>
  <text x="660" y="383" font-size="13" fill="#9d0208" text-anchor="middle">번호 재사용을 막는 것이 목적이므로</text>

  <text x="440" y="424" font-size="13" fill="#666" text-anchor="middle">상한 = 9223372036854775807 (64비트 부호 있는 정수의 최댓값)</text>
  <text x="440" y="444" font-size="13" fill="#666" text-anchor="middle">두 경로 모두 INSERT 가 id 를 직접 지정하면 그 값이 그대로 쓰인다</text>
</svg>
