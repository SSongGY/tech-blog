<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#ffffff"/>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">같은 금액 문자열이 컬럼 선언에 따라 저장되는 모양과, 반올림이 기준으로 삼는 값</text>

  <!-- 위: 친화성 -->
  <text x="20" y="66" font-size="14" font-weight="bold" fill="#495057">① 문자열 '0.10' 과 '20.00' 을 넣으면 — 컬럼 선언이 정하는 친화성(affinity)이 저장 부류를 바꾼다</text>

  <rect x="20" y="82" width="160" height="80" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="100" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">넣은 값 (TEXT)</text>
  <text x="100" y="140" text-anchor="middle" font-size="13" fill="#1b1b1b">'0.10' · '20.00'</text>

  <rect x="250" y="82" width="190" height="80" rx="6" fill="#fff4e6" stroke="#b45309" stroke-width="1.5"/>
  <text x="345" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">amount_real REAL</text>
  <text x="345" y="128" text-anchor="middle" font-size="13" fill="#1b1b1b">REAL 친화성</text>
  <text x="345" y="150" text-anchor="middle" font-size="13" fill="#b45309">real 0.1 · real 20.0</text>

  <rect x="460" y="82" width="190" height="80" rx="6" fill="#fff4e6" stroke="#b45309" stroke-width="1.5"/>
  <text x="555" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b1b1b">amount_dec DECIMAL(10,2)</text>
  <text x="555" y="128" text-anchor="middle" font-size="13" fill="#1b1b1b">NUMERIC 친화성</text>
  <text x="555" y="150" text-anchor="middle" font-size="13" fill="#b45309">real 0.1 · integer 20</text>

  <rect x="670" y="82" width="190" height="80" rx="6" fill="#e9f5ee" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="765" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">amount_cents INTEGER</text>
  <text x="765" y="128" text-anchor="middle" font-size="13" fill="#1b1b1b">센트로 바꿔 넣음</text>
  <text x="765" y="150" text-anchor="middle" font-size="13" fill="#2d6a4f">integer 10 · integer 2000</text>

  <line x1="180" y1="122" x2="242" y2="122" stroke="#495057" stroke-width="1.5"/>
  <polygon points="242,117 250,122 242,127" fill="#495057"/>

  <text x="440" y="190" text-anchor="middle" font-size="13" fill="#495057">DECIMAL 로 선언해도 십진수 저장 부류는 없다. 손실 없이 정수가 되면 integer, 아니면 real</text>
  <text x="440" y="210" text-anchor="middle" font-size="13" fill="#495057">0.1 + 0.2 의 합: real 두 컬럼은 0.30000000000000004, 센트 컬럼은 30</text>

  <!-- 아래: 수직선 -->
  <text x="20" y="262" font-size="14" font-weight="bold" fill="#495057">② round(1.005, 2) 가 1.0 이 되는 이유 — 1.005 라고 쓴 값은 1.005 보다 조금 작은 이진 실수로 저장된다</text>

  <line x1="60" y1="360" x2="830" y2="360" stroke="#495057" stroke-width="2"/>
  <polygon points="830,355 840,360 830,365" fill="#495057"/>

  <line x1="100" y1="348" x2="100" y2="372" stroke="#1b1b1b" stroke-width="2"/>
  <text x="100" y="394" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">1.00</text>

  <line x1="780" y1="348" x2="780" y2="372" stroke="#1b1b1b" stroke-width="2"/>
  <text x="780" y="394" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b1b1b">1.01</text>

  <line x1="440" y1="330" x2="440" y2="390" stroke="#495057" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="440" y="320" text-anchor="middle" font-size="13" fill="#495057">반 지점 1.005 (쓴 값)</text>

  <circle cx="400" cy="360" r="7" fill="#9d0208"/>
  <text x="400" y="420" text-anchor="middle" font-size="13" fill="#9d0208">저장된 값 1.004999999999999893</text>
  <text x="400" y="438" text-anchor="middle" font-size="13" fill="#9d0208">반 지점보다 왼쪽</text>

  <path d="M 392 350 Q 250 290 108 346" fill="none" stroke="#9d0208" stroke-width="2"/>
  <polygon points="108,346 120,345 113,336" fill="#9d0208"/>
  <text x="250" y="300" text-anchor="middle" font-size="13" fill="#9d0208">round 결과 1.0</text>

  <text x="440" y="476" text-anchor="middle" font-size="13" fill="#495057">printf('%!.20f', 1.005) 로 본 값. 점 사이 간격은 실제보다 크게 그렸다 (실제 차이는 약 1.1e-16)</text>
  <text x="440" y="498" text-anchor="middle" font-size="13" fill="#495057">0.125 는 이진수로 정확히 표현되므로 반 지점에 놓이고 round(0.125, 2) 는 0.13 이 된다</text>
</svg>
