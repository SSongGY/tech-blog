<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <text x="24" y="34" font-size="16" font-weight="bold" fill="#222222">행 값 비교는 왼쪽 컬럼부터 하나씩 본다</text>
  <text x="24" y="56" font-size="13" fill="#555555">앞 컬럼에서 크고 작음이 갈리면 거기서 끝나고, 같으면 다음 컬럼으로 넘어간다</text>

  <!-- 머리글 -->
  <g font-size="13" fill="#555555" text-anchor="middle">
    <text x="190" y="92">비교식</text>
    <text x="430" y="92">1번째 컬럼 (year)</text>
    <text x="610" y="92">2번째 컬럼 (month)</text>
    <text x="780" y="92">결과</text>
  </g>

  <!-- 1행: 첫 컬럼에서 갈림 -->
  <g font-size="14">
    <text x="190" y="138" text-anchor="middle" fill="#222222">(2025, 12) &lt; (2026, 1)</text>
    <rect x="360" y="116" width="140" height="34" rx="4" fill="#f0f7f3" stroke="#2d6a4f" stroke-width="2"/>
    <text x="430" y="138" text-anchor="middle" fill="#2d6a4f">2025 &lt; 2026</text>
    <rect x="540" y="116" width="140" height="34" rx="4" fill="#f7f7f7" stroke="#bbbbbb" stroke-dasharray="4 3"/>
    <text x="610" y="138" text-anchor="middle" fill="#999999">보지 않는다</text>
    <path d="M502,140 L520,140 L520,160 L720,160 L734,145" fill="none" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="780" y="138" text-anchor="middle" font-weight="bold" fill="#2d6a4f">1 (참)</text>
  </g>

  <!-- 2행: 둘째 컬럼에서 갈림 -->
  <g font-size="14">
    <text x="190" y="198" text-anchor="middle" fill="#222222">(2026, 3) &lt; (2026, 10)</text>
    <rect x="360" y="176" width="140" height="34" rx="4" fill="#f7f7f7" stroke="#999999"/>
    <text x="430" y="198" text-anchor="middle" fill="#222222">같다 → 다음</text>
    <line x1="502" y1="193" x2="536" y2="193" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="540" y="176" width="140" height="34" rx="4" fill="#f0f7f3" stroke="#2d6a4f" stroke-width="2"/>
    <text x="610" y="198" text-anchor="middle" fill="#2d6a4f">3 &lt; 10</text>
    <line x1="682" y1="193" x2="734" y2="193" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="780" y="198" text-anchor="middle" font-weight="bold" fill="#2d6a4f">1 (참)</text>
  </g>

  <!-- 3행: NULL 이 있지만 첫 컬럼에서 갈림 -->
  <g font-size="14">
    <text x="190" y="258" text-anchor="middle" fill="#222222">(2025, NULL) &lt; (2026, 3)</text>
    <rect x="360" y="236" width="140" height="34" rx="4" fill="#f0f7f3" stroke="#2d6a4f" stroke-width="2"/>
    <text x="430" y="258" text-anchor="middle" fill="#2d6a4f">2025 &lt; 2026</text>
    <rect x="540" y="236" width="140" height="34" rx="4" fill="#f7f7f7" stroke="#bbbbbb" stroke-dasharray="4 3"/>
    <text x="610" y="258" text-anchor="middle" fill="#999999">NULL 이지만 안 봄</text>
    <path d="M502,260 L520,260 L520,280 L720,280 L734,265" fill="none" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="780" y="258" text-anchor="middle" font-weight="bold" fill="#2d6a4f">1 (참)</text>
  </g>

  <!-- 4행: NULL 에서 갈려야 함 -->
  <g font-size="14">
    <text x="190" y="318" text-anchor="middle" fill="#222222">(2026, NULL) &lt; (2026, 3)</text>
    <rect x="360" y="296" width="140" height="34" rx="4" fill="#f7f7f7" stroke="#999999"/>
    <text x="430" y="318" text-anchor="middle" fill="#222222">같다 → 다음</text>
    <line x1="502" y1="313" x2="536" y2="313" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="540" y="296" width="140" height="34" rx="4" fill="#fff4f4" stroke="#9d0208" stroke-width="2"/>
    <text x="610" y="318" text-anchor="middle" fill="#9d0208">NULL &lt; 3 → 모름</text>
    <line x1="682" y1="313" x2="734" y2="313" stroke="#9d0208" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="780" y="318" text-anchor="middle" font-weight="bold" fill="#9d0208">NULL</text>
  </g>

  <text x="24" y="368" font-size="13" fill="#555555">NULL 은 "모르는 값"이다. NULL 자리에 어떤 값을 넣어도 결과가 같으면 참·거짓이 정해지고,</text>
  <text x="24" y="388" font-size="13" fill="#555555">넣는 값에 따라 참도 거짓도 될 수 있으면 결과가 NULL 이다.</text>
</svg>
