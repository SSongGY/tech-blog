<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="880" height="440" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9d0208"/>
    </marker>
  </defs>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">인덱스 항목에 답이 다 있으면 표를 보러 가지 않는다</text>

  <!-- index entry anatomy -->
  <text x="40" y="66" font-size="14" font-weight="bold" fill="#1b1b1b">인덱스 b-tree 항목 하나의 생김새</text>
  <rect x="40" y="78" width="200" height="40" rx="4" fill="#e7f5ff" stroke="#1864ab"/>
  <text x="140" y="103" text-anchor="middle" font-size="13" fill="#1b1b1b">색인한 컬럼들의 값</text>
  <rect x="240" y="78" width="130" height="40" rx="4" fill="#dee2e6" stroke="#495057"/>
  <text x="305" y="103" text-anchor="middle" font-size="13" fill="#1b1b1b">그 행의 rowid</text>
  <text x="386" y="103" font-size="13" fill="#495057">← 뒤에 rowid 가 늘 따라붙는다</text>

  <!-- case A -->
  <text x="40" y="162" font-size="15" font-weight="bold" fill="#9d0208">A. 인덱스에 없는 컬럼을 고를 때 — 탐색 2번</text>
  <text x="40" y="183" font-size="13" fill="#495057">SELECT signup_at FROM member WHERE email = ?</text>

  <rect x="40" y="196" width="200" height="56" rx="6" fill="#e7f5ff" stroke="#1864ab"/>
  <text x="140" y="219" text-anchor="middle" font-size="13" fill="#1b1b1b">① 인덱스에서 이진 탐색</text>
  <text x="140" y="240" text-anchor="middle" font-size="13" fill="#495057">email 로 항목을 찾는다</text>

  <rect x="300" y="196" width="190" height="56" rx="6" fill="#dee2e6" stroke="#495057"/>
  <text x="395" y="219" text-anchor="middle" font-size="13" fill="#1b1b1b">② rowid 를 꺼낸다</text>
  <text x="395" y="240" text-anchor="middle" font-size="13" fill="#495057">항목 끝에 붙어 있다</text>

  <rect x="550" y="196" width="250" height="56" rx="6" fill="#ffe3e3" stroke="#9d0208"/>
  <text x="675" y="219" text-anchor="middle" font-size="13" fill="#1b1b1b">③ 표에서 다시 이진 탐색</text>
  <text x="675" y="240" text-anchor="middle" font-size="13" fill="#495057">rowid 로 행을 찾아 signup_at 을 읽는다</text>

  <line x1="240" y1="224" x2="298" y2="224" stroke="#495057" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="490" y1="224" x2="548" y2="224" stroke="#9d0208" stroke-width="2" marker-end="url(#ar)"/>

  <text x="550" y="274" font-size="13" fill="#9d0208">걸리는 행 수만큼 ③ 이 반복된다</text>

  <!-- case B -->
  <text x="40" y="320" font-size="15" font-weight="bold" fill="#2d6a4f">B. 인덱스가 고를 컬럼을 전부 갖고 있을 때 — 탐색 1번</text>
  <text x="40" y="341" font-size="13" fill="#495057">인덱스를 member(email, signup_at) 로 만들면 같은 질의가 이렇게 된다</text>

  <rect x="40" y="354" width="200" height="56" rx="6" fill="#e7f5ff" stroke="#1864ab"/>
  <text x="140" y="377" text-anchor="middle" font-size="13" fill="#1b1b1b">① 인덱스에서 이진 탐색</text>
  <text x="140" y="398" text-anchor="middle" font-size="13" fill="#495057">email 로 항목을 찾는다</text>

  <rect x="300" y="354" width="310" height="56" rx="6" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="455" y="377" text-anchor="middle" font-size="13" fill="#1b1b1b">② 항목 안의 signup_at 을 그대로 쓴다</text>
  <text x="455" y="398" text-anchor="middle" font-size="13" fill="#495057">표는 한 번도 열지 않는다</text>

  <line x1="240" y1="382" x2="298" y2="382" stroke="#2d6a4f" stroke-width="2" marker-end="url(#ag)"/>
  <text x="626" y="377" font-size="13" fill="#2d6a4f">실행계획에</text>
  <text x="626" y="396" font-size="13" fill="#2d6a4f">USING COVERING INDEX 가 뜬다</text>
</svg>
