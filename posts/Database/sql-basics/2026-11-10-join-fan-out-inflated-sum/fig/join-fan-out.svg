<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#ffffff"/>
  <text x="440" y="30" font-size="17" text-anchor="middle" font-weight="bold" fill="#222">kim 고객 한 명: 주문 3건 × 결제 2건 = 조인 결과 6행</text>

  <!-- orders -->
  <text x="110" y="70" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">orders (m = 3)</text>
  <rect x="40" y="82" width="140" height="34" fill="#f1f5f9" stroke="#475569"/>
  <text x="110" y="104" font-size="14" text-anchor="middle" fill="#222">101 · 10,000</text>
  <rect x="40" y="122" width="140" height="34" fill="#f1f5f9" stroke="#475569"/>
  <text x="110" y="144" font-size="14" text-anchor="middle" fill="#222">102 · 10,000</text>
  <rect x="40" y="162" width="140" height="34" fill="#f1f5f9" stroke="#475569"/>
  <text x="110" y="184" font-size="14" text-anchor="middle" fill="#222">103 · 5,000</text>
  <text x="110" y="222" font-size="13" text-anchor="middle" fill="#2d6a4f">합 25,000</text>

  <!-- payment -->
  <text x="300" y="70" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">payment (n = 2)</text>
  <rect x="230" y="102" width="140" height="34" fill="#f1f5f9" stroke="#475569"/>
  <text x="300" y="124" font-size="14" text-anchor="middle" fill="#222">201 · 15,000</text>
  <rect x="230" y="142" width="140" height="34" fill="#f1f5f9" stroke="#475569"/>
  <text x="300" y="164" font-size="14" text-anchor="middle" fill="#222">202 · 10,000</text>
  <text x="300" y="222" font-size="13" text-anchor="middle" fill="#2d6a4f">합 25,000</text>

  <!-- arrow -->
  <line x1="390" y1="140" x2="450" y2="140" stroke="#475569" stroke-width="2"/>
  <polygon points="450,133 464,140 450,147" fill="#475569"/>
  <text x="427" y="122" font-size="13" text-anchor="middle" fill="#222">customer_id</text>
  <text x="427" y="166" font-size="13" text-anchor="middle" fill="#222">로 조인</text>

  <!-- joined rows -->
  <text x="660" y="70" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">조인 결과 (m × n = 6행)</text>
  <g font-size="14" fill="#222">
    <rect x="480" y="82" width="360" height="26" fill="#fff7ed" stroke="#b45309"/>
    <text x="500" y="100">101 · 10,000</text><text x="700" y="100">201 · 15,000</text>
    <rect x="480" y="108" width="360" height="26" fill="#fff7ed" stroke="#b45309"/>
    <text x="500" y="126">101 · 10,000</text><text x="700" y="126">202 · 10,000</text>
    <rect x="480" y="134" width="360" height="26" fill="#fff7ed" stroke="#b45309"/>
    <text x="500" y="152">102 · 10,000</text><text x="700" y="152">201 · 15,000</text>
    <rect x="480" y="160" width="360" height="26" fill="#fff7ed" stroke="#b45309"/>
    <text x="500" y="178">102 · 10,000</text><text x="700" y="178">202 · 10,000</text>
    <rect x="480" y="186" width="360" height="26" fill="#fff7ed" stroke="#b45309"/>
    <text x="500" y="204">103 · 5,000</text><text x="700" y="204">201 · 15,000</text>
    <rect x="480" y="212" width="360" height="26" fill="#fff7ed" stroke="#b45309"/>
    <text x="500" y="230">103 · 5,000</text><text x="700" y="230">202 · 10,000</text>
  </g>

  <!-- results -->
  <rect x="40" y="275" width="380" height="92" fill="#fef2f2" stroke="#9d0208"/>
  <text x="230" y="300" font-size="15" text-anchor="middle" font-weight="bold" fill="#9d0208">조인 뒤 그대로 SUM</text>
  <text x="60" y="326" font-size="14" fill="#222">SUM(amount) = 50,000 — 주문마다 n=2번</text>
  <text x="60" y="352" font-size="14" fill="#222">SUM(paid) = 75,000 — 결제마다 m=3번</text>

  <rect x="460" y="275" width="380" height="92" fill="#ecfdf5" stroke="#2d6a4f"/>
  <text x="650" y="300" font-size="15" text-anchor="middle" font-weight="bold" fill="#2d6a4f">표마다 먼저 집계하고 조인</text>
  <text x="480" y="326" font-size="14" fill="#222">주문 합 25,000 · 결제 합 25,000</text>
  <text x="480" y="352" font-size="14" fill="#222">고객 한 명에 한 행씩만 붙는다</text>
</svg>
