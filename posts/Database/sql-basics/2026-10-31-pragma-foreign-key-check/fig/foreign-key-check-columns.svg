<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="'Malgun Gothic','Segoe UI',sans-serif">
  <rect x="0" y="0" width="880" height="430" fill="#fdfdfb"/>

  <text x="40" y="32" font-size="17" font-weight="bold" fill="#1b1b1b">PRAGMA foreign_key_check 가 돌려주는 한 줄, 네 칸</text>
  <text x="40" y="54" font-size="13" fill="#555">위반 하나에 한 줄. 아래는 employee.team_id 가 없는 team 을 가리킬 때 나오는 줄이다.</text>

  <text x="48" y="82" font-size="13" fill="#777">1. table</text>
  <text x="248" y="82" font-size="13" fill="#777">2. rowid</text>
  <text x="448" y="82" font-size="13" fill="#777">3. parent</text>
  <text x="648" y="82" font-size="13" fill="#777">4. fkid</text>

  <rect x="40" y="90" width="190" height="46" rx="5" fill="#fdf0f0" stroke="#9d0208" stroke-width="1.6"/>
  <text x="135" y="120" font-size="15" fill="#9d0208" text-anchor="middle" font-family="Consolas,monospace">'employee'</text>

  <rect x="240" y="90" width="190" height="46" rx="5" fill="#fdf0f0" stroke="#9d0208" stroke-width="1.6"/>
  <text x="335" y="120" font-size="15" fill="#9d0208" text-anchor="middle" font-family="Consolas,monospace">3</text>

  <rect x="440" y="90" width="190" height="46" rx="5" fill="#fdf0f0" stroke="#9d0208" stroke-width="1.6"/>
  <text x="535" y="120" font-size="15" fill="#9d0208" text-anchor="middle" font-family="Consolas,monospace">'team'</text>

  <rect x="640" y="90" width="190" height="46" rx="5" fill="#fdf0f0" stroke="#9d0208" stroke-width="1.6"/>
  <text x="735" y="120" font-size="15" fill="#9d0208" text-anchor="middle" font-family="Consolas,monospace">1</text>

  <path d="M135 136 L135 162" stroke="#999" stroke-width="1.4" marker-end="url(#tip)"/>
  <path d="M335 136 L335 162" stroke="#999" stroke-width="1.4" marker-end="url(#tip)"/>
  <path d="M535 136 L535 162" stroke="#999" stroke-width="1.4" marker-end="url(#tip)"/>
  <path d="M735 136 L735 162" stroke="#999" stroke-width="1.4" marker-end="url(#tip)"/>

  <rect x="40" y="166" width="190" height="64" rx="5" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  <text x="135" y="191" font-size="13" fill="#333" text-anchor="middle">REFERENCES 를 적어 둔</text>
  <text x="135" y="211" font-size="13" fill="#333" text-anchor="middle">자식 표 이름</text>

  <rect x="240" y="166" width="190" height="64" rx="5" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  <text x="335" y="191" font-size="13" fill="#333" text-anchor="middle">깨진 행의 rowid</text>
  <text x="335" y="211" font-size="13" fill="#b45309" text-anchor="middle">WITHOUT ROWID 면 NULL</text>

  <rect x="440" y="166" width="190" height="64" rx="5" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  <text x="535" y="191" font-size="13" fill="#333" text-anchor="middle">참조되는 부모 표 이름</text>
  <text x="535" y="211" font-size="13" fill="#333" text-anchor="middle">(없는 값이 가리키던 곳)</text>

  <rect x="640" y="166" width="190" height="64" rx="5" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  <text x="735" y="191" font-size="13" fill="#333" text-anchor="middle">몇 번째 외래키인지</text>
  <text x="735" y="211" font-size="13" fill="#333" text-anchor="middle">foreign_key_list 의 id</text>

  <path d="M335 230 L335 264" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#tipg)"/>
  <path d="M735 230 L735 264" stroke="#2d6a4f" stroke-width="1.6" marker-end="url(#tipg)"/>

  <rect x="40" y="268" width="390" height="130" rx="5" fill="#eef6f1" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="60" y="294" font-size="13" font-weight="bold" fill="#2d6a4f">rowid 로 그 행을 꺼낸다</text>
  <text x="60" y="322" font-size="13" fill="#1b1b1b" font-family="Consolas,monospace">SELECT * FROM employee</text>
  <text x="60" y="344" font-size="13" fill="#1b1b1b" font-family="Consolas,monospace">WHERE rowid = 3;</text>
  <text x="60" y="376" font-size="13" fill="#555">어느 행을 고쳐야 하는지가 여기서 정해진다.</text>

  <rect x="450" y="268" width="390" height="130" rx="5" fill="#eef6f1" stroke="#2d6a4f" stroke-width="1.6"/>
  <text x="470" y="294" font-size="13" font-weight="bold" fill="#2d6a4f">fkid 로 어느 컬럼인지 찾는다</text>
  <text x="470" y="318" font-size="13" fill="#1b1b1b" font-family="Consolas,monospace">PRAGMA foreign_key_list(employee);</text>
  <text x="470" y="344" font-size="13" fill="#777" font-family="Consolas,monospace">id 0 | mentor_id -&gt; employee.emp_id</text>
  <text x="470" y="366" font-size="13" fill="#9d0208" font-family="Consolas,monospace">id 1 | team_id   -&gt; team.team_id</text>
  <text x="470" y="390" font-size="13" fill="#555">선언 순서와 id 순서는 같지 않다. 반드시 조회해 맞춘다.</text>

  <defs>
    <marker id="tip" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0 0 L7 3.2 L0 6.4 z" fill="#999"/>
    </marker>
    <marker id="tipg" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0 0 L7 3.2 L0 6.4 z" fill="#2d6a4f"/>
    </marker>
  </defs>
</svg>
