<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330"
     font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="880" height="330" fill="#f8f9fa"/>

  <text x="20" y="28" font-size="16" font-weight="bold" fill="#212529">뷰에 쓴 문장은 실행되지 않고 INSTEAD OF 트리거 본문으로 대체된다</text>
  <text x="20" y="50" font-size="13" fill="#495057">본문 예제의 INSERT INTO member_wallet VALUES (3, '다은', 100) 한 줄의 경로</text>

  <rect x="30" y="120" width="190" height="64" rx="6" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <text x="125" y="146" font-size="13" fill="#212529" text-anchor="middle">INSERT INTO</text>
  <text x="125" y="166" font-size="13" fill="#212529" text-anchor="middle">member_wallet (뷰)</text>

  <line x1="220" y1="152" x2="290" y2="152" stroke="#9d0208" stroke-width="1.5"/>
  <text x="255" y="140" font-size="13" fill="#9d0208" text-anchor="middle">실행 안 됨</text>

  <rect x="290" y="110" width="200" height="84" rx="6" fill="#fff3e0" stroke="#b45309" stroke-width="1.5"/>
  <text x="390" y="138" font-size="13" font-weight="bold" fill="#212529" text-anchor="middle">INSTEAD OF INSERT</text>
  <text x="390" y="158" font-size="13" fill="#212529" text-anchor="middle">트리거 본문</text>
  <text x="390" y="178" font-size="13" fill="#495057" text-anchor="middle">NEW.member_id, NEW.name …</text>

  <line x1="490" y1="130" x2="570" y2="82" stroke="#2d6a4f" stroke-width="1.5"/>
  <line x1="490" y1="152" x2="570" y2="152" stroke="#2d6a4f" stroke-width="1.5"/>
  <line x1="490" y1="174" x2="570" y2="222" stroke="#2d6a4f" stroke-width="1.5"/>

  <rect x="570" y="58" width="280" height="48" rx="6" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="710" y="87" font-size="13" fill="#212529" text-anchor="middle">① member 에 (3, 다은) 삽입</text>
  <rect x="570" y="128" width="280" height="48" rx="6" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="710" y="157" font-size="13" fill="#212529" text-anchor="middle">② wallet 에 (3, 100) 삽입</text>
  <rect x="570" y="198" width="280" height="48" rx="6" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="710" y="227" font-size="13" fill="#212529" text-anchor="middle">③ audit_log 에 'insert 3' 삽입</text>

  <text x="20" y="288" font-size="13" fill="#495057">뷰의 INSERT·UPDATE·DELETE 는 행마다 한 번씩 트리거를 부른다. 본문에 무엇을 쓰느냐는 작성자 몫이다.</text>
  <text x="20" y="310" font-size="13" fill="#495057">빨강은 뷰에 대한 원래 동작, 주황은 대체하는 트리거, 초록은 트리거 본문이 실제로 하는 일이다.</text>
</svg>
