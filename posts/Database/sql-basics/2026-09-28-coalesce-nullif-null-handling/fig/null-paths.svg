<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fbfbf8"/>

  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b">NULL이 어디에 들어가느냐에 따라 결과가 갈린다</text>
  <text x="30" y="56" font-size="13" fill="#555">SQLite 3.49.1에서 discount 가 NULL인 행(2번·4번 주문)이 겪는 일</text>

  <!-- 입력 -->
  <rect x="30" y="170" width="150" height="70" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="105" y="200" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">discount</text>
  <text x="105" y="222" font-size="14" fill="#1b1b1b" text-anchor="middle">= NULL</text>

  <!-- 세 갈래 -->
  <rect x="250" y="84" width="230" height="64" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="365" y="110" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">연산</text>
  <text x="365" y="132" font-size="13" fill="#333" text-anchor="middle">list_price - discount</text>

  <rect x="250" y="173" width="230" height="64" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="365" y="199" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">비교 (WHERE)</text>
  <text x="365" y="221" font-size="13" fill="#333" text-anchor="middle">discount &lt;&gt; 3000</text>

  <rect x="250" y="262" width="230" height="64" rx="6" fill="#ffffff" stroke="#3b3b3b" stroke-width="1.5"/>
  <text x="365" y="288" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">집계</text>
  <text x="365" y="310" font-size="13" fill="#333" text-anchor="middle">AVG(discount)</text>

  <!-- 결과 -->
  <rect x="560" y="84" width="290" height="64" rx="6" fill="#fbeaea" stroke="#9d0208" stroke-width="1.5"/>
  <text x="705" y="110" font-size="13" font-weight="bold" fill="#9d0208" text-anchor="middle">결과가 NULL</text>
  <text x="705" y="132" font-size="13" fill="#333" text-anchor="middle">결제액 칸이 비어 버린다</text>

  <rect x="560" y="173" width="290" height="64" rx="6" fill="#fbeaea" stroke="#9d0208" stroke-width="1.5"/>
  <text x="705" y="199" font-size="13" font-weight="bold" fill="#9d0208" text-anchor="middle">조건이 NULL → 행이 빠진다</text>
  <text x="705" y="221" font-size="13" fill="#333" text-anchor="middle">참이 아니므로 WHERE를 통과 못 한다</text>

  <rect x="560" y="262" width="290" height="64" rx="6" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="705" y="288" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">그 행을 건너뛰고 계산</text>
  <text x="705" y="310" font-size="13" fill="#333" text-anchor="middle">5행이 아니라 3행의 평균이 된다</text>

  <line x1="180" y1="195" x2="246" y2="120" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="180" y1="205" x2="246" y2="205" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="180" y1="215" x2="246" y2="290" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="480" y1="116" x2="556" y2="116" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="480" y1="205" x2="556" y2="205" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="480" y1="294" x2="556" y2="294" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 고치는 두 함수 -->
  <line x1="30" y1="354" x2="850" y2="354" stroke="#d0d0c8" stroke-width="1"/>
  <text x="30" y="382" font-size="14" font-weight="bold" fill="#2d6a4f">고치는 쪽 — 값을 먼저 바꿔 넣는다</text>

  <rect x="30" y="396" width="400" height="56" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="230" y="419" font-size="13" font-weight="bold" fill="#2d6a4f" text-anchor="middle">COALESCE(a, b, …)</text>
  <text x="230" y="440" font-size="13" fill="#333" text-anchor="middle">NULL → 첫 번째 NULL 아닌 값 (예: 0)</text>

  <rect x="450" y="396" width="400" height="56" rx="6" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="650" y="419" font-size="13" font-weight="bold" fill="#2d6a4f" text-anchor="middle">NULLIF(x, y)</text>
  <text x="650" y="440" font-size="13" fill="#333" text-anchor="middle">x = y 이면 NULL (예: '' → NULL, 0 → NULL)</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a84"/>
    </marker>
  </defs>
</svg>
