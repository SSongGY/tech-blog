<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <rect x="0" y="0" width="880" height="350" fill="#ffffff"/>
  <text x="440" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">폭 5 구간 — 정수 나눗셈과 내림이 음수를 다른 칸에 넣는다</text>

  <!-- 위: 정수 나눗셈 (0 쪽으로 자름) -->
  <text x="55" y="68" font-size="14" font-weight="bold" fill="#9d0208">temp / 5 * 5 — 0 쪽으로 자른다</text>
  <rect x="55" y="80" width="30" height="44" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="70" y="107" font-size="13" text-anchor="middle" fill="#1f2937">-15</text>
  <rect x="85" y="80" width="150" height="44" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="160" y="107" font-size="13" text-anchor="middle" fill="#1f2937">-10 칸 (-14 ~ -10)</text>
  <rect x="235" y="80" width="150" height="44" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="310" y="107" font-size="13" text-anchor="middle" fill="#1f2937">-5 칸 (-9 ~ -5)</text>
  <rect x="385" y="80" width="270" height="44" fill="#fde8e8" stroke="#9d0208" stroke-width="2"/>
  <text x="520" y="107" font-size="13" font-weight="bold" text-anchor="middle" fill="#9d0208">0 칸 (-4 ~ 4) · 정수 9개 너비</text>
  <rect x="655" y="80" width="150" height="44" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="730" y="107" font-size="13" text-anchor="middle" fill="#1f2937">5 칸 (5 ~ 9)</text>
  <rect x="805" y="80" width="30" height="44" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="820" y="107" font-size="13" text-anchor="middle" fill="#1f2937">10</text>

  <!-- 수직선 -->
  <line x1="55" y1="165" x2="835" y2="165" stroke="#1f2937" stroke-width="1.5"/>
  <g stroke="#1f2937" stroke-width="1">
    <line x1="70" y1="158" x2="70" y2="172"/>
    <line x1="220" y1="158" x2="220" y2="172"/>
    <line x1="370" y1="158" x2="370" y2="172"/>
    <line x1="520" y1="158" x2="520" y2="172"/>
    <line x1="670" y1="158" x2="670" y2="172"/>
    <line x1="820" y1="158" x2="820" y2="172"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#1f2937">
    <text x="70" y="190">-15</text>
    <text x="220" y="190">-10</text>
    <text x="370" y="190">-5</text>
    <text x="520" y="190">0</text>
    <text x="670" y="190">5</text>
    <text x="820" y="190">10</text>
  </g>
  <!-- 실습 데이터의 정수 기온: -12 -7 -5 -3 -1 0 2 4 5 9 -->
  <g fill="#1f2937">
    <circle cx="160" cy="165" r="5"/>
    <circle cx="310" cy="165" r="5"/>
    <circle cx="370" cy="165" r="5"/>
    <circle cx="430" cy="165" r="5"/>
    <circle cx="490" cy="165" r="5"/>
    <circle cx="520" cy="165" r="5"/>
    <circle cx="580" cy="165" r="5"/>
    <circle cx="640" cy="165" r="5"/>
    <circle cx="670" cy="165" r="5"/>
    <circle cx="790" cy="165" r="5"/>
  </g>

  <!-- 아래: 내림 -->
  <text x="55" y="224" font-size="14" font-weight="bold" fill="#2d6a4f">floor(temp / 5.0) * 5 — 작은 쪽으로 내린다</text>
  <rect x="55" y="236" width="150" height="44" fill="#e6f4ea" stroke="#9ca3af"/>
  <text x="130" y="263" font-size="13" text-anchor="middle" fill="#1f2937">-15 칸 (-15 ~ -11)</text>
  <rect x="205" y="236" width="150" height="44" fill="#e6f4ea" stroke="#9ca3af"/>
  <text x="280" y="263" font-size="13" text-anchor="middle" fill="#1f2937">-10 칸 (-10 ~ -6)</text>
  <rect x="355" y="236" width="150" height="44" fill="#e6f4ea" stroke="#9ca3af"/>
  <text x="430" y="263" font-size="13" text-anchor="middle" fill="#1f2937">-5 칸 (-5 ~ -1)</text>
  <rect x="505" y="236" width="150" height="44" fill="#e6f4ea" stroke="#9ca3af"/>
  <text x="580" y="263" font-size="13" text-anchor="middle" fill="#1f2937">0 칸 (0 ~ 4)</text>
  <rect x="655" y="236" width="150" height="44" fill="#e6f4ea" stroke="#9ca3af"/>
  <text x="730" y="263" font-size="13" text-anchor="middle" fill="#1f2937">5 칸 (5 ~ 9)</text>
  <rect x="805" y="236" width="30" height="44" fill="#e6f4ea" stroke="#9ca3af"/>
  <text x="820" y="263" font-size="13" text-anchor="middle" fill="#1f2937">10</text>

  <text x="440" y="318" font-size="13" text-anchor="middle" fill="#4b5563">● 실습 데이터의 정수 기온 10개(-12 ~ 9). 양수 쪽은 같고, 음수 쪽은 위 칸 경계가 1씩 오른쪽에 있다</text>
</svg>
