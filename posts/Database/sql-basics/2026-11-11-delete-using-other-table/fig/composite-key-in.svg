<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="420" fill="#ffffff"/>
  <text x="440" y="30" font-size="17" text-anchor="middle" font-weight="bold" fill="#222">복합 키를 컬럼마다 따로 IN 하면 짝이 풀린다</text>

  <!-- removed_pair -->
  <text x="110" y="72" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">removed_pair</text>
  <rect x="40" y="84" width="140" height="34" fill="#f1f5f9" stroke="#475569"/>
  <text x="110" y="106" font-size="14" text-anchor="middle" fill="#222">(1, 30)</text>
  <rect x="40" y="124" width="140" height="34" fill="#f1f5f9" stroke="#475569"/>
  <text x="110" y="146" font-size="14" text-anchor="middle" fill="#222">(2, 10)</text>

  <!-- upper path: column-wise IN -->
  <line x1="190" y1="110" x2="236" y2="110" stroke="#9d0208" stroke-width="2"/>
  <polygon points="236,103 250,110 236,117" fill="#9d0208"/>
  <rect x="256" y="62" width="260" height="96" fill="#fef2f2" stroke="#9d0208"/>
  <text x="386" y="86" font-size="14" text-anchor="middle" font-weight="bold" fill="#9d0208">컬럼마다 IN</text>
  <text x="272" y="112" font-size="14" fill="#222">member_id  ∈ {1, 2}</text>
  <text x="272" y="138" font-size="14" fill="#222">product_id ∈ {30, 10}</text>
  <line x1="526" y1="110" x2="572" y2="110" stroke="#9d0208" stroke-width="2"/>
  <polygon points="572,103 586,110 572,117" fill="#9d0208"/>
  <rect x="592" y="62" width="250" height="96" fill="#fef2f2" stroke="#9d0208"/>
  <text x="717" y="86" font-size="14" text-anchor="middle" font-weight="bold" fill="#9d0208">2 × 2 = 4 조합이 걸린다</text>
  <text x="610" y="112" font-size="14" fill="#222">(1,10) (1,30)</text>
  <text x="610" y="138" font-size="14" fill="#222">(2,10) (2,30)</text>

  <!-- lower path: row value IN / EXISTS -->
  <line x1="110" y1="168" x2="110" y2="250" stroke="#2d6a4f" stroke-width="2"/>
  <line x1="110" y1="250" x2="236" y2="250" stroke="#2d6a4f" stroke-width="2"/>
  <polygon points="236,243 250,250 236,257" fill="#2d6a4f"/>
  <rect x="256" y="202" width="260" height="96" fill="#ecfdf5" stroke="#2d6a4f"/>
  <text x="386" y="226" font-size="14" text-anchor="middle" font-weight="bold" fill="#2d6a4f">행 값 IN 또는 EXISTS</text>
  <text x="272" y="252" font-size="14" fill="#222">(member_id, product_id)</text>
  <text x="272" y="278" font-size="14" fill="#222">를 한 덩어리로 비교</text>
  <line x1="526" y1="250" x2="572" y2="250" stroke="#2d6a4f" stroke-width="2"/>
  <polygon points="572,243 586,250 572,257" fill="#2d6a4f"/>
  <rect x="592" y="202" width="250" height="96" fill="#ecfdf5" stroke="#2d6a4f"/>
  <text x="717" y="226" font-size="14" text-anchor="middle" font-weight="bold" fill="#2d6a4f">적힌 짝 2개만 걸린다</text>
  <text x="610" y="252" font-size="14" fill="#222">(1,30)</text>
  <text x="610" y="278" font-size="14" fill="#222">(2,10)</text>

  <!-- footer -->
  <rect x="40" y="330" width="802" height="62" fill="#fff7ed" stroke="#b45309"/>
  <text x="60" y="356" font-size="14" fill="#222">cart_item 6행 중 컬럼마다 IN 은 4행을 지웠고, 행 값 IN·EXISTS 는 2행을 지웠다.</text>
  <text x="60" y="380" font-size="14" fill="#222">더 지워진 (1,10)·(2,30) 은 회원이 빼지 않은 상품이다.</text>
</svg>
