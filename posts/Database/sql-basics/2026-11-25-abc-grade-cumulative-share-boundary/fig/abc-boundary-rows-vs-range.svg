<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="430" fill="#ffffff"/>
  <text x="440" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">누적 매출 비율과 등급 경계 — 정렬: sales DESC, product_id</text>

  <!-- 80%·95% 선 이름 -->
  <text x="676" y="58" font-size="13" text-anchor="middle" fill="#9d0208">A 경계 80%</text>
  <text x="790" y="58" font-size="13" text-anchor="start" fill="#b45309">B 경계 95%</text>

  <!-- 누적 막대: 1,000 단위를 720px 로 (0.72px/단위), 시작 x=100 -->
  <rect x="100" y="70" width="288" height="44" fill="#2d6a4f" stroke="#ffffff"/>
  <rect x="388" y="70" width="144" height="44" fill="#2d6a4f" stroke="#ffffff"/>
  <rect x="532" y="70" width="108" height="44" fill="#2d6a4f" stroke="#ffffff"/>
  <rect x="640" y="70" width="57.6" height="44" fill="#2d6a4f" stroke="#ffffff"/>
  <rect x="697.6" y="70" width="57.6" height="44" fill="#b45309" stroke="#ffffff"/>
  <rect x="755.2" y="70" width="28.8" height="44" fill="#b45309" stroke="#ffffff"/>
  <rect x="784" y="70" width="36" height="44" fill="#8a8a8a" stroke="#ffffff"/>
  <text x="244" y="97" font-size="14" text-anchor="middle" fill="#ffffff">P01 400</text>
  <text x="460" y="97" font-size="14" text-anchor="middle" fill="#ffffff">P02 200</text>
  <text x="586" y="97" font-size="14" text-anchor="middle" fill="#ffffff">P03 150</text>
  <text x="668.8" y="97" font-size="13" text-anchor="middle" fill="#ffffff">P04</text>
  <text x="726.4" y="97" font-size="13" text-anchor="middle" fill="#ffffff">P05</text>

  <!-- 경계선 -->
  <line x1="676" y1="62" x2="676" y2="122" stroke="#9d0208" stroke-width="2.5" stroke-dasharray="5,3"/>
  <line x1="784" y1="62" x2="784" y2="122" stroke="#b45309" stroke-width="2.5" stroke-dasharray="5,3"/>

  <!-- 누적 비율 눈금 -->
  <text x="100" y="138" font-size="13" text-anchor="middle" fill="#444">0%</text>
  <text x="388" y="138" font-size="13" text-anchor="middle" fill="#444">40%</text>
  <text x="532" y="138" font-size="13" text-anchor="middle" fill="#444">60%</text>
  <text x="640" y="138" font-size="13" text-anchor="middle" fill="#444">75%</text>
  <text x="697.6" y="138" font-size="13" text-anchor="middle" fill="#444">83%</text>
  <text x="752" y="138" font-size="13" text-anchor="middle" fill="#444">91%</text>
  <text x="820" y="138" font-size="13" text-anchor="middle" fill="#444">100%</text>
  <text x="770" y="156" font-size="13" text-anchor="middle" fill="#444">P06</text>
  <text x="820" y="156" font-size="13" text-anchor="middle" fill="#444">P07~P10</text>

  <!-- 등급 구간 -->
  <line x1="100" y1="172" x2="697.6" y2="172" stroke="#2d6a4f" stroke-width="3"/>
  <line x1="697.6" y1="182" x2="784" y2="182" stroke="#b45309" stroke-width="3"/>
  <text x="399" y="194" font-size="14" text-anchor="middle" fill="#2d6a4f">A — 4개, 매출의 83%</text>
  <text x="740" y="202" font-size="14" text-anchor="middle" fill="#b45309">B — 2개</text>
  <text x="440" y="232" font-size="13" text-anchor="middle" fill="#333">P04 는 75% 에서 시작해 80% 선을 넘는다 — '누적 전 &lt; 80%' 면 A, '누적 ≤ 80%' 면 B</text>

  <!-- 아래: 동점 P04·P05 의 누적값 -->
  <line x1="40" y1="252" x2="840" y2="252" stroke="#dddddd"/>
  <text x="440" y="276" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">매출이 같은 P04·P05 (각 80) 의 누적값</text>

  <text x="60" y="320" font-size="14" fill="#222">ROWS</text>
  <rect x="230" y="296" width="170" height="40" rx="5" fill="#e8f3ee" stroke="#2d6a4f"/>
  <text x="315" y="321" font-size="14" text-anchor="middle" fill="#222">P04 → 830 (83%)</text>
  <rect x="420" y="296" width="170" height="40" rx="5" fill="#e8f3ee" stroke="#2d6a4f"/>
  <text x="505" y="321" font-size="14" text-anchor="middle" fill="#222">P05 → 910 (91%)</text>
  <text x="610" y="321" font-size="13" fill="#2d6a4f">한 행씩 더한다</text>

  <text x="60" y="380" font-size="14" fill="#222">RANGE (기본 프레임)</text>
  <rect x="230" y="356" width="170" height="40" rx="5" fill="#fbeaea" stroke="#9d0208"/>
  <text x="315" y="381" font-size="14" text-anchor="middle" fill="#222">P04 → 910 (91%)</text>
  <rect x="420" y="356" width="170" height="40" rx="5" fill="#fbeaea" stroke="#9d0208"/>
  <text x="505" y="381" font-size="14" text-anchor="middle" fill="#222">P05 → 910 (91%)</text>
  <text x="610" y="373" font-size="13" fill="#9d0208">동점(peer)을 한꺼번에 더한다</text>
  <text x="610" y="391" font-size="13" fill="#9d0208">→ 둘 다 A 에서 밀려난다</text>
  <text x="440" y="418" font-size="13" text-anchor="middle" fill="#555">GROUPS 프레임도 동점을 한 묶음으로 보아 RANGE 와 같은 값을 냈다 (SQLite 3.49.1)</text>
</svg>
