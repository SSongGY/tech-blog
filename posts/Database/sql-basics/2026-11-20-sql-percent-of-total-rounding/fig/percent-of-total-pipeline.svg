<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14">
  <rect x="0" y="0" width="880" height="400" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">SUM(SUM(amount)) OVER () 가 분모를 얻는 순서</text>

  <!-- 1. FROM / WHERE -->
  <rect x="30" y="70" width="180" height="120" rx="8" fill="#f3f4f6" stroke="#4b5563"/>
  <text x="120" y="96" text-anchor="middle" font-weight="bold" fill="#111827">① FROM · WHERE</text>
  <text x="120" y="122" text-anchor="middle" fill="#374151">sale 10행</text>
  <text x="120" y="146" text-anchor="middle" fill="#374151">WHERE 가 있으면</text>
  <text x="120" y="168" text-anchor="middle" fill="#374151">여기서 행이 줄어든다</text>

  <!-- 2. GROUP BY -->
  <rect x="250" y="70" width="180" height="120" rx="8" fill="#f3f4f6" stroke="#4b5563"/>
  <text x="340" y="96" text-anchor="middle" font-weight="bold" fill="#111827">② GROUP BY</text>
  <text x="340" y="122" text-anchor="middle" fill="#374151">category 5묶음</text>
  <text x="340" y="146" text-anchor="middle" fill="#374151">SUM(amount)</text>
  <text x="340" y="168" text-anchor="middle" fill="#374151">2000 · 3000 · 5200 · 500 · 1300</text>

  <!-- 3. window -->
  <rect x="470" y="70" width="180" height="120" rx="8" fill="#e8f3ee" stroke="#2d6a4f" stroke-width="2"/>
  <text x="560" y="96" text-anchor="middle" font-weight="bold" fill="#2d6a4f">③ 창 함수</text>
  <text x="560" y="122" text-anchor="middle" fill="#374151">OVER () = 묶음 전체가</text>
  <text x="560" y="146" text-anchor="middle" fill="#374151">파티션 하나</text>
  <text x="560" y="168" text-anchor="middle" fill="#2d6a4f" font-weight="bold">분모 12000 을 행마다</text>

  <!-- 4. ORDER BY -->
  <rect x="690" y="70" width="160" height="120" rx="8" fill="#f3f4f6" stroke="#4b5563"/>
  <text x="770" y="96" text-anchor="middle" font-weight="bold" fill="#111827">④ ORDER BY</text>
  <text x="770" y="122" text-anchor="middle" fill="#374151">5행</text>
  <text x="770" y="146" text-anchor="middle" fill="#374151">각 행 = 몫 ÷ 12000</text>
  <text x="770" y="168" text-anchor="middle" fill="#374151">× 100.0</text>

  <line x1="210" y1="130" x2="246" y2="130" stroke="#4b5563" stroke-width="2"/>
  <polygon points="246,124 256,130 246,136" fill="#4b5563"/>
  <line x1="430" y1="130" x2="466" y2="130" stroke="#4b5563" stroke-width="2"/>
  <polygon points="466,124 476,130 466,136" fill="#4b5563"/>
  <line x1="650" y1="130" x2="686" y2="130" stroke="#4b5563" stroke-width="2"/>
  <polygon points="686,124 696,130 686,136" fill="#4b5563"/>

  <!-- pitfall box -->
  <rect x="30" y="230" width="400" height="140" rx="8" fill="#fdf0f0" stroke="#9d0208" stroke-width="2"/>
  <text x="230" y="258" text-anchor="middle" font-weight="bold" fill="#9d0208">WHERE category IN ('book','toy')</text>
  <text x="230" y="286" text-anchor="middle" fill="#374151">①에서 두 묶음만 남는다</text>
  <text x="230" y="310" text-anchor="middle" fill="#374151">③의 분모가 2000 + 1300 = 3300</text>
  <text x="230" y="334" text-anchor="middle" fill="#9d0208">book 60.61 · toy 39.39</text>
  <text x="230" y="356" text-anchor="middle" fill="#374151">(전체 대비가 아니라 둘 사이 비율)</text>

  <rect x="470" y="230" width="380" height="140" rx="8" fill="#e8f3ee" stroke="#2d6a4f" stroke-width="2"/>
  <text x="660" y="258" text-anchor="middle" font-weight="bold" fill="#2d6a4f">바깥 질의에서 거르기</text>
  <text x="660" y="286" text-anchor="middle" fill="#374151">①~③을 다 돈 결과에서</text>
  <text x="660" y="310" text-anchor="middle" fill="#374151">두 행만 고른다 — 분모는 12000</text>
  <text x="660" y="334" text-anchor="middle" fill="#2d6a4f">book 16.67 · toy 10.83</text>
  <text x="660" y="356" text-anchor="middle" fill="#374151">(전체 대비 비율 그대로)</text>

  <line x1="120" y1="190" x2="120" y2="226" stroke="#9d0208" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="770" y1="190" x2="770" y2="226" stroke="#2d6a4f" stroke-width="2" stroke-dasharray="5,4"/>
</svg>
