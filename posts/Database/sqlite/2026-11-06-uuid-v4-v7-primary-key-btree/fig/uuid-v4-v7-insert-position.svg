<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="880" height="450" fill="#ffffff"/>

  <text x="24" y="32" font-size="16" font-weight="bold" fill="#222222">128비트 배치 (왼쪽이 상위 비트, 정렬은 상위 비트부터 비교된다)</text>

  <text x="24" y="70" font-size="14" font-weight="bold" fill="#9d0208">v4</text>
  <rect x="64" y="50" width="330" height="32" fill="#fff5f5" stroke="#9d0208"/>
  <text x="229" y="71" font-size="13" text-anchor="middle" fill="#222222">random_a 48</text>
  <rect x="394" y="50" width="44" height="32" fill="#f3f3f3" stroke="#555555"/>
  <text x="416" y="71" font-size="13" text-anchor="middle" fill="#222222">ver</text>
  <rect x="438" y="50" width="96" height="32" fill="#fff5f5" stroke="#9d0208"/>
  <text x="486" y="71" font-size="13" text-anchor="middle" fill="#222222">random_b 12</text>
  <rect x="534" y="50" width="44" height="32" fill="#f3f3f3" stroke="#555555"/>
  <text x="556" y="71" font-size="13" text-anchor="middle" fill="#222222">var</text>
  <rect x="578" y="50" width="278" height="32" fill="#fff5f5" stroke="#9d0208"/>
  <text x="717" y="71" font-size="13" text-anchor="middle" fill="#222222">random_c 62</text>

  <text x="24" y="118" font-size="14" font-weight="bold" fill="#2d6a4f">v7</text>
  <rect x="64" y="98" width="330" height="32" fill="#f0f7f3" stroke="#2d6a4f"/>
  <text x="229" y="119" font-size="13" text-anchor="middle" fill="#222222">unix_ts_ms 48 (밀리초 시각)</text>
  <rect x="394" y="98" width="44" height="32" fill="#f3f3f3" stroke="#555555"/>
  <text x="416" y="119" font-size="13" text-anchor="middle" fill="#222222">ver</text>
  <rect x="438" y="98" width="96" height="32" fill="#fff5f5" stroke="#9d0208"/>
  <text x="486" y="119" font-size="13" text-anchor="middle" fill="#222222">rand_a 12</text>
  <rect x="534" y="98" width="44" height="32" fill="#f3f3f3" stroke="#555555"/>
  <text x="556" y="119" font-size="13" text-anchor="middle" fill="#222222">var</text>
  <rect x="578" y="98" width="278" height="32" fill="#fff5f5" stroke="#9d0208"/>
  <text x="717" y="119" font-size="13" text-anchor="middle" fill="#222222">rand_b 62</text>

  <text x="24" y="180" font-size="16" font-weight="bold" fill="#222222">키 순서로 정렬된 B-Tree 리프에서 한 커밋의 새 키가 들어가는 자리</text>

  <text x="24" y="226" font-size="14" font-weight="bold" fill="#9d0208">v4</text>
  <rect x="64" y="204" width="110" height="36" fill="#fff5f5" stroke="#9d0208"/>
  <rect x="190" y="204" width="110" height="36" fill="#fff5f5" stroke="#9d0208"/>
  <rect x="316" y="204" width="110" height="36" fill="#fff5f5" stroke="#9d0208"/>
  <rect x="442" y="204" width="110" height="36" fill="#fff5f5" stroke="#9d0208"/>
  <rect x="568" y="204" width="110" height="36" fill="#fff5f5" stroke="#9d0208"/>
  <rect x="694" y="204" width="110" height="36" fill="#fff5f5" stroke="#9d0208"/>
  <text x="119" y="227" font-size="13" text-anchor="middle" fill="#9d0208">● ●</text>
  <text x="245" y="227" font-size="13" text-anchor="middle" fill="#9d0208">●</text>
  <text x="371" y="227" font-size="13" text-anchor="middle" fill="#9d0208">● ●</text>
  <text x="497" y="227" font-size="13" text-anchor="middle" fill="#9d0208">●</text>
  <text x="623" y="227" font-size="13" text-anchor="middle" fill="#9d0208">● ●</text>
  <text x="749" y="227" font-size="13" text-anchor="middle" fill="#9d0208">●</text>
  <text x="64" y="264" font-size="13" fill="#555555">새 키가 리프 전체에 흩어진다 → 커밋마다 고친 페이지가 많다</text>

  <text x="24" y="316" font-size="14" font-weight="bold" fill="#2d6a4f">v7</text>
  <rect x="64" y="294" width="110" height="36" fill="#f3f3f3" stroke="#999999"/>
  <rect x="190" y="294" width="110" height="36" fill="#f3f3f3" stroke="#999999"/>
  <rect x="316" y="294" width="110" height="36" fill="#f3f3f3" stroke="#999999"/>
  <rect x="442" y="294" width="110" height="36" fill="#f3f3f3" stroke="#999999"/>
  <rect x="568" y="294" width="110" height="36" fill="#f3f3f3" stroke="#999999"/>
  <rect x="694" y="294" width="110" height="36" fill="#f0f7f3" stroke="#2d6a4f"/>
  <text x="749" y="317" font-size="13" text-anchor="middle" fill="#2d6a4f">● ● ● ● ●</text>
  <text x="64" y="354" font-size="13" fill="#555555">시각이 상위 비트라 새 키는 오른쪽 끝에 몰린다 → 고친 페이지가 적다</text>

  <rect x="64" y="384" width="740" height="44" rx="6" fill="#fffaf0" stroke="#b45309"/>
  <text x="434" y="411" font-size="13" text-anchor="middle" fill="#b45309">점은 이번 커밋의 새 키. WAL 모드에서는 고친 페이지가 커밋마다 페이지 단위로 WAL 에 쓰인다</text>
</svg>
